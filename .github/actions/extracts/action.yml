name: OSM extracts of the day
description: >-
  Each extract downloaded once a day and shared as an artifact; a job waits
  while another downloads it (docs/extract-cache.md). The job needs
  `actions: read`.

inputs:
  urls:
    description: "One extract a line; more URLs on a line are its other names on osm.fr"
    required: true
  dir:
    description: "Where the extracts land, under their file names"
    required: false
    default: extracts

runs:
  using: composite
  steps:
    - name: Artifact client
      shell: bash
      run: |
        set -euo pipefail
        npm install --silent --no-save --prefix "$RUNNER_TEMP/extracts" @actions/artifact@6.3.1

    - name: Take or download the extracts
      uses: actions/github-script@v9
      env:
        URLS: ${{ inputs.urls }}
        DIR: ${{ inputs.dir }}
        TOKEN: ${{ github.token }}
      with:
        script: |
          const lib = `${process.env.RUNNER_TEMP}/extracts/node_modules/@actions/artifact/lib/artifact.js`;
          const { DefaultArtifactClient } = await import(lib);
          const { default: run } = await import(`${process.env.GITHUB_WORKSPACE}/workers/lib/extracts.mjs`);
          await run({ github, context, core, client: new DefaultArtifactClient(),
            token: process.env.TOKEN, urls: process.env.URLS, dir: process.env.DIR });
