name: Map · water

# WATER from OSM into its own `.pmtiles`: rivers, streams, canals, lakes,
# reservoirs, bays and the coastline – each feature with its name. OpenMapTiles
# spreads water over three layers with the name apart from the geometry (see
# the `workers/water/water.yml` header). It's the `water` package.
#
# The same pattern as trails and the transport network: the same PBF read a
# second time with its own schema. A file of its own because
# `build-map-region.yml` is near the 128 KiB cap.
on:
  workflow_call:
    inputs:
      region_key:
        description: "Region key – it names `{region}-water.pmtiles`"
        required: true
        type: string
      region_bbox:
        description: "Region bbox for clipping tiles (workers/lib/region-clip.sh)"
        required: true
        type: string
      maxzoom:
        description: "Highest zoom of the water tiles"
        required: false
        default: "14"
        type: string
      region_clip:
        description: "Clip tiles to the region border"
        required: false
        default: "false"
        type: string
      size_limit_mb:
        description: "The whole page budget in MB"
        required: false
        default: "900"
        type: string
      budget_pct:
        description: "The water's share of the page budget in percent"
        required: false
        default: "5"
        type: string
      day:
        description: "Date for the Planetiler cache key"
        required: false
        default: ""
        type: string
    outputs:
      enabled:
        description: "Was the layer made? (a cutout may hold no waterway)"
        value: ${{ jobs.water.outputs.enabled }}
      maxzoom:
        description: "The zoom tiles really go up to"
        value: ${{ jobs.water.outputs.maxzoom }}
      size_mb:
        description: "Layer size in MB"
        value: ${{ jobs.water.outputs.size_mb }}
    # `workflow_call` doesn't inherit secrets; without them the Drive cache can't
    # open and Planetiler (93 MB) is downloaded on every run.
    secrets:
      GDRIVE_CREDENTIALS:
        required: false
      DRIVE_SECRET:
        required: false
      DRIVE_REFRESH:
        required: false

# Drive sign-in for the whole workflow, not per step: cache-restore and
# cache-save are two steps, and with the token on only one of them the other
# would quietly go back to downloading everything. Guarded by “Check · workflow lint”.
env:
  GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
  DRIVE_CLIENT: ${{ vars.DRIVE_CLIENT }}
  DRIVE_SECRET: ${{ secrets.DRIVE_SECRET }}
  DRIVE_REFRESH: ${{ secrets.DRIVE_REFRESH }}

jobs:
  water:
    name: Water
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.water.outputs.enabled }}
      maxzoom: ${{ steps.water.outputs.maxzoom }}
      size_mb: ${{ steps.water.outputs.size_mb }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Prepare the timing folder
        run: mkdir -p steps-out

      - name: Download the PBF from the plan
        uses: actions/download-artifact@v8
        with:
          name: pbf
          path: data

      # the region polygon is Planetiler's `--polygon`; `continue-on-error`, since
      # the run finishes without it too (tiles then follow the bbox)
      - name: Download the region polygon
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: region-poly
          path: data

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Planetileru (restore)
        id: planetiler-cache
        uses: ./.github/actions/cache-restore
        with:
          path: planetiler.jar
          key: planetiler-latest-${{ inputs.day }}

      - name: Stiahni Planetiler
        run: workers/lib/planetiler.sh
      - name: Cache Planetileru (save)
        if: ${{ always() && steps.planetiler-cache.outputs.cache-hit != 'true' && hashFiles('planetiler.jar') != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: planetiler.jar
          key: ${{ steps.planetiler-cache.outputs.cache-primary-key }}

      # schema tests before the build (`examples`) – the one thing that tells the
      # truth about a schema without a whole run. They go first.
      - name: Water schema tests
        run: java -jar planetiler.jar verify workers/water/water.yml

      # described in `workers/water/build.sh`
      - name: Water from OSM → PMTiles
        id: water
        env:
          OPT_WATER_MAXZOOM: ${{ inputs.maxzoom }}
          OPT_REGION_CLIP: ${{ inputs.region_clip }}
          REGION_BBOX: ${{ inputs.region_bbox }}
          REGION_KEY: ${{ inputs.region_key }}
          SIZE_LIMIT_MB: ${{ inputs.size_limit_mb }}
          BUDGET_WATER_PCT: ${{ inputs.budget_pct }}
        run: workers/water/build.sh

      - name: Upload the site part
        if: ${{ always() && hashFiles('_site/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: site-water
          path: _site
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore

      - name: Upload the step timing
        if: ${{ always() && hashFiles('steps-out/*') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: steps-water
          path: steps-out
          retention-days: 1
          if-no-files-found: ignore
