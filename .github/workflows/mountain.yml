name: Map · Build mountain package
run-name: "${{ github.workflow }} · ${{ inputs.mountain }}"

# ONE MOUNTAIN RANGE IN DETAIL – 5 m contours, rocks and a height model
# from DMR 5.0 at 1 m (Sonny's 20 m beyond the Slovak border), roads, paths,
# water and points of interest from OSM, and aerial photos of summer and winter,
# over the range alone (`workers/data/mountains.json`) – across borders where it
# runs on. No waymarked trails: the range's Paths draw them.
#
# The same DEM layers the map build makes (`dem-layers.yml`), on the range's
# cut-out and with the cut-out's model for the height tiles too; roads and
# paths from `transport.yml`, water from `water.yml`, points from the features
# job; photos from `workers/data/aerial.json`. Published
# under `mountains.ranges` in `maps.json`, a category of its own beside the
# countries; the app draws a range alone or over the regions it crosses.

on:
  workflow_dispatch:
    inputs:
      mountain:
        description: "Which range (workers/data/mountains.json)"
        required: true
        default: vysoke_tatry
        type: choice
        options:
          - vysoke_tatry
          - belianske_tatry
          - zapadne_tatry
          - nizke_tatry
          - mala_fatra
          - velka_fatra
          - slovensky_raj
          - pieniny
      rock_slope:
        description: "From which slope (°) terrain is rock (50 = faces, 40 = steep slopes too)"
        required: false
        default: "50"
        type: string
      rebuild:
        description: "Compute a layer anew even when it is cached"
        required: false
        default: nothing
        type: choice
        options:
          - nothing
          - contours
          - rocks
          - terrain
          - everything
      test:
        description: "Quick test: only 4 km² in the middle of the range"
        required: false
        default: false
        type: boolean
      aerial_maxzoom:
        description: "Deepest zoom of the aerial photos (empty = workers/data/aerial.json; z18 is ~4× z17)"
        required: false
        default: ""
        type: string
      # on top of MOUNTAIN_OPTIONS below, a later key wins
      options:
        description: "Rarely changed settings as key=value (see workers/plan/options.py)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  # the day's OSM extracts other runs uploaded
  actions: read

env:
  GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
  DRIVE_CLIENT: ${{ vars.DRIVE_CLIENT }}
  DRIVE_SECRET: ${{ secrets.DRIVE_SECRET }}
  DRIVE_REFRESH: ${{ secrets.DRIVE_REFRESH }}
  # what makes a mountain package finer than its region's layers
  MOUNTAIN_OPTIONS: >-
    contour_interval=5 contour_maxzoom=16 contour_maxzoom_cap=16
    contour_lowland_m=0 terrain_maxzoom=17 size_limit_mb=2000
  # shares of `size_limit_mb`; no Pages here, so the height model gets the most
  BUDGET_CONTOURS_PCT: "25"
  BUDGET_ROCKS_PCT: "15"
  # z17 (0.8 m pixel) shows the 1 m LiDAR the rocks come from; it is 4× z16
  BUDGET_TERRAIN_PCT: "55"
  # `workers/features/build.sh` reads it, as the region build gives it
  BUDGET_FEATURES_PCT: "4"

jobs:
  plan:
    name: Preparation (range, settings)
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.mountain.outputs.key }}
      country: ${{ steps.mountain.outputs.country }}
      name: ${{ steps.mountain.outputs.name }}
      area: ${{ steps.mountain.outputs.area }}
      area_key: ${{ steps.mountain.outputs.area_key }}
      bbox: ${{ steps.mountain.outputs.bbox }}
      bboxkey: ${{ steps.mountain.outputs.bboxkey }}
      shapekey: ${{ steps.mountain.outputs.shapekey }}
      km2: ${{ steps.mountain.outputs.km2 }}
      osm: ${{ steps.mountain.outputs.osm }}
      countries: ${{ steps.mountain.outputs.countries }}
      day: ${{ steps.day.outputs.d }}
      budget_contours_pct: ${{ env.BUDGET_CONTOURS_PCT }}
      budget_rocks_pct: ${{ env.BUDGET_ROCKS_PCT }}
      budget_terrain_pct: ${{ env.BUDGET_TERRAIN_PCT }}
      opt_test_km2: ${{ steps.opts.outputs.opt_test_km2 }}
      opt_publish: ${{ steps.opts.outputs.opt_publish }}
      opt_apple_archive: ${{ steps.opts.outputs.opt_apple_archive }}
      opt_size_limit_mb: ${{ steps.opts.outputs.opt_size_limit_mb }}
      opt_contour_lines: ${{ steps.opts.outputs.opt_contour_lines }}
      opt_rocks: ${{ steps.opts.outputs.opt_rocks }}
      opt_terrain: ${{ steps.opts.outputs.opt_terrain }}
      opt_contours: ${{ steps.opts.outputs.opt_contours }}
      opt_contour_source: ${{ steps.opts.outputs.opt_contour_source }}
      opt_rock_source: ${{ steps.opts.outputs.opt_rock_source }}
      opt_rock_dem: ${{ steps.opts.outputs.opt_rock_dem }}
      opt_shading_source: ${{ steps.opts.outputs.opt_shading_source }}
      opt_ugkk_fallback: ${{ steps.opts.outputs.opt_ugkk_fallback }}
      opt_ugkk_urls: ${{ steps.opts.outputs.opt_ugkk_urls }}
      opt_contour_interval: ${{ steps.opts.outputs.opt_contour_interval }}
      opt_contour_maxzoom: ${{ steps.opts.outputs.opt_contour_maxzoom }}
      opt_contour_maxzoom_cap: ${{ steps.opts.outputs.opt_contour_maxzoom_cap }}
      opt_contour_lowland_m: ${{ steps.opts.outputs.opt_contour_lowland_m }}
      opt_contour_smoothing: ${{ steps.opts.outputs.opt_contour_smoothing }}
      opt_rock_maxzoom: ${{ steps.opts.outputs.opt_rock_maxzoom }}
      opt_rock_res: ${{ steps.opts.outputs.opt_rock_res }}
      opt_rock_solid: ${{ steps.opts.outputs.opt_rock_solid }}
      opt_rock_fill_holes: ${{ steps.opts.outputs.opt_rock_fill_holes }}
      opt_terrain_maxzoom: ${{ steps.opts.outputs.opt_terrain_maxzoom }}
      opt_terrain_frac_bits: ${{ steps.opts.outputs.opt_terrain_frac_bits }}
      opt_terrain_format: ${{ steps.opts.outputs.opt_terrain_format }}
      opt_reuse_layers: ${{ steps.opts.outputs.opt_reuse_layers }}
      opt_contours_rebuild: ${{ steps.opts.outputs.opt_contours_rebuild }}
      opt_rocks_rebuild: ${{ steps.opts.outputs.opt_rocks_rebuild }}
      opt_terrain_rebuild: ${{ steps.opts.outputs.opt_terrain_rebuild }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Today's date for the cache key
        id: day
        run: echo "d=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # all three layers from DMR 5.0: the 1 m LiDAR is what a mountain package is for
      - name: Split the options
        id: opts
        run: |
          set -euo pipefail
          python3 workers/plan/options.py \
            --options="$MOUNTAIN_OPTIONS $OPTIONS" \
            --contour-source=dmr5 --rock-source=dmr5 --shading-source=dmr5 \
            --rebuild='${{ inputs.rebuild }}' \
            --test='${{ inputs.test }}' \
            --publish-pages=false \
            --out="$GITHUB_OUTPUT" \
            --summary="$GITHUB_STEP_SUMMARY"
        env:
          OPTIONS: ${{ inputs.options }}

      - name: Resolve the range
        id: mountain
        run: |
          set -euo pipefail
          python3 workers/mountain/plan.py --mountain='${{ inputs.mountain }}' \
            --test-km2='${{ steps.opts.outputs.opt_test_km2 }}' --out="$GITHUB_OUTPUT"

      # `dem-layers.yml` clips every layer to it, as to a region's outline
      - name: Keep the range outline
        uses: actions/upload-artifact@v7
        with:
          name: region-poly
          path: |
            data/region.geojson
            data/region.poly
          retention-days: 1

  osm:
    name: The range's OSM data
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Range PBF cache (restore)
        id: pbf-cache
        uses: ./.github/actions/cache-restore
        with:
          path: data/region.osm.pbf
          key: pbf-mountain-v3-${{ needs.plan.outputs.key }}-${{ needs.plan.outputs.bboxkey }}-${{ needs.plan.outputs.day }}

      - name: Extracts the range is cut from
        id: extract-urls
        if: ${{ steps.pbf-cache.outputs.cache-hit != 'true' }}
        env:
          OSM_URLS: ${{ needs.plan.outputs.osm }}
        run: python3 workers/lib/extract-urls.py --each="$OSM_URLS" --out="$GITHUB_OUTPUT"

      - name: Extracts of the day
        if: ${{ steps.extract-urls.outputs.urls != '' }}
        uses: ./.github/actions/extracts
        with:
          urls: ${{ steps.extract-urls.outputs.urls }}

      - name: Cut every country's extract to the range and merge them
        env:
          OSM_URLS: ${{ needs.plan.outputs.osm }}
          MOUNTAIN_BBOX: ${{ needs.plan.outputs.bbox }}
        run: workers/mountain/pbf.sh

      - name: Range PBF cache (save)
        if: ${{ always() && steps.pbf-cache.outputs.cache-hit != 'true' && hashFiles('data/region.osm.pbf') != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: data/region.osm.pbf
          key: ${{ steps.pbf-cache.outputs.cache-primary-key }}

      - name: Keep the PBF for roads, paths, water and points
        uses: actions/upload-artifact@v7
        with:
          name: pbf
          path: data/region.osm.pbf
          retention-days: 1

  transport:
    name: Roads and paths
    needs: [plan, osm]
    uses: ./.github/workflows/transport.yml
    secrets: inherit
    with:
      region_key: ${{ needs.plan.outputs.key }}
      region_bbox: ${{ needs.plan.outputs.bbox }}
      region_clip: ${{ 'true' }}
      size_limit_mb: ${{ needs.plan.outputs.opt_size_limit_mb }}
      day: ${{ needs.plan.outputs.day }}

  # the points half of the features job; its lines and areas no range package carries
  points:
    name: Points of interest
    needs: [plan, osm]
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.features.outputs.points_enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Prepare the timing folder
        run: mkdir -p steps-out

      - name: Download the range's PBF
        uses: actions/download-artifact@v8
        with:
          name: pbf
          path: data

      - name: Download the range outline
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: region-poly
          path: data

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Planetiler cache (restore)
        id: planetiler-cache
        uses: ./.github/actions/cache-restore
        with:
          path: planetiler.jar
          key: planetiler-latest-${{ needs.plan.outputs.day }}

      - name: Download Planetiler
        run: workers/lib/planetiler.sh
      - name: Planetiler cache (save)
        if: ${{ always() && steps.planetiler-cache.outputs.cache-hit != 'true' && hashFiles('planetiler.jar') != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: planetiler.jar
          key: ${{ steps.planetiler-cache.outputs.cache-primary-key }}

      - name: Points from OSM → PMTiles
        id: features
        env:
          OPT_FEATURES_MAXZOOM: "15"
          OPT_REGION_CLIP: "true"
          REGION_BBOX: ${{ needs.plan.outputs.bbox }}
          REGION_KEY: ${{ needs.plan.outputs.key }}
          SIZE_LIMIT_MB: ${{ needs.plan.outputs.opt_size_limit_mb }}
        run: workers/features/build.sh

      - name: Upload the site part
        if: ${{ always() && hashFiles('_site/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: site-points
          path: _site
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore

  # the same workflow the map build calls, over the range's PBF
  water:
    name: Water bodies
    needs: [plan, osm]
    uses: ./.github/workflows/water.yml
    secrets: inherit
    with:
      region_key: ${{ needs.plan.outputs.key }}
      region_bbox: ${{ needs.plan.outputs.bbox }}
      region_clip: ${{ 'true' }}
      size_limit_mb: ${{ needs.plan.outputs.opt_size_limit_mb }}
      day: ${{ needs.plan.outputs.day }}

  # settlements down to their parts, parks, ranges, ridges and valleys (`workers/boundaries/range.yml`)
  boundaries:
    name: Borders and natural areas
    needs: [plan, osm]
    uses: ./.github/workflows/boundaries.yml
    secrets: inherit
    with:
      region_key: ${{ needs.plan.outputs.key }}
      region_bbox: ${{ needs.plan.outputs.bbox }}
      region_clip: ${{ 'true' }}
      maxzoom: "14"
      schema: range
      size_limit_mb: ${{ needs.plan.outputs.opt_size_limit_mb }}
      budget_pct: "4"
      day: ${{ needs.plan.outputs.day }}

  aerial:
    name: Aerial photos · ${{ matrix.season }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        season: [summer, winter]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Tile cache (restore)
        id: tile-cache
        uses: ./.github/actions/cache-restore
        with:
          path: aerial-cache
          key: aerial-v1-${{ matrix.season }}-${{ needs.plan.outputs.bboxkey }}-z${{ inputs.aerial_maxzoom }}
          restore-keys: aerial-v1-${{ matrix.season }}-${{ needs.plan.outputs.bboxkey }}-

      - name: Download the range outline
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: region-poly
          path: data

      - name: Photos → PMTiles
        id: photos
        env:
          SEASON: ${{ matrix.season }}
          BBOX: ${{ needs.plan.outputs.bbox }}
          KEY: ${{ needs.plan.outputs.key }}
          MAXZOOM: ${{ inputs.aerial_maxzoom }}
        run: |
          set -euo pipefail
          python3 -c 'import pmtiles, PIL' 2>/dev/null \
            || python3 -m pip install --quiet --break-system-packages pmtiles pillow
          python3 workers/mountain/aerial.py --season="$SEASON" --bbox="$BBOX" \
            --maxzoom="$MAXZOOM" --cache=aerial-cache --poly=data/region.geojson \
            --out="_site/tiles/${KEY}-aerial_${SEASON}.pmtiles"

      - name: Tile cache (save)
        if: ${{ always() && steps.tile-cache.outputs.cache-hit != 'true' && hashFiles('aerial-cache/**') != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: aerial-cache
          key: ${{ steps.tile-cache.outputs.cache-primary-key }}

      - name: Upload the site part
        if: ${{ steps.photos.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: site-aerial-${{ matrix.season }}
          path: _site
          retention-days: 1
          compression-level: 0

  dem:
    name: Height-model layers
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    uses: ./.github/workflows/dem-layers.yml
    secrets: inherit                      # Drive (stores and cache); `env` isn't inherited
    with:
      region_key: ${{ needs.plan.outputs.key }}
      mountain: ${{ 'true' }}
      area: ${{ needs.plan.outputs.area }}
      area_key: ${{ needs.plan.outputs.area_key }}
      area_name: ${{ needs.plan.outputs.name }}
      area_bbox: ${{ needs.plan.outputs.bbox }}
      area_km2: ${{ needs.plan.outputs.km2 }}
      dem_bbox: ${{ needs.plan.outputs.bbox }}
      # the layers clip to the outline, so a new edge is a new key
      dem_bboxkey: ${{ needs.plan.outputs.shapekey }}
      test_km2: ${{ needs.plan.outputs.opt_test_km2 }}
      day: ${{ needs.plan.outputs.day }}
      opt_contours: ${{ needs.plan.outputs.opt_contours }}
      opt_contour_lines: ${{ needs.plan.outputs.opt_contour_lines }}
      opt_rocks: ${{ needs.plan.outputs.opt_rocks }}
      opt_terrain: ${{ needs.plan.outputs.opt_terrain }}
      opt_contour_source: ${{ needs.plan.outputs.opt_contour_source }}
      opt_rock_source: ${{ needs.plan.outputs.opt_rock_source }}
      opt_rock_dem: ${{ needs.plan.outputs.opt_rock_dem }}
      opt_shading_source: ${{ needs.plan.outputs.opt_shading_source }}
      # a mountain from Sonny would be no finer than its region
      opt_ugkk_fallback: ${{ 'false' }}
      opt_ugkk_urls: ${{ needs.plan.outputs.opt_ugkk_urls }}
      opt_contour_interval: ${{ needs.plan.outputs.opt_contour_interval }}
      opt_contour_maxzoom: ${{ needs.plan.outputs.opt_contour_maxzoom }}
      opt_contour_maxzoom_cap: ${{ needs.plan.outputs.opt_contour_maxzoom_cap }}
      opt_contour_lowland_m: ${{ needs.plan.outputs.opt_contour_lowland_m }}
      opt_contour_smoothing: ${{ needs.plan.outputs.opt_contour_smoothing }}
      rock_slope: ${{ inputs.rock_slope }}
      opt_rock_maxzoom: ${{ needs.plan.outputs.opt_rock_maxzoom }}
      opt_rock_res: ${{ needs.plan.outputs.opt_rock_res }}
      opt_rock_solid: ${{ needs.plan.outputs.opt_rock_solid }}
      opt_rock_fill_holes: ${{ needs.plan.outputs.opt_rock_fill_holes }}
      opt_terrain_maxzoom: ${{ needs.plan.outputs.opt_terrain_maxzoom }}
      opt_terrain_frac_bits: ${{ needs.plan.outputs.opt_terrain_frac_bits }}
      opt_terrain_format: ${{ needs.plan.outputs.opt_terrain_format }}
      opt_reuse_layers: ${{ needs.plan.outputs.opt_reuse_layers }}
      opt_contours_rebuild: ${{ needs.plan.outputs.opt_contours_rebuild }}
      opt_rocks_rebuild: ${{ needs.plan.outputs.opt_rocks_rebuild }}
      opt_terrain_rebuild: ${{ needs.plan.outputs.opt_terrain_rebuild }}
      opt_size_limit_mb: ${{ needs.plan.outputs.opt_size_limit_mb }}
      budget_contours_pct: ${{ needs.plan.outputs.budget_contours_pct }}
      budget_rocks_pct: ${{ needs.plan.outputs.budget_rocks_pct }}
      budget_terrain_pct: ${{ needs.plan.outputs.budget_terrain_pct }}

  publish:
    name: Package to Drive and the catalog
    needs: [plan, dem, transport, points, water, boundaries, aerial]
    # half a new range would be a lying package
    if: ${{ !cancelled() && needs.dem.result == 'success' && needs.transport.result == 'success' && needs.points.result == 'success' && needs.water.result == 'success' && needs.boundaries.result == 'success' && needs.aerial.result == 'success' && needs.plan.outputs.opt_publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      # `maps.json`, the one place anything reaches the repository
      contents: write
    outputs:
      published: ${{ steps.publish.outcome }}
    env:
      REGION_KEY: ${{ needs.plan.outputs.key }}
      AREA_KEY: whole
      TEST_KM2: ${{ needs.plan.outputs.opt_test_km2 }}
      MOUNTAIN_COUNTRY: ${{ needs.plan.outputs.country }}
      MOUNTAIN_NAME: ${{ needs.plan.outputs.name }}
      AREA_BBOX: ${{ needs.plan.outputs.bbox }}
      CONTOURS_ENABLED: ${{ needs.dem.outputs.contours_enabled || 'false' }}
      CONTOURS_MAXZOOM: ${{ needs.dem.outputs.contours_maxzoom }}
      CONTOURS_SOURCE: ${{ needs.dem.outputs.contours_dem_source }}
      CONTOUR_INTERVAL: ${{ needs.plan.outputs.opt_contour_interval }}
      ROCKS_ENABLED: ${{ needs.dem.outputs.rocks_enabled || 'false' }}
      ROCKS_MAXZOOM: ${{ needs.dem.outputs.rocks_maxzoom }}
      ROCKS_SOURCE: ${{ needs.dem.outputs.rock_source }}
      ROCK_SLOPE: ${{ needs.dem.outputs.rock_slope }}
      TERRAIN_ENABLED: ${{ needs.dem.outputs.terrain_enabled || 'false' }}
      TERRAIN_MAXZOOM: ${{ needs.dem.outputs.terrain_maxzoom }}
      TERRAIN_SOURCE: ${{ needs.dem.outputs.terrain_dem_source }}
      TRANSPORT_ENABLED: ${{ needs.transport.outputs.enabled || 'false' }}
      PATHS_ENABLED: ${{ needs.transport.outputs.paths_enabled || 'false' }}
      TRANSPORT_MAXZOOM: ${{ needs.transport.outputs.maxzoom }}
      WATER_ENABLED: ${{ needs.water.outputs.enabled || 'false' }}
      WATER_MAXZOOM: ${{ needs.water.outputs.maxzoom }}
      POINTS_ENABLED: ${{ needs.points.outputs.enabled || 'false' }}
      POINTS_MAXZOOM: "15"
      BOUNDARIES_ENABLED: ${{ needs.boundaries.outputs.enabled || 'false' }}
      BOUNDARIES_MAXZOOM: ${{ needs.boundaries.outputs.maxzoom }}
      COUNTRIES: ${{ needs.plan.outputs.countries }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Collect the layers
        uses: actions/download-artifact@v8
        with:
          pattern: site-*
          path: _site
          merge-multiple: true

      # a season without a `url` makes no file
      - name: Which photos came
        run: workers/mountain/layers-env.sh >> "$GITHUB_ENV"

      # what the packer and the catalog read: bbox, zooms, models
      - name: The range's manifest
        run: python3 workers/mountain/manifest.py _site

      - name: Publish the packages to Drive and write maps.json
        id: publish
        run: |
          set -euo pipefail
          python3 workers/deploy/publish-map.py \
            --site=_site --maps=maps.json \
            --summary="$GITHUB_STEP_SUMMARY"

      - name: Commit maps.json
        if: ${{ steps.publish.outcome == 'success' }}
        env:
          MAPS_JSON: ${{ steps.publish.outputs.maps_file || 'maps.json' }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: workers/deploy/catalog.sh

      - name: Keep the layers for Apple Archive
        if: ${{ steps.publish.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: mountain-site
          path: _site
          retention-days: 1
          compression-level: 0

  apple-archive:
    name: Package as Apple Archive (.aar)
    needs: [plan, dem, transport, points, water, boundaries, aerial, publish]
    if: ${{ !cancelled() && needs.publish.outputs.published == 'success' && needs.plan.outputs.opt_apple_archive == 'true' }}
    runs-on: macos-latest
    permissions:
      contents: write     # `maps.json` – as `publish` does
    env:
      REGION_KEY: ${{ needs.plan.outputs.key }}
      AREA_KEY: whole
      TEST_KM2: ${{ needs.plan.outputs.opt_test_km2 }}
      MOUNTAIN_COUNTRY: ${{ needs.plan.outputs.country }}
      # the same values as the ZIP job – `contents.json` is made of them
      CONTOURS_ENABLED: ${{ needs.dem.outputs.contours_enabled || 'false' }}
      CONTOURS_SOURCE: ${{ needs.dem.outputs.contours_dem_source }}
      CONTOUR_INTERVAL: ${{ needs.plan.outputs.opt_contour_interval }}
      ROCKS_ENABLED: ${{ needs.dem.outputs.rocks_enabled || 'false' }}
      ROCKS_SOURCE: ${{ needs.dem.outputs.rock_source }}
      TERRAIN_ENABLED: ${{ needs.dem.outputs.terrain_enabled || 'false' }}
      TERRAIN_SOURCE: ${{ needs.dem.outputs.terrain_dem_source }}
      TRANSPORT_ENABLED: ${{ needs.transport.outputs.enabled || 'false' }}
      PATHS_ENABLED: ${{ needs.transport.outputs.paths_enabled || 'false' }}
      WATER_ENABLED: ${{ needs.water.outputs.enabled || 'false' }}
      POINTS_ENABLED: ${{ needs.points.outputs.enabled || 'false' }}
      BOUNDARIES_ENABLED: ${{ needs.boundaries.outputs.enabled || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download the layers from the job before
        uses: actions/download-artifact@v8
        with:
          name: mountain-site
          path: _site
      - name: Which photos came
        run: workers/mountain/layers-env.sh >> "$GITHUB_ENV"
      - name: Pack and upload .aar to Drive
        id: publish
        env:
          BRANCH: ${{ github.ref_name }}
        run: workers/deploy/apple-archive.sh
      - name: Commit maps.json
        if: ${{ steps.publish.outcome == 'success' }}
        env:
          MAPS_JSON: ${{ steps.publish.outputs.maps_file || 'maps.json' }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: workers/deploy/catalog.sh
