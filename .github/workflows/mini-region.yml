name: Check · mini region

# a few km² of OSM and a synthetic hill through every package build, read back

on:
  push:
    paths:
      - "workers/transport/**"
      - "workers/boundaries/**"
      - "workers/water/**"
      - "workers/rail/**"
      - "workers/history/**"
      - "workers/buildings/**"
      - "workers/trails/**"
      - "workers/features/**"
      - "workers/routing/**"
      - "workers/contours-rocks/**"
      - "workers/terrain/**"
      - "workers/styles/**"
      - "workers/lib/**"
      - "workers/tests/mini_region.py"
      - "workers/tests/integration.py"
      - "workers/tests/check-packages.py"
      - "workers/tests/geo.py"
      - "workers/tests/browser.mjs"
      - "workers/assets/**"
      - "poc/web/**"
      - ".github/workflows/mini-region.yml"
  # every PR, whatever it touches
  pull_request:
  workflow_dispatch:
  schedule:
    # Planetiler and osmium are installed unpinned and change under us
    - cron: "40 4 * * 1"

permissions:
  contents: read

jobs:
  mini-region:
    name: every package from a mini region
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      # what the build scripts install
      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool gdal-bin libsqlite3-mod-spatialite zstd >/dev/null
          python3 -m pip install --quiet --break-system-packages \
            'osmium>=3.6,<5' numpy pillow pmtiles mapbox-vector-tile shapely
      - name: Download Planetiler
        run: workers/lib/planetiler.sh
      - name: Build and read back
        run: python3 workers/tests/integration.py --dem --jar planetiler.jar --work "$RUNNER_TEMP/mini"
      # the versions index.html loads from unpkg, so the page runs without the CDN
      - name: Install the browser
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/browser" \
            playwright@1.56.1 maplibre-gl@4.7.1 pmtiles@3.2.1
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: The viewer over the packages
        env:
          GLYPHS_ZIP: https://github.com/openmaptiles/fonts/releases/download/v2.0/noto-sans.zip
        run: node workers/tests/browser.mjs --work="$RUNNER_TEMP/mini" --deps="$RUNNER_TEMP/browser"
