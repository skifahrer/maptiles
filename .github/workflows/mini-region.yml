name: Check · mini region

# a few km² of OSM and a synthetic hill through every package build, read back

on:
  push:
    paths:
      - "workers/transport/**"
      - "workers/boundaries/**"
      - "workers/water/**"
      - "workers/rail/**"
      - "workers/history/**"
      - "workers/buildings/**"
      - "workers/trails/**"
      - "workers/features/**"
      - "workers/routing/**"
      - "workers/contours-rocks/**"
      - "workers/terrain/**"
      - "workers/styles/**"
      - "workers/lib/**"
      - "workers/tests/mini_region.py"
      - "workers/tests/integration.py"
      - "workers/tests/check-packages.py"
      - "workers/tests/geo.py"
      - ".github/workflows/mini-region.yml"
  pull_request:
    paths:
      - "workers/transport/**"
      - "workers/boundaries/**"
      - "workers/water/**"
      - "workers/rail/**"
      - "workers/history/**"
      - "workers/buildings/**"
      - "workers/trails/**"
      - "workers/features/**"
      - "workers/routing/**"
      - "workers/contours-rocks/**"
      - "workers/terrain/**"
      - "workers/styles/**"
      - "workers/lib/**"
      - "workers/tests/mini_region.py"
      - "workers/tests/integration.py"
      - "workers/tests/check-packages.py"
      - "workers/tests/geo.py"
      - ".github/workflows/mini-region.yml"
  workflow_dispatch:
  schedule:
    # Planetiler and osmium are installed unpinned and change under us
    - cron: "40 4 * * 1"

permissions:
  contents: read

jobs:
  mini-region:
    name: every package from a mini region
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      # what the build scripts install
      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool gdal-bin libsqlite3-mod-spatialite zstd >/dev/null
          python3 -m pip install --quiet --break-system-packages \
            'osmium>=3.6,<5' numpy pillow pmtiles mapbox-vector-tile shapely
      - name: Download Planetiler
        run: workers/lib/planetiler.sh
      - name: Build and read back
        run: python3 workers/tests/integration.py --dem --jar planetiler.jar --work "$RUNNER_TEMP/mini"
