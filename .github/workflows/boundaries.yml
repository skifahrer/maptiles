name: Map · boundaries

# AREA BOUNDARIES AND THEIR NAMES from OSM into their own `.pmtiles`: state,
# region, district and municipality as areas and lines, with name and level,
# plus settlement points. OpenMapTiles' `boundary` layer is a line WITHOUT THE
# NAME of the area it bounds – see the `workers/boundaries/boundaries.yml`
# header. It's the `boundaries` package.
#
# One difference from other layers: the prefilter must pull relation members
# too, since a municipality border is a relation whose members lack
# `boundary=administrative`.
#
# A file of its own because `build-map-region.yml` is near the 128 KiB cap.
on:
  workflow_call:
    inputs:
      region_key:
        description: "Region key – it names `{region}-boundaries.pmtiles`"
        required: true
        type: string
      region_bbox:
        description: "Region bbox for clipping tiles (workers/lib/region-clip.sh)"
        required: true
        type: string
      maxzoom:
        description: "Highest zoom of the boundary tiles"
        required: false
        default: "12"
        type: string
      region_clip:
        description: "Clip tiles to the region border"
        required: false
        default: "false"
        type: string
      size_limit_mb:
        description: "The whole page budget in MB"
        required: false
        default: "900"
        type: string
      budget_pct:
        description: "The boundaries' share of the page budget in percent"
        required: false
        default: "3"
        type: string
      day:
        description: "Date for the Planetiler cache key"
        required: false
        default: ""
        type: string
    outputs:
      enabled:
        description: "Was the layer made? (a cutout may hold no boundary)"
        value: ${{ jobs.boundaries.outputs.enabled }}
      maxzoom:
        description: "The zoom tiles really go up to"
        value: ${{ jobs.boundaries.outputs.maxzoom }}
      size_mb:
        description: "Layer size in MB"
        value: ${{ jobs.boundaries.outputs.size_mb }}
    # `workflow_call` doesn't inherit secrets; without them the Drive cache can't
    # open and Planetiler (93 MB) is downloaded on every run.
    secrets:
      GDRIVE_CREDENTIALS:
        required: false
      DRIVE_SECRET:
        required: false
      DRIVE_REFRESH:
        required: false

# Drive sign-in for the whole workflow, not per step: `cache-restore` and
# `cache-save` are two steps and one without a token would download everything again
env:
  GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
  DRIVE_CLIENT: ${{ vars.DRIVE_CLIENT }}
  DRIVE_SECRET: ${{ secrets.DRIVE_SECRET }}
  DRIVE_REFRESH: ${{ secrets.DRIVE_REFRESH }}

jobs:
  boundaries:
    name: Area boundaries
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.boundaries.outputs.enabled }}
      maxzoom: ${{ steps.boundaries.outputs.maxzoom }}
      size_mb: ${{ steps.boundaries.outputs.size_mb }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Prepare the timing folder
        run: mkdir -p steps-out

      - name: Download the PBF from the plan
        uses: actions/download-artifact@v8
        with:
          name: pbf
          path: data

      # the region polygon is Planetiler's `--polygon`; `continue-on-error`, since
      # the run finishes without it too (tiles then follow the bbox)
      - name: Download the region polygon
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: region-poly
          path: data

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Planetileru (restore)
        id: planetiler-cache
        uses: ./.github/actions/cache-restore
        with:
          path: planetiler.jar
          key: planetiler-latest-${{ inputs.day }}

      - name: Stiahni Planetiler
        run: workers/lib/planetiler.sh
      - name: Cache Planetileru (save)
        if: ${{ always() && steps.planetiler-cache.outputs.cache-hit != 'true' && hashFiles('planetiler.jar') != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: planetiler.jar
          key: ${{ steps.planetiler-cache.outputs.cache-primary-key }}

      # schema tests before the build (`examples`) – the one thing that tells the
      # truth about a schema without a whole run. They go first.
      - name: Boundary schema tests
        run: java -jar planetiler.jar verify workers/boundaries/boundaries.yml

      # described in `workers/boundaries/build.sh`
      - name: Area boundaries from OSM → PMTiles
        id: boundaries
        env:
          OPT_BOUNDARIES_MAXZOOM: ${{ inputs.maxzoom }}
          OPT_REGION_CLIP: ${{ inputs.region_clip }}
          REGION_BBOX: ${{ inputs.region_bbox }}
          REGION_KEY: ${{ inputs.region_key }}
          SIZE_LIMIT_MB: ${{ inputs.size_limit_mb }}
          BUDGET_BOUNDARIES_PCT: ${{ inputs.budget_pct }}
        run: workers/boundaries/build.sh

      - name: Upload the site part
        if: ${{ always() && hashFiles('_site/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: site-boundaries
          path: _site
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore

      - name: Upload the step timing
        if: ${{ always() && hashFiles('steps-out/*') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: steps-boundaries
          path: steps-out
          retention-days: 1
          if-no-files-found: ignore
