name: Dáta · tieňované skaly

# POKUSNÁ druhá cesta k skalám: nepočíta sa sklon z DEM, ale hľadajú sa tmavé
# plochy v hotovom hillshade z freemap.sk. Výstup je ten istý formát ako u skál
# z DEM, takže si ho Build map vie vypýtať cez `rock_source: tienovanie`.
#
# Celý výpočet je vo workers/rocks-shading/build.py. Tri joby: `dlazdice`,
# `vektor`, `skaly` – strop času platí na job a na všetko naraz nemusí stačiť.
#
# Hillshade je obraz sklonu osvetleného z jednej strany, takže juhovýchodné
# steny táto cesta systematicky prehliadne. Zato má rozlíšenie ~0,8 m/px (z17).
#
# Najtenšie vlákna siete sa zahadzujú (`options: open=…`) – inak je z nich pri
# z14 rovnomerná sivá deka. Výstupom je jedno pásmo (jedna trieda) a diery
# v plochách ostávajú: sú to medzery medzi vláknami žliabkov.
#
# Prvý beh je ladiaci – prahy sú kvalifikovaný odhad. Artefakt `nahlad-…` má
# PNG „mozaika vedľa nájdených plôch" a histogram odtieňov.

on:
  workflow_dispatch:
    inputs:
      area:
        description: "Pohorie, na ktorom sa skaly hľadajú (bbox je vo workers/data/areas.json)"
        required: true
        default: vysoke_tatry
        type: choice
        options:
          - tatry
          - vysoke_tatry
          - belianske_tatry
          - zapadne_tatry
          - nizke_tatry
          - slovensky_raj
          - pieniny
          - mala_fatra
          - velka_fatra
          - sulovske_skaly
          - slovensky_kras
          - muranska_planina
          - vihorlat
          - strazovske_vrchy
          - male_karpaty
      # `auto` = najvyšší, čo sa zmestí do stropu na dlaždice aj do rozpočtu
      # času. z17 je strop: na z18 sú to 4× dlaždice a mapa z toho nemá nič.
      zoom:
        description: "Zoom dlaždíc, z ktorých sa skaly počítajú (auto = najvyšší možný)"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - "17"
          - "16"
          - "15"
      # na doladenie prahov: z desiatok minút sú minúty
      test:
        description: "Rýchly test: počítať len malý štvorec (km²) zo stredu výrezu"
        required: false
        default: nie
        type: choice
        options:
          - nie
          - "1"
          - "2"
          - "4"
          - "5"
          - "10"
      dark:
        description: "Nad touto šedou (0–255) nie je skala NIKDY – horný strop prahu"
        required: false
        default: "125"
        type: string
      dark_always:
        description: "Pod touto šedou je skala VŽDY, nech je okolo čokoľvek"
        required: false
        default: "70"
        type: string
      rel:
        description: "Medzi tými dvomi: o koľko musí byť pixel pod miestnym pozadím, aby sa rátal"
        required: false
        default: "18"
        type: string
      cliff:
        description: "O koľko stupňov šedej tmavšie začína trieda `cliff` (výrazná stena) namiesto `steep`"
        required: false
        default: "25"
        type: string
      # menšie plochy sú zrno JPEGu. Nízka hodnota je zámer – tmavé miesta nie
      # sú súvislé steny, ale jemná sieť žliabkov. 7 m² je ~11 pixelov na z17.
      min_area:
        description: "Najmenšia skalná plocha v m²"
        required: false
        default: "7"
        type: string
      # napr. `local=2000 smooth=2 jobs=8`. Čo sa hodí najčastejšie:
      #   open=0/6         nechať aj najtenšie vlákna / len výrazné steny
      #   fill=40          súvislé plochy namiesto jemnej siete
      #   plne=0           aj trieda `cliff` ako kedysi
      #   zapln_diery=1    zaplniť diery (zožerie detail)
      #   budget_min=150   zastaviť obrysy po 150 min (0 = bez stropu)
      #   fresh=1          nepokračovať v rozrobenom
      # Celý zoznam je vo workers/rocks-shading/build.py; neznámy kľúč je chyba.
      options:
        description: "Zriedka menené prepínače ako kľúč=hodnota (viď workers/rocks-shading/build.py)"
        required: false
        default: ""
        type: string
  # volá ho aj Build map pri `rock_source: tienovanie` – netreba teda púšťať
  # najprv toto. `workflow_call` nepozná `type: choice`, tak chodia holé reťazce.
  workflow_call:
    inputs:
      area:
        required: true
        type: string
      zoom:
        required: false
        default: auto
        type: string
      # Build map sem posiela rovno bbox testovacieho štvorca, takže `nie`
      test:
        required: false
        default: nie
        type: string
      dark:
        required: false
        default: "125"
        type: string
      dark_always:
        required: false
        default: "70"
        type: string
      rel:
        required: false
        default: "18"
        type: string
      cliff:
        required: false
        default: "25"
        type: string
      min_area:
        required: false
        default: "7"
        type: string
      options:
        required: false
        default: ""
        type: string
    outputs:
      # meno súboru v sklade – build si podľa neho vypýta presne tie skaly,
      # ktoré tento beh vyrobil, nie „najnovšie pre výrez"
      asset:
        description: "Meno súboru so skalami v sklade dem-rocks-img"
        value: ${{ jobs.skaly.outputs.asset }}
      zoom:
        description: "Zoom dlaždíc, z ktorých sa skaly počítali"
        value: ${{ jobs.dlazdice.outputs.zoom }}
      count:
        description: "Počet nájdených skalných plôch"
        value: ${{ jobs.skaly.outputs.count }}
    # `workflow_call` nededí secrets sám. Bez nich by sa cache na Drive nemala
    # ako otvoriť a gigabajty dlaždíc by sa ťahali pri každom behu.
    secrets:
      GDRIVE_CREDENTIALS:
        required: false
      DRIVE_SECRET:
        required: false
      DRIVE_REFRESH:
        required: false

# `contents: read` stačí: polygóny idú do skladu na Drive, nie do releasu
permissions:
  contents: read

concurrency:
  # dva behy na to isté pohorie by z freemap.sk ťahali dvojnásobok dlaždíc
  group: shading-rocks-${{ inputs.area }}
  cancel-in-progress: false

env:
  # cache tejto podpipeline leží na Drive – sú to gigabajty JPG a v GitHubovej
  # cache s 10 GB vyhadzovali všetko ostatné
  GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
  DRIVE_CLIENT: ${{ vars.DRIVE_CLIENT }}
  DRIVE_SECRET: ${{ secrets.DRIVE_SECRET }}
  DRIVE_REFRESH: ${{ secrets.DRIVE_REFRESH }}
  # XYZ šablóna bez metadát – najvyšší zoom sa zisťuje skúšobnou dlaždicou
  SHADING_URL: "https://sk-hires-shading.tiles.freemap.sk/{z}/{x}/{y}.jpg"
  # zámerne nie `dem-rocks`: tie sú z DEM a tieto z obrázka
  ROCK_IMG_STORE: dem-rocks-img
  # verzia algoritmu v mene súboru: zmena algoritmu = iné skaly
  ROCK_IMG_ALGO: v3
  # regiónom je tu celé územie, na ktorom tá dlaždicová vrstva existuje
  SK_BBOX: "16.79,47.71,22.58,49.63"
  # strop na počet dlaždíc behu; 60 000 je ~1,5 GB dát a ~4 mld. pixelov
  MAX_TILES: "60000"

jobs:
  # tri joby, nie jeden: strop času platí na job. Sťahovanie je desiatky minút,
  # obrysy ďalšiu hodinu – a keď čas dôjde, padne aj to, čo bolo hotové.
  # GDAL tu netreba, sťahujú sa obrázky.
  dlazdice:
    name: Stiahnuť dlaždice
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.area.outputs.key }}
      name: ${{ steps.area.outputs.name }}
      bbox: ${{ steps.area.outputs.bbox }}
      km2: ${{ steps.area.outputs.km2 }}
      # pri `zoom: auto` ho vyberá sonda a rozpočet – ide von, nech ho ďalšie
      # joby nemusia hádať znova
      zoom: ${{ steps.dl.outputs.zoom }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Nástroje
        run: python3 -m pip install --quiet numpy pillow

      # `test` nie je iný algoritmus, len menší bbox. Kľúč dostane príponu
      # `_test<km²>`, takže si nesadne do cache ani na asset ostrého behu.
      - name: Výrez → bbox
        id: area
        run: |
          set -euo pipefail
          TEST='${{ inputs.test }}'
          if [ "$TEST" = 'nie' ] || [ -z "$TEST" ]; then TEST=0; fi
          python3 workers/plan/area.py \
            --region-bbox="$SK_BBOX" \
            --area='${{ inputs.area }}' \
            --test-km2="$TEST" \
            --out="$GITHUB_OUTPUT"

      # bez toho je „nenašlo ani jednu skalu" nečitateľné: nevie sa, či sú
      # prísne prahy, alebo štvorec padol na lúku
      - name: Kde je testovací výrez
        if: ${{ inputs.test != 'nie' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 workers/plan/test-map.py \
            --bbox='${{ steps.area.outputs.bbox }}' \
            --full-bbox='${{ steps.area.outputs.full_bbox }}' \
            --name='${{ steps.area.outputs.name }}' \
            --layers="skaly z tieňovania, zoom ${{ inputs.zoom }}" \
            --png=out/kde-to-je.png --md=out/kde-to-je.md
          cat out/kde-to-je.md >> "$GITHUB_STEP_SUMMARY"

      # do skladu `vysledky` na Drive, nie ako artefakt behu
      # (`workers/deploy/publish-results.sh`)
      - name: Odlož obrázok testovacieho výrezu
        if: ${{ always() && hashFiles('out/kde-to-je.png') != '' }}
        continue-on-error: true
        env:
          NAZOV: kde-to-je-${{ steps.area.outputs.key }}
          SUBORY: out/kde-to-je.png
          POPIS: Kde v regióne leží testovací výrez (skaly z tieňovania)
        run: workers/deploy/publish-results.sh

      # čo sa raz stiahlo, sa nemá sťahovať znova len preto, že sa ladí prah.
      # Kľúč na uloženie má v sebe číslo behu, nech sa dá doplniť aj neúplný
      # obsah – existujúci kľúč sa neprepisuje. Hľadá sa cez `restore-keys`.
      - name: Cache dlaždíc (restore)
        id: tiles-cache
        uses: ./.github/actions/cache-restore
        with:
          path: tiles-cache
          key: shading-tiles-${{ steps.area.outputs.key }}-z${{ inputs.zoom }}-${{ github.run_id }}
          restore-keys: |
            shading-tiles-${{ steps.area.outputs.key }}-z${{ inputs.zoom }}-

      - name: Stiahni dlaždice
        id: dl
        run: |
          set -euo pipefail
          python3 workers/rocks-shading/build.py \
            --bbox='${{ steps.area.outputs.bbox }}' \
            --url="$SHADING_URL" \
            --zoom='${{ inputs.zoom }}' \
            --max-tiles="$MAX_TILES" \
            --cache-dir=tiles-cache \
            --phase=stiahnut \
            --zoom-out="$GITHUB_OUTPUT" \
            --options='${{ inputs.options }}' \
            --out=data/rock.gpkg

      - name: Cache dlaždíc (save)
        if: ${{ always() && hashFiles('tiles-cache/**') != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: tiles-cache
          key: shading-tiles-${{ steps.area.outputs.key }}-z${{ inputs.zoom }}-${{ github.run_id }}

      # samotné obrázky do skladu `vysledky`; medzivýsledky patria do cache,
      # nie do archívu s obrázkami, preto sa `_rozrobene` odloží nabok
      - name: Odlož stiahnuté dlaždice do skladu
        if: ${{ always() && hashFiles('tiles-cache/**') != '' }}
        continue-on-error: true
        env:
          NAZOV: dlazdice-tienovania-${{ steps.area.outputs.key }}-z${{ steps.dl.outputs.zoom }}
          POPIS: Tieňované JPG dlaždice z freemap.sk, z ktorých sa skaly hľadali
        run: |
          set -uo pipefail
          mv tiles-cache/_rozrobene "$RUNNER_TEMP/_rozrobene" 2>/dev/null || true
          SUBORY=tiles-cache workers/deploy/publish-results.sh
          mv "$RUNNER_TEMP/_rozrobene" tiles-cache/_rozrobene 2>/dev/null || true

      # najdrahšia časť (raster tmavosti a `gdal_contour` po blokoch, hodiny).
      # Vlastný job, nech hotové bloky prežijú, keď sa to do stropu nezmestí.
  vektor:
    name: Obrysy po blokoch
    needs: dlazdice
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Nástroje
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin
          python3 -m pip install --quiet numpy pillow
          # `gdalinfo --version`, nie `gdal_contour --version`: contour nemá
          # prepínač na verziu a pri `set -e` by zhodil celý job v 30. sekunde
          gdalinfo --version

      # kľúč je ten istý ako v prvom jobe vrátane čísla behu; `restore-keys`
      # je poistka, keď sa uloženie nepodarilo
      - name: Cache dlaždíc (restore)
        uses: ./.github/actions/cache-restore
        with:
          path: tiles-cache
          key: shading-tiles-${{ needs.dlazdice.outputs.key }}-z${{ inputs.zoom }}-${{ github.run_id }}
          restore-keys: |
            shading-tiles-${{ needs.dlazdice.outputs.key }}-z${{ inputs.zoom }}-

      # rozrobené z predošlých behov – hotové bloky sa nepočítajú znova
      - name: Cache rozrobeného (restore)
        uses: ./.github/actions/cache-restore
        with:
          path: |
            tiles-cache/_rozrobene
            tiles-cache/_stiahnute.txt
          key: shading-vektor-${{ needs.dlazdice.outputs.key }}-z${{ inputs.zoom }}-${{ github.run_id }}
          restore-keys: |
            shading-vektor-${{ needs.dlazdice.outputs.key }}-z${{ inputs.zoom }}-

      - name: Raster tmavosti a obrysy
        run: |
          set -euo pipefail
          mkdir -p data out
          python3 workers/rocks-shading/build.py \
            --bbox='${{ needs.dlazdice.outputs.bbox }}' \
            --url="$SHADING_URL" \
            --phase=vektor \
            --zoom='${{ needs.dlazdice.outputs.zoom }}' \
            --max-tiles="$MAX_TILES" \
            --dark='${{ inputs.dark }}' \
            --dark-always='${{ inputs.dark_always }}' \
            --rel='${{ inputs.rel }}' \
            --cliff='${{ inputs.cliff }}' \
            --min-area='${{ inputs.min_area }}' \
            --cache-dir=tiles-cache \
            --preview=out/preview.png \
            --options='${{ inputs.options }}' \
            --out=data/rock.gpkg

      # ukladá sa aj po páde a po timeoute – v tom je celý zmysel delenia.
      # Iba `_rozrobene`, nie obrázky: tie sú v cache pod vlastným kľúčom.
      - name: Cache rozrobeného (save)
        if: ${{ always() && hashFiles('tiles-cache/_rozrobene/**') != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: |
            tiles-cache/_rozrobene
            tiles-cache/_stiahnute.txt
          key: shading-vektor-${{ needs.dlazdice.outputs.key }}-z${{ inputs.zoom }}-${{ github.run_id }}

      # náhľad vzniká pri rastri tmavosti, nie z polygónov – a práve podľa
      # neho sa ladia prahy, tak má byť po ruke aj bez zlepovania
      - name: Odlož náhľad
        if: ${{ always() && hashFiles('out/preview.png') != '' }}
        continue-on-error: true
        env:
          NAZOV: nahlad-${{ needs.dlazdice.outputs.key }}-z${{ needs.dlazdice.outputs.zoom }}
          SUBORY: out/preview.png
          POPIS: Raster tmavosti ako náhľad – podľa neho sa ladia prahy
        run: workers/deploy/publish-results.sh

      # minúty, nie hodiny: bloky sa zlepia, plochy rozseknuté hranicou sa
      # spoja cez ST_Union, prejde filter a vyhladenie. Vlastný job, nech sa dá
      # opakovať samo – zmena `min_area` nie je dôvod počítať obrysy znova.
  skaly:
    name: Skaly z tieňovania
    needs: [dlazdice, vektor]
    runs-on: ubuntu-latest
    outputs:
      asset: ${{ steps.rocks.outputs.asset }}
      count: ${{ steps.rocks.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Nástroje
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # spatialite: `ST_Union` na zlepenie plôch rozseknutých hranicou bloku.
          # Bez neho beh pokračuje, len s rovnými rezmi v skalách.
          sudo apt-get install -y -qq gdal-bin zstd libsqlite3-mod-spatialite
          python3 -m pip install --quiet numpy pillow
          gdalinfo --version

      # zlepovanie pracuje nad obrysmi, nie nad obrázkami – neobnovuje sa
      # celá cache dlaždíc (gigabajty JPEGov)
      - name: Cache rozrobeného (restore)
        uses: ./.github/actions/cache-restore
        with:
          path: |
            tiles-cache/_rozrobene
            tiles-cache/_stiahnute.txt
          key: shading-vektor-${{ needs.dlazdice.outputs.key }}-z${{ inputs.zoom }}-${{ github.run_id }}
          restore-keys: |
            shading-vektor-${{ needs.dlazdice.outputs.key }}-z${{ inputs.zoom }}-

      - name: Spojenie blokov a filter
        id: rocks
        run: |
          set -euo pipefail
          mkdir -p data out
          python3 workers/rocks-shading/build.py \
            --bbox='${{ needs.dlazdice.outputs.bbox }}' \
            --url="$SHADING_URL" \
            --phase=spojit \
            --zoom='${{ needs.dlazdice.outputs.zoom }}' \
            --max-tiles="$MAX_TILES" \
            --dark='${{ inputs.dark }}' \
            --dark-always='${{ inputs.dark_always }}' \
            --rel='${{ inputs.rel }}' \
            --cliff='${{ inputs.cliff }}' \
            --min-area='${{ inputs.min_area }}' \
            --cache-dir=tiles-cache \
            --stats=out/rock-img-stats.txt \
            --options='${{ inputs.options }}' \
            --out=data/rock.gpkg

          # meno assetu nesie výrez aj všetky nastavenia, takže sa dva behy
          # s rôznymi prahmi neprepíšu. Zoom zo štatistiky – pri `auto` je až tam.
          . out/rock-img-stats.txt
          ASSET="rockimg-${{ needs.dlazdice.outputs.key }}-z${zoom}-d${dark}-a${dark_always}-r${rel}-c${cliff_delta}-${ROCK_IMG_ALGO}.gpkg.zst"
          {
            echo "asset=$ASSET"
            echo "zoom=$zoom"
            echo "count=$count"
            echo "total_km2=$total_km2"
          } >> "$GITHUB_OUTPUT"

      # keď zlepovanie spadne, rozrobené prežije. Kľúč má na konci `-s`: pod
      # kľúčom bez neho leží to, čo uložil job `vektor`, a existujúci sa
      # prepísať nedá. `restore-keys` hľadá po predpone.
      - name: Cache rozrobeného (save)
        if: ${{ failure() && hashFiles('tiles-cache/_rozrobene/**') != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: |
            tiles-cache/_rozrobene
            tiles-cache/_stiahnute.txt
          key: shading-vektor-${{ needs.dlazdice.outputs.key }}-z${{ inputs.zoom }}-${{ github.run_id }}-s

      - name: GeoJSON navyše
        run: |
          set -euo pipefail
          ogr2ogr -f GeoJSON out/rock.geojson data/rock.gpkg rock \
            -lco COORDINATE_PRECISION=6 -lco RFC7946=YES
          ls -lh data/rock.gpkg out/rock.geojson

      # iba polygóny – náhľad a čísla sú vedľa, nech sa dajú vziať samé.
      # Ten istý GPKG ide nižšie aj do skladu `dem-rocks-img` pre Build map.
      - name: Odlož polygóny do skladu
        continue-on-error: true
        env:
          NAZOV: skaly-obrazok-${{ needs.dlazdice.outputs.key }}-z${{ needs.dlazdice.outputs.zoom }}
          SUBORY: |
            data/rock.gpkg
            out/rock.geojson
          POPIS: Skalné polygóny z tieňovania – GPKG aj GeoJSON
        run: workers/deploy/publish-results.sh

      # dlaždice odložil job `dlazdice` a náhľad job `vektor` – oboje hneď,
      # ako vzniknú
      - name: Odlož čísla
        if: ${{ always() && hashFiles('out/rock-img-stats.txt') != '' }}
        continue-on-error: true
        env:
          NAZOV: cisla-${{ needs.dlazdice.outputs.key }}-z${{ needs.dlazdice.outputs.zoom }}
          SUBORY: out/rock-img-stats.txt
          POPIS: Čísla behu – koľko plôch, aké prahy, koľko dlaždíc
        run: workers/deploy/publish-results.sh

      # vstup pre Build map pod menom, ktoré si vypýta. Artefakt behu sa
      # z iného workflowu dostáva ťažko, súbor v sklade ľahko. Nie je to to
      # isté ako „Odlož polygóny do skladu" vyššie (tá vec je na pozretie).
      - name: Ulož do skladu na Drive
        run: |
          set -euo pipefail
          ASSET='${{ steps.rocks.outputs.asset }}'
          zstd -q -19 -T0 -f -o "/tmp/$ASSET" data/rock.gpkg
          ls -lh "/tmp/$ASSET"
          python3 workers/drive/store.py --put --store="$ROCK_IMG_STORE" \
            --file="/tmp/$ASSET" \
            --note="Polygóny nájdené ako tmavé plochy v hillshade dlaždiciach freemap.sk. Meno nesie výrez, zoom a všetky prahy; Build map si ich vypýta výberom rock_source: tienovanie."
          echo "Uložené do skladu $ROCK_IMG_STORE ako $ASSET"

      - name: Súhrn
        if: ${{ always() }}
        run: |
          set -euo pipefail
          {
            echo "## Dáta · tieňované skaly"
            echo
            echo "**${{ needs.dlazdice.outputs.name }}** – bbox \`${{ needs.dlazdice.outputs.bbox }}\` (${{ needs.dlazdice.outputs.km2 }} km²)"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -s out/rock-img-stats.txt ]; then
            . out/rock-img-stats.txt
            {
              echo "| | |"
              echo "|---|---|"
              echo "| zoom | z${zoom} (${px_m} m na pixel) |"
              echo "| dlaždice | ${tiles} (${mb_downloaded} MB, ${tiles_missing} chýbalo, ${tiles_failed} zlyhalo) |"
              echo "| mozaika | ${cells} pixelov |"
              echo "| prah | nikdy nad ${dark}, vždy pod ${dark_always}, medzi tým ${rel} pod pozadím (okno ${local_m} m) |"
              echo "| štruktúra | ${fill_m} m vyplnenie (0 = jemná sieť žliabkov) |"
              echo "| **skalných plôch** | **${count}** (z toho ${cliff} \`cliff\`), ${dropped} pod ${min_area_m2} m² zahodených |"
              echo "| **plocha spolu** | **${total_km2} km²**, najväčšia $((max_m2 / 10000)) ha |"
              echo "| diery | ${holes} zachovaných, ${holes_dropped} pod ${min_hole_m2} m² zahodených |"
              echo "| veľkosť dát | ${out_mb} MB = **${mb_per_km2} MB na km² skál** |"
              echo "| trvanie | ${seconds} s |"
              echo
              echo "V sklade \`$ROCK_IMG_STORE\`: \`${{ steps.rocks.outputs.asset }}\`"
              echo
              echo "### Ďalej"
              echo
              echo "1. Stiahni artefakt \`nahlad-…\` (odložil ho job *Obrysy po blokoch*) a pozri \`preview.png\` – vľavo mozaika tieňovania, vpravo to isté s červenou maskou. Podľa toho doladiť \`dark\` / \`dark_always\` / \`rel\`."
              echo "2. Ladenie zrýchli výber \`test\` – na 4 km² sú to minúty a beh rovno ukáže, kde ten štvorec leží."
              echo "3. Keď to sedí, spusti **Build map** s výberom \`rock_source: tienovanie\` a rovnakým \`area\` – vezme si najnovší asset pre tento výrez namiesto počítania skál z DEM."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Beh sa nedostal po štatistiku – pozri log kroku *Skaly z tmavých plôch*." >> "$GITHUB_STEP_SUMMARY"
          fi
