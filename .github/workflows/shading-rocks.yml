name: Data · shaded rocks

# An EXPERIMENTAL second way to rocks: no slope from a DEM, but dark areas in the
# finished freemap.sk hillshade. The output has the format of rocks from a DEM,
# so Build map can ask for it with `rock_source: shading`.
#
# The computation is in workers/rocks-shading/build.py. Three jobs: `tiles`,
# `vector`, `rocks` – the time cap is per job and one may not fit it all.
#
# Hillshade is slope lit from one side, so this way systematically misses
# south-east walls; in exchange it has ~0.8 m/px (z17). The first run is for
# tuning: the `preview-…` result shows the mosaic beside the areas found.

on:
  workflow_dispatch:
    inputs:
      area:
        description: "The range to look for rocks in (its bbox is in workers/data/areas.json)"
        required: true
        default: vysoke_tatry
        type: choice
        options:
          - tatry
          - vysoke_tatry
          - belianske_tatry
          - zapadne_tatry
          - nizke_tatry
          - slovensky_raj
          - pieniny
          - mala_fatra
          - velka_fatra
          - sulovske_skaly
          - slovensky_kras
          - muranska_planina
          - vihorlat
          - strazovske_vrchy
          - male_karpaty
      # `auto` = the highest fitting the tile cap and time budget; z17 is the cap
      zoom:
        description: "Zoom of the tiles the rocks are computed from (auto = the highest possible)"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - "17"
          - "16"
          - "15"
      # for tuning thresholds: minutes instead of tens of minutes
      test:
        description: "Quick test: compute only a small square (km²) in the middle of the cut-out"
        required: false
        default: "no"
        type: choice
        options:
          - "no"
          - "1"
          - "2"
          - "4"
          - "5"
          - "10"
      dark:
        description: "Over this grey (0–255) there is NEVER rock – the threshold's upper cap"
        required: false
        default: "125"
        type: string
      dark_always:
        description: "Under this grey there is ALWAYS rock, whatever is around"
        required: false
        default: "70"
        type: string
      rel:
        description: "In between: how far a pixel must be under the local background to count"
        required: false
        default: "18"
        type: string
      cliff:
        description: "How many grey levels darker the `cliff` class (a marked wall) starts instead of `steep`"
        required: false
        default: "25"
        type: string
      # smaller areas are JPEG grain; 7 m² is ~11 pixels at z17
      min_area:
        description: "The smallest rock area in m²"
        required: false
        default: "7"
        type: string
      # e.g. `local=2000 smooth=2 jobs=8`. The most useful:
      #   open=0/6         keep even the thinnest threads / only marked walls
      #   fill=40          solid areas instead of a fine network
      #   solid=0          the `cliff` class too, as before
      #   fill_holes=1     fill holes (eats detail)
      #   budget_min=150   stop outlines after 150 min (0 = no cap)
      #   fresh=1          don't resume the work in progress
      # The full list is in workers/rocks-shading/build.py; an unknown key is an error.
      options:
        description: "Rarely changed options as key=value (see workers/rocks-shading/build.py)"
        required: false
        default: ""
        type: string
  # Build map calls it too with `rock_source: shading`; `workflow_call` has no
  # `type: choice`, so bare strings come here
  workflow_call:
    inputs:
      area:
        required: true
        type: string
      zoom:
        required: false
        default: auto
        type: string
      # Build map passes the test square's bbox directly, so `no`
      test:
        required: false
        default: "no"
        type: string
      dark:
        required: false
        default: "125"
        type: string
      dark_always:
        required: false
        default: "70"
        type: string
      rel:
        required: false
        default: "18"
        type: string
      cliff:
        required: false
        default: "25"
        type: string
      min_area:
        required: false
        default: "7"
        type: string
      options:
        required: false
        default: ""
        type: string
    outputs:
      # the store file name – the build asks for exactly these rocks, not the newest
      asset:
        description: "File name of the rocks in store dem-rocks-img"
        value: ${{ jobs.rocks.outputs.asset }}
      zoom:
        description: "Zoom of the tiles the rocks were computed from"
        value: ${{ jobs.tiles.outputs.zoom }}
      count:
        description: "Number of rock areas found"
        value: ${{ jobs.rocks.outputs.count }}
    # `workflow_call` doesn't inherit secrets; without them the Drive cache is shut
    secrets:
      GDRIVE_CREDENTIALS:
        required: false
      DRIVE_SECRET:
        required: false
      DRIVE_REFRESH:
        required: false

# polygons go to a Drive store, not a release
permissions:
  contents: read

concurrency:
  # two runs on the same range would pull twice the tiles from freemap.sk
  group: shading-rocks-${{ inputs.area }}
  cancel-in-progress: false

env:
  # this sub-pipeline's cache is on Drive: gigabytes of JPG crowded out GitHub's 10 GB
  GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
  DRIVE_CLIENT: ${{ vars.DRIVE_CLIENT }}
  DRIVE_SECRET: ${{ secrets.DRIVE_SECRET }}
  DRIVE_REFRESH: ${{ secrets.DRIVE_REFRESH }}
  # an XYZ template without metadata – the highest zoom is found by a probe tile
  SHADING_URL: "https://sk-hires-shading.tiles.freemap.sk/{z}/{x}/{y}.jpg"
  # not `dem-rocks` on purpose: those are from a DEM, these from an image
  ROCK_IMG_STORE: dem-rocks-img
  # the algorithm version in the file name: another algorithm = other rocks
  ROCK_IMG_ALGO: v3
  # the region here is the whole area that tile layer exists on
  SK_BBOX: "16.79,47.71,22.58,49.63"
  # a cap on the run's tiles; 60 000 is ~1.5 GB of data and ~4 G pixels
  MAX_TILES: "60000"

jobs:
  # three jobs, not one: the time cap is per job and a timeout loses what was done
  tiles:
    name: Download tiles
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.area.outputs.key }}
      name: ${{ steps.area.outputs.name }}
      bbox: ${{ steps.area.outputs.bbox }}
      km2: ${{ steps.area.outputs.km2 }}
      # with `zoom: auto` the probe and budget pick it – out, so later jobs needn't guess
      zoom: ${{ steps.dl.outputs.zoom }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Tools
        run: python3 -m pip install --quiet numpy pillow

      # `test` is only a smaller bbox; its key gets `_test<km²>`, apart from real runs
      - name: Cut-out → bbox
        id: area
        run: |
          set -euo pipefail
          TEST='${{ inputs.test }}'
          case "$TEST" in no|nie|'') TEST=0 ;; esac
          python3 workers/plan/area.py \
            --region-bbox="$SK_BBOX" \
            --area='${{ inputs.area }}' \
            --test-km2="$TEST" \
            --out="$GITHUB_OUTPUT"

      # without it "no rock found" can't be read: strict thresholds, or a meadow
      - name: Where the test cut-out is
        if: ${{ inputs.test != 'no' && inputs.test != 'nie' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 workers/plan/test-map.py \
            --bbox='${{ steps.area.outputs.bbox }}' \
            --full-bbox='${{ steps.area.outputs.full_bbox }}' \
            --name='${{ steps.area.outputs.name }}' \
            --layers="rocks from hillshading, zoom ${{ inputs.zoom }}" \
            --png=out/where-it-is.png --md=out/where-it-is.md
          cat out/where-it-is.md >> "$GITHUB_STEP_SUMMARY"

      # into the `results` Drive store, not a run artifact (`workers/deploy/publish-results.sh`)
      - name: Keep the test cut-out image
        if: ${{ always() && hashFiles('out/where-it-is.png') != '' }}
        continue-on-error: true
        env:
          NAME: where-it-is-${{ steps.area.outputs.key }}
          PATHS: out/where-it-is.png
          NOTE: Where in the region the test cut-out lies (rocks from hillshading)
        run: workers/deploy/publish-results.sh

      # what was downloaded isn't downloaded again for a threshold tweak; the save
      # key carries the run number, an existing key isn't overwritten
      - name: Tile cache (restore)
        id: tiles-cache
        uses: ./.github/actions/cache-restore
        with:
          path: tiles-cache
          key: shading-tiles-${{ steps.area.outputs.key }}-z${{ inputs.zoom }}-${{ github.run_id }}
          restore-keys: |
            shading-tiles-${{ steps.area.outputs.key }}-z${{ inputs.zoom }}-

      - name: Download tiles
        id: dl
        run: |
          set -euo pipefail
          python3 workers/rocks-shading/build.py \
            --bbox='${{ steps.area.outputs.bbox }}' \
            --url="$SHADING_URL" \
            --zoom='${{ inputs.zoom }}' \
            --max-tiles="$MAX_TILES" \
            --cache-dir=tiles-cache \
            --phase=download \
            --zoom-out="$GITHUB_OUTPUT" \
            --options='${{ inputs.options }}' \
            --out=data/rock.gpkg

      - name: Tile cache (save)
        if: ${{ always() && hashFiles('tiles-cache/**') != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: tiles-cache
          key: shading-tiles-${{ steps.area.outputs.key }}-z${{ inputs.zoom }}-${{ github.run_id }}

      # the images alone into `results`; intermediates belong to the cache, so aside
      - name: Keep the downloaded tiles in the store
        if: ${{ always() && hashFiles('tiles-cache/**') != '' }}
        continue-on-error: true
        env:
          NAME: shading-tiles-${{ steps.area.outputs.key }}-z${{ steps.dl.outputs.zoom }}
          NOTE: Hillshading JPG tiles from freemap.sk the rocks were looked for in
        run: |
          set -uo pipefail
          mv tiles-cache/_in_progress "$RUNNER_TEMP/_in_progress" 2>/dev/null || true
          PATHS=tiles-cache workers/deploy/publish-results.sh
          mv "$RUNNER_TEMP/_in_progress" tiles-cache/_in_progress 2>/dev/null || true

  # the most expensive part (darkness raster and `gdal_contour` in blocks, hours);
  # a job of its own so finished blocks survive a timeout
  vector:
    name: Outlines in blocks
    needs: tiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin
          python3 -m pip install --quiet numpy pillow
          # `gdalinfo --version`: `gdal_contour` has no version switch and would fail the job
          gdalinfo --version

      # the same key as the first job including the run number; `restore-keys` as a fallback
      - name: Tile cache (restore)
        uses: ./.github/actions/cache-restore
        with:
          path: tiles-cache
          key: shading-tiles-${{ needs.tiles.outputs.key }}-z${{ inputs.zoom }}-${{ github.run_id }}
          restore-keys: |
            shading-tiles-${{ needs.tiles.outputs.key }}-z${{ inputs.zoom }}-

      # earlier runs' work in progress – finished blocks aren't computed again
      - name: Work in progress cache (restore)
        uses: ./.github/actions/cache-restore
        with:
          path: |
            tiles-cache/_in_progress
            tiles-cache/_downloaded.txt
          key: shading-vector-${{ needs.tiles.outputs.key }}-z${{ inputs.zoom }}-${{ github.run_id }}
          restore-keys: |
            shading-vector-${{ needs.tiles.outputs.key }}-z${{ inputs.zoom }}-

      - name: Darkness raster and outlines
        run: |
          set -euo pipefail
          mkdir -p data out
          python3 workers/rocks-shading/build.py \
            --bbox='${{ needs.tiles.outputs.bbox }}' \
            --url="$SHADING_URL" \
            --phase=vector \
            --zoom='${{ needs.tiles.outputs.zoom }}' \
            --max-tiles="$MAX_TILES" \
            --dark='${{ inputs.dark }}' \
            --dark-always='${{ inputs.dark_always }}' \
            --rel='${{ inputs.rel }}' \
            --cliff='${{ inputs.cliff }}' \
            --min-area='${{ inputs.min_area }}' \
            --cache-dir=tiles-cache \
            --preview=out/preview.png \
            --options='${{ inputs.options }}' \
            --out=data/rock.gpkg

      # saved after a failure and a timeout too – the whole point of splitting
      - name: Work in progress cache (save)
        if: ${{ always() && hashFiles('tiles-cache/_in_progress/**') != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: |
            tiles-cache/_in_progress
            tiles-cache/_downloaded.txt
          key: shading-vector-${{ needs.tiles.outputs.key }}-z${{ inputs.zoom }}-${{ github.run_id }}

      # the preview comes with the darkness raster and thresholds are tuned by it
      - name: Keep the preview
        if: ${{ always() && hashFiles('out/preview.png') != '' }}
        continue-on-error: true
        env:
          NAME: preview-${{ needs.tiles.outputs.key }}-z${{ needs.tiles.outputs.zoom }}
          PATHS: out/preview.png
          NOTE: The darkness raster as a preview – thresholds are tuned by it
        run: workers/deploy/publish-results.sh

  # minutes, not hours: join, stitch, filter and smooth; a `min_area` change
  # is no reason to compute outlines again
  rocks:
    name: Rocks from hillshading
    needs: [tiles, vector]
    runs-on: ubuntu-latest
    outputs:
      asset: ${{ steps.rocks.outputs.asset }}
      count: ${{ steps.rocks.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # spatialite: `ST_Union` stitches areas cut by a block edge; without it straight cuts
          sudo apt-get install -y -qq gdal-bin zstd libsqlite3-mod-spatialite
          python3 -m pip install --quiet numpy pillow
          gdalinfo --version

      # stitching works on outlines, not images – the tile cache isn't restored
      - name: Work in progress cache (restore)
        uses: ./.github/actions/cache-restore
        with:
          path: |
            tiles-cache/_in_progress
            tiles-cache/_downloaded.txt
          key: shading-vector-${{ needs.tiles.outputs.key }}-z${{ inputs.zoom }}-${{ github.run_id }}
          restore-keys: |
            shading-vector-${{ needs.tiles.outputs.key }}-z${{ inputs.zoom }}-

      - name: Joining blocks and filter
        id: rocks
        run: |
          set -euo pipefail
          . workers/lib/store-area.sh
          mkdir -p data out
          python3 workers/rocks-shading/build.py \
            --bbox='${{ needs.tiles.outputs.bbox }}' \
            --url="$SHADING_URL" \
            --phase=join \
            --zoom='${{ needs.tiles.outputs.zoom }}' \
            --max-tiles="$MAX_TILES" \
            --dark='${{ inputs.dark }}' \
            --dark-always='${{ inputs.dark_always }}' \
            --rel='${{ inputs.rel }}' \
            --cliff='${{ inputs.cliff }}' \
            --min-area='${{ inputs.min_area }}' \
            --cache-dir=tiles-cache \
            --stats=out/rock-img-stats.txt \
            --options='${{ inputs.options }}' \
            --out=data/rock.gpkg

          # the name carries the cut-out and all settings, so runs don't overwrite each other
          . out/rock-img-stats.txt
          ASSET="rockimg-$(store_area '${{ needs.tiles.outputs.key }}')-z${zoom}-d${dark}-a${dark_always}-r${rel}-c${cliff_delta}-${ROCK_IMG_ALGO}.gpkg.zst"
          {
            echo "asset=$ASSET"
            echo "zoom=$zoom"
            echo "count=$count"
            echo "total_km2=$total_km2"
          } >> "$GITHUB_OUTPUT"

      # a failed stitch keeps the work; `-s` since `vector`'s key can't be overwritten
      - name: Work in progress cache (save)
        if: ${{ failure() && hashFiles('tiles-cache/_in_progress/**') != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: |
            tiles-cache/_in_progress
            tiles-cache/_downloaded.txt
          key: shading-vector-${{ needs.tiles.outputs.key }}-z${{ inputs.zoom }}-${{ github.run_id }}-s

      - name: GeoJSON too
        run: |
          set -euo pipefail
          ogr2ogr -f GeoJSON out/rock.geojson data/rock.gpkg rock \
            -lco COORDINATE_PRECISION=6 -lco RFC7946=YES
          ls -lh data/rock.gpkg out/rock.geojson

      # polygons only, to look at; the same GPKG goes to `dem-rocks-img` below for Build map
      - name: Keep the polygons in the store
        continue-on-error: true
        env:
          NAME: rocks-image-${{ needs.tiles.outputs.key }}-z${{ needs.tiles.outputs.zoom }}
          PATHS: |
            data/rock.gpkg
            out/rock.geojson
          NOTE: Rock polygons from hillshading – GPKG and GeoJSON
        run: workers/deploy/publish-results.sh

      - name: Keep the numbers
        if: ${{ always() && hashFiles('out/rock-img-stats.txt') != '' }}
        continue-on-error: true
        env:
          NAME: numbers-${{ needs.tiles.outputs.key }}-z${{ needs.tiles.outputs.zoom }}
          PATHS: out/rock-img-stats.txt
          NOTE: The run's numbers – how many areas, which thresholds, how many tiles
        run: workers/deploy/publish-results.sh

      # Build map's input under the name it asks for; a store file is easy to reach
      - name: Save to the Drive store
        run: |
          set -euo pipefail
          ASSET='${{ steps.rocks.outputs.asset }}'
          zstd -q -19 -T0 -f -o "/tmp/$ASSET" data/rock.gpkg
          ls -lh "/tmp/$ASSET"
          python3 workers/drive/store.py --put --store="$ROCK_IMG_STORE" \
            --file="/tmp/$ASSET" \
            --note="Polygons found as dark areas in freemap.sk hillshade tiles. The name carries the cut-out, zoom and all thresholds; Build map asks for them with rock_source: shading."
          echo "Saved to store $ROCK_IMG_STORE as $ASSET"

      - name: Summary
        if: ${{ always() }}
        run: |
          set -euo pipefail
          {
            echo "## Data · shaded rocks"
            echo
            echo "**${{ needs.tiles.outputs.name }}** – bbox \`${{ needs.tiles.outputs.bbox }}\` (${{ needs.tiles.outputs.km2 }} km²)"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -s out/rock-img-stats.txt ]; then
            . out/rock-img-stats.txt
            {
              echo "| | |"
              echo "|---|---|"
              echo "| zoom | z${zoom} (${px_m} m a pixel) |"
              echo "| tiles | ${tiles} (${mb_downloaded} MB, ${tiles_missing} missing, ${tiles_failed} failed) |"
              echo "| mosaic | ${cells} pixels |"
              echo "| threshold | never over ${dark}, always under ${dark_always}, in between ${rel} under the background (window ${local_m} m) |"
              echo "| structure | ${fill_m} m fill (0 = a fine gully network) |"
              echo "| **rock areas** | **${count}** (of them ${cliff} \`cliff\`), ${dropped} under ${min_area_m2} m² dropped |"
              echo "| **total area** | **${total_km2} km²**, largest $((max_m2 / 10000)) ha |"
              echo "| holes | ${holes} kept, ${holes_dropped} under ${min_hole_m2} m² dropped |"
              echo "| data size | ${out_mb} MB = **${mb_per_km2} MB per km² of rock** |"
              echo "| duration | ${seconds} s |"
              echo
              echo "In store \`$ROCK_IMG_STORE\`: \`${{ steps.rocks.outputs.asset }}\`"
              echo
              echo "### Next"
              echo
              echo "1. Get \`preview-…\` from the \`results\` store (the job *Outlines in blocks* kept it) and look at \`preview.png\` – the hillshading mosaic on the left, the same with a red mask on the right. Tune \`dark\` / \`dark_always\` / \`rel\` by it."
              echo "2. The \`test\` choice speeds tuning up – 4 km² takes minutes and the run shows where the square lies."
              echo "3. When it fits, run **Build map** with \`rock_source: shading\` and the same \`area\` – it takes the newest asset for this cut-out instead of computing rocks from a DEM."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The run didn't get to the stats – see the log of the step *Joining blocks and filter*." >> "$GITHUB_STEP_SUMMARY"
          fi
