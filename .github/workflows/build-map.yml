name: Mapa · Build map

# Stiahne PBF export IBA zvoleného regiónu z osm.fr regionálnych exportov
# (https://download.openstreetmap.fr/extracts/ – Európa aj svet, rezané po
# administratívnych hraniciach, denne aktualizované).
# Potom Planetiler → PMTiles → GitHub Pages.
#
# Detail a zoom:
#   Planetiler má tvrdý limit `maxzoom <= 16` (PlanetilerConfig.MAX_MAXZOOM).
#   Vyšší zoom (až z20) sa NEGENERUJE do dlaždíc – rieši ho MapLibre overzoomom
#   nad dlaždicami z16. Aby overzoom vyzeral ostro, generujeme najvyšší zoom
#   s nulovou simplifikáciou a bez zahadzovania malých prvkov.
#
# Ľubovoľný iný región Európy/sveta: vyplň input `custom_pbf_url`
# (URL na .osm.pbf z download.openstreetmap.fr/extracts/...) + `custom_name`.

on:
  workflow_dispatch:
    inputs:
      # Predvolený je kraj, na ktorom sa reálne pracuje, nie celé Slovensko:
      # formulár sa po každom otvorení vracia na predvolené hodnoty, takže
      # default je to, čo netreba prekliknúť. Bratislavský je najmenší kraj,
      # takže ostrý beh na CELÝ región (`area: cely_region`, `test` odškrtnutý)
      # je jedno kliknutie a nestojí hodiny – tie tri defaulty patria k sebe.
      region:
        description: "Región (ignoruje sa, ak je vyplnené custom_pbf_url)"
        required: true
        default: bratislavsky
        type: choice
        options:
          - slovensko
          - bratislavsky
          - trnavsky
          - trenciansky
          - nitriansky
          - zilinsky
          - banskobystricky
          - presovsky
          - kosicky
      # Celý kraj trvá ~40 min, jedno pohorie ~2. Ešte rýchlejší je switch
      # `test` pod týmto. Vlastný bbox: `options: area_bbox=W,S,E,N`.
      #
      # PREDVOLENE `cely_region`. Kým tu stálo `vysoke_tatry`, dostal ten, kto
      # si vybral iný kraj a tento riadok prehliadol, mapu bez vrstevníc a skál
      # skoro všade – a v logu o tom bolo len `::warning::`. Zmenšovanie behu
      # má JEDNU páku, switch `test` pod týmto; výrez ostáva na to, na čo je.
      area:
        description: "Pohorie, na ktorom sa počítajú vrstevnice a skaly"
        required: false
        default: cely_region
        type: choice
        options:
          - cely_region
          - tatry
          - vysoke_tatry
          - belianske_tatry
          - zapadne_tatry
          - nizke_tatry
          - slovensky_raj
          - pieniny
          - mala_fatra
          - velka_fatra
          - sulovske_skaly
          - slovensky_kras
          - muranska_planina
          - vihorlat
          - strazovske_vrchy
          - male_karpaty
      # Zaškrtávatko, nie číslo: veľkosť sa mení zriedka (4 km² sedia skoro
      # vždy), kým test sa zapína a vypína pri každom behu – a to je presne
      # rozdiel medzi switchom a textovým poľom. Veľkosť ostala ako voľba
      # `test_km2=4`.
      # PREDVOLENE VYPNUTÉ, hoci kedysi bolo zapnuté: zapnutý default dával
      # zmysel, kým bol predvolený výrez pohorie vo veľkom kraji. Odkedy je
      # default `bratislavsky` + `cely_region`, je predvolený beh ten, ktorý
      # naozaj vyrobí mapu na nasadenie – a zapnutý test by z nej ticho spravil
      # mapu s dierou (pravidlo 8). Kto ladí prah, si ho zaškrtne.
      # Kľúč testu má príponu `_test4` (číslo je z voľby `test_km2`), takže si
      # nesadne do cache ani na uložené výsledky ostrého behu, a jeho položka
      # ide do `maps-test.json` (viď workers/deploy/catalog.py).
      # Zmenší CELÝ BEH na štvorec zo stredu výrezu – terén aj samotnú mapu:
      # PBF sa oreže, takže dlaždice, trasy, prvky aj ZIP sú z tých 4 km².
      # Kým sa mapa nechávala celá, bol test polovičný (kraj sa aj tak stiahol,
      # prehnal Planetilerom, zabalil a nahral). Kde štvorec leží, ukáže
      # obrázok „kde to je“; rozpis vo `workers/plan/pbf.sh`.
      # Iná veľkosť: `options: test_km2=8`. Iné miesto: `options: test_at=lon,lat`.
      test:
        description: "Rýchly test: celý beh (mapa aj terén) len na 4 km² zo stredu výrezu"
        required: false
        default: false
        type: boolean
      # Tri výbery zdroja, jeden na vrstvu. Kým bol `dem_source` jeden pre
      # všetko, nedalo sa povedať to, čo dáva zmysel najčastejšie: skaly
      # z najjemnejšieho modelu (aj keď je len na výrez) a tieňovanie
      # z hrubšieho, ktorý pokrýva celý región. `ziadne` vrstvu vypne –
      # zapínač je tým pádom v tom istom poli ako zdroj a nie vedľa neho,
      # takže sa nedá zadať „generuj vrstevnice, zdroj žiadny".
      # Zoznam zdrojov drží workers/data/dem-sources.json (stráži to „Kontrola · lint workflowov").
      # sonny = 20 m, celý región. dmr35 = ÚGKK DMR 3.5, 10 m.
      # dmr5 = ÚGKK DMR 5.0 (LiDAR): s vyplneným `area` plné 1 m, bez neho
      # dlaždice na 5 m. Rozhoduje rozsah, nie ďalší výber: pri 1 m má jedna
      # 1° dlaždica ~48 GB a strop assetu 2 GB.
      contour_source:
        description: "Vrstevnice – z ktorého modelu terénu (ziadne = negenerovať)"
        required: false
        default: dmr5
        type: choice
        options:
          - sonny
          - sonny1
          - dmr35
          - dmr5
          - ziadne
      # Buď zo sklonu výškového modelu (sonny / dmr35 / dmr5), alebo
      # `tienovanie` = hotové polygóny z workflowu „Skaly z tieňovaných
      # dlaždíc“ – ten si build v prípade potreby zavolá sám.
      # Na skaly je `dmr5` s `area` najlepšie, čo máme – mriežka zdroja
      # stropuje skutočný detail obrysu.
      rock_source:
        description: "Skaly – zo sklonu modelu, alebo z tieňovania (ziadne = negenerovať)"
        required: false
        default: dmr5
        type: choice
        options:
          - sonny
          - sonny1
          - dmr35
          - dmr5
          - tienovanie
          - ziadne
      # Tieňovanie je vždy na celý región, takže tu `dmr5` vyjde na 5 m.
      shading_source:
        description: "Tieňovanie a 3D terén – z ktorého modelu (ziadne = negenerovať)"
        required: false
        default: dmr5
        type: choice
        options:
          - sonny
          - sonny1
          - dmr35
          - dmr5
          - ziadne
      # ČO TU STOJÍ ZA `contour_interval`, KTORÝ BOL NA TOMTO MIESTE:
      # `workflow_dispatch` dovolí NAJVIAC 10 inputov a nad tým GitHub workflow
      # ticho neprijme (beh bez jobov, červený krížik, prázdny log – stalo sa
      # to pri 26 inputoch). Formulár bol plný, takže si dva knôfle vymenili
      # miesto: interval vrstevníc má v DMR 5.0 dobrý default 5 m a mení sa pri
      # prechode do nížin, nie pri každom behu, takže sa píše ako voľba
      # (`options: contour_interval=10`) – to isté, čo sa kedysi stalo
      # s `test_km2`. Články sa naopak zapínajú a vypínajú podľa toho, či ide
      # o ostrý build alebo ladenie terénu, a to je práca pre zaškrtávatko.
      # Predvolene ZAPNUTÉ: kraj je pri dávkach po päťdesiatich otázka sekúnd
      # (namerané 18 ms na článok), takže sa nemá čo šetriť.
      rock_slope:
        description: "Od akého sklonu (°) je terén skala (50 = steny, 40 = aj strmé svahy)"
        required: false
        default: "50"
        type: string
      # Zmaže cache aj uloženú verziu v sklade. Pri zapnutom switchi `test`
      # sa pregenerúva vždy všetko, nech neladíš na výsledku z cache – toto
      # pole je vtedy jedno.
      # `tienovanie` sa volalo `teren` – jediné miesto, kde sa tá vrstva volala
      # inak než vo `shading_source`, v balíku `-tienovanie.zip` a v katalógu.
      # Staré meno ostáva prijímané (`REBUILD_ALIAS` v plan/options.py), len sa
      # už neponúka. `skaly` od tej istej zmeny zahodí aj rozrobené obrysy
      # podpipeline tieňovania. Rozpis a strážca: `workers/lint/rebuild.py`.
      rebuild:
        description: "Čo pregenerovať nanovo, aj keď to už je v cache"
        required: false
        default: nic
        type: choice
        options:
          - nic
          - vrstevnice
          - skaly
          - tienovanie
          - vsetko
      # DESIATY A POSLEDNÝ INPUT. `workflow_dispatch` ich dovolí najviac 10
      # a nad tým GitHub workflow ticho neprijme (beh bez jobov, červený
      # krížik, prázdny log) – ďalší prepínač sa sem už nezmestí a musí ísť
      # do `options`. Bolo to voľbou `publish_pages=false`, ale nasadenie na
      # Pages je otázka „kam to má ísť", nie zriedka menené nastavenie:
      # rozhoduje sa pri behu a je to jedno kliknutie, presne ako `test`.
      #
      # Vypnuté NEZNAMENÁ, že sa mapa nepostaví: `_site` vznikne a prejde
      # kontrolou úplne rovnako (z toho istého `_site` je aj balík na Drive),
      # len sa nenahrá cez `actions/deploy-pages` a nespustí sa smoke test
      # nasadenej stránky. Publikovanie na Drive je nezávislá páka –
      # `options: publish=false` – takže sa dá mať aj jedno bez druhého.
      publish_pages:
        description: "Nasadiť hotovú mapu na GitHub Pages (odškrtnuté = len na Drive)"
        required: false
        default: true
        type: boolean
      # Napr. `crop_bbox=18.9,49.1,19.2,49.3 size_limit_mb=1200`.
      # Veľkosť rýchleho testu: `test_km2=8` (default 4).
      # Mriežka na obrys skál: `rock_res=1` (default auto).
      # Celý zoznam aj s predvolenými hodnotami je vo workers/plan/options.py
      # a neznámy kľúč je chyba, nie ticho ignorovaná hodnota.
      options:
        description: "Zriedka menené nastavenia ako kľúč=hodnota (viď workers/plan/options.py)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # PRIHLÁSENIE NA DRIVE PRE CELÝ BUILD, a nie po jobe. Z Drive sa v ňom číta
  # na štyroch miestach (DMR 5.0 vo výreze aj v dlaždiciach, Sonnyho priečinok,
  # sklon pre skaly) a odteraz je na ňom aj CACHE – to je ďalších dvadsať
  # krokov (`.github/actions/cache-restore` a `-save`, rozpis vo
  # `workers/drive/cache.py`). Keby token stál pri každom jobe zvlášť, stačí na
  # jeden zabudnúť a ten sa ticho vráti k počítaniu všetkého odznova. Stráži to
  # „Kontrola · lint workflowov".
  GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
  DRIVE_CLIENT: ${{ vars.DRIVE_CLIENT }}
  DRIVE_SECRET: ${{ secrets.DRIVE_SECRET }}
  DRIVE_REFRESH: ${{ secrets.DRIVE_REFRESH }}
  OSMFR_BASE: https://download.openstreetmap.fr/extracts
  # Glyfy (fonty) si hostíme sami – verejná služba fonts.openmaptiles.org je
  # jediný bod zlyhania, pri ktorom sa mapa vykreslí bez akýchkoľvek nápisov.
  # (Zdroje ikoniek sú v poc/web/icon-sources.js.)
  GLYPHS_ZIP: https://github.com/openmaptiles/fonts/releases/download/v2.0/noto-sans.zip
  # SKLADY NA DRIVE, nie GitHub releasy. Do releasov sa nepublikuje nič –
  # celý formát skladu, prihlásenie aj „clobber" je vo `workers/drive/store.py`
  # a mená súborov ostali tie isté, aké mali assety (meno je sľub o rozsahu).
  #
  # Sklad s dlaždicami Sonny's LiDAR DTM (napĺňa ho workflow "Dáta · výškové modely").
  DEM_STORE: dem-sonny
  # Druhý Sonnyho model (1″ .hgt z Drive). Zvislý krok 1 m namiesto 0,1 m,
  # takže skaly z neho vyjdú polámanejšie – rozpis v data/dem-sources.json.
  SONNY1_STORE: dem-sonny1
  # Otvorené dáta ÚGKK (DMR 3.5). Tie isté 1°×1° dlaždice ako Sonny, len
  # z iného modelu – napĺňa ich „Dáta · výškové modely" so `source: dmr35`.
  DMR35_STORE: dem-dmr35
  # ÚGKK DMR 5.0 (LLS) – opäť tie isté 1°×1° dlaždice, mriežka 5 m. Napĺňa
  # ich job `mirror-dmr5-tiles` cez „Dáta · DMR 5.0" – po stupňoch, ktoré
  # bbox pretína (celé Slovensko naraz netreba).
  DMR5_STORE: dem-dmr5-v2
  # Výrez DMR 5.0 v plnom 1 m rozlíšení, jeden COG na pohorie.
  UGKK_STORE: dem-ugkk
  # Vrstevnice: rovnaká dvojica ako pri skalách nižšie a z rovnakého dôvodu.
  # Vrstevnica je izolínia nad rastrom, takže chodí po hranách buniek – pri
  # 1 m DEM je jeden schodík meter a pixel dlaždice má pri z16 1,57 m, čiže
  # tie schodíky sú v mape vidieť ako zúbky na čiare.
  #
  # Najprv sa schodíky zmažú (`-simplify`), až potom sa zaoblia rohy, čo po
  # nich ostali. Opačné poradie by zaoblilo každý schodík zvlášť: viac bodov
  # a čiara stále schodíková, len s oblými schodmi.
  #
  # Vyhladenie SAMOTNÉHO DEM pred trasovaním – okno priemeru v METROCH.
  # Toto je tá páka, ktorá zubatosť naozaj odstráni; `-simplify` a Chaikin
  # nižšie ju len zaokrúhlia. `gdal_contour` interpoluje priesečník na hrane
  # bunky, takže z hladkého poľa výšok vyjde hladká čiara aj bez úprav – čo ju
  # krčí, je mikroreliéf v LiDARovom DTM (kry, balvany, šum na decimetroch).
  #
  # LENŽE V TOM OKNE NIE JE LEN ŠUM. Okno 5×5 zmazalo aj tvary, ktoré v teréne
  # naozaj sú – rebro, žľab, terasu širokú pár metrov – a z toho boli tie
  # priveľmi oblé vrstevnice. Merané na simulovanom teréne, ktorý má okrem šumu
  # (σ = 0,15 m na 1 m mriežke) aj reálne tvary s vlnovou dĺžkou 60 / 25 / 12 m;
  # posledné dva stĺpce sú, koľko z tvaru na čiare ostalo:
  #
  #   okno 5×5, 1/2 bunky, 2× Chaikin (doteraz)  436 b., lom 10,6°, 1,52 m, 75 %, 27 %
  #   okno 3×3, 1/4 bunky, 2× Chaikin (teraz)    860 b., lom  8,2°, 0,70 m, 93 %, 63 %
  #   okno 7×7, 1/2 bunky, 2× Chaikin            336 b., lom 10,8°, 2,23 m, 58 %,  5 %
  #
  # Menšie okno teda nie je ústupok: odchýlka od skutočnej izolínie klesla
  # z 1,52 na 0,70 m a lomy sú MENŠIE než predtým. Platí sa bodmi (2×).
  # Podrobne vo `workers/contours-rocks/build.sh`.
  #
  # V METROCH, nie v bunkách – preto sa to smie zapnúť predvolene. Okno je
  # vždy nepárny násobok bunky, takže „2" je na 1 m LiDARe okno 3×3, kým na
  # 5 m dlaždiciach DMR 5.0 aj na Sonnyho 20 m vyjde jedna bunka a nehladí sa
  # nič. Hrubý model mikroreliéf neobsahuje (je v ňom spriemerovaný už zo
  # zdroja) a okno „3×3 buniek" by v ňom zmazalo desiatky metrov terénu.
  # 0 = vypnuté.
  CONTOUR_DEM_LOWPASS: "2"
  # Záporné číslo = koľko ŠTVRTÍN bunky DEM (tolerancia sa počíta z orezaného
  # rastra, nie z konštanty – model má raz 1 m a raz 20 m). 0 = vypnuté,
  # kladné číslo sa berie v metroch.
  #
  # -1, teda štvrtina bunky. Polovica bunky odrezáva to isté, čo priveľké okno
  # vyššie: dlhé segmenty po nej dávajú Chaikinovi veľké rohy na orezanie,
  # takže sa spolu s nimi zaoblí aj tvar terénu (12 m tvar prežil na 52 %
  # namiesto 63 %, odchýlka 0,95 namiesto 0,70 m).
  CONTOUR_SIMPLIFY: "-1"
  # Zaoblenie rohov, ktoré po zjednodušení ostali: dovolený PRIEHYB TETIVY
  # v štvrtinách kroku mriežky dlaždice (`extent` 4096) na maxzoome vrstevníc.
  # 0 = vypnuté. Zaobľuje sa limitnou krivkou (kvadratický B-spline), nie
  # dvoma prechodmi Chaikina – tie sa k nej len blížia a nechávajú zo 120°
  # rohu vyše 30°, čiže PRAVIDELNÝ zub v rozostupe vrcholov po
  # Douglas–Peuckerovi (na hotovej mape 14,7 na kilometer).
  #
  # DVA = POLOVICA KROKU MRIEŽKY, a je to presne toľko, koľko zaokrúhlenie do
  # dlaždice spraví aj tak (±pol kroku): jemnejšie vzorkovanie teda platí body
  # za detail, ktorý mriežka zahodí. Namerané na 5 m modeli celou cestou cez
  # gdal_contour: proti doterajším dvom prechodom Chaikina 7× menej zubov pri
  # ROVNAKOM počte bodov (0,1 proti 0,7 zuba/km po mriežke z16, 56 421 proti
  # 56 792 bodom). Rozpis v hlavičke workers/contours-rocks/smooth-shapes.py.
  CONTOUR_SMOOTH: "2"
  # Skaly = najstrmšie úseky terénu, ako vektorové plochy. Ladenie je tu
  # v env, aby inputov workflowu nebolo priveľa. Predvolené hodnoty idú na
  # maximálnu presnosť – nič sa nezahladzuje ani nezahadzuje:
  # Sklad s hotovými výškovými (hillshade) dlaždicami – aby sa nerobili znova.
  TERRAIN_STORE: dem-terrain
  # Sklad s hotovými skalami. Sú to desiatky minút výpočtu, ale závisia len
  # od územia a nastavení – tie sú preto v mene súboru a hotové skaly sa
  # nabudúce len stiahnu.
  ROCK_STORE: dem-rocks
  # Skaly nájdené ako tmavé plochy v tieňovaných dlaždiciach – napĺňa ich
  # workflow „Dáta · tieňované skaly". Build ich nikdy nepočíta, len
  # si ich vypýta výberom `rock_source: tienovanie`.
  ROCK_IMG_STORE: dem-rocks-img
  # Sklad častí rastra sklonu (workers/contours-rocks/slope-chunks.py). Na rozdiel od cache
  # nevyprší, takže hodina čítania z Drive sa nemá ako stratiť ani vtedy, keď
  # GitHub cache zahodí. Časti majú absolútnu mriežku, takže sa delia medzi
  # výrezmi: čo sa spočítalo pre vysoke_tatry, použijú aj tatry.
  SLOPE_STORE: dem-slope
  ROCK_RES: auto # záložná mriežka na sklon (m), keď voľba rock_res chýba
  # Mriežka, na ktorej sa TRASUJE obrys. Nemusí byť tá, na ktorej je uložený
  # sklon: pixel dlaždice má pri z16 – kam skaly idú – 1,57 m, takže obrys
  # z 1 m nesie detail, ktorý sa v mape nemá ako zobraziť, a stojí jedenásť-
  # násobok času (beh 31357217326: 0,71 mld. buniek, ~1:40 h; na 2 m je to
  # 0,18 mld. a rádovo 9 min). `auto` = najjemnejšia, ktorú je ešte vidieť
  # a ktorá sa zmestí do ROCK_BUDGET_MIN. Sklad sklonu sa tým nemení, takže
  # zmena tohto čísla neznamená ani jedno čítanie z Drive navyše.
  ROCK_VEC_RES: auto
  # Najmenšia skalná plocha sa dopočíta ako jedna bunka mriežky (pri 2 m teda
  # 4 m²) – menšie útvary sú už len zubaté artefakty jednej bunky, nie skala.
  # Zjednodušenie obrysu (m). -1 = štvrtina mriežky: zmaže schodíky po hranách
  # buniek, ale obrys neposunie o viac než štvrtinu bunky. 0 = vypnuté.
  ROCK_SIMPLIFY: "-1"
  # Zaoblenie obrysu – to isté ako CONTOUR_SMOOTH a tým istým skriptom, len
  # podľa mriežky na ROCK_MAXZOOM. Zjednodušenie vyššie zmaže schodíky, ale to,
  # čo po ňom ostane, sú ostré rohy: priemerný lom vyskočí zo 4,6° na 28,5°
  # a presne tak vyzerá skala pri max zoome zubatá. 0 = vypnuté.
  ROCK_SMOOTH: "2"
  # Verzia algoritmu v mene uloženého assetu. Zmena algoritmu = iné skaly,
  # takže sa nesmú použiť tie staré uložené. v3 = zaoblený obrys + auto
  # mriežka, v4 = obrys je limitná krivka, v5 = švy medzi blokmi sa naozaj
  # zlepia (dovtedy sa únia vždy zahodila, lebo vyšla v stupňoch – viď
  # `zlep_svy` vo `workers/lib/contour-blocks.py`). Bez zmeny čísla by sklad
  # vrátil staré skaly rozseknuté na hraniciach blokov a oprava by sa na už
  # spočítanom regióne neprejavila – pri zelenom builde.
  ROCK_ALGO: v5
  ROCK_CLIFF_PLUS: "15" # o koľko ° nad prahom začína trieda `cliff` (tmavšia)
  # Koľko buniek naraz. Sklon sa počíta po častiach, lebo bbox kraja má pri
  # 2 m vyše 3 miliardy buniek (~13 GB na jeden raster) – naraz sa to do
  # runnera nezmestí. 150 miliónov je ~600 MB na raster, čo je bezpečné.
  # Vektorizuje sa až hotová mozaika, jedným priechodom – po častiach by sa
  # diery prerezané hranicou časti stratili.
  ROCK_CHUNK_CELLS: "150000000"
  # Koľko minút MAJÚ skaly trvať. `0` = NEOBMEDZENE, a to je predvolené.
  #
  # Zastaviť to nezastavovalo už predtým – ani pred spustením, ani počas neho.
  # Vektorizácia je jeden nedeliteľný priechod nad celou mozaikou, takže zabitý
  # `gdal_contour` nenechá ani neúplný výsledok: zastavenie znamenalo presne to
  # isté ako timeout jobu, len skôr, a k tomu bez šance, že by beh dobehol.
  # Ostávalo z toho jediné: `rock_res: auto` podľa tohto čísla vyberal mriežku.
  #
  # A PRÁVE TO BOLO ZLE. „Koľko som ochotný čakať" je odpoveď, ktorú číslo
  # v env nepozná – kto spúšťa build na Vysoké Tatry, chce skaly z DMR 5.0
  # v tom rozlíšení, aké model má, nie hrubšie preto, že sa nezmestili do
  # tridsiatich minút. Pri `30` vychádzal pre Vysoké Tatry sklad na 2 m
  # (~24 min) a 1 m sa vôbec neponúkol (1:38), hoci job má 180 minút a v pohode
  # by dobehol. Odteraz `auto` berie najjemnejšiu mriežku, ktorá má zmysel –
  # teda desatinu bunky zdrojového DEM, najviac 1 m (viď `pick_res`).
  #
  # Kto sa ponáhľa, zadá mriežku natvrdo (`rock_res=2`); to je tá istá voľba,
  # len na správnom mieste – vo formulári behu, nie v konštante pre všetkých.
  # Stropy, ktoré ostali, sú timeout jobu (`rocks`, 180 min) a strop pamäte
  # (`ROCK_MAX_RSS_GB`); nad kladné číslo tu sa vypíše odhad a varovanie.
  ROCK_BUDGET_MIN: "0"
  # Strana bloku pri vektorizácii obrysu. `gdal_contour -p` nad celou mozaikou
  # naraz je superlineárny – čím viac rozpracovaných prstencov drží, tým
  # drahšie je pridať ďalší. Beh 31418794845 (689 km², sklad 1 m) spadol
  # z 2 %/min na 0,26 %/min a nedobehol vôbec. Po blokoch sa prstence
  # poskladajú rýchlo, pamäť je zhora ohraničená a HOTOVÝ BLOK OSTÁVA NA
  # DISKU, takže zrušený beh sa dá nadviazať. Plochu preseknutú hranicou
  # bloku (aj dieru v nej) zlepí späť únia švov.
  # 0 = jeden priechod nad celou mozaikou, teda staré správanie.
  ROCK_BLOCK_PX: "4096"
  ROCK_MAX_RSS_GB: "12" # nad tým sa gdal_contour zastaví s hláškou, nie OOM
  # Ako často má byť počuť, že sa počíta. Percentá idú nezávisle od toho, po
  # 2,5 % (`workers/lib/watch.py`), tep k nim dopĺňa pamäť, CPU, disk a rast výstupu.
  ROCK_HEARTBEAT_S: "30"
  # Rozpočet stránky si joby delia podielom, nie „čo zvýšilo" – bežia
  # súbežne, takže v čase, keď Planetiler rozhoduje o zoome, ešte nikto
  # nevie, aké veľké budú vrstevnice. Podiely sú s rezervou nad namerané
  # hodnoty (vrstevnice 187 MB = 21 %, terén 96 MB = 11 % z 900 MB).
  BUDGET_CONTOURS_PCT: "25"
  # Skaly majú vlastný .pmtiles, takže aj vlastný podiel na rozpočte
  # stránky. Predtým sa delili o podiel vrstevníc a doplácali na to: aby
  # sa zmestili spolu, musel ísť dole maxzoom obom.
  BUDGET_ROCKS_PCT: "12"
  BUDGET_TERRAIN_PCT: "12"
  # Značené trasy sú len línie s pár atribútmi – celé Slovensko je jednotky
  # MB. 3 % z rozpočtu je s veľkou rezervou.
  BUDGET_TRAILS_PCT: "3"
  # Krajinné prvky (workers/features/features.yml) sú línie, body a pár plôch. Plotov
  # je v OSM veľa, ale idú až od z15 a lepia sa – 4 % je s rezervou.
  BUDGET_FEATURES_PCT: "4"
  # Obmedzenia na ceste: číta to job `tiles` (koľko mu zostalo) aj `roads.yml`,
  # ktorý ho dostane inputom – `workflow_call` `env` nededí.
  BUDGET_ROADS_PCT: "2"
  BUDGET_ASSETS_MB: "40"

# ŽIADNY JOB TU NEMÁ `timeout-minutes` A JE TO ZÁMER.
#
# Boli tu (30 až 350 minút) a nezachránili nič – zabíjali prácu, ktorá by bola
# dobehla. Drahé fázy sa nedajú prerušiť a nadviazať: vektorizácia skál je
# jeden priechod nad celou mozaikou, takže zabitý `gdal_contour` nenechá ani
# neúplný výsledok. Timeout teda neznamenal „skonči skôr a máš aspoň niečo",
# ale „zahoď hodinu a pol a začni odznova".
#
# Čo prácu stráži namiesto toho:
#   * sklad – sklon, bloky obrysov aj dlaždice sa zapisujú cez `.part`
#     a premenovanie, takže zrušený beh nezahodí hotové a ďalší dopočíta zvyšok,
#   * strop PAMÄTE (`ROCK_MAX_RSS_GB`) – OOM zabije runner a v logu nie je nič,
#     tak sa radšej zastaví s hláškou,
#   * plán s odhadom pred drahou časťou a tep počas nej (pravidlo 4), aby sa
#     dalo zasiahnuť skôr, než sa minie celý rozpočet.
#
# ÚPLNE BEZ STROPU TO NIE JE A ANI BYŤ NEMÔŽE: GitHub dáva jobu na hostenom
# runneri najviac 360 minút a to sa vypnúť nedá. Bez `timeout-minutes` teda
# platí práve tých 360. Preto stále platí pravidlo 5 – dlhé fázy patria každá
# do svojho jobu, lebo tých 360 minút sa počíta na job, nie na beh.
jobs:
  # ---------- s čím tento beh ide ----------
  # PRVÝ job a je to jediné, čo robí: vypíše formulár, `env:` workflowu a to,
  # čo z volieb vyšlo. Rozpis aj dôvod, prečo je to job a nie krok prípravy,
  # sú vo `workers/plan/settings.sh`.
  settings:
    name: Nastavenia behu (formulár a voľby)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Vypíš nastavenia behu
        env:
          # Celý formulár naraz – po jednom by sa na nové pole zabudlo
          # a v tabuľke by ticho chýbalo.
          INPUTS_JSON: ${{ toJSON(inputs) }}
          OPT_OPTIONS: ${{ inputs.options }}
          OPT_REBUILD: ${{ inputs.rebuild }}
          OPT_CONTOUR_SOURCE: ${{ inputs.contour_source }}
          OPT_ROCK_SOURCE: ${{ inputs.rock_source }}
          OPT_SHADING_SOURCE: ${{ inputs.shading_source }}
          OPT_TEST: ${{ inputs.test }}
          OPT_PUBLISH_PAGES: ${{ inputs.publish_pages }}
        run: workers/plan/settings.sh

  # ---------- je v sklade terén pre toto územie? ----------
  # Iný zdroj výšok nemáme (Copernicus je zámerne vypnutý), takže bez dlaždíc
  # by build po pár minútach zlyhal. Radšej sa najprv pozrieme, či v sklade
  # niečo pre náš bbox je – a keď nie, doplnia ho joby `mirror-*` ešte predtým.
  check-dem:
    name: Kontrola výškového modelu
    needs: plan
    runs-on: ubuntu-latest
    # Tri vrstvy, tri zdroje – stačí, že aspoň jedna chce DEM. Skaly
    # z tieňovania sú výnimka: tie výškový model nečítajú vôbec, preto sa
    # pozeráme na `opt_rock_dem` (prázdny pri `tienovanie` aj `ziadne`)
    # a nie na `opt_rocks`.
    if: ${{ needs.plan.outputs.opt_contour_lines == 'true' || needs.plan.outputs.opt_rock_dem != '' || needs.plan.outputs.opt_terrain == 'true' }}
    outputs:
      # Ktorý model treba doplniť pre ktorú vrstvu; prázdne = netreba nič.
      # Vrstvy môžu chcieť rôzne modely, takže sa nedopĺňa „ten jeden", ale
      # každý, ktorý chýba – a keď dve vrstvy chcú ten istý, ostane vyplnená
      # len prvá z nich, nech sa to isté nesťahuje dvakrát.
      mirror_contours: ${{ steps.check.outputs.mirror_contours }}
      mirror_rocks: ${{ steps.check.outputs.mirror_rocks }}
      mirror_terrain: ${{ steps.check.outputs.mirror_terrain }}
      # DMR 5.0 sa nedopĺňa cez update-dem.yml (ten ho stiahnuť nevie), ale
      # cez `Dáta · DMR 5.0`. A dopĺňa sa PODĽA PODOBY, nie podľa vrstvy:
      # výrez v plnom rozlíšení a 1° dlaždice sú dva rôzne assety v dvoch
      # rôznych releasoch, takže si aj pri jedinom `dmr5` vo formulári môžu
      # chýbať oba naraz (vrstevnice chcú výrez, tieňovanie dlaždice).
      # `mirror_dmr5_area` je BBOX (to, čo si beh naozaj vypýtal), nie kľúč
      # pohoria; meno assetu preto ide zvlášť. Prečo: workers/dem/check.sh.
      mirror_dmr5_area: ${{ steps.check.outputs.mirror_dmr5_area }}
      mirror_dmr5_asset: ${{ steps.check.outputs.mirror_dmr5_asset }}
      mirror_dmr5_tiles: ${{ steps.check.outputs.mirror_dmr5_tiles }}
      # Otlačok skladu na vrstvu. Ide do kľúča cache – keď sa sklad
      # doplní, nesmie sa z nej vrátiť starý výsledok. Na vrstvu preto, aby
      # doplnenie DMR 5.0 nezahodilo vrstevnice zo Sonnyho.
      demkey_contours: ${{ steps.check.outputs.demkey_contours }}
      demkey_rocks: ${{ steps.check.outputs.demkey_rocks }}
      demkey_terrain: ${{ steps.check.outputs.demkey_terrain }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Rozhodovanie je vo `workers/dem/check.sh`: build-map.yml je blízko
      # k stropu, nad ktorým ho GitHub neprijme, a hlavne – to isté
      # rozhodovanie („ktorý sklad, ktoré súbory") si robí aj
      # `workers/dem/fetch.sh`, tak ho oba berú z `workers/dem/target.py`.
      # Kým to bolo napísané dvakrát, rozišlo sa to a beh 31307163093 spadol.
      - name: Sú v sklade dlaždice pre bbox?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          # Bbox aj výrez už raz vyriešila príprava (vrátane orezu a custom
          # regiónu), takže sa tu nepočítajú druhý raz – dva výpočty toho
          # istého sa vždy raz rozídu.
          # `dem_bbox`, nie `bbox`: kontroluje sa územie, na ktorom sa DEM
          # naozaj číta. Pri rýchlom teste sú to 4 km², takže sa kvôli nemu
          # nezrkadlí (a nedopĺňa) výškový model na celý kraj.
          BBOX: ${{ needs.plan.outputs.dem_bbox }}
          AREA_KEY: ${{ needs.plan.outputs.area_key }}
          # Výrez pretnutý s regiónom (v teste zmenšený na štvorec). Presne
          # toto sa má z Drive prečítať – viď workers/dem/check.sh.
          AREA_BBOX: ${{ needs.plan.outputs.area_bbox }}
          SRC_CONTOURS: ${{ needs.plan.outputs.opt_contour_source }}
          SRC_ROCKS: ${{ needs.plan.outputs.opt_rock_dem }}
          SRC_TERRAIN: ${{ needs.plan.outputs.opt_shading_source }}
        run: workers/dem/check.sh

  # ---------- doplnenie výškových dát ----------
  # Jeden job pre všetky zdroje. Sťahovaciu pipeline máme jedinú a rozdiel
  # medzi modelmi je len v jej `source` – tri takmer rovnaké mirror joby tu
  # boli len preto, že tri takmer rovnaké workflowy boli aj vedľa.
  #
  # Tri joby, jeden na vrstvu: vrstvy môžu chcieť rôzne modely (vrstevnice
  # zo Sonnyho, skaly z DMR 5.0) a chýbať môžu oba naraz. Každý sa spustí,
  # len keď `check-dem` povedal, že ten konkrétny model treba doplniť.
  #
  # Bola to jedna matica nad `fromJSON(...)`, čo vyzeralo úspornejšie. Tri
  # joby sú o pár riadkov dlhšie, ale v zozname jobov je rovno vidieť, ktorá
  # vrstva si model pýta – a `check-dem` vie povedať „tento model už dopĺňa
  # iná vrstva", takže sa to isté nesťahuje dvakrát.
  #
  # Spúšťajú sa SAMY, keď v sklade nie sú dlaždice pre naše územie. Netreba
  # teda púšťať nič ručne – `Build map` je jediné, čo spúšťaš.
  mirror-contours:
    name: Doplniť výškový model (vrstevnice)
    needs: [plan, check-dem]
    if: ${{ !cancelled() && needs.check-dem.outputs.mirror_contours != '' }}
    permissions:
      # `read`, nie `write`: doplnenie publikuje na Drive, nie do releasu.
      contents: read
    uses: ./.github/workflows/update-dem.yml
    # Sonny chodí z Google Drive: bez tokenu by sa ťahal anonymne a platil by
    # naň verejný denný limit. `workflow_call` nededí secrets sám.
    secrets: inherit
    with:
      what: ${{ needs.check-dem.outputs.mirror_contours }}
      area: ${{ inputs.area }}
      custom_url: ${{ needs.plan.outputs.opt_ugkk_urls }}

  mirror-rocks:
    name: Doplniť výškový model (skaly)
    needs: [plan, check-dem]
    # Keď skaly berú ten istý model ako vrstevnice, `check-dem` ho tu nechá
    # prázdny – doplní ho job vyššie a druhé sťahovanie toho istého by bolo
    # len zbytočné.
    if: ${{ !cancelled() && needs.check-dem.outputs.mirror_rocks != '' }}
    permissions:
      # `read`, nie `write`: doplnenie publikuje na Drive, nie do releasu.
      contents: read
    uses: ./.github/workflows/update-dem.yml
    secrets: inherit                      # Drive, ako vyššie
    with:
      what: ${{ needs.check-dem.outputs.mirror_rocks }}
      area: ${{ inputs.area }}
      custom_url: ${{ needs.plan.outputs.opt_ugkk_urls }}

  mirror-terrain:
    name: Doplniť výškový model (tieňovanie)
    needs: [plan, check-dem]
    if: ${{ !cancelled() && needs.check-dem.outputs.mirror_terrain != '' }}
    permissions:
      # `read`, nie `write`: doplnenie publikuje na Drive, nie do releasu.
      contents: read
    uses: ./.github/workflows/update-dem.yml
    secrets: inherit                      # Drive, ako vyššie
    with:
      what: ${{ needs.check-dem.outputs.mirror_terrain }}
      area: ${{ inputs.area }}
      custom_url: ${{ needs.plan.outputs.opt_ugkk_urls }}

  # ---------- doplnenie DMR 5.0 ----------
  # DMR 5.0 nechodí cez `update-dem.yml`. Ten sťahuje archív na runner a rozreže
  # ho; DMR 5.0 má 145 GB a runner má voľných ~60 GB, takže sa to spraviť nedá.
  # Číta sa cez HTTP Range priamo z Drive – berie sa len to, čo územie pretína –
  # a robí to `Dáta · DMR 5.0` (dmr5-drive.yml).
  #
  # KÝM SEM VIEDLA CESTA CEZ `update-dem.yml`, DOPĹŇANIE BOLO TICHÉ NIČ: `dmr5`
  # tam bol len rozcestník, ktorý vypísal, kam ísť ručne, a skončil úspechom.
  # Build teda pokojne pokračoval do jobu, ktorý si model vypýtal, a spadol tam
  # (beh 31307163093). Odteraz sa DMR 5.0 dopĺňa naozaj.
  #
  # DVA JOBY NAD JEDNÝM WORKFLOWOM – nie dve pipeline. `dmr5` má dva tvary
  # a chýbať môžu naraz: vrstevnice a skaly čítajú výrez v plnom rozlíšení
  # z `dem-ugkk`, tieňovanie 1° dlaždice na 5 m z `dem-dmr5`. Ktoré z toho
  # treba, rozhodol `check-dem`. Je to jediná cesta k DMR 5.0 – záložný
  # zdroj z archívu ÚGKK sme zrušili, keď Drive začal spoľahlivo púšťať.
  mirror-dmr5-area:
    name: Doplniť DMR 5.0 (výrez, plné rozlíšenie)
    needs: [plan, check-dem]
    if: ${{ !cancelled() && needs.check-dem.outputs.mirror_dmr5_area != '' }}
    permissions:
      # `read`, nie `write`: doplnenie publikuje na Drive, nie do releasu.
      contents: read
    uses: ./.github/workflows/dmr5-drive.yml
    # Kvôli GDRIVE_CREDENTIALS: bez tokenu vlastníka by doplnenie čítalo
    # verejným odkazom, na ktorý platí denný limit sťahovania.
    secrets: inherit
    with:
      # Bbox toho, čo si beh vypýtal, a meno, ktoré `check-dem` v sklade
      # hľadal a nenašiel. Kľúč pohoria sem NEchodí: `dmr5-drive.yml` by si
      # ho vyriešil z `areas.json` druhýkrát a prečítal celý obdĺžnik (test
      # na pár km² tak čítal 541 km² Tatier). Rozpis: workers/dem/check.sh.
      area: ${{ needs.check-dem.outputs.mirror_dmr5_area }}
      asset: ${{ needs.check-dem.outputs.mirror_dmr5_asset }}
      tiles: false

  mirror-dmr5-tiles:
    name: Doplniť DMR 5.0 (dlaždice)
    needs: [plan, check-dem]
    if: ${{ !cancelled() && needs.check-dem.outputs.mirror_dmr5_tiles != '' }}
    permissions:
      # `read`, nie `write`: doplnenie publikuje na Drive, nie do releasu.
      contents: read
    uses: ./.github/workflows/dmr5-drive.yml
    secrets: inherit                      # GDRIVE_CREDENTIALS, ako vyššie
    with:
      # Bbox rozšírený na celé stupne – dlaždica `N49E020.tif` je sľub o celom
      # stupni, takže sa musí prečítať celá. Rozšírenie počíta dem-target.py.
      area: ${{ needs.check-dem.outputs.mirror_dmr5_tiles }}
      tiles: true
      grid_m: "5"

  # ---------- skaly z tieňovaných dlaždíc ----------
  # Keď je `rock_source: tienovanie`, obrázky sa stiahnu tu a rovno v tomto
  # behu – nie „spusti si najprv ten druhý workflow a potom príď". Je to tá
  # istá pipeline (shading-rocks.yml), len volaná; stiahnuté JPG dlaždice
  # z nej vypadnú ako artefakt `dlazdice-tienovania-…` a hotové polygóny ako
  # súbor v sklade, ktorý si o kus nižšie vypýta job s vrstevnicami.
  #
  # Dlaždice majú vlastnú cache podľa výrezu a zoomu, takže druhý build
  # z dobrovoľníckeho servera freemap.sk neťahá nič.
  #
  # `rock_img_asset` je vedomé obídenie: keď si prahy doladil ručným behom
  # a chceš presne ten asset, nič sa nepočíta nanovo.
  shading-rocks:
    name: Skaly z tieňovania
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.opt_rock_source == 'tienovanie' && needs.plan.outputs.opt_rock_img_asset == '' }}
    permissions:
      # `read`, nie `write`: doplnenie publikuje na Drive, nie do releasu.
      contents: read
    uses: ./.github/workflows/shading-rocks.yml
    # Kvôli cache na Drive: bez tokenu by si tá podpipeline nemala ako otvoriť
    # sklad stiahnutých dlaždíc a ťahala by gigabajty z freemap.sk odznova.
    secrets: inherit
    with:
      # V testovacom režime ide dole rovno bbox testovacieho štvorca, nie meno
      # pohoria. Ten workflow by si síce vedel štvorec spočítať sám, ale
      # z vlastného prieniku (SK) namiesto prieniku s regiónom – a dva výpočty
      # toho istého sa raz rozídu. Rozísť sa tu znamená skaly mimo mapy.
      area: ${{ needs.plan.outputs.test_km2 != '0' && needs.plan.outputs.area_bbox || inputs.area }}
      zoom: ${{ needs.plan.outputs.opt_rock_img_zoom }}
      # Rýchly test nepoužije nič z cache – vrátane TEJTO podpipeline. Sama
      # si totiž odkladá rozrobené obrysy a bez `fresh=1` by na ne nadviazala,
      # takže by si po zmene prahu dostal polovicu starého výsledku a polovicu
      # nového. Vlastné `rock_img_options` to vedia prebiť (`fresh=0`) – tokeny
      # sa spracúvajú zľava doprava a posledná hodnota vyhráva.
      # Stiahnuté JPG dlaždice sa nezahadzujú: to sú vstupné dáta z cudzieho
      # (dobrovoľníckeho) servera, nie výsledok výpočtu.
      # TO ISTÉ PLATÍ PRI `rebuild: skaly`: pri `rock_source: tienovanie` sa
      # sklon nepočíta vôbec, obrysy robí táto podpipeline – a bez `fresh=1`
      # nadviazala na svoje rozrobené kusy, takže výber sľúbil prepočet
      # a vrátil starý výsledok (`workers/lint/rebuild.py`).
      options: ${{ (needs.plan.outputs.test_km2 != '0' || needs.plan.outputs.opt_rocks_rebuild == 'true') && format('fresh=1 {0}', needs.plan.outputs.opt_rock_img_options) || needs.plan.outputs.opt_rock_img_options }}

  # ---------- príprava: región, kľúče, PBF ----------
  # Krátky job, ktorý zistí všetko, čo ostatné potrebujú vedieť, a stiahne
  # PBF. Beží pár minút a všetko ďalšie z neho vychádza.
  plan:
    name: Príprava (región, kľúče, PBF)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `write` a nie `read`: príprava Pages nielen kontroluje, ale aj zapína
      # a prepína zdroj na Actions, aby na stránke skončila mapa a nie README.
      # Na úrovni workflowu je `pages: write` aj tak (nasadzuje sa ním), takže
      # to nie je nové právo v behu – len ho dostane aj tento job.
      pages: write
    outputs:
      key: ${{ steps.region.outputs.key }}
      name: ${{ steps.region.outputs.name }}
      # `bbox` je územie MAPY (dlaždice, trasy, prvky, maska, rozpočet
      # stránky), `dem_bbox` územie vrstiev z výškového modelu (vrstevnice,
      # skaly, tieňovanie). Pri rýchlom teste sú to TIE ISTÉ 4 km² – odkedy
      # test orezáva aj PBF, sa nelíšia; rozdielne ostávajú len vtedy, keď je
      # výrez (`area`) menší než región.
      bbox: ${{ steps.region.outputs.bbox }}
      dem_bbox: ${{ steps.region.outputs.dem_bbox }}
      dem_bboxkey: ${{ steps.region.outputs.dem_bboxkey }}
      # Testovací štvorec (prázdne pri ostrom behu) – pre obrázok „kde to je",
      # súhrn a viewer, ktorý sa naň má otvoriť.
      test_bbox: ${{ steps.region.outputs.test_bbox }}
      day: ${{ steps.day.outputs.d }}
      # `legacy` = zdroj Pages je vetva a mapu prepíše najbližší push.
      # Ide von, aby to súhrn vedel povedať nahlas a smoke test vedel,
      # či je prázdny koreň stránky chyba, alebo známa príčina.
      pages_build_type: ${{ steps.pages-src.outputs.build_type }}
      # Testovací režim: bbox pred orezaním (na obrázok „kde to je") a odkaz
      # do hotovej mapy, ktorý súhrn behu ukáže.
      full_bbox: ${{ steps.region.outputs.full_bbox }}
      test_km2: ${{ steps.opts.outputs.opt_test_km2 }}
      area_key: ${{ steps.area.outputs.key }}
      area_name: ${{ steps.area.outputs.name }}
      area_bbox: ${{ steps.area.outputs.bbox }}
      area_km2: ${{ steps.area.outputs.km2 }}
      # `opt_contours` je brána jobu s vrstevnicami, nie vrstva: vrstevnice
      # aj skaly z neho vychádzajú do jedného .pmtiles, takže beží aj vtedy,
      # keď je zapnuté len jedno z nich. Čo sa naozaj kreslí, hovoria
      # `opt_contour_lines` a `opt_rocks`.
      opt_contours: ${{ steps.opts.outputs.opt_contours }}
      opt_contour_lines: ${{ steps.opts.outputs.opt_contour_lines }}
      opt_terrain: ${{ steps.opts.outputs.opt_terrain }}
      opt_trails: ${{ steps.opts.outputs.opt_trails }}
      opt_features: ${{ steps.opts.outputs.opt_features }}
      opt_search: ${{ steps.opts.outputs.opt_search }}
      # Tri výbery zdroja tak, ako ich rozobrala parse-options.py.
      # `opt_rock_dem` je zdroj skál, LEN keď je to výškový model – pri
      # `tienovanie` a `ziadne` je prázdny, takže nikto nesiahne na DEM.
      opt_contour_source: ${{ steps.opts.outputs.opt_contour_source }}
      opt_rock_source: ${{ steps.opts.outputs.opt_rock_source }}
      opt_rock_dem: ${{ steps.opts.outputs.opt_rock_dem }}
      opt_shading_source: ${{ steps.opts.outputs.opt_shading_source }}
      opt_crop_bbox: ${{ steps.opts.outputs.opt_crop_bbox }}
      opt_size_limit_mb: ${{ steps.opts.outputs.opt_size_limit_mb }}
      opt_auto_shrink: ${{ steps.opts.outputs.opt_auto_shrink }}
      # Orez dlaždíc na hranicu regiónu – potrebujú ho TRI joby (`tiles`,
      # `trails`, `features`), lebo orez musí byť vo všetkých rovnaký.
      opt_region_clip: ${{ steps.opts.outputs.opt_region_clip }}
      opt_ugkk_fallback: ${{ steps.opts.outputs.opt_ugkk_fallback }}
      opt_ugkk_urls: ${{ steps.opts.outputs.opt_ugkk_urls }}
      opt_contour_interval: ${{ steps.opts.outputs.opt_contour_interval }}
      opt_contour_maxzoom: ${{ steps.opts.outputs.opt_contour_maxzoom }}
      opt_rock_maxzoom: ${{ steps.opts.outputs.opt_rock_maxzoom }}
      opt_rock_plne: ${{ steps.opts.outputs.opt_rock_plne }}
      opt_rock_zapln_diery: ${{ steps.opts.outputs.opt_rock_zapln_diery }}
      opt_contour_smoothing: ${{ steps.opts.outputs.opt_contour_smoothing }}
      opt_trails_maxzoom: ${{ steps.opts.outputs.opt_trails_maxzoom }}
      opt_features_maxzoom: ${{ steps.opts.outputs.opt_features_maxzoom }}
      opt_roads: ${{ steps.opts.outputs.opt_roads }}
      opt_roads_maxzoom: ${{ steps.opts.outputs.opt_roads_maxzoom }}
      budget_roads_pct: ${{ env.BUDGET_ROADS_PCT }}
      opt_terrain_maxzoom: ${{ steps.opts.outputs.opt_terrain_maxzoom }}
      opt_terrain_3d: ${{ steps.opts.outputs.opt_terrain_3d }}
      opt_rocks: ${{ steps.opts.outputs.opt_rocks }}
      opt_rock_slope: ${{ inputs.rock_slope }}
      opt_rock_res: ${{ steps.opts.outputs.opt_rock_res }}
      opt_rock_img_asset: ${{ steps.opts.outputs.opt_rock_img_asset }}
      opt_rock_img_zoom: ${{ steps.opts.outputs.opt_rock_img_zoom }}
      opt_rock_img_options: ${{ steps.opts.outputs.opt_rock_img_options }}
      opt_maxzoom: ${{ steps.opts.outputs.opt_maxzoom }}
      opt_custom_pbf_url: ${{ steps.opts.outputs.opt_custom_pbf_url }}
      opt_custom_name: ${{ steps.opts.outputs.opt_custom_name }}
      opt_custom_bbox: ${{ steps.opts.outputs.opt_custom_bbox }}
      opt_publish: ${{ steps.opts.outputs.opt_publish }}
      opt_publish_pages: ${{ steps.opts.outputs.opt_publish_pages }}
      opt_apple_archive: ${{ steps.opts.outputs.opt_apple_archive }}
      opt_contours_rebuild: ${{ steps.opts.outputs.opt_contours_rebuild }}
      opt_rocks_rebuild: ${{ steps.opts.outputs.opt_rocks_rebuild }}
      opt_terrain_rebuild: ${{ steps.opts.outputs.opt_terrain_rebuild }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Na stránke má byť MAPA, nie README – a to je vlastnosť jedného
      # nastavenia repozitára: `build_type`.
      #
      # `build_type: legacy` = zdroj Pages je VETVA. Vtedy popri nás beží
      # zabudovaný Jekyll builder („pages build and deployment"), ktorý pri
      # KAŽDOM pushi do vetvy nasadí koreň repozitára – teda README – a mapu,
      # ktorú nasadil tento workflow, prepíše. Navonok to vyzerá, že sa mapa
      # „sama pokazila": beh je zelený, nasadenie prebehlo, a na stránke je
      # README. Stalo sa to po mergoch #50, #51, #52 a znova #54 a #55, takže
      # to už nie je nehoda, ale niečo, čo sa vracia.
      #
      # Prepnúť sa to skúsi rovno tu – je to jedno PUT volanie a je
      # idempotentné. Keď ho token neprejde, beh POKRAČUJE a mapu nasadí.
      #
      # Zhadzovať beh hneď na začiatku bola chyba a stála celý deň behov:
      # `GITHUB_TOKEN` na zmenu zdroja Pages nestačí (mení sa ním nastavenie
      # repozitára, nie obsah stránky), takže sa beh zastavil po troch
      # sekundách a mapa nebola ŽIADNA. Pritom nasadenie funguje aj pri
      # zdroji z vetvy – mapa na stránke je, len ju prepíše najbližší push
      # do master. Radšej mapa, ktorá vydrží do ďalšieho mergu, než nič.
      #
      # Preto: skúsiť, nahlas povedať, čo API odpovedalo, a ísť ďalej.
      # Odpoveď sa NEZAHADZUJE do /dev/null – bez nej sa z logu nedalo
      # zistiť, či je to chýbajúce právo, alebo niečo iné.
      - name: Zapni GitHub Pages a prepni zdroj na Actions
        id: pages-src
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          RUCNE="Nastav to ručne raz: Settings → Pages → Build and deployment → Source: 'GitHub Actions'."

          PAGES=$(gh api "repos/$GITHUB_REPOSITORY/pages" 2>/dev/null || true)

          if [ -z "$PAGES" ]; then
            echo "GitHub Pages nie je zapnuté – zapínam so zdrojom GitHub Actions…"
            if ODPOVED=$(gh api -X POST "repos/$GITHUB_REPOSITORY/pages" \
                 -f 'build_type=workflow' 2>&1); then
              echo "  ✓ zapnuté"
              PAGES=$(gh api "repos/$GITHUB_REPOSITORY/pages" 2>/dev/null || true)
            else
              echo "  API odpovedalo: $ODPOVED"
              # Bez zapnutých Pages sa nasadiť NEDÁ – tu zastaviť treba.
              echo "::error::GitHub Pages nie je zapnuté a tokenu sa ho nepodarilo zapnúť (na to treba admin práva). $RUCNE"
              exit 1
            fi
          fi

          BT=$(printf '%s' "$PAGES" | jq -r '.build_type // "?"')
          if [ "$BT" != 'workflow' ]; then
            echo "Pages berie zdroj z vetvy (build_type=$BT) – skúšam prepnúť na GitHub Actions…"
            if ODPOVED=$(gh api -X PUT "repos/$GITHUB_REPOSITORY/pages" \
                 -f 'build_type=workflow' 2>&1); then
              # Overiť, a nie veriť: keby PUT prešlo a nastavenie ostalo staré,
              # build by dobehol do zelena a na stránke by aj tak bolo README.
              BT=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type // "?"' 2>/dev/null || echo '?')
              [ "$BT" = 'workflow' ] && echo "  ✓ prepnuté (build_type=$BT)"
            else
              echo "  API odpovedalo: $ODPOVED"
            fi
          fi

          echo "build_type=$BT" >> "$GITHUB_OUTPUT"
          if [ "$BT" != 'workflow' ]; then
            # VAROVANIE, nie chyba. Mapa sa nasadí a bude na stránke; zmizne
            # až pri najbližšom pushi do master, keď ju prepíše zabudovaný
            # Jekyll builder obsahom repozitára (uvidíš README).
            echo "::warning::GitHub Pages berie zdroj z vetvy (build_type=$BT), nie z Actions, a tokenu sa to nepodarilo prepnúť. Mapa sa nasadí, ale najbližší push do master ju prepíše obsahom repozitára (uvidíš README). $RUCNE"
          else
            echo "Pages je zapnuté a berie z Actions ✓ – nasadí sa mapa z tohto behu"
          fi

      # PBF sa mení denne, tak je v kľúči dátum – v ten istý deň sa už
      # nesťahuje znova (kraj má 36–63 MB, celé Slovensko ~380 MB).
      # `workflow_dispatch` dovolí najviac 10 inputov. Zvyšok príde ako voľné
      # `kľúč=hodnota` v jednom poli a rozloží sa tu – raz, na jednom mieste,
      # aby ostatné joby čítali hotové hodnoty a nie surový reťazec.
      - name: Rozlož voľby
        id: opts
        run: |
          set -euo pipefail
          # BEZ `--summary`: čo bolo vo formulári a čo z volieb vyšlo, vypisuje
          # job `settings` – prvý job behu. Kým to písali obe miesta, boli
          # v súhrne dve tabuľky toho istého (pravidlo 1). Tu ostáva iba to,
          # čo z volieb potrebuje zvyšok behu, teda `--out`.
          python3 workers/plan/options.py \
            --options='${{ inputs.options }}' \
            --rebuild='${{ inputs.rebuild }}' \
            --contour-source='${{ inputs.contour_source }}' \
            --rock-source='${{ inputs.rock_source }}' \
            --shading-source='${{ inputs.shading_source }}' \
            --test='${{ inputs.test }}' \
            --publish-pages='${{ inputs.publish_pages }}' \
            --out="$GITHUB_OUTPUT"

      - name: Dnešný dátum do kľúča cache
        id: day
        run: |
          echo "d=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          # Meranie krokov: každý dlhý krok si na konci pripíše riadok
          # „poradie, názov, sekundy, čo spravil" do súboru svojho jobu.
          # Joby bežia súbežne, takže sa v súhrne zoradia podľa poradia, nie
          # podľa času – ten by hovoril len o tom, ktorý runner bol rýchlejší.
          mkdir -p steps-out
          : > steps-out/plan.tsv

      # POLYGÓN KRAJA: hranica, po ktorej je náš PBF rezaný na osm.fr. Vyrába
      # ho `plan` a ostatné joby ho dostanú ARTEFAKTOM, nie tým, že si ho
      # stiahnu samy – keby jednému z nich zlyhalo sťahovanie, rezal by na
      # bboxe, kým ostatní na kraji, čiže dve pravdy o jednej hranici.
      #
      # POTREBUJE HO UŽ SÁM PBF, preto tento krok stojí PRED ním: kraj sa
      # podľa neho reže z rodičovského extraktu (workers/plan/pbf.sh). Keď
      # `.poly` nie je, ten krok SPADNE – návrat k hotovému exportu kraja by
      # znamenal mapu bez plôch, čo presahujú do susedného kraja.
      # Tú istú hranicu chce aj `--polygon` Planetileru, `-cutline` vrstevníc,
      # maska tieňovania a hranica pre viewer.
      - name: Polygón kraja (orez mapy aj vrstiev z DEM)
        run: |
          set -euo pipefail
          python3 workers/plan/region-poly.py --region='${{ inputs.region }}' \
            --out=data/region.geojson --poly-out=data/region.poly

      # POZOR na restore/save: `actions/cache` ukladalo až v post-kroku a IBA
      # keď job dobehol úspešne. Keď build spadol o hodinu neskôr, hodiny
      # výpočtu sa zahodili. Preto restore hore a save hneď po tom, čo dáta
      # vzniknú, s `if: always()` – a preto to isté delenie ostalo aj po
      # presťahovaní cache na Drive (`.github/actions/cache-restore` a `-save`).
      - name: Cache PBF regiónu (restore)
        id: pbf-cache
        uses: ./.github/actions/cache-restore
        with:
          path: data/region.osm.pbf
          # `v2`: kým rýchly test orezával región, ukladal orezané PBF pod
          # kľúč BEZ orezu (`crop_bbox` bol pri teste prázdny) – ostrý beh
          # v ten istý deň potom postavil celú mapu z tých 2 km².
          # `v5`: kraj sa zase REŽE z rodiča (pod `v4` ležia hotové exporty
          # z osm.fr, ktorým chýbajú členovia plôch – to sa práve opravuje,
          # takže sa nesmú vrátiť z cache) a test zase orezáva aj mapu.
          # A PRETO JE V KĽÚČI TESTOVACÍ ŠTVOREC – tá istá chyba ako pri `v2`,
          # len naopak: uložené 4 km² by si ostrý beh v ten istý deň vzal ako
          # celý kraj. Počíta sa až v `plan/area.py`, tu sú jeho vstupy.
          key: pbf-v5-${{ inputs.region }}-${{ steps.opts.outputs.opt_custom_pbf_url }}-${{ steps.opts.outputs.opt_crop_bbox }}-t${{ steps.opts.outputs.opt_test_km2 }}-a${{ inputs.area }}${{ steps.opts.outputs.opt_area_bbox }}-at${{ steps.opts.outputs.opt_test_at }}-${{ steps.day.outputs.d }}

      # Bash je vo `workers/plan/pbf.sh` – tento súbor má strop 128 kB a nad
      # ním ho GitHub ticho neprijme (stráži Lint workflows). Sem chodia len
      # hodnoty z formulára a z volieb.
      - name: Stiahni PBF iba daného regiónu
        id: region
        env:
          AREA_IN: ${{ inputs.area }}
          OPT_AREA_BBOX: ${{ steps.opts.outputs.opt_area_bbox }}
          OPT_CROP_BBOX: ${{ steps.opts.outputs.opt_crop_bbox }}
          OPT_CUSTOM_BBOX: ${{ steps.opts.outputs.opt_custom_bbox }}
          OPT_CUSTOM_NAME: ${{ steps.opts.outputs.opt_custom_name }}
          OPT_CUSTOM_PBF_URL: ${{ steps.opts.outputs.opt_custom_pbf_url }}
          OPT_TEST_AT: ${{ steps.opts.outputs.opt_test_at }}
          OPT_TEST_KM2: ${{ steps.opts.outputs.opt_test_km2 }}
          REGION: ${{ inputs.region }}
        run: workers/plan/pbf.sh

      - name: Vyrieš testovací výrez
        id: area
        run: |
          set -euo pipefail
          # RÝCHLY TEST UŽ VÝREZ VYRIEŠIL – plán ho musel spočítať, aby vedel,
          # kam položiť štvorec pre terénne vrstvy. Odpoveď sa preberie, nie
          # preráta: druhý výpočet dostáva `dem_bbox`, teda UŽ ten štvorec, tak
          # mu vyjde ten istý bbox, ale kľúč BEZ prípony `_test4` – lebo tu sa
          # `--test-km2` nepodáva. A z kľúča je meno DEM assetu, takže by výrez
          # na pár km² sadol v sklade pod `ugkk-vysoke_tatry.tif` – meno, ktoré
          # sľubuje celé pohorie (viď docs/pipeline.md).
          if [ -s /tmp/vyrez.txt ]; then
            RESOLVED=$(cat /tmp/vyrez.txt)
            cat /tmp/vyrez.txt >> "$GITHUB_OUTPUT"
            echo "Výrez z rýchleho testu (spočítaný v pláne):"
          else
            # Vlastný bbox z options prebije výber pohoria – výber je na
            # bežné použitie, bbox na to, čo v zozname nie je.
            AREA='${{ inputs.area }}'
            AREA_BBOX='${{ steps.opts.outputs.opt_area_bbox }}'
            [ -n "$AREA_BBOX" ] && AREA="$AREA_BBOX"
            # stdout aj do premennej: kľúč výrezu treba hneď na kontrolu nižšie
            # a na vlastné výstupy sa krok odkazovať nemôže.
            # Bez testu sú `dem_bbox` a `bbox` to isté.
            RESOLVED=$(python3 workers/plan/area.py \
              --region-bbox='${{ steps.region.outputs.dem_bbox }}' \
              --area="$AREA" --out="$GITHUB_OUTPUT")
          fi
          echo "$RESOLVED"
          AREA_KEY=$(printf '%s\n' "$RESOLVED" | sed -n 's/^key=//p')

          # Kým boli 1 m a 5 m dva výbery, dalo sa zvoliť 1 m na celý kraj –
          # 16 miliárd buniek (64 GB), ktoré sa nezmestia ani do releasu, ani
          # na runner – a tento strážca to musel zakázať. Teraz to zakázať
          # nemá čo: `dmr5` si podobu vyberá podľa rozsahu sám, takže na celý
          # kraj vždy vyjde 5 m verzia.
          #
          # V testovacom režime je „celý región" už orezaný na pár km², takže
          # aj tam je 1 m presne to, čo sa takým behom overuje.
          if [ "$AREA_KEY" = 'cely' ] && [ '${{ steps.opts.outputs.opt_test_km2 }}' = '0' ]; then
            # Skaly z tieňovania sú hotové dlaždice z cudzieho servera a na
            # celý kraj by ich boli státisíce. Pipeline, ktorú si build volá,
            # preto pozná len pohoria.
            if [ '${{ inputs.rock_source }}' = 'tienovanie' ]; then
              echo "::error::rock_source: tienovanie sťahuje hotové tieňované dlaždice a to má zmysel len na výrez. Vyplň input „area“ (napr. vysoke_tatry), alebo vyber výškový model (sonny / dmr35 / dmr5)."
              exit 1
            fi
          fi


      # Testovací štvorec má pár km² – z čísel sa nedá povedať, či padol na
      # hrebeň so stenami alebo na lúku, a keď padne na lúku, „nenašlo ani
      # jednu skalu" nehovorí nič o prahoch. Obrázok ide do stránky (nie len
      # do artefaktu), aby ho súhrn behu vedel priamo ukázať.
      - name: Kde je testovací výrez
        if: ${{ steps.opts.outputs.opt_test_km2 != '0' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          mkdir -p _site
          python3 workers/plan/test-map.py \
            --bbox='${{ steps.region.outputs.test_bbox }}' \
            --full-bbox='${{ steps.region.outputs.full_bbox }}' \
            --name='${{ steps.region.outputs.name }}' \
            --layers="vrstevnice: ${{ inputs.contour_source }} · skaly: ${{ inputs.rock_source }} · tieňovanie: ${{ inputs.shading_source }}" \
            --png=_site/kde-to-je.png --md=/tmp/kde-to-je.md
          cat /tmp/kde-to-je.md >> "$GITHUB_STEP_SUMMARY"

      - name: Odlož obrázok testovacieho výrezu
        if: ${{ always() && hashFiles('_site/kde-to-je.png') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: site-plan
          path: _site
          retention-days: 1
          if-no-files-found: ignore

      - name: Cache PBF regiónu (save)
        if: ${{ always() && steps.pbf-cache.outputs.cache-hit != 'true' && hashFiles('data/region.osm.pbf') != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: data/region.osm.pbf
          key: ${{ steps.pbf-cache.outputs.cache-primary-key }}

      # Oboje: `.geojson` čítajú vrstvy z DEM (cutline, maska tieňovania)
      # a `deploy` (hranica pre viewer), surový `.poly` Planetiler
      # (`--polygon`, workers/lib/region-clip.sh) v jobe `tiles`, `trails`
      # a `features`. Preložiť si jedno z druhého by znamenalo mať hranicu
      # napísanú dvakrát.
      - name: Odlož polygón kraja
        uses: actions/upload-artifact@v7
        with:
          name: region-poly
          path: |
            data/region.geojson
            data/region.poly
          retention-days: 1

      # PBF potrebuje už len job s dlaždicami. Ide artefaktom, nie cache:
      # v rámci behu je to isté, cache by sa mohla minúť s iným behom.
      - name: Odlož PBF pre job s dlaždicami
        uses: actions/upload-artifact@v7
        with:
          name: pbf
          path: data/region.osm.pbf
          retention-days: 1
          compression-level: 0

      - name: Odlož meranie krokov
        if: ${{ always() && hashFiles('steps-out/*') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: steps-plan
          path: steps-out
          retention-days: 1
          if-no-files-found: ignore

  # ---------- kľúče cache ----------
  # Vlastný job, lebo kľúč potrebuje OBOJE: bbox z prípravy a otlačok releasu
  # s DEM z kontroly. A potrebuje ho restore, save aj mazanie pri
  # pregenerovaní – keby bol napísaný trikrát, stačí ho raz zabudnúť opraviť
  # a cache sa ticho rozsype (ukladá sa pod iný kľúč, než sa hľadá).
  keys:
    name: Kľúče cache
    needs: [plan, check-dem, mirror-contours, mirror-rocks, mirror-terrain,
            mirror-dmr5-area, mirror-dmr5-tiles]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      # `actions: write` tu bolo na mazanie GitHub cache. Cache je na Drive,
      # takže sa maže tokenom vlastníka z `env:` workflowu a GitHub na to
      # žiadne právo nepotrebuje.
      contents: read
    outputs:
      contours: ${{ steps.keys.outputs.contours }}
      demtiles_contours: ${{ steps.keys.outputs.demtiles_contours }}
      demtiles_terrain: ${{ steps.keys.outputs.demtiles_terrain }}
      terrain: ${{ steps.keys.outputs.terrain }}
      slope: ${{ steps.keys.outputs.slope }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Kľúč potrebuje restore, save aj mazanie pri pregenerovaní. Keby bol
      # napísaný trikrát, stačí ho raz zabudnúť opraviť a cache sa ticho
      # rozsype (uloží sa pod iným kľúčom, než sa hľadá).
      # Skladanie kľúčov je vo `workers/plan/cache-keys.sh` (strop súboru 128 kB).
      # `hashFiles` je funkcia GitHubu, tak sa jej výsledok podá ako env.
      - name: Kľúče cache
        id: keys
        env:
          AREA_IN: ${{ inputs.area }}
          AREA_KEY: ${{ needs.plan.outputs.area_key }}
          CONTOUR_INTERVAL: ${{ needs.plan.outputs.opt_contour_interval }}
          DEMKEY_CONTOURS: ${{ needs.check-dem.outputs.demkey_contours }}
          DEMKEY_ROCKS: ${{ needs.check-dem.outputs.demkey_rocks }}
          DEMKEY_TERRAIN: ${{ needs.check-dem.outputs.demkey_terrain }}
          DEM_BBOXKEY: ${{ needs.plan.outputs.dem_bboxkey }}
          OPT_CONTOUR_MAXZOOM: ${{ needs.plan.outputs.opt_contour_maxzoom }}
          OPT_CONTOUR_SMOOTHING: ${{ needs.plan.outputs.opt_contour_smoothing }}
          OPT_CONTOUR_SOURCE: ${{ needs.plan.outputs.opt_contour_source }}
          OPT_ROCK_IMG_ASSET: ${{ needs.plan.outputs.opt_rock_img_asset }}
          OPT_ROCK_MAXZOOM: ${{ needs.plan.outputs.opt_rock_maxzoom }}
          OPT_ROCK_PLNE: ${{ needs.plan.outputs.opt_rock_plne }}
          OPT_ROCK_RES: ${{ needs.plan.outputs.opt_rock_res }}
          OPT_ROCK_SOURCE: ${{ needs.plan.outputs.opt_rock_source }}
          OPT_ROCK_ZAPLN_DIERY: ${{ needs.plan.outputs.opt_rock_zapln_diery }}
          OPT_SHADING_SOURCE: ${{ needs.plan.outputs.opt_shading_source }}
          OPT_TERRAIN_MAXZOOM: ${{ needs.plan.outputs.opt_terrain_maxzoom }}
          ROCK_SLOPE: ${{ inputs.rock_slope }}
          # `contours-build.sh` je v otlačku tiež: je to on, kto vrstevnice
          # zjednodušuje a zaobľuje, takže jeho zmena mení obsah dlaždíc.
          # Kým v ňom nebol, dala sa zmeniť tolerancia a beh vrátil z cache
          # staré, zubaté vrstevnice – zelený a tichý (pravidlo 8).
          # Otlačok ale vidí len súbory, a ladenie hladkosti (CONTOUR_DEM_LOWPASS,
          # CONTOUR_SIMPLIFY, CONTOUR_SMOOTH) je v `env:` tohto workflowu –
          # tie sú preto v kľúči zvlášť, viď `workers/plan/cache-keys.sh`.
          # V otlačku musí byť KAŽDÝ súbor, ktorý rozhoduje o TVARE, aj ten
          # z `workers/lib/`: `contour-blocks.py` reže obrysy na bloky a lepí
          # švy (oprava zlepovania by sa bez neho na už spočítanom regióne
          # neprejavila) a `rock-plan.py` vyberá mriežku, na ktorej sa trasuje.
          SCHEMA_HASH: ${{ hashFiles('workers/contours-rocks/contours.yml', 'workers/contours-rocks/rocks.yml', 'workers/contours-rocks/rock-areas.py', 'workers/contours-rocks/rock-plan.py', 'workers/contours-rocks/smooth-shapes.py', 'workers/contours-rocks/build.sh', 'workers/lib/contour-blocks.py') }}
        run: workers/plan/cache-keys.sh

      # Kým starý záznam existuje, nový sa pod ten istý kľúč neuloží (na Drive
      # platí to isté pravidlo ako v GitHube) – a beh, ktorý mal počítať
      # nanovo, by o svoju prácu prišiel.
      - name: Pregenerovanie – zmaž staré cache
        if: ${{ needs.plan.outputs.opt_contours_rebuild == 'true' || needs.plan.outputs.opt_rocks_rebuild == 'true' || needs.plan.outputs.opt_terrain_rebuild == 'true' }}
        run: |
          set -uo pipefail
          drop() { # $1 = kľúč cache
            python3 workers/drive/cache.py --delete --key="$1"
          }
          if [ '${{ needs.plan.outputs.opt_contours_rebuild }}' = 'true' ] || [ '${{ needs.plan.outputs.opt_rocks_rebuild }}' = 'true' ]; then
            drop '${{ steps.keys.outputs.contours }}'
            # Skaly majú ten istý kľúč s príponou `-rocks` (vlastný job,
            # vlastný záznam). Kým sa mazal len ten prvý, pregenerovanie skál
            # síce prepočítalo, ale uložiť sa už nemalo kam – a ďalší beh
            # dostal z cache tie PÔVODNÉ skaly, ako keby sa nič nezmenilo.
            drop '${{ steps.keys.outputs.contours }}-rocks'
          fi
          if [ '${{ needs.plan.outputs.opt_terrain_rebuild }}' = 'true' ]; then
            drop '${{ steps.keys.outputs.terrain }}'
          fi

  # ---------- vrstevnice a skaly ----------
  # Najdlhší job (skaly sú desiatky minút). Vlastný job znamená vlastný
  # timeout a hlavne: keď spadne, mapa, tieňovanie ani ikonky sa nezahodia.
  contours:
    name: Vrstevnice
    # `shading-rocks` je v needs kvôli poradiu, nie kvôli dátam: keď skaly
    # idú z tieňovania, musí byť súbor v sklade skôr, než si ho tento job
    # vypýta. Pri inom zdroji je ten job preskočený a `!cancelled()` sa
    # o preskočenú závislosť nezastaví.
    needs: [plan, keys, shading-rocks]
    if: ${{ !cancelled() && needs.plan.outputs.opt_contours == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      # `read`: hotové skaly idú do skladu na Drive, nie do releasu.
      contents: read
    outputs:
      enabled: ${{ steps.contours.outputs.enabled }}
      maxzoom: ${{ steps.contours.outputs.maxzoom }}
      # Skaly sú od vrstevníc oddelené aj tu: vlastný .pmtiles, vlastný
      # maxzoom, vlastný zapínač. Vrstevnice sa dajú vypnúť a skaly nechať.
      dem_source: ${{ steps.contours.outputs.dem_source }}
      size_mb: ${{ steps.contours.outputs.size_mb }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # Meranie krokov musí byť v pracovnom priečinku – `hashFiles` inam
      # nevidí, takže by sa artefakt nikdy neodložil.
      - name: Priprav priečinok na meranie
        run: mkdir -p steps-out


      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Planetileru (restore)
        id: planetiler-cache
        uses: ./.github/actions/cache-restore
        with:
          path: planetiler.jar
          key: planetiler-latest-${{ needs.plan.outputs.day }}

      - name: Stiahni Planetiler
        run: workers/lib/planetiler.sh
      # ---------- kľúče cache ----------
  # ---------- vrstevnice a skaly ----------
      # OSM výškový model neobsahuje (má len bodový tag `ele`), takže terén
      # ide z externého DEM: **Sonny's LiDAR DTM** z releasu `dem-sonny`
      # (napĺňa ho workflow "Dáta · výškové modely"). Je to LiDAR *model terénu*, teda
      # bez stromov a striech.
      #
      # Copernicus GLO-30 ako záloha je zámerne VYPNUTÝ. Je to model povrchu:
      # vrstevnice by v lese viedli po korunách stromov a skaly by vychádzali
      # z vegetácie. Miešať to s LiDARom v jednej mape znamená, že polovica
      # mapy klame a nikde nie je vidieť, ktorá. Keď dlaždica chýba, build
      # radšej zlyhá s hláškou. (Späť sa dá zapnúť tým, že sa sem vráti
      # sťahovanie z copernicus-dem-30m.s3.amazonaws.com – viď história.)
      #
      # Z toho istého DEM vznikajú aj skalné plochy – husté vrstevnice sú len
      # obraz veľkého sklonu, takže sa počítajú priamo zo sklonu terénu.
      #
      # Robia sa PRED dlaždicami zámerne: obe idú na tú istú stránku a musia
      # sa zmestiť do jedného rozpočtu. Keď sa vrstevnice urobia prvé, vie
      # Planetiler dostať presne toľko miesta, koľko naozaj zvýšilo – inak by
      # sa build po hodine tilovania zabil na tom, že súčet je nad limitom.
      #
      # Pri pregenerovaní (`contours_rebuild` / `rocks_rebuild`) sa restore
      # preskočí, takže krok nižšie beží aj vtedy, keď cache existuje. Starý
      # záznam už zmazal krok „Pregenerovanie", nech sa dá uložiť nový.
      - name: Cache vrstevníc a skál (restore)
        id: contours-cache
        if: ${{ needs.plan.outputs.opt_contours == 'true' && needs.plan.outputs.opt_contours_rebuild != 'true' && needs.plan.outputs.opt_rocks_rebuild != 'true' }}
        uses: ./.github/actions/cache-restore
        with:
          path: contours-out
          key: ${{ needs.keys.outputs.contours }}

      # DEM dlaždice sú desiatky MB na kus a menia sa len vtedy, keď sa zmení
      # sklade – čo je presne to, čo hovorí `demkey`. Tie sa nepregenerúvajú
      # nikdy: sú to stiahnuté dáta, nie výpočet.
      #
      # Cachuje sa celý `dem/`, lebo v ňom môžu byť dva modely naraz
      # (`dem/sonny/tiles`, `dem/dmr5/tiles`) – vrstevnice a skaly majú
      # vlastný zdroj. Medzivýsledky (orez, izolínie) idú preto do `work/`
      # a nie sem, nech sa do cache nedostane niekoľkogigabajtový `clip.tif`.
      # Polygón kraja z prípravy – bez neho by sa vrstva počítala na celom
      # bboxe regiónu, teda aj mimo kraj (pri Prešovskom 37 % územia navyše).
      - name: Stiahni polygón kraja
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: region-poly
          path: data

      - name: Cache DEM dlaždíc (restore)
        id: demtiles-cache
        if: ${{ needs.plan.outputs.opt_contours == 'true' }}
        uses: ./.github/actions/cache-restore
        with:
          path: dem
          key: ${{ needs.keys.outputs.demtiles_contours }}

      # SKLAD ČASTÍ SKLONU. Toto je tá vrstva, vďaka ktorej zrušený beh
      # nezahodí hodinu čítania z Drive. Kľúč nesie výrez a mriežku, ale NIE
      # prah sklonu – ten sa uplatňuje až pri vektorizácii, takže jeho zmena
      # smie sklad použiť a preráta sa len tá lacná časť.
      #
      # `restore-keys` je tu podstatné: časti majú absolútnu mriežku, takže
      # starší záznam pre to isté pohorie je použiteľný aj po zmene ostatných
      # nastavení – čo sa v ňom nájde, to sa nepočíta. Čo chýba, dopočíta beh
      # a uloží aj do releasu `dem-slope`, ktorý na rozdiel od cache nevyprší.
      # Dvadsať kilobajtov bashu je vo `workers/contours-rocks/build.sh` – workflow
      # súbor má strop, nad ktorým ho GitHub ticho neprijme (stráži to Lint
      # workflows). Sem chodia len hodnoty z formulára a z prípravy.
      - name: Vrstevnice a skaly z DEM
        if: ${{ needs.plan.outputs.opt_contours == 'true' && steps.contours-cache.outputs.cache-hit != 'true' }}
        env:
          ONLY: contours
          GH_TOKEN: ${{ github.token }}
          # Územie výpočtu, nie mapy: pri rýchlom teste je to štvorec so 4 km²,
          # kým mapa okolo neho ostáva celý región.
          REGION_BBOX: ${{ needs.plan.outputs.dem_bbox }}
          REGION_KEY: ${{ needs.plan.outputs.key }}
          AREA_KEY_IN: ${{ needs.plan.outputs.area_key }}
          AREA_NAME_IN: ${{ needs.plan.outputs.area_name }}
          AREA_BBOX_IN: ${{ needs.plan.outputs.area_bbox }}
          AREA_KM2: ${{ needs.plan.outputs.area_km2 }}
          CONTOUR_INTERVAL: ${{ needs.plan.outputs.opt_contour_interval }}
          OPT_CONTOUR_LINES: ${{ needs.plan.outputs.opt_contour_lines }}
          OPT_CONTOUR_SOURCE: ${{ needs.plan.outputs.opt_contour_source }}
          OPT_CONTOUR_SMOOTHING: ${{ needs.plan.outputs.opt_contour_smoothing }}
          OPT_CONTOUR_MAXZOOM: ${{ needs.plan.outputs.opt_contour_maxzoom }}
          OPT_ROCK_MAXZOOM: ${{ needs.plan.outputs.opt_rock_maxzoom }}
          OPT_ROCK_PLNE: ${{ needs.plan.outputs.opt_rock_plne }}
          OPT_ROCK_ZAPLN_DIERY: ${{ needs.plan.outputs.opt_rock_zapln_diery }}
          ROCK_SLOPE_IN: ${{ inputs.rock_slope }}
          ROCK_RES_IN: ${{ needs.plan.outputs.opt_rock_res }}
          OPT_ROCKS: ${{ needs.plan.outputs.opt_rocks }}
          OPT_ROCK_DEM: ${{ needs.plan.outputs.opt_rock_dem }}
          OPT_ROCK_SOURCE: ${{ needs.plan.outputs.opt_rock_source }}
          OPT_ROCK_IMG_ASSET: ${{ needs.plan.outputs.opt_rock_img_asset }}
          OPT_ROCKS_REBUILD: ${{ needs.plan.outputs.opt_rocks_rebuild }}
          OPT_SIZE_LIMIT_MB: ${{ needs.plan.outputs.opt_size_limit_mb }}
          OPT_UGKK_FALLBACK: ${{ needs.plan.outputs.opt_ugkk_fallback }}
          # Sklad častí sklonu. Testovací beh sa ho nesmie dotknúť (počíta
          # pár km² a jeho časti by v sklade vyzerali ako plnohodnotné),
          # `rocks_rebuild` ho má obísť.
          OPT_TEST_KM2: ${{ needs.plan.outputs.test_km2 }}
          SLOPE_DIR: slope-chunks
          # Drive je latenčný, nie úzky – šesť častí naraz je meraný
          # kompromis (nad ~16 vláknami začne odpovedať 403).
          SLOPE_JOBS: "6"
          # Skaly z `dmr5` čítajú sklon rovno z Drive (`slope-chunks.py
          # --drive`), takže token vlastníka potrebujú aj tu – inak by tá
          # vetva jediná ostala na verejnom dennom limite.
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          DRIVE_CLIENT: ${{ vars.DRIVE_CLIENT }}
          DRIVE_SECRET: ${{ secrets.DRIVE_SECRET }}
          DRIVE_REFRESH: ${{ secrets.DRIVE_REFRESH }}
        run: bash workers/contours-rocks/build.sh
      # Uloží sa hneď, ako vrstevnice a skaly existujú – aj keď by build ďalej
      # spadol, hodiny výpočtu ostanú v cache.

      - name: Cache vrstevníc a skál (save)
        if: ${{ always() && needs.plan.outputs.opt_contours == 'true' && steps.contours-cache.outputs.cache-hit != 'true' && hashFiles('contours-out/**') != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: contours-out
          key: ${{ needs.keys.outputs.contours }}

      # `always()` je tu to podstatné: sklad má prežiť práve tie behy, ktoré
      # sa nedopočítali. Keď job spadne alebo ho niekto zruší v polovici,
      # hotové časti sa aj tak uložia a ďalší beh dopočíta len zvyšok.
      # (Do skladu `dem-slope` ich ukladá `slope-chunks.py` hneď, ako
      # vzniknú – toto je len rýchlejšia vrstva.)
      # Testovací beh sa neukladá. Počíta pár km², takže by pod ten istý
      # prefix uložil takmer prázdny sklad – a `restore-keys` berie NAJNOVŠÍ
      # záznam, takže by ďalší ostrý beh dostal ten chudobný namiesto plného.
      # (Prísť by o nič netrpel, časti sú aj v sklade `dem-slope`, ale ťahal
      # by ich zbytočne odtiaľ.)
      - name: Cache DEM dlaždíc (save)
        if: ${{ always() && needs.plan.outputs.opt_contours == 'true' && steps.demtiles-cache.outputs.cache-hit != 'true' && hashFiles('dem/**') != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: dem
          key: ${{ needs.keys.outputs.demtiles_contours }}

      # Vo `workers/contours-rocks/site.sh` – ten istý krok majú DVA joby
      # (`contours` a `rocks`), takže tu stál dvakrát a dve kópie sa vždy
      # raz rozídu. Odteraz je jeden súbor.
      - name: Zaraď vrstevnice do webu
        id: contours
        if: ${{ needs.plan.outputs.opt_contours == 'true' }}
        env:
          ONLY: contours
          CACHE_HIT: ${{ steps.contours-cache.outputs.cache-hit }}
          OPT_CONTOUR_LINES: ${{ needs.plan.outputs.opt_contour_lines }}
          OPT_CONTOUR_MAXZOOM: ${{ needs.plan.outputs.opt_contour_maxzoom }}
          OPT_ROCKS: ${{ needs.plan.outputs.opt_rocks }}
          OPT_ROCK_MAXZOOM: ${{ needs.plan.outputs.opt_rock_maxzoom }}
          REGION_KEY: ${{ needs.plan.outputs.key }}
        run: workers/contours-rocks/site.sh

      # Do skladu na Drive, nie ako artefakt behu: do GitHubu sa nepublikuje
      # nič. Zoznam súborov je vo `workers/deploy/publish-results.sh`, lebo ten istý
      # krok majú dva joby (`contours` a `rocks`) a dve kópie sa vždy raz
      # rozídu. Sklad `vysledky` prerieďuje „Údržba · týždenné upratovanie" na 90 dní – presne
      # tá retencia, ktorú mal artefakt.
      - name: Odlož skaly a vrstevnice do skladu
        if: ${{ needs.plan.outputs.opt_contours == 'true' && hashFiles('data/rock.gpkg') != '' }}
        continue-on-error: true
        env:
          CO: teren
          NAZOV: teren-${{ needs.plan.outputs.key }}-s${{ inputs.rock_slope }}-g${{ needs.plan.outputs.opt_rock_res }}
        run: workers/deploy/publish-results.sh

      # Časti stránky si joby posielajú artefaktom – každý vyrobí svoj kus
      # `_site` a `deploy` ich zlepí dokopy. compression-level 0: .pmtiles
      # aj .png sú už komprimované, balenie by len ukradlo minúty.
      - name: Odlož časť stránky
        if: ${{ always() && hashFiles('_site/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: site-contours
          path: _site
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore

      # Štatistika skál ide k meraniu krokov, nie na stránku – súhrn ju
      # potrebuje, prehliadač nie.
      - name: Pribal štatistiku skál k meraniu
        if: ${{ always() }}
        run: cp contours-out/rock-stats.txt steps-out/ 2>/dev/null || true

      - name: Odlož meranie krokov
        if: ${{ always() && hashFiles('steps-out/*') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: steps-contours
          path: steps-out
          retention-days: 1
          if-no-files-found: ignore

  # ---------- tieňovanie a 3D terén ----------
  # Nezávislé od vrstevníc – oboje potrebuje len DEM, takže môžu bežať naraz.
  rocks:
    # Druhá polovica toho, čo bolo kedysi „Vrstevnice a skaly": ten istý
    # skript s `ONLY: rocks`. Rozpis, prečo je ktorý krok taký, aký je,
    # stojí pri jobe `contours` – tu by to bola druhá kópia, ktorá sa raz
    # rozíde s prvou.
    name: Skaly
    needs: [plan, keys, shading-rocks]
    if: ${{ !cancelled() && needs.plan.outputs.opt_contours == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      # `read`: hotové skaly idú do skladu na Drive, nie do releasu.
      contents: read
    outputs:
      enabled: ${{ steps.contours.outputs.rocks_enabled }}
      rocks_enabled: ${{ steps.contours.outputs.rocks_enabled }}
      rocks_maxzoom: ${{ steps.contours.outputs.rocks_maxzoom }}
      dem_source: ${{ steps.contours.outputs.dem_source }}
      rock_slope: ${{ steps.contours.outputs.rock_slope }}
      rock_source: ${{ steps.contours.outputs.rock_source }}
      size_mb: ${{ steps.contours.outputs.size_mb }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Priprav priečinok na meranie
        run: mkdir -p steps-out

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Planetileru (restore)
        id: planetiler-cache
        uses: ./.github/actions/cache-restore
        with:
          path: planetiler.jar
          key: planetiler-latest-${{ needs.plan.outputs.day }}

      - name: Stiahni Planetiler
        run: workers/lib/planetiler.sh
      - name: Cache vrstevníc a skál (restore)
        id: contours-cache
        if: ${{ needs.plan.outputs.opt_contours == 'true' && needs.plan.outputs.opt_contours_rebuild != 'true' && needs.plan.outputs.opt_rocks_rebuild != 'true' }}
        uses: ./.github/actions/cache-restore
        with:
          path: contours-out
          key: ${{ needs.keys.outputs.contours }}-rocks

      # Polygón kraja z prípravy – bez neho by sa vrstva počítala na celom
      # bboxe regiónu, teda aj mimo kraj (pri Prešovskom 37 % územia navyše).
      - name: Stiahni polygón kraja
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: region-poly
          path: data

      - name: Cache DEM dlaždíc (restore)
        id: demtiles-cache
        if: ${{ needs.plan.outputs.opt_contours == 'true' }}
        uses: ./.github/actions/cache-restore
        with:
          path: dem
          key: ${{ needs.keys.outputs.demtiles_contours }}-rocks

      - name: Cache častí sklonu (restore)
        id: slope-cache
        if: ${{ needs.plan.outputs.opt_contours == 'true' && needs.plan.outputs.opt_rocks_rebuild != 'true' }}
        uses: ./.github/actions/cache-restore
        with:
          path: slope-chunks
          key: ${{ needs.keys.outputs.slope }}${{ github.run_id }}
          restore-keys: |
            ${{ needs.keys.outputs.slope }}

      - name: Vrstevnice a skaly z DEM
        if: ${{ needs.plan.outputs.opt_contours == 'true' && steps.contours-cache.outputs.cache-hit != 'true' }}
        env:
          ONLY: rocks
          GH_TOKEN: ${{ github.token }}
          REGION_BBOX: ${{ needs.plan.outputs.dem_bbox }}
          REGION_KEY: ${{ needs.plan.outputs.key }}
          AREA_KEY_IN: ${{ needs.plan.outputs.area_key }}
          AREA_NAME_IN: ${{ needs.plan.outputs.area_name }}
          AREA_BBOX_IN: ${{ needs.plan.outputs.area_bbox }}
          AREA_KM2: ${{ needs.plan.outputs.area_km2 }}
          CONTOUR_INTERVAL: ${{ needs.plan.outputs.opt_contour_interval }}
          OPT_CONTOUR_LINES: ${{ needs.plan.outputs.opt_contour_lines }}
          OPT_CONTOUR_SOURCE: ${{ needs.plan.outputs.opt_contour_source }}
          OPT_CONTOUR_SMOOTHING: ${{ needs.plan.outputs.opt_contour_smoothing }}
          OPT_CONTOUR_MAXZOOM: ${{ needs.plan.outputs.opt_contour_maxzoom }}
          OPT_ROCK_MAXZOOM: ${{ needs.plan.outputs.opt_rock_maxzoom }}
          OPT_ROCK_PLNE: ${{ needs.plan.outputs.opt_rock_plne }}
          OPT_ROCK_ZAPLN_DIERY: ${{ needs.plan.outputs.opt_rock_zapln_diery }}
          ROCK_SLOPE_IN: ${{ inputs.rock_slope }}
          ROCK_RES_IN: ${{ needs.plan.outputs.opt_rock_res }}
          OPT_ROCKS: ${{ needs.plan.outputs.opt_rocks }}
          OPT_ROCK_DEM: ${{ needs.plan.outputs.opt_rock_dem }}
          OPT_ROCK_SOURCE: ${{ needs.plan.outputs.opt_rock_source }}
          OPT_ROCK_IMG_ASSET: ${{ needs.plan.outputs.opt_rock_img_asset }}
          OPT_ROCKS_REBUILD: ${{ needs.plan.outputs.opt_rocks_rebuild }}
          OPT_SIZE_LIMIT_MB: ${{ needs.plan.outputs.opt_size_limit_mb }}
          OPT_UGKK_FALLBACK: ${{ needs.plan.outputs.opt_ugkk_fallback }}
          OPT_TEST_KM2: ${{ needs.plan.outputs.test_km2 }}
          SLOPE_DIR: slope-chunks
          SLOPE_JOBS: "6"
          # Toto je TEN krok, čo z Drive číta najviac: sklon pre skaly z `dmr5`
          # ide po častiach rovno zo 145 GB rastra. Bez tokenu vlastníka by
          # bežal na verejnom dennom limite.
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          DRIVE_CLIENT: ${{ vars.DRIVE_CLIENT }}
          DRIVE_SECRET: ${{ secrets.DRIVE_SECRET }}
          DRIVE_REFRESH: ${{ secrets.DRIVE_REFRESH }}
        run: bash workers/contours-rocks/build.sh

      - name: Cache vrstevníc a skál (save)
        if: ${{ always() && needs.plan.outputs.opt_contours == 'true' && steps.contours-cache.outputs.cache-hit != 'true' && hashFiles('contours-out/**') != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: contours-out
          key: ${{ needs.keys.outputs.contours }}-rocks

      - name: Cache častí sklonu (save)
        if: ${{ always() && needs.plan.outputs.opt_contours == 'true' && needs.plan.outputs.test_km2 == '0' && steps.slope-cache.outputs.cache-hit != 'true' && hashFiles('slope-chunks/**') != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: slope-chunks
          key: ${{ needs.keys.outputs.slope }}${{ github.run_id }}

      - name: Cache DEM dlaždíc (save)
        if: ${{ always() && needs.plan.outputs.opt_contours == 'true' && steps.demtiles-cache.outputs.cache-hit != 'true' && hashFiles('dem/**') != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: dem
          key: ${{ needs.keys.outputs.demtiles_contours }}-rocks

      # Vo `workers/contours-rocks/site.sh` – ten istý krok majú DVA joby
      # (`contours` a `rocks`), takže tu stál dvakrát a dve kópie sa vždy
      # raz rozídu. Odteraz je jeden súbor.
      - name: Zaraď vrstevnice do webu
        id: contours
        if: ${{ needs.plan.outputs.opt_contours == 'true' }}
        env:
          ONLY: rocks
          CACHE_HIT: ${{ steps.contours-cache.outputs.cache-hit }}
          OPT_CONTOUR_LINES: ${{ needs.plan.outputs.opt_contour_lines }}
          OPT_CONTOUR_MAXZOOM: ${{ needs.plan.outputs.opt_contour_maxzoom }}
          OPT_ROCKS: ${{ needs.plan.outputs.opt_rocks }}
          OPT_ROCK_MAXZOOM: ${{ needs.plan.outputs.opt_rock_maxzoom }}
          REGION_KEY: ${{ needs.plan.outputs.key }}
        run: workers/contours-rocks/site.sh

      # Do skladu na Drive, nie ako artefakt behu: do GitHubu sa nepublikuje
      # nič. Zoznam súborov je vo `workers/deploy/publish-results.sh`, lebo ten istý
      # krok majú dva joby (`contours` a `rocks`) a dve kópie sa vždy raz
      # rozídu. Sklad `vysledky` prerieďuje „Údržba · týždenné upratovanie" na 90 dní – presne
      # tá retencia, ktorú mal artefakt.
      - name: Odlož skaly a vrstevnice do skladu
        if: ${{ needs.plan.outputs.opt_contours == 'true' && hashFiles('data/rock.gpkg') != '' }}
        continue-on-error: true
        env:
          CO: teren
          NAZOV: skaly-${{ needs.plan.outputs.key }}-s${{ inputs.rock_slope }}-g${{ needs.plan.outputs.opt_rock_res }}
        run: workers/deploy/publish-results.sh

      - name: Odlož časť stránky
        if: ${{ always() && hashFiles('_site/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: site-rocks
          path: _site
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore

      - name: Pribal štatistiku skál k meraniu
        if: ${{ always() }}
        run: cp contours-out/rock-stats.txt steps-out/ 2>/dev/null || true

      - name: Odlož meranie krokov
        if: ${{ always() && hashFiles('steps-out/*') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: steps-rocks
          path: steps-out
          retention-days: 1
          if-no-files-found: ignore

  terrain:
    name: Tieňovanie a 3D terén
    needs: [plan, keys]
    if: ${{ !cancelled() && needs.plan.outputs.opt_terrain == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      # `read`: hotové dlaždice idú do skladu na Drive, nie do releasu.
      contents: read
    outputs:
      enabled: ${{ steps.terrain.outputs.enabled }}
      maxzoom: ${{ steps.terrain.outputs.maxzoom }}
      dem_source: ${{ steps.terrain.outputs.dem_source }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # Meranie krokov musí byť v pracovnom priečinku – `hashFiles` inam
      # nevidí, takže by sa artefakt nikdy neodložil.
      - name: Priprav priečinok na meranie
        run: mkdir -p steps-out


      # ---------- tieňovanie reliéfu a 3D terén ----------
      # MapLibre nevie čítať výšky z GeoTIFFu – potrebuje pyramídu PNG dlaždíc
      # (kódovanie terrarium). Model si tieňovanie vyberá vlastným inputom
      # `shading_source`: LiDARový model terénu je tu podstatný rovnako ako
      # pri vrstevniciach (3D reliéf nemá dvíhať koruny stromov), ale nemusí
      # to byť ten istý – tieňovanie potrebuje celý región, kým vrstevnice
      # a skaly sa dajú počítať aj z modelu, ktorý máme len na výrez.
      #
      # Sú drahé na výpočet, ale závisia len od územia – preto sa raz uložia
      # do releasu `dem-terrain` ako jeden .tar.zst a nabudúce sa len stiahnu.
      # `terrain_rebuild` ich prepíše nanovo.
      # DEM dlaždice majú vlastný kľúč (vlastný zdroj), takže sa s cache jobu
      # s vrstevnicami nepomiešajú ani vtedy, keď si vyberú iný model.
      # Polygón kraja z prípravy – bez neho by sa vrstva počítala na celom
      # bboxe regiónu, teda aj mimo kraj (pri Prešovskom 37 % územia navyše).
      - name: Stiahni polygón kraja
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: region-poly
          path: data

      - name: Cache DEM dlaždíc (restore)
        id: demtiles-cache
        uses: ./.github/actions/cache-restore
        with:
          path: dem
          key: ${{ needs.keys.outputs.demtiles_terrain }}

      - name: Cache výškových dlaždíc (restore)
        id: terrain-cache
        if: ${{ needs.plan.outputs.opt_terrain == 'true' && needs.plan.outputs.opt_terrain_rebuild != 'true' }}
        uses: ./.github/actions/cache-restore
        with:
          path: terrain-out
          key: ${{ needs.keys.outputs.terrain }}

      - name: Tieňovanie reliéfu (PNG dlaždice z vybraného DEM)
        id: terrain
        if: ${{ needs.plan.outputs.opt_terrain == 'true' }}
        env:
          REGION_KEY: ${{ needs.plan.outputs.key }}
          DEM_BBOX: ${{ needs.plan.outputs.dem_bbox }}
          SHADING_SOURCE: ${{ needs.plan.outputs.opt_shading_source }}
          TERRAIN_MAXZOOM: ${{ needs.plan.outputs.opt_terrain_maxzoom }}
          TERRAIN_REBUILD: ${{ needs.plan.outputs.opt_terrain_rebuild }}
          # Rozpočet na tieňovanie – aby sa strop veľkosti riešil pri
          # počítaní dlaždíc a nie až v kontrole pred nasadením, po hodine
          # práce. Podiel (BUDGET_TERRAIN_PCT) je v `env:` workflowu.
          SIZE_LIMIT_MB: ${{ needs.plan.outputs.opt_size_limit_mb }}
          GH_TOKEN: ${{ github.token }}
          OPT_UGKK_FALLBACK: ${{ needs.plan.outputs.opt_ugkk_fallback }}
        run: workers/terrain/build.sh
      - name: Cache výškových dlaždíc (save)
        if: ${{ always() && needs.plan.outputs.opt_terrain == 'true' && steps.terrain.outputs.fell_back != 'true' && steps.terrain-cache.outputs.cache-hit != 'true' && hashFiles('terrain-out/**') != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: terrain-out
          key: ${{ needs.keys.outputs.terrain }}

      # Kým mali oba joby ten istý kľúč, stačilo, že DEM dlaždice ukladal
      # ten s vrstevnicami. Teraz má tieňovanie vlastný zdroj a tým aj vlastný
      # kľúč – bez tohto kroku by sa jeho restore nikdy netrafil a model by sa
      # sťahoval pri každom behu.
      - name: Cache DEM dlaždíc (save)
        if: ${{ always() && steps.demtiles-cache.outputs.cache-hit != 'true' && hashFiles('dem/**') != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: dem
          key: ${{ needs.keys.outputs.demtiles_terrain }}

      # Časti stránky si joby posielajú artefaktom – každý vyrobí svoj kus
      # `_site` a `deploy` ich zlepí dokopy. compression-level 0: .pmtiles
      # aj .png sú už komprimované, balenie by len ukradlo minúty.
      - name: Odlož časť stránky
        if: ${{ always() && hashFiles('_site/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: site-terrain
          path: _site
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore

      - name: Odlož meranie krokov
        if: ${{ always() && hashFiles('steps-out/*') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: steps-terrain
          path: steps-out
          retention-days: 1
          if-no-files-found: ignore

  # ---------- značené trasy ----------
  # Trasa nie je cesta: je to `type=route` relácia nad cudzími cestami, ktorá
  # nesie značenie (farbu pásika, sieť, názov). Schéma OpenMapTiles relácie
  # trás nepozná – v hlavných dlaždiciach po nich nezostane ani stopa, takže
  # z mapy sa nedá zistiť, či po chodníku vedie červená turistická, dve
  # cyklotrasy, alebo nič.
  #
  # Vlastný job, lebo je to vlastný `.pmtiles` a bežať môže súbežne s mapou.
  # Necachuje sa: celé je to pár minút a závisí to na PBF, ktoré sa mení
  # denne – cache by sa aj tak trafila len v ten istý deň.
  trails:
    name: Značené trasy
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.opt_trails == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.trails.outputs.enabled }}
      maxzoom: ${{ steps.trails.outputs.maxzoom }}
      count: ${{ steps.trails.outputs.count }}
      size_mb: ${{ steps.trails.outputs.size_mb }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # Meranie krokov musí byť v pracovnom priečinku – `hashFiles` inam
      # nevidí, takže by sa artefakt nikdy neodložil.
      - name: Priprav priečinok na meranie
        run: mkdir -p steps-out

      - name: Stiahni PBF z prípravy
        uses: actions/download-artifact@v8
        with:
          name: pbf
          path: data

      # Polygón regiónu z prípravy – z neho je `--polygon` pre Planetiler
      # (workers/lib/region-clip.sh). Bez neho by sa dlaždice vyrábali na
      # celom obdĺžniku bboxu, teda aj ďaleko za regiónom. `continue-on-error`
      # preto, že aj bez neho sa beh dokončiť dá – skript to povie nahlas.
      - name: Stiahni polygón regiónu
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: region-poly
          path: data

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Planetileru (restore)
        id: planetiler-cache
        uses: ./.github/actions/cache-restore
        with:
          path: planetiler.jar
          key: planetiler-latest-${{ needs.plan.outputs.day }}

      - name: Stiahni Planetiler
        run: workers/lib/planetiler.sh
      - name: Cache Planetileru (save)
        if: ${{ always() && steps.planetiler-cache.outputs.cache-hit != 'true' && hashFiles('planetiler.jar') != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: planetiler.jar
          key: ${{ steps.planetiler-cache.outputs.cache-primary-key }}

      # Sedemdesiat riadkov bashu je vo `workers/trails/build.sh`.
      - name: Trasy z OSM relácií → PMTiles
        id: trails
        env:
          OPT_TRAILS_MAXZOOM: ${{ needs.plan.outputs.opt_trails_maxzoom }}
          OPT_REGION_CLIP: ${{ needs.plan.outputs.opt_region_clip }}
          REGION_BBOX: ${{ needs.plan.outputs.bbox }}
          REGION_KEY: ${{ needs.plan.outputs.key }}
          SIZE_LIMIT_MB: ${{ needs.plan.outputs.opt_size_limit_mb }}
        run: workers/trails/build.sh

      - name: Odlož trasy do skladu
        if: ${{ always() && hashFiles('data/trails.geojson') != '' }}
        continue-on-error: true
        env:
          CO: trasy
          NAZOV: trasy-${{ needs.plan.outputs.key }}
        run: workers/deploy/publish-results.sh

      # Časti stránky si joby posielajú artefaktom – každý vyrobí svoj kus
      # `_site` a `deploy` ich zlepí dokopy. compression-level 0: .pmtiles
      # je už komprimované, balenie by len ukradlo minúty.
      - name: Odlož časť stránky
        if: ${{ always() && hashFiles('_site/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: site-trails
          path: _site
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore

      - name: Odlož meranie krokov
        if: ${{ always() && hashFiles('steps-out/*') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: steps-trails
          path: steps-out
          retention-days: 1
          if-no-files-found: ignore

  # ---------- krajinné prvky, ktoré OpenMapTiles nemá ----------
  # Násypy, zárezy, múry, ploty, vedenia, prieseky, pramene, jaskyne,
  # rozhľadne, parkoviská a zjazdovky. Schéma OpenMapTiles sa pozerá len na
  # tridsať kľúčov a tieto medzi nimi nie sú – v základných dlaždiciach po
  # nich neostane stopa, takže sa z toho istého PBF ťahajú druhýkrát.
  # Vlastný job z rovnakého dôvodu ako trasy: vlastný .pmtiles a beží súbežne.
  features:
    name: Krajinné prvky
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.opt_features == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.features.outputs.enabled }}
      maxzoom: ${{ steps.features.outputs.maxzoom }}
      size_mb: ${{ steps.features.outputs.size_mb }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Priprav priečinok na meranie
        run: mkdir -p steps-out

      - name: Stiahni PBF z prípravy
        uses: actions/download-artifact@v8
        with:
          name: pbf
          path: data

      # Polygón regiónu z prípravy – z neho je `--polygon` pre Planetiler
      # (workers/lib/region-clip.sh). Bez neho by sa dlaždice vyrábali na
      # celom obdĺžniku bboxu, teda aj ďaleko za regiónom. `continue-on-error`
      # preto, že aj bez neho sa beh dokončiť dá – skript to povie nahlas.
      - name: Stiahni polygón regiónu
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: region-poly
          path: data

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Planetileru (restore)
        id: planetiler-cache
        uses: ./.github/actions/cache-restore
        with:
          path: planetiler.jar
          key: planetiler-latest-${{ needs.plan.outputs.day }}

      - name: Stiahni Planetiler
        run: workers/lib/planetiler.sh
      - name: Cache Planetileru (save)
        if: ${{ always() && steps.planetiler-cache.outputs.cache-hit != 'true' && hashFiles('planetiler.jar') != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: planetiler.jar
          key: ${{ steps.planetiler-cache.outputs.cache-primary-key }}

      # Sedemdesiat riadkov bashu je vo `workers/features/build.sh`.
      - name: Krajinné prvky z OSM → PMTiles
        id: features
        env:
          OPT_FEATURES_MAXZOOM: ${{ needs.plan.outputs.opt_features_maxzoom }}
          OPT_REGION_CLIP: ${{ needs.plan.outputs.opt_region_clip }}
          REGION_BBOX: ${{ needs.plan.outputs.bbox }}
          REGION_KEY: ${{ needs.plan.outputs.key }}
          SIZE_LIMIT_MB: ${{ needs.plan.outputs.opt_size_limit_mb }}
        run: workers/features/build.sh

      - name: Odlož časť stránky
        if: ${{ always() && hashFiles('_site/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: site-features
          path: _site
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore

      - name: Odlož meranie krokov
        if: ${{ always() && hashFiles('steps-out/*') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: steps-features
          path: steps-out
          retention-days: 1
          if-no-files-found: ignore

  # Vo vlastnom súbore, lebo tento je pri strope 128 KiB – dôvod v `roads.yml`.
  roads:
    name: Obmedzenia na ceste
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.opt_roads == 'true' }}
    uses: ./.github/workflows/roads.yml
    secrets: inherit                      # cache na Drive; `env` sa nededí
    with:
      region_key: ${{ needs.plan.outputs.key }}
      region_bbox: ${{ needs.plan.outputs.bbox }}
      maxzoom: ${{ needs.plan.outputs.opt_roads_maxzoom }}
      region_clip: ${{ needs.plan.outputs.opt_region_clip }}
      size_limit_mb: ${{ needs.plan.outputs.opt_size_limit_mb }}
      budget_pct: ${{ needs.plan.outputs.budget_roads_pct }}
      day: ${{ needs.plan.outputs.day }}

  # ---------- vyhľadávací index ----------
  # Beží súbežne s inými jobami. Čítame predfiltrovaný PBF a budujeme
  # SQLite FTS5 index na offline vyhľadávanie. Index sa balí do mapa kusa
  # v `_site/tiles/search-index.db`.
  search:
    name: Vyhľadávací index
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.opt_search == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.search.outputs.enabled }}
      size_mb: ${{ steps.search.outputs.size_mb }}
      row_count: ${{ steps.search.outputs.row_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Priprav priečinok na meranie
        run: mkdir -p steps-out

      - name: Stiahni PBF z prípravy
        uses: actions/download-artifact@v8
        with:
          name: pbf
          path: data

      - name: Nainštaluj osmium-tool a Python knižnice
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool python3-pip
          pip3 install osmium

      # Vyhľadávací index z PBF → SQLite FTS5
      - name: Vyhľadávací index z OSM → SQLite
        id: search
        env:
          REGION_KEY: ${{ needs.plan.outputs.key }}
          OSM_ID_FIELD: osm_id
        run: workers/search/build.sh

      - name: Odlož kus stránky
        if: ${{ always() && hashFiles('_site/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: site-search
          path: _site
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore

      - name: Odlož meranie krokov
        if: ${{ always() && hashFiles('steps-out/*') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: steps-search
          path: steps-out
          retention-days: 1
          if-no-files-found: ignore

  # ---------- mapové dlaždice ----------
  # Beží súbežne s vrstevnicami, trasami aj tieňovaním – z nich nič
  # nepotrebuje, len PBF z prípravy.
  tiles:
    name: Mapové dlaždice (Planetiler)
    needs: plan
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      maxzoom: ${{ steps.tiles.outputs.maxzoom }}
      size_mb: ${{ steps.tiles.outputs.size_mb }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # Meranie krokov musí byť v pracovnom priečinku – `hashFiles` inam
      # nevidí, takže by sa artefakt nikdy neodložil.
      - name: Priprav priečinok na meranie
        run: mkdir -p steps-out

      - name: Stiahni PBF z prípravy
        uses: actions/download-artifact@v8
        with:
          name: pbf
          path: data

      # Polygón regiónu z prípravy – z neho je `--polygon` pre Planetiler
      # (workers/lib/region-clip.sh). Bez neho by sa dlaždice vyrábali na
      # celom obdĺžniku bboxu, teda aj ďaleko za regiónom. `continue-on-error`
      # preto, že aj bez neho sa beh dokončiť dá – skript to povie nahlas.
      - name: Stiahni polygón regiónu
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: region-poly
          path: data


      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Kým to bola cache v GitHube, stačil jeden krok (`actions/cache` uloží
      # sám v post-kroku). Na Drive sú to dva – a je to tak lepšie: ukladá sa
      # hneď po stiahnutí a nie až vtedy, keď job dobehne úspešne.
      - name: Cache – zdrojové dáta Planetileru (restore)
        id: sources-cache
        uses: ./.github/actions/cache-restore
        with:
          path: data/sources
          key: planetiler-sources-v1

      - name: Cache Planetileru (restore)
        id: planetiler-cache
        uses: ./.github/actions/cache-restore
        with:
          path: planetiler.jar
          key: planetiler-latest-${{ needs.plan.outputs.day }}

      - name: Stiahni Planetiler
        run: workers/lib/planetiler.sh
      - name: Cache Planetileru (save)
        if: ${{ always() && steps.planetiler-cache.outputs.cache-hit != 'true' && hashFiles('planetiler.jar') != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: planetiler.jar
          key: ${{ steps.planetiler-cache.outputs.cache-primary-key }}

      # Osemdesiat riadkov bashu je vo `workers/tiles/build.sh`; rozpočtové
      # podiely (`BUDGET_*`) si berie z env workflowu.
      - name: PBF → PMTiles (Planetiler, OpenMapTiles schéma)
        id: tiles
        env:
          OPT_AUTO_SHRINK: ${{ needs.plan.outputs.opt_auto_shrink }}
          OPT_MAXZOOM: ${{ needs.plan.outputs.opt_maxzoom }}
          OPT_REGION_CLIP: ${{ needs.plan.outputs.opt_region_clip }}
          REGION_BBOX: ${{ needs.plan.outputs.bbox }}
          REGION_KEY: ${{ needs.plan.outputs.key }}
          SIZE_LIMIT_MB: ${{ needs.plan.outputs.opt_size_limit_mb }}
        run: workers/tiles/build.sh

      # Zdrojové dáta si Planetiler stiahol počas behu vyššie (water polygons
      # majú ~700 MB) – odkladajú sa až teraz, keď existujú.
      - name: Cache – zdrojové dáta Planetileru (save)
        if: ${{ always() && steps.sources-cache.outputs.cache-hit != 'true' && hashFiles('data/sources/**') != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: data/sources
          key: ${{ steps.sources-cache.outputs.cache-primary-key }}

      - name: Odlož časť stránky
        if: ${{ always() && hashFiles('_site/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: site-tiles
          path: _site
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore

      - name: Odlož meranie krokov
        if: ${{ always() && hashFiles('steps-out/*') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: steps-tiles
          path: steps-out
          retention-days: 1
          if-no-files-found: ignore

  # ---------- ikonky a fonty ----------
  # Nezávisí od ničoho okrem kódu, takže beží od začiatku súbežne so všetkým.
  assets:
    name: Ikonky a fonty
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.sprite.outputs.name }}
      available: ${{ steps.sprite.outputs.available }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # Meranie krokov musí byť v pracovnom priečinku – `hashFiles` inam
      # nevidí, takže by sa artefakt nikdy neodložil.
      - name: Priprav priečinok na meranie
        run: mkdir -p steps-out


      - name: Cache glyfov a spritov (restore)
        id: assets-cache
        uses: ./.github/actions/cache-restore
        with:
          path: |
            _site/fonts
            _site/sprites
          key: assets-${{ hashFiles('poc/web/icon-sources.js', 'poc/web/shields.js', 'poc/web/marks.js', 'poc/web/style-overrides.json', 'workers/assets/sprite.mjs', 'workers/assets/shields.mjs', 'workers/assets/marks.mjs', 'workers/assets/custom-icons.mjs', 'workers/lib/sprite-bake.mjs') }}-${{ env.GLYPHS_ZIP }}

      # Sedemdesiat riadkov bashu je vo `workers/assets/icons.sh`.
      - name: Stiahni a priprav sady ikoniek
        id: sprite
        run: workers/assets/icons.sh

      # Vo `workers/assets/glyphs.sh`; `GLYPHS_ZIP` si berie z env workflowu.
      - name: Stiahni glyfy (fonty) k sebe na Pages
        run: workers/assets/glyphs.sh

      - name: Cache glyfov a spritov (save)
        if: ${{ always() && steps.assets-cache.outputs.cache-hit != 'true' && hashFiles('_site/sprites/**') != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: |
            _site/fonts
            _site/sprites
          key: ${{ steps.assets-cache.outputs.cache-primary-key }}

      # Časti stránky si joby posielajú artefaktom – každý vyrobí svoj kus
      # `_site` a `deploy` ich zlepí dokopy. compression-level 0: .pmtiles
      # aj .png sú už komprimované, balenie by len ukradlo minúty.
      - name: Odlož časť stránky
        if: ${{ always() && hashFiles('_site/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: site-assets
          path: _site
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore

      - name: Odlož meranie krokov
        if: ${{ always() && hashFiles('steps-out/*') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: steps-assets
          path: steps-out
          retention-days: 1
          if-no-files-found: ignore

  # ---------- zloženie a nasadenie ----------
  # Pozbiera kusy `_site` od ostatných jobov, dogeneruje štýly a manifest,
  # skontroluje a nasadí. `!cancelled()` a nie `success()`: keď vrstevnice
  # alebo tieňovanie spadnú alebo sú vypnuté, mapa sa má nasadiť aj tak –
  # bez nich, ale nasadiť.
  deploy:
    name: Zloženie a nasadenie
    needs: [plan, shading-rocks, contours, rocks, trails, features, roads, search, terrain, tiles, assets]
    if: ${{ !cancelled() && needs.tiles.result == 'success' && needs.assets.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      # `write`, a je to jediné miesto v celom builde, kde do repozitára niečo
      # ide: `maps.json` (katalóg hotových máp) sa po nahratí balíkov na Drive
      # commitne do vetvy, z ktorej beh vyšel. Nie je to publikovanie dát – tie
      # sú na Drive; je to zoznam, ktorý sa inak nedá zistiť bez tokenu.
      # Nezacyklí sa to: `Build map` sa spúšťa len ručne (`workflow_dispatch`).
      contents: write
      pages: write
      id-token: write
      actions: read     # súhrn číta joby a ich logy, keď niečo spadne
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # Každý job odložil svoj kus `_site` (dlaždice, vrstevnice, terén,
      # ikonky). `merge-multiple` ich rozbalí do jedného stromu presne tam,
      # odkiaľ pochádzali. Vzor `site-*`, nie mená: keď je nejaký job vypnutý
      # alebo spadol, jeho artefakt jednoducho nie je a nič sa nedeje.
      - name: Pozbieraj kusy stránky
        uses: actions/download-artifact@v8
        with:
          pattern: site-*
          path: _site
          merge-multiple: true

      - name: Stiahni meranie krokov od ostatných jobov
        if: ${{ always() }}
        uses: actions/download-artifact@v8
        with:
          pattern: steps-*
          path: steps-out
          merge-multiple: true

      - name: Čo prišlo od ostatných jobov
        run: |
          set -uo pipefail
          echo "Výsledky jobov: vrstevnice=${{ needs.contours.result }}, trasy=${{ needs.trails.result }}, prvky=${{ needs.features.result }}, obmedzenia=${{ needs.roads.result }}, hľadanie=${{ needs.search.result }}, terén=${{ needs.terrain.result }}, dlaždice=${{ needs.tiles.result }}, ikonky=${{ needs.assets.result }}"
          find _site -maxdepth 2 -mindepth 1 -type d -exec du -sh {} \; 2>/dev/null || true
          du -sm _site | cut -f1 | xargs -I{} echo "_site spolu: {} MB"


      # HRANICA STIAHNUTÉHO REGIÓNU. Dlaždice sú orezané po celých dlaždiciach
      # (`--polygon` v jobe `tiles`), takže na z14 môžu presahovať ešte
      # zhruba kilometer a pol. Presnú hranicu dokreslí štýl z tohto súboru –
      # za ňou nie je nič, ani vodstvo a Natural Earth, ktoré Planetiler dáva
      # do dlaždíc na celom obdĺžniku. Ide to do `_site`, čiže aj do ZIPu na
      # Drive, teda do mapy, ktorú si aplikácia stiahne do telefónu.
      - name: Stiahni polygón regiónu
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: region-poly
          path: data

      - name: Hranica regiónu pre viewer
        run: |
          python3 workers/deploy/region-mask.py \
            --poly=data/region.geojson \
            --bbox='${{ needs.plan.outputs.bbox }}' \
            --out=_site/region.geojson

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Vygeneruj statické style.json (web + iOS)
        run: |
          node workers/styles/build.mjs \
            --base-url='${{ steps.pages.outputs.base_url }}' \
            --region='${{ needs.plan.outputs.key }}' \
            --name='${{ needs.plan.outputs.name }}' \
            --maxzoom='${{ needs.tiles.outputs.maxzoom }}' \
            --contours='${{ needs.contours.outputs.enabled || 'false' }}' \
            --contours-maxzoom='${{ needs.contours.outputs.maxzoom || '14' }}' \
            --rocks='${{ needs.rocks.outputs.rocks_enabled || 'false' }}' \
            --rocks-maxzoom='${{ needs.rocks.outputs.rocks_maxzoom || '16' }}' \
            --trails='${{ needs.trails.outputs.enabled || 'false' }}' \
            --trails-maxzoom='${{ needs.trails.outputs.maxzoom || '14' }}' \
            --features='${{ needs.features.outputs.enabled || 'false' }}' \
            --features-maxzoom='${{ needs.features.outputs.maxzoom || '15' }}' \
            --roads='${{ needs.roads.outputs.enabled || 'false' }}' \
            --roads-maxzoom='${{ needs.roads.outputs.maxzoom || '15' }}' \
            --dem-source='${{ needs.contours.outputs.dem_source || 'sonny' }}' \
            --dem-tiles-source='${{ needs.terrain.outputs.dem_source || needs.contours.outputs.dem_source || 'sonny' }}' \
            --dem-bounds='${{ needs.plan.outputs.test_bbox }}' \
            --terrain-3d='${{ needs.plan.outputs.opt_terrain_3d }}' \
            ${{ needs.terrain.outputs.enabled == 'true' && format('--dem-tiles=pmtiles://{0}/tiles/{1}-terrain.pmtiles --dem-maxzoom={2}', steps.pages.outputs.base_url, needs.plan.outputs.key, needs.terrain.outputs.maxzoom) || '' }} \
            --sprites-dir=_site/sprites \
            --region-outline=_site/region.geojson \
            --overrides=poc/web/style-overrides.json \
            --fonts-dir=_site/fonts \
            --out=_site/styles

      - name: Dopeč vzory plôch a čiar do spritu
        run: |
          # Vzory z developer módu sú generované z predpisu v názve obrázka.
          # Web si ich dokreslí sám, statický štýl pre iOS ich potrebuje
          # priamo v sprite.
          for id in ${{ needs.assets.outputs.available }}; do
            node workers/styles/patterns.mjs \
              --sprite="_site/sprites/$id" --styles=_site/styles
          done

      # Sto riadkov bashu a jq je vo `workers/deploy/site.sh` (strop súboru
      # 128 kB). Sem chodia len výstupy ostatných jobov.
      - name: Poskladaj web (viewer + manifest)
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
          CONTOURS_DEM_SOURCE: ${{ needs.contours.outputs.dem_source || 'sonny' }}
          CONTOURS_ENABLED: ${{ needs.contours.outputs.enabled || 'false' }}
          CONTOURS_MAXZOOM: ${{ needs.contours.outputs.maxzoom || '14' }}
          CONTOUR_INTERVAL: ${{ needs.plan.outputs.opt_contour_interval || '5' }}
          DEM_MAXZOOM: ${{ needs.terrain.outputs.maxzoom || 15 }}
          DEM_TILES_SOURCE: ${{ needs.terrain.outputs.dem_source || needs.contours.outputs.dem_source || 'sonny' }}
          DEM_URL: ${{ needs.terrain.outputs.enabled == 'true' && format('pmtiles://{0}/tiles/{1}-terrain.pmtiles', steps.pages.outputs.base_url, needs.plan.outputs.key) || '' }}
          FEATURES_ENABLED: ${{ needs.features.outputs.enabled || 'false' }}
          FEATURES_MAXZOOM: ${{ needs.features.outputs.maxzoom || '15' }}
          ROADS_ENABLED: ${{ needs.roads.outputs.enabled || 'false' }}
          ROADS_MAXZOOM: ${{ needs.roads.outputs.maxzoom || '15' }}
          ICONS_AVAILABLE: ${{ needs.assets.outputs.available }}
          ICONS_NAME: ${{ needs.assets.outputs.name }}
          REGION_BBOX: ${{ needs.plan.outputs.bbox }}
          REGION_KEY: ${{ needs.plan.outputs.key }}
          REGION_NAME: ${{ needs.plan.outputs.name }}
          REGION_OUTLINE: region.geojson
          ROCKS_ENABLED: ${{ needs.rocks.outputs.rocks_enabled || 'false' }}
          ROCKS_MAXZOOM: ${{ needs.rocks.outputs.rocks_maxzoom || '16' }}
          ROCK_SLOPE: ${{ needs.rocks.outputs.rock_slope || 'off' }}
          ROCK_SOURCE: ${{ needs.rocks.outputs.rock_source || 'off' }}
          TEST_BBOX: ${{ needs.plan.outputs.test_bbox }}
          TEST_KM2: ${{ needs.plan.outputs.test_km2 || '0' }}
          TILES_MAXZOOM: ${{ needs.tiles.outputs.maxzoom }}
          TILES_SIZE_MB: ${{ needs.tiles.outputs.size_mb }}
          TRAILS_COUNT: ${{ needs.trails.outputs.count || '0' }}
          TRAILS_ENABLED: ${{ needs.trails.outputs.enabled || 'false' }}
          TRAILS_MAXZOOM: ${{ needs.trails.outputs.maxzoom || '14' }}
        run: workers/deploy/site.sh

      - name: Skontroluj, že štýl odkazuje len na existujúce súbory
        id: kontrola
        env:
          SPRITE: ${{ needs.assets.outputs.name }}
          REGION_KEY: ${{ needs.plan.outputs.key }}
          LIMIT_MB: ${{ needs.plan.outputs.opt_size_limit_mb }}
        run: workers/deploy/check.sh
      # Štýly, viewer, `manifest.json` a dopečený sprite – čo `_site` dostalo
      # až tu a v `site-*` teda NIE JE. Prečo to job na macOS potrebuje, je
      # vo `workers/deploy/apple-archive.sh`. Dlaždice a fonty sú vylúčené,
      # tie na druhej strane už sú.
      - name: Odlož zloženú časť webu pre ďalšie joby
        if: ${{ always() && steps.kontrola.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: deploy-site
          path: |
            _site
            !_site/fonts
            !_site/tiles/*.pmtiles
          retention-days: 1
          compression-level: 0

      # `publish_pages=false` vypne LEN nasadenie – `_site` sa postaví
      # a skontroluje rovnako ako pri ostrom behu (na tom istom `_site` stojí
      # aj balík, ktorý ide na Drive), len sa nenahrá na Pages. `steps.publish`
      # nižšie (Drive) je nezávislá páka – tá beží ďalej podľa `opt_publish`.
      - name: Upload Pages artifact
        if: ${{ needs.plan.outputs.opt_publish_pages == 'true' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy na GitHub Pages
        id: deployment
        if: ${{ needs.plan.outputs.opt_publish_pages == 'true' }}
        uses: actions/deploy-pages@v5

      # Bez nasadenia niet čo overovať – `steps.deployment.outputs.page_url`
      # by bol prázdny a smoke test by kontroloval starú (alebo žiadnu) mapu.
      - name: Smoke test nasadenej mapy
        if: ${{ needs.plan.outputs.opt_publish_pages == 'true' }}
        env:
          BASE: ${{ steps.deployment.outputs.page_url }}
          REGION: ${{ needs.plan.outputs.key }}
          SPRITE: ${{ needs.assets.outputs.name }}
          CONTOURS: ${{ needs.contours.outputs.enabled }}
          ROCKS: ${{ needs.rocks.outputs.rocks_enabled }}
          TRAILS: ${{ needs.trails.outputs.enabled }}
          FEATURES: ${{ needs.features.outputs.enabled }}
          ROADS: ${{ needs.roads.outputs.enabled }}
          PAGES_BUILD_TYPE: ${{ needs.plan.outputs.pages_build_type }}
        run: workers/deploy/smoke-test.sh


      - name: Publikuj mapu na Drive
        id: publish
        if: ${{ always() && needs.plan.outputs.opt_publish == 'true' && steps.kontrola.outcome == 'success' }}
        env:
          AREA_KEY: ${{ needs.plan.outputs.area_key }}
          # Bbox výrezu ide do katalógu vedľa bboxu mapy: mapa je celý región,
          # ale vrstevnice a skaly sú len tu.
          AREA_BBOX: ${{ needs.plan.outputs.area_bbox }}
          CONTOURS_ENABLED: ${{ needs.contours.outputs.enabled || 'false' }}
          CONTOURS_SOURCE: ${{ needs.contours.outputs.dem_source }}
          CONTOUR_INTERVAL: ${{ needs.plan.outputs.opt_contour_interval }}
          CUSTOM_NAME: ${{ needs.plan.outputs.opt_custom_name }}
          CUSTOM_PBF_URL: ${{ needs.plan.outputs.opt_custom_pbf_url }}
          FEATURES_ENABLED: ${{ needs.features.outputs.enabled || 'false' }}
          ROADS_ENABLED: ${{ needs.roads.outputs.enabled || 'false' }}
          REGION_KEY: ${{ needs.plan.outputs.key }}
          ROCKS_ENABLED: ${{ needs.rocks.outputs.rocks_enabled || 'false' }}
          ROCKS_SOURCE: ${{ needs.rocks.outputs.rock_source }}
          TERRAIN_ENABLED: ${{ needs.terrain.outputs.enabled || 'false' }}
          TERRAIN_SOURCE: ${{ needs.terrain.outputs.dem_source }}
          TEST_KM2: ${{ needs.plan.outputs.test_km2 }}
          TILES_MAXZOOM: ${{ needs.tiles.outputs.maxzoom }}
          TRAILS_ENABLED: ${{ needs.trails.outputs.enabled || 'false' }}
        run: |
          set -euo pipefail
          python3 workers/deploy/publish-map.py --site=_site \
            --maps=maps.json \
            --summary="$GITHUB_STEP_SUMMARY"

      # ---------- katalóg hotových máp ----------
      # `maps.json` v koreni repozitára je jediný zoznam toho, KTORÉ mapy sú
      # hotové a kde na Drive ležia (krajina → kraj → výsek → odkazy na tri
      # balíky). Na Drive sa to inak nedá zistiť bez tokenu a bez klikania,
      # takže ho dopisuje krok vyššie – hneď po nahratí, lebo len ten pozná id
      # súborov – a tu sa to už len uloží do repozitára.
      #
      # Až za publikovaním a `if: success()` na ňom: katalóg nesmie ukazovať na
      # súbory, ktoré sa nenahrali.
      # KTORÝ SÚBOR TO JE, POVIE KROK VYŠŠIE (`maps_file`), nie tento: rýchly
      # test zapisuje do `maps-test.json`, ostrý beh do `maps.json`. Rozhoduje
      # `workers/deploy/catalog.py` – odvodiť si to tu druhýkrát by znamenalo
      # zapísať jeden súbor a commitnúť druhý.
      - name: Zapíš mapu do maps.json
        if: ${{ steps.publish.outcome == 'success' }}
        env:
          MAPS_JSON: ${{ steps.publish.outputs.maps_file || 'maps.json' }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: workers/deploy/catalog.sh
      # ---------- súhrn ----------
      # Čo build spravil, ako dlho to trvalo a s akým detailom – na jednom
      # mieste v záložke Summary. Riadky si každý job odložil do svojho
      # `steps-*` artefaktu; tu sa zlejú a zoradia podľa poradového čísla,
      # lebo joby bežia súbežne a poradie v čase nič nehovorí.
      # Súhrn je deväť kilobajtov markdownu a workflow súbor má strop
      # 128 KiB – nad ním ho GitHub ticho neprijme. Text je preto
      # vo `workers/deploy/summary.sh` a sem chodia len hodnoty, ktoré pozná
      # iba workflow (výsledky jobov, vybrané zdroje, URL nasadenia).
      - name: Súhrn buildu
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REGION_NAME: ${{ needs.plan.outputs.name || inputs.region }}
          R_PLAN: ${{ needs.plan.result }}
          R_CONTOURS: ${{ needs.contours.result }}
          R_SHADING_ROCKS: ${{ needs.shading-rocks.result }}
          R_TRAILS: ${{ needs.trails.result }}
          R_FEATURES: ${{ needs.features.result }}
          R_ROADS: ${{ needs.roads.result }}
          R_TERRAIN: ${{ needs.terrain.result }}
          R_TILES: ${{ needs.tiles.result }}
          R_ASSETS: ${{ needs.assets.result }}
          SRC_CONTOURS: ${{ needs.plan.outputs.opt_contour_source }}
          SRC_ROCKS: ${{ needs.plan.outputs.opt_rock_source }}
          SRC_SHADING: ${{ needs.plan.outputs.opt_shading_source }}
          USED_CONTOURS: ${{ needs.contours.outputs.dem_source || '(nebežalo)' }}
          USED_ROCKS: ${{ needs.rocks.outputs.rock_source || '(nebežalo)' }}
          USED_SHADING: ${{ needs.terrain.outputs.dem_source || '(nebežalo)' }}
          SIZE_LIMIT_MB: ${{ needs.plan.outputs.opt_size_limit_mb }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          PUBLISH_PAGES: ${{ needs.plan.outputs.opt_publish_pages }}
          PAGES_BUILD_TYPE: ${{ needs.plan.outputs.pages_build_type }}
          REGION_KEY: ${{ needs.plan.outputs.key }}
          TEST_KM2: ${{ needs.plan.outputs.test_km2 }}
          TEST_BBOX: ${{ needs.plan.outputs.test_bbox }}
          TEST_FULL_BBOX: ${{ needs.plan.outputs.full_bbox }}
          # Celý formulár naraz, nie pole po poli: `toJSON(inputs)` sa nemá
          # ako rozísť so zoznamom inputov, kdežto desať riadkov áno – a to
          # by v súhrne ticho chýbalo práve to pole, ktoré si zmenil.
          INPUTS_JSON: ${{ toJSON(inputs) }}
        run: bash workers/deploy/summary.sh

  # ---------- Apple Archive ----------
  # Ten istý obsah, aký `deploy` nahral ako ZIPy, ešte raz ako `.aar`
  # (Apple Archive, LZFSE). iOS a macOS ho rozbalia SYSTÉMOVO – framework
  # AppleArchive, žiadna tretia knižnica v aplikácii – a dekompresia je na
  # Apple hardvéri výrazne rýchlejšia než deflate. ZIP tým nezaniká: otvorí ho
  # čokoľvek, `.aar` je navyše.
  #
  # PREČO VLASTNÝ JOB, A EŠTE NA macOS: nástroj `aa` je súčasť macOS a inde
  # neexistuje. Nie je to teda voliteľný krok v `deploy`, ale iný stroj – a
  # keďže je to iný stroj, musí si `_site` stiahnuť z tých istých artefaktov,
  # z akých ho skladal `deploy` (`site-*`, retencia 1 deň – prepravky jedného
  # behu, nie publikovanie).
  #
  # Beží AŽ PO `deploy` a len keď ten publikoval: balíky sa volajú rovnako a
  # líšia sa príponou, takže katalóg `maps.json` sa najprv naplní ZIPmi a tento
  # job k nim `.aar` dopíše (`publish-map.py` to pozná podľa toho, že v jeho
  # `--format` nie je `zip`). Opačné poradie by znamenalo, že katalóg chvíľu
  # ukazuje na `.aar`, ktorý ešte nie je nahratý.
  #
  # Keď spadne, MAPA TÝM NETRPÍ – na Pages aj na Drive je všetko hotové a
  # chýba len druhá podoba balíkov. Preto `continue-on-error` na kroku a nie
  # `needs` niekoho ďalšieho.
  apple-archive:
    name: Balíky ako Apple Archive (.aar)
    needs: [plan, deploy, contours, rocks, terrain, trails, features, roads, tiles]
    if: ${{ !cancelled() && needs.deploy.result == 'success' && needs.plan.outputs.opt_publish == 'true' && needs.plan.outputs.opt_apple_archive == 'true' }}
    runs-on: macos-latest
    permissions:
      contents: write     # `maps.json` – to isté, čo robí `deploy`
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # Tie isté kusy, z akých `deploy` skladal `_site`. Vzor `site-*`, nie
      # mená: keď je nejaký job vypnutý alebo spadol, jeho artefakt jednoducho
      # nie je a nič sa nedeje.
      - name: Pozbieraj kusy stránky
        uses: actions/download-artifact@v8
        with:
          pattern: site-*
          path: _site
          merge-multiple: true
      # Články z Wikipédie tu NIE SÚ a nie je to opomenutie: majú vlastnú
      # pipeline (`.github/workflows/wiki.yml`), ktorá si `.aar` vyrába sama.
      # Build map o tom balíku nerozhoduje, takže sa ho tu ani nedotýkame –
      # `publish-map.py` ho bez `--wiki` do zoznamu vôbec nezaradí, a tým
      # pádom ho ani nezmaže.
      # AŽ PO `site-*`: sprite je v oboch a vyhrať musí ten dopečený. Poradie
      # krokov je jediné, čo to zaručuje – `merge-multiple` o prednosti
      # nehovorí nič.
      - name: Pozbieraj zloženú časť webu
        uses: actions/download-artifact@v8
        with:
          name: deploy-site
          path: _site
      - name: Zabaľ a nahraj .aar na Drive
        id: publish
        env:
          AREA_KEY: ${{ needs.plan.outputs.area_key }}
          AREA_BBOX: ${{ needs.plan.outputs.area_bbox }}
          CONTOURS_ENABLED: ${{ needs.contours.outputs.enabled || 'false' }}
          CONTOURS_SOURCE: ${{ needs.contours.outputs.dem_source }}
          CONTOUR_INTERVAL: ${{ needs.plan.outputs.opt_contour_interval }}
          CUSTOM_NAME: ${{ needs.plan.outputs.opt_custom_name }}
          CUSTOM_PBF_URL: ${{ needs.plan.outputs.opt_custom_pbf_url }}
          FEATURES_ENABLED: ${{ needs.features.outputs.enabled || 'false' }}
          ROADS_ENABLED: ${{ needs.roads.outputs.enabled || 'false' }}
          REGION_KEY: ${{ needs.plan.outputs.key }}
          ROCKS_ENABLED: ${{ needs.rocks.outputs.rocks_enabled || 'false' }}
          ROCKS_SOURCE: ${{ needs.rocks.outputs.rock_source }}
          TERRAIN_ENABLED: ${{ needs.terrain.outputs.enabled || 'false' }}
          TERRAIN_SOURCE: ${{ needs.terrain.outputs.dem_source }}
          TEST_KM2: ${{ needs.plan.outputs.test_km2 }}
          TILES_MAXZOOM: ${{ needs.tiles.outputs.maxzoom }}
          TRAILS_ENABLED: ${{ needs.trails.outputs.enabled || 'false' }}
          # Z ktorej vetvy si vypýtať čerstvý `maps.json` – ten predošlý
          # job doň práve zapísal a checkout má stav spred toho.
          BRANCH: ${{ github.ref_name }}
        run: workers/deploy/apple-archive.sh
      # Katalóg: `deploy` doň zapísal ZIPy, tento krok k nim pridá `.aar`.
      # `git pull --rebase` v skripte je tu nutnosť, nie poistka – `deploy`
      # commitol `maps.json` o pár minút skôr do tej istej vetvy.
      - name: Zapíš .aar do maps.json
        if: ${{ steps.publish.outcome == 'success' }}
        env:
          MAPS_JSON: ${{ steps.publish.outputs.maps_file || 'maps.json' }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: workers/deploy/catalog.sh
