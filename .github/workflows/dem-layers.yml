name: Map · height-model layers

# CONTOURS, ROCKS AND HILLSHADING – from the height-model store to `.pmtiles`.
#
# A workflow of its own: two pipelines need it (the map build and regenerating
# a layer), and two copies would drift in a cache key or the model refilled.
#
# Jobs: check-dem, mirror-* (refilling models), shading-rocks, keys (cache
# keys), contours, rocks, terrain. Site pieces go out as `site-*`, timing as `steps-*`.
#
# `workflow_call` inherits neither the caller's `secrets` nor `env` – sign-in
# comes through `secrets: inherit`, budget shares through inputs.

on:
  workflow_call:
    inputs:
      region_key:
        description: "Region key – `{region}-contours.pmtiles` and the rest are named by it"
        required: true
        type: string
      area:
        description: "The cut-out from the form (`whole_region`, or a range key) – goes to the refill pipelines"
        required: true
        type: string
      area_key:
        description: "Key of the resolved cut-out (`whole`, or a range with the test suffix)"
        required: true
        type: string
      area_name:
        description: "Name of the cut-out for messages and statistics"
        required: false
        default: ""
        type: string
      area_bbox:
        description: "Bbox of the cut-out – the layers are really computed on it"
        required: true
        type: string
      area_km2:
        description: "Area of the cut-out in km² (time budget when picking the rock grid)"
        required: false
        default: ""
        type: string
      dem_bbox:
        description: "The area the height model is read on (bbox overlapping the neighbour)"
        required: true
        type: string
      dem_bboxkey:
        description: "The same for a cache key – the bbox with `_` instead of `,.-`"
        required: true
        type: string
      test_km2:
        description: "Quick test: how many km² in the middle (0 = a real run)"
        required: false
        default: "0"
        type: string
      day:
        description: "Today's date – for cache keys that age daily"
        required: false
        default: ""
        type: string
      # `opt_contours` gates the job, not a layer: contours and rocks come from one computation
      opt_contours:
        description: "Gate of contours and rocks – `true` when at least one is on"
        required: true
        type: string
      opt_contour_lines:
        description: "Draw contours? (`contour_source` isn't `none`)"
        required: true
        type: string
      opt_rocks:
        description: "Draw rocks? (`rock_source` isn't `none`)"
        required: true
        type: string
      opt_terrain:
        description: "Draw hillshading and 3D terrain? (`shading_source` isn't `none`)"
        required: true
        type: string
      opt_contour_source:
        description: "Terrain model for contours"
        required: true
        type: string
      opt_rock_source:
        description: "Rock source – a model, or `shading`"
        required: true
        type: string
      # empty for `shading` and `none` – then nobody touches a model
      opt_rock_dem:
        description: "Rock source ONLY when it is a height model (else empty)"
        required: false
        default: ""
        type: string
      opt_shading_source:
        description: "Terrain model for hillshading and 3D"
        required: true
        type: string
      opt_ugkk_fallback:
        description: "May a missing DMR 5.0 fall back to another model?"
        required: false
        default: ""
        type: string
      opt_ugkk_urls:
        description: "Own ÚGKK archive addresses (empty = the registry)"
        required: false
        default: ""
        type: string
      opt_contour_interval:
        description: "Contour interval in metres"
        required: false
        default: "5"
        type: string
      opt_contour_maxzoom:
        description: "Top zoom of contour tiles"
        required: false
        default: "14"
        type: string
      opt_contour_maxzoom_cap:
        description: "Highest zoom contours may climb to"
        required: false
        default: "14"
        type: string
      opt_contour_lowland_m:
        description: "Below this height contours keep every second line (0 = off)"
        required: false
        default: "300"
        type: string
      opt_contour_smoothing:
        description: "DEM smoothing before tracing, in arc seconds"
        required: false
        default: "0"
        type: string
      rock_slope:
        description: "From which slope (°) terrain is rock"
        required: false
        default: "50"
        type: string
      opt_rock_maxzoom:
        description: "Top zoom of rock tiles"
        required: false
        default: "16"
        type: string
      opt_rock_res:
        description: "Grid of the rock outline in metres, or `auto`"
        required: false
        default: "auto"
        type: string
      opt_rock_solid:
        description: "One rock class instead of steep/cliff"
        required: false
        default: "0"
        type: string
      opt_rock_fill_holes:
        description: "Fill holes in rocks (solid areas instead of shape)"
        required: false
        default: "0"
        type: string
      opt_rock_img_asset:
        description: "Exact name of the stored rocks from hillshading (empty = compute in this run)"
        required: false
        default: ""
        type: string
      opt_rock_img_zoom:
        description: "Zoom of hillshading tiles (`auto` = the highest under the cap)"
        required: false
        default: "auto"
        type: string
      opt_rock_img_options:
        description: "Switches for rocks from hillshading"
        required: false
        default: ""
        type: string
      opt_terrain_maxzoom:
        description: "Top zoom of height tiles (`auto` = by the model grid)"
        required: false
        default: "auto"
        type: string
      opt_terrain_frac_bits:
        description: "Fraction bits of a height (`auto` = by the pixel, 0 = whole metres)"
        required: false
        default: "auto"
        type: string
      opt_terrain_format:
        description: "Image format of height tiles: png or webp"
        required: false
        default: "webp"
        type: string
      # flags of the `rebuild` choice: drop that layer's cache and compute it anew
      opt_contours_rebuild:
        description: "Recompute contours even when cached"
        required: false
        default: "false"
        type: string
      opt_rocks_rebuild:
        description: "Recompute rocks even when cached"
        required: false
        default: "false"
        type: string
      opt_terrain_rebuild:
        description: "Recompute hillshading even when cached"
        required: false
        default: "false"
        type: string
      # `true` = a layer already made with these settings isn't recomputed;
      # found by key prefix, the job says so with `::notice::`
      opt_reuse_layers:
        description: "Don't compute a layer already made with these settings"
        required: false
        default: "true"
        type: string
      opt_size_limit_mb:
        description: "Budget of the whole site in MB"
        required: false
        default: "900"
        type: string
      budget_contours_pct:
        description: "Contours' share of the site budget in percent"
        required: false
        default: "25"
        type: string
      budget_rocks_pct:
        description: "Rocks' share of the site budget in percent"
        required: false
        default: "12"
        type: string
      budget_terrain_pct:
        description: "Hillshading's share of the site budget in percent"
        required: false
        default: "12"
        type: string
    outputs:
      # what really came to be – the caller needs it for style, manifest and catalog
      contours_enabled:
        description: "Were contours made?"
        value: ${{ jobs.contours.outputs.enabled }}
      contours_maxzoom:
        description: "The zoom contours really reach"
        value: ${{ jobs.contours.outputs.maxzoom }}
      contours_dem_source:
        description: "Which model contours REALLY come from (a fallback may have kicked in)"
        value: ${{ jobs.contours.outputs.dem_source }}
      rocks_enabled:
        description: "Were rocks made?"
        value: ${{ jobs.rocks.outputs.rocks_enabled }}
      rocks_maxzoom:
        description: "The zoom rocks really reach"
        value: ${{ jobs.rocks.outputs.rocks_maxzoom }}
      rock_slope:
        description: "The slope threshold rocks were really made with"
        value: ${{ jobs.rocks.outputs.rock_slope }}
      rock_source:
        description: "What rocks REALLY come from (a model, or `shading`)"
        value: ${{ jobs.rocks.outputs.rock_source }}
      terrain_enabled:
        description: "Was hillshading made?"
        value: ${{ jobs.terrain.outputs.enabled }}
      terrain_maxzoom:
        description: "The zoom height tiles reach"
        value: ${{ jobs.terrain.outputs.maxzoom }}
      terrain_dem_source:
        description: "Which model hillshading REALLY comes from"
        value: ${{ jobs.terrain.outputs.dem_source }}
      res_contours:
        description: "Result of the contours job (for the run summary)"
        value: ${{ jobs.results.outputs.contours }}
      res_terrain:
        description: "Result of the hillshading job (for the run summary)"
        value: ${{ jobs.results.outputs.terrain }}
      res_shading_rocks:
        description: "Result of the rocks-from-hillshading pipeline (for the run summary)"
        value: ${{ jobs.results.outputs.shading_rocks }}
    # `workflow_call` doesn't inherit secrets; `DRIVE_CLIENT` is a repository variable
    secrets:
      GDRIVE_CREDENTIALS:
        required: false
      DRIVE_SECRET:
        required: false
      DRIVE_REFRESH:
        required: false

permissions:
  contents: read

env:
  # Drive sign-in for the whole workflow: one forgotten job silently recomputes everything
  GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
  DRIVE_CLIENT: ${{ vars.DRIVE_CLIENT }}
  DRIVE_SECRET: ${{ secrets.DRIVE_SECRET }}
  DRIVE_REFRESH: ${{ secrets.DRIVE_REFRESH }}
  # stores on Drive (`workers/drive/store.py`). Sonny's LiDAR DTM tiles.
  DEM_STORE: dem-sonny
  # Sonny's second model (1″ .hgt): a 1 m vertical step, rocks from it are more broken
  SONNY1_STORE: dem-sonny1
  # ÚGKK open data (DMR 3.5), the same 1°×1° tiles
  DMR35_STORE: dem-dmr35
  # ÚGKK DMR 5.0, 5 m grid; refilled by the degrees the bbox crosses
  DMR5_STORE: dem-dmr5-v2
  # DMR 5.0 cut-outs at the full 1 m, one COG per range
  UGKK_STORE: dem-ugkk
  # DEM smoothing before tracing – the averaging window in METRES; this really
  # removes jaggies. Small: 5×5 erased ridges and gullies a few metres wide. 0 = off.
  CONTOUR_DEM_LOWPASS: "2"
  # negative = quarters of a DEM cell, 0 = off, positive = metres
  CONTOUR_SIMPLIFY: "-1"
  # rounding the remaining corners: allowed chord sag in quarters of the tile
  # grid step, by a limit curve (B-spline) – Chaikin leaves a regular tooth
  CONTOUR_SMOOTH: "2"
  # the store of finished height (hillshade) tiles
  TERRAIN_STORE: dem-terrain
  # the store of finished rocks: they depend only on area and settings, both in the name
  ROCK_STORE: dem-rocks
  # rocks from hillshading tiles – filled by “Data · rocks from hillshading”
  ROCK_IMG_STORE: dem-rocks-img
  # the store of slope raster parts; never expires, and parts share an absolute grid
  SLOPE_STORE: dem-slope
  ROCK_RES: auto # fallback slope grid (m) when the option rock_res is missing
  # the grid the outline is traced on; `auto` = the finest still visible
  ROCK_VEC_RES: auto
  # the smallest area = one grid cell; outline simplification (m): -1 = a quarter of the grid, 0 = off
  ROCK_SIMPLIFY: "-1"
  # rounding the outline – as CONTOUR_SMOOTH, by ROCK_MAXZOOM. 0 = off.
  ROCK_SMOOTH: "2"
  # the algorithm version in the asset name: another algorithm = other rocks. v5 = seams really merge.
  ROCK_ALGO: v5
  ROCK_CLIFF_PLUS: "15" # degrees above the threshold where class `cliff` (darker) starts
  # slope is computed in parts: a region bbox has over 3 bn cells at 2 m
  ROCK_CHUNK_CELLS: "150000000"
  # minutes rocks may take; `0` = unlimited, the default. Hurry = a fixed `rock_res`.
  ROCK_BUDGET_MIN: "0"
  # block side for vectorising: memory stays bounded, a cancelled run resumes, union merges seams.
  # 0 = one pass over the whole mosaic.
  ROCK_BLOCK_PX: "4096"
  ROCK_MAX_RSS_GB: "12" # past it gdal_contour stops with a message, not OOM
  # the heartbeat adds memory, CPU, disk and output growth to the percentage
  ROCK_HEARTBEAT_S: "30"
  # budget shares come as inputs: `workflow_call` inherits no `env:`
  BUDGET_CONTOURS_PCT: ${{ inputs.budget_contours_pct }}
  BUDGET_ROCKS_PCT: ${{ inputs.budget_rocks_pct }}
  BUDGET_TERRAIN_PCT: ${{ inputs.budget_terrain_pct }}

jobs:
  # is terrain for this area in the store? The `mirror-*` jobs refill it first
  check-dem:
    name: Height-model check
    runs-on: ubuntu-latest
    # enough that one layer wants a DEM; rocks from hillshading read none
    if: ${{ inputs.opt_contour_lines == 'true' || inputs.opt_rock_dem != '' || inputs.opt_terrain == 'true' }}
    outputs:
      # which model to refill for which layer; two wanting one keep only the first
      mirror_contours: ${{ steps.check.outputs.mirror_contours }}
      mirror_rocks: ${{ steps.check.outputs.mirror_rocks }}
      mirror_terrain: ${{ steps.check.outputs.mirror_terrain }}
      # DMR 5.0 is refilled through `Data · DMR 5.0` by SHAPE, not layer: a
      # cut-out and 1° tiles are two assets and both may be missing
      mirror_dmr5_area: ${{ steps.check.outputs.mirror_dmr5_area }}
      mirror_dmr5_asset: ${{ steps.check.outputs.mirror_dmr5_asset }}
      mirror_dmr5_tiles: ${{ steps.check.outputs.mirror_dmr5_tiles }}
      # a store fingerprint per layer, so a DMR 5.0 refill keeps Sonny's contours
      demkey_contours: ${{ steps.check.outputs.demkey_contours }}
      demkey_rocks: ${{ steps.check.outputs.demkey_rocks }}
      demkey_terrain: ${{ steps.check.outputs.demkey_terrain }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # the decision is `workers/dem/check.sh`, from `workers/dem/target.py` as fetch.sh's
      - name: Are there tiles in the store for the bbox?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          # `dem_bbox`, not `bbox`: the area the DEM is really read on
          BBOX: ${{ inputs.dem_bbox }}
          AREA_KEY: ${{ inputs.area_key }}
          # the cut-out intersected with the region (a square in a test)
          AREA_BBOX: ${{ inputs.area_bbox }}
          SRC_CONTOURS: ${{ inputs.opt_contour_source }}
          SRC_ROCKS: ${{ inputs.opt_rock_dem }}
          SRC_TERRAIN: ${{ inputs.opt_shading_source }}
        run: workers/dem/check.sh

  # refilling height data: one workflow, a job per layer; they start themselves
  mirror-contours:
    name: Refill the height model (contours)
    needs: check-dem
    if: ${{ !cancelled() && needs.check-dem.outputs.mirror_contours != '' }}
    permissions:
      # `read`, not `write`: the refill publishes to Drive, not a release
      contents: read
    uses: ./.github/workflows/update-dem.yml
    # Sonny comes from Drive: without a token the public daily limit applies
    secrets: inherit
    with:
      what: ${{ needs.check-dem.outputs.mirror_contours }}
      area: ${{ inputs.area }}
      custom_url: ${{ inputs.opt_ugkk_urls }}

  mirror-rocks:
    name: Refill the height model (rocks)
    needs: check-dem
    # when rocks take the contours' model, `check-dem` leaves this empty
    if: ${{ !cancelled() && needs.check-dem.outputs.mirror_rocks != '' }}
    permissions:
      contents: read
    uses: ./.github/workflows/update-dem.yml
    secrets: inherit                      # Drive, as above
    with:
      what: ${{ needs.check-dem.outputs.mirror_rocks }}
      area: ${{ inputs.area }}
      custom_url: ${{ inputs.opt_ugkk_urls }}

  mirror-terrain:
    name: Refill the height model (hillshading)
    needs: check-dem
    if: ${{ !cancelled() && needs.check-dem.outputs.mirror_terrain != '' }}
    permissions:
      contents: read
    uses: ./.github/workflows/update-dem.yml
    secrets: inherit                      # Drive, as above
    with:
      what: ${{ needs.check-dem.outputs.mirror_terrain }}
      area: ${{ inputs.area }}
      custom_url: ${{ inputs.opt_ugkk_urls }}

  # DMR 5.0 is 145 GB, read by HTTP Range straight from Drive (`dmr5-drive.yml`);
  # two shapes (full-resolution cut-out, 5 m 1° tiles) may both be missing
  mirror-dmr5-area:
    name: Refill DMR 5.0 (cut-out, full resolution)
    needs: check-dem
    if: ${{ !cancelled() && needs.check-dem.outputs.mirror_dmr5_area != '' }}
    permissions:
      contents: read
    uses: ./.github/workflows/dmr5-drive.yml
    # for GDRIVE_CREDENTIALS: without a token the daily download limit applies
    secrets: inherit
    with:
      # the bbox the run asked for and the name `check-dem` didn't find
      area: ${{ needs.check-dem.outputs.mirror_dmr5_area }}
      asset: ${{ needs.check-dem.outputs.mirror_dmr5_asset }}
      tiles: false

  mirror-dmr5-tiles:
    name: Refill DMR 5.0 (tiles)
    needs: check-dem
    if: ${{ !cancelled() && needs.check-dem.outputs.mirror_dmr5_tiles != '' }}
    permissions:
      contents: read
    uses: ./.github/workflows/dmr5-drive.yml
    secrets: inherit                      # GDRIVE_CREDENTIALS, as above
    with:
      # the bbox widened to whole degrees – `N49E020.tif` promises a whole degree
      area: ${{ needs.check-dem.outputs.mirror_dmr5_tiles }}
      tiles: true
      grid_m: "5"

  # rocks from hillshading tiles: with `rock_source: shading` the pictures are
  # downloaded in this run (the same pipeline, called)
  shading-rocks:
    name: Rocks from hillshading
    if: ${{ !cancelled() && inputs.opt_rock_source == 'shading' && inputs.opt_rock_img_asset == '' }}
    permissions:
      contents: read
    uses: ./.github/workflows/shading-rocks.yml
    # for the Drive cache: without a token it would pull gigabytes from freemap.sk again
    secrets: inherit
    with:
      # a test passes the test square's bbox, not the range: one computation, not two
      area: ${{ inputs.test_km2 != '0' && inputs.area_bbox || inputs.area }}
      zoom: ${{ inputs.opt_rock_img_zoom }}
      # a quick test and `rebuild: rocks` take nothing cached from this pipeline
      # either (`fresh=1`); own `rock_img_options` may override it (`fresh=0`)
      options: ${{ (inputs.test_km2 != '0' || inputs.opt_rocks_rebuild == 'true') && format('fresh=1 {0}', inputs.opt_rock_img_options) || inputs.opt_rock_img_options }}

  # ---------- cache keys ----------
  # a job of its own: a key needs the bbox and the DEM fingerprint, and restore,
  # save and rebuild must share it, or the cache silently falls apart
  keys:
    name: Cache keys
    needs: [check-dem, mirror-contours, mirror-rocks, mirror-terrain,
            mirror-dmr5-area, mirror-dmr5-tiles]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      # the cache is on Drive, deleted with the owner's token from `env:`
      contents: read
    outputs:
      # three layers, three keys, each with a `*_done` prefix and the legacy key
      # (`workers/plan/cache-keys.sh`)
      contours: ${{ steps.keys.outputs.contours }}
      contours_done: ${{ steps.keys.outputs.contours_done }}
      contours_legacy: ${{ steps.keys.outputs.contours_legacy }}
      rocks: ${{ steps.keys.outputs.rocks }}
      rocks_done: ${{ steps.keys.outputs.rocks_done }}
      terrain: ${{ steps.keys.outputs.terrain }}
      terrain_done: ${{ steps.keys.outputs.terrain_done }}
      demtiles_contours: ${{ steps.keys.outputs.demtiles_contours }}
      demtiles_rocks: ${{ steps.keys.outputs.demtiles_rocks }}
      demtiles_terrain: ${{ steps.keys.outputs.demtiles_terrain }}
      slope: ${{ steps.keys.outputs.slope }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # `hashFiles` is a GitHub function, so its result goes in as env
      - name: Cache keys
        id: keys
        env:
          AREA_IN: ${{ inputs.area }}
          AREA_KEY: ${{ inputs.area_key }}
          CONTOUR_INTERVAL: ${{ inputs.opt_contour_interval }}
          DEMKEY_CONTOURS: ${{ needs.check-dem.outputs.demkey_contours }}
          DEMKEY_ROCKS: ${{ needs.check-dem.outputs.demkey_rocks }}
          DEMKEY_TERRAIN: ${{ needs.check-dem.outputs.demkey_terrain }}
          DEM_BBOXKEY: ${{ inputs.dem_bboxkey }}
          OPT_CONTOUR_MAXZOOM: ${{ inputs.opt_contour_maxzoom }}
          OPT_CONTOUR_SMOOTHING: ${{ inputs.opt_contour_smoothing }}
          OPT_CONTOUR_SOURCE: ${{ inputs.opt_contour_source }}
          OPT_ROCK_IMG_ASSET: ${{ inputs.opt_rock_img_asset }}
          OPT_ROCK_MAXZOOM: ${{ inputs.opt_rock_maxzoom }}
          OPT_ROCK_SOLID: ${{ inputs.opt_rock_solid }}
          OPT_ROCK_RES: ${{ inputs.opt_rock_res }}
          OPT_ROCK_SOURCE: ${{ inputs.opt_rock_source }}
          OPT_ROCK_FILL_HOLES: ${{ inputs.opt_rock_fill_holes }}
          OPT_SHADING_SOURCE: ${{ inputs.opt_shading_source }}
          OPT_TERRAIN_MAXZOOM: ${{ inputs.opt_terrain_maxzoom }}
          OPT_TERRAIN_FRAC_BITS: ${{ inputs.opt_terrain_frac_bits }}
          OPT_TERRAIN_FORMAT: ${{ inputs.opt_terrain_format }}
          OPT_CONTOUR_MAXZOOM_CAP: ${{ inputs.opt_contour_maxzoom_cap }}
          OPT_CONTOUR_LOWLAND_M: ${{ inputs.opt_contour_lowland_m }}
          ROCK_SLOPE: ${{ inputs.rock_slope }}
          # two fingerprints: a fix in `rocks.sh` mustn't drop an hour of contours;
          # every file deciding the shape must be in them
          SCHEMA_CONTOURS: ${{ hashFiles('workers/contours-rocks/contours.yml', 'workers/contours-rocks/build.sh', 'workers/contours-rocks/smooth-shapes.py', 'workers/lib/contour-blocks.py') }}
          SCHEMA_ROCKS: ${{ hashFiles('workers/contours-rocks/rocks.yml', 'workers/contours-rocks/rocks.sh', 'workers/contours-rocks/build.sh', 'workers/contours-rocks/rock-areas.py', 'workers/contours-rocks/rock-plan.py', 'workers/contours-rocks/slope-chunks.py', 'workers/contours-rocks/smooth-shapes.py', 'workers/lib/contour-blocks.py') }}
          # the fingerprint from before the split, only for `*_legacy` – the file list must not change
          SCHEMA_HASH: ${{ hashFiles('workers/contours-rocks/contours.yml', 'workers/contours-rocks/rocks.yml', 'workers/contours-rocks/rock-areas.py', 'workers/contours-rocks/rock-plan.py', 'workers/contours-rocks/smooth-shapes.py', 'workers/contours-rocks/build.sh', 'workers/contours-rocks/rocks.sh', 'workers/lib/contour-blocks.py') }}
        run: workers/plan/cache-keys.sh

      # while the old entry exists, a new one isn't saved under the same key
      - name: Rebuild – delete the old caches
        if: ${{ inputs.opt_contours_rebuild == 'true' || inputs.opt_rocks_rebuild == 'true' || inputs.opt_terrain_rebuild == 'true' }}
        run: |
          set -uo pipefail
          drop() { # $1 = cache key
            python3 workers/drive/cache.py --delete --key="$1"
          }
          # layer by layer: `rebuild: rocks` mustn't drop an hour of contours
          if [ '${{ inputs.opt_contours_rebuild }}' = 'true' ]; then
            drop '${{ steps.keys.outputs.contours }}'
            drop '${{ steps.keys.outputs.contours_legacy }}'
          fi
          if [ '${{ inputs.opt_rocks_rebuild }}' = 'true' ]; then
            drop '${{ steps.keys.outputs.rocks }}'
          fi
          if [ '${{ inputs.opt_terrain_rebuild }}' = 'true' ]; then
            drop '${{ steps.keys.outputs.terrain }}'
          fi

  # the longest job; its own job = its own timeout, a failure keeps map and hillshading
  contours:
    name: Contours
    # `shading-rocks` is in needs for order, not data; skipped it doesn't stop `!cancelled()`
    needs: [keys, shading-rocks]
    if: ${{ !cancelled() && inputs.opt_contours == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      # `read`: finished rocks go to the Drive store, not a release
      contents: read
    outputs:
      enabled: ${{ steps.contours.outputs.enabled }}
      maxzoom: ${{ steps.contours.outputs.maxzoom }}
      dem_source: ${{ steps.contours.outputs.dem_source }}
      size_mb: ${{ steps.contours.outputs.size_mb }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # timing must sit in the workspace – `hashFiles` sees nothing else
      - name: Prepare the timing folder
        run: mkdir -p steps-out

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Planetiler cache (restore)
        id: planetiler-cache
        uses: ./.github/actions/cache-restore
        with:
          path: planetiler.jar
          key: planetiler-latest-${{ inputs.day }}

      - name: Download Planetiler
        run: workers/lib/planetiler.sh
      # terrain comes from an external DEM; Copernicus GLO-30 is off on purpose –
      # a surface model would lead contours over treetops
      - name: Contours cache (restore)
        id: contours-cache
        if: ${{ inputs.opt_contours == 'true' && inputs.opt_contours_rebuild != 'true' }}
        uses: ./.github/actions/cache-restore
        with:
          path: contours-out
          key: ${{ needs.keys.outputs.contours }}
          # the settings prefix when the run takes finished layers; empty = a strict cache
          restore-keys: ${{ inputs.opt_reuse_layers == 'true' && needs.keys.outputs.contours_done || '' }}

      # a one-off migration: the key from before contours and rocks split
      - name: Contours cache – key from before the split (restore)
        id: contours-cache-legacy
        if: ${{ inputs.opt_contours == 'true' && inputs.opt_contours_rebuild != 'true' && steps.contours-cache.outputs.cache-hit != 'true' && steps.contours-cache.outputs.cache-matched-key == '' }}
        uses: ./.github/actions/cache-restore
        with:
          path: contours-out
          key: ${{ needs.keys.outputs.contours_legacy }}

      # one answer to “compute or not” for all four places in the job
      - name: Are the contours done?
        id: done
        env:
          LAYER: Contours
          HIT: ${{ steps.contours-cache.outputs.cache-hit }}
          MATCHED: ${{ steps.contours-cache.outputs.cache-matched-key }}
          HIT_LEGACY: ${{ steps.contours-cache-legacy.outputs.cache-hit }}
        run: workers/plan/layer-done.sh

      - name: Download the region polygon
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: region-poly
          path: data

      # only when computing: the model is gigabytes, a finished layer needs none
      - name: DEM tile cache (restore)
        id: demtiles-cache
        if: ${{ inputs.opt_contours == 'true' && steps.done.outputs.compute == 'true' }}
        uses: ./.github/actions/cache-restore
        with:
          path: dem
          key: ${{ needs.keys.outputs.demtiles_contours }}

      - name: Contours and rocks from the DEM
        if: ${{ inputs.opt_contours == 'true' && steps.done.outputs.compute == 'true' }}
        env:
          ONLY: contours
          GH_TOKEN: ${{ github.token }}
          # the computation's area, not the map's: a 4 km² square in a test
          REGION_BBOX: ${{ inputs.dem_bbox }}
          REGION_KEY: ${{ inputs.region_key }}
          AREA_KEY_IN: ${{ inputs.area_key }}
          AREA_NAME_IN: ${{ inputs.area_name }}
          AREA_BBOX_IN: ${{ inputs.area_bbox }}
          AREA_KM2: ${{ inputs.area_km2 }}
          CONTOUR_INTERVAL: ${{ inputs.opt_contour_interval }}
          OPT_CONTOUR_LINES: ${{ inputs.opt_contour_lines }}
          OPT_CONTOUR_SOURCE: ${{ inputs.opt_contour_source }}
          OPT_CONTOUR_SMOOTHING: ${{ inputs.opt_contour_smoothing }}
          OPT_CONTOUR_MAXZOOM: ${{ inputs.opt_contour_maxzoom }}
          OPT_CONTOUR_MAXZOOM_CAP: ${{ inputs.opt_contour_maxzoom_cap }}
          OPT_CONTOUR_LOWLAND_M: ${{ inputs.opt_contour_lowland_m }}
          OPT_ROCK_MAXZOOM: ${{ inputs.opt_rock_maxzoom }}
          OPT_ROCK_SOLID: ${{ inputs.opt_rock_solid }}
          OPT_ROCK_FILL_HOLES: ${{ inputs.opt_rock_fill_holes }}
          ROCK_SLOPE_IN: ${{ inputs.rock_slope }}
          ROCK_RES_IN: ${{ inputs.opt_rock_res }}
          OPT_ROCKS: ${{ inputs.opt_rocks }}
          OPT_ROCK_DEM: ${{ inputs.opt_rock_dem }}
          OPT_ROCK_SOURCE: ${{ inputs.opt_rock_source }}
          OPT_ROCK_IMG_ASSET: ${{ inputs.opt_rock_img_asset }}
          OPT_ROCKS_REBUILD: ${{ inputs.opt_rocks_rebuild }}
          OPT_SIZE_LIMIT_MB: ${{ inputs.opt_size_limit_mb }}
          OPT_UGKK_FALLBACK: ${{ inputs.opt_ugkk_fallback }}
          # a test run mustn't touch the store; `rocks_rebuild` must skip it
          OPT_TEST_KM2: ${{ inputs.test_km2 }}
          SLOPE_DIR: slope-chunks
          # Drive is latent, not narrow; past ~16 threads it answers 403
          SLOPE_JOBS: "6"
          # `dmr5` rocks read slope straight from Drive, so the token is needed here too
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          DRIVE_CLIENT: ${{ vars.DRIVE_CLIENT }}
          DRIVE_SECRET: ${{ secrets.DRIVE_SECRET }}
          DRIVE_REFRESH: ${{ secrets.DRIVE_REFRESH }}
        run: bash workers/contours-rocks/build.sh
      # saved at once and only what was really computed
      - name: Contours cache (save)
        if: ${{ always() && inputs.opt_contours == 'true' && steps.done.outputs.compute == 'true' && hashFiles('contours-out/contours.pmtiles') != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: contours-out
          key: ${{ needs.keys.outputs.contours }}

      # `always()`: the store must survive exactly the runs that didn't finish
      - name: DEM tile cache (save)
        if: ${{ always() && inputs.opt_contours == 'true' && steps.demtiles-cache.outputs.cache-hit != 'true' && hashFiles('dem/**') != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: dem
          key: ${{ needs.keys.outputs.demtiles_contours }}

      # `workers/contours-rocks/site.sh` – two jobs share the step
      - name: Put the contours into the site
        id: contours
        if: ${{ inputs.opt_contours == 'true' }}
        env:
          ONLY: contours
          # “nothing was computed” includes a finished layer of an earlier run
          CACHE_HIT: ${{ steps.done.outputs.have }}
          OPT_CONTOUR_LINES: ${{ inputs.opt_contour_lines }}
          OPT_CONTOUR_MAXZOOM: ${{ inputs.opt_contour_maxzoom }}
          OPT_ROCKS: ${{ inputs.opt_rocks }}
          OPT_ROCK_MAXZOOM: ${{ inputs.opt_rock_maxzoom }}
          REGION_KEY: ${{ inputs.region_key }}
        run: workers/contours-rocks/site.sh

      # into the Drive store, not an artifact (`workers/deploy/publish-results.sh`)
      - name: Store rocks and contours
        if: ${{ inputs.opt_contours == 'true' && hashFiles('data/rock.gpkg') != '' }}
        continue-on-error: true
        env:
          KIND: terrain
          NAME: terrain-${{ inputs.region_key }}-s${{ inputs.rock_slope }}-g${{ inputs.opt_rock_res }}
        run: workers/deploy/publish-results.sh

      # each job makes its piece of `_site`; compression-level 0, all compressed already
      - name: Keep the site piece
        if: ${{ always() && hashFiles('_site/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: site-contours
          path: _site
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore

      # rock statistics go with the step timing, not onto the site
      - name: Add the rock statistics to the timing
        if: ${{ always() }}
        run: cp contours-out/rock-stats.txt steps-out/ 2>/dev/null || true

      - name: Keep the step timing
        if: ${{ always() && hashFiles('steps-out/*') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: steps-contours
          path: steps-out
          retention-days: 1
          if-no-files-found: ignore

  rocks:
    # the other half: the same script with `ONLY: rocks`; the steps are explained at `contours`
    name: Rocks
    needs: [keys, shading-rocks]
    if: ${{ !cancelled() && inputs.opt_contours == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.contours.outputs.rocks_enabled }}
      rocks_enabled: ${{ steps.contours.outputs.rocks_enabled }}
      rocks_maxzoom: ${{ steps.contours.outputs.rocks_maxzoom }}
      dem_source: ${{ steps.contours.outputs.dem_source }}
      rock_slope: ${{ steps.contours.outputs.rock_slope }}
      rock_source: ${{ steps.contours.outputs.rock_source }}
      size_mb: ${{ steps.contours.outputs.size_mb }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Prepare the timing folder
        run: mkdir -p steps-out

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Planetiler cache (restore)
        id: planetiler-cache
        uses: ./.github/actions/cache-restore
        with:
          path: planetiler.jar
          key: planetiler-latest-${{ inputs.day }}

      - name: Download Planetiler
        run: workers/lib/planetiler.sh
      - name: Rock cache (restore)
        id: contours-cache
        if: ${{ inputs.opt_contours == 'true' && inputs.opt_rocks_rebuild != 'true' }}
        uses: ./.github/actions/cache-restore
        with:
          path: contours-out
          key: ${{ needs.keys.outputs.rocks }}
          # except: with `rock_source: shading` and no `rock_img_asset`, job
          # `shading-rocks` is computing the outlines right now
          restore-keys: ${{ (inputs.opt_reuse_layers == 'true' && (inputs.opt_rock_source != 'shading' || inputs.opt_rock_img_asset != '')) && needs.keys.outputs.rocks_done || '' }}

      - name: Are the rocks done?
        id: done
        env:
          LAYER: Rocks
          HIT: ${{ steps.contours-cache.outputs.cache-hit }}
          MATCHED: ${{ steps.contours-cache.outputs.cache-matched-key }}
        run: workers/plan/layer-done.sh

      # without the polygon the layer would be computed on the whole region bbox
      - name: Download the region polygon
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: region-poly
          path: data

      # model and slope parts are inputs – finished rocks need neither
      - name: DEM tile cache (restore)
        id: demtiles-cache
        if: ${{ inputs.opt_contours == 'true' && steps.done.outputs.compute == 'true' }}
        uses: ./.github/actions/cache-restore
        with:
          path: dem
          key: ${{ needs.keys.outputs.demtiles_rocks }}

      # `opt_rocks_rebuild` stays here: the slope is to be read anew
      - name: Slope part cache (restore)
        id: slope-cache
        if: ${{ inputs.opt_contours == 'true' && inputs.opt_rocks_rebuild != 'true' && steps.done.outputs.compute == 'true' }}
        uses: ./.github/actions/cache-restore
        with:
          path: slope-chunks
          key: ${{ needs.keys.outputs.slope }}${{ github.run_id }}
          restore-keys: |
            ${{ needs.keys.outputs.slope }}

      - name: Contours and rocks from the DEM
        if: ${{ inputs.opt_contours == 'true' && steps.done.outputs.compute == 'true' }}
        env:
          ONLY: rocks
          GH_TOKEN: ${{ github.token }}
          REGION_BBOX: ${{ inputs.dem_bbox }}
          REGION_KEY: ${{ inputs.region_key }}
          AREA_KEY_IN: ${{ inputs.area_key }}
          AREA_NAME_IN: ${{ inputs.area_name }}
          AREA_BBOX_IN: ${{ inputs.area_bbox }}
          AREA_KM2: ${{ inputs.area_km2 }}
          CONTOUR_INTERVAL: ${{ inputs.opt_contour_interval }}
          OPT_CONTOUR_LINES: ${{ inputs.opt_contour_lines }}
          OPT_CONTOUR_SOURCE: ${{ inputs.opt_contour_source }}
          OPT_CONTOUR_SMOOTHING: ${{ inputs.opt_contour_smoothing }}
          OPT_CONTOUR_MAXZOOM: ${{ inputs.opt_contour_maxzoom }}
          OPT_CONTOUR_MAXZOOM_CAP: ${{ inputs.opt_contour_maxzoom_cap }}
          OPT_CONTOUR_LOWLAND_M: ${{ inputs.opt_contour_lowland_m }}
          OPT_ROCK_MAXZOOM: ${{ inputs.opt_rock_maxzoom }}
          OPT_ROCK_SOLID: ${{ inputs.opt_rock_solid }}
          OPT_ROCK_FILL_HOLES: ${{ inputs.opt_rock_fill_holes }}
          ROCK_SLOPE_IN: ${{ inputs.rock_slope }}
          ROCK_RES_IN: ${{ inputs.opt_rock_res }}
          OPT_ROCKS: ${{ inputs.opt_rocks }}
          OPT_ROCK_DEM: ${{ inputs.opt_rock_dem }}
          OPT_ROCK_SOURCE: ${{ inputs.opt_rock_source }}
          OPT_ROCK_IMG_ASSET: ${{ inputs.opt_rock_img_asset }}
          OPT_ROCKS_REBUILD: ${{ inputs.opt_rocks_rebuild }}
          OPT_SIZE_LIMIT_MB: ${{ inputs.opt_size_limit_mb }}
          OPT_UGKK_FALLBACK: ${{ inputs.opt_ugkk_fallback }}
          OPT_TEST_KM2: ${{ inputs.test_km2 }}
          SLOPE_DIR: slope-chunks
          SLOPE_JOBS: "6"
          # this step reads Drive the most: slope in parts of a 145 GB raster
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          DRIVE_CLIENT: ${{ vars.DRIVE_CLIENT }}
          DRIVE_SECRET: ${{ secrets.DRIVE_SECRET }}
          DRIVE_REFRESH: ${{ secrets.DRIVE_REFRESH }}
        run: bash workers/contours-rocks/build.sh

      # only a finished layer is saved: without `rocks.pmtiles` or with
      # `rock-failed.txt` a failure would pass as done under today's key
      - name: Rock cache (save)
        if: ${{ always() && inputs.opt_contours == 'true' && steps.done.outputs.compute == 'true' && hashFiles('contours-out/rocks.pmtiles') != '' && hashFiles('contours-out/rock-failed.txt') == '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: contours-out
          key: ${{ needs.keys.outputs.rocks }}

      - name: Slope part cache (save)
        if: ${{ always() && inputs.opt_contours == 'true' && inputs.test_km2 == '0' && steps.slope-cache.outputs.cache-hit != 'true' && hashFiles('slope-chunks/**') != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: slope-chunks
          key: ${{ needs.keys.outputs.slope }}${{ github.run_id }}

      - name: DEM tile cache (save)
        if: ${{ always() && inputs.opt_contours == 'true' && steps.demtiles-cache.outputs.cache-hit != 'true' && hashFiles('dem/**') != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: dem
          key: ${{ needs.keys.outputs.demtiles_rocks }}

      - name: Put the contours into the site
        id: contours
        if: ${{ inputs.opt_contours == 'true' }}
        env:
          ONLY: rocks
          CACHE_HIT: ${{ steps.done.outputs.have }}
          OPT_CONTOUR_LINES: ${{ inputs.opt_contour_lines }}
          OPT_CONTOUR_MAXZOOM: ${{ inputs.opt_contour_maxzoom }}
          OPT_ROCKS: ${{ inputs.opt_rocks }}
          OPT_ROCK_MAXZOOM: ${{ inputs.opt_rock_maxzoom }}
          REGION_KEY: ${{ inputs.region_key }}
        run: workers/contours-rocks/site.sh

      - name: Store rocks and contours
        if: ${{ inputs.opt_contours == 'true' && hashFiles('data/rock.gpkg') != '' }}
        continue-on-error: true
        env:
          KIND: terrain
          NAME: rocks-${{ inputs.region_key }}-s${{ inputs.rock_slope }}-g${{ inputs.opt_rock_res }}
        run: workers/deploy/publish-results.sh

      - name: Keep the site piece
        if: ${{ always() && hashFiles('_site/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: site-rocks
          path: _site
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore

      - name: Add the rock statistics to the timing
        if: ${{ always() }}
        run: cp contours-out/rock-stats.txt steps-out/ 2>/dev/null || true

      - name: Keep the step timing
        if: ${{ always() && hashFiles('steps-out/*') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: steps-rocks
          path: steps-out
          retention-days: 1
          if-no-files-found: ignore

  terrain:
    name: Hillshading and 3D terrain
    needs: keys
    if: ${{ !cancelled() && inputs.opt_terrain == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      # `read`: finished tiles go to the Drive store, not a release
      contents: read
    outputs:
      enabled: ${{ steps.terrain.outputs.enabled }}
      maxzoom: ${{ steps.terrain.outputs.maxzoom }}
      dem_source: ${{ steps.terrain.outputs.dem_source }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Prepare the timing folder
        run: mkdir -p steps-out

      # MapLibre reads no heights from a GeoTIFF, it needs a PNG (terrarium)
      # pyramid; they depend only on the area and go to store `dem-terrain`
      - name: Download the region polygon
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: region-poly
          path: data

      - name: Height tile cache (restore)
        id: terrain-cache
        if: ${{ inputs.opt_terrain == 'true' && inputs.opt_terrain_rebuild != 'true' }}
        uses: ./.github/actions/cache-restore
        with:
          path: terrain-out
          key: ${{ needs.keys.outputs.terrain }}
          # finished hillshading of an earlier run – see `opt_reuse_layers`
          restore-keys: ${{ inputs.opt_reuse_layers == 'true' && needs.keys.outputs.terrain_done || '' }}

      - name: Is the hillshading done?
        id: done
        env:
          LAYER: Hillshading
          HIT: ${{ steps.terrain-cache.outputs.cache-hit }}
          MATCHED: ${{ steps.terrain-cache.outputs.cache-matched-key }}
        run: workers/plan/layer-done.sh

      # after the decision and only when computing: finished tiles need no model
      - name: DEM tile cache (restore)
        id: demtiles-cache
        if: ${{ inputs.opt_terrain == 'true' && steps.done.outputs.compute == 'true' }}
        uses: ./.github/actions/cache-restore
        with:
          path: dem
          key: ${{ needs.keys.outputs.demtiles_terrain }}

      - name: Relief hillshading (PNG tiles from the chosen DEM)
        id: terrain
        if: ${{ inputs.opt_terrain == 'true' }}
        env:
          REGION_KEY: ${{ inputs.region_key }}
          DEM_BBOX: ${{ inputs.dem_bbox }}
          SHADING_SOURCE: ${{ inputs.opt_shading_source }}
          TERRAIN_MAXZOOM: ${{ inputs.opt_terrain_maxzoom }}
          TERRAIN_FRAC_BITS: ${{ inputs.opt_terrain_frac_bits }}
          TERRAIN_FORMAT: ${{ inputs.opt_terrain_format }}
          TERRAIN_REBUILD: ${{ inputs.opt_terrain_rebuild }}
          # the hillshading budget is decided while computing tiles, not at the check
          SIZE_LIMIT_MB: ${{ inputs.opt_size_limit_mb }}
          GH_TOKEN: ${{ github.token }}
          OPT_UGKK_FALLBACK: ${{ inputs.opt_ugkk_fallback }}
        run: workers/terrain/build.sh
      # only what was really computed is saved (see the contours job)
      - name: Height tile cache (save)
        if: ${{ always() && inputs.opt_terrain == 'true' && steps.terrain.outputs.fell_back != 'true' && steps.done.outputs.compute == 'true' && hashFiles('terrain-out/**') != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: terrain-out
          key: ${{ needs.keys.outputs.terrain }}

      # hillshading has its own source and key – without this its restore never hits
      - name: DEM tile cache (save)
        if: ${{ always() && steps.demtiles-cache.outputs.cache-hit != 'true' && hashFiles('dem/**') != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: dem
          key: ${{ needs.keys.outputs.demtiles_terrain }}

      - name: Keep the site piece
        if: ${{ always() && hashFiles('_site/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: site-terrain
          path: _site
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore

      - name: Keep the step timing
        if: ${{ always() && hashFiles('steps-out/*') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: steps-terrain
          path: steps-out
          retention-days: 1
          if-no-files-found: ignore

  # `needs` on a called workflow speaks of the whole; this job only hands out
  # results (actionlint doesn't know `jobs.<id>.result` in outputs), `always()`
  results:
    name: Layer results
    needs: [contours, rocks, terrain, shading-rocks]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    outputs:
      contours: ${{ needs.contours.result }}
      rocks: ${{ needs.rocks.result }}
      terrain: ${{ needs.terrain.result }}
      shading_rocks: ${{ needs.shading-rocks.result }}
    steps:
      - name: How the layers went
        run: |
          set -uo pipefail
          echo "contours=${{ needs.contours.result }}, rocks=${{ needs.rocks.result }}, hillshading=${{ needs.terrain.result }}, rocks from hillshading=${{ needs.shading-rocks.result }}"
