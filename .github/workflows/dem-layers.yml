name: Mapa · vrstvy z výškového modelu

# VRSTEVNICE, SKALY A TIEŇOVANIE – od skladu výškového modelu po `.pmtiles`.
#
# Samostatný workflow preto, že ich potrebujú dve pipeline (build mapy aj
# pregenerovanie vrstvy) a dve kópie by sa rozišli v kľúči cache alebo v tom,
# ktorý model sa doplní. Navyše `build-map-region.yml` narážal na strop 128 KiB.
#
# Joby: check-dem, mirror-* (doplnenie modelov), shading-rocks, keys (kľúče
# cache), contours, rocks, terrain. Kusy stránky odkladajú ako `site-*`,
# merania ako `steps-*`.
#
# `workflow_call` nededí `secrets` ani `env` volajúceho – prihlásenie chodí
# cez `secrets: inherit`, podiely na rozpočte cez inputy.

on:
  workflow_call:
    inputs:
      region_key:
        description: "Kľúč regiónu – z neho sú mená `{región}-contours.pmtiles` a spol."
        required: true
        type: string
      area:
        description: "Výrez z formulára (`cely_region`, alebo kľúč pohoria) – ide do doplňovacích pipeline"
        required: true
        type: string
      area_key:
        description: "Kľúč vyriešeného výrezu (`cely`, alebo pohorie s príponou testu)"
        required: true
        type: string
      area_name:
        description: "Meno výrezu do hlášok a štatistiky"
        required: false
        default: ""
        type: string
      area_bbox:
        description: "Bbox výrezu – na ňom sa vrstvy naozaj počítajú"
        required: true
        type: string
      area_km2:
        description: "Plocha výrezu v km² (rozpočet času pri výbere mriežky skál)"
        required: false
        default: ""
        type: string
      dem_bbox:
        description: "Územie, na ktorom sa výškový model číta (bbox s prekryvom so susedom)"
        required: true
        type: string
      dem_bboxkey:
        description: "To isté ako kľúč cache – bbox s `_` namiesto `,.-`"
        required: true
        type: string
      test_km2:
        description: "Rýchly test: koľko km² zo stredu (0 = ostrý beh)"
        required: false
        default: "0"
        type: string
      day:
        description: "Dnešný dátum – do kľúčov cache, ktoré starnú denne"
        required: false
        default: ""
        type: string
      # `opt_contours` je brána jobu, nie vrstva: vrstevnice aj skaly z neho
      # vychádzajú do jedného výpočtu
      opt_contours:
        description: "Brána vrstevníc a skál – `true`, keď je zapnuté aspoň jedno z nich"
        required: true
        type: string
      opt_contour_lines:
        description: "Kresliť vrstevnice? (`contour_source` nie je `ziadne`)"
        required: true
        type: string
      opt_rocks:
        description: "Kresliť skaly? (`rock_source` nie je `ziadne`)"
        required: true
        type: string
      opt_terrain:
        description: "Kresliť tieňovanie a 3D terén? (`shading_source` nie je `ziadne`)"
        required: true
        type: string
      opt_contour_source:
        description: "Model terénu pre vrstevnice"
        required: true
        type: string
      opt_rock_source:
        description: "Zdroj skál – model, alebo `tienovanie`"
        required: true
        type: string
      # prázdny pri `tienovanie` aj `ziadne` – vtedy na model nikto nesiahne
      opt_rock_dem:
        description: "Zdroj skál, LEN keď je to výškový model (inak prázdny)"
        required: false
        default: ""
        type: string
      opt_shading_source:
        description: "Model terénu pre tieňovanie a 3D"
        required: true
        type: string
      opt_ugkk_fallback:
        description: "Smie sa pri chýbajúcom DMR 5.0 siahnuť po náhradnom modeli?"
        required: false
        default: ""
        type: string
      opt_ugkk_urls:
        description: "Vlastné adresy archívov ÚGKK (prázdne = číselník)"
        required: false
        default: ""
        type: string
      opt_contour_interval:
        description: "Interval vrstevníc v metroch"
        required: false
        default: "5"
        type: string
      opt_contour_maxzoom:
        description: "Najvyšší zoom dlaždíc s vrstevnicami"
        required: false
        default: "14"
        type: string
      opt_contour_smoothing:
        description: "Zjemnenie DEM pred trasovaním v oblúkových sekundách"
        required: false
        default: "0"
        type: string
      rock_slope:
        description: "Od akého sklonu (°) je terén skala"
        required: false
        default: "50"
        type: string
      opt_rock_maxzoom:
        description: "Najvyšší zoom dlaždíc so skalami"
        required: false
        default: "16"
        type: string
      opt_rock_res:
        description: "Mriežka na obrys skál v metroch, alebo `auto`"
        required: false
        default: "auto"
        type: string
      opt_rock_plne:
        description: "Plné skalné plochy namiesto obrysu"
        required: false
        default: "0"
        type: string
      opt_rock_zapln_diery:
        description: "Zaplniť diery v skalách (súvislé plochy namiesto tvaru)"
        required: false
        default: "0"
        type: string
      opt_rock_img_asset:
        description: "Presné meno uloženého výsledku skál z tieňovania (prázdne = spočítať v tomto behu)"
        required: false
        default: ""
        type: string
      opt_rock_img_zoom:
        description: "Zoom tieňovaných dlaždíc (`auto` = najvyšší, čo sa zmestí do stropu)"
        required: false
        default: "auto"
        type: string
      opt_rock_img_options:
        description: "Prepínače pre výpočet skál z tieňovania"
        required: false
        default: ""
        type: string
      opt_terrain_maxzoom:
        description: "Najvyšší zoom výškových dlaždíc (`auto` = podľa mriežky modelu)"
        required: false
        default: "auto"
        type: string
      # príznaky z výberu `rebuild`: zahodia cache tej vrstvy a spočítajú ju
      # nanovo (stráži `workers/lint/rebuild.py`)
      opt_contours_rebuild:
        description: "Prepočítať vrstevnice nanovo, aj keď sú v cache"
        required: false
        default: "false"
        type: string
      opt_rocks_rebuild:
        description: "Prepočítať skaly nanovo, aj keď sú v cache"
        required: false
        default: "false"
        type: string
      opt_terrain_rebuild:
        description: "Prepočítať tieňovanie nanovo, aj keď je v cache"
        required: false
        default: "false"
        type: string
      # `true` = vrstva, ktorá s týmito nastaveniami už raz vznikla, sa
      # neprepočítava. Hľadá sa predponou kľúča a job to hlási `::notice::`-om.
      # Predvolené: prepočet si pýta výber `rebuild`, nie zmena skriptu.
      opt_reuse_layers:
        description: "Nepočítať vrstvu, ktorá s týmito nastaveniami už raz vznikla"
        required: false
        default: "true"
        type: string
      opt_size_limit_mb:
        description: "Rozpočet celej stránky v MB"
        required: false
        default: "900"
        type: string
      budget_contours_pct:
        description: "Podiel vrstevníc na rozpočte stránky v percentách"
        required: false
        default: "25"
        type: string
      budget_rocks_pct:
        description: "Podiel skál na rozpočte stránky v percentách"
        required: false
        default: "12"
        type: string
      budget_terrain_pct:
        description: "Podiel tieňovania na rozpočte stránky v percentách"
        required: false
        default: "12"
        type: string
    outputs:
      # čo naozaj vzniklo – volajúci to potrebuje do štýlu, manifestu aj
      # katalógu. Ide von aj výsledok jobu (`res_*`).
      contours_enabled:
        description: "Vznikli vrstevnice?"
        value: ${{ jobs.contours.outputs.enabled }}
      contours_maxzoom:
        description: "Zoom, po ktorý vrstevnice naozaj sú"
        value: ${{ jobs.contours.outputs.maxzoom }}
      contours_dem_source:
        description: "Z ktorého modelu sú vrstevnice NAOZAJ (mohol sa prepnúť na náhradný)"
        value: ${{ jobs.contours.outputs.dem_source }}
      rocks_enabled:
        description: "Vznikli skaly?"
        value: ${{ jobs.rocks.outputs.rocks_enabled }}
      rocks_maxzoom:
        description: "Zoom, po ktorý skaly naozaj sú"
        value: ${{ jobs.rocks.outputs.rocks_maxzoom }}
      rock_slope:
        description: "Prah sklonu, ktorým skaly naozaj vznikli"
        value: ${{ jobs.rocks.outputs.rock_slope }}
      rock_source:
        description: "Z čoho sú skaly NAOZAJ (model, alebo `tienovanie`)"
        value: ${{ jobs.rocks.outputs.rock_source }}
      terrain_enabled:
        description: "Vzniklo tieňovanie?"
        value: ${{ jobs.terrain.outputs.enabled }}
      terrain_maxzoom:
        description: "Zoom, po ktorý sú výškové dlaždice"
        value: ${{ jobs.terrain.outputs.maxzoom }}
      terrain_dem_source:
        description: "Z ktorého modelu je tieňovanie NAOZAJ"
        value: ${{ jobs.terrain.outputs.dem_source }}
      res_contours:
        description: "Výsledok jobu s vrstevnicami (do súhrnu behu)"
        value: ${{ jobs.vysledky.outputs.contours }}
      res_terrain:
        description: "Výsledok jobu s tieňovaním (do súhrnu behu)"
        value: ${{ jobs.vysledky.outputs.terrain }}
      res_shading_rocks:
        description: "Výsledok podpipeline so skalami z tieňovania (do súhrnu behu)"
        value: ${{ jobs.vysledky.outputs.shading_rocks }}
    # `workflow_call` nededí secrets sám. Bez nich sa cache na Drive ani sklady
    # modelov nemajú ako otvoriť. `DRIVE_CLIENT` je repository variable.
    secrets:
      GDRIVE_CREDENTIALS:
        required: false
      DRIVE_SECRET:
        required: false
      DRIVE_REFRESH:
        required: false

permissions:
  contents: read

env:
  # prihlásenie na Drive pre celý workflow, nie po jobe: stačí na jeden
  # zabudnúť a ten sa ticho vráti k počítaniu všetkého odznova
  GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
  DRIVE_CLIENT: ${{ vars.DRIVE_CLIENT }}
  DRIVE_SECRET: ${{ secrets.DRIVE_SECRET }}
  DRIVE_REFRESH: ${{ secrets.DRIVE_REFRESH }}
  # sklady na Drive, nie GitHub releasy (formát je vo `workers/drive/store.py`).
  # Dlaždice Sonny's LiDAR DTM.
  DEM_STORE: dem-sonny
  # druhý Sonnyho model (1″ .hgt): zvislý krok 1 m, skaly z neho sú polámanejšie
  SONNY1_STORE: dem-sonny1
  # otvorené dáta ÚGKK (DMR 3.5), tie isté 1°×1° dlaždice
  DMR35_STORE: dem-dmr35
  # ÚGKK DMR 5.0, mriežka 5 m; dopĺňa sa po stupňoch, ktoré bbox pretína
  DMR5_STORE: dem-dmr5-v2
  # výrez DMR 5.0 v plnom 1 m rozlíšení, jeden COG na pohorie
  UGKK_STORE: dem-ugkk
  # vyhladenie DEM pred trasovaním – okno priemeru v METROCH. Toto zubatosť
  # naozaj odstráni, `-simplify` a zaoblenie ju len zaokrúhlia. Okno musí byť
  # malé: 5×5 zmazalo aj rebrá a žľaby široké pár metrov.
  # V metroch, nie v bunkách – na hrubom modeli tak vyjde jedna bunka a nehladí
  # sa nič. 0 = vypnuté.
  CONTOUR_DEM_LOWPASS: "2"
  # záporné = koľko štvrtín bunky DEM (tolerancia z orezaného rastra),
  # 0 = vypnuté, kladné = metre. Polovica bunky už odrezáva tvar terénu.
  CONTOUR_SIMPLIFY: "-1"
  # zaoblenie zvyšných rohov: dovolený priehyb tetivy v štvrtinách kroku
  # mriežky dlaždice. Limitnou krivkou (B-spline), nie Chaikinom – ten necháva
  # zo 120° rohu vyše 30°, teda pravidelný zub. Dva = polovica kroku mriežky,
  # teda presne to, čo zaokrúhlenie do dlaždice spraví aj tak.
  CONTOUR_SMOOTH: "2"
  # sklad s hotovými výškovými (hillshade) dlaždicami
  TERRAIN_STORE: dem-terrain
  # sklad s hotovými skalami: závisia len od územia a nastavení, tie sú v mene
  ROCK_STORE: dem-rocks
  # skaly z tieňovaných dlaždíc – napĺňa ich „Dáta · tieňované skaly"
  ROCK_IMG_STORE: dem-rocks-img
  # sklad častí rastra sklonu; nevyprší (na rozdiel od cache) a časti majú
  # absolútnu mriežku, takže sa delia medzi výrezmi
  SLOPE_STORE: dem-slope
  ROCK_RES: auto # záložná mriežka na sklon (m), keď voľba rock_res chýba
  # mriežka, na ktorej sa trasuje obrys – nemusí byť tá, na ktorej je uložený
  # sklon: pixel dlaždice má pri z16 1,57 m, takže 1 m nesie detail navyše
  # za jedenásťnásobok času. `auto` = najjemnejšia, ktorú je ešte vidieť.
  ROCK_VEC_RES: auto
  # najmenšia plocha = jedna bunka mriežky. Zjednodušenie obrysu (m):
  # -1 = štvrtina mriežky, 0 = vypnuté
  ROCK_SIMPLIFY: "-1"
  # zaoblenie obrysu – to isté ako CONTOUR_SMOOTH, len podľa ROCK_MAXZOOM.
  # Po zjednodušení ostávajú ostré rohy (lom zo 4,6° na 28,5°). 0 = vypnuté.
  ROCK_SMOOTH: "2"
  # verzia algoritmu v mene assetu: iný algoritmus = iné skaly, takže sa staré
  # nesmú použiť. v5 = švy medzi blokmi sa naozaj zlepia.
  ROCK_ALGO: v5
  ROCK_CLIFF_PLUS: "15" # o koľko ° nad prahom začína trieda `cliff` (tmavšia)
  # sklon sa počíta po častiach: bbox kraja má pri 2 m vyše 3 mld. buniek.
  # Vektorizuje sa až hotová mozaika – po častiach by sa diery na hranici stratili.
  ROCK_CHUNK_CELLS: "150000000"
  # koľko minút majú skaly trvať; `0` = neobmedzene, a to je predvolené.
  # Zastaviť to aj tak nezastavovalo (vektorizácia je jeden nedeliteľný
  # priechod), ostávalo z toho len to, že `rock_res: auto` podľa toho volil
  # hrubšiu mriežku, než model má. Kto sa ponáhľa, zadá `rock_res` natvrdo.
  # Stropy, čo ostali: timeout jobu a `ROCK_MAX_RSS_GB`.
  ROCK_BUDGET_MIN: "0"
  # strana bloku pri vektorizácii: `gdal_contour -p` nad celou mozaikou je
  # superlineárny a nedobehol vôbec. Po blokoch je pamäť ohraničená a hotový
  # blok ostáva na disku, takže sa zrušený beh dá nadviazať; švy zlepí únia.
  # 0 = jeden priechod nad celou mozaikou.
  ROCK_BLOCK_PX: "4096"
  ROCK_MAX_RSS_GB: "12" # nad tým sa gdal_contour zastaví s hláškou, nie OOM
  # tep k percentám dopĺňa pamäť, CPU, disk a rast výstupu
  ROCK_HEARTBEAT_S: "30"
  # podiely na rozpočte chodia inputom: `workflow_call` `env:` nededí a ten
  # istý údaj číta aj job `tiles` u volajúceho
  BUDGET_CONTOURS_PCT: ${{ inputs.budget_contours_pct }}
  BUDGET_ROCKS_PCT: ${{ inputs.budget_rocks_pct }}
  BUDGET_TERRAIN_PCT: ${{ inputs.budget_terrain_pct }}

jobs:
  # je v sklade terén pre toto územie? Iný zdroj výšok nemáme, takže by build
  # po pár minútach zlyhal – radšej to doplnia joby `mirror-*` dopredu
  check-dem:
    name: Kontrola výškového modelu
    runs-on: ubuntu-latest
    # stačí, že aspoň jedna vrstva chce DEM. Skaly z tieňovania model nečítajú,
    # preto `opt_rock_dem` (prázdny pri `tienovanie` aj `ziadne`)
    if: ${{ inputs.opt_contour_lines == 'true' || inputs.opt_rock_dem != '' || inputs.opt_terrain == 'true' }}
    outputs:
      # ktorý model treba doplniť pre ktorú vrstvu; keď dve chcú ten istý,
      # ostane vyplnená len prvá – nech sa to isté nesťahuje dvakrát
      mirror_contours: ${{ steps.check.outputs.mirror_contours }}
      mirror_rocks: ${{ steps.check.outputs.mirror_rocks }}
      mirror_terrain: ${{ steps.check.outputs.mirror_terrain }}
      # DMR 5.0 sa dopĺňa cez `Dáta · DMR 5.0` a podľa PODOBY, nie vrstvy:
      # výrez a 1° dlaždice sú dva assety a môžu chýbať oba naraz.
      # `mirror_dmr5_area` je bbox, nie kľúč pohoria; meno assetu ide zvlášť.
      mirror_dmr5_area: ${{ steps.check.outputs.mirror_dmr5_area }}
      mirror_dmr5_asset: ${{ steps.check.outputs.mirror_dmr5_asset }}
      mirror_dmr5_tiles: ${{ steps.check.outputs.mirror_dmr5_tiles }}
      # otlačok skladu na vrstvu – po doplnení skladu sa nesmie vrátiť starý
      # výsledok, ale doplnenie DMR 5.0 nesmie zahodiť vrstevnice zo Sonnyho
      demkey_contours: ${{ steps.check.outputs.demkey_contours }}
      demkey_rocks: ${{ steps.check.outputs.demkey_rocks }}
      demkey_terrain: ${{ steps.check.outputs.demkey_terrain }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # rozhodovanie je vo `workers/dem/check.sh`; to isté si robí aj
      # `workers/dem/fetch.sh`, tak ho oba berú z `workers/dem/target.py`
      - name: Sú v sklade dlaždice pre bbox?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          # bbox aj výrez už raz vyriešila príprava, nepočítajú sa druhý raz.
          # `dem_bbox`, nie `bbox`: kontroluje sa územie, na ktorom sa DEM naozaj číta.
          BBOX: ${{ inputs.dem_bbox }}
          AREA_KEY: ${{ inputs.area_key }}
          # výrez pretnutý s regiónom (v teste zmenšený na štvorec)
          AREA_BBOX: ${{ inputs.area_bbox }}
          SRC_CONTOURS: ${{ inputs.opt_contour_source }}
          SRC_ROCKS: ${{ inputs.opt_rock_dem }}
          SRC_TERRAIN: ${{ inputs.opt_shading_source }}
        run: workers/dem/check.sh

  # doplnenie výškových dát: jeden workflow, tri joby – po jednom na vrstvu.
  # Vrstvy môžu chcieť rôzne modely a chýbať môžu oba naraz; `check-dem` vie
  # povedať, že model už dopĺňa iná vrstva, takže sa to isté nesťahuje dvakrát.
  # Spúšťajú sa samy, keď v sklade nie sú dlaždice pre naše územie.
  mirror-contours:
    name: Doplniť výškový model (vrstevnice)
    needs: check-dem
    if: ${{ !cancelled() && needs.check-dem.outputs.mirror_contours != '' }}
    permissions:
      # `read`, nie `write`: doplnenie publikuje na Drive, nie do releasu
      contents: read
    uses: ./.github/workflows/update-dem.yml
    # Sonny chodí z Drive: bez tokenu by naň platil verejný denný limit
    secrets: inherit
    with:
      what: ${{ needs.check-dem.outputs.mirror_contours }}
      area: ${{ inputs.area }}
      custom_url: ${{ inputs.opt_ugkk_urls }}

  mirror-rocks:
    name: Doplniť výškový model (skaly)
    needs: check-dem
    # keď skaly berú ten istý model ako vrstevnice, `check-dem` ho nechá prázdny
    if: ${{ !cancelled() && needs.check-dem.outputs.mirror_rocks != '' }}
    permissions:
      # `read`, nie `write`: doplnenie publikuje na Drive, nie do releasu
      contents: read
    uses: ./.github/workflows/update-dem.yml
    secrets: inherit                      # Drive, ako vyššie
    with:
      what: ${{ needs.check-dem.outputs.mirror_rocks }}
      area: ${{ inputs.area }}
      custom_url: ${{ inputs.opt_ugkk_urls }}

  mirror-terrain:
    name: Doplniť výškový model (tieňovanie)
    needs: check-dem
    if: ${{ !cancelled() && needs.check-dem.outputs.mirror_terrain != '' }}
    permissions:
      # `read`, nie `write`: doplnenie publikuje na Drive, nie do releasu
      contents: read
    uses: ./.github/workflows/update-dem.yml
    secrets: inherit                      # Drive, ako vyššie
    with:
      what: ${{ needs.check-dem.outputs.mirror_terrain }}
      area: ${{ inputs.area }}
      custom_url: ${{ inputs.opt_ugkk_urls }}

  # DMR 5.0 nechodí cez `update-dem.yml`: ten sťahuje archív na runner, a model
  # má 145 GB. Číta sa cez HTTP Range priamo z Drive (`dmr5-drive.yml`).
  # Dva joby nad jedným workflowom – `dmr5` má dva tvary (výrez v plnom
  # rozlíšení, 1° dlaždice na 5 m) a chýbať môžu naraz.
  mirror-dmr5-area:
    name: Doplniť DMR 5.0 (výrez, plné rozlíšenie)
    needs: check-dem
    if: ${{ !cancelled() && needs.check-dem.outputs.mirror_dmr5_area != '' }}
    permissions:
      # `read`, nie `write`: doplnenie publikuje na Drive, nie do releasu
      contents: read
    uses: ./.github/workflows/dmr5-drive.yml
    # kvôli GDRIVE_CREDENTIALS: bez tokenu platí denný limit sťahovania
    secrets: inherit
    with:
      # bbox toho, čo si beh vypýtal, a meno, ktoré `check-dem` nenašiel.
      # Kľúč pohoria sem nechodí – vyriešil by sa druhýkrát na celý obdĺžnik.
      area: ${{ needs.check-dem.outputs.mirror_dmr5_area }}
      asset: ${{ needs.check-dem.outputs.mirror_dmr5_asset }}
      tiles: false

  mirror-dmr5-tiles:
    name: Doplniť DMR 5.0 (dlaždice)
    needs: check-dem
    if: ${{ !cancelled() && needs.check-dem.outputs.mirror_dmr5_tiles != '' }}
    permissions:
      # `read`, nie `write`: doplnenie publikuje na Drive, nie do releasu
      contents: read
    uses: ./.github/workflows/dmr5-drive.yml
    secrets: inherit                      # GDRIVE_CREDENTIALS, ako vyššie
    with:
      # bbox rozšírený na celé stupne – `N49E020.tif` je sľub o celom stupni
      area: ${{ needs.check-dem.outputs.mirror_dmr5_tiles }}
      tiles: true
      grid_m: "5"

  # skaly z tieňovaných dlaždíc: pri `rock_source: tienovanie` sa obrázky
  # stiahnu rovno v tomto behu (tá istá pipeline, len volaná). Dlaždice majú
  # vlastnú cache podľa výrezu a zoomu.
  shading-rocks:
    name: Skaly z tieňovania
    if: ${{ !cancelled() && inputs.opt_rock_source == 'tienovanie' && inputs.opt_rock_img_asset == '' }}
    permissions:
      # `read`, nie `write`: doplnenie publikuje na Drive, nie do releasu.
      contents: read
    uses: ./.github/workflows/shading-rocks.yml
    # Kvôli cache na Drive: bez tokenu by si tá podpipeline nemala ako otvoriť
    # sklad stiahnutých dlaždíc a ťahala by gigabajty z freemap.sk odznova.
    secrets: inherit
    with:
      # V testovacom režime ide dole rovno bbox testovacieho štvorca, nie meno
      # pohoria. Ten workflow by si síce vedel štvorec spočítať sám, ale
      # z vlastného prieniku (SK) namiesto prieniku s regiónom – a dva výpočty
      # toho istého sa raz rozídu. Rozísť sa tu znamená skaly mimo mapy.
      area: ${{ inputs.test_km2 != '0' && inputs.area_bbox || inputs.area }}
      zoom: ${{ inputs.opt_rock_img_zoom }}
      # Rýchly test nepoužije nič z cache – vrátane TEJTO podpipeline. Sama
      # si totiž odkladá rozrobené obrysy a bez `fresh=1` by na ne nadviazala,
      # takže by si po zmene prahu dostal polovicu starého výsledku a polovicu
      # nového. Vlastné `rock_img_options` to vedia prebiť (`fresh=0`) – tokeny
      # sa spracúvajú zľava doprava a posledná hodnota vyhráva.
      # Stiahnuté JPG dlaždice sa nezahadzujú: to sú vstupné dáta z cudzieho
      # (dobrovoľníckeho) servera, nie výsledok výpočtu.
      # TO ISTÉ PLATÍ PRI `rebuild: skaly`: pri `rock_source: tienovanie` sa
      # sklon nepočíta vôbec, obrysy robí táto podpipeline – a bez `fresh=1`
      # nadviazala na svoje rozrobené kusy, takže výber sľúbil prepočet
      # a vrátil starý výsledok (`workers/lint/rebuild.py`).
      options: ${{ (inputs.test_km2 != '0' || inputs.opt_rocks_rebuild == 'true') && format('fresh=1 {0}', inputs.opt_rock_img_options) || inputs.opt_rock_img_options }}

  # ---------- kľúče cache ----------
  # Vlastný job, lebo kľúč potrebuje OBOJE: bbox z prípravy a otlačok releasu
  # s DEM z kontroly. A potrebuje ho restore, save aj mazanie pri
  # pregenerovaní – keby bol napísaný trikrát, stačí ho raz zabudnúť opraviť
  # a cache sa ticho rozsype (ukladá sa pod iný kľúč, než sa hľadá).
  keys:
    name: Kľúče cache
    needs: [check-dem, mirror-contours, mirror-rocks, mirror-terrain,
            mirror-dmr5-area, mirror-dmr5-tiles]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      # `actions: write` tu bolo na mazanie GitHub cache. Cache je na Drive,
      # takže sa maže tokenom vlastníka z `env:` workflowu a GitHub na to
      # žiadne právo nepotrebuje.
      contents: read
    outputs:
      # Tri vrstvy, tri nezávislé kľúče – a ku každému predpona `*_hotove`
      # (tie isté nastavenia, iný otlačok skladu či skriptov) a kľúč
      # `*_stary` spred rozdelenia. Rozpis je vo `workers/plan/cache-keys.sh`.
      contours: ${{ steps.keys.outputs.contours }}
      contours_hotove: ${{ steps.keys.outputs.contours_hotove }}
      contours_stary: ${{ steps.keys.outputs.contours_stary }}
      rocks: ${{ steps.keys.outputs.rocks }}
      rocks_hotove: ${{ steps.keys.outputs.rocks_hotove }}
      rocks_stary: ${{ steps.keys.outputs.rocks_stary }}
      terrain: ${{ steps.keys.outputs.terrain }}
      terrain_hotove: ${{ steps.keys.outputs.terrain_hotove }}
      terrain_stary: ${{ steps.keys.outputs.terrain_stary }}
      demtiles_contours: ${{ steps.keys.outputs.demtiles_contours }}
      demtiles_rocks: ${{ steps.keys.outputs.demtiles_rocks }}
      demtiles_terrain: ${{ steps.keys.outputs.demtiles_terrain }}
      slope: ${{ steps.keys.outputs.slope }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Kľúč potrebuje restore, save aj mazanie pri pregenerovaní. Keby bol
      # napísaný trikrát, stačí ho raz zabudnúť opraviť a cache sa ticho
      # rozsype (uloží sa pod iným kľúčom, než sa hľadá).
      # Skladanie kľúčov je vo `workers/plan/cache-keys.sh` (strop súboru 128 kB).
      # `hashFiles` je funkcia GitHubu, tak sa jej výsledok podá ako env.
      - name: Kľúče cache
        id: keys
        env:
          AREA_IN: ${{ inputs.area }}
          AREA_KEY: ${{ inputs.area_key }}
          CONTOUR_INTERVAL: ${{ inputs.opt_contour_interval }}
          DEMKEY_CONTOURS: ${{ needs.check-dem.outputs.demkey_contours }}
          DEMKEY_ROCKS: ${{ needs.check-dem.outputs.demkey_rocks }}
          DEMKEY_TERRAIN: ${{ needs.check-dem.outputs.demkey_terrain }}
          DEM_BBOXKEY: ${{ inputs.dem_bboxkey }}
          OPT_CONTOUR_MAXZOOM: ${{ inputs.opt_contour_maxzoom }}
          OPT_CONTOUR_SMOOTHING: ${{ inputs.opt_contour_smoothing }}
          OPT_CONTOUR_SOURCE: ${{ inputs.opt_contour_source }}
          OPT_ROCK_IMG_ASSET: ${{ inputs.opt_rock_img_asset }}
          OPT_ROCK_MAXZOOM: ${{ inputs.opt_rock_maxzoom }}
          OPT_ROCK_PLNE: ${{ inputs.opt_rock_plne }}
          OPT_ROCK_RES: ${{ inputs.opt_rock_res }}
          OPT_ROCK_SOURCE: ${{ inputs.opt_rock_source }}
          OPT_ROCK_ZAPLN_DIERY: ${{ inputs.opt_rock_zapln_diery }}
          OPT_SHADING_SOURCE: ${{ inputs.opt_shading_source }}
          OPT_TERRAIN_MAXZOOM: ${{ inputs.opt_terrain_maxzoom }}
          ROCK_SLOPE: ${{ inputs.rock_slope }}
          # dva otlačky, nie jeden: oprava v `rocks.sh` nemá zahodiť hodinu
          # vrstevníc. V otlačku musí byť každý súbor, ktorý rozhoduje o tvare.
          # Otlačok vidí len súbory – ladenie tvaru je v `env:`, takže je
          # v kľúči zvlášť (`workers/plan/cache-keys.sh`).
          SCHEMA_CONTOURS: ${{ hashFiles('workers/contours-rocks/contours.yml', 'workers/contours-rocks/build.sh', 'workers/contours-rocks/smooth-shapes.py', 'workers/lib/contour-blocks.py') }}
          SCHEMA_ROCKS: ${{ hashFiles('workers/contours-rocks/rocks.yml', 'workers/contours-rocks/rocks.sh', 'workers/contours-rocks/build.sh', 'workers/contours-rocks/rock-areas.py', 'workers/contours-rocks/rock-plan.py', 'workers/contours-rocks/slope-chunks.py', 'workers/contours-rocks/smooth-shapes.py', 'workers/lib/contour-blocks.py') }}
          # otlačok spred rozdelenia, len do kľúča `*_stary` – zoznam súborov
          # sa preto nesmie meniť
          SCHEMA_HASH: ${{ hashFiles('workers/contours-rocks/contours.yml', 'workers/contours-rocks/rocks.yml', 'workers/contours-rocks/rock-areas.py', 'workers/contours-rocks/rock-plan.py', 'workers/contours-rocks/smooth-shapes.py', 'workers/contours-rocks/build.sh', 'workers/contours-rocks/rocks.sh', 'workers/lib/contour-blocks.py') }}
        run: workers/plan/cache-keys.sh

      # kým starý záznam existuje, nový sa pod ten istý kľúč neuloží
      - name: Pregenerovanie – zmaž staré cache
        if: ${{ inputs.opt_contours_rebuild == 'true' || inputs.opt_rocks_rebuild == 'true' || inputs.opt_terrain_rebuild == 'true' }}
        run: |
          set -uo pipefail
          drop() { # $1 = kľúč cache
            python3 workers/drive/cache.py --delete --key="$1"
          }
          # vrstva po vrstve: `rebuild: skaly` nemá zahodiť hodinu vrstevníc.
          # Aj kľúč spred rozdelenia, inak by ostala v tieni starého záznamu.
          if [ '${{ inputs.opt_contours_rebuild }}' = 'true' ]; then
            drop '${{ steps.keys.outputs.contours }}'
            drop '${{ steps.keys.outputs.contours_stary }}'
          fi
          if [ '${{ inputs.opt_rocks_rebuild }}' = 'true' ]; then
            drop '${{ steps.keys.outputs.rocks }}'
            drop '${{ steps.keys.outputs.rocks_stary }}'
          fi
          if [ '${{ inputs.opt_terrain_rebuild }}' = 'true' ]; then
            drop '${{ steps.keys.outputs.terrain }}'
            drop '${{ steps.keys.outputs.terrain_stary }}'
          fi

  # najdlhší job (skaly sú desiatky minút). Vlastný job = vlastný timeout,
  # a keď spadne, mapa ani tieňovanie sa nezahodia
  contours:
    name: Vrstevnice
    # `shading-rocks` je v needs kvôli poradiu, nie dátam; pri inom zdroji je
    # preskočený a `!cancelled()` sa o preskočenú závislosť nezastaví
    needs: [keys, shading-rocks]
    if: ${{ !cancelled() && inputs.opt_contours == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      # `read`: hotové skaly idú do skladu na Drive, nie do releasu
      contents: read
    outputs:
      enabled: ${{ steps.contours.outputs.enabled }}
      maxzoom: ${{ steps.contours.outputs.maxzoom }}
      # skaly sú od vrstevníc oddelené: vlastný .pmtiles, maxzoom aj zapínač
      dem_source: ${{ steps.contours.outputs.dem_source }}
      size_mb: ${{ steps.contours.outputs.size_mb }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # meranie musí byť v pracovnom priečinku – `hashFiles` inam nevidí
      - name: Priprav priečinok na meranie
        run: mkdir -p steps-out


      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Planetileru (restore)
        id: planetiler-cache
        uses: ./.github/actions/cache-restore
        with:
          path: planetiler.jar
          key: planetiler-latest-${{ inputs.day }}

      - name: Stiahni Planetiler
        run: workers/lib/planetiler.sh
      # terén ide z externého DEM (Sonny's LiDAR DTM): OSM výškový model nemá.
      # Copernicus GLO-30 ako záloha je zámerne vypnutý – je to model povrchu,
      # takže by vrstevnice v lese viedli po korunách. Keď dlaždica chýba,
      # build radšej zlyhá s hláškou.
      #
      # Skaly vznikajú z toho istého DEM (sklon terénu). Robia sa pred
      # dlaždicami, aby Planetiler dostal presne to, čo z rozpočtu zvýšilo.
      # Pri `contours_rebuild` sa restore preskočí.
      - name: Cache vrstevníc (restore)
        id: contours-cache
        if: ${{ inputs.opt_contours == 'true' && inputs.opt_contours_rebuild != 'true' }}
        uses: ./.github/actions/cache-restore
        with:
          path: contours-out
          key: ${{ needs.keys.outputs.contours }}
          # predpona s nastaveniami, keď si beh pýta hotové vrstvy: trafí sa na
          # najnovšie s tými istými nastaveniami. Prázdna = prísna cache.
          restore-keys: ${{ inputs.opt_reuse_layers == 'true' && needs.keys.outputs.contours_hotove || '' }}

      # jednorazová migrácia: kým vrstevnice a skaly zdieľali kľúč, ležali pod
      # `contours-v10-…`. Presný kľúč, nie predpona – staré skaly majú ten istý
      # s príponou `-rocks`. Dá sa zmazať, keď cache prejde obrátkou (30 dní).
      - name: Cache vrstevníc – kľúč spred rozdelenia (restore)
        id: contours-cache-stary
        if: ${{ inputs.opt_contours == 'true' && inputs.opt_contours_rebuild != 'true' && steps.contours-cache.outputs.cache-hit != 'true' && steps.contours-cache.outputs.cache-matched-key == '' }}
        uses: ./.github/actions/cache-restore
        with:
          path: contours-out
          key: ${{ needs.keys.outputs.contours_stary }}

      # jedna odpoveď na „počítať, alebo nie" pre všetky štyri miesta v jobe
      - name: Sú vrstevnice hotové?
        id: hotove
        env:
          VRSTVA: Vrstevnice
          HIT: ${{ steps.contours-cache.outputs.cache-hit }}
          MATCHED: ${{ steps.contours-cache.outputs.cache-matched-key }}
          HIT_STARY: ${{ steps.contours-cache-stary.outputs.cache-hit }}
        run: workers/plan/hotova-vrstva.sh

      # DEM dlaždice sú desiatky MB a menia sa len so skladom (`demkey`);
      # nepregenerúvajú sa nikdy – sú to stiahnuté dáta, nie výpočet.
      # Cachuje sa celý `dem/` (môžu tam byť dva modely naraz), medzivýsledky
      # idú do `work/`, nech sa do cache nedostane `clip.tif`.
      - name: Stiahni polygón kraja
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: region-poly
          path: data

      # len keď sa naozaj počíta: model je gigabajty a k hotovej vrstve netreba
      - name: Cache DEM dlaždíc (restore)
        id: demtiles-cache
        if: ${{ inputs.opt_contours == 'true' && steps.hotove.outputs.pocitaj == 'true' }}
        uses: ./.github/actions/cache-restore
        with:
          path: dem
          key: ${{ needs.keys.outputs.demtiles_contours }}

      # sklad častí sklonu: vďaka nemu zrušený beh nezahodí hodinu čítania
      # z Drive. Kľúč nesie výrez a mriežku, nie prah sklonu – ten sa uplatní
      # až pri vektorizácii. `restore-keys` je podstatné: časti majú absolútnu
      # mriežku, takže starší záznam pre to isté pohorie je použiteľný.
      - name: Vrstevnice a skaly z DEM
        if: ${{ inputs.opt_contours == 'true' && steps.hotove.outputs.pocitaj == 'true' }}
        env:
          ONLY: contours
          GH_TOKEN: ${{ github.token }}
          # územie výpočtu, nie mapy: pri teste je to štvorec so 4 km²
          REGION_BBOX: ${{ inputs.dem_bbox }}
          REGION_KEY: ${{ inputs.region_key }}
          AREA_KEY_IN: ${{ inputs.area_key }}
          AREA_NAME_IN: ${{ inputs.area_name }}
          AREA_BBOX_IN: ${{ inputs.area_bbox }}
          AREA_KM2: ${{ inputs.area_km2 }}
          CONTOUR_INTERVAL: ${{ inputs.opt_contour_interval }}
          OPT_CONTOUR_LINES: ${{ inputs.opt_contour_lines }}
          OPT_CONTOUR_SOURCE: ${{ inputs.opt_contour_source }}
          OPT_CONTOUR_SMOOTHING: ${{ inputs.opt_contour_smoothing }}
          OPT_CONTOUR_MAXZOOM: ${{ inputs.opt_contour_maxzoom }}
          OPT_ROCK_MAXZOOM: ${{ inputs.opt_rock_maxzoom }}
          OPT_ROCK_PLNE: ${{ inputs.opt_rock_plne }}
          OPT_ROCK_ZAPLN_DIERY: ${{ inputs.opt_rock_zapln_diery }}
          ROCK_SLOPE_IN: ${{ inputs.rock_slope }}
          ROCK_RES_IN: ${{ inputs.opt_rock_res }}
          OPT_ROCKS: ${{ inputs.opt_rocks }}
          OPT_ROCK_DEM: ${{ inputs.opt_rock_dem }}
          OPT_ROCK_SOURCE: ${{ inputs.opt_rock_source }}
          OPT_ROCK_IMG_ASSET: ${{ inputs.opt_rock_img_asset }}
          OPT_ROCKS_REBUILD: ${{ inputs.opt_rocks_rebuild }}
          OPT_SIZE_LIMIT_MB: ${{ inputs.opt_size_limit_mb }}
          OPT_UGKK_FALLBACK: ${{ inputs.opt_ugkk_fallback }}
          # testovací beh sa skladu nesmie dotknúť; `rocks_rebuild` ho má obísť
          OPT_TEST_KM2: ${{ inputs.test_km2 }}
          SLOPE_DIR: slope-chunks
          # Drive je latenčný, nie úzky; nad ~16 vláknami začne odpovedať 403
          SLOPE_JOBS: "6"
          # skaly z `dmr5` čítajú sklon rovno z Drive, takže token treba aj tu
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          DRIVE_CLIENT: ${{ vars.DRIVE_CLIENT }}
          DRIVE_SECRET: ${{ secrets.DRIVE_SECRET }}
          DRIVE_REFRESH: ${{ secrets.DRIVE_REFRESH }}
        run: bash workers/contours-rocks/build.sh
      # ukladá sa hneď a len to, čo sa naozaj spočítalo: vrstva vzatá po
      # predpone by o sebe tvrdila dnešný otlačok skriptov
      - name: Cache vrstevníc (save)
        if: ${{ always() && inputs.opt_contours == 'true' && steps.hotove.outputs.pocitaj == 'true' && hashFiles('contours-out/**') != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: contours-out
          key: ${{ needs.keys.outputs.contours }}

      # `always()`: sklad má prežiť práve tie behy, ktoré sa nedopočítali.
      # Testovací beh sa neukladá – `restore-keys` berie najnovší záznam, takže
      # by ďalší ostrý beh dostal ten chudobný.
      - name: Cache DEM dlaždíc (save)
        if: ${{ always() && inputs.opt_contours == 'true' && steps.demtiles-cache.outputs.cache-hit != 'true' && hashFiles('dem/**') != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: dem
          key: ${{ needs.keys.outputs.demtiles_contours }}

      # vo `workers/contours-rocks/site.sh` – ten istý krok majú dva joby
      - name: Zaraď vrstevnice do webu
        id: contours
        if: ${{ inputs.opt_contours == 'true' }}
        env:
          ONLY: contours
          # „nič sa nepočítalo" je aj hotová vrstva z predošlého behu
          CACHE_HIT: ${{ steps.hotove.outputs.mam }}
          OPT_CONTOUR_LINES: ${{ inputs.opt_contour_lines }}
          OPT_CONTOUR_MAXZOOM: ${{ inputs.opt_contour_maxzoom }}
          OPT_ROCKS: ${{ inputs.opt_rocks }}
          OPT_ROCK_MAXZOOM: ${{ inputs.opt_rock_maxzoom }}
          REGION_KEY: ${{ inputs.region_key }}
        run: workers/contours-rocks/site.sh

      # do skladu na Drive, nie ako artefakt. Zoznam súborov je vo
      # `workers/deploy/publish-results.sh` – ten istý krok majú dva joby.
      - name: Odlož skaly a vrstevnice do skladu
        if: ${{ inputs.opt_contours == 'true' && hashFiles('data/rock.gpkg') != '' }}
        continue-on-error: true
        env:
          CO: teren
          NAZOV: teren-${{ inputs.region_key }}-s${{ inputs.rock_slope }}-g${{ inputs.opt_rock_res }}
        run: workers/deploy/publish-results.sh

      # každý job vyrobí svoj kus `_site` a `deploy` ich zlepí.
      # compression-level 0: .pmtiles aj .png sú už komprimované.
      - name: Odlož časť stránky
        if: ${{ always() && hashFiles('_site/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: site-contours
          path: _site
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore

      # štatistika skál ide k meraniu krokov, nie na stránku
      - name: Pribal štatistiku skál k meraniu
        if: ${{ always() }}
        run: cp contours-out/rock-stats.txt steps-out/ 2>/dev/null || true

      - name: Odlož meranie krokov
        if: ${{ always() && hashFiles('steps-out/*') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: steps-contours
          path: steps-out
          retention-days: 1
          if-no-files-found: ignore

  # tieňovanie a 3D terén sú nezávislé od vrstevníc – oboje potrebuje len DEM
  rocks:
    # druhá polovica toho, čo bolo „Vrstevnice a skaly": ten istý skript
    # s `ONLY: rocks`. Rozpis krokov stojí pri jobe `contours`.
    name: Skaly
    needs: [keys, shading-rocks]
    if: ${{ !cancelled() && inputs.opt_contours == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      # `read`: hotové skaly idú do skladu na Drive, nie do releasu
      contents: read
    outputs:
      enabled: ${{ steps.contours.outputs.rocks_enabled }}
      rocks_enabled: ${{ steps.contours.outputs.rocks_enabled }}
      rocks_maxzoom: ${{ steps.contours.outputs.rocks_maxzoom }}
      dem_source: ${{ steps.contours.outputs.dem_source }}
      rock_slope: ${{ steps.contours.outputs.rock_slope }}
      rock_source: ${{ steps.contours.outputs.rock_source }}
      size_mb: ${{ steps.contours.outputs.size_mb }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Priprav priečinok na meranie
        run: mkdir -p steps-out

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Planetileru (restore)
        id: planetiler-cache
        uses: ./.github/actions/cache-restore
        with:
          path: planetiler.jar
          key: planetiler-latest-${{ inputs.day }}

      - name: Stiahni Planetiler
        run: workers/lib/planetiler.sh
      - name: Cache skál (restore)
        id: contours-cache
        if: ${{ inputs.opt_contours == 'true' && inputs.opt_rocks_rebuild != 'true' }}
        uses: ./.github/actions/cache-restore
        with:
          path: contours-out
          key: ${{ needs.keys.outputs.rocks }}
          # to isté ako pri vrstevniciach, s výnimkou: pri `rock_source:
          # tienovanie` a prázdnom `rock_img_asset` obrysy práve teraz počíta
          # job `shading-rocks` a vziať hotové by znamenalo zahodiť jeho prácu
          restore-keys: ${{ (inputs.opt_reuse_layers == 'true' && (inputs.opt_rock_source != 'tienovanie' || inputs.opt_rock_img_asset != '')) && needs.keys.outputs.rocks_hotove || '' }}

      - name: Cache skál – kľúč spred rozdelenia (restore)
        id: contours-cache-stary
        if: ${{ inputs.opt_contours == 'true' && inputs.opt_rocks_rebuild != 'true' && steps.contours-cache.outputs.cache-hit != 'true' && steps.contours-cache.outputs.cache-matched-key == '' }}
        uses: ./.github/actions/cache-restore
        with:
          path: contours-out
          key: ${{ needs.keys.outputs.rocks_stary }}

      - name: Sú skaly hotové?
        id: hotove
        env:
          VRSTVA: Skaly
          HIT: ${{ steps.contours-cache.outputs.cache-hit }}
          MATCHED: ${{ steps.contours-cache.outputs.cache-matched-key }}
          HIT_STARY: ${{ steps.contours-cache-stary.outputs.cache-hit }}
        run: workers/plan/hotova-vrstva.sh

      # bez polygónu by sa vrstva počítala na celom bboxe regiónu
      - name: Stiahni polygón kraja
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: region-poly
          path: data

      # model aj časti sklonu sú vstupy výpočtu – k hotovým skalám ich netreba
      - name: Cache DEM dlaždíc (restore)
        id: demtiles-cache
        if: ${{ inputs.opt_contours == 'true' && steps.hotove.outputs.pocitaj == 'true' }}
        uses: ./.github/actions/cache-restore
        with:
          path: dem
          key: ${{ needs.keys.outputs.demtiles_rocks }}

      # `opt_rocks_rebuild` tu ostáva: sklon sa má prečítať nanovo
      - name: Cache častí sklonu (restore)
        id: slope-cache
        if: ${{ inputs.opt_contours == 'true' && inputs.opt_rocks_rebuild != 'true' && steps.hotove.outputs.pocitaj == 'true' }}
        uses: ./.github/actions/cache-restore
        with:
          path: slope-chunks
          key: ${{ needs.keys.outputs.slope }}${{ github.run_id }}
          restore-keys: |
            ${{ needs.keys.outputs.slope }}

      - name: Vrstevnice a skaly z DEM
        if: ${{ inputs.opt_contours == 'true' && steps.hotove.outputs.pocitaj == 'true' }}
        env:
          ONLY: rocks
          GH_TOKEN: ${{ github.token }}
          REGION_BBOX: ${{ inputs.dem_bbox }}
          REGION_KEY: ${{ inputs.region_key }}
          AREA_KEY_IN: ${{ inputs.area_key }}
          AREA_NAME_IN: ${{ inputs.area_name }}
          AREA_BBOX_IN: ${{ inputs.area_bbox }}
          AREA_KM2: ${{ inputs.area_km2 }}
          CONTOUR_INTERVAL: ${{ inputs.opt_contour_interval }}
          OPT_CONTOUR_LINES: ${{ inputs.opt_contour_lines }}
          OPT_CONTOUR_SOURCE: ${{ inputs.opt_contour_source }}
          OPT_CONTOUR_SMOOTHING: ${{ inputs.opt_contour_smoothing }}
          OPT_CONTOUR_MAXZOOM: ${{ inputs.opt_contour_maxzoom }}
          OPT_ROCK_MAXZOOM: ${{ inputs.opt_rock_maxzoom }}
          OPT_ROCK_PLNE: ${{ inputs.opt_rock_plne }}
          OPT_ROCK_ZAPLN_DIERY: ${{ inputs.opt_rock_zapln_diery }}
          ROCK_SLOPE_IN: ${{ inputs.rock_slope }}
          ROCK_RES_IN: ${{ inputs.opt_rock_res }}
          OPT_ROCKS: ${{ inputs.opt_rocks }}
          OPT_ROCK_DEM: ${{ inputs.opt_rock_dem }}
          OPT_ROCK_SOURCE: ${{ inputs.opt_rock_source }}
          OPT_ROCK_IMG_ASSET: ${{ inputs.opt_rock_img_asset }}
          OPT_ROCKS_REBUILD: ${{ inputs.opt_rocks_rebuild }}
          OPT_SIZE_LIMIT_MB: ${{ inputs.opt_size_limit_mb }}
          OPT_UGKK_FALLBACK: ${{ inputs.opt_ugkk_fallback }}
          OPT_TEST_KM2: ${{ inputs.test_km2 }}
          SLOPE_DIR: slope-chunks
          SLOPE_JOBS: "6"
          # tento krok číta z Drive najviac: sklon ide po častiach zo 145 GB rastra
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          DRIVE_CLIENT: ${{ vars.DRIVE_CLIENT }}
          DRIVE_SECRET: ${{ secrets.DRIVE_SECRET }}
          DRIVE_REFRESH: ${{ secrets.DRIVE_REFRESH }}
        run: bash workers/contours-rocks/build.sh

      - name: Cache skál (save)
        if: ${{ always() && inputs.opt_contours == 'true' && steps.hotove.outputs.pocitaj == 'true' && hashFiles('contours-out/**') != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: contours-out
          key: ${{ needs.keys.outputs.rocks }}

      - name: Cache častí sklonu (save)
        if: ${{ always() && inputs.opt_contours == 'true' && inputs.test_km2 == '0' && steps.slope-cache.outputs.cache-hit != 'true' && hashFiles('slope-chunks/**') != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: slope-chunks
          key: ${{ needs.keys.outputs.slope }}${{ github.run_id }}

      - name: Cache DEM dlaždíc (save)
        if: ${{ always() && inputs.opt_contours == 'true' && steps.demtiles-cache.outputs.cache-hit != 'true' && hashFiles('dem/**') != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: dem
          key: ${{ needs.keys.outputs.demtiles_rocks }}

      # vo `workers/contours-rocks/site.sh` – ten istý krok majú dva joby
      - name: Zaraď vrstevnice do webu
        id: contours
        if: ${{ inputs.opt_contours == 'true' }}
        env:
          ONLY: rocks
          CACHE_HIT: ${{ steps.hotove.outputs.mam }}
          OPT_CONTOUR_LINES: ${{ inputs.opt_contour_lines }}
          OPT_CONTOUR_MAXZOOM: ${{ inputs.opt_contour_maxzoom }}
          OPT_ROCKS: ${{ inputs.opt_rocks }}
          OPT_ROCK_MAXZOOM: ${{ inputs.opt_rock_maxzoom }}
          REGION_KEY: ${{ inputs.region_key }}
        run: workers/contours-rocks/site.sh

      # do skladu na Drive, nie ako artefakt (`workers/deploy/publish-results.sh`)
      - name: Odlož skaly a vrstevnice do skladu
        if: ${{ inputs.opt_contours == 'true' && hashFiles('data/rock.gpkg') != '' }}
        continue-on-error: true
        env:
          CO: teren
          NAZOV: skaly-${{ inputs.region_key }}-s${{ inputs.rock_slope }}-g${{ inputs.opt_rock_res }}
        run: workers/deploy/publish-results.sh

      - name: Odlož časť stránky
        if: ${{ always() && hashFiles('_site/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: site-rocks
          path: _site
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore

      - name: Pribal štatistiku skál k meraniu
        if: ${{ always() }}
        run: cp contours-out/rock-stats.txt steps-out/ 2>/dev/null || true

      - name: Odlož meranie krokov
        if: ${{ always() && hashFiles('steps-out/*') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: steps-rocks
          path: steps-out
          retention-days: 1
          if-no-files-found: ignore

  terrain:
    name: Tieňovanie a 3D terén
    needs: keys
    if: ${{ !cancelled() && inputs.opt_terrain == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      # `read`: hotové dlaždice idú do skladu na Drive, nie do releasu
      contents: read
    outputs:
      enabled: ${{ steps.terrain.outputs.enabled }}
      maxzoom: ${{ steps.terrain.outputs.maxzoom }}
      dem_source: ${{ steps.terrain.outputs.dem_source }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # meranie musí byť v pracovnom priečinku – `hashFiles` inam nevidí
      - name: Priprav priečinok na meranie
        run: mkdir -p steps-out


      # tieňovanie a 3D: MapLibre nevie čítať výšky z GeoTIFFu, potrebuje
      # pyramídu PNG dlaždíc (terrarium). Model si vyberá vlastným inputom –
      # tieňovanie potrebuje celý región, vrstevnice stačia z výrezu.
      # Závisia len od územia, tak sa ukladajú do skladu `dem-terrain`.
      # Polygón kraja: bez neho by sa vrstva počítala na celom bboxe regiónu.
      - name: Stiahni polygón kraja
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: region-poly
          path: data

      - name: Cache výškových dlaždíc (restore)
        id: terrain-cache
        if: ${{ inputs.opt_terrain == 'true' && inputs.opt_terrain_rebuild != 'true' }}
        uses: ./.github/actions/cache-restore
        with:
          path: terrain-out
          key: ${{ needs.keys.outputs.terrain }}
          # hotové tieňovanie z predošlého behu – viď `opt_reuse_layers` hore
          restore-keys: ${{ inputs.opt_reuse_layers == 'true' && needs.keys.outputs.terrain_hotove || '' }}

      # jednorazová migrácia: kľúč mal otlačok skladu pred bboxom, takže sa naň
      # nová predpona netrafí. Dá sa zmazať, keď cache prejde obrátkou (30 dní).
      - name: Cache výškových dlaždíc – starý kľúč (restore)
        id: terrain-cache-stary
        if: ${{ inputs.opt_terrain == 'true' && inputs.opt_terrain_rebuild != 'true' && steps.terrain-cache.outputs.cache-hit != 'true' && steps.terrain-cache.outputs.cache-matched-key == '' }}
        uses: ./.github/actions/cache-restore
        with:
          path: terrain-out
          key: ${{ needs.keys.outputs.terrain_stary }}

      - name: Je tieňovanie hotové?
        id: hotove
        env:
          VRSTVA: Tieňovanie
          HIT: ${{ steps.terrain-cache.outputs.cache-hit }}
          MATCHED: ${{ steps.terrain-cache.outputs.cache-matched-key }}
          HIT_STARY: ${{ steps.terrain-cache-stary.outputs.cache-hit }}
        run: workers/plan/hotova-vrstva.sh

      # až za rozhodnutím a len keď sa počíta: model je gigabajty a hotové
      # dlaždice z neho nepotrebujú nič
      - name: Cache DEM dlaždíc (restore)
        id: demtiles-cache
        if: ${{ inputs.opt_terrain == 'true' && steps.hotove.outputs.pocitaj == 'true' }}
        uses: ./.github/actions/cache-restore
        with:
          path: dem
          key: ${{ needs.keys.outputs.demtiles_terrain }}

      - name: Tieňovanie reliéfu (PNG dlaždice z vybraného DEM)
        id: terrain
        if: ${{ inputs.opt_terrain == 'true' }}
        env:
          REGION_KEY: ${{ inputs.region_key }}
          DEM_BBOX: ${{ inputs.dem_bbox }}
          SHADING_SOURCE: ${{ inputs.opt_shading_source }}
          TERRAIN_MAXZOOM: ${{ inputs.opt_terrain_maxzoom }}
          TERRAIN_REBUILD: ${{ inputs.opt_terrain_rebuild }}
          # rozpočet na tieňovanie sa rieši pri počítaní dlaždíc, nie až
          # v kontrole pred nasadením
          SIZE_LIMIT_MB: ${{ inputs.opt_size_limit_mb }}
          GH_TOKEN: ${{ github.token }}
          OPT_UGKK_FALLBACK: ${{ inputs.opt_ugkk_fallback }}
        run: workers/terrain/build.sh
      # uloží sa len to, čo sa naozaj spočítalo (viď job s vrstevnicami)
      - name: Cache výškových dlaždíc (save)
        if: ${{ always() && inputs.opt_terrain == 'true' && steps.terrain.outputs.fell_back != 'true' && steps.hotove.outputs.pocitaj == 'true' && hashFiles('terrain-out/**') != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: terrain-out
          key: ${{ needs.keys.outputs.terrain }}

      # tieňovanie má vlastný zdroj a tým aj vlastný kľúč – bez tohto kroku by
      # sa jeho restore nikdy netrafil
      - name: Cache DEM dlaždíc (save)
        if: ${{ always() && steps.demtiles-cache.outputs.cache-hit != 'true' && hashFiles('dem/**') != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: dem
          key: ${{ needs.keys.outputs.demtiles_terrain }}

      # každý job vyrobí svoj kus `_site`; compression-level 0, obsah je
      # už komprimovaný
      - name: Odlož časť stránky
        if: ${{ always() && hashFiles('_site/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: site-terrain
          path: _site
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore

      - name: Odlož meranie krokov
        if: ${{ always() && hashFiles('steps-out/*') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: steps-terrain
          path: steps-out
          retention-days: 1
          if-no-files-found: ignore

  # `needs` na volanom workflowe hovorí len o celku – volajúci by nevedel, či
  # spadli vrstevnice, alebo tieňovanie. Job teda nerobí nič, len vydá výsledky.
  # Zberný job, nie `jobs.<id>.result` vo výstupoch: actionlint to nepozná.
  # `always()`, inak by sa pri spadnutej vrstve preskočil.
  vysledky:
    name: Výsledky vrstiev
    needs: [contours, rocks, terrain, shading-rocks]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    outputs:
      contours: ${{ needs.contours.result }}
      rocks: ${{ needs.rocks.result }}
      terrain: ${{ needs.terrain.result }}
      shading_rocks: ${{ needs.shading-rocks.result }}
    steps:
      - name: Ako dopadli vrstvy
        run: |
          set -uo pipefail
          echo "vrstevnice=${{ needs.contours.result }}, skaly=${{ needs.rocks.result }}, tieňovanie=${{ needs.terrain.result }}, skaly z tieňovania=${{ needs.shading-rocks.result }}"
