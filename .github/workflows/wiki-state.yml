name: Map · Wiki state

# “Build wiki” over every region of a country, a relay like “Build map state”.
# Weekly, so packages carry new and edited articles.

on:
  schedule:
    # Saturday 02:40 UTC, the day before cleanup
    - cron: "40 2 * * 6"
  workflow_dispatch:
    inputs:
      # the list is workers/data/regions.json
      country:
        description: "Country – articles are built in every region of it"
        required: true
        default: slovensko
        type: choice
        options:
          - slovensko
      rebuild:
        description: "Download articles anew (skips the Drive cache)"
        required: false
        default: false
        type: boolean
      continuation:
        description: "Leave empty – the relay baton, the batch passes it itself"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: write

# no `concurrency`, or GitHub cancels the middle leg of the relay

jobs:
  relay:
    name: Relay leg
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Wait for the region, start the next and hand over the relay
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          # a schedule has no form, hence defaults
          COUNTRY: ${{ inputs.country || 'slovensko' }}
          REBUILD: ${{ inputs.rebuild || false }}
          CONTINUATION: ${{ inputs.continuation }}
        run: workers/state/wiki.sh
