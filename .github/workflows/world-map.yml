name: Mapa · Build svet

# Základná mapa celého sveta – vodstvo, hranice štátov a regióny, na aké kusy
# je OSM rozdelené na sťahovanie. Publikuje sa na Drive do `<koreň>/svet/`
# (resp. `svet_basic/`) a zapisuje do `maps.json` ako vlastný uzol.
#
# Dve podoby, dve mená, dva uzly (input `variant`): `basic` nesmie sadnúť na
# `svet.zip` – meno je sľub o rozsahu. Čo je v ktorej, hovorí
# `workers/data/world-variants.json`.
#
# Vlastná pipeline preto, že berie iné dáta (pobrežné čiary, Natural Earth,
# index Geofabriku – viď `workers/world/sources.py`), má inú životnosť
# a iný výstup: nejde na Pages a nie sú v nej cesty, sídla ani terén.
# Balík aj katalóg robí ďalej `workers/deploy/publish-map.py`.

on:
  workflow_dispatch:
    inputs:
      # `plna` je doterajšia mapa, `basic` len hranice štátov a regióny
      # sťahovania – vodstvo je to drahé (rastie ~3× na zoom).
      # Podoby sú v `workers/data/world-variants.json`; `choice` GitHub zo
      # súboru prečítať nevie, tak sa zoznam píše aj sem a lint to porovná.
      variant:
        description: "Podoba mapy (basic = iba hranice štátov a regiónov, do 15 MB)"
        required: false
        default: "plna"
        type: choice
        options:
          - "plna"
          - "basic"
      maxzoom:
        description: "Do akého zoomu dlaždice (svet je podklad, nie mapa na chodenie)"
        required: false
        default: "6"
        type: choice
        options:
          - "4"
          - "5"
          - "6"
          - "7"
          - "8"
      limit_mb:
        description: "Nad koľko MB dlaždíc varovať (auto = podľa podoby: plná 250, basic 15)"
        required: false
        default: "auto"
        type: string
      rebuild:
        description: "Stiahnuť podklady odznova (obíde cache na Drive)"
        required: false
        default: false
        type: boolean
      publish:
        description: "Nahrať na Drive a zapísať do maps.json"
        required: false
        default: true
        type: boolean
      # ten istý balík ešte raz ako `.aar`; robí to job na macOS (nástroj `aa`)
      apple_archive:
        description: "Nahrať balík aj ako .aar (Apple Archive, job na macOS)"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

env:
      # prihlásenie na Drive stojí pri celom workflowe ako v Build map
  GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
  DRIVE_CLIENT: ${{ vars.DRIVE_CLIENT }}
  DRIVE_SECRET: ${{ secrets.DRIVE_SECRET }}
  DRIVE_REFRESH: ${{ secrets.DRIVE_REFRESH }}
      # ten istý balík glyfov, aký sťahuje Build map
  GLYPHS_ZIP: https://github.com/openmaptiles/fonts/releases/download/v2.0/noto-sans.zip

jobs:
  world:
    name: Mapa sveta
    runs-on: ubuntu-latest
      # katalóg `maps.json` je súbor v repozitári a dopisuje ho beh
    permissions:
      contents: write
    outputs:
      maxzoom: ${{ steps.build.outputs.maxzoom }}
      size_mb: ${{ steps.build.outputs.size_mb }}
      published: ${{ steps.publish.outcome }}
      # kľúč regiónu a vrstvy vypadnú z podoby, takže ich pozná až build.
      # Idú výstupom aj do jobu s `.aar`, ktorý položku katalógu prepisuje navrch.
      region_key: ${{ steps.build.outputs.region_key }}
      map_layers: ${{ steps.build.outputs.map_layers }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Planetiler je preložený pre Javu 21, runner má predvolene 17 – bez
      # tohto kroku spadne `UnsupportedClassVersionError` až za sťahovaním
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # v cache je len surové stiahnuté (~95 MB), prevod sa robí zakaždým.
      # Bez `restore-keys`: v kľúči je týždeň, takže sa raz za týždeň stiahne
      # čerstvé, a predpona by tú čerstvosť ticho zrušila. V kľúči je aj podoba –
      # `basic` sťahuje tri podklady z piatich a existujúci kľúč sa neprepisuje,
      # takže by neúplný záznam zablokoval plnú mapu na celý týždeň.
      - name: Kľúč podkladov
        id: key
        env:
          HASH: ${{ hashFiles('workers/world/sources.py') }}
          VARIANT: ${{ inputs.variant }}
        run: |
          set -euo pipefail
          echo "key=world-src-v1-${VARIANT:-plna}-${HASH:0:12}-$(date -u +%G-W%V)" \
            >> "$GITHUB_OUTPUT"

      - name: Cache podkladov (restore)
        if: ${{ !inputs.rebuild }}
        uses: ./.github/actions/cache-restore
        with:
          path: data/world/zdroje
          key: ${{ steps.key.outputs.key }}

      - name: Postav mapu sveta
        id: build
        env:
          OPT_VARIANT: ${{ inputs.variant }}
          OPT_MAXZOOM: ${{ inputs.maxzoom }}
          OPT_LIMIT_MB: ${{ inputs.limit_mb }}
        run: workers/world/build.sh

      # ukladá sa hneď, ako sa stiahne, nie v post-kroku
      - name: Cache podkladov (save)
        if: ${{ always() && hashFiles('data/world/zdroje/*') != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: data/world/zdroje
          key: ${{ steps.key.outputs.key }}

      # balí a do katalógu zapisuje ten istý skript ako pri mape kraja;
      # balíky vrstiev tu nevzniknú, svet ich nemá
      - name: Publikuj mapu sveta na Drive a zapíš do maps.json
        id: publish
        if: ${{ inputs.publish }}
        env:
          AREA_KEY: cely
          TEST_KM2: "0"
          TILES_MAXZOOM: ${{ steps.build.outputs.maxzoom }}
          REGION_KEY: ${{ steps.build.outputs.region_key }}
          MAP_LAYERS: ${{ steps.build.outputs.map_layers }}
        run: |
          set -euo pipefail
          python3 workers/deploy/publish-map.py --site=_site --maps=maps.json \
            --summary="$GITHUB_STEP_SUMMARY"

      # ten istý skript, akým katalóg commituje Build map – vrátane rebasu
      - name: Commitni maps.json
        if: ${{ inputs.publish && steps.publish.outcome == 'success' }}
        env:
          MAPS_JSON: ${{ steps.publish.outputs.maps_file || 'maps.json' }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: workers/deploy/catalog.sh

      # aby si `.aar` mohol vyrobiť job na macOS, musí sa k nemu mapa dostať.
      # Deň retencie: je to prepravka medzi jobmi, nie uložený výsledok.
      - name: Odlož mapu pre Apple Archive
        if: ${{ always() && hashFiles('_site/tiles/manifest.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: svet-site
          path: _site
          retention-days: 1
          compression-level: 0

      - name: Súhrn
        if: ${{ always() }}
        env:
          MAXZOOM: ${{ steps.build.outputs.maxzoom }}
          SIZE_MB: ${{ steps.build.outputs.size_mb }}
          NAME: ${{ steps.build.outputs.name }}
          VARIANT: ${{ inputs.variant }}
          LAYERS: ${{ steps.build.outputs.map_layers }}
        run: |
          set -uo pipefail
          {
            echo "## Mapa sveta"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| mapa | ${NAME:-svet} |"
            echo "| podoba | ${VARIANT:-plna} |"
            echo "| vrstvy | ${LAYERS:-?} |"
            echo "| maxzoom | ${MAXZOOM:-?} |"
            echo "| dlaždice | ${SIZE_MB:-?} MB |"
            echo
            echo "Hranice štátov sú z Natural Earth a regióny sťahovania"
            echo "z indexu Geofabriku; v plnej podobe k tomu vodstvo"
            echo "z pobrežných čiar OpenStreetMap a jazerá z Natural Earth."
            echo "Cesty, sídla ani terén v tejto mape nie sú – je to podklad"
            echo "pod výber, ktorý kus mapy si stiahnuť."
          } >> "$GITHUB_STEP_SUMMARY"

  # ten istý balík ešte raz ako `.aar`; vlastný job na macOS (nástroj `aa`).
  # Beží až po nahratí ZIPu a commite katalógu – `publish-map.py` si pri `.aar`
  # číta `maps.json` z vetvy a k tomu, čo tam je, sa pridá.
  # Keď spadne, mapa tým netrpí.
  apple-archive:
    name: Balík ako Apple Archive (.aar)
    needs: world
    if: ${{ !cancelled() && needs.world.outputs.published == 'success' && inputs.apple_archive }}
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Stiahni mapu z predošlého jobu
        uses: actions/download-artifact@v8
        with:
          name: svet-site
          path: _site
      - name: Zabaľ a nahraj .aar na Drive
        id: publish
        env:
          AREA_KEY: cely
          TEST_KM2: "0"
          TILES_MAXZOOM: ${{ needs.world.outputs.maxzoom }}
          # to isté, čo dostal ZIP – z výstupu prvého jobu
          REGION_KEY: ${{ needs.world.outputs.region_key }}
          MAP_LAYERS: ${{ needs.world.outputs.map_layers }}
          # z ktorej vetvy si vypýtať čerstvý `maps.json`
          BRANCH: ${{ github.ref_name }}
        run: workers/deploy/apple-archive.sh
      - name: Commitni maps.json
        if: ${{ steps.publish.outcome == 'success' }}
        env:
          MAPS_JSON: ${{ steps.publish.outputs.maps_file || 'maps.json' }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: workers/deploy/catalog.sh
