name: Map · Build world

# Basic world map – water, state borders and the regions OSM is split into for download.
# Published to Drive under `<root>/svet/` (or `svet_basic/`) as its own `maps.json` node.
# `basic` must never overwrite `svet.zip`: the name promises the extent.

on:
  workflow_dispatch:
    inputs:
      # variants live in `workers/data/world-variants.json`; `choice` can't read a file
      variant:
        description: "Map variant (basic = only state and region borders, up to 15 MB)"
        required: false
        default: "full"
        type: choice
        options:
          - "full"
          - "basic"
      maxzoom:
        description: "Tiles up to which zoom (the world is a base, not a map to walk)"
        required: false
        default: "6"
        type: choice
        options:
          - "4"
          - "5"
          - "6"
          - "7"
          - "8"
      limit_mb:
        description: "Warn above this many MB of tiles (auto = by variant: full 250, basic 15)"
        required: false
        default: "auto"
        type: string
      rebuild:
        description: "Download the sources again (bypasses the Drive cache)"
        required: false
        default: false
        type: boolean
      publish:
        description: "Upload to Drive and write to maps.json"
        required: false
        default: true
        type: boolean
      apple_archive:
        description: "Also upload the package as .aar (Apple Archive, macOS job)"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

env:
  GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
  DRIVE_CLIENT: ${{ vars.DRIVE_CLIENT }}
  DRIVE_SECRET: ${{ secrets.DRIVE_SECRET }}
  DRIVE_REFRESH: ${{ secrets.DRIVE_REFRESH }}
  GLYPHS_ZIP: https://github.com/openmaptiles/fonts/releases/download/v2.0/noto-sans.zip

jobs:
  world:
    name: World map
    runs-on: ubuntu-latest
    # the run commits `maps.json`
    permissions:
      contents: write
    outputs:
      maxzoom: ${{ steps.build.outputs.maxzoom }}
      size_mb: ${{ steps.build.outputs.size_mb }}
      published: ${{ steps.publish.outcome }}
      # known only after the build; the `.aar` job needs them too
      region_key: ${{ steps.build.outputs.region_key }}
      map_layers: ${{ steps.build.outputs.map_layers }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Planetiler needs Java 21, the runner defaults to 17
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # weekly key without `restore-keys`; the variant is in it, `basic` caches only three sources
      - name: Sources key
        id: key
        env:
          HASH: ${{ hashFiles('workers/world/sources.py') }}
          VARIANT: ${{ inputs.variant }}
        run: |
          set -euo pipefail
          echo "key=world-src-v1-${VARIANT:-full}-${HASH:0:12}-$(date -u +%G-W%V)" \
            >> "$GITHUB_OUTPUT"

      - name: Sources cache (restore)
        if: ${{ !inputs.rebuild }}
        uses: ./.github/actions/cache-restore
        with:
          path: data/world/sources
          key: ${{ steps.key.outputs.key }}

      - name: Build the world map
        id: build
        env:
          OPT_VARIANT: ${{ inputs.variant }}
          OPT_MAXZOOM: ${{ inputs.maxzoom }}
          OPT_LIMIT_MB: ${{ inputs.limit_mb }}
        run: workers/world/build.sh

      - name: Sources cache (save)
        if: ${{ always() && hashFiles('data/world/sources/*') != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: data/world/sources
          key: ${{ steps.key.outputs.key }}

      - name: Publish the world map to Drive and write maps.json
        id: publish
        if: ${{ inputs.publish }}
        env:
          AREA_KEY: whole
          TEST_KM2: "0"
          TILES_MAXZOOM: ${{ steps.build.outputs.maxzoom }}
          REGION_KEY: ${{ steps.build.outputs.region_key }}
          MAP_LAYERS: ${{ steps.build.outputs.map_layers }}
        run: |
          set -euo pipefail
          python3 workers/deploy/publish-map.py --site=_site --maps=maps.json \
            --summary="$GITHUB_STEP_SUMMARY"

      - name: Commit maps.json
        if: ${{ inputs.publish && steps.publish.outcome == 'success' }}
        env:
          MAPS_JSON: ${{ steps.publish.outputs.maps_file || 'maps.json' }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: workers/deploy/catalog.sh

      # a one-day hand-over to the macOS job
      - name: Keep the map for Apple Archive
        if: ${{ always() && hashFiles('_site/tiles/manifest.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: world-site
          path: _site
          retention-days: 1
          compression-level: 0

      - name: Summary
        if: ${{ always() }}
        env:
          MAXZOOM: ${{ steps.build.outputs.maxzoom }}
          SIZE_MB: ${{ steps.build.outputs.size_mb }}
          NAME: ${{ steps.build.outputs.name }}
          VARIANT: ${{ inputs.variant }}
          LAYERS: ${{ steps.build.outputs.map_layers }}
        run: |
          set -uo pipefail
          {
            echo "## World map"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| map | ${NAME:-world} |"
            echo "| variant | ${VARIANT:-full} |"
            echo "| layers | ${LAYERS:-?} |"
            echo "| maxzoom | ${MAXZOOM:-?} |"
            echo "| tiles | ${SIZE_MB:-?} MB |"
            echo
            echo "State borders are from Natural Earth and download regions"
            echo "from the Geofabrik index; the full variant adds water from"
            echo "OpenStreetMap coastlines and lakes from Natural Earth."
            echo "No roads, settlements or terrain – it is a base for picking"
            echo "which piece of map to download."
          } >> "$GITHUB_STEP_SUMMARY"

  # the same package as `.aar`, after the ZIP and the catalog commit; its failure spares the map
  apple-archive:
    name: Package as Apple Archive (.aar)
    needs: world
    if: ${{ !cancelled() && needs.world.outputs.published == 'success' && inputs.apple_archive }}
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download the map from the previous job
        uses: actions/download-artifact@v8
        with:
          name: world-site
          path: _site
      - name: Pack and upload the .aar to Drive
        id: publish
        env:
          AREA_KEY: whole
          TEST_KM2: "0"
          TILES_MAXZOOM: ${{ needs.world.outputs.maxzoom }}
          REGION_KEY: ${{ needs.world.outputs.region_key }}
          MAP_LAYERS: ${{ needs.world.outputs.map_layers }}
          # the branch to fetch a fresh `maps.json` from
          BRANCH: ${{ github.ref_name }}
        run: workers/deploy/apple-archive.sh
      - name: Commit maps.json
        if: ${{ steps.publish.outcome == 'success' }}
        env:
          MAPS_JSON: ${{ steps.publish.outputs.maps_file || 'maps.json' }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: workers/deploy/catalog.sh
