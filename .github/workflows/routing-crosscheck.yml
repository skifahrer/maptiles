name: Routing · cross-check

# AN OUTSIDE OPINION ON THE PHONE'S ENGINE. From the same region PBF both the
# app archive (`<region>-routing.pmtiles`) and a Valhalla graph are built, and
# Valhalla answers random junction pairs by car and on foot. `RoutingCrossCheckTests`
# in `rikimaps` takes the artifact with the answers and the archive and compares
# its engine's distance and time with them (`.planning/navigation.md` R17). Our two
# engines (exact and CCH) are otherwise compared only with each other – this is
# the one place a third party holds them.
#
# The output goes to the `results` Drive store (`publish-results.sh`); the run
# artifact is only for downloading that day.

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Region key from `workers/data/regions.json`"
        required: false
        default: "bratislavsky"
        type: string
      pairs:
        description: "How many junction pairs"
        required: false
        default: "200"
        type: string
      seed:
        description: "Seed of the random pairs – the same seed, the same pairs"
        required: false
        default: "1"
        type: string
      valhalla_image:
        description: "Valhalla Docker image"
        required: false
        default: "ghcr.io/valhalla/valhalla-scripted:latest"
        type: string

env:
  GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
  DRIVE_CLIENT: ${{ vars.DRIVE_CLIENT }}
  DRIVE_SECRET: ${{ secrets.DRIVE_SECRET }}
  DRIVE_REFRESH: ${{ secrets.DRIVE_REFRESH }}
  OSMFR_BASE: https://download.openstreetmap.fr/extracts

jobs:
  crosscheck:
    name: Archive, Valhalla graph and answers
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Prepare the folders
        run: mkdir -p steps-out data

      # the same region cut as the map – another PBF would be another truth about the area
      - name: Region PBF
        id: region
        env:
          REGION: ${{ inputs.region }}
          AREA_IN: ""
          OPT_AREA_BBOX: ""
          OPT_CROP_BBOX: ""
          OPT_CUSTOM_BBOX: ""
          OPT_CUSTOM_NAME: ""
          OPT_CUSTOM_PBF_URL: ""
          OPT_TEST_AT: ""
          OPT_TEST_KM2: ""
        run: workers/plan/pbf.sh

      # the app archive from the same PBF; without heights, the check doesn't compare them
      - name: Routing network → PMTiles
        id: routing
        env:
          REGION_KEY: ${{ steps.region.outputs.key }}
          REGION_NAME: ${{ steps.region.outputs.name }}
          ROUTING_COUNTRY: ${{ steps.region.outputs.iso }}
          SIZE_LIMIT_MB: "900"
          BUDGET_ROUTING_PCT: "3"
        run: workers/routing/build.sh

      - name: Valhalla graph
        id: graph
        env:
          REGION_KEY: ${{ steps.region.outputs.key }}
          ROUTING_PBF: data/region.osm.pbf
          VALHALLA_IMAGE: ${{ inputs.valhalla_image }}
        run: workers/routing/graph.sh

      # `use_tiles_ignore_pbf`: serves the finished tar from the previous step, builds nothing
      - name: Start Valhalla over the graph
        env:
          VALHALLA_IMAGE: ${{ inputs.valhalla_image }}
        run: |
          set -euo pipefail
          docker run -d --name valhalla -p 8002:8002 \
            -e use_tiles_ignore_pbf=True -e serve_tiles=True \
            -e tileset_name=valhalla_tiles \
            -v "$PWD/custom_files:/custom_files" "$VALHALLA_IMAGE"

      - name: Valhalla's answers to random pairs
        env:
          REGION_KEY: ${{ steps.region.outputs.key }}
          PAIRS: ${{ inputs.pairs }}
          SEED: ${{ inputs.seed }}
          VALHALLA_VER: ${{ steps.graph.outputs.valhalla }}
        run: |
          set -euo pipefail
          mkdir -p out
          cp "_site/tiles/${REGION_KEY}-routing.pmtiles" out/
          python3 workers/routing/crosscheck.py \
            --pbf=data/routing.osm.pbf \
            --region-key="$REGION_KEY" \
            --n="$PAIRS" --seed="$SEED" \
            --valhalla-version="$VALHALLA_VER" \
            --out="out/crosscheck-${REGION_KEY}.json"
          docker logs valhalla 2>&1 | tail -20 || true
          docker rm -f valhalla || true
          {
            echo "## Cross-check · $REGION_KEY"
            echo
            python3 - "out/crosscheck-${REGION_KEY}.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          print(f"* Valhalla: `{d['valhalla']}`, seed {d['seed']}")
          print(f"* pairs: {d['count']}, no route: car {d['no_route']['car']}, foot {d['no_route']['foot']}")
          PY
            echo
            echo "The answers and the archive are in the \`results\` Drive store and,"
            echo "today, in the \`crosscheck-$REGION_KEY\` artifact; the comparison is"
            echo "\`RoutingCrossCheckTests\` in \`rikimaps\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Store the answers and the archive
        continue-on-error: true
        env:
          NAME: crosscheck-${{ steps.region.outputs.key }}-s${{ inputs.seed }}
          PATHS: out
          NOTE: Valhalla's answers to random pairs and the region archive they come from
        run: workers/deploy/publish-results.sh

      - name: Upload the answers and the archive
        uses: actions/upload-artifact@v7
        with:
          name: crosscheck-${{ steps.region.outputs.key }}
          path: out
          retention-days: 1

      - name: Upload the step timing
        if: ${{ always() && hashFiles('steps-out/*') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: steps-routing-crosscheck
          path: steps-out
          retention-days: 1
          if-no-files-found: ignore
