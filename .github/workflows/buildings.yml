name: Map · settlements

# settlements from OSM into their own `.pmtiles`: buildings with area and name,
# settlement names – the `settlements` package. Its own file, as `build-map-region.yml` is near its cap.
on:
  workflow_call:
    inputs:
      region_key:
        description: "Region key – it names `{region}-buildings.pmtiles`"
        required: true
        type: string
      region_bbox:
        description: "Region bbox for clipping tiles (workers/lib/region-clip.sh)"
        required: true
        type: string
      maxzoom:
        description: "Highest zoom of the settlement tiles"
        required: false
        default: "14"
        type: string
      region_clip:
        description: "Clip tiles to the region border"
        required: false
        default: "false"
        type: string
      size_limit_mb:
        description: "The whole page budget in MB"
        required: false
        default: "900"
        type: string
      budget_pct:
        description: "The settlements' share of the page budget in percent"
        required: false
        default: "6"
        type: string
      day:
        description: "Date for the Planetiler cache key"
        required: false
        default: ""
        type: string
    outputs:
      enabled:
        description: "Was the layer made? (a cutout may hold no building)"
        value: ${{ jobs.buildings.outputs.enabled }}
      maxzoom:
        description: "The zoom tiles really go up to"
        value: ${{ jobs.buildings.outputs.maxzoom }}
      size_mb:
        description: "Layer size in MB"
        value: ${{ jobs.buildings.outputs.size_mb }}
    # `workflow_call` doesn't inherit secrets – without them there's no Drive cache
    secrets:
      GDRIVE_CREDENTIALS:
        required: false
      DRIVE_SECRET:
        required: false
      DRIVE_REFRESH:
        required: false

# Drive sign-in for the whole workflow; the cache has two steps
env:
  GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
  DRIVE_CLIENT: ${{ vars.DRIVE_CLIENT }}
  DRIVE_SECRET: ${{ secrets.DRIVE_SECRET }}
  DRIVE_REFRESH: ${{ secrets.DRIVE_REFRESH }}

jobs:
  buildings:
    name: Settlements
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.buildings.outputs.enabled }}
      maxzoom: ${{ steps.buildings.outputs.maxzoom }}
      size_mb: ${{ steps.buildings.outputs.size_mb }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Prepare the timing folder
        run: mkdir -p steps-out

      - name: Download the PBF from the plan
        uses: actions/download-artifact@v8
        with:
          name: pbf
          path: data

      # without the polygon tiles follow the bbox
      - name: Download the region polygon
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: region-poly
          path: data

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Planetileru (restore)
        id: planetiler-cache
        uses: ./.github/actions/cache-restore
        with:
          path: planetiler.jar
          key: planetiler-latest-${{ inputs.day }}

      - name: Stiahni Planetiler
        run: workers/lib/planetiler.sh
      - name: Cache Planetileru (save)
        if: ${{ always() && steps.planetiler-cache.outputs.cache-hit != 'true' && hashFiles('planetiler.jar') != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: planetiler.jar
          key: ${{ steps.planetiler-cache.outputs.cache-primary-key }}

      - name: Settlement schema tests
        run: java -jar planetiler.jar verify workers/buildings/buildings.yml

      - name: Settlements from OSM → PMTiles
        id: buildings
        env:
          OPT_BUILDINGS_MAXZOOM: ${{ inputs.maxzoom }}
          OPT_REGION_CLIP: ${{ inputs.region_clip }}
          REGION_BBOX: ${{ inputs.region_bbox }}
          REGION_KEY: ${{ inputs.region_key }}
          SIZE_LIMIT_MB: ${{ inputs.size_limit_mb }}
          BUDGET_BUILDINGS_PCT: ${{ inputs.budget_pct }}
        run: workers/buildings/build.sh

      - name: Upload the site part
        if: ${{ always() && hashFiles('_site/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: site-buildings
          path: _site
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore

      - name: Upload the step timing
        if: ${{ always() && hashFiles('steps-out/*') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: steps-buildings
          path: steps-out
          retention-days: 1
          if-no-files-found: ignore
