name: Mapa · Pregeneruj vrstvu kraja

# JEDNA VRSTVA JEDNÉHO KRAJA NANOVO – bez toho, aby sa prestavala mapa.
#
# Build kraja („Mapa · Build map region") postaví VŠETKO: dlaždice, vrstevnice,
# skaly, tieňovanie, trasy, prvky, hľadanie aj navigáciu. Trvá to hodiny a je
# to správne vtedy, keď sa mapa naozaj celá mení. Lenže veľká časť zmien sa
# týka JEDNEJ vrstvy – pribudne trieda do `workers/features/points.yml`, opraví
# sa schéma obmedzení, dvihne sa verzia Valhally – a prestavať kvôli tomu celú
# mapu znamená zaplatiť hodiny za pár minút práce a pri tom prepísať na Drive
# aj balíky, na ktorých sa nič nezmenilo.
#
# Tento workflow postaví LEN TÚ VRSTVU a na Drive prepíše LEN JEJ BALÍK:
#
#     co: body        `{kraj}-body.zip`             body z OSM (points.yml)
#     co: linie       `{kraj}-linie.zip`            CELÁ dopravná sieť (cesty,
#                                                   trate, trajekty, lanovky),
#                                                   trasy, obmedzenia na ceste
#     co: navigacia   `{kraj}-navigacia.zip`        graf Valhally pre tento kraj
#     co: vrstevnice  `{kraj}-vrstevnice-skaly.zip` izolínie z modelu terénu
#     co: skaly       `{kraj}-vrstevnice-skaly.zip` plochy zo sklonu modelu
#     co: tienovanie  `{kraj}-tienovanie.zip`       výškové dlaždice
#
# ── DVE CENY, JEDNA CESTA ─────────────────────────────────────────────────
# `body` a `linie` sa počítajú z toho istého OSM PBF ako mapa a nič iné
# nepotrebujú – stačí im príprava (`workers/plan/pbf.sh`) a vlastný Planetiler
# (resp. Docker s Valhallou). Sú to MINÚTY.
#
# `linie` sú pritom TRI KUSY NARAZ (dopravná sieť, značené trasy a obmedzenia
# na ceste), lebo je to jeden balík a `--only` prepisuje balík CELÝ: jedna nová
# vrstva a dve chýbajúce by z neho spravili balík, ktorý sľubuje, čo nenesie.
#
# `navigacia` je NAOPAK VLASTNÁ VOĽBA, lebo je vlastný balík – graf kraja váži
# 170 až 190 MB proti desiatkam za tie tri kreslené vrstvy (rozpis v hlavičke
# `workers/deploy/subory.py`). Je to zároveň jediné, čo sa mení pri zdvihnutí
# verzie Valhally, a prestavovať kvôli tomu dopravnú sieť by bolo zbytočné.
#
# `vrstevnice`, `skaly` a `tienovanie` potrebujú sklad výškového modelu,
# prípadne ho doplniť, prečítať a nad ním trasovať – desiatky minút až hodiny.
# Robí to `dem-layers.yml`, teda TEN ISTÝ workflow, aký nad nimi púšťa build
# mapy: jedenásť jobov od kontroly skladu po hotové `.pmtiles`. Druhá kópia
# by bola druhá pravda o tom, ako vrstevnica vzniká, a rozišla by sa presne
# tam, kde to nikto nevidí – v kľúči cache alebo v tom, ktorý model sa doplní.
#
# Proti celému buildu kraja sa aj tak ušetrí všetko ostatné: mapové dlaždice
# (Planetiler nad celým PBF), ikonky a fonty, štýl, kontrola webu, Pages
# a hlavne prepísanie OSTATNÝCH balíkov na Drive.
#
# ── VRSTEVNICE A SKALY SÚ JEDEN BALÍK ─────────────────────────────────────
# `-vrstevnice-skaly.zip` nesie obe vrstvy, takže sa pri oboch voľbách
# počítajú OBE – len tá, ktorá sa nepregeneruje, príde z cache (sekundy).
# Balík sa prepisuje celý a polovica nová s polovicou chýbajúcou by bola
# balík, ktorý sľubuje vrstvu, ktorú nenesie.
#
# ── ČO SA NA DRIVE STANE (a čo nie) ───────────────────────────────────────
# Balí a do katalógu zapisuje ten istý skript ako build mapy
# (`workers/deploy/publish-map.py`), len s `--only=<balík>`. Vtedy sa:
#   * nahrá JEDEN balík a starý súbor toho mena sa prepíše (mená sú stále),
#   * položka v `maps.json` sa DOPLNÍ, nie prepíše – ostatné balíky, bbox,
#     zoomy ani zdroje výšok tento beh nepozná a nesmie ich prepísať,
#   * balíky, ktoré tento beh nevyrobil, sa NEMAŽÚ. To je celý rozdiel oproti
#     buildu mapy: tam „vrstva v builde nie je" znamená „nemá tam čo robiť",
#     tu znamená len „o tejto vrstve tento beh nič nevie".
# Je to tá istá cesta, akou publikuje „Mapa · Build wiki" – jeden packer
# a jeden zápis do katalógu pre všetky pipeline (pravidlo 1 v CLAUDE.md).
#
# NA PAGES NEJDE NIČ. Stránka je celá mapa a tento beh má v `_site` jednu
# vrstvu; nahrať to na Pages by znamenalo mapu zmazať.
#
# `.aar` SA MUSÍ PREROBIŤ TIEŽ, a preto je tu druhý job. Balíky majú stále
# mená a na Drive ležia obe podoby vedľa seba – keby sa prepísal len ZIP,
# ostal by pri ňom `.aar` z predošlého behu, katalóg by ponúkal oba a kto by
# si stiahol ten druhý, dostal by starú vrstvu. Nie chýbajúcu: STARÚ, a na
# ničom by to nebolo vidieť.
#
# CELÚ KRAJINU NARAZ spustí „Mapa · Regenerate state" (regenerate-state.yml) –
# tá istá štafeta ako pri „Build map state", len nad krajom spúšťa toto.

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Kraj, ktorého vrstva sa pregeneruje"
        required: true
        default: bratislavsky
        type: choice
        options:
          - slovensko
          - bratislavsky
          - trnavsky
          - trenciansky
          - nitriansky
          - zilinsky
          - banskobystricky
          - presovsky
          - kosicky
      # Zoznam drží `workers/state/jobs.py` – tie isté kľúče, aké ponúka
      # dávka nad celou krajinou. Že sa tieto dva zoznamy nerozídu, stráži
      # `workers/lint/regenerate.py`: voľba, ktorá je v dávke a nie tu, by
      # znamenala, že dávka spustí beh s hodnotou, ktorú tento formulár
      # nepozná – a ten spadne hneď na vstupe, osemkrát za sebou.
      # `linie` sú TRI VRSTVY naraz (dopravná sieť, značené trasy, obmedzenia
      # na ceste), lebo sú jeden balík a `--only` ho prepisuje CELÝ.
      # `navigacia` je vlastná voľba, lebo je vlastný balík – rozpis v hlavičke.
      co:
        description: "Ktorá vrstva sa má pregenerovať"
        required: true
        default: body
        type: choice
        options:
          - body
          - cesty
          - hranice
          - vodstvo
          - navigacia
          - vrstevnice
          - skaly
          - tienovanie
      # Zdroje výšok a prah sklonu platia LEN pre vrstvy z výškového modelu.
      # Hodnoty aj predvoľby sú TIE ISTÉ ako vo formulári kraja – iná
      # predvoľba by znamenala vrstvu, ktorá vyjde inak než z buildu, a na
      # ničom by to nebolo vidieť. Stráži `workers/lint/regenerate.py`.
      contour_source:
        description: "Vrstevnice – z ktorého modelu terénu (ziadne = negenerovať)"
        required: false
        default: dmr5
        type: choice
        options:
          - sonny
          - sonny1
          - dmr35
          - dmr5
          - ziadne
      rock_source:
        description: "Skaly – zo sklonu modelu, alebo z tieňovania (ziadne = negenerovať)"
        required: false
        default: dmr5
        type: choice
        options:
          - sonny
          - sonny1
          - dmr35
          - dmr5
          - tienovanie
          - ziadne
      shading_source:
        description: "Tieňovanie a 3D terén – z ktorého modelu (ziadne = negenerovať)"
        required: false
        default: dmr5
        type: choice
        options:
          - sonny
          - sonny1
          - dmr35
          - dmr5
          - ziadne
      rock_slope:
        description: "Od akého sklonu (°) je terén skala (50 = steny, 40 = aj strmé svahy)"
        required: false
        default: "50"
        type: string
      test:
        description: "Rýchly test: len 4 km² zo stredu kraja (skúška pipeline)"
        required: false
        default: false
        type: boolean
      # Napr. `publish=false` (nič nenahrávať), `apple_archive=false`
      # (nerobiť `.aar`), `features_maxzoom=16`, `trails_maxzoom=15`.
      # Celý zoznam aj s predvolenými hodnotami je vo workers/plan/options.py
      # a neznámy kľúč je chyba, nie ticho ignorovaná hodnota. TEN ISTÝ súbor
      # ako pri builde mapy zámerne: `features_maxzoom` má jednu predvolenú
      # hodnotu a keby si ju táto pipeline držala vlastnú, pregenerovaná
      # vrstva by mala iný strop zoomu než tá z buildu – a v katalógu by pri
      # nej ostalo číslo z buildu, teda lož.
      options:
        description: "Zriedka menené nastavenia ako kľúč=hodnota (viď workers/plan/options.py)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

# ZÁMERNE BEZ `concurrency: pages`. Na Pages nejde nič a s buildom mapy si
# tento beh nekonkuruje o stránku – konkuruje si o BALÍK na Drive, a to je
# vec toho, kto ho spustí. Skupina `pages` by naopak znamenala, že
# pregenerovanie bodov čaká na trojhodinový build kraja.

env:
  # Prihlásenie na Drive pre celý workflow, nie po kroku: číta sa z neho cache
  # (Planetiler, PBF) a nahrávajú sa naň balíky. Keby token stál pri jednom
  # kroku, druhý by sa ticho vrátil k sťahovaniu všetkého odznova. Stráži to
  # „Kontrola · lint workflowov".
  GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
  DRIVE_CLIENT: ${{ vars.DRIVE_CLIENT }}
  DRIVE_SECRET: ${{ secrets.DRIVE_SECRET }}
  DRIVE_REFRESH: ${{ secrets.DRIVE_REFRESH }}
  OSMFR_BASE: https://download.openstreetmap.fr/extracts
  # PODIELY NA ROZPOČTE STRÁNKY. Tie isté čísla ako v `build-map-region.yml` –
  # `env:` workflowu sa nededí ani cez `workflow_call`, takže sa musia napísať
  # druhýkrát (tá istá cena, akú platí `roads.yml`, len tam sa podávajú
  # inputom). Že sa nerozídu, stráži `workers/lint/regenerate.py`: vrstva
  # pregenerovaná pod iným podielom by varovala inak než tá z buildu.
  BUDGET_TRAILS_PCT: "3"
  BUDGET_FEATURES_PCT: "4"
  BUDGET_TRANSPORT_PCT: "8"
  BUDGET_BOUNDARIES_PCT: "3"
  BUDGET_WATER_PCT: "5"
  # A to isté pre vrstvy z výškového modelu – `dem-layers.yml` ich dostáva
  # inputom, lebo `env` sa cez `workflow_call` nededí ani od jedného volajúceho.
  BUDGET_CONTOURS_PCT: "25"
  BUDGET_ROCKS_PCT: "12"
  BUDGET_TERRAIN_PCT: "12"

jobs:
  # ---------- príprava: región a PBF ----------
  # To isté, čo robí `plan` v builde mapy, len bez toho, čo tu netreba: bez
  # Pages, bez výrezu a bez výškového modelu. Skripty sú TIE ISTÉ – „ktorý
  # súbor je región" a „čo znamenajú voľby" sú jedna otázka a odpoveď na ňu má
  # jedno miesto (pravidlo 1).
  plan:
    name: Príprava (región, PBF)
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.region.outputs.key }}
      name: ${{ steps.region.outputs.name }}
      bbox: ${{ steps.region.outputs.bbox }}
      day: ${{ steps.day.outputs.d }}
      balik: ${{ steps.co.outputs.balik }}
      opt_test_km2: ${{ steps.opts.outputs.opt_test_km2 }}
      opt_publish: ${{ steps.opts.outputs.opt_publish }}
      opt_apple_archive: ${{ steps.opts.outputs.opt_apple_archive }}
      opt_region_clip: ${{ steps.opts.outputs.opt_region_clip }}
      opt_size_limit_mb: ${{ steps.opts.outputs.opt_size_limit_mb }}
      opt_trails_maxzoom: ${{ steps.opts.outputs.opt_trails_maxzoom }}
      opt_features_maxzoom: ${{ steps.opts.outputs.opt_features_maxzoom }}
      opt_transport_maxzoom: ${{ steps.opts.outputs.opt_transport_maxzoom }}
      opt_boundaries_maxzoom: ${{ steps.opts.outputs.opt_boundaries_maxzoom }}
      opt_water_maxzoom: ${{ steps.opts.outputs.opt_water_maxzoom }}
      opt_valhalla_image: ${{ steps.opts.outputs.opt_valhalla_image }}
      opt_custom_pbf_url: ${{ steps.opts.outputs.opt_custom_pbf_url }}
      opt_custom_name: ${{ steps.opts.outputs.opt_custom_name }}
      budget_transport_pct: ${{ env.BUDGET_TRANSPORT_PCT }}
      budget_boundaries_pct: ${{ env.BUDGET_BOUNDARIES_PCT }}
      budget_water_pct: ${{ env.BUDGET_WATER_PCT }}
      # ---------- pre vrstvy z výškového modelu (`dem-layers.yml`) ----------
      # Podiely rozpočtu idú cez výstup a nie z `env:` preto, že `env` sa vo
      # `with:` volaného workflowu čítať nesmie – to isté a z toho istého
      # dôvodu robí `budget_roads_pct` vyššie.
      budget_contours_pct: ${{ env.BUDGET_CONTOURS_PCT }}
      budget_rocks_pct: ${{ env.BUDGET_ROCKS_PCT }}
      budget_terrain_pct: ${{ env.BUDGET_TERRAIN_PCT }}
      dem_bbox: ${{ steps.region.outputs.dem_bbox }}
      dem_bboxkey: ${{ steps.region.outputs.dem_bboxkey }}
      area_key: ${{ steps.area.outputs.key }}
      area_name: ${{ steps.area.outputs.name }}
      area_bbox: ${{ steps.area.outputs.bbox }}
      area_km2: ${{ steps.area.outputs.km2 }}
      opt_contour_lines: ${{ steps.opts.outputs.opt_contour_lines }}
      opt_rocks: ${{ steps.opts.outputs.opt_rocks }}
      opt_terrain: ${{ steps.opts.outputs.opt_terrain }}
      opt_contour_source: ${{ steps.opts.outputs.opt_contour_source }}
      opt_rock_source: ${{ steps.opts.outputs.opt_rock_source }}
      opt_rock_dem: ${{ steps.opts.outputs.opt_rock_dem }}
      opt_shading_source: ${{ steps.opts.outputs.opt_shading_source }}
      opt_ugkk_fallback: ${{ steps.opts.outputs.opt_ugkk_fallback }}
      opt_ugkk_urls: ${{ steps.opts.outputs.opt_ugkk_urls }}
      opt_contour_interval: ${{ steps.opts.outputs.opt_contour_interval }}
      opt_contour_maxzoom: ${{ steps.opts.outputs.opt_contour_maxzoom }}
      opt_contour_smoothing: ${{ steps.opts.outputs.opt_contour_smoothing }}
      opt_rock_maxzoom: ${{ steps.opts.outputs.opt_rock_maxzoom }}
      opt_rock_res: ${{ steps.opts.outputs.opt_rock_res }}
      opt_rock_plne: ${{ steps.opts.outputs.opt_rock_plne }}
      opt_rock_zapln_diery: ${{ steps.opts.outputs.opt_rock_zapln_diery }}
      opt_rock_img_asset: ${{ steps.opts.outputs.opt_rock_img_asset }}
      opt_rock_img_zoom: ${{ steps.opts.outputs.opt_rock_img_zoom }}
      opt_rock_img_options: ${{ steps.opts.outputs.opt_rock_img_options }}
      opt_terrain_maxzoom: ${{ steps.opts.outputs.opt_terrain_maxzoom }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # KTORÝ BALÍK SA IDE PREPÍSAŤ, POVIE ČÍSELNÍK. Keby to bol `case`
      # v kroku publikovania, dala by sa sem pridať voľba a zabudnúť na balík –
      # a beh by prepísal ten predošlý, teda cudzí.
      - name: Ktorý balík to je
        id: co
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import importlib.util
          spec = importlib.util.spec_from_file_location("jobs", "workers/state/jobs.py")
          jobs = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(jobs)
          import os
          print("balik=" + jobs.job(os.environ["CO"])["balik"])
          PY
        env:
          CO: ${{ inputs.co }}

      # TEN ISTÝ rozklad volieb ako pri builde mapy – vrátane zdrojov výšok,
      # z ktorých `options.py` odvodí, čo sa ide počítať (`opt_contour_lines`,
      # `opt_rocks`, `opt_terrain`, `opt_rock_dem`). Pri `body`, `linie`
      # a `navigacia` sa tie hodnoty nikam nepodávajú a nikto na DEM nesiahne;
      # `ziadne` sa dá vybrať aj vtedy, keď sa vrstva z modelu pregenerovať
      # nemá.
      - name: Rozlož voľby
        id: opts
        run: |
          set -euo pipefail
          python3 workers/plan/options.py \
            --options='${{ inputs.options }}' \
            --contour-source='${{ inputs.contour_source }}' \
            --rock-source='${{ inputs.rock_source }}' \
            --shading-source='${{ inputs.shading_source }}' \
            --test='${{ inputs.test }}' \
            --publish-pages=false \
            --out="$GITHUB_OUTPUT" \
            --summary="$GITHUB_STEP_SUMMARY"

      - name: Dnešný dátum do kľúča cache
        id: day
        run: |
          echo "d=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          mkdir -p steps-out
          : > steps-out/plan.tsv

      # HRANICA KRAJA SA POČÍTA AŽ V KROKU „Stiahni PBF" – je v OSM dátach
      # (relácia `boundary=administrative`), takže sa dá prečítať až
      # z rodičovského extraktu. Volá si to `workers/plan/pbf.sh` samo, ten
      # istý skript ako v builde mapy: dve hranice toho istého kraja by
      # znamenali vrstvu orezanú inak než mapa pod ňou. Rozpis je v hlavičke
      # `workers/plan/region-poly.py`.

      # Kľúč je ten istý ako v builde mapy (`pbf-v6-…`), takže si beh vezme
      # PBF, ktoré dnes stiahol build – a naopak. Bola by škoda ťahať 373 MB
      # druhýkrát v ten istý deň kvôli tomu, že to spustila iná pipeline.
      - name: Cache PBF regiónu (restore)
        id: pbf-cache
        uses: ./.github/actions/cache-restore
        with:
          path: data/region.osm.pbf
          key: pbf-v6-${{ inputs.region }}-${{ steps.opts.outputs.opt_custom_pbf_url }}-${{ steps.opts.outputs.opt_crop_bbox }}-t${{ steps.opts.outputs.opt_test_km2 }}-acely_region${{ steps.opts.outputs.opt_area_bbox }}-at${{ steps.opts.outputs.opt_test_at }}-${{ steps.day.outputs.d }}

      - name: Stiahni PBF iba daného regiónu
        id: region
        env:
          AREA_IN: cely_region
          OPT_AREA_BBOX: ${{ steps.opts.outputs.opt_area_bbox }}
          OPT_CROP_BBOX: ${{ steps.opts.outputs.opt_crop_bbox }}
          OPT_CUSTOM_BBOX: ${{ steps.opts.outputs.opt_custom_bbox }}
          OPT_CUSTOM_NAME: ${{ steps.opts.outputs.opt_custom_name }}
          OPT_CUSTOM_PBF_URL: ${{ steps.opts.outputs.opt_custom_pbf_url }}
          OPT_TEST_AT: ${{ steps.opts.outputs.opt_test_at }}
          OPT_TEST_KM2: ${{ steps.opts.outputs.opt_test_km2 }}
          REGION: ${{ inputs.region }}
        run: workers/plan/pbf.sh

      # VÝREZ. Pregenerovanie ide vždy na CELÝ kraj (`cely_region`) – výrez je
      # pohorie a vyberať jedno pohorie pre vrstvu, ktorá sa prepisuje celá,
      # nedáva zmysel. Vyriešiť sa aj tak musí: `dem-layers.yml` z neho berie
      # bbox, na ktorom sa vrstvy počítajú, aj kľúč do mena uloženého výsledku.
      # Ten istý skript ako v builde – dva výpočty toho istého výrezu by
      # znamenali vrstvu spočítanú inde, než ju sklad hľadá.
      - name: Vyrieš výrez
        id: area
        run: |
          set -euo pipefail
          # Rýchly test už výrez vyriešil v `pbf.sh` (musel, aby vedel, kam
          # položiť štvorec) – odpoveď sa preberá, nie prepočítava: druhý
          # výpočet by dal ten istý bbox, ale kľúč BEZ prípony `_test4`,
          # a testovací výsledok by v sklade sadol na miesto ostrého.
          if [ -s /tmp/vyrez.txt ]; then
            cat /tmp/vyrez.txt >> "$GITHUB_OUTPUT"
            echo "Výrez z rýchleho testu (spočítaný v príprave):"
            cat /tmp/vyrez.txt
          else
            python3 workers/plan/area.py \
              --region-bbox='${{ steps.region.outputs.dem_bbox }}' \
              --area=cely_region --out="$GITHUB_OUTPUT"
          fi

      - name: Cache PBF regiónu (save)
        if: ${{ always() && steps.pbf-cache.outputs.cache-hit != 'true' && hashFiles('data/region.osm.pbf') != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: data/region.osm.pbf
          key: ${{ steps.pbf-cache.outputs.cache-primary-key }}

      - name: Odlož polygón kraja
        uses: actions/upload-artifact@v7
        with:
          name: region-poly
          path: |
            data/region.geojson
            data/region.poly
          retention-days: 1

      # Mená artefaktov (`pbf`, `region-poly`) sú tie isté ako v builde mapy
      # ZÁMERNE: `roads.yml` a `navigation-region.yml` sú spoločné pre obe
      # pipeline a sťahujú si ich menom.
      - name: Odlož PBF pre vrstvu
        uses: actions/upload-artifact@v7
        with:
          name: pbf
          path: data/region.osm.pbf
          retention-days: 1
          compression-level: 0

  # ---------- body z OSM ----------
  # `workers/features/build.sh` vyrába DVA súbory naraz (línie s plochami
  # a body) z jedného predfiltra – balík `body` je z toho druhého. Že sa tu
  # spočíta aj `-features.pmtiles`, ktoré tento beh nepublikuje, je vedomá
  # cena: druhý beh Planetileru je pár minút, kým vlastná vetva skriptu by
  # bola druhá pravda o tom, ako sa prvky filtrujú.
  body:
    name: Body z OSM
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && inputs.co == 'body' }}
    runs-on: ubuntu-latest
    outputs:
      points_enabled: ${{ steps.features.outputs.points_enabled }}
      points_size_mb: ${{ steps.features.outputs.points_size_mb }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Priprav priečinok na meranie
        run: mkdir -p steps-out

      - name: Stiahni PBF z prípravy
        uses: actions/download-artifact@v8
        with:
          name: pbf
          path: data

      - name: Stiahni polygón regiónu
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: region-poly
          path: data

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Planetileru (restore)
        id: planetiler-cache
        uses: ./.github/actions/cache-restore
        with:
          path: planetiler.jar
          key: planetiler-latest-${{ needs.plan.outputs.day }}

      - name: Stiahni Planetiler
        run: workers/lib/planetiler.sh
      - name: Cache Planetileru (save)
        if: ${{ always() && steps.planetiler-cache.outputs.cache-hit != 'true' && hashFiles('planetiler.jar') != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: planetiler.jar
          key: ${{ steps.planetiler-cache.outputs.cache-primary-key }}

      - name: Krajinné prvky z OSM → PMTiles
        id: features
        env:
          OPT_FEATURES_MAXZOOM: ${{ needs.plan.outputs.opt_features_maxzoom }}
          OPT_REGION_CLIP: ${{ needs.plan.outputs.opt_region_clip }}
          REGION_BBOX: ${{ needs.plan.outputs.bbox }}
          REGION_KEY: ${{ needs.plan.outputs.key }}
          SIZE_LIMIT_MB: ${{ needs.plan.outputs.opt_size_limit_mb }}
        run: workers/features/build.sh

      # PRÁZDNA VRSTVA JE TVRDÁ CHYBA, nie varovanie – na rozdiel od buildu
      # mapy. Tam „v území nie je ani jeden prameň" znamená mapu bez tej
      # vrstvy a mapa je aj tak celá; tu by to znamenalo, že sa nemá čím
      # prepísať balík, ktorý na Drive LEŽÍ – a `publish-map.py` by ho
      # nechal tak. Radšej spadnúť tu, kým je vidieť prečo.
      - name: Vznikli nejaké body?
        run: |
          set -euo pipefail
          if [ '${{ steps.features.outputs.points_enabled }}' != 'true' ]; then
            echo "::error::V kraji ${{ needs.plan.outputs.key }} nevznikol ani jeden bodový prvok, takže nie je čím prepísať balík -body.zip na Drive. Pri ostrom behu to znamená pokazený predfilter alebo schému (workers/features/points.yml), pri rýchlom teste len to, že štvorec padol na lúku."
            exit 1
          fi

      - name: Odlož vrstvu na zabalenie
        uses: actions/upload-artifact@v7
        with:
          name: site-features
          path: _site
          retention-days: 1
          compression-level: 0

      - name: Odlož meranie krokov
        if: ${{ always() && hashFiles('steps-out/*') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: steps-features
          path: steps-out
          retention-days: 1
          if-no-files-found: ignore

  # ---------- cesty a chodníky: CELÁ dopravná sieť ----------
  # Celý balík `cesty`: cesty od diaľnice po schody, železnice, električky
  # a metro, trajekty a lanovky – a k tomu obmedzenia na ceste (výška
  # podjazdu, hmotnosť, rýchlosť) ako atribúty tých istých ciest. Ten istý
  # workflow, aký volá build mapy; rozpis, čo v tej vrstve je, je v hlavičke
  # `workers/transport/transport.yml`.
  #
  # JEDEN JOB, A JE TO ZMENA. Kým sa balík volal `linie`, boli v ňom tri
  # vrstvy z troch jobov a všetky tri museli vzniknúť naraz (balík sa
  # prepisuje CELÝ). Odkedy sú obmedzenia atribútmi tej istej siete a značené
  # trasy cestujú v základnej mape, je balík jedna vrstva z jedného jobu –
  # a polovica nová s polovicou starou už nemá ako vzniknúť.
  doprava:
    name: Cesty a chodníky
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && inputs.co == 'cesty' }}
    uses: ./.github/workflows/transport.yml
    secrets: inherit                      # cache na Drive; `env` sa nededí
    with:
      region_key: ${{ needs.plan.outputs.key }}
      region_bbox: ${{ needs.plan.outputs.bbox }}
      maxzoom: ${{ needs.plan.outputs.opt_transport_maxzoom }}
      region_clip: ${{ needs.plan.outputs.opt_region_clip }}
      size_limit_mb: ${{ needs.plan.outputs.opt_size_limit_mb }}
      budget_pct: ${{ needs.plan.outputs.budget_transport_pct }}
      day: ${{ needs.plan.outputs.day }}

  # ---------- hranice území a ich názvy ----------
  # Ten istý workflow, aký volá build mapy. Rozpis, čo v tej vrstve je a prečo
  # nestačí hranica zo základnej mapy, je v hlavičke
  # `workers/boundaries/boundaries.yml`.
  hranice:
    name: Hranice území
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && inputs.co == 'hranice' }}
    uses: ./.github/workflows/boundaries.yml
    secrets: inherit                      # cache na Drive; `env` sa nededí
    with:
      region_key: ${{ needs.plan.outputs.key }}
      region_bbox: ${{ needs.plan.outputs.bbox }}
      maxzoom: ${{ needs.plan.outputs.opt_boundaries_maxzoom }}
      region_clip: ${{ needs.plan.outputs.opt_region_clip }}
      size_limit_mb: ${{ needs.plan.outputs.opt_size_limit_mb }}
      budget_pct: ${{ needs.plan.outputs.budget_boundaries_pct }}
      day: ${{ needs.plan.outputs.day }}

  # ---------- vodstvo ----------
  # Ten istý workflow, aký volá build mapy. Rozpis je v hlavičke
  # `workers/water/water.yml`.
  vodstvo:
    name: Vodstvo
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && inputs.co == 'vodstvo' }}
    uses: ./.github/workflows/water.yml
    secrets: inherit                      # cache na Drive; `env` sa nededí
    with:
      region_key: ${{ needs.plan.outputs.key }}
      region_bbox: ${{ needs.plan.outputs.bbox }}
      maxzoom: ${{ needs.plan.outputs.opt_water_maxzoom }}
      region_clip: ${{ needs.plan.outputs.opt_region_clip }}
      size_limit_mb: ${{ needs.plan.outputs.opt_size_limit_mb }}
      budget_pct: ${{ needs.plan.outputs.budget_water_pct }}
      day: ${{ needs.plan.outputs.day }}

  # ---------- navigačný graf ----------
  # VLASTNÝ BALÍK, teda vlastná voľba (`co: navigacia`) – rozpis v hlavičke.
  # Ten istý workflow, aký volá build mapy. Graf odloží ako artefakt
  # `navigacia-graf` (nie `site-…`, lebo na Pages nemá čo robiť) a balenie si
  # ho stiahne menom – presne ako v builde.
  navigacia:
    name: Navigačný graf (Valhalla)
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && inputs.co == 'navigacia' }}
    uses: ./.github/workflows/navigation-region.yml
    with:
      region_key: ${{ needs.plan.outputs.key }}
      valhalla_image: ${{ needs.plan.outputs.opt_valhalla_image }}

  # ---------- vrstvy z výškového modelu ----------
  # TEN ISTÝ workflow, aký nad nimi púšťa build mapy (`dem-layers.yml`):
  # kontrola skladu, jeho doplnenie, kľúče cache a tri joby, ktoré vrstvy
  # počítajú. Nie kópia – vrstevnica z pregenerovania musí vyjsť rovnako ako
  # tá z buildu, inak sa balík na Drive tichom rozdielom rozíde s mapou.
  #
  # ČO SA POČÍTA, ROZHODUJE VOĽBA `co`, nie zdroje výšok. Zdroj hovorí
  # „z čoho", `co` hovorí „čo" – a keby o tom rozhodovali zdroje, výber
  # `vrstevnice` by pregeneroval aj tieňovanie, lebo je predvolene `dmr5`.
  #
  # VRSTEVNICE A SKALY SÚ JEDEN BALÍK, takže sa pri oboch voľbách počítajú
  # OBE (`opt_contours` je brána toho jobu) – ale PREGENERUJE sa len tá
  # vybraná: druhá príde z cache za sekundy. Balík sa prepisuje celý
  # a polovica nová s polovicou chýbajúcou by bola balík, ktorý sľubuje
  # vrstvu, ktorú nenesie.
  dem:
    name: Vrstvy z výškového modelu
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && (inputs.co == 'vrstevnice' || inputs.co == 'skaly' || inputs.co == 'tienovanie') }}
    uses: ./.github/workflows/dem-layers.yml
    secrets: inherit                      # Drive (sklady aj cache); `env` sa nededí
    with:
      region_key: ${{ needs.plan.outputs.key }}
      area: cely_region
      area_key: ${{ needs.plan.outputs.area_key }}
      area_name: ${{ needs.plan.outputs.area_name }}
      area_bbox: ${{ needs.plan.outputs.area_bbox }}
      area_km2: ${{ needs.plan.outputs.area_km2 }}
      dem_bbox: ${{ needs.plan.outputs.dem_bbox }}
      dem_bboxkey: ${{ needs.plan.outputs.dem_bboxkey }}
      test_km2: ${{ needs.plan.outputs.opt_test_km2 }}
      day: ${{ needs.plan.outputs.day }}
      # Brána jobu s vrstevnicami a skalami: zapnutá pri oboch voľbách, lebo
      # obe vrstvy idú do jedného balíka (rozpis vyššie).
      opt_contours: ${{ (inputs.co == 'vrstevnice' || inputs.co == 'skaly') && 'true' || 'false' }}
      opt_contour_lines: ${{ (inputs.co == 'vrstevnice' || inputs.co == 'skaly') && needs.plan.outputs.opt_contour_lines || 'false' }}
      opt_rocks: ${{ (inputs.co == 'vrstevnice' || inputs.co == 'skaly') && needs.plan.outputs.opt_rocks || 'false' }}
      opt_terrain: ${{ inputs.co == 'tienovanie' && needs.plan.outputs.opt_terrain || 'false' }}
      opt_contour_source: ${{ needs.plan.outputs.opt_contour_source }}
      opt_rock_source: ${{ needs.plan.outputs.opt_rock_source }}
      opt_rock_dem: ${{ needs.plan.outputs.opt_rock_dem }}
      opt_shading_source: ${{ needs.plan.outputs.opt_shading_source }}
      opt_ugkk_fallback: ${{ needs.plan.outputs.opt_ugkk_fallback }}
      opt_ugkk_urls: ${{ needs.plan.outputs.opt_ugkk_urls }}
      opt_contour_interval: ${{ needs.plan.outputs.opt_contour_interval }}
      opt_contour_maxzoom: ${{ needs.plan.outputs.opt_contour_maxzoom }}
      opt_contour_smoothing: ${{ needs.plan.outputs.opt_contour_smoothing }}
      rock_slope: ${{ inputs.rock_slope }}
      opt_rock_maxzoom: ${{ needs.plan.outputs.opt_rock_maxzoom }}
      opt_rock_res: ${{ needs.plan.outputs.opt_rock_res }}
      opt_rock_plne: ${{ needs.plan.outputs.opt_rock_plne }}
      opt_rock_zapln_diery: ${{ needs.plan.outputs.opt_rock_zapln_diery }}
      opt_rock_img_asset: ${{ needs.plan.outputs.opt_rock_img_asset }}
      opt_rock_img_zoom: ${{ needs.plan.outputs.opt_rock_img_zoom }}
      opt_rock_img_options: ${{ needs.plan.outputs.opt_rock_img_options }}
      opt_terrain_maxzoom: ${{ needs.plan.outputs.opt_terrain_maxzoom }}
      # PREGENERUJE SA LEN TÁ VYBRANÁ. Príznak zahodí cache tej vrstvy
      # a spočíta ju nanovo; druhá polovica balíka sa vráti z cache – to je
      # celý rozdiel medzi „pregenerovať vrstevnice" a „pregenerovať skaly".
      opt_contours_rebuild: ${{ inputs.co == 'vrstevnice' && 'true' || 'false' }}
      opt_rocks_rebuild: ${{ inputs.co == 'skaly' && 'true' || 'false' }}
      opt_terrain_rebuild: ${{ inputs.co == 'tienovanie' && 'true' || 'false' }}
      opt_size_limit_mb: ${{ needs.plan.outputs.opt_size_limit_mb }}
      budget_contours_pct: ${{ needs.plan.outputs.budget_contours_pct }}
      budget_rocks_pct: ${{ needs.plan.outputs.budget_rocks_pct }}
      budget_terrain_pct: ${{ needs.plan.outputs.budget_terrain_pct }}

  # ---------- balík na Drive a katalóg ----------
  publish:
    name: Balík na Drive a katalóg
    needs: [plan, body, doprava, hranice, vodstvo, navigacia, dem]
    # Ani jeden z jobov vrstvy nesmie spadnúť. `skipped` je v poriadku (beží
    # vždy len tá vrstva, ktorá je vo formulári), `failure` nie – balík sa
    # prepisuje celý a z polovice novej a polovice starej vrstvy by vznikol
    # balík, ktorý o sebe klame.
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success'
          && needs.body.result != 'failure'
          && needs.doprava.result != 'failure'
          && needs.hranice.result != 'failure'
          && needs.vodstvo.result != 'failure'
          && needs.navigacia.result != 'failure'
          && needs.dem.result != 'failure'
          && needs.plan.outputs.opt_publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      # `write`, a je to jediné miesto, kde do repozitára niečo ide: katalóg
      # `maps.json` sa po nahratí balíka commitne do vetvy, z ktorej beh vyšiel.
      contents: write
    outputs:
      published: ${{ steps.publish.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Kusy vrstvy. Vzor `site-*`, nie mená: pri vrstvách z DEM sú to dva
      # artefakty (vrstevnice a skaly sú jeden balík) a inde jeden, takže
      # menami by sa to muselo napísať pre každú vrstvu zvlášť.
      #
      - name: Pozbieraj vrstvu
        uses: actions/download-artifact@v8
        with:
          pattern: site-*
          path: _site
          merge-multiple: true

      # Graf sa nevolá `site-…` (na Pages nemá čo robiť), takže sa sťahuje
      # menom. BEZ `continue-on-error` – na rozdiel od buildu mapy, kde je
      # mapa bez navigácie stále mapa, je tu graf CELÝM balíkom. Keby artefakt
      # nebol, nahral by sa prázdny `-navigacia.zip` a na ničom by to nebolo
      # vidieť; radšej spadnúť tu.
      - name: Stiahni navigačný graf
        if: ${{ inputs.co == 'navigacia' }}
        uses: actions/download-artifact@v8
        with:
          name: navigacia-graf
          path: _site

      - name: Čo prišlo od jobov vrstvy
        run: |
          set -uo pipefail
          echo "body=${{ needs.body.result }}, cesty=${{ needs.doprava.result }}, hranice=${{ needs.hranice.result }}, vodstvo=${{ needs.vodstvo.result }}, navigácia=${{ needs.navigacia.result }}, vrstvy z DEM=${{ needs.dem.result }} (vrstevnice=${{ needs.dem.outputs.res_contours }}, tieňovanie=${{ needs.dem.outputs.res_terrain }})"
          find _site -type f -printf '%10s  %p\n' 2>/dev/null || true

      # TEN ISTÝ packer a ten istý zápis do katalógu ako pri builde mapy, len
      # s `--only`: publikuje jediný balík a položku regiónu DOPLNÍ, nie
      # prepíše. Druhý packer by bol druhá pravda o tom istom.
      - name: Publikuj balík na Drive a zapíš do maps.json
        id: publish
        env:
          REGION_KEY: ${{ needs.plan.outputs.key }}
          AREA_KEY: cely
          TEST_KM2: ${{ needs.plan.outputs.opt_test_km2 }}
          CUSTOM_PBF_URL: ${{ needs.plan.outputs.opt_custom_pbf_url }}
          CUSTOM_NAME: ${{ needs.plan.outputs.opt_custom_name }}
          # ČO JE V BALÍKU, POVIE BALÍK SÁM.
          #
          # Pri vrstvách z PBF (`body`, `cesty`, `hranice`, `vodstvo`,
          # `navigacia`) je to meno tej
          # vrstvy: bez neho by `obsah.json` zložený z premenných buildu
          # tvrdil „bez_vrstevnic, bez_skal, bez_tienovania", čo pri takom
          # balíku nie je opis, ale lož o mape, ktorú tento beh nevidel.
          #
          # Pri vrstvách z výškového modelu je naopak PRÁZDNE – a je to zámer:
          # `publish-map.py` si vtedy meno vrstvy zloží z toho, čo mu o nej
          # povie job (zdroj modelu, interval, prah sklonu), presne ako
          # v builde. To sú údaje, ktoré `obsah.json` o tomto balíku naozaj
          # má povedať, a napísať ich sem druhýkrát by bola druhá pravda.
          MAP_LAYERS: ${{ (inputs.co == 'body' || inputs.co == 'cesty' || inputs.co == 'hranice' || inputs.co == 'vodstvo' || inputs.co == 'navigacia') && inputs.co || '' }}
          CONTOURS_ENABLED: ${{ needs.dem.outputs.contours_enabled || 'false' }}
          CONTOURS_SOURCE: ${{ needs.dem.outputs.contours_dem_source }}
          CONTOUR_INTERVAL: ${{ needs.plan.outputs.opt_contour_interval }}
          ROCKS_ENABLED: ${{ needs.dem.outputs.rocks_enabled || 'false' }}
          ROCKS_SOURCE: ${{ needs.dem.outputs.rock_source }}
          TERRAIN_ENABLED: ${{ needs.dem.outputs.terrain_enabled || 'false' }}
          TERRAIN_SOURCE: ${{ needs.dem.outputs.terrain_dem_source }}
          # Bbox výrezu ide do katalógu vedľa bboxu mapy: mapa je celý región,
          # ale vrstevnice a skaly sú len tu.
          AREA_BBOX: ${{ needs.plan.outputs.area_bbox }}
          # `TILES_MAXZOOM` tu zámerne nie je: je to strop dlaždíc MAPY a tú
          # tento beh nestaval. Prázdne pole v `obsah.json` je pravdivejšie
          # než číslo odhadnuté z inej vrstvy. To isté robí „Build wiki".
        run: |
          set -euo pipefail
          python3 workers/deploy/publish-map.py \
            --only='${{ needs.plan.outputs.balik }}' \
            --site=_site --maps=maps.json \
            --summary="$GITHUB_STEP_SUMMARY"

      # Ten istý skript, akým katalóg commituje build mapy – vrátane rebasu,
      # keď medzitým pushol iný beh (a pri dávke nad krajinou pushne).
      - name: Commitni maps.json
        if: ${{ steps.publish.outcome == 'success' }}
        env:
          MAPS_JSON: ${{ steps.publish.outputs.maps_file || 'maps.json' }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: workers/deploy/catalog.sh

      # Aby `.aar` mohol vyrobiť job na macOS, musí sa k nemu vrstva dostať –
      # v tom istom behu a bez druhého počítania.
      - name: Odlož vrstvu pre Apple Archive
        if: ${{ steps.publish.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: regenerate-site
          path: _site
          retention-days: 1
          compression-level: 0

      - name: Súhrn
        if: ${{ always() }}
        run: |
          set -uo pipefail
          {
            echo "## Pregenerovaná vrstva"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| kraj | \`${{ needs.plan.outputs.key }}\` |"
            echo "| vrstva | \`${{ inputs.co }}\` |"
            echo "| balík | \`${{ needs.plan.outputs.balik }}\` |"
            echo
            echo "Prepísal sa LEN tento balík. Ostatné balíky kraja (mapa,"
            echo "vrstevnice, tieňovanie a čo tento beh nerobil) na Drive ležia"
            echo "ďalej a v \`maps.json\` sa im nič nezmenilo – položka sa"
            echo "dopĺňa, nie prepisuje."
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------- ten istý balík ešte raz ako .aar ----------
  # MUSÍ TO BYŤ, nie „je to navyše": balíky majú stále mená a na Drive ležia
  # obe podoby vedľa seba. Keby sa prepísal len ZIP, ostal by pri ňom `.aar`
  # z predošlého behu – katalóg by ponúkal oba a kto by si stiahol ten druhý,
  # dostal by STARÚ vrstvu bez toho, aby to na čomkoľvek bolo vidieť.
  #
  # Vlastný job a na macOS preto, že nástroj `aa` je súčasť macOS a inde
  # neexistuje. Beží AŽ PO tom, čo sa nahral ZIP: `--only` položku katalógu
  # DOPĹŇA, takže ZIP musí byť zapísaný prvý.
  apple-archive:
    name: Balík ako Apple Archive (.aar)
    needs: [plan, publish, dem]
    if: ${{ !cancelled() && needs.publish.outputs.published == 'success' && needs.plan.outputs.opt_apple_archive == 'true' }}
    runs-on: macos-latest
    permissions:
      contents: write     # `maps.json` – to isté, čo robí `publish`
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Stiahni vrstvu z predošlého jobu
        uses: actions/download-artifact@v8
        with:
          name: regenerate-site
          path: _site
      - name: Zabaľ a nahraj .aar na Drive
        id: publish
        env:
          ONLY: ${{ needs.plan.outputs.balik }}
          SITE: _site
          REGION_KEY: ${{ needs.plan.outputs.key }}
          AREA_KEY: cely
          TEST_KM2: ${{ needs.plan.outputs.opt_test_km2 }}
          CUSTOM_PBF_URL: ${{ needs.plan.outputs.opt_custom_pbf_url }}
          CUSTOM_NAME: ${{ needs.plan.outputs.opt_custom_name }}
          # MUSIA to byť tie isté hodnoty, aké dostal job so ZIPom:
          # `obsah.json` sa skladá z nich a inými by `.aar` o sebe tvrdil
          # niečo iné než ZIP s tým istým obsahom.
          MAP_LAYERS: ${{ (inputs.co == 'body' || inputs.co == 'cesty' || inputs.co == 'hranice' || inputs.co == 'vodstvo' || inputs.co == 'navigacia') && inputs.co || '' }}
          CONTOURS_ENABLED: ${{ needs.dem.outputs.contours_enabled || 'false' }}
          CONTOURS_SOURCE: ${{ needs.dem.outputs.contours_dem_source }}
          CONTOUR_INTERVAL: ${{ needs.plan.outputs.opt_contour_interval }}
          ROCKS_ENABLED: ${{ needs.dem.outputs.rocks_enabled || 'false' }}
          ROCKS_SOURCE: ${{ needs.dem.outputs.rock_source }}
          TERRAIN_ENABLED: ${{ needs.dem.outputs.terrain_enabled || 'false' }}
          TERRAIN_SOURCE: ${{ needs.dem.outputs.terrain_dem_source }}
          AREA_BBOX: ${{ needs.plan.outputs.area_bbox }}
          # Z ktorej vetvy si vypýtať čerstvý `maps.json` – ten predošlý job
          # doň práve zapísal a checkout má stav spred toho.
          BRANCH: ${{ github.ref_name }}
        run: workers/deploy/apple-archive.sh
      - name: Commitni maps.json
        if: ${{ steps.publish.outcome == 'success' }}
        env:
          MAPS_JSON: ${{ steps.publish.outputs.maps_file || 'maps.json' }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: workers/deploy/catalog.sh
