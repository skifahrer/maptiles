name: Map · Regenerate region layer

# ONE LAYER OF ONE REGION ANEW – without rebuilding the map.
#
# Choices `what`: points, roads (the whole road network with the routing
# network), boundaries, water, railways, settlements, contours, rocks, terrain.
# Only that package is overwritten on Drive.
#
# OSM layers take minutes (the same PBF as the map); DEM layers tens of minutes
# to hours – computed by `dem-layers.yml`, the workflow the map build calls.
# Contours and rocks are one package, so both are computed (the other from cache).
#
# Published by the same script as the build, with `--only=<package>`: the
# `maps.json` entry is added to, other packages stay. Nothing goes to Pages;
# `.aar` is redone too, hence the second job. A whole country: “Map · Regenerate state”.

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Region whose layer is regenerated"
        required: true
        default: bratislavsky
        type: choice
        options:
          - slovensko
          - bratislavsky
          - trnavsky
          - trenciansky
          - nitriansky
          - zilinsky
          - banskobystricky
          - presovsky
          - kosicky
      # the list is `workers/state/jobs.py` – the keys the country batch offers
      # (guarded by `workers/lint/regenerate.py`)
      what:
        description: "Which layer to regenerate"
        required: true
        default: points
        type: choice
        options:
          - points
          - roads
          - boundaries
          - water
          - railways
          - settlements
          - contours
          - rocks
          - terrain
      # sources and slope matter only for DEM layers; values as in the region form
      contour_source:
        description: "Contours – which terrain model (none = don't make)"
        required: false
        default: dmr5
        type: choice
        options:
          - sonny
          - sonny1
          - dmr35
          - dmr5
          - none
      rock_source:
        description: "Rocks – from the model's slope, or from hillshading (none = don't make)"
        required: false
        default: dmr5
        type: choice
        options:
          - sonny
          - sonny1
          - dmr35
          - dmr5
          - shading
          - none
      shading_source:
        description: "Hillshading and 3D terrain – which model (none = don't make)"
        required: false
        default: dmr5
        type: choice
        options:
          - sonny
          - sonny1
          - dmr35
          - dmr5
          - none
      rock_slope:
        description: "From which slope (°) terrain is rock (50 = faces, 40 = steep slopes too)"
        required: false
        default: "50"
        type: string
      test:
        description: "Quick test: only 4 km² in the middle of the region (a pipeline trial)"
        required: false
        default: false
        type: boolean
      # e.g. `publish=false`, `apple_archive=false`, `features_maxzoom=16`; the
      # same file as the map build, or a layer's zoom cap would differ from the catalog's
      options:
        description: "Rarely changed settings as key=value (see workers/plan/options.py)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

# no `concurrency: pages` on purpose: nothing goes to Pages, and group `pages`
# would make regenerating points wait for a three-hour region build

env:
  # Drive sign-in for the whole workflow, not per step
  GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
  DRIVE_CLIENT: ${{ vars.DRIVE_CLIENT }}
  DRIVE_SECRET: ${{ secrets.DRIVE_SECRET }}
  DRIVE_REFRESH: ${{ secrets.DRIVE_REFRESH }}
  OSMFR_BASE: https://download.openstreetmap.fr/extracts
  # the same numbers as `build-map-region.yml` – `env:` isn't inherited through
  # `workflow_call`; `workers/lint/regenerate.py` guards they don't drift
  BUDGET_TRAILS_PCT: "3"
  BUDGET_FEATURES_PCT: "4"
  BUDGET_TRANSPORT_PCT: "8"
  BUDGET_ROUTING_PCT: "3"
  BUDGET_BOUNDARIES_PCT: "3"
  BUDGET_WATER_PCT: "5"
  BUDGET_RAIL_PCT: "3"
  BUDGET_BUILDINGS_PCT: "6"
  # the same for DEM layers; `dem-layers.yml` gets them as inputs
  BUDGET_CONTOURS_PCT: "25"
  BUDGET_ROCKS_PCT: "12"
  BUDGET_TERRAIN_PCT: "12"

jobs:
  # what `plan` of the map build does, without Pages, cut-out and model
  plan:
    name: Preparation (region, PBF)
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.region.outputs.key }}
      name: ${{ steps.region.outputs.name }}
      iso: ${{ steps.region.outputs.iso }}
      # the area the CCH node order is over
      routing_area: ${{ steps.region.outputs.routing_area }}
      bbox: ${{ steps.region.outputs.bbox }}
      day: ${{ steps.day.outputs.d }}
      package: ${{ steps.what.outputs.package }}
      opt_test_km2: ${{ steps.opts.outputs.opt_test_km2 }}
      opt_publish: ${{ steps.opts.outputs.opt_publish }}
      opt_apple_archive: ${{ steps.opts.outputs.opt_apple_archive }}
      opt_region_clip: ${{ steps.opts.outputs.opt_region_clip }}
      opt_size_limit_mb: ${{ steps.opts.outputs.opt_size_limit_mb }}
      opt_trails_maxzoom: ${{ steps.opts.outputs.opt_trails_maxzoom }}
      opt_features_maxzoom: ${{ steps.opts.outputs.opt_features_maxzoom }}
      opt_transport_maxzoom: ${{ steps.opts.outputs.opt_transport_maxzoom }}
      opt_boundaries_maxzoom: ${{ steps.opts.outputs.opt_boundaries_maxzoom }}
      opt_water_maxzoom: ${{ steps.opts.outputs.opt_water_maxzoom }}
      opt_rail_maxzoom: ${{ steps.opts.outputs.opt_rail_maxzoom }}
      opt_buildings_maxzoom: ${{ steps.opts.outputs.opt_buildings_maxzoom }}
      opt_custom_pbf_url: ${{ steps.opts.outputs.opt_custom_pbf_url }}
      opt_custom_name: ${{ steps.opts.outputs.opt_custom_name }}
      budget_transport_pct: ${{ env.BUDGET_TRANSPORT_PCT }}
      budget_routing_pct: ${{ env.BUDGET_ROUTING_PCT }}
      budget_boundaries_pct: ${{ env.BUDGET_BOUNDARIES_PCT }}
      budget_water_pct: ${{ env.BUDGET_WATER_PCT }}
      budget_rail_pct: ${{ env.BUDGET_RAIL_PCT }}
      budget_buildings_pct: ${{ env.BUDGET_BUILDINGS_PCT }}
      # shares go as outputs, `env` can't be read in a called workflow's `with:`
      budget_contours_pct: ${{ env.BUDGET_CONTOURS_PCT }}
      budget_rocks_pct: ${{ env.BUDGET_ROCKS_PCT }}
      budget_terrain_pct: ${{ env.BUDGET_TERRAIN_PCT }}
      dem_bbox: ${{ steps.region.outputs.dem_bbox }}
      dem_bboxkey: ${{ steps.region.outputs.dem_bboxkey }}
      area_key: ${{ steps.area.outputs.key }}
      area_name: ${{ steps.area.outputs.name }}
      area_bbox: ${{ steps.area.outputs.bbox }}
      area_km2: ${{ steps.area.outputs.km2 }}
      opt_contour_lines: ${{ steps.opts.outputs.opt_contour_lines }}
      opt_rocks: ${{ steps.opts.outputs.opt_rocks }}
      opt_terrain: ${{ steps.opts.outputs.opt_terrain }}
      opt_contour_source: ${{ steps.opts.outputs.opt_contour_source }}
      opt_rock_source: ${{ steps.opts.outputs.opt_rock_source }}
      opt_rock_dem: ${{ steps.opts.outputs.opt_rock_dem }}
      opt_shading_source: ${{ steps.opts.outputs.opt_shading_source }}
      opt_ugkk_fallback: ${{ steps.opts.outputs.opt_ugkk_fallback }}
      opt_ugkk_urls: ${{ steps.opts.outputs.opt_ugkk_urls }}
      opt_contour_interval: ${{ steps.opts.outputs.opt_contour_interval }}
      opt_contour_maxzoom: ${{ steps.opts.outputs.opt_contour_maxzoom }}
      opt_contour_maxzoom_cap: ${{ steps.opts.outputs.opt_contour_maxzoom_cap }}
      opt_contour_lowland_m: ${{ steps.opts.outputs.opt_contour_lowland_m }}
      opt_contour_smoothing: ${{ steps.opts.outputs.opt_contour_smoothing }}
      opt_rock_maxzoom: ${{ steps.opts.outputs.opt_rock_maxzoom }}
      opt_rock_res: ${{ steps.opts.outputs.opt_rock_res }}
      opt_rock_solid: ${{ steps.opts.outputs.opt_rock_solid }}
      opt_rock_fill_holes: ${{ steps.opts.outputs.opt_rock_fill_holes }}
      opt_rock_img_asset: ${{ steps.opts.outputs.opt_rock_img_asset }}
      opt_rock_img_zoom: ${{ steps.opts.outputs.opt_rock_img_zoom }}
      opt_rock_img_options: ${{ steps.opts.outputs.opt_rock_img_options }}
      opt_terrain_maxzoom: ${{ steps.opts.outputs.opt_terrain_maxzoom }}
      opt_terrain_frac_bits: ${{ steps.opts.outputs.opt_terrain_frac_bits }}
      opt_terrain_format: ${{ steps.opts.outputs.opt_terrain_format }}
      opt_reuse_layers: ${{ steps.opts.outputs.opt_reuse_layers }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # the registry says which package is overwritten – a `case` here would
      # let a choice be added and its package forgotten
      - name: Which package it is
        id: what
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import importlib.util
          spec = importlib.util.spec_from_file_location("jobs", "workers/state/jobs.py")
          jobs = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(jobs)
          import os
          print("package=" + jobs.job(os.environ["WHAT"])["package"])
          PY
        env:
          WHAT: ${{ inputs.what }}

      # the same option split as the build; OSM layers pass none of it on
      - name: Split the options
        id: opts
        run: |
          set -euo pipefail
          python3 workers/plan/options.py \
            --options='${{ inputs.options }}' \
            --contour-source='${{ inputs.contour_source }}' \
            --rock-source='${{ inputs.rock_source }}' \
            --shading-source='${{ inputs.shading_source }}' \
            --test='${{ inputs.test }}' \
            --publish-pages=false \
            --out="$GITHUB_OUTPUT" \
            --summary="$GITHUB_STEP_SUMMARY"

      - name: Today's date for the cache key
        id: day
        run: |
          echo "d=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          mkdir -p steps-out
          : > steps-out/plan.tsv

      # the key is the build's (`pbf-v6-…`), so the run takes the PBF the build fetched today
      - name: Region PBF cache (restore)
        id: pbf-cache
        uses: ./.github/actions/cache-restore
        with:
          path: data/region.osm.pbf
          key: pbf-v6-${{ inputs.region }}-${{ steps.opts.outputs.opt_custom_pbf_url }}-${{ steps.opts.outputs.opt_crop_bbox }}-t${{ steps.opts.outputs.opt_test_km2 }}-awhole_region${{ steps.opts.outputs.opt_area_bbox }}-at${{ steps.opts.outputs.opt_test_at }}-${{ steps.day.outputs.d }}

      - name: Download the PBF of the region only
        id: region
        env:
          AREA_IN: whole_region
          OPT_AREA_BBOX: ${{ steps.opts.outputs.opt_area_bbox }}
          OPT_CROP_BBOX: ${{ steps.opts.outputs.opt_crop_bbox }}
          OPT_CUSTOM_BBOX: ${{ steps.opts.outputs.opt_custom_bbox }}
          OPT_CUSTOM_NAME: ${{ steps.opts.outputs.opt_custom_name }}
          OPT_CUSTOM_PBF_URL: ${{ steps.opts.outputs.opt_custom_pbf_url }}
          OPT_TEST_AT: ${{ steps.opts.outputs.opt_test_at }}
          OPT_TEST_KM2: ${{ steps.opts.outputs.opt_test_km2 }}
          REGION: ${{ inputs.region }}
        run: workers/plan/pbf.sh

      # always the whole region, but `dem-layers.yml` takes bbox and key from the cut-out
      - name: Resolve the cut-out
        id: area
        run: |
          set -euo pipefail
          # a quick test resolved it in `pbf.sh` already, with the `_test4` key
          if [ -s /tmp/cutout.txt ]; then
            cat /tmp/cutout.txt >> "$GITHUB_OUTPUT"
            echo "Cut-out of the quick test (computed in the preparation):"
            cat /tmp/cutout.txt
          else
            python3 workers/plan/area.py \
              --region-bbox='${{ steps.region.outputs.dem_bbox }}' \
              --area=whole_region --out="$GITHUB_OUTPUT"
          fi

      - name: Region PBF cache (save)
        if: ${{ always() && steps.pbf-cache.outputs.cache-hit != 'true' && hashFiles('data/region.osm.pbf') != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: data/region.osm.pbf
          key: ${{ steps.pbf-cache.outputs.cache-primary-key }}

      - name: Keep the region polygon
        uses: actions/upload-artifact@v7
        with:
          name: region-poly
          path: |
            data/region.geojson
            data/region.poly
          retention-days: 1

      # the build's artifact names: `transport.yml` and `navigation-region.yml` fetch them by name
      - name: Keep the PBF for the layer
        uses: actions/upload-artifact@v7
        with:
          name: pbf
          path: data/region.osm.pbf
          retention-days: 1
          compression-level: 0

  # `workers/features/build.sh` makes two files at once; computing what this
  # run doesn't publish is the price of one truth about filtering
  points:
    name: Points from OSM
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && inputs.what == 'points' }}
    runs-on: ubuntu-latest
    outputs:
      points_enabled: ${{ steps.features.outputs.points_enabled }}
      points_size_mb: ${{ steps.features.outputs.points_size_mb }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Prepare the timing folder
        run: mkdir -p steps-out

      - name: Download the PBF from the preparation
        uses: actions/download-artifact@v8
        with:
          name: pbf
          path: data

      - name: Download the region polygon
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: region-poly
          path: data

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Planetiler cache (restore)
        id: planetiler-cache
        uses: ./.github/actions/cache-restore
        with:
          path: planetiler.jar
          key: planetiler-latest-${{ needs.plan.outputs.day }}

      - name: Download Planetiler
        run: workers/lib/planetiler.sh
      - name: Planetiler cache (save)
        if: ${{ always() && steps.planetiler-cache.outputs.cache-hit != 'true' && hashFiles('planetiler.jar') != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: planetiler.jar
          key: ${{ steps.planetiler-cache.outputs.cache-primary-key }}

      - name: Landscape features from OSM → PMTiles
        id: features
        env:
          OPT_FEATURES_MAXZOOM: ${{ needs.plan.outputs.opt_features_maxzoom }}
          OPT_REGION_CLIP: ${{ needs.plan.outputs.opt_region_clip }}
          REGION_BBOX: ${{ needs.plan.outputs.bbox }}
          REGION_KEY: ${{ needs.plan.outputs.key }}
          SIZE_LIMIT_MB: ${{ needs.plan.outputs.opt_size_limit_mb }}
        run: workers/features/build.sh

      # an empty layer is a hard error here: nothing to overwrite the package on Drive with
      - name: Were any points made?
        run: |
          set -euo pipefail
          if [ '${{ steps.features.outputs.points_enabled }}' != 'true' ]; then
            echo "::error::Region ${{ needs.plan.outputs.key }} made not one point feature, so there is nothing to overwrite -points.zip on Drive with. On a real run that means a broken prefilter or schema (workers/features/points.yml), on a quick test only that the square fell on a meadow."
            exit 1
          fi

      - name: Keep the layer for packing
        uses: actions/upload-artifact@v7
        with:
          name: site-features
          path: _site
          retention-days: 1
          compression-level: 0

      - name: Keep the step timing
        if: ${{ always() && hashFiles('steps-out/*') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: steps-features
          path: steps-out
          retention-days: 1
          if-no-files-found: ignore

  # the road network with road limits; the same workflow the map build calls.
  # Package `roads` carries the routing network too, built by job `routing`
  # below – both run on the same choice, the package is overwritten whole.
  transport:
    name: Roads & paths
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && inputs.what == 'roads' }}
    uses: ./.github/workflows/transport.yml
    secrets: inherit                      # cache on Drive; `env` isn't inherited
    with:
      region_key: ${{ needs.plan.outputs.key }}
      region_bbox: ${{ needs.plan.outputs.bbox }}
      maxzoom: ${{ needs.plan.outputs.opt_transport_maxzoom }}
      region_clip: ${{ needs.plan.outputs.opt_region_clip }}
      size_limit_mb: ${{ needs.plan.outputs.opt_size_limit_mb }}
      budget_pct: ${{ needs.plan.outputs.budget_transport_pct }}
      day: ${{ needs.plan.outputs.day }}

  # the same workflow the map build calls (`workers/boundaries/boundaries.yml`)
  boundaries:
    name: Area boundaries
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && inputs.what == 'boundaries' }}
    uses: ./.github/workflows/boundaries.yml
    secrets: inherit                      # cache on Drive; `env` isn't inherited
    with:
      region_key: ${{ needs.plan.outputs.key }}
      region_bbox: ${{ needs.plan.outputs.bbox }}
      maxzoom: ${{ needs.plan.outputs.opt_boundaries_maxzoom }}
      region_clip: ${{ needs.plan.outputs.opt_region_clip }}
      size_limit_mb: ${{ needs.plan.outputs.opt_size_limit_mb }}
      budget_pct: ${{ needs.plan.outputs.budget_boundaries_pct }}
      day: ${{ needs.plan.outputs.day }}

  # the same workflow the map build calls (`workers/water/water.yml`)
  water:
    name: Water
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && inputs.what == 'water' }}
    uses: ./.github/workflows/water.yml
    secrets: inherit                      # cache on Drive; `env` isn't inherited
    with:
      region_key: ${{ needs.plan.outputs.key }}
      region_bbox: ${{ needs.plan.outputs.bbox }}
      maxzoom: ${{ needs.plan.outputs.opt_water_maxzoom }}
      region_clip: ${{ needs.plan.outputs.opt_region_clip }}
      size_limit_mb: ${{ needs.plan.outputs.opt_size_limit_mb }}
      budget_pct: ${{ needs.plan.outputs.budget_water_pct }}
      day: ${{ needs.plan.outputs.day }}

  # the same workflow the map build calls (`workers/rail/rail.yml`)
  railways:
    name: Railways and cable cars
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && inputs.what == 'railways' }}
    uses: ./.github/workflows/rail.yml
    secrets: inherit                      # cache on Drive; `env` isn't inherited
    with:
      region_key: ${{ needs.plan.outputs.key }}
      region_name: ${{ needs.plan.outputs.name }}
      region_bbox: ${{ needs.plan.outputs.bbox }}
      maxzoom: ${{ needs.plan.outputs.opt_rail_maxzoom }}
      region_clip: ${{ needs.plan.outputs.opt_region_clip }}
      size_limit_mb: ${{ needs.plan.outputs.opt_size_limit_mb }}
      budget_pct: ${{ needs.plan.outputs.budget_rail_pct }}
      day: ${{ needs.plan.outputs.day }}

  # the same workflow the map build calls (`workers/buildings/buildings.yml`)
  settlements:
    name: Settlements
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && inputs.what == 'settlements' }}
    uses: ./.github/workflows/buildings.yml
    secrets: inherit                      # cache on Drive; `env` isn't inherited
    with:
      region_key: ${{ needs.plan.outputs.key }}
      region_bbox: ${{ needs.plan.outputs.bbox }}
      maxzoom: ${{ needs.plan.outputs.opt_buildings_maxzoom }}
      region_clip: ${{ needs.plan.outputs.opt_region_clip }}
      size_limit_mb: ${{ needs.plan.outputs.opt_size_limit_mb }}
      budget_pct: ${{ needs.plan.outputs.budget_buildings_pct }}
      day: ${{ needs.plan.outputs.day }}

  # the other half of package `roads`: the routing network rides in it (and in
  # the base map) with no package of its own – so the choice `roads` builds it too
  routing:
    name: Routing network
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && inputs.what == 'roads' }}
    uses: ./.github/workflows/navigation-region.yml
    secrets: inherit                      # cache with the node order on Drive
    with:
      region_key: ${{ needs.plan.outputs.key }}
      region_name: ${{ needs.plan.outputs.name }}
      routing_country: ${{ needs.plan.outputs.iso }}
      routing_area: ${{ needs.plan.outputs.routing_area }}
      dem_bbox: ${{ needs.plan.outputs.dem_bbox }}
      size_limit_mb: ${{ needs.plan.outputs.opt_size_limit_mb }}
      budget_pct: ${{ needs.plan.outputs.budget_routing_pct }}

  # the same workflow the map build runs (`dem-layers.yml`), not a copy. The
  # choice `what` decides what is computed; contours and rocks are one package,
  # so both are computed, only the chosen one regenerated.
  dem:
    name: Height-model layers
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && (inputs.what == 'contours' || inputs.what == 'rocks' || inputs.what == 'terrain') }}
    uses: ./.github/workflows/dem-layers.yml
    secrets: inherit                      # Drive (stores and cache); `env` isn't inherited
    with:
      region_key: ${{ needs.plan.outputs.key }}
      area: whole_region
      area_key: ${{ needs.plan.outputs.area_key }}
      area_name: ${{ needs.plan.outputs.area_name }}
      area_bbox: ${{ needs.plan.outputs.area_bbox }}
      area_km2: ${{ needs.plan.outputs.area_km2 }}
      dem_bbox: ${{ needs.plan.outputs.dem_bbox }}
      dem_bboxkey: ${{ needs.plan.outputs.dem_bboxkey }}
      test_km2: ${{ needs.plan.outputs.opt_test_km2 }}
      day: ${{ needs.plan.outputs.day }}
      # the job gate; each layer is its own package, so only the chosen one is made
      opt_contours: ${{ (inputs.what == 'contours' || inputs.what == 'rocks') && 'true' || 'false' }}
      opt_contour_lines: ${{ inputs.what == 'contours' && needs.plan.outputs.opt_contour_lines || 'false' }}
      opt_rocks: ${{ inputs.what == 'rocks' && needs.plan.outputs.opt_rocks || 'false' }}
      opt_terrain: ${{ inputs.what == 'terrain' && needs.plan.outputs.opt_terrain || 'false' }}
      opt_contour_source: ${{ needs.plan.outputs.opt_contour_source }}
      opt_rock_source: ${{ inputs.what == 'rocks' && needs.plan.outputs.opt_rock_source || 'none' }}
      opt_rock_dem: ${{ inputs.what == 'rocks' && needs.plan.outputs.opt_rock_dem || '' }}
      opt_shading_source: ${{ needs.plan.outputs.opt_shading_source }}
      opt_ugkk_fallback: ${{ needs.plan.outputs.opt_ugkk_fallback }}
      opt_ugkk_urls: ${{ needs.plan.outputs.opt_ugkk_urls }}
      opt_contour_interval: ${{ needs.plan.outputs.opt_contour_interval }}
      opt_contour_maxzoom: ${{ needs.plan.outputs.opt_contour_maxzoom }}
      opt_contour_maxzoom_cap: ${{ needs.plan.outputs.opt_contour_maxzoom_cap }}
      opt_contour_lowland_m: ${{ needs.plan.outputs.opt_contour_lowland_m }}
      opt_contour_smoothing: ${{ needs.plan.outputs.opt_contour_smoothing }}
      rock_slope: ${{ inputs.rock_slope }}
      opt_rock_maxzoom: ${{ needs.plan.outputs.opt_rock_maxzoom }}
      opt_rock_res: ${{ needs.plan.outputs.opt_rock_res }}
      opt_rock_solid: ${{ needs.plan.outputs.opt_rock_solid }}
      opt_rock_fill_holes: ${{ needs.plan.outputs.opt_rock_fill_holes }}
      opt_rock_img_asset: ${{ needs.plan.outputs.opt_rock_img_asset }}
      opt_rock_img_zoom: ${{ needs.plan.outputs.opt_rock_img_zoom }}
      opt_rock_img_options: ${{ needs.plan.outputs.opt_rock_img_options }}
      opt_terrain_maxzoom: ${{ needs.plan.outputs.opt_terrain_maxzoom }}
      opt_terrain_frac_bits: ${{ needs.plan.outputs.opt_terrain_frac_bits }}
      opt_terrain_format: ${{ needs.plan.outputs.opt_terrain_format }}
      opt_reuse_layers: ${{ needs.plan.outputs.opt_reuse_layers }}
      opt_contours_rebuild: ${{ inputs.what == 'contours' && 'true' || 'false' }}
      opt_rocks_rebuild: ${{ inputs.what == 'rocks' && 'true' || 'false' }}
      opt_terrain_rebuild: ${{ inputs.what == 'terrain' && 'true' || 'false' }}
      opt_size_limit_mb: ${{ needs.plan.outputs.opt_size_limit_mb }}
      budget_contours_pct: ${{ needs.plan.outputs.budget_contours_pct }}
      budget_rocks_pct: ${{ needs.plan.outputs.budget_rocks_pct }}
      budget_terrain_pct: ${{ needs.plan.outputs.budget_terrain_pct }}

  publish:
    name: Package to Drive and the catalog
    needs: [plan, points, transport, boundaries, water, railways, settlements, routing, dem]
    # `skipped` is fine, `failure` isn't: half a new and half an old layer would be a lying package
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success'
          && needs.points.result != 'failure'
          && needs.transport.result != 'failure'
          && needs.boundaries.result != 'failure'
          && needs.water.result != 'failure'
          && needs.railways.result != 'failure'
          && needs.settlements.result != 'failure'
          && needs.routing.result != 'failure'
          && needs.dem.result != 'failure'
          && needs.plan.outputs.opt_publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      # `write` is the one place anything reaches the repository: `maps.json`
      contents: write
    outputs:
      published: ${{ steps.publish.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # the pattern `site-*`, not names: DEM layers are two artifacts, others one
      - name: Collect the layer
        uses: actions/download-artifact@v8
        with:
          pattern: site-*
          path: _site
          merge-multiple: true

      - name: What came from the layer jobs
        run: |
          set -uo pipefail
          echo "points=${{ needs.points.result }}, roads=${{ needs.transport.result }}, boundaries=${{ needs.boundaries.result }}, water=${{ needs.water.result }}, railways=${{ needs.railways.result }}, settlements=${{ needs.settlements.result }}, routing=${{ needs.routing.result }}, DEM layers=${{ needs.dem.result }} (contours=${{ needs.dem.outputs.res_contours }}, hillshading=${{ needs.dem.outputs.res_terrain }})"
          find _site -type f -printf '%10s  %p\n' 2>/dev/null || true

      # the build's packer and catalog write, with `--only`: one package, the entry added to
      - name: Publish the package to Drive and write maps.json
        id: publish
        env:
          REGION_KEY: ${{ needs.plan.outputs.key }}
          AREA_KEY: whole
          TEST_KM2: ${{ needs.plan.outputs.opt_test_km2 }}
          CUSTOM_PBF_URL: ${{ needs.plan.outputs.opt_custom_pbf_url }}
          CUSTOM_NAME: ${{ needs.plan.outputs.opt_custom_name }}
          # for OSM layers the layer's name – without it `contents.json` would say
          # “no_contours, no_rocks…” of a map the run never saw; empty for DEM layers
          MAP_LAYERS: ${{ (inputs.what == 'points' || inputs.what == 'roads' || inputs.what == 'boundaries' || inputs.what == 'water' || inputs.what == 'railways' || inputs.what == 'settlements') && inputs.what || '' }}
          CONTOURS_ENABLED: ${{ needs.dem.outputs.contours_enabled || 'false' }}
          CONTOURS_SOURCE: ${{ needs.dem.outputs.contours_dem_source }}
          CONTOUR_INTERVAL: ${{ needs.plan.outputs.opt_contour_interval }}
          ROCKS_ENABLED: ${{ needs.dem.outputs.rocks_enabled || 'false' }}
          ROCKS_SOURCE: ${{ needs.dem.outputs.rock_source }}
          TERRAIN_ENABLED: ${{ needs.dem.outputs.terrain_enabled || 'false' }}
          TERRAIN_SOURCE: ${{ needs.dem.outputs.terrain_dem_source }}
          # the cut-out's bbox beside the map's
          AREA_BBOX: ${{ needs.plan.outputs.area_bbox }}
          # no `TILES_MAXZOOM` on purpose: the map's tile cap, and this run built no map
        run: |
          set -euo pipefail
          python3 workers/deploy/publish-map.py \
            --only='${{ needs.plan.outputs.package }}' \
            --site=_site --maps=maps.json \
            --summary="$GITHUB_STEP_SUMMARY"

      - name: Commit maps.json
        if: ${{ steps.publish.outcome == 'success' }}
        env:
          MAPS_JSON: ${{ steps.publish.outputs.maps_file || 'maps.json' }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: workers/deploy/catalog.sh

      # the macOS job needs the layer to make `.aar`
      - name: Keep the layer for Apple Archive
        if: ${{ steps.publish.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: regenerate-site
          path: _site
          retention-days: 1
          compression-level: 0

      - name: Summary
        if: ${{ always() }}
        run: |
          set -uo pipefail
          {
            echo "## Regenerated layer"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| region | \`${{ needs.plan.outputs.key }}\` |"
            echo "| layer | \`${{ inputs.what }}\` |"
            echo "| package | \`${{ needs.plan.outputs.package }}\` |"
            echo
            echo "ONLY this package was overwritten. The region's other packages (map,"
            echo "contours, hillshading and what this run didn't make) stay on Drive,"
            echo "and nothing changed for them in \`maps.json\` – the entry is added to,"
            echo "not overwritten."
          } >> "$GITHUB_STEP_SUMMARY"

  # the same package once more as `.aar`, or the old `.aar` would stay beside a new ZIP
  apple-archive:
    name: Package as Apple Archive (.aar)
    needs: [plan, publish, dem]
    if: ${{ !cancelled() && needs.publish.outputs.published == 'success' && needs.plan.outputs.opt_apple_archive == 'true' }}
    runs-on: macos-latest
    permissions:
      contents: write     # `maps.json` – as `publish` does
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download the layer from the job before
        uses: actions/download-artifact@v8
        with:
          name: regenerate-site
          path: _site
      - name: Pack and upload .aar to Drive
        id: publish
        env:
          ONLY: ${{ needs.plan.outputs.package }}
          SITE: _site
          REGION_KEY: ${{ needs.plan.outputs.key }}
          AREA_KEY: whole
          TEST_KM2: ${{ needs.plan.outputs.opt_test_km2 }}
          CUSTOM_PBF_URL: ${{ needs.plan.outputs.opt_custom_pbf_url }}
          CUSTOM_NAME: ${{ needs.plan.outputs.opt_custom_name }}
          # the same values as the ZIP job – `contents.json` is made of them
          MAP_LAYERS: ${{ (inputs.what == 'points' || inputs.what == 'roads' || inputs.what == 'boundaries' || inputs.what == 'water' || inputs.what == 'railways' || inputs.what == 'settlements') && inputs.what || '' }}
          CONTOURS_ENABLED: ${{ needs.dem.outputs.contours_enabled || 'false' }}
          CONTOURS_SOURCE: ${{ needs.dem.outputs.contours_dem_source }}
          CONTOUR_INTERVAL: ${{ needs.plan.outputs.opt_contour_interval }}
          ROCKS_ENABLED: ${{ needs.dem.outputs.rocks_enabled || 'false' }}
          ROCKS_SOURCE: ${{ needs.dem.outputs.rock_source }}
          TERRAIN_ENABLED: ${{ needs.dem.outputs.terrain_enabled || 'false' }}
          TERRAIN_SOURCE: ${{ needs.dem.outputs.terrain_dem_source }}
          AREA_BBOX: ${{ needs.plan.outputs.area_bbox }}
          # which branch to fetch a fresh `maps.json` from
          BRANCH: ${{ github.ref_name }}
        run: workers/deploy/apple-archive.sh
      - name: Commit maps.json
        if: ${{ steps.publish.outcome == 'success' }}
        env:
          MAPS_JSON: ${{ steps.publish.outputs.maps_file || 'maps.json' }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: workers/deploy/catalog.sh
