name: Map · style overrides

# The counterpart of the viewer's developer mode (the 🛠 button in the panel):
#
#   developer mode → “Download style-overrides.json” → this workflow →
#   workers/styles/overrides.mjs (check) → poc/web/style-overrides.json →
#   next Build map → the map (web and iOS) with the overrides
#
# The input passes the same validation as in the browser, so no unknown colour,
# invalid hex or nonsensical zoom range reaches the source.

on:
  workflow_dispatch:
    inputs:
      overrides_json:
        description: "Contents of style-overrides.json (copy from developer mode, the “Copy JSON” button)"
        required: false
        default: ""
        type: string
      overrides_url:
        description: "For a big file – a URL of style-overrides.json (e.g. a raw gist)"
        required: false
        default: ""
        type: string
      reset:
        description: "Drop every override and restore the original style"
        required: false
        default: false
        type: boolean
      branch:
        description: "Branch the overrides are written to"
        required: false
        default: master
        type: string
      open_pull_request:
        description: "Open a pull request instead of committing directly"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: style-overrides
  cancel-in-progress: false

jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Prepare the input
        id: input
        env:
          OVERRIDES_JSON: ${{ inputs.overrides_json }}
          OVERRIDES_URL: ${{ inputs.overrides_url }}
        run: |
          set -euo pipefail
          if [ '${{ inputs.reset }}' = 'true' ]; then
            echo "mode=reset" >> "$GITHUB_OUTPUT"
            echo "Mode: reset – the style goes back to the original."
            exit 0
          fi

          if [ -n "$OVERRIDES_URL" ]; then
            echo "Downloading $OVERRIDES_URL"
            curl -fL --retry 3 --retry-delay 3 -o overrides-input.json "$OVERRIDES_URL"
          elif [ -n "$OVERRIDES_JSON" ]; then
            printf '%s' "$OVERRIDES_JSON" > overrides-input.json
          else
            echo "::error::Fill in overrides_json or overrides_url (or turn on reset)."
            exit 1
          fi

          # a readable error right here, not a throw in Node
          if ! jq empty overrides-input.json 2>/dev/null; then
            echo "::error::The input isn't valid JSON. Check that the whole of style-overrides.json was pasted."
            exit 1
          fi
          echo "mode=file" >> "$GITHUB_OUTPUT"
          echo "The input has $(wc -c < overrides-input.json) bytes."

      - name: Check and write the overrides
        run: |
          set -euo pipefail
          if [ '${{ steps.input.outputs.mode }}' = 'reset' ]; then
            node workers/styles/overrides.mjs --reset
          else
            node workers/styles/overrides.mjs --file=overrides-input.json
          fi

      - name: Check the style builds with the overrides
        run: |
          set -euo pipefail
          # the script needs a base-url; this only checks the baked style assembles
          node workers/styles/build.mjs \
            --base-url=https://example.invalid/fricomaps \
            --region=slovensko \
            --overrides=poc/web/style-overrides.json \
            --out=/tmp/style-check
          for f in /tmp/style-check/*.json; do
            jq -e '.version == 8 and (.layers | length > 0)' "$f" >/dev/null \
              || { echo "::error::$f isn't a valid MapLibre style"; exit 1; }
          done
          echo "Styles built ✓"

      - name: Commit
        id: commit
        run: |
          set -euo pipefail
          rm -f overrides-input.json
          if git diff --quiet -- poc/web/style-overrides.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The overrides match the source – nothing to commit."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add poc/web/style-overrides.json

          if [ '${{ inputs.open_pull_request }}' = 'true' ]; then
            BRANCH="style-overrides/$(date -u +%Y%m%d-%H%M%S)"
            git checkout -b "$BRANCH"
            git commit -m "Map style overrides from developer mode"
            git push -u origin "$BRANCH"
            echo "head=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Map style overrides from developer mode"
            git push origin HEAD:'${{ inputs.branch }}'
          fi

      - name: Open a pull request
        if: steps.commit.outputs.changed == 'true' && inputs.open_pull_request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base '${{ inputs.branch }}' \
            --head '${{ steps.commit.outputs.head }}' \
            --title "Map style overrides from developer mode" \
            --body "Generated by **Map · style overrides** from \`poc/web/style-overrides.json\`. After merging run **Build map** so the overrides reach the deployed map."

      - name: Summary
        run: |
          {
            echo "## Style overrides"
            if [ '${{ steps.commit.outputs.changed }}' != 'true' ]; then
              echo "Nothing changed – the source already holds these overrides."
            else
              echo '```json'
              cat poc/web/style-overrides.json
              echo '```'
              echo ""
              echo "To get them into the deployed map, run **Map · Build map region**."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
