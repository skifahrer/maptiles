name: Map · Regenerate state

# ONE LAYER ACROSS A COUNTRY IN ONE CLICK: over every region it runs
# “Regenerate region layer” for the one thing you pick.
#
# The choices are `workers/state/jobs.py`. `points`, `roads`, `boundaries` and
# `water` take minutes per region (the same PBF as the map; `roads` carry the
# routing network too); `contours`, `rocks` and `terrain` tens of minutes to hours.
#
# A relay like “Build map state”: a job has a six-hour cap. The core is
# `workers/state/relay-core.sh`, the rest `regenerate.sh`. Only that one package
# is overwritten on Drive and the `maps.json` entry is added to.

on:
  workflow_dispatch:
    inputs:
      # the list is workers/data/regions.json (the workflow lint guards it)
      country:
        description: "Country – regenerated in every region of it"
        required: true
        default: slovensko
        type: choice
        options:
          - slovensko
      # the list is `workers/state/jobs.py`; cheapest first
      what:
        description: "What to regenerate in every region"
        required: true
        default: points
        type: choice
        options:
          - points
          - roads
          - boundaries
          - water
          - railways
          - history
          - settlements
          - contours
          - rocks
          - terrain
      # sources and slope matter only for DEM layers; values as in the region form
      contour_source:
        description: "Contours – which terrain model (none = don't make)"
        required: false
        default: dmr5
        type: choice
        options:
          - sonny
          - sonny1
          - dmr35
          - dmr5
          - none
      rock_source:
        description: "Rocks – from the model's slope, or from hillshading (none = don't make)"
        required: false
        default: dmr5
        type: choice
        options:
          - sonny
          - sonny1
          - dmr35
          - dmr5
          - shading
          - none
      shading_source:
        description: "Hillshading and 3D terrain – which model (none = don't make)"
        required: false
        default: dmr5
        type: choice
        options:
          - sonny
          - sonny1
          - dmr35
          - dmr5
          - none
      rock_slope:
        description: "From which slope (°) terrain is rock (50 = faces, 40 = steep slopes too)"
        required: false
        default: "50"
        type: string
      # for a batch this tests the batch
      test:
        description: "Quick test: every region only on 4 km² in its middle (a batch trial)"
        required: false
        default: false
        type: boolean
      options:
        description: "Rarely changed settings as key=value (see workers/plan/options.py)"
        required: false
        default: ""
        type: string
      # the relay baton, not a field for people
      continuation:
        description: "Leave empty – the relay baton, the batch passes it itself"
        required: false
        default: ""
        type: string

# `actions: write` is all this workflow does: it dispatches other runs
permissions:
  contents: read
  actions: write

# no `concurrency` on purpose, as in “Build map state”

jobs:
  relay:
    name: Relay leg
    runs-on: ubuntu-latest
    # under the six-hour cap – waiting for a region is capped at 5 h
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Wait for the region, start the next and hand over the relay
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          COUNTRY: ${{ inputs.country }}
          WHAT: ${{ inputs.what }}
          CONTINUATION: ${{ inputs.continuation }}
          CONTOUR_SOURCE: ${{ inputs.contour_source }}
          ROCK_SOURCE: ${{ inputs.rock_source }}
          SHADING_SOURCE: ${{ inputs.shading_source }}
          ROCK_SLOPE: ${{ inputs.rock_slope }}
          TEST: ${{ inputs.test }}
          OPTIONS: ${{ inputs.options }}
        run: workers/state/regenerate.sh
