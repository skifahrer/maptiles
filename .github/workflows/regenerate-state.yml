name: Mapa · Regenerate state

# JEDNA VRSTVA V CELEJ KRAJINE NA JEDNO KLIKNUTIE. Nad každým krajom spustí
# „Pregeneruj vrstvu kraja" pre to jedno, čo si vyberieš.
#
# Zoznam volieb drží `workers/state/jobs.py`. `body`, `cesty`, `hranice`,
# `vodstvo` a `navigacia` sú minúty na kraj (počítajú sa z toho istého PBF ako
# mapa); `vrstevnice`, `skaly` a `tienovanie` desiatky minút až hodiny.
#
# Beží ako štafeta, z toho istého dôvodu ako „Build map state": job má strop
# šesť hodín. Jadro je vo `workers/state/estafeta.sh`, zvyšok v `regenerate.sh`.
#
# Na Drive sa prepíše len ten jeden balík a položka v `maps.json` sa doplní.
# Vrstevnice a skaly sú jeden balík, takže sa počítajú obe (druhá z cache).
# Spadnutý kraj dávku nezastaví, posledný úsek na tom spadne.

on:
  workflow_dispatch:
    inputs:
      # zoznam drží workers/data/regions.json (stráži lint workflowov)
      country:
        description: "Krajina – pregeneruje sa v každom jej kraji"
        required: true
        default: slovensko
        type: choice
        options:
          - slovensko
      # zoznam drží `workers/state/jobs.py`; poradie je od najlacnejšieho
      co:
        description: "Čo pregenerovať v každom kraji"
        required: true
        default: body
        type: choice
        options:
          - body
          - cesty
          - hranice
          - vodstvo
          - navigacia
          - vrstevnice
          - skaly
          - tienovanie
      # zdroje a prah platia len pre vrstvy z výškového modelu – tie idú celým
      # buildom kraja a bez nich by sa postavil s predvolenými hodnotami.
      # Hodnoty aj predvoľby sú tie isté ako vo formulári kraja.
      contour_source:
        description: "Vrstevnice – z ktorého modelu terénu (ziadne = negenerovať)"
        required: false
        default: dmr5
        type: choice
        options:
          - sonny
          - sonny1
          - dmr35
          - dmr5
          - ziadne
      rock_source:
        description: "Skaly – zo sklonu modelu, alebo z tieňovania (ziadne = negenerovať)"
        required: false
        default: dmr5
        type: choice
        options:
          - sonny
          - sonny1
          - dmr35
          - dmr5
          - tienovanie
          - ziadne
      shading_source:
        description: "Tieňovanie a 3D terén – z ktorého modelu (ziadne = negenerovať)"
        required: false
        default: dmr5
        type: choice
        options:
          - sonny
          - sonny1
          - dmr35
          - dmr5
          - ziadne
      rock_slope:
        description: "Od akého sklonu (°) je terén skala (50 = steny, 40 = aj strmé svahy)"
        required: false
        default: "50"
        type: string
      # pri dávke je to skúška samotnej dávky, nie mapy
      test:
        description: "Rýchly test: každý kraj len na 4 km² zo stredu (skúška dávky)"
        required: false
        default: false
        type: boolean
      options:
        description: "Zriedka menené nastavenia ako kľúč=hodnota (viď workers/plan/options.py)"
        required: false
        default: ""
        type: string
      # štafetový kolík, nie pole pre človeka – dávka si ho vypĺňa sama.
      # Vstup a nie súbor v repozitári: nevznikajú commity, ktoré by sa bili
      # s `maps.json` od práve bežiaceho kraja.
      pokracovanie:
        description: "Nevypĺňaj – kolík štafety, dávka si ho podáva sama"
        required: false
        default: ""
        type: string

# `actions: write` je to jediné, čo tento workflow robí: spúšťa iné behy
permissions:
  contents: read
  actions: write

# zámerne bez `concurrency`, ako pri „Build map state": pri troch behoch
# v skupine GitHub prostredný zruší a dávka by si sama odhryzla článok

jobs:
  estafeta:
    name: Úsek štafety
    runs-on: ubuntu-latest
    # pod stropom šiestich hodín s rezervou – čakanie na kraj má strop 5 h
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Počkaj na kraj, spusti ďalší a odovzdaj štafetu
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          COUNTRY: ${{ inputs.country }}
          CO: ${{ inputs.co }}
          POKRACOVANIE: ${{ inputs.pokracovanie }}
          CONTOUR_SOURCE: ${{ inputs.contour_source }}
          ROCK_SOURCE: ${{ inputs.rock_source }}
          SHADING_SOURCE: ${{ inputs.shading_source }}
          ROCK_SLOPE: ${{ inputs.rock_slope }}
          TEST: ${{ inputs.test }}
          OPTIONS: ${{ inputs.options }}
        run: workers/state/regenerate.sh
