name: Mapa · dopravná sieť

# CELÁ DOPRAVNÁ SIEŤ z OSM do vlastného `.pmtiles`: cesty od diaľnice po
# schody, železnice, električky a metro, trajekty a lanovky. Rozpis je
# v hlavičke `workers/transport/transport.yml`. Ten istý vzor ako trasy
# a krajinné prvky: to isté PBF sa číta druhýkrát vlastnou schémou.
#
# Samostatný súbor preto, že `build-map-region.yml` je pri strope 128 KiB, nad
# ktorým GitHub workflow ticho neprijme. Cena: vstupy sa píšu dvakrát
# a `workflow_call` nededí ani `env`, ani `secrets` volajúceho.

on:
  workflow_call:
    inputs:
      region_key:
        description: "Kľúč regiónu – z neho je meno `{region}-transport.pmtiles`"
        required: true
        type: string
      region_bbox:
        description: "Bbox regiónu pre orez dlaždíc (workers/lib/region-clip.sh)"
        required: true
        type: string
      maxzoom:
        description: "Najvyšší zoom dlaždíc s dopravnou sieťou"
        required: false
        default: "14"
        type: string
      region_clip:
        description: "Orezať dlaždice na hranicu regiónu"
        required: false
        default: "false"
        type: string
      size_limit_mb:
        description: "Rozpočet celej stránky v MB"
        required: false
        default: "900"
        type: string
      budget_pct:
        description: "Podiel dopravnej siete na rozpočte stránky v percentách"
        required: false
        default: "8"
        type: string
      day:
        description: "Dátum pre kľúč cache Planetileru"
        required: false
        default: ""
        type: string
    outputs:
      enabled:
        description: "Vznikla vrstva? (vo výreze nemusí byť ani jedna cesta)"
        value: ${{ jobs.transport.outputs.enabled }}
      maxzoom:
        description: "Zoom, po ktorý dlaždice naozaj sú"
        value: ${{ jobs.transport.outputs.maxzoom }}
      size_mb:
        description: "Veľkosť vrstvy v MB"
        value: ${{ jobs.transport.outputs.size_mb }}
    # `workflow_call` nededí secrets sám. Bez nich sa cache na Drive nemá ako
    # otvoriť a Planetiler (93 MB) sa ťahá pri každom behu.
    secrets:
      GDRIVE_CREDENTIALS:
        required: false
      DRIVE_SECRET:
        required: false
      DRIVE_REFRESH:
        required: false

# prihlásenie na Drive pre celý workflow, nie po kroku: `cache-restore`
# a `cache-save` sú dva kroky a jeden bez tokenu by ťahal všetko odznova
env:
  GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
  DRIVE_CLIENT: ${{ vars.DRIVE_CLIENT }}
  DRIVE_SECRET: ${{ secrets.DRIVE_SECRET }}
  DRIVE_REFRESH: ${{ secrets.DRIVE_REFRESH }}

jobs:
  transport:
    name: Dopravná sieť
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.transport.outputs.enabled }}
      maxzoom: ${{ steps.transport.outputs.maxzoom }}
      size_mb: ${{ steps.transport.outputs.size_mb }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Priprav priečinok na meranie
        run: mkdir -p steps-out

      - name: Stiahni PBF z prípravy
        uses: actions/download-artifact@v8
        with:
          name: pbf
          path: data

      # polygón regiónu je `--polygon` pre Planetiler; `continue-on-error`,
      # lebo aj bez neho sa beh dokončiť dá (dlaždice budú na bboxe)
      - name: Stiahni polygón regiónu
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: region-poly
          path: data

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Planetileru (restore)
        id: planetiler-cache
        uses: ./.github/actions/cache-restore
        with:
          path: planetiler.jar
          key: planetiler-latest-${{ inputs.day }}

      - name: Stiahni Planetiler
        run: workers/lib/planetiler.sh
      - name: Cache Planetileru (save)
        if: ${{ always() && steps.planetiler-cache.outputs.cache-hit != 'true' && hashFiles('planetiler.jar') != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: planetiler.jar
          key: ${{ steps.planetiler-cache.outputs.cache-primary-key }}

      # testy schémy pred stavbou: sú v nej ako `examples` a je to jediná vec,
      # ktorá o schéme povie pravdu bez celého behu. Beží ako prvé.
      - name: Testy schémy dopravnej siete
        run: java -jar planetiler.jar verify workers/transport/transport.yml

      # rozpis je vo `workers/transport/build.sh`
      - name: Dopravná sieť z OSM → PMTiles
        id: transport
        env:
          OPT_TRANSPORT_MAXZOOM: ${{ inputs.maxzoom }}
          OPT_REGION_CLIP: ${{ inputs.region_clip }}
          REGION_BBOX: ${{ inputs.region_bbox }}
          REGION_KEY: ${{ inputs.region_key }}
          SIZE_LIMIT_MB: ${{ inputs.size_limit_mb }}
          BUDGET_TRANSPORT_PCT: ${{ inputs.budget_pct }}
        run: workers/transport/build.sh

      - name: Odlož časť stránky
        if: ${{ always() && hashFiles('_site/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: site-transport
          path: _site
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore

      - name: Odlož meranie krokov
        if: ${{ always() && hashFiles('steps-out/*') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: steps-transport
          path: steps-out
          retention-days: 1
          if-no-files-found: ignore
