name: Map · transport network

# THE WHOLE TRANSPORT NETWORK from OSM into its own `.pmtiles`: roads from
# motorways to steps, railways, trams and metro, ferries and aerialways. See the
# `workers/transport/transport.yml` header. The same pattern as trails and
# landscape features: the same PBF read a second time with its own schema.
#
# A file of its own because `build-map-region.yml` is near the 128 KiB cap, above
# which GitHub quietly rejects a workflow. The cost: inputs are written twice
# and `workflow_call` inherits neither the caller's `env` nor its `secrets`.

on:
  workflow_call:
    inputs:
      region_key:
        description: "Region key – it names `{region}-transport.pmtiles`"
        required: true
        type: string
      region_bbox:
        description: "Region bbox for clipping tiles (workers/lib/region-clip.sh)"
        required: true
        type: string
      maxzoom:
        description: "Highest zoom of the transport tiles"
        required: false
        default: "14"
        type: string
      region_clip:
        description: "Clip tiles to the region border"
        required: false
        default: "false"
        type: string
      size_limit_mb:
        description: "The whole page budget in MB"
        required: false
        default: "900"
        type: string
      budget_pct:
        description: "The transport network's share of the page budget in percent"
        required: false
        default: "8"
        type: string
      day:
        description: "Date for the Planetiler cache key"
        required: false
        default: ""
        type: string
    outputs:
      enabled:
        description: "Was the layer made? (a cutout may hold no road)"
        value: ${{ jobs.transport.outputs.enabled }}
      maxzoom:
        description: "The zoom tiles really go up to"
        value: ${{ jobs.transport.outputs.maxzoom }}
      size_mb:
        description: "Layer size in MB"
        value: ${{ jobs.transport.outputs.size_mb }}
    # `workflow_call` doesn't inherit secrets; without them the Drive cache can't
    # open and Planetiler (93 MB) is downloaded on every run.
    secrets:
      GDRIVE_CREDENTIALS:
        required: false
      DRIVE_SECRET:
        required: false
      DRIVE_REFRESH:
        required: false

# Drive sign-in for the whole workflow, not per step: `cache-restore` and
# `cache-save` are two steps and one without a token would download everything again
env:
  GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
  DRIVE_CLIENT: ${{ vars.DRIVE_CLIENT }}
  DRIVE_SECRET: ${{ secrets.DRIVE_SECRET }}
  DRIVE_REFRESH: ${{ secrets.DRIVE_REFRESH }}

jobs:
  transport:
    name: Transport network
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.transport.outputs.enabled }}
      maxzoom: ${{ steps.transport.outputs.maxzoom }}
      size_mb: ${{ steps.transport.outputs.size_mb }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Prepare the timing folder
        run: mkdir -p steps-out

      - name: Download the PBF from the plan
        uses: actions/download-artifact@v8
        with:
          name: pbf
          path: data

      # the region polygon is Planetiler's `--polygon`; `continue-on-error`, since
      # the run finishes without it too (tiles then follow the bbox)
      - name: Download the region polygon
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: region-poly
          path: data

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Planetileru (restore)
        id: planetiler-cache
        uses: ./.github/actions/cache-restore
        with:
          path: planetiler.jar
          key: planetiler-latest-${{ inputs.day }}

      - name: Stiahni Planetiler
        run: workers/lib/planetiler.sh
      - name: Cache Planetileru (save)
        if: ${{ always() && steps.planetiler-cache.outputs.cache-hit != 'true' && hashFiles('planetiler.jar') != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: planetiler.jar
          key: ${{ steps.planetiler-cache.outputs.cache-primary-key }}

      # schema tests before the build (`examples`) – the one thing that tells the
      # truth about a schema without a whole run. They go first.
      - name: Transport schema tests
        run: java -jar planetiler.jar verify workers/transport/transport.yml

      # described in `workers/transport/build.sh`
      - name: Transport network from OSM → PMTiles
        id: transport
        env:
          OPT_TRANSPORT_MAXZOOM: ${{ inputs.maxzoom }}
          OPT_REGION_CLIP: ${{ inputs.region_clip }}
          REGION_BBOX: ${{ inputs.region_bbox }}
          REGION_KEY: ${{ inputs.region_key }}
          SIZE_LIMIT_MB: ${{ inputs.size_limit_mb }}
          BUDGET_TRANSPORT_PCT: ${{ inputs.budget_pct }}
        run: workers/transport/build.sh

      - name: Upload the site part
        if: ${{ always() && hashFiles('_site/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: site-transport
          path: _site
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore

      - name: Upload the step timing
        if: ${{ always() && hashFiles('steps-out/*') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: steps-transport
          path: steps-out
          retention-days: 1
          if-no-files-found: ignore
