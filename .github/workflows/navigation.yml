name: Map · Build routing

# ROUTING GRAPH (Valhalla) – what a route can be led along. A map tile can't
# route: it's a drawing with clipped geometry and no turn restrictions. The
# whole brief is in `docs/navigation.md`.
#
# A pipeline of its own: other data (whole national extracts – a cut PBF would
# have dead ends at the border), another lifetime and output (nothing goes to
# Pages). The package and `maps.json` still come from `workers/deploy/publish-map.py`.
#
# `multimodal` (bus, train) isn't in the graph yet: it stands on GTFS, which
# OSM lacks. `graph.json` says so about itself.

on:
  workflow_dispatch:
    inputs:
      # the list is in `workers/data/routing-areas.json`; GitHub's `choice` can't
      # read a file, so it's written here too and the lint compares them
      area:
        description: "Graph scope (neighbours = a costly run, but a route crosses the border)"
        required: false
        default: "slovensko"
        type: choice
        options:
          - "slovensko"
          - "slovensko_susedia"
      # the graph and the phone's library must match; the one used goes into `graph.json`
      valhalla_image:
        description: "Valhalla Docker image (a tag rather than latest)"
        required: false
        default: "ghcr.io/valhalla/valhalla-scripted:latest"
        type: string
      publish:
        description: "Upload the package to Drive and write it into maps.json"
        required: false
        default: true
        type: boolean

# Drive: the finished package goes here. Sign-in for the whole workflow, not per step.
env:
  GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
  DRIVE_CLIENT: ${{ vars.DRIVE_CLIENT }}
  DRIVE_SECRET: ${{ secrets.DRIVE_SECRET }}
  DRIVE_REFRESH: ${{ secrets.DRIVE_REFRESH }}
  OSMFR_BASE: https://download.openstreetmap.fr/extracts

jobs:
  graph:
    name: Routing graph
    runs-on: ubuntu-latest
    permissions:
      # `write`: `maps.json` is the only place the run writes into the repository
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Prepare the timing folder
        run: mkdir -p steps-out

      # `osmium merge` is needed only for several extracts, but installing takes
      # seconds and a conditional step would be one more thing to drift
      - name: Install osmium-tool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool

      # described in `workers/routing/pbf.sh`
      - name: PBF for the graph
        id: pbf
        env:
          AREA: ${{ inputs.area }}
        run: workers/routing/pbf.sh

      # described in `workers/routing/graph.sh`; Docker is on the runner
      - name: Valhalla graph from the PBF
        id: graph
        env:
          AREA: ${{ inputs.area }}
          VALHALLA_IMAGE: ${{ inputs.valhalla_image }}
        run: workers/routing/graph.sh

      # the region key sits next to the scope in `routing-areas.json` – it isn't
      # derived from the scope name (the name is a promise about the scope)
      - name: Region key and layers for the catalog
        id: cat
        env:
          AREA: ${{ inputs.area }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          areas = json.load(open("workers/data/routing-areas.json",
                                 encoding="utf-8"))["areas"]
          a = areas[os.environ["AREA"]]
          print(f"region_key={a['region_key']}")
          # `MAP_LAYERS` for a pipeline that makes no region map: without it
          # `publish-map.py` would write “no_contours, no_rocks, no_shading”
          print("map_layers=graph," + ",".join(a["countries"]).lower())
          PY

      - name: Upload the package to Drive and write maps.json
        id: publish
        if: ${{ inputs.publish }}
        env:
          AREA_KEY: whole
          TEST_KM2: "0"
          REGION_KEY: ${{ steps.cat.outputs.region_key }}
          MAP_LAYERS: ${{ steps.cat.outputs.map_layers }}
        run: |
          set -euo pipefail
          python3 workers/deploy/publish-map.py --site=_site --maps=maps.json \
            --summary="$GITHUB_STEP_SUMMARY"

      # the same script Build map commits the catalog with – rebase included
      - name: Commit maps.json
        if: ${{ inputs.publish && steps.publish.outcome == 'success' }}
        env:
          MAPS_JSON: ${{ steps.publish.outputs.maps_file || 'maps.json' }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: workers/deploy/catalog.sh

      - name: Upload the step timing
        if: ${{ always() && hashFiles('steps-out/*') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: steps-routing
          path: steps-out
          retention-days: 1
          if-no-files-found: ignore
