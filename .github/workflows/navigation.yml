name: Mapa · Build navigácia

# NAVIGAČNÝ GRAF (Valhalla) – to, po čom sa dá viesť trasa. Z dlaždice sa
# routovať nedá: je to kreslený obraz s orezanou geometriou a bez odbočovacích
# zákazov. Celé zadanie je v `docs/navigation.md`.
#
# Vlastná pipeline: iné dáta (celé štátne extrakty – rezaný PBF by mal na
# hranici slepé ulice), iná životnosť a iný výstup (na Pages nejde nič).
# Balík aj `maps.json` robí ďalej `workers/deploy/publish-map.py`.
#
# `multimodal` (autobus, vlak) v grafe zatiaľ nie je: stojí na GTFS, ktoré
# v OSM nie sú. `graf.json` to o sebe hovorí.

on:
  workflow_dispatch:
    inputs:
      # zoznam je vo `workers/data/routing-areas.json`; `choice` GitHub zo
      # súboru prečítať nevie, tak sa píše aj sem a lint to porovná
      area:
        description: "Rozsah grafu (susedia = drahý beh, ale trasa prejde hranicu)"
        required: false
        default: "slovensko"
        type: choice
        options:
          - "slovensko"
          - "slovensko_susedia"
      # graf a knižnica v telefóne si musia sedieť; použité ide do `graf.json`
      valhalla_image:
        description: "Docker obraz Valhally (radšej s tagom než latest)"
        required: false
        default: "ghcr.io/valhalla/valhalla-scripted:latest"
        type: string
      publish:
        description: "Nahrať balík na Drive a zapísať do maps.json"
        required: false
        default: true
        type: boolean

# Drive: sem ide hotový balík. Prihlásenie pre celý workflow, nie po kroku.
env:
  GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
  DRIVE_CLIENT: ${{ vars.DRIVE_CLIENT }}
  DRIVE_SECRET: ${{ secrets.DRIVE_SECRET }}
  DRIVE_REFRESH: ${{ secrets.DRIVE_REFRESH }}
  OSMFR_BASE: https://download.openstreetmap.fr/extracts

jobs:
  graf:
    name: Navigačný graf
    runs-on: ubuntu-latest
    permissions:
      # `write`: `maps.json` je jediné miesto, kde beh zapisuje do repozitára
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Priprav priečinok na meranie
        run: mkdir -p steps-out

      # `osmium merge` treba len pri viacerých extraktoch, ale inštalácia je
      # sekundy a podmienený krok by bol ďalšia vec, čo sa môže rozísť
      - name: Nainštaluj osmium-tool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool

      # rozpis je vo `workers/routing/pbf.sh`
      - name: PBF pre graf
        id: pbf
        env:
          AREA: ${{ inputs.area }}
        run: workers/routing/pbf.sh

      # rozpis je vo `workers/routing/graph.sh`; Docker je na runneri
      - name: Graf Valhally z PBF
        id: graph
        env:
          AREA: ${{ inputs.area }}
          VALHALLA_IMAGE: ${{ inputs.valhalla_image }}
        run: workers/routing/graph.sh

      # kľúč regiónu je v `routing-areas.json` vedľa rozsahu – neodvodzuje sa
      # z mena rozsahu (meno je sľub o rozsahu)
      - name: Kľúč regiónu a vrstvy do katalógu
        id: kat
        env:
          AREA: ${{ inputs.area }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          areas = json.load(open("workers/data/routing-areas.json",
                                 encoding="utf-8"))["areas"]
          a = areas[os.environ["AREA"]]
          print(f"region_key={a['region_key']}")
          # `MAP_LAYERS` je pre pipeline, ktorá nerobí mapu kraja: bez neho by
          # `publish-map.py` napísal „bez_vrstevnic, bez_skal, bez_tienovania"
          print("map_layers=graf," + ",".join(a["countries"]).lower())
          PY

      - name: Nahraj balík na Drive a zapíš do maps.json
        id: publish
        if: ${{ inputs.publish }}
        env:
          AREA_KEY: cely
          TEST_KM2: "0"
          REGION_KEY: ${{ steps.kat.outputs.region_key }}
          MAP_LAYERS: ${{ steps.kat.outputs.map_layers }}
        run: |
          set -euo pipefail
          python3 workers/deploy/publish-map.py --site=_site --maps=maps.json \
            --summary="$GITHUB_STEP_SUMMARY"

      # ten istý skript, akým katalóg commituje Build map – vrátane rebasu
      - name: Commitni maps.json
        if: ${{ inputs.publish && steps.publish.outcome == 'success' }}
        env:
          MAPS_JSON: ${{ steps.publish.outputs.maps_file || 'maps.json' }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: workers/deploy/catalog.sh

      - name: Odlož meranie krokov
        if: ${{ always() && hashFiles('steps-out/*') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: steps-routing
          path: steps-out
          retention-days: 1
          if-no-files-found: ignore
