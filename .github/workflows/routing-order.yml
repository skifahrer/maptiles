name: Navigácia · poradie uzlov

# PORADIE UZLOV PRE CCH nad celým stavaným územím – jediná drahá časť, ktorá
# do telefónu nepatrí (rozpis v `docs/navigation.md` §11).
#
# RUČNÉ PREPOČÍTANIE. Build kraja (`navigation-region.yml`) si poradie berie
# z cache na Drive a keď tam nie je alebo je staršie než 30 dní, dopočíta ho
# sám tým istým skriptom (`workers/routing/order.sh`). Tento workflow je na
# to, keď má byť nové skôr – keď to `tiles.py` v builde kraja vypýta
# (::warning:: „sieť sa od jeho výpočtu zmenila").
#
# Nezávisí od profilu ani od cien, len od TVARU siete; uzol, ktorý pribudol
# po jeho výpočte, dostane rank na konci podľa OSM id (`tiles.py`), takže
# mierne zastarané poradie je stále platné poradie. Nové poradie má nové id
# a kraje so starým sa s ním v telefóne spojiť nesmú – po prepočítaní treba
# prestavať všetky („Mapa · Regenerate state", voľba `cesty`).

on:
  workflow_dispatch:
    inputs:
      # zoznam je vo `workers/data/routing-areas.json`; `choice` GitHub zo
      # súboru prečítať nevie, tak sa píše aj sem a lint to porovná
      area:
        description: "Územie, nad ktorým sa poradie počíta"
        required: false
        default: "slovensko"
        type: choice
        options:
          - "slovensko"
          - "slovensko_susedia"

# Drive: sem ide hotové poradie (cache). Prihlásenie pre celý workflow.
env:
  GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
  DRIVE_CLIENT: ${{ vars.DRIVE_CLIENT }}
  DRIVE_SECRET: ${{ secrets.DRIVE_SECRET }}
  DRIVE_REFRESH: ${{ secrets.DRIVE_REFRESH }}
  OSMFR_BASE: https://download.openstreetmap.fr/extracts

jobs:
  poradie:
    name: Poradie uzlov
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Priprav priečinok na meranie
        run: mkdir -p steps-out

      # ten istý skript, akým si poradie dopočíta build kraja; `FORCE`, lebo
      # tento workflow sa spúšťa práve preto, že čerstvé nestačí
      - name: Poradie uzlov z PBF územia
        id: order
        env:
          AREA: ${{ inputs.area }}
          FORCE: "true"
        run: workers/routing/order.sh

      # kľúč nesie `run_id`, lebo existujúci sa neprepisuje; build kraja ho
      # hľadá cez `restore-keys` (predpona, najnovší záznam vyhrá)
      - name: Ulož poradie do cache na Drive
        uses: ./.github/actions/cache-save
        with:
          path: data/routing-order.json
          key: routing-order-v1-${{ inputs.area }}-${{ github.run_id }}

      - name: Zhrnutie
        env:
          AREA: ${{ inputs.area }}
          ORDER_ID: ${{ steps.order.outputs.id }}
          UZLOV: ${{ steps.order.outputs.uzlov }}
        run: |
          set -euo pipefail
          {
            echo "## Poradie uzlov · $AREA"
            echo
            echo "* id poradia: \`$ORDER_ID\`"
            echo "* uzlov: $UZLOV"
            echo
            echo "Kraje postavené OD TERAZ ho dostanú do archívu; tie staršie"
            echo "nesú predošlé id a s novými sa v telefóne spojiť nesmú, takže"
            echo "ich treba prestavať (\`Mapa · Regenerate state\`, voľba"
            echo "\`cesty\`)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Odlož meranie krokov
        if: ${{ always() && hashFiles('steps-out/*') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: steps-routing-order
          path: steps-out
          retention-days: 1
          if-no-files-found: ignore
