name: Routing · node order

# CCH NODE ORDER over the whole built area – the one costly part that doesn't
# belong on the phone (described in `docs/navigation.md` §11).
#
# A MANUAL RECOMPUTE. A region build (`navigation-region.yml`) takes the order
# from the Drive cache and when it's missing or older than 30 days computes it
# itself with the same script (`workers/routing/order.sh`). This workflow is for
# when a new one is wanted sooner – when `tiles.py` asks for it in a region build
# (::warning:: “the network changed since it was computed”).
#
# It depends on no profile or cost, only on the network's SHAPE; a node added
# after it was computed gets a rank at the end by OSM id (`tiles.py`), so a
# slightly stale order is still a valid order. A new order has a new id and
# regions with the old one must not be joined with it on the phone – after a
# recompute rebuild them all (“Map · Regenerate state”, option `roads`).

on:
  workflow_dispatch:
    inputs:
      # the list is in `workers/data/routing-areas.json`; GitHub's `choice` can't
      # read a file, so it's written here too and the lint compares them
      area:
        description: "The area the order is computed over"
        required: false
        default: "slovensko"
        type: choice
        options:
          - "slovensko"
          - "slovensko_susedia"

# Drive: the finished order goes here (cache). Sign-in for the whole workflow.
env:
  GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
  DRIVE_CLIENT: ${{ vars.DRIVE_CLIENT }}
  DRIVE_SECRET: ${{ secrets.DRIVE_SECRET }}
  DRIVE_REFRESH: ${{ secrets.DRIVE_REFRESH }}
  OSMFR_BASE: https://download.openstreetmap.fr/extracts

jobs:
  order:
    name: Node order
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Prepare the timing folder
        run: mkdir -p steps-out

      # the same script a region build computes the order with; `FORCE`, since
      # this workflow runs precisely because a fresh one isn't enough
      - name: Node order from the area PBF
        id: order
        env:
          AREA: ${{ inputs.area }}
          FORCE: "true"
        run: workers/routing/order.sh

      # the key carries `run_id` since an existing one isn't overwritten; a region
      # build finds it through `restore-keys` (a prefix, the newest entry wins)
      - name: Save the order to the Drive cache
        uses: ./.github/actions/cache-save
        with:
          path: data/routing-order.json
          key: routing-order-v1-${{ inputs.area }}-${{ github.run_id }}

      - name: Summary
        env:
          AREA: ${{ inputs.area }}
          ORDER_ID: ${{ steps.order.outputs.id }}
          NODES: ${{ steps.order.outputs.nodes }}
        run: |
          set -euo pipefail
          {
            echo "## Node order · $AREA"
            echo
            echo "* order id: \`$ORDER_ID\`"
            echo "* nodes: $NODES"
            echo
            echo "Regions built FROM NOW ON get it in their archive; older ones"
            echo "carry the previous id and must not be joined with new ones on"
            echo "the phone, so rebuild them (\`Map · Regenerate state\`, option"
            echo "\`roads\`)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the step timing
        if: ${{ always() && hashFiles('steps-out/*') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: steps-routing-order
          path: steps-out
          retention-days: 1
          if-no-files-found: ignore
