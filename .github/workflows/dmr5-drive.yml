name: Data · DMR 5.0

# Elevation model from DMR 5.0 (ETRS89), kept on Drive as two bare BigTIFFs.
# The only way to DMR 5.0:
#
#   area: <range>          →  ugkk-<range>.tif     →  store `dem-ugkk`
#   area: whole_country    →  tiles N49E019.tif    →  store `dem-dmr5-v2`
#
# Build map calls it twice – both shapes may be missing at once. Stores are
# Drive folders (`workers/drive/store.py`), not GitHub releases.
#
# Read signed in as the data owner: only the Drive API says what is in a folder.
# When Drive refuses, `serve.py` returns 502 and the run fails within seconds.
#
# Heights are ellipsoidal (+42.6 m geoid); EGM2008 is subtracted by default.

on:
  workflow_dispatch:
    inputs:
      area:
        description: "Area. A range goes to dem-ugkk, the whole country to dem-dmr5-v2"
        required: true
        default: vysoke_tatry
        type: choice
        options:
          - whole_country
          - tatry
          - vysoke_tatry
          - belianske_tatry
          - zapadne_tatry
          - nizke_tatry
          - slovensky_raj
          - pieniny
          - mala_fatra
          - velka_fatra
          - sulovske_skaly
          - slovensky_kras
          - muranska_planina
          - vihorlat
          - strazovske_vrchy
          - male_karpaty
      grid_m:
        description: "Output grid"
        required: false
        default: "auto (1 m for a range, 5 m for the whole country)"
        type: choice
        options:
          - "auto (1 m for a range, 5 m for the whole country)"
          - "1 m – full resolution, a range only"
          - "2 m – from overviews, a quarter of the volume"
          - "5 m – the whole country"
          - "10 m"
          - "20 m – quick test"
      geoid:
        description: "Heights in the output"
        required: false
        default: "EGM2008 (≈ Bpv) – like the other sources"
        type: choice
        options:
          - "EGM2008 (≈ Bpv) – like the other sources"
          - "ellipsoidal ETRS89 – as they are in the file"
      mode:
        description: "What to do"
        required: false
        default: "model to the store"
        type: choice
        options:
          - "model to the store"
          - "probe only – what is in the source, nothing is cut"
      # tiles for a smaller area too: the window widens to whole degrees.
      # Exactly what Build map refills for hillshading, which can't use a cut-out.
      tiles:
        description: "Make 1° tiles into dem-dmr5-v2 for a range too (otherwise one cut-out)"
        required: false
        default: false
        type: boolean
      jobs:
        description: "How many blocks to read at once. Drive is latent, not narrow"
        required: false
        default: "12"
        type: string
      # `inputs.asset` must be declared for both triggers
      asset:
        description: "File name of a cut-out (empty = ugkk-<area>.tif)"
        required: false
        default: ""
        type: string

  # Build map calls it too when its store lacks the model; `workflow_call` has
  # no `type: choice`, so bare values come here. Build map passes a BBOX, not a
  # range key: only it knows what to read, so the result name comes in `asset`.
  workflow_call:
    inputs:
      area:
        required: true
        type: string
      asset:
        # required with a bbox in `area`: the build looks the file up by name
        required: false
        default: ""
        type: string
      grid_m:
        # empty = by extent (1 m for a cut-out, 5 m for tiles)
        required: false
        default: ""
        type: string
      tiles:
        # true = 1° tiles into dem-dmr5-v2, false = one COG into dem-ugkk
        required: false
        default: false
        type: boolean
      geoid:
        required: false
        default: egm2008
        type: string
      jobs:
        required: false
        default: "12"
        type: string
      # here so `inputs.mode` is declared for both triggers
      mode:
        required: false
        default: "model to the store"
        type: string
    secrets:
      # the data owner's sign-in, in two shapes; `DRIVE_CLIENT` is a repository
      # variable. Without it the public link with its daily limit is read.
      GDRIVE_CREDENTIALS:
        required: false
      DRIVE_SECRET:
        required: false
      DRIVE_REFRESH:
        required: false

# publishes to Drive, not releases
permissions:
  contents: read

concurrency:
  # two runs at once would download twice and overwrite the same asset; the
  # shape is in the key since Build map refills both concurrently
  group: dmr5-drive-${{ inputs.tiles }}-${{ inputs.area }}
  cancel-in-progress: false

jobs:
  model:
    name: Elevation model from Drive
    runs-on: ubuntu-latest
    # split into many steps so a failed hour-long run says where it failed;
    # plan, read and finish are stages of one script (`--stage`) sharing
    # `drive-work/`, so a retried step computes only the rest
    env:
      # signing in as the owner raises the download limit; see workers/drive/auth.py
      GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
      DRIVE_CLIENT: ${{ vars.DRIVE_CLIENT }}
      DRIVE_SECRET: ${{ secrets.DRIVE_SECRET }}
      DRIVE_REFRESH: ${{ secrets.DRIVE_REFRESH }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install GDAL
        run: |
          set -euo pipefail
          echo "Installing gdal-bin and jq…"
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin jq
          echo "GDAL: $(gdalinfo --version)"

      - name: Free disk space
        run: |
          set -uo pipefail
          echo "Free space before cleanup:"
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          echo "Free space after cleanup:"
          df -h / | tail -1

      # the only place where the form becomes concrete numbers and names
      - name: Settings
        id: cfg
        run: |
          set -euo pipefail
          AREA='${{ inputs.area }}'
          [ "$AREA" = cele_slovensko ] && AREA=whole_country
          # the whole country is always tiles – one COG per country would be
          # tens of GB. `tiles: true` is for hillshading in Build map.
          TILES=false
          if [ '${{ inputs.tiles }}' = 'true' ] || [ "$AREA" = whole_country ]; then
            TILES=true
          fi
          # the store comes from `workers/dem/target.py`, like in `check-dem` and `fetch.sh`
          KEY=whole
          [ "$TILES" = true ] || KEY="$AREA"
          REL=$(python3 workers/dem/target.py --source=dmr5 --area-key="$KEY" \
                | sed -n 's/^store=//p')
          if [ -z "$REL" ]; then
            echo "::error::workers/dem/target.py did not say which store DMR 5.0 goes to. Without it the run would read Drive for an hour with nowhere to put it."
            exit 1
          fi
          SRC=dmr5

          # a bbox can't name the asset (`ugkk-20,49,21,50.tif`), so `asset` comes separately
          ASSET='${{ inputs.asset }}'
          case "$AREA" in
            *,*) if [ "$TILES" != true ] && [ -z "$ASSET" ]; then
                   echo '::error::A bbox in "area" without "asset" only works with "tiles: true" – a cut-out asset is named after its range and Build map cannot ask for "ugkk-20,49,21,50.tif". Pick a range, fill in asset, or turn on tiles.'
                   exit 1
                 fi ;;
          esac
          if [ "$TILES" != true ] && [ -z "$ASSET" ]; then
            ASSET="ugkk-${AREA}.tif"
          fi

          GRID=$(printf '%s' '${{ inputs.grid_m }}' | grep -oE '^[0-9]+' || true)
          if [ -z "$GRID" ]; then
            GRID=$([ "$TILES" = true ] && echo 5 || echo 1)
          fi

          # a 1°×1° tile at 1 m holds ~48 GB of raw cells; the runner has ~60 GB free
          if [ "$TILES" = true ] && [ "$GRID" -lt 3 ]; then
            echo "::error::Tiles at a ${GRID} m grid don't fit the runner (one 1° tile at a metre holds ~48 GB of cells, ~60 GB is free). Pick 5 m, or a range with tiles off."
            exit 1
          fi

          case '${{ inputs.geoid }}' in
            elipsoid*|ellipsoid*) GEOID=ellipsoid ;;
            *) GEOID=egm2008 ;;
          esac

          {
            echo "grid=$GRID"
            echo "store=$REL"
            echo "dem_source=$SRC"
            echo "tiles=$TILES"
            echo "asset=$ASSET"
            echo "area=$AREA"
            echo "whole_country=$([ "$AREA" = whole_country ] && echo true || echo false)"
            echo "geoid=$GEOID"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## What this run does"
            echo
            echo "| setting | value |"
            echo "|---|---|"
            echo "| area | \`$AREA\` |"
            echo "| grid | ${GRID} m |"
            echo "| shape | $([ "$TILES" = true ] && echo '1° tiles' || echo "cut-out \`$ASSET\`") |"
            echo "| store | \`$REL\` |"
            echo "| heights | $GEOID |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "── $AREA, grid ${GRID} m, heights $GEOID, shape $([ "$TILES" = true ] && echo tiles || echo "cut-out $ASSET") → store $REL"

      # its own step: failing here means the secret is wrong, not the data or network
      - name: Drive sign-in (data owner)
        run: python3 workers/drive/dmr5.py --auth-check

      # opening the source costs 8 s and 0.3 MB, so it always runs
      - name: Probe – what is in the source on Drive
        run: python3 workers/drive/dmr5.py --probe-only

      # a cheap step answering one question before an hour of reading: how much
      - name: Read plan (window, blocks, estimate)
        id: plan
        if: ${{ !startsWith(inputs.mode, 'probe only') && !startsWith(inputs.mode, 'len sonda') }}
        run: |
          set -euo pipefail
          # an array, not a string: argparse would take an empty string as a value
          ARGS=()
          if [ '${{ steps.cfg.outputs.tiles }}' = 'true' ]; then
            ARGS+=(--tiles)
          else
            ARGS+=(--asset="${{ steps.cfg.outputs.asset }}")
          fi
          python3 workers/drive/dmr5.py --stage=plan \
            --area='${{ steps.cfg.outputs.area }}' \
            --grid-m='${{ steps.cfg.outputs.grid }}' \
            --geoid='${{ steps.cfg.outputs.geoid }}' \
            --jobs='${{ inputs.jobs }}' \
            "${ARGS[@]}" \
            --out=out --work=drive-work

      # the long part and the only one on the network; progress after each block
      - name: Read blocks from Drive
        if: ${{ !startsWith(inputs.mode, 'probe only') && !startsWith(inputs.mode, 'len sonda') }}
        run: |
          set -euo pipefail
          python3 workers/drive/dmr5.py --stage=read \
            --geoid='${{ steps.cfg.outputs.geoid }}' \
            --jobs='${{ inputs.jobs }}' \
            --out=out --work=drive-work

      # disk only: failing here is the height conversion or disk space
      - name: Assemble the output (mosaic, heights, COG/tiles)
        if: ${{ !startsWith(inputs.mode, 'probe only') && !startsWith(inputs.mode, 'len sonda') }}
        run: |
          set -euo pipefail
          python3 workers/drive/dmr5.py --stage=finish \
            --geoid='${{ steps.cfg.outputs.geoid }}' \
            --out=out --work=drive-work \
            --summary=model-summary.md
          echo "Made:"
          ls -lh out/*.tif

      # its own step: this rejects the request, it isn't a failed computation
      - name: Asset size check
        if: ${{ !startsWith(inputs.mode, 'probe only') && !startsWith(inputs.mode, 'len sonda') }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          FILES=(out/*.tif)
          [ ${#FILES[@]} -gt 0 ] || { echo "::error::Not a single file was made."; exit 1; }
          BIG=0
          for f in "${FILES[@]}"; do
            SZ=$(stat -c%s "$f")
            printf '  %-24s %6s MB\n' "$(basename "$f")" "$(( SZ / 1048576 ))"
            # the Drive store has no cap, but every build downloads a big file whole
            if [ "$SZ" -gt $((4 * 1024 * 1024 * 1024)) ]; then
              echo "::warning::$f has $(( SZ / 1048576 )) MB. It is uploaded, but every build will download it whole – if that isn't intended, pick a coarser grid or a smaller area."
              BIG=$(( BIG + 1 ))
            fi
          done
          echo "${#FILES[@]} files, $BIG of them over 4 GB"

      # the area is in the name: tiles are refilled by degrees, one shared meta would lie
      - name: Model metadata
        id: meta
        if: ${{ !startsWith(inputs.mode, 'probe only') && !startsWith(inputs.mode, 'len sonda') }}
        run: |
          set -euo pipefail
          META="meta-dmr5-drive-$(printf '%s' '${{ steps.cfg.outputs.area }}' | tr -c 'a-zA-Z0-9' '_').json"
          shopt -s nullglob
          FILES=(out/*.tif)
          jq -n \
            --arg src "ÚGKK SR – DMR 5.0 (LLS), ETRS89" \
            --arg area '${{ steps.cfg.outputs.area }}' \
            --arg grid '${{ steps.cfg.outputs.grid }}' \
            --arg geoid '${{ steps.cfg.outputs.geoid }}' \
            --arg built "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson files "$(printf '%s\n' "${FILES[@]}" | xargs -n1 basename | jq -R . | jq -s .)" \
            '{source:$src, crs:"EPSG:3046", area:$area, cell_m:($grid|tonumber), heights:$geoid, built_at:$built, files:$files}' \
            > "out/$META"
          cat "out/$META"
          echo "meta=$META" >> "$GITHUB_OUTPUT"

      - name: Upload to the Drive store
        if: ${{ !startsWith(inputs.mode, 'probe only') && !startsWith(inputs.mode, 'len sonda') }}
        env:
          STORE: ${{ steps.cfg.outputs.store }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          FILES=(out/*.tif)
          echo "Uploading ${#FILES[@]} files to store $STORE…"
          python3 workers/drive/store.py --put --store="$STORE" \
            --file="${FILES[*]}" --file="out/${{ steps.meta.outputs.meta }}" \
            --note="From DMR 5.0 in ETRS89, read over HTTP Range. Source: ÚGKK SR, free to use with attribution."
          echo "In store $STORE: ${#FILES[@]} files ✓"

      # this workflow's output is Build map's input
      - name: Summary
        if: ${{ always() }}
        run: |
          set -uo pipefail
          [ -s model-summary.md ] && cat model-summary.md >> "$GITHUB_STEP_SUMMARY"
          {
            echo
            echo "## What Build map gets from it"
            echo
            if [ '${{ steps.cfg.outputs.tiles }}' = 'true' ]; then
              echo "Tiles in store \`${{ steps.cfg.outputs.store }}\`."
              echo "Taken by **hillshading and 3D terrain** (\`shading_source: dmr5\`)"
              echo "and by contours/rocks when the run has no cut-out."
            else
              echo "A full-resolution cut-out in store \`${{ steps.cfg.outputs.store }}\`"
              echo "as \`${{ steps.cfg.outputs.asset }}\`."
              echo "Taken by **contours and rocks** with \`area: ${{ steps.cfg.outputs.area }}\`."
              echo
              echo "| input | value |"
              echo "|---|---|"
              echo "| \`rock_source\` | \`${{ steps.cfg.outputs.dem_source }}\` |"
              echo "| \`area\` | \`${{ steps.cfg.outputs.area }}\` |"
              echo "| \`layers\` | \`contours\` (contours + rocks) |"
            fi
            echo
            echo "No need to run it by hand – Build map refills both shapes itself"
            echo "(jobs \`Refill DMR 5.0 …\`)."
          } >> "$GITHUB_STEP_SUMMARY"
