name: Dáta · DMR 5.0

# Výškový model z DMR 5.0 (ETRS89), ktorý leží na Drive ako dva holé BigTIFFy.
# Jediná cesta k DMR 5.0:
#
#   area: <pohorie>       →  ugkk-<pohorie>.tif   →  sklad `dem-ugkk`
#   area: cele_slovensko  →  dlaždice N49E019.tif →  sklad `dem-dmr5-v2`
#
# Build map ju volá dvakrát – obe podoby môžu chýbať naraz. Skladá sú priečinky
# na Drive (`workers/drive/store.py`), nie GitHub releasy.
#
# Číta sa prihlásený ako vlastník dát: čo je v priečinku, povie len Drive API.
# Keď Drive nepustí, `serve.py` vráti 502 a beh spadne v sekundách.
#
# Výšky sú elipsoidické (+42,6 m geoid), predvolene sa odčíta EGM2008.

on:
  workflow_dispatch:
    inputs:
      area:
        description: "Územie. Pohorie ide do dem-ugkk, celé Slovensko do dem-dmr5-v2"
        required: true
        default: vysoke_tatry
        type: choice
        options:
          - cele_slovensko
          - tatry
          - vysoke_tatry
          - belianske_tatry
          - zapadne_tatry
          - nizke_tatry
          - slovensky_raj
          - pieniny
          - mala_fatra
          - velka_fatra
          - sulovske_skaly
          - slovensky_kras
          - muranska_planina
          - vihorlat
          - strazovske_vrchy
          - male_karpaty
      grid_m:
        description: "Mriežka výsledku"
        required: false
        default: "auto (1 m na pohorie, 5 m na celé Slovensko)"
        type: choice
        options:
          - "auto (1 m na pohorie, 5 m na celé Slovensko)"
          - "1 m – plné rozlíšenie, len na pohorie"
          - "2 m – z pyramíd, štvrtinový objem"
          - "5 m – celé Slovensko"
          - "10 m"
          - "20 m – rýchly test"
      geoid:
        description: "Výšky vo výstupe"
        required: false
        default: "EGM2008 (≈ Bpv) – ako ostatné zdroje"
        type: choice
        options:
          - "EGM2008 (≈ Bpv) – ako ostatné zdroje"
          - "elipsoidické ETRS89 – tak, ako sú v súbore"
      mode:
        description: "Čo spraviť"
        required: false
        default: "model do releasu"
        type: choice
        options:
          - "model do releasu"
          - "len sonda – čo je v zdroji, nič sa nereže"
      # dlaždicová podoba aj pre menšie územie: okno sa rozšíri na celé stupne.
      # Presne to si Build map dopĺňa pre tieňovanie, ktoré výrez použiť nevie.
      tiles:
        description: "Vyrobiť 1° dlaždice do dem-dmr5-v2 aj pre pohorie (inak je z pohoria jeden výrez)"
        required: false
        default: false
        type: boolean
      jobs:
        description: "Koľko blokov čítať naraz. Drive je latenčný, nie úzky"
        required: false
        default: "12"
        type: string
      # `inputs.asset` musí byť deklarovaný pre oba spúšťače, inak je to výraz
      # nad neexistujúcim vstupom
      asset:
        description: "Meno súboru pri výreze (prázdne = ugkk-<area>.tif)"
        required: false
        default: ""
        type: string

  # volá ho aj Build map, keď mu v sklade chýba model. `workflow_call` nepozná
  # `type: choice`, tak sem chodia holé hodnoty.
  # Build map podáva BBOX, nie kľúč pohoria: čo sa má prečítať, vie len on
  # (výrez pretnutý s regiónom, pri teste pár km²). Kľúč by si táto pipeline
  # vyriešila z `areas.json` druhýkrát a prečítala celý obdĺžnik.
  # Meno výsledku preto chodí zvlášť v `asset`.
  workflow_call:
    inputs:
      area:
        required: true
        type: string
      asset:
        # pri bboxe v `area` povinné: build si súbor hľadá podľa mena
        required: false
        default: ""
        type: string
      grid_m:
        # prázdne = podľa rozsahu (1 m na výrez, 5 m na dlaždice)
        required: false
        default: ""
        type: string
      tiles:
        # true = 1° dlaždice do dem-dmr5-v2, false = jeden COG do dem-ugkk
        required: false
        default: false
        type: boolean
      geoid:
        required: false
        default: egm2008
        type: string
      jobs:
        required: false
        default: "12"
        type: string
      # je tu preto, aby `inputs.mode` bol deklarovaný pre oba spúšťače
      mode:
        required: false
        default: "model do releasu"
        type: string
    secrets:
      # prihlásenie vlastníka dát, dvomi tvarmi (`client_secret` Google
      # druhýkrát neukáže, tak sa raz uložený neprepisuje). `DRIVE_CLIENT` je
      # repository variable, nie secret. Bez prihlásenia sa číta verejným
      # odkazom s denným limitom.
      GDRIVE_CREDENTIALS:
        required: false
      DRIVE_SECRET:
        required: false
      DRIVE_REFRESH:
        required: false

# `contents: read` stačí: publikuje sa na Drive, nie do releasov
permissions:
  contents: read

concurrency:
  # dva behy naraz by ťahali dvojnásobok a prepisovali ten istý asset. Podoba
  # je v kľúči zvlášť – obe sú „nejaký bbox" a Build map si ich dopĺňa súbežne.
  group: dmr5-drive-${{ inputs.tiles }}-${{ inputs.area }}
  cancel-in-progress: false

jobs:
  model:
    name: Výškový model z Drive
    runs-on: ubuntu-latest
    # rozdelené na čo najviac krokov: z hodinového behu bol inak v Actions
    # jeden riadok bez konca a z padnutého sa nedalo povedať, kde to spadlo.
    # Kroky 5–7 (plán, čítanie, zloženie) sú fázy jedného scriptu (`--stage`),
    # ktoré si stav podávajú cez `drive-work/` – opakovaný krok tak dopočíta
    # len zvyšok.
    env:
      # prihlásenie ako vlastník dvíha limit sťahovania; podáva sa celému jobu,
      # lebo naň siaha sonda, plán aj čítanie. Viď workers/drive/auth.py.
      GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
      DRIVE_CLIENT: ${{ vars.DRIVE_CLIENT }}
      DRIVE_SECRET: ${{ secrets.DRIVE_SECRET }}
      DRIVE_REFRESH: ${{ secrets.DRIVE_REFRESH }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Nainštaluj GDAL
        run: |
          set -euo pipefail
          echo "Inštalujem gdal-bin a jq…"
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin jq
          echo "GDAL: $(gdalinfo --version)"

      - name: Uvoľni miesto na disku
        run: |
          set -uo pipefail
          echo "Voľné miesto pred upratovaním:"
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          echo "Voľné miesto po upratovaní:"
          df -h / | tail -1

      # jediné miesto, kde sa z formulára stanú konkrétne čísla a mená
      - name: Nastavenia
        id: cfg
        run: |
          set -euo pipefail
          AREA='${{ inputs.area }}'
          # podoba: dlaždice (`dem-dmr5-v2`) alebo výrez (`dem-ugkk`).
          # `cele_slovensko` je dlaždicová vždy – jeden COG na krajinu by mal
          # desiatky GB. `tiles: true` je kvôli tieňovaniu v Build map.
          TILES=false
          if [ '${{ inputs.tiles }}' = 'true' ] || [ "$AREA" = cele_slovensko ]; then
            TILES=true
          fi
          # do ktorého skladu, sa pýta `workers/dem/target.py` – toho istého
          # ako `check-dem` aj `fetch.sh`. Mená natvrdo by boli druhá odpoveď.
          KEY=cely
          [ "$TILES" = true ] || KEY="$AREA"
          REL=$(python3 workers/dem/target.py --source=dmr5 --area-key="$KEY" \
                | sed -n 's/^store=//p')
          if [ -z "$REL" ]; then
            echo "::error::workers/dem/target.py nepovedal, do ktorého skladu sa má DMR 5.0 uložiť. Bez toho by beh hodinu čítal z Drive a nemal to kam dať."
            exit 1
          fi
          SRC=dmr5

          # meno výrezového assetu: `area` môže byť aj bbox a
          # `ugkk-20,49,21,50.tif` si Build map vypýtať nevie. Preto sa meno dá
          # podať zvlášť v `asset` a pri bboxe je povinné.
          ASSET='${{ inputs.asset }}'
          case "$AREA" in
            *,*) if [ "$TILES" != true ] && [ -z "$ASSET" ]; then
                   echo '::error::Bbox v „area" bez „asset" ide len s „tiles: true" – výrezový asset sa inak volá podľa pohoria a „ugkk-20,49,21,50.tif" si Build map vypýtať nevie. Zadaj pohorie, vyplň asset, alebo zapni tiles.'
                   exit 1
                 fi ;;
          esac
          if [ "$TILES" != true ] && [ -z "$ASSET" ]; then
            ASSET="ugkk-${AREA}.tif"
          fi

          GRID=$(printf '%s' '${{ inputs.grid_m }}' | grep -oE '^[0-9]+' || true)
          if [ -z "$GRID" ]; then
            GRID=$([ "$TILES" = true ] && echo 5 || echo 1)
          fi

          # 1°×1° dlaždica pri 1 m má ~48 GB surových buniek a runner má voľných
          # ~60 GB. Platí pre každú dlaždicu, nie len pre celú krajinu.
          if [ "$TILES" = true ] && [ "$GRID" -lt 3 ]; then
            echo "::error::Dlaždice pri mriežke ${GRID} m sa na runner nezmestia (jedna 1° dlaždica má v metri ~48 GB buniek, voľných je ~60 GB). Zvoľ 5 m, alebo si vyber pohorie s vypnutým tiles."
            exit 1
          fi

          case '${{ inputs.geoid }}' in
            elipsoid*) GEOID=elipsoid ;;
            *) GEOID=egm2008 ;;
          esac

          {
            echo "grid=$GRID"
            echo "store=$REL"
            echo "dem_source=$SRC"
            echo "tiles=$TILES"
            echo "asset=$ASSET"
            echo "whole_country=$([ "$AREA" = cele_slovensko ] && echo true || echo false)"
            echo "geoid=$GEOID"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Čo tento beh spraví"
            echo
            echo "| nastavenie | hodnota |"
            echo "|---|---|"
            echo "| územie | \`$AREA\` |"
            echo "| mriežka | ${GRID} m |"
            echo "| podoba | $([ "$TILES" = true ] && echo '1° dlaždice' || echo "výrez \`$ASSET\`") |"
            echo "| sklad | \`$REL\` |"
            echo "| výšky | $GEOID |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "── $AREA, mriežka ${GRID} m, výšky $GEOID, podoba $([ "$TILES" = true ] && echo dlaždice || echo "výrez $ASSET") → sklad $REL"

      # lacná otázka s drahou odpoveďou: čítame ako vlastník, alebo verejným
      # odkazom s denným limitom? Vlastný krok preto, že padnutý krok s týmto
      # menom je sám o sebe diagnóza – nesedí secret, nie dáta ani sieť.
      - name: Prihlásenie na Drive (vlastník dát)
        run: python3 workers/drive/dmr5.py --auth-check

      # otvorenie zdroja stojí 8 s a 0,3 MB, tak sa robí vždy: keď shim prestane
      # opravovať `content-length`, má sa to povedať tu a nie po hodine
      - name: Sonda – čo je v zdroji na Drive
        run: python3 workers/drive/dmr5.py --probe-only

      # lacný krok, ktorý odpovie na jedinú otázku pred hodinovým čítaním:
      # koľko toho bude
      - name: Plán čítania (okno, bloky, odhad)
        id: plan
        if: ${{ !startsWith(inputs.mode, 'len sonda') }}
        run: |
          set -euo pipefail
          # prepínač sa skladá do poľa, nie reťazca: prázdny reťazec by
          # argparse vzal ako hodnotu predchádzajúcej voľby
          ARGS=()
          if [ '${{ steps.cfg.outputs.tiles }}' = 'true' ]; then
            ARGS+=(--tiles)
          else
            ARGS+=(--asset="${{ steps.cfg.outputs.asset }}")
          fi
          python3 workers/drive/dmr5.py --stage=plan \
            --area='${{ inputs.area }}' \
            --grid-m='${{ steps.cfg.outputs.grid }}' \
            --geoid='${{ steps.cfg.outputs.geoid }}' \
            --jobs='${{ inputs.jobs }}' \
            "${ARGS[@]}" \
            --out=out --work=drive-work

      # dlhá časť a jediná, ktorá siaha na sieť; postup sa vypisuje po každom
      # bloku, nech sa napredujúci beh dá odlíšiť od zaseknutého
      - name: Čítanie blokov z Drive
        if: ${{ !startsWith(inputs.mode, 'len sonda') }}
        run: |
          set -euo pipefail
          python3 workers/drive/dmr5.py --stage=read \
            --geoid='${{ steps.cfg.outputs.geoid }}' \
            --jobs='${{ inputs.jobs }}' \
            --out=out --work=drive-work

      # už len nad diskom. Vlastný krok: keď zlyhá tu, nie je to sieť ani zdroj,
      # ale prevod výšok alebo miesto na disku
      - name: Zloženie výstupu (mozaika, výšky, COG/dlaždice)
        if: ${{ !startsWith(inputs.mode, 'len sonda') }}
        run: |
          set -euo pipefail
          python3 workers/drive/dmr5.py --stage=finish \
            --geoid='${{ steps.cfg.outputs.geoid }}' \
            --out=out --work=drive-work \
            --summary=model-summary.md
          echo "Vzniklo:"
          ls -lh out/*.tif

      # vlastný krok, lebo je to zamietnutie zadania, nie zlyhanie výpočtu
      - name: Kontrola veľkosti assetov (strop 2 GB)
        if: ${{ !startsWith(inputs.mode, 'len sonda') }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          FILES=(out/*.tif)
          [ ${#FILES[@]} -gt 0 ] || { echo "::error::Nevznikol ani jeden súbor."; exit 1; }
          BIG=0
          for f in "${FILES[@]}"; do
            SZ=$(stat -c%s "$f")
            printf '  %-24s %6s MB\n' "$(basename "$f")" "$(( SZ / 1048576 ))"
            # sklad na Drive strop nemá; veľký súbor ale platí každý build,
            # ktorý si ho vypýta
            if [ "$SZ" -gt $((4 * 1024 * 1024 * 1024)) ]; then
              echo "::warning::$f má $(( SZ / 1048576 )) MB. Nahrá sa, ale každý build ho bude celý sťahovať – ak to nie je zámer, zvoľ hrubšiu mriežku alebo menšie územie."
              BIG=$(( BIG + 1 ))
            fi
          done
          echo "${#FILES[@]} súborov, $BIG z nich nad 4 GB"

      # meno metadát nesie územie: dlaždicová podoba sa dopĺňa po stupňoch,
      # takže jedno spoločné meta by tvrdilo, že v sklade je len posledný beh
      - name: Metadáta modelu
        id: meta
        if: ${{ !startsWith(inputs.mode, 'len sonda') }}
        run: |
          set -euo pipefail
          META="meta-dmr5-drive-$(printf '%s' '${{ inputs.area }}' | tr -c 'a-zA-Z0-9' '_').json"
          shopt -s nullglob
          FILES=(out/*.tif)
          jq -n \
            --arg src "ÚGKK SR – DMR 5.0 (LLS), ETRS89" \
            --arg area '${{ inputs.area }}' \
            --arg grid '${{ steps.cfg.outputs.grid }}' \
            --arg geoid '${{ steps.cfg.outputs.geoid }}' \
            --arg built "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson files "$(printf '%s\n' "${FILES[@]}" | xargs -n1 basename | jq -R . | jq -s .)" \
            '{source:$src, crs:"EPSG:3046", area:$area, cell_m:($grid|tonumber), heights:$geoid, built_at:$built, files:$files}' \
            > "out/$META"
          cat "out/$META"
          echo "meta=$META" >> "$GITHUB_OUTPUT"

      - name: Nahraj do skladu na Drive
        if: ${{ !startsWith(inputs.mode, 'len sonda') }}
        env:
          STORE: ${{ steps.cfg.outputs.store }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          FILES=(out/*.tif)
          echo "Nahrávam ${#FILES[@]} súborov do skladu $STORE…"
          python3 workers/drive/store.py --put --store="$STORE" \
            --file="${FILES[*]}" --file="out/${{ steps.meta.outputs.meta }}" \
            --note="Z DMR 5.0 v ETRS89, čítaného cez HTTP Range. Zdroj: ÚGKK SR, voľné použitie pri uvedení zdroja."
          echo "V sklade $STORE: ${#FILES[@]} súborov ✓"

      # výstup tohto workflowu je vstup pre Build map
      - name: Súhrn
        if: ${{ always() }}
        run: |
          set -uo pipefail
          [ -s model-summary.md ] && cat model-summary.md >> "$GITHUB_STEP_SUMMARY"
          {
            echo
            echo "## Čo z toho má Build map"
            echo
            if [ '${{ steps.cfg.outputs.tiles }}' = 'true' ]; then
              echo "Dlaždicová podoba v sklade \`${{ steps.cfg.outputs.store }}\`."
              echo "Berie si ju **tieňovanie a 3D terén** (\`shading_source: dmr5\`)"
              echo "a vrstevnice/skaly vtedy, keď beh nemá výrez."
            else
              echo "Výrez v plnom rozlíšení v sklade \`${{ steps.cfg.outputs.store }}\`"
              echo "ako \`${{ steps.cfg.outputs.asset }}\`."
              echo "Berú si ho **vrstevnice a skaly** pri \`area: ${{ inputs.area }}\`."
              echo
              echo "| input | hodnota |"
              echo "|---|---|"
              echo "| \`rock_source\` | \`${{ steps.cfg.outputs.dem_source }}\` |"
              echo "| \`area\` | \`${{ inputs.area }}\` |"
              echo "| \`layers\` | \`contours\` (vrstevnice + skaly) |"
            fi
            echo
            echo "Ručne to spúšťať netreba – Build map si oba tvary dopĺňa sám"
            echo "(joby \`Doplniť DMR 5.0 …\`)."
          } >> "$GITHUB_STEP_SUMMARY"
