name: Mapa · Build map state

# CELÁ KRAJINA NA JEDNO KLIKNUTIE: spustí „Build map region" pre každý kraj,
# jeden po druhom, a nechá ťa tak.
#
# Beží ako ŠTAFETA, nie jeden dlhý job: kraj trvá aj tri hodiny, krajov je osem
# a job má strop šesť hodín. Jeden beh = jeden úsek (počkaj – spusti – odovzdaj
# ďalšiemu svojmu behu). Rozpis vo `workers/state/relay.sh`.
#
# Proti jednému kraju sa líši v troch veciach:
#   area          natvrdo `cely_region`
#   publish_pages natvrdo vypnuté – na Pages je jedna mapa a osem behov by ju
#                 osemkrát prepísalo
#   reuse_layers  dopĺňa sa ako `true`: vrstvy, ktoré s týmito nastaveniami už
#                 raz vznikli, sa neprepočítavajú (to je väčšina toho dňa)
#
# Spadnutý kraj dávku nezastaví (posledný úsek na tom spadne, nech nekončí
# zelená s dierou v mape); ZRUŠENIE áno – je to jediný spôsob, ako bežiacej
# dávke povedať „dosť". Rozpis vo `workers/state/estafeta.sh`.

on:
  workflow_dispatch:
    inputs:
      # zoznam drží workers/data/regions.json (stráži lint workflowov)
      country:
        description: "Krajina – postaví sa každý jej kraj"
        required: true
        default: slovensko
        type: choice
        options:
          - slovensko
      # ďalej to isté, čo má formulár jedného kraja. `relay.sh` ich podáva
      # každému behu celé a zakaždým – články štafety sú samostatné behy
      contour_source:
        description: "Vrstevnice – z ktorého modelu terénu (ziadne = negenerovať)"
        required: false
        default: dmr5
        type: choice
        options:
          - sonny
          - sonny1
          - dmr35
          - dmr5
          - ziadne
      rock_source:
        description: "Skaly – zo sklonu modelu, alebo z tieňovania (ziadne = negenerovať)"
        required: false
        default: dmr5
        type: choice
        options:
          - sonny
          - sonny1
          - dmr35
          - dmr5
          - tienovanie
          - ziadne
      shading_source:
        description: "Tieňovanie a 3D terén – z ktorého modelu (ziadne = negenerovať)"
        required: false
        default: dmr5
        type: choice
        options:
          - sonny
          - sonny1
          - dmr35
          - dmr5
          - ziadne
      rock_slope:
        description: "Od akého sklonu (°) je terén skala (50 = steny, 40 = aj strmé svahy)"
        required: false
        default: "50"
        type: string
      rebuild:
        description: "Čo pregenerovať nanovo, aj keď to už je v cache"
        required: false
        default: nic
        type: choice
        options:
          - nic
          - vrstevnice
          - skaly
          - tienovanie
          - vsetko
      # pri dávke je to skúška samotnej dávky, nie mapy: osem krajov po pár
      # minútach namiesto po hodinách
      test:
        description: "Rýchly test: každý kraj len na 4 km² zo stredu (skúška dávky)"
        required: false
        default: false
        type: boolean
      options:
        description: "Zriedka menené nastavenia ako kľúč=hodnota (viď workers/plan/options.py)"
        required: false
        default: ""
        type: string
      # štafetový kolík, nie pole pre človeka – dávka si ho vypĺňa sama.
      # Vstup a nie súbor v repozitári: stav je vidieť priamo na behu
      # a nevznikajú commity, ktoré by sa bili s `maps.json`.
      pokracovanie:
        description: "Nevypĺňaj – kolík štafety, dávka si ho podáva sama"
        required: false
        default: ""
        type: string

# `actions: write` je to jediné, čo tento workflow robí: spúšťa iné behy
permissions:
  contents: read
  actions: write

# zámerne bez `concurrency`: články štafety sú samostatné behy toho istého
# workflowu a pri troch v jednej skupine GitHub prostredný zruší – dávka by si
# tak sama odhryzla článok. Jeden kraj naraz drží samotná štafeta.

jobs:
  estafeta:
    name: Úsek štafety
    runs-on: ubuntu-latest
    # pod stropom šiestich hodín s rezervou: čakanie na kraj má v skripte
    # strop 5 h, takže na spustenie ďalšieho článku ostáva hodina
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Počkaj na kraj, spusti ďalší a odovzdaj štafetu
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          COUNTRY: ${{ inputs.country }}
          POKRACOVANIE: ${{ inputs.pokracovanie }}
          CONTOUR_SOURCE: ${{ inputs.contour_source }}
          ROCK_SOURCE: ${{ inputs.rock_source }}
          SHADING_SOURCE: ${{ inputs.shading_source }}
          ROCK_SLOPE: ${{ inputs.rock_slope }}
          REBUILD: ${{ inputs.rebuild }}
          TEST: ${{ inputs.test }}
          OPTIONS: ${{ inputs.options }}
        run: workers/state/relay.sh
