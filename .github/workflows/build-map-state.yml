name: Map · Build map state

# A WHOLE COUNTRY IN ONE CLICK: runs “Build map region” for every region, one
# after another. A relay, not one long job – a region takes up to three hours,
# a job six (`workers/state/relay.sh`).
#
# It differs from one region in three things:
#   area          always `whole_region`
#   publish_pages always off – Pages holds one map, eight runs would overwrite it
#   reuse_layers  added as `true`: layers already made with these settings stay
#
# A failed region doesn't stop the batch (the last leg fails on it); a
# CANCEL does (`workers/state/relay-core.sh`).

on:
  workflow_dispatch:
    inputs:
      # the list is workers/data/regions.json (the workflow lint guards it)
      country:
        description: "Country – every region of it is built"
        required: true
        default: slovensko
        type: choice
        options:
          - slovensko
      # the rest is the one-region form; `relay.sh` passes them whole every time
      contour_source:
        description: "Contours – which terrain model (none = don't make)"
        required: false
        default: dmr5
        type: choice
        options:
          - sonny
          - sonny1
          - dmr35
          - dmr5
          - none
      rock_source:
        description: "Rocks – from the model's slope, or from hillshading (none = don't make)"
        required: false
        default: dmr5
        type: choice
        options:
          - sonny
          - sonny1
          - dmr35
          - dmr5
          - shading
          - none
      shading_source:
        description: "Hillshading and 3D terrain – which model (none = don't make)"
        required: false
        default: dmr5
        type: choice
        options:
          - sonny
          - sonny1
          - dmr35
          - dmr5
          - none
      rock_slope:
        description: "From which slope (°) terrain is rock (50 = faces, 40 = steep slopes too)"
        required: false
        default: "50"
        type: string
      rebuild:
        description: "What to rebuild even when it is cached"
        required: false
        default: nothing
        type: choice
        options:
          - nothing
          - contours
          - rocks
          - terrain
          - articles
          - everything
      # for a batch this tests the batch, not the map: minutes per region
      test:
        description: "Quick test: every region only on 4 km² in its middle (a batch trial)"
        required: false
        default: false
        type: boolean
      options:
        description: "Rarely changed settings as key=value (see workers/plan/options.py)"
        required: false
        default: ""
        type: string
      # the relay baton, not a field for people; an input so the state shows on the run
      continuation:
        description: "Leave empty – the relay baton, the batch passes it itself"
        required: false
        default: ""
        type: string

# `actions: write` is all this workflow does: it dispatches other runs
permissions:
  contents: read
  actions: write

# no `concurrency` on purpose: with three runs in a group GitHub cancels the
# middle one and the batch would bite off a leg; the relay keeps one region at a time

jobs:
  relay:
    name: Relay leg
    runs-on: ubuntu-latest
    # under the six-hour cap: waiting for a region is capped at 5 h in the script
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Wait for the region, start the next and hand over the relay
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          COUNTRY: ${{ inputs.country }}
          CONTINUATION: ${{ inputs.continuation }}
          CONTOUR_SOURCE: ${{ inputs.contour_source }}
          ROCK_SOURCE: ${{ inputs.rock_source }}
          SHADING_SOURCE: ${{ inputs.shading_source }}
          ROCK_SLOPE: ${{ inputs.rock_slope }}
          REBUILD: ${{ inputs.rebuild }}
          TEST: ${{ inputs.test }}
          OPTIONS: ${{ inputs.options }}
        run: workers/state/relay.sh
