name: Mapa · Build wiki

# Ku každému objektu v regióne s tagom `wikipedia`/`wikidata` stiahne článok
# (anglicky a v jazyku krajiny), zabalí ho ako `<región>-wikipedia.zip` na Drive
# a odkaz zapíše do `maps.json`.
#
# Vlastná pipeline, nie job v Build map: iná sieť (cudzí server, ktorý nemá
# zhodiť hodinový build), iná životnosť (články si žijú vlastným tempom)
# a iný výstup (text vedľa mapy, do `_site` nejde nič).
#
# Balík aj katalóg robí ďalej `workers/deploy/publish-map.py`, len
# s `--only=wikipedia`: publikuje jediný balík a položku regiónu doplní.

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Región (ignoruje sa, ak je vyplnené custom_pbf_url)"
        required: true
        default: bratislavsky
        type: choice
        options:
          - slovensko
          - bratislavsky
          - trnavsky
          - trenciansky
          - nitriansky
          - zilinsky
          - banskobystricky
          - presovsky
          - kosicky
      wiki_format:
        description: "Podoba článku"
        required: false
        default: text
        type: choice
        options:
          - text
          - wikitext
          - intro
          - html
      wiki_langs:
        description: "Jazyky NAVYŠE, čiarkou (en a jazyk krajiny idú vždy)"
        required: false
        default: ""
        type: string
      wiki_max:
        description: "Strop počtu článkov na jeden beh"
        required: false
        default: "5000"
        type: string
      country:
        description: "Krajina pre domáci jazyk (prázdne = podľa regiónu)"
        required: false
        default: ""
        type: string
      rebuild:
        description: "Stiahnuť články odznova (obíde cache na Drive)"
        required: false
        default: false
        type: boolean
      publish:
        description: "Nahrať na Drive a zapísať do maps.json"
        required: false
        default: true
        type: boolean
      # ten istý balík ešte raz ako `.aar`; robí to job na macOS (nástroj `aa`)
      apple_archive:
        description: "Nahrať balík aj ako .aar (Apple Archive, job na macOS)"
        required: false
        default: true
        type: boolean
      custom_pbf_url:
        description: "Vlastný .osm.pbf (iný región Európy/sveta)"
        required: false
        default: ""
        type: string
      custom_name:
        description: "Meno vlastného regiónu (do priečinka a mena balíka)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
      # prihlásenie na Drive stojí pri celom workflowe ako v Build map
  GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
  DRIVE_CLIENT: ${{ vars.DRIVE_CLIENT }}
  DRIVE_SECRET: ${{ secrets.DRIVE_SECRET }}
  DRIVE_REFRESH: ${{ secrets.DRIVE_REFRESH }}
  OSMFR_BASE: https://download.openstreetmap.fr/extracts

jobs:
  wiki:
    name: Články z Wikipédie
    runs-on: ubuntu-latest
      # katalóg `maps.json` je súbor v repozitári a dopisuje ho beh
    permissions:
      contents: write
    outputs:
      key: ${{ steps.region.outputs.key }}
      enabled: ${{ steps.wiki.outputs.enabled }}
      published: ${{ steps.publish.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Priprav priečinky
        run: mkdir -p steps-out data

      # PBF sťahuje ten istý skript ako Build map – „ktorý súbor je región"
      # je jedna otázka a odpoveď na ňu má jedno miesto
      - name: Stiahni PBF iba daného regiónu
        id: region
        env:
          AREA_IN: ""
          OPT_AREA_BBOX: ""
          OPT_CROP_BBOX: ""
          OPT_CUSTOM_BBOX: ""
          OPT_CUSTOM_NAME: ${{ inputs.custom_name }}
          OPT_CUSTOM_PBF_URL: ${{ inputs.custom_pbf_url }}
          OPT_TEST_AT: ""
          OPT_TEST_KM2: "0"
          REGION: ${{ inputs.region }}
        run: workers/plan/pbf.sh

      - name: Kľúč cache článkov
        id: key
        env:
          REGION: ${{ steps.region.outputs.key }}
          LANGS: ${{ inputs.wiki_langs }}
          FMT: ${{ inputs.wiki_format }}
          COUNTRY: ${{ inputs.country }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # do kľúča ide všetko, čo mení obsah balíka. Na konci je číslo behu,
          # lebo existujúci kľúč sa neprepisuje – predpona vyberie najnovší.
          S=$(printf '%s|%s|%s|%s' "$REGION" "$COUNTRY" "$LANGS" "$FMT" \
              | tr -c 'a-zA-Z0-9._-' '_')
          echo "prefix=wiki-v2-$S-" >> "$GITHUB_OUTPUT"
          echo "key=wiki-v2-$S-$RUN_ID" >> "$GITHUB_OUTPUT"

      # obnovuje sa cez predponu (najnovší záznam toho regiónu). Šetria sa tým
      # bajty a čas prevodu, nie požiadavky: `collect.py` sa dávkovo spýta na
      # `lastrevid`. `rebuild` restore preskočí.
      - name: Cache článkov (restore)
        id: cache
        if: ${{ !inputs.rebuild }}
        uses: ./.github/actions/cache-restore
        with:
          path: wiki-cache
          key: ${{ steps.key.outputs.key }}
          restore-keys: ${{ steps.key.outputs.prefix }}

      - name: Odkazy na wiki → stiahnuté články
        id: wiki
        env:
          REGION_KEY: ${{ steps.region.outputs.key }}
          # krajinu vie číselník regiónov; input ju len prebije
          WIKI_COUNTRY: ${{ inputs.country }}
          OPT_WIKI_LANGS: ${{ inputs.wiki_langs }}
          OPT_WIKI_FORMAT: ${{ inputs.wiki_format }}
          OPT_WIKI_MAX: ${{ inputs.wiki_max }}
          REGION: ${{ inputs.region }}
        run: |
          set -euo pipefail
          if [ -z "$WIKI_COUNTRY" ]; then
            WIKI_COUNTRY=$(jq -r --arg r "$REGION" '.[$r].country // ""' \
              workers/data/regions.json)
          fi
          export WIKI_COUNTRY
          echo "Krajina pre domáci jazyk: ${WIKI_COUNTRY:-(nepoznám)}"
          workers/wiki/build.sh

      # ukladá sa hneď, ako články vzniknú; `always()`, lebo aj čiastočný
      # výsledok je ďalšiemu behu na osoh
      - name: Cache článkov (save)
        if: ${{ always() && hashFiles('wiki-cache/articles.ndjson') != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: wiki-cache
          key: ${{ steps.key.outputs.key }}

      # ten istý skript ako pri mape, len s `--only=wikipedia`: publikuje
      # jediný balík a položku regiónu doplní, nie prepíše
      - name: Publikuj na Drive a zapíš do maps.json
        id: publish
        if: ${{ inputs.publish && steps.wiki.outputs.enabled == 'true' }}
        env:
          REGION_KEY: ${{ steps.region.outputs.key }}
          AREA_KEY: cely
          TEST_KM2: "0"
          CUSTOM_PBF_URL: ${{ inputs.custom_pbf_url }}
          CUSTOM_NAME: ${{ inputs.custom_name }}
        run: |
          set -euo pipefail
          python3 workers/deploy/publish-map.py --only=wikipedia \
            --wiki=wiki-out --maps=maps.json \
            --summary="$GITHUB_STEP_SUMMARY"

      # ten istý skript, akým katalóg commituje Build map – vrátane rebasu
      - name: Commitni maps.json
        if: ${{ inputs.publish && steps.publish.outcome == 'success' }}
        env:
          MAPS_JSON: ${{ steps.publish.outputs.maps_file || 'maps.json' }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: workers/deploy/catalog.sh

      # aby si `.aar` mohol vyrobiť job na macOS, musia sa k nemu články dostať
      - name: Odlož články pre Apple Archive
        if: ${{ inputs.publish && steps.publish.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: wiki-aar
          path: wiki-out
          retention-days: 1
          compression-level: 0

      # bez publikovania sa dá aspoň pozrieť, čo vzniklo; deň retencie – je to
      # prepravka, nie uložený výsledok
      - name: Odlož články na pozretie
        if: ${{ always() && hashFiles('wiki-out/index.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: wiki-${{ inputs.region }}
          path: |
            wiki-out
            steps-out
          retention-days: 1
          compression-level: 6
          if-no-files-found: ignore

      - name: Súhrn
        if: ${{ always() }}
        env:
          COUNT: ${{ steps.wiki.outputs.count }}
          MB: ${{ steps.wiki.outputs.mb }}
        run: |
          set -uo pipefail
          {
            echo "## Build wiki"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| región | \`${{ inputs.region }}\` |"
            echo "| článkov | ${COUNT:-0} |"
            echo "| veľkosť | ${MB:-0} MB |"
            echo "| podoba | \`${{ inputs.wiki_format }}\` |"
            echo
            echo "Jazyky sú angličtina a jazyk krajiny (číselník"
            echo "\`workers/data/wiki-languages.json\`) plus to, čo si objekty"
            echo "píšu samy v tagu. Text je z Wikipédie (CC BY-SA)."
          } >> "$GITHUB_STEP_SUMMARY"

  # ten istý balík ešte raz ako `.aar`; články sú z toho najvďačnejšie (text).
  # Vlastný job na macOS (nástroj `aa`), ten istý skript s `ONLY=wikipedia`.
  # Beží až po nahratí ZIPu – `--only` položku katalógu dopĺňa.
  # Keď spadne, články tým netrpia.
  apple-archive:
    name: Balík ako Apple Archive (.aar)
    needs: wiki
    if: ${{ !cancelled() && needs.wiki.outputs.published == 'success' && inputs.apple_archive }}
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Stiahni články z predošlého jobu
        uses: actions/download-artifact@v8
        with:
          name: wiki-aar
          path: wiki-out
      - name: Zabaľ a nahraj .aar na Drive
        id: publish
        env:
          ONLY: wikipedia
          WIKI: wiki-out
          REGION_KEY: ${{ needs.wiki.outputs.key }}
          AREA_KEY: cely
          TEST_KM2: "0"
          CUSTOM_PBF_URL: ${{ inputs.custom_pbf_url }}
          CUSTOM_NAME: ${{ inputs.custom_name }}
          # z ktorej vetvy si vypýtať čerstvý `maps.json`
          BRANCH: ${{ github.ref_name }}
        run: workers/deploy/apple-archive.sh
      - name: Commitni maps.json
        if: ${{ steps.publish.outcome == 'success' }}
        env:
          MAPS_JSON: ${{ steps.publish.outputs.maps_file || 'maps.json' }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: workers/deploy/catalog.sh
