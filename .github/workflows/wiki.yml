name: Map · Build wiki

# A plain-text article (English and the country language) for every object with
# `wikipedia`/`wikidata`, packed as `<region>-wikipedia.zip` and `.aar` onto Drive
# and linked in `maps.json`. The app reads only the `.aar`, so it can't be turned off.
# Build map calls it too (`workflow_call`) with `skip_cached`.

on:
  workflow_call:
    inputs:
      region:
        description: "Region from the Build map form"
        required: true
        type: string
      region_key:
        description: "Region key from the build plan (for the cache check)"
        required: false
        default: ""
        type: string
      wiki_langs:
        description: "EXTRA languages, comma separated"
        required: false
        default: ""
        type: string
      wiki_max:
        description: "Cap on articles per run"
        required: false
        default: "5000"
        type: string
      country:
        description: "Country for the local language (empty = from the region)"
        required: false
        default: ""
        type: string
      rebuild:
        description: "Download the articles again (bypasses the Drive cache)"
        required: false
        default: false
        type: boolean
      skip_cached:
        description: "Skip a region whose articles are cached and catalogued"
        required: false
        default: false
        type: boolean
      publish:
        description: "Upload to Drive and write to maps.json"
        required: false
        default: true
        type: boolean
      custom_pbf_url:
        description: "Custom .osm.pbf"
        required: false
        default: ""
        type: string
      custom_name:
        description: "Custom region name"
        required: false
        default: ""
        type: string
    secrets:
      GDRIVE_CREDENTIALS:
        required: false
      DRIVE_SECRET:
        required: false
      DRIVE_REFRESH:
        required: false
  workflow_dispatch:
    inputs:
      region:
        description: "Region (ignored when custom_pbf_url is set)"
        required: true
        default: bratislavsky
        type: choice
        options:
          - slovensko
          - bratislavsky
          - trnavsky
          - trenciansky
          - nitriansky
          - zilinsky
          - banskobystricky
          - presovsky
          - kosicky
      wiki_langs:
        description: "EXTRA languages, comma separated (en and the country language always)"
        required: false
        default: ""
        type: string
      wiki_max:
        description: "Cap on articles per run"
        required: false
        default: "5000"
        type: string
      country:
        description: "Country for the local language (empty = from the region)"
        required: false
        default: ""
        type: string
      rebuild:
        description: "Download the articles again (bypasses the Drive cache)"
        required: false
        default: false
        type: boolean
      publish:
        description: "Upload to Drive and write to maps.json"
        required: false
        default: true
        type: boolean
      custom_pbf_url:
        description: "Custom .osm.pbf (another region of Europe or the world)"
        required: false
        default: ""
        type: string
      custom_name:
        description: "Custom region name (for the folder and package name)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
  DRIVE_CLIENT: ${{ vars.DRIVE_CLIENT }}
  DRIVE_SECRET: ${{ secrets.DRIVE_SECRET }}
  DRIVE_REFRESH: ${{ secrets.DRIVE_REFRESH }}
  OSMFR_BASE: https://download.openstreetmap.fr/extracts

jobs:
  need:
    name: Articles needed?
    if: ${{ inputs.skip_cached && !inputs.rebuild }}
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.need.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Cache and catalog
        id: need
        env:
          REGION_KEY: ${{ inputs.region_key || inputs.region }}
          COUNTRY: ${{ inputs.country }}
          LANGS: ${{ inputs.wiki_langs }}
          RUN_ID: ${{ github.run_id }}
        run: workers/wiki/need.sh

  wiki:
    name: Wikipedia articles
    needs: need
    if: ${{ !cancelled() && !failure() && needs.need.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    # the run commits `maps.json`
    permissions:
      contents: write
    outputs:
      key: ${{ steps.region.outputs.key }}
      enabled: ${{ steps.wiki.outputs.enabled }}
      published: ${{ steps.publish.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare folders
        run: mkdir -p steps-out data

      # the same script as Build map picks the region's PBF
      - name: Download the PBF of this region only
        id: region
        env:
          AREA_IN: ""
          OPT_AREA_BBOX: ""
          OPT_CROP_BBOX: ""
          OPT_CUSTOM_BBOX: ""
          OPT_CUSTOM_NAME: ${{ inputs.custom_name }}
          OPT_CUSTOM_PBF_URL: ${{ inputs.custom_pbf_url }}
          OPT_TEST_AT: ""
          OPT_TEST_KM2: "0"
          REGION: ${{ inputs.region }}
        run: workers/plan/pbf.sh

      - name: Article cache key
        id: key
        env:
          REGION: ${{ steps.region.outputs.key }}
          LANGS: ${{ inputs.wiki_langs }}
          COUNTRY: ${{ inputs.country }}
          RUN_ID: ${{ github.run_id }}
        run: workers/wiki/key.sh >> "$GITHUB_OUTPUT"

      # by prefix (the region's newest); saves bytes and conversion, not requests
      - name: Article cache (restore)
        id: cache
        if: ${{ !inputs.rebuild }}
        uses: ./.github/actions/cache-restore
        with:
          path: wiki-cache
          key: ${{ steps.key.outputs.key }}
          restore-keys: ${{ steps.key.outputs.prefix }}

      - name: Wiki links → downloaded articles
        id: wiki
        env:
          REGION_KEY: ${{ steps.region.outputs.key }}
          # the input only overrides the regions lookup
          WIKI_COUNTRY: ${{ inputs.country }}
          OPT_WIKI_LANGS: ${{ inputs.wiki_langs }}
          OPT_WIKI_MAX: ${{ inputs.wiki_max }}
          REGION: ${{ inputs.region }}
        run: |
          set -euo pipefail
          if [ -z "$WIKI_COUNTRY" ]; then
            WIKI_COUNTRY=$(jq -r --arg r "$REGION" '.[$r].country // ""' \
              workers/data/regions.json)
          fi
          export WIKI_COUNTRY
          echo "Country for the local language: ${WIKI_COUNTRY:-(unknown)}"
          workers/wiki/build.sh

      # `always()`: a partial result helps the next run too
      - name: Article cache (save)
        if: ${{ always() && hashFiles('wiki-cache/articles.ndjson') != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: wiki-cache
          key: ${{ steps.key.outputs.key }}

      # `--only=wikipedia` publishes one package and adds to the region entry
      - name: Publish to Drive and write maps.json
        id: publish
        if: ${{ inputs.publish && steps.wiki.outputs.enabled == 'true' }}
        env:
          REGION_KEY: ${{ steps.region.outputs.key }}
          AREA_KEY: whole
          TEST_KM2: "0"
          CUSTOM_PBF_URL: ${{ inputs.custom_pbf_url }}
          CUSTOM_NAME: ${{ inputs.custom_name }}
        run: |
          set -euo pipefail
          python3 workers/deploy/publish-map.py --only=wikipedia \
            --wiki=wiki-out --maps=maps.json \
            --summary="$GITHUB_STEP_SUMMARY"

      - name: Commit maps.json
        if: ${{ inputs.publish && steps.publish.outcome == 'success' }}
        env:
          MAPS_JSON: ${{ steps.publish.outputs.maps_file || 'maps.json' }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: workers/deploy/catalog.sh

      - name: Keep the articles for Apple Archive
        if: ${{ inputs.publish && steps.publish.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: wiki-aar
          path: wiki-out
          retention-days: 1
          compression-level: 0

      # to look at without publishing; a one-day hand-over
      - name: Keep the articles for a look
        if: ${{ always() && hashFiles('wiki-out/index.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: wiki-${{ inputs.region }}
          path: |
            wiki-out
            steps-out
          retention-days: 1
          compression-level: 6
          if-no-files-found: ignore

      - name: Summary
        if: ${{ always() }}
        env:
          COUNT: ${{ steps.wiki.outputs.count }}
          MB: ${{ steps.wiki.outputs.mb }}
        run: |
          set -uo pipefail
          {
            echo "## Build wiki"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| region | \`${{ inputs.region }}\` |"
            echo "| articles | ${COUNT:-0} |"
            echo "| size | ${MB:-0} MB |"
            echo
            echo "Languages are English and the country language (lookup"
            echo "\`workers/data/wiki-languages.json\`) plus what objects name"
            echo "themselves in tags. Text is from Wikipedia (CC BY-SA)."
          } >> "$GITHUB_STEP_SUMMARY"

  # the `.aar` is what the app opens; the macOS job runs after the ZIP upload
  apple-archive:
    name: Package as Apple Archive (.aar)
    needs: wiki
    if: ${{ !cancelled() && needs.wiki.outputs.published == 'success' }}
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download the articles from the previous job
        uses: actions/download-artifact@v8
        with:
          name: wiki-aar
          path: wiki-out
      - name: Pack and upload the .aar to Drive
        id: publish
        env:
          ONLY: wikipedia
          WIKI: wiki-out
          REGION_KEY: ${{ needs.wiki.outputs.key }}
          AREA_KEY: whole
          TEST_KM2: "0"
          CUSTOM_PBF_URL: ${{ inputs.custom_pbf_url }}
          CUSTOM_NAME: ${{ inputs.custom_name }}
          # the branch to fetch a fresh `maps.json` from
          BRANCH: ${{ github.ref_name }}
        run: workers/deploy/apple-archive.sh
      - name: Commit maps.json
        if: ${{ steps.publish.outcome == 'success' }}
        env:
          MAPS_JSON: ${{ steps.publish.outputs.maps_file || 'maps.json' }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: workers/deploy/catalog.sh
