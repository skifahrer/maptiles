name: Údržba · týždenné upratovanie

# Jediný upratovací workflow: raz za týždeň zmaže to, čo po behoch ostalo.
# Dva joby (`github` a `drive`), lebo sa líšia právami aj tým, čo ich vie zhodiť.
#
# Workflow a nie pull request preto, že behy, vetvy, releasy, artefakty ani
# cache nie sú súbory v repozitári – zmazať ich vie len `GITHUB_TOKEN` vnútri
# behu.
#
# Na GitHube maže behy zrušených workflowov a odmietnutých súborov, releasy
# aj ich assety, artefakty, GitHub cache (tá sa už nepoužíva) a voliteľne
# vetvy `claude/*`. Nič sa tým nestratí – všetko publikované leží v sklade na
# Drive (`workers/drive/store.py`).
#
# Na Drive prerieďuje cache dvoma rýchlosťami: hotové vrstvy z výškového modelu
# 180 dní (sú to hodiny výpočtu na kraj), zvyšok 30. Sklad `vysledky` 90 dní,
# presne tá retencia, ktorú mal artefakt. Sklady s výškovým modelom sa
# neprerieďujú – to sú drahé zrkadlá.
#
# Z plánu beží `tyzdenne`: releasy, artefakty a obe cache. Behy a vetvy sa
# z plánu nemažú – to je história a patrí do rúk človeku.

on:
  workflow_dispatch:
    inputs:
      co:
        description: "Čo upratať"
        required: false
        default: tyzdenne
        type: choice
        options:
          - tyzdenne
          - behy
          - behy_a_vetvy
          - releasy_a_artefakty
          - cache
          - vsetko
      dry_run:
        description: "Len vypísať, čo by sa zmazalo (nič sa nemaže)"
        required: false
        default: false
        type: boolean
      keep_days:
        description: "Na Drive nechať záznamy mladšie než toľkoto dní (0 = nemazať podľa veku)"
        required: false
        default: "30"
        type: string
      keep_days_layers:
        description: "Hotové vrstvy (vrstevnice, skaly, tieňovanie) nechať toľkoto dní"
        required: false
        default: "180"
        type: string
      keep_gb:
        description: "Strop priečinka cache na Drive v GB (0 = bez stropu)"
        required: false
        default: "100"
        type: string
      keep_days_results:
        description: "V sklade `vysledky` nechať archívy mladšie než toľkoto dní"
        required: false
        default: "90"
        type: string
  schedule:
    # nedeľa 03:20 UTC – mimo času, keď sa buildy spúšťajú ručne
    - cron: "20 3 * * 0"

permissions:
  contents: read

concurrency:
  # dva behy naraz by si navzájom mazali to isté a hádzali 404
  group: cleanup
  cancel-in-progress: false

jobs:
  github:
    name: Upratať GitHub
    # pri behu z plánu je `inputs.co` prázdne – vtedy platí `tyzdenne`
    if: ${{ inputs.co != 'cache' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write    # mazanie behov, artefaktov a cache
      contents: write   # mazanie vetiev a releasov aj s ich tagmi
    steps:
      # checkout je tu kvôli jedinej veci: skript sa pozerá, či súbor workflowu
      # ešte existuje. Bez neho by mu všetky vyšli ako zrušené.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Behy, vetvy, releasy a artefakty
        env:
          GH_TOKEN: ${{ github.token }}
          # `tyzdenne` = releasy a artefakty; behy a vetvy sú história
          MODE: ${{ (inputs.co == '' || inputs.co == 'tyzdenne') && 'releasy_a_artefakty' || inputs.co }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python3 workers/tools/cleanup-actions.py

      # GitHubová cache má strop 10 GB a keď sa naplní, ticho vyhodí najstaršie
      # záznamy – preto sa presťahovala na Drive. To, čo v GitHube ostalo, už
      # nikto nehľadá.
      - name: Zmaž GitHub cache
        if: ${{ inputs.co == '' || inputs.co == 'tyzdenne' || inputs.co == 'cache' || inputs.co == 'vsetko' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python3 workers/tools/cleanup-cache.py

  drive:
    name: Prerieď Drive
    if: ${{ inputs.co == '' || inputs.co == 'tyzdenne' || inputs.co == 'cache' || inputs.co == 'vsetko' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # prerieďovanie maže súbory, takže potrebuje token vlastníka s rozsahom
      # na zápis; readonly to povie hneď a s návodom
      GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
      DRIVE_CLIENT: ${{ vars.DRIVE_CLIENT }}
      DRIVE_SECRET: ${{ secrets.DRIVE_SECRET }}
      DRIVE_REFRESH: ${{ secrets.DRIVE_REFRESH }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # lacná otázka na začiatok – inak sa odpoveď dozvieme až z 403 pri mazaní
      - name: Prístup k cache na Drive
        continue-on-error: true
        run: python3 workers/drive/cache.py --check

      # dve rýchlosti: hotové vrstvy z výškového modelu sú hodiny výpočtu na
      # kraj a dávka ich berie hotové aj o mesiace. Zvyšok (DEM dlaždice,
      # Planetiler, PBF) sa dá zohnať znova, tak mu 30 dní stačí.
      - name: Prerieď cache na Drive
        env:
          KEEP_DAYS: ${{ inputs.keep_days }}
          KEEP_DAYS_LAYERS: ${{ inputs.keep_days_layers }}
          KEEP_GB: ${{ inputs.keep_gb }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ "${DRY_RUN:-false}" = "true" ]; then ARGS+=(--dry-run); fi
          python3 workers/drive/cache.py --prune \
            --keep-days="${KEEP_DAYS:-30}" \
            --keep-days-layers="${KEEP_DAYS_LAYERS:-180}" \
            --keep-gb="${KEEP_GB:-100}" \
            "${ARGS[@]}" \
            --summary="$GITHUB_STEP_SUMMARY"

      # sklad `vysledky` nahradil dlhodobé artefakty a rovnako ako ony sa má
      # sám prerieďovať; ostatné sklady nie – výškový model je drahé zrkadlo
      - name: Prerieď sklad medzivýsledkov
        continue-on-error: true
        env:
          KEEP_DAYS: ${{ inputs.keep_days_results }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ "${DRY_RUN:-false}" = "true" ]; then ARGS+=(--dry-run); fi
          python3 workers/drive/store.py --prune --store=vysledky \
            --keep-days="${KEEP_DAYS:-90}" \
            "${ARGS[@]}" \
            --summary="$GITHUB_STEP_SUMMARY"
