name: Údržba · týždenné upratovanie

# Jediný upratovací workflow. Vznikol z dvoch (`cleanup-actions.yml`
# a `cleanup-cache.yml`), ktoré robili tú istú prácu na dvoch miestach: raz za
# týždeň zmazať to, čo po behoch ostalo. Dva riadky v zozname Actions, dva
# plány (03:20 a 03:50, posunuté len preto, aby si nelezli do cesty) a dva
# formuláre s tým istým `dry_run`. Teraz je to jeden workflow s dvoma jobmi –
# `github` a `drive` – a tie sú oddelené preto, že sa líšia právami aj tým,
# čo ich vie zhodiť (GitHub API vs. Drive API).
#
# PREČO WORKFLOW A NIE PULL REQUEST: behy, vetvy, releasy, artefakty ani cache
# nie sú súbory v repozitári, takže sa nedajú zmazať zmenou kódu. Token mimo
# Actions na to nemá právo (`Resource not accessible by integration`), vnútri
# behu ho `GITHUB_TOKEN` má – keď mu to workflow dovolí nižšie v `permissions`.
#
# ČO MAŽE NA GITHUBE:
#   • behy zrušených workflowov – po zmazanom súbore ostane položka v zozname
#     Actions navždy, zmizne až keď má nula behov (sem patria sondy `zz-*`);
#   • behy odmietnutých súborov – keď je súbor workflowu neplatný, GitHub pri
#     pushi vyrobí beh BEZ JOBOV, pomenovaný cestou k súboru, a vyzerá to, že
#     sa workflow spustil sám po mergi;
#   • voliteľne vetvy `claude/*`, ktoré sú celé v hlavnej vetve;
#   • releasy (`dem-sonny`, `dem-dmr5`, `dem-terrain`, …), ich assety a tagy;
#   • artefakty všetkých behov;
#   • GitHub cache – tá sa už nepoužíva (všetko je na Drive), takže tam len
#     zaberá miesto.
#
# NIČ SA TÝM NESTRATÍ. Výškové modely, skaly, tieňovanie aj medzivýsledky na
# pozretie ležia v sklade na Google Drive (`workers/drive/store.py`) – to je
# JEDINÉ miesto, kam pipeline publikuje. Že sa `gh release` ani dlhodobý
# artefakt nevrátia, stráži `Kontrola · lint workflowov`.
#
# ČO PRERIEĎUJE NA DRIVE. GitHub si staré záznamy vyhadzoval sám (7 dní bez
# použitia, 10 GB na repozitár), Drive nie – bez toho by priečinok rástol
# donekonečna a raz by zaplnil účet, ktorý drží aj DMR 5.0. Cache sa
# prerieďuje DVOMA rýchlosťami: hotové vrstvy z výškového modelu (vrstevnice,
# skaly, tieňovanie) sú hodiny výpočtu na kraj a držia sa 180 dní, zvyšok 30 –
# rozpis je vo `workers/drive/cache.py`. To isté platí pre
# sklad `vysledky`: odkedy sa nepublikuje do artefaktov, padá doňho jeden
# archív medzivýsledkov na beh, teda niečo, čo len rastie. Prerieďuje sa na
# 90 dní, presne tá retencia, ktorú mal artefakt. Sklady s výškovým modelom sa
# NEPRERIEĎUJÚ: to sú drahé zrkadlá (jeden stupeň DMR 5.0 je pol hodiny
# čítania z Drive) a majú tam ležať, kým ich niekto ručne nezmaže.
#
# TÝŽDENNE beží `tyzdenne`: releasy, artefakty a obe cache. Behy a vetvy sa
# z plánu NEMAŽÚ – to je história a patrí do rúk človeku. „Len vypísať"
# nemaže nič.

on:
  workflow_dispatch:
    inputs:
      co:
        description: "Čo upratať"
        required: false
        default: tyzdenne
        type: choice
        options:
          - tyzdenne
          - behy
          - behy_a_vetvy
          - releasy_a_artefakty
          - cache
          - vsetko
      dry_run:
        description: "Len vypísať, čo by sa zmazalo (nič sa nemaže)"
        required: false
        default: false
        type: boolean
      keep_days:
        description: "Na Drive nechať záznamy mladšie než toľkoto dní (0 = nemazať podľa veku)"
        required: false
        default: "30"
        type: string
      keep_days_layers:
        description: "Hotové vrstvy (vrstevnice, skaly, tieňovanie) nechať toľkoto dní"
        required: false
        default: "180"
        type: string
      keep_gb:
        description: "Strop priečinka cache na Drive v GB (0 = bez stropu)"
        required: false
        default: "100"
        type: string
      keep_days_results:
        description: "V sklade `vysledky` nechať archívy mladšie než toľkoto dní"
        required: false
        default: "90"
        type: string
  schedule:
    # Nedeľa 03:20 UTC – mimo času, keď sa buildy spúšťajú ručne. Kým to boli
    # dva workflowy, museli mať dva časy; jeden workflow s dvoma jobmi si do
    # cesty nelezie, tak stačí jeden.
    - cron: "20 3 * * 0"

permissions:
  contents: read

concurrency:
  # Dva behy naraz by si navzájom mazali to isté a hádzali 404.
  group: cleanup
  cancel-in-progress: false

jobs:
  # ---------- GitHub: behy, vetvy, releasy, artefakty, cache ----------
  github:
    name: Upratať GitHub
    # Pri behu z plánu je `inputs.co` prázdne – vtedy platí `tyzdenne`, teda
    # releasy a artefakty. Samotná cache sa upratuje v druhom kroku.
    if: ${{ inputs.co != 'cache' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write    # mazanie behov, artefaktov a cache
      contents: write   # mazanie vetiev a releasov aj s ich tagmi
    steps:
      # Checkout je tu kvôli jedinej veci: skript sa pozerá, či súbor
      # workflowu ešte existuje. Bez neho by mu všetky vyšli ako zrušené.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Behy, vetvy, releasy a artefakty
        env:
          GH_TOKEN: ${{ github.token }}
          # `tyzdenne` (aj beh z plánu, kde je `inputs.co` prázdne) = releasy
          # a artefakty. Behy a vetvy sú história a tú maže človek.
          MODE: ${{ (inputs.co == '' || inputs.co == 'tyzdenne') && 'releasy_a_artefakty' || inputs.co }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python3 workers/tools/cleanup-actions.py

      # GitHubová cache má na repozitár strop 10 GB a keď sa naplní, nič
      # nepovie – ticho vyhodí najstaršie záznamy. Práve preto sa cache
      # presťahovala na Drive (`workers/drive/cache.py`) a to, čo v GitHube
      # ostalo, už nikto nehľadá. Keďže build tam nič nové neukladá, po
      # zmazaní to ostane prázdne.
      - name: Zmaž GitHub cache
        if: ${{ inputs.co == '' || inputs.co == 'tyzdenne' || inputs.co == 'cache' || inputs.co == 'vsetko' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python3 workers/tools/cleanup-cache.py

  # ---------- Drive: cache buildu a sklad medzivýsledkov ----------
  drive:
    name: Prerieď Drive
    if: ${{ inputs.co == '' || inputs.co == 'tyzdenne' || inputs.co == 'cache' || inputs.co == 'vsetko' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Prerieďovanie na Drive maže súbory, takže potrebuje token vlastníka
      # – a s rozsahom na zápis. Readonly token to povie hneď a s návodom.
      GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
      DRIVE_CLIENT: ${{ vars.DRIVE_CLIENT }}
      DRIVE_SECRET: ${{ secrets.DRIVE_SECRET }}
      DRIVE_REFRESH: ${{ secrets.DRIVE_REFRESH }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Lacná otázka na začiatok: vie tento beh na Drive vôbec zapisovať?
      # Odpoveď sa inak dozvieme až tým, že mazanie vráti 403.
      - name: Prístup k cache na Drive
        continue-on-error: true
        run: python3 workers/drive/cache.py --check

      # DVE RÝCHLOSTI, JEDNO PRERIEĎOVANIE. Hotové vrstvy z výškového modelu
      # (vrstevnice, skaly, tieňovanie) sú hodiny výpočtu na kraj a build sa
      # na ne vie spýtať aj o mesiace – dávka nad krajinou ich berie hotové,
      # keď sedia nastavenia. Tridsať dní na ne teda znamenalo, že dávka
      # spustená o mesiac počíta celé Slovensko odznova, hoci výsledok
      # v priečinku ležal. Zvyšok (stiahnuté DEM dlaždice, Planetiler, PBF) sa
      # dá zohnať znova, tak mu tridsať dní stačí.
      - name: Prerieď cache na Drive
        env:
          KEEP_DAYS: ${{ inputs.keep_days }}
          KEEP_DAYS_LAYERS: ${{ inputs.keep_days_layers }}
          KEEP_GB: ${{ inputs.keep_gb }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ "${DRY_RUN:-false}" = "true" ]; then ARGS+=(--dry-run); fi
          python3 workers/drive/cache.py --prune \
            --keep-days="${KEEP_DAYS:-30}" \
            --keep-days-layers="${KEEP_DAYS_LAYERS:-180}" \
            --keep-gb="${KEEP_GB:-100}" \
            "${ARGS[@]}" \
            --summary="$GITHUB_STEP_SUMMARY"

      # Sklad `vysledky` je to, čo nahradilo dlhodobé artefakty behov –
      # a rovnako ako ony sa má sám prerieďovať. Ostatné sklady nie: výškový
      # model je drahé zrkadlo, nie odpad po behu.
      - name: Prerieď sklad medzivýsledkov
        continue-on-error: true
        env:
          KEEP_DAYS: ${{ inputs.keep_days_results }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ "${DRY_RUN:-false}" = "true" ]; then ARGS+=(--dry-run); fi
          python3 workers/drive/store.py --prune --store=vysledky \
            --keep-days="${KEEP_DAYS:-90}" \
            "${ARGS[@]}" \
            --summary="$GITHUB_STEP_SUMMARY"
