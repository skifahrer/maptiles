name: Maintenance · weekly cleanup

# The one cleanup workflow: once a week it deletes what runs left behind.
# Two jobs (`github` and `drive`), since they differ in rights and in what can fail them.
#
# A workflow, not a pull request, because runs, branches, releases, artifacts and
# caches aren't files in the repository – only `GITHUB_TOKEN` inside a run can
# delete them.
#
# On GitHub it deletes runs of retired workflows and rejected files, releases and
# their assets, artifacts, the GitHub cache (no longer used) and optionally
# `claude/*` branches. Nothing is lost – everything published lies in the Drive
# store (`workers/drive/store.py`).
#
# On Drive it thins the cache at two speeds: finished elevation layers 180 days
# (hours of compute per region), the rest 30. The `results` store 90 days, the
# retention artifacts had. Elevation model stores aren't thinned – costly mirrors.
#
# The schedule runs `weekly`: releases, artifacts and both caches. Runs and
# branches aren't deleted on schedule – that's history, for a human to decide.

on:
  workflow_dispatch:
    inputs:
      what:
        description: "What to clean"
        required: false
        default: weekly
        type: choice
        options:
          - weekly
          - runs
          - runs_and_branches
          - releases_and_artifacts
          - cache
          - everything
      dry_run:
        description: "Only list what would be deleted (nothing is deleted)"
        required: false
        default: false
        type: boolean
      keep_days:
        description: "On Drive keep entries younger than this many days (0 = no age limit)"
        required: false
        default: "30"
        type: string
      keep_days_layers:
        description: "Keep finished layers (contours, rocks, shading) this many days"
        required: false
        default: "180"
        type: string
      keep_gb:
        description: "Drive cache folder cap in GB (0 = no cap)"
        required: false
        default: "100"
        type: string
      keep_days_results:
        description: "In the `results` store keep archives younger than this many days"
        required: false
        default: "90"
        type: string
  schedule:
    # Sunday 03:20 UTC – outside the hours builds are started by hand
    - cron: "20 3 * * 0"

permissions:
  contents: read

concurrency:
  # two runs at once would delete the same things and throw 404s
  group: cleanup
  cancel-in-progress: false

jobs:
  github:
    name: Clean GitHub
    # a scheduled run has an empty `inputs.what` – then `weekly` applies
    if: ${{ inputs.what != 'cache' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write    # deleting runs, artifacts and caches
      contents: write   # deleting branches and releases with their tags
    steps:
      # checkout for one thing: the script checks whether a workflow file still
      # exists; without it every workflow would look retired
      - name: Checkout
        uses: actions/checkout@v7

      - name: Runs, branches, releases and artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          # `weekly` = releases and artifacts; runs and branches are history
          MODE: ${{ (inputs.what == '' || inputs.what == 'weekly') && 'releases_and_artifacts' || inputs.what }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python3 workers/tools/cleanup-actions.py

      # GitHub's cache caps at 10 GB and quietly evicts the oldest when full – so
      # it moved to Drive; nobody looks for what's left on GitHub
      - name: Delete the GitHub cache
        if: ${{ inputs.what == '' || inputs.what == 'weekly' || inputs.what == 'cache' || inputs.what == 'everything' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python3 workers/tools/cleanup-cache.py

  drive:
    name: Thin Drive
    if: ${{ inputs.what == '' || inputs.what == 'weekly' || inputs.what == 'cache' || inputs.what == 'everything' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # thinning deletes files, so it needs the owner's token with write scope;
      # a readonly one says so at once, with instructions
      GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
      DRIVE_CLIENT: ${{ vars.DRIVE_CLIENT }}
      DRIVE_SECRET: ${{ secrets.DRIVE_SECRET }}
      DRIVE_REFRESH: ${{ secrets.DRIVE_REFRESH }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # a cheap question first – otherwise the answer is a 403 while deleting
      - name: Drive cache access
        continue-on-error: true
        run: python3 workers/drive/cache.py --check

      # two speeds: finished elevation layers are hours of compute per region and
      # batches reuse them months later; the rest (DEM tiles, Planetiler, PBF)
      # can be fetched again, so 30 days do
      - name: Thin the Drive cache
        env:
          KEEP_DAYS: ${{ inputs.keep_days }}
          KEEP_DAYS_LAYERS: ${{ inputs.keep_days_layers }}
          KEEP_GB: ${{ inputs.keep_gb }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ "${DRY_RUN:-false}" = "true" ]; then ARGS+=(--dry-run); fi
          python3 workers/drive/cache.py --prune \
            --keep-days="${KEEP_DAYS:-30}" \
            --keep-days-layers="${KEEP_DAYS_LAYERS:-180}" \
            --keep-gb="${KEEP_GB:-100}" \
            "${ARGS[@]}" \
            --summary="$GITHUB_STEP_SUMMARY"

      # the `results` store replaced long-lived artifacts and thins like they did;
      # other stores don't – an elevation model is a costly mirror
      - name: Thin the intermediate results store
        continue-on-error: true
        env:
          KEEP_DAYS: ${{ inputs.keep_days_results }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ "${DRY_RUN:-false}" = "true" ]; then ARGS+=(--dry-run); fi
          # `vysledky` is the former name of `results`
          for STORE in results vysledky; do
            python3 workers/drive/store.py --prune --store="$STORE" \
              --keep-days="${KEEP_DAYS:-90}" \
              "${ARGS[@]}" \
              --summary="$GITHUB_STEP_SUMMARY"
          done
