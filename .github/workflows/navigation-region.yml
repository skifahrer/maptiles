name: Map · region routing network

# ONE REGION'S ROUTING NETWORK – `<region>-routing.pmtiles`. It rides in the base
# map (part `routing`) and in the `roads` package; it has no package of its own.
#
# TAGS go to the phone, not costs: a user's profile (road types turned off,
# vehicle size, vignettes) can't be baked into a precomputed graph. The format
# is in `docs/routing-tiles.md`, the reason in `docs/navigation.md` §10.
#
# It replaced Valhalla's graph, which weighed 176 – 192 MB per region and ended
# at the region border. `workers/routing/graph.sh` and the national `navigation.yml`
# stay as the reference build the new engine is cross-checked against.
#
# A file of its own because `build-map-region.yml` is near the 128 KiB cap.

on:
  workflow_call:
    inputs:
      region_key:
        description: "Region key – it names `{region}-routing.pmtiles`"
        required: true
        type: string
      region_name:
        description: "Region name for the archive metadata"
        required: false
        default: ""
        type: string
      routing_country:
        description: "The region's ISO country code (`iso` in regions.json) – the vignette stands on it"
        required: false
        default: ""
        type: string
      # the same for every region of a country – archives with different orders
      # must not be joined on the phone
      routing_area:
        description: "The area the node order is over (`routing_area` in regions.json)"
        required: false
        default: ""
        type: string
      # heights and edge profiles; without a bbox the archive goes without both
      dem_bbox:
        description: "Elevation model bbox W,S,E,N (`dem_bbox` from the plan)"
        required: false
        default: ""
        type: string
      routing_dem_source:
        description: "Elevation model for edge profiles; falls back to `sonny` when the store lacks it"
        required: false
        default: "dmr5"
        type: string
      size_limit_mb:
        description: "The whole page budget in MB"
        required: false
        default: "900"
        type: string
      budget_pct:
        description: "The routing network's share of the page budget in percent"
        required: false
        default: "3"
        type: string
      order_max_age_days:
        description: "After how many days a cached node order is recomputed (0 = always)"
        required: false
        default: "30"
        type: string
    # `workflow_call` doesn't inherit secrets; without them the Drive cache can't
    # open and the archive would go without node order and heights.
    secrets:
      GDRIVE_CREDENTIALS:
        required: false
      DRIVE_SECRET:
        required: false
      DRIVE_REFRESH:
        required: false
    outputs:
      enabled:
        description: "Was an archive made? (a cutout may hold no road)"
        value: ${{ jobs.routing.outputs.enabled }}
      size_mb:
        description: "Archive size in MB"
        value: ${{ jobs.routing.outputs.size_mb }}

# Drive sign-in for the whole workflow: the node-order cache
env:
  GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
  DRIVE_CLIENT: ${{ vars.DRIVE_CLIENT }}
  DRIVE_SECRET: ${{ secrets.DRIVE_SECRET }}
  DRIVE_REFRESH: ${{ secrets.DRIVE_REFRESH }}
  OSMFR_BASE: https://download.openstreetmap.fr/extracts

jobs:
  routing:
    name: Routing network from the region PBF
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.routing.outputs.enabled }}
      size_mb: ${{ steps.routing.outputs.size_mb }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Prepare the timing folder
        run: mkdir -p steps-out

      # the map's own PBF – a second extract would be a second truth about the
      # area routing covers (guarded by `workers/lint/navigation.py`)
      - name: Download the PBF from the plan
        uses: actions/download-artifact@v8
        with:
          name: pbf
          path: data

      # The CCH node order is computed over the WHOLE area, not the region –
      # regions with different orders must not be joined on the phone. It comes
      # from the cache (the key is a prefix, so the area's newest order); when
      # missing or older than `order_max_age_days` it's computed HERE and saved,
      # so the relay's first region makes it and the rest take it.
      # `continue-on-error`: an archive without an order is still valid, the
      # phone just computes it itself – and `build.sh` says so.
      - name: Take the node order from the cache
        if: ${{ inputs.routing_area != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-restore
        with:
          path: data/routing-order.json
          key: routing-order-v1-${{ inputs.routing_area }}
          restore-keys: routing-order-v1-${{ inputs.routing_area }}-

      # described in `workers/routing/order.sh` – the same script
      # “Routing · node order” recomputes it with by hand
      - name: Node order – from the cache, or computed
        id: order
        if: ${{ inputs.routing_area != '' }}
        continue-on-error: true
        env:
          AREA: ${{ inputs.routing_area }}
          ORDER_MAX_AGE_DAYS: ${{ inputs.order_max_age_days }}
        run: workers/routing/order.sh

      # the key carries `run_id` since an existing one isn't overwritten; it's
      # found through `restore-keys` (a prefix, the newest entry wins)
      - name: Save the computed order to the Drive cache
        if: ${{ steps.order.outputs.computed == 'true' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: data/routing-order.json
          key: routing-order-v1-${{ inputs.routing_area }}-${{ github.run_id }}

      # described in `workers/routing/build.sh`
      - name: Routing network from OSM → PMTiles
        id: routing
        env:
          REGION_KEY: ${{ inputs.region_key }}
          REGION_NAME: ${{ inputs.region_name }}
          ROUTING_COUNTRY: ${{ inputs.routing_country }}
          DEM_BBOX: ${{ inputs.dem_bbox }}
          ROUTING_DEM_SOURCE: ${{ inputs.routing_dem_source }}
          SIZE_LIMIT_MB: ${{ inputs.size_limit_mb }}
          BUDGET_ROUTING_PCT: ${{ inputs.budget_pct }}
        run: workers/routing/build.sh

      # `site-…` on purpose: the archive is a few MB, so it goes into `_site` like
      # any layer and `deploy` puts it into the map and `roads` from the manifest
      - name: Upload the site part
        if: ${{ always() && hashFiles('_site/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: site-routing
          path: _site
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore

      - name: Upload the step timing
        if: ${{ always() && hashFiles('steps-out/*') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: steps-region-routing
          path: steps-out
          retention-days: 1
          if-no-files-found: ignore
