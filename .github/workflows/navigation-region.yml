name: Mapa · smerovacia sieť kraja

# SMEROVACIA SIEŤ JEDNÉHO KRAJA – `<kraj>-routing.pmtiles`, balík `navigacia`.
#
# Do telefónu ide TAG, nie cena: profil používateľa (vypnuté typy ciest,
# rozmery vozidla, známky) sa do predpočítaného grafu zapiecť nedá. Rozpis
# formátu je v `docs/routing-tiles.md`, dôvod v `docs/navigation.md` §10.
#
# Nahradilo to graf Valhally, ktorý vážil 176 – 192 MB na kraj a na hranici
# kraja končil. `workers/routing/graph.sh` a celoštátny `navigation.yml`
# ostávajú ako referenčná stavba, proti ktorej sa nový motor krížom kontroluje.
#
# Samostatný súbor preto, že `build-map-region.yml` je pri strope 128 KiB.

on:
  workflow_call:
    inputs:
      region_key:
        description: "Kľúč regiónu – z neho je meno `{region}-routing.pmtiles`"
        required: true
        type: string
      region_name:
        description: "Meno regiónu do metadát archívu"
        required: false
        default: ""
        type: string
      routing_country:
        description: "ISO kód krajiny kraja (`iso` v regions.json) – bez neho nemá diaľničná známka na čom stáť"
        required: false
        default: ""
        type: string
      size_limit_mb:
        description: "Rozpočet celej stránky v MB"
        required: false
        default: "900"
        type: string
      budget_pct:
        description: "Podiel smerovacej siete na rozpočte stránky v percentách"
        required: false
        default: "3"
        type: string
    outputs:
      enabled:
        description: "Vznikol archív? (vo výreze nemusí byť ani jedna cesta)"
        value: ${{ jobs.routing.outputs.enabled }}
      size_mb:
        description: "Veľkosť archívu v MB"
        value: ${{ jobs.routing.outputs.size_mb }}

jobs:
  routing:
    name: Smerovacia sieť z PBF kraja
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.routing.outputs.enabled }}
      size_mb: ${{ steps.routing.outputs.size_mb }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Priprav priečinok na meranie
        run: mkdir -p steps-out

      # to isté PBF, z akého je mapa – druhý extrakt by bola druhá pravda
      # o tom, za aké územie navigácia je (stráži `workers/lint/navigation.py`)
      - name: Stiahni PBF z prípravy
        uses: actions/download-artifact@v8
        with:
          name: pbf
          path: data

      # rozpis je vo `workers/routing/build.sh`
      - name: Smerovacia sieť z OSM → PMTiles
        id: routing
        env:
          REGION_KEY: ${{ inputs.region_key }}
          REGION_NAME: ${{ inputs.region_name }}
          ROUTING_COUNTRY: ${{ inputs.routing_country }}
          SIZE_LIMIT_MB: ${{ inputs.size_limit_mb }}
          BUDGET_ROUTING_PCT: ${{ inputs.budget_pct }}
        run: workers/routing/build.sh

      # `site-…` zámerne: archív je jednotky MB, takže ide do `_site` ako každá
      # iná vrstva a `deploy` ho z manifestu zabalí do `navigacia`. Graf
      # Valhally mal vlastný artefakt práve preto, že to jednotky MB neboli.
      - name: Odlož časť stránky
        if: ${{ always() && hashFiles('_site/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: site-navigacia
          path: _site
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore

      - name: Odlož meranie krokov
        if: ${{ always() && hashFiles('steps-out/*') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: steps-navigacia
          path: steps-out
          retention-days: 1
          if-no-files-found: ignore
