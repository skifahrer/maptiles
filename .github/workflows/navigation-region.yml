name: Mapa · navigačný graf kraja

# NAVIGAČNÝ GRAF (Valhalla) PRE JEDEN KRAJ, s vlastným balíkom
# `<kraj>-navigacia.zip`. Dovnútra mapy sa nebalí: graf kraja váži 170–190 MB
# a mapa s ním 283 MB. Že sa o ňom dá dozvedieť, drží katalóg.
#
# Trasa v ňom končí na hranici kraja – PBF je rezaný presnou hranicou z OSM
# a hrana bez druhého konca je slepá ulica. Je to zámer a `graf.json` to
# o sebe hovorí. Cez hranicu vedie celoštátny graf z `navigation.yml`.
#
# Samostatný súbor preto, že `build-map-region.yml` je pri strope 128 KiB.
# Graf stavia `workers/routing/graph.sh`, to isté, čo púšťa celoštátna
# pipeline – líši sa len tým, čo dostane.

on:
  workflow_call:
    inputs:
      region_key:
        description: "Kľúč regiónu – ide do `graf.json` ako rozsah grafu"
        required: true
        type: string
      valhalla_image:
        description: "Docker obraz Valhally (radšej s tagom než latest)"
        required: false
        default: "ghcr.io/valhalla/valhalla-scripted:latest"
        type: string
    outputs:
      graph_mb:
        description: "Veľkosť grafu v MB (0 = nevznikol)"
        value: ${{ jobs.graf.outputs.graph_mb }}
      valhalla:
        description: "Verzia motora, ktorou je graf postavený"
        value: ${{ jobs.graf.outputs.valhalla }}

jobs:
  graf:
    name: Graf z PBF kraja
    runs-on: ubuntu-latest
    outputs:
      graph_mb: ${{ steps.graph.outputs.graph_mb }}
      valhalla: ${{ steps.graph.outputs.valhalla }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Priprav priečinok na meranie
        run: mkdir -p steps-out

      # to isté PBF, z akého je mapa – druhý extrakt by bola druhá pravda
      # o tom, za aké územie navigácia je (stráži `workers/lint/navigation.py`)
      - name: Stiahni PBF z prípravy
        uses: actions/download-artifact@v8
        with:
          name: pbf
          path: data

      # Docker je na `ubuntu-latest` k dispozícii
      - name: Graf Valhally z PBF kraja
        id: graph
        env:
          REGION_KEY: ${{ inputs.region_key }}
          ROUTING_PBF: data/region.osm.pbf
          VALHALLA_IMAGE: ${{ inputs.valhalla_image }}
        run: workers/routing/graph.sh

      # artefakt sa nevolá `site-…` zámerne: `deploy` zlieva `site-*` do `_site`
      # pred nahratím na Pages a graf tam nemá čo robiť. Balenie si ho stiahne
      # menom, až za tým krokom.
      - name: Odlož graf pre balenie
        if: ${{ always() && hashFiles('_site/routing/*') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: navigacia-graf
          path: _site
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore

      - name: Odlož meranie krokov
        if: ${{ always() && hashFiles('steps-out/*') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: steps-navigacia
          path: steps-out
          retention-days: 1
          if-no-files-found: ignore
