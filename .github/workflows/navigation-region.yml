name: Mapa · smerovacia sieť kraja

# SMEROVACIA SIEŤ JEDNÉHO KRAJA – `<kraj>-routing.pmtiles`. Ide v základnej
# mape (časť `navigacia`) aj v balíku `cesty`; vlastný balík nemá.
#
# Do telefónu ide TAG, nie cena: profil používateľa (vypnuté typy ciest,
# rozmery vozidla, známky) sa do predpočítaného grafu zapiecť nedá. Rozpis
# formátu je v `docs/routing-tiles.md`, dôvod v `docs/navigation.md` §10.
#
# Nahradilo to graf Valhally, ktorý vážil 176 – 192 MB na kraj a na hranici
# kraja končil. `workers/routing/graph.sh` a celoštátny `navigation.yml`
# ostávajú ako referenčná stavba, proti ktorej sa nový motor krížom kontroluje.
#
# Samostatný súbor preto, že `build-map-region.yml` je pri strope 128 KiB.

on:
  workflow_call:
    inputs:
      region_key:
        description: "Kľúč regiónu – z neho je meno `{region}-routing.pmtiles`"
        required: true
        type: string
      region_name:
        description: "Meno regiónu do metadát archívu"
        required: false
        default: ""
        type: string
      routing_country:
        description: "ISO kód krajiny kraja (`iso` v regions.json) – bez neho nemá diaľničná známka na čom stáť"
        required: false
        default: ""
        type: string
      # rovnaké pre všetky kraje krajiny – archívy s rôznym poradím sa
      # v telefóne spojiť nesmú
      routing_area:
        description: "Územie, nad ktorým je poradie uzlov (`routing_area` v regions.json)"
        required: false
        default: ""
        type: string
      # výška na uzol; bez bboxu ide archív bez výšok
      dem_bbox:
        description: "Bbox W,S,E,N výškového modelu (`dem_bbox` z prípravy)"
        required: false
        default: ""
        type: string
      dem_source:
        description: "Model, z ktorého sa berú výšky uzlov (sonny, dmr35, dmr5)"
        required: false
        default: "sonny"
        type: string
      size_limit_mb:
        description: "Rozpočet celej stránky v MB"
        required: false
        default: "900"
        type: string
      budget_pct:
        description: "Podiel smerovacej siete na rozpočte stránky v percentách"
        required: false
        default: "3"
        type: string
      order_max_age_days:
        description: "Po koľkých dňoch sa poradie uzlov z cache prepočíta (0 = vždy)"
        required: false
        default: "30"
        type: string
    # `workflow_call` nededí secrets sám. Bez nich sa cache na Drive nemá ako
    # otvoriť a archív by šiel bez poradia uzlov aj bez výšok.
    secrets:
      GDRIVE_CREDENTIALS:
        required: false
      DRIVE_SECRET:
        required: false
      DRIVE_REFRESH:
        required: false
    outputs:
      enabled:
        description: "Vznikol archív? (vo výreze nemusí byť ani jedna cesta)"
        value: ${{ jobs.routing.outputs.enabled }}
      size_mb:
        description: "Veľkosť archívu v MB"
        value: ${{ jobs.routing.outputs.size_mb }}

# prihlásenie na Drive pre celý workflow: cache s poradím uzlov
env:
  GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
  DRIVE_CLIENT: ${{ vars.DRIVE_CLIENT }}
  DRIVE_SECRET: ${{ secrets.DRIVE_SECRET }}
  DRIVE_REFRESH: ${{ secrets.DRIVE_REFRESH }}
  OSMFR_BASE: https://download.openstreetmap.fr/extracts

jobs:
  # Výškový model si navigácia dopĺňa sama. Kým ho pýtali len vrstevnice
  # a tieňovanie, hotové z cache neprosili o nič a archív kraja ticho vyšiel
  # bez výšok – dvakrát po sebe, pri zelenom behu.
  # `dmr5` sa sem nepýta: 145 GB sa nezrkadlí, číta sa oknom cez HTTP Range
  # priamo v stavbe archívu (`vysky.py --dem=drive`).
  vysky:
    name: Výškový model pre výšky uzlov
    runs-on: ubuntu-latest
    if: ${{ inputs.dem_bbox != '' && inputs.dem_source != 'dmr5' }}
    outputs:
      doplnit: ${{ steps.check.outputs.mirror_routing }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Je model v sklade?
        id: check
        env:
          BBOX: ${{ inputs.dem_bbox }}
          SRC_ROUTING: ${{ inputs.dem_source }}
        run: workers/dem/check.sh

  doplnit-vysky:
    name: Doplniť výškový model
    needs: [vysky]
    if: ${{ !cancelled() && needs.vysky.outputs.doplnit != '' }}
    permissions:
      contents: read
    uses: ./.github/workflows/update-dem.yml
    with:
      what: ${{ needs.vysky.outputs.doplnit }}
    secrets:
      GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
      DRIVE_SECRET: ${{ secrets.DRIVE_SECRET }}
      DRIVE_REFRESH: ${{ secrets.DRIVE_REFRESH }}

  routing:
    name: Smerovacia sieť z PBF kraja
    runs-on: ubuntu-latest
    # `!cancelled()`: doplnenie sa preskočí, keď je model v sklade, a
    # preskočený job by inak zhodil aj tento
    needs: [vysky, doplnit-vysky]
    if: ${{ !cancelled() }}
    outputs:
      enabled: ${{ steps.routing.outputs.enabled }}
      size_mb: ${{ steps.routing.outputs.size_mb }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Priprav priečinok na meranie
        run: mkdir -p steps-out

      # to isté PBF, z akého je mapa – druhý extrakt by bola druhá pravda
      # o tom, za aké územie navigácia je (stráži `workers/lint/navigation.py`)
      - name: Stiahni PBF z prípravy
        uses: actions/download-artifact@v8
        with:
          name: pbf
          path: data

      # Poradie uzlov pre CCH sa počíta nad CELÝM územím, nie nad krajom –
      # kraje s rôznym poradím sa v telefóne spojiť nesmú. Berie sa z cache
      # (kľúč je predpona, teda najnovšie uložené poradie toho územia); keď tam
      # nie je alebo je staršie než `order_max_age_days`, dopočíta sa TU a
      # uloží, takže prvý kraj štafety ho vyrobí a ostatné ho vezmú.
      # `continue-on-error`: archív bez poradia je platný archív, len si ho
      # telefón doráta sám – a `build.sh` to povie.
      - name: Vezmi poradie uzlov z cache
        if: ${{ inputs.routing_area != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-restore
        with:
          path: data/routing-order.json
          key: routing-order-v1-${{ inputs.routing_area }}
          restore-keys: routing-order-v1-${{ inputs.routing_area }}-

      # rozpis vo `workers/routing/order.sh` – ten istý skript, akým poradie
      # ručne prepočíta „Navigácia · poradie uzlov"
      - name: Poradie uzlov – z cache, alebo dopočítať
        id: order
        if: ${{ inputs.routing_area != '' }}
        continue-on-error: true
        env:
          AREA: ${{ inputs.routing_area }}
          ORDER_MAX_AGE_DAYS: ${{ inputs.order_max_age_days }}
        run: workers/routing/order.sh

      # kľúč nesie `run_id`, lebo existujúci sa neprepisuje; hľadá sa cez
      # `restore-keys` (predpona, najnovší záznam vyhrá)
      - name: Ulož dopočítané poradie do cache na Drive
        if: ${{ steps.order.outputs.computed == 'true' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: data/routing-order.json
          key: routing-order-v1-${{ inputs.routing_area }}-${{ github.run_id }}

      # rozpis je vo `workers/routing/build.sh`
      - name: Smerovacia sieť z OSM → PMTiles
        id: routing
        env:
          REGION_KEY: ${{ inputs.region_key }}
          REGION_NAME: ${{ inputs.region_name }}
          ROUTING_COUNTRY: ${{ inputs.routing_country }}
          DEM_BBOX: ${{ inputs.dem_bbox }}
          ROUTING_DEM_SOURCE: ${{ inputs.dem_source }}
          SIZE_LIMIT_MB: ${{ inputs.size_limit_mb }}
          BUDGET_ROUTING_PCT: ${{ inputs.budget_pct }}
        run: workers/routing/build.sh

      # `site-…` zámerne: archív je jednotky MB, takže ide do `_site` ako každá
      # iná vrstva a `deploy` ho z manifestu dá do mapy aj do `cesty`. Graf
      # Valhally mal vlastný artefakt práve preto, že to jednotky MB neboli.
      - name: Odlož časť stránky
        if: ${{ always() && hashFiles('_site/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: site-navigacia
          path: _site
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore

      - name: Odlož meranie krokov
        if: ${{ always() && hashFiles('steps-out/*') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: steps-navigacia
          path: steps-out
          retention-days: 1
          if-no-files-found: ignore
