name: Map · Build map region

# PBF export of the chosen region from osm.fr → Planetiler → PMTiles → GitHub Pages.
#
# Planetiler caps `maxzoom <= 16`; MapLibre overzooms past it, so the top zoom
# is made without simplification. Another region: `custom_pbf_url` + `custom_name`.

on:
  workflow_dispatch:
    inputs:
      # the default is the region being worked on – the form resets on opening
      region:
        description: "Region (ignored when custom_pbf_url is set)"
        required: true
        default: bratislavsky
        type: choice
        options:
          - slovensko
          - bratislavsky
          - trnavsky
          - trenciansky
          - nitriansky
          - zilinsky
          - banskobystricky
          - presovsky
          - kosicky
      # a whole region ~40 min, one range ~2; shrinking a run has one lever – `test`
      area:
        description: "Range on which contours and rocks are computed"
        required: false
        default: whole_region
        type: choice
        options:
          - whole_region
          - tatry
          - vysoke_tatry
          - belianske_tatry
          - zapadne_tatry
          - nizke_tatry
          - slovensky_raj
          - pieniny
          - mala_fatra
          - velka_fatra
          - sulovske_skaly
          - slovensky_kras
          - muranska_planina
          - vihorlat
          - strazovske_vrchy
          - male_karpaty
      # a checkbox, not a number: the size rarely changes (`test_km2=4`); the
      # test key carries `_test4`, so it never lands in a real run's cache and
      # its entry goes to `maps-test.json`
      test:
        description: "Quick test: the whole run (map and terrain) only on 4 km² in the middle of the cut-out"
        required: false
        default: false
        type: boolean
      # one source choice per layer; `none` turns the layer off.
      # The list is workers/data/dem-sources.json. sonny = 20 m, dmr35 = 10 m,
      # dmr5 = LiDAR (with `area` the full 1 m, without it 5 m tiles).
      contour_source:
        description: "Contours – which terrain model (none = don't make)"
        required: false
        default: dmr5
        type: choice
        options:
          - sonny
          - sonny1
          - dmr35
          - dmr5
          - none
      # from the model's slope, or `shading` = polygons from the workflow
      # “Rocks from hillshading”, which the build calls when needed
      rock_source:
        description: "Rocks – from the model's slope, or from hillshading (none = don't make)"
        required: false
        default: dmr5
        type: choice
        options:
          - sonny
          - sonny1
          - dmr35
          - dmr5
          - shading
          - none
      # hillshading is always the whole region, so `dmr5` comes out at 5 m here
      shading_source:
        description: "Hillshading and 3D terrain – which model (none = don't make)"
        required: false
        default: dmr5
        type: choice
        options:
          - sonny
          - sonny1
          - dmr35
          - dmr5
          - none
      # `workflow_dispatch` takes 10 inputs at most; the contour interval is an
      # option (`options: contour_interval=10`)
      rock_slope:
        description: "From which slope (°) terrain is rock (50 = faces, 40 = steep slopes too)"
        required: false
        default: "50"
        type: string
      # deletes the cache and the stored version; `nothing` takes finished
      # layers. A test always rebuilds everything. Former values are still
      # taken (`REBUILD_ALIAS`); the guard is `workers/lint/rebuild.py`.
      rebuild:
        description: "What to rebuild even when it is cached"
        required: false
        default: nothing
        type: choice
        options:
          - nothing
          - contours
          - rocks
          - terrain
          - articles
          - everything
      # the tenth and last input – another switch goes into `options`.
      # Off still builds `_site`, just doesn't upload it; Drive is `options: publish=false`.
      publish_pages:
        description: "Deploy the finished map to GitHub Pages (unticked = Drive only)"
        required: false
        default: false
        type: boolean
      # e.g. `crop_bbox=18.9,49.1,19.2,49.3 size_limit_mb=1200`;
      # the list is workers/plan/options.py, an unknown key is an error
      options:
        description: "Rarely changed settings as key=value (see workers/plan/options.py)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Drive sign-in for the whole build, not per job – one forgotten job is enough
  GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
  DRIVE_CLIENT: ${{ vars.DRIVE_CLIENT }}
  DRIVE_SECRET: ${{ secrets.DRIVE_SECRET }}
  DRIVE_REFRESH: ${{ secrets.DRIVE_REFRESH }}
  OSMFR_BASE: https://download.openstreetmap.fr/extracts
  # glyphs are hosted by us – public fonts.openmaptiles.org would be a single point of failure
  GLYPHS_ZIP: https://github.com/openmaptiles/fonts/releases/download/v2.0/noto-sans.zip
  # jobs share the site budget by share: they run in parallel, nobody knows sizes yet
  BUDGET_CONTOURS_PCT: "25"
  # rocks have their own .pmtiles, so their own share
  BUDGET_ROCKS_PCT: "12"
  BUDGET_TERRAIN_PCT: "12"
  # waymarked trails are just lines with a few attributes
  BUDGET_TRAILS_PCT: "3"
  # landscape features: many fences, but from z15 on and merged
  BUDGET_FEATURES_PCT: "4"
  # boundaries: read by job `tiles` and by `boundaries.yml` (as an input, `env` isn't inherited)
  BUDGET_BOUNDARIES_PCT: "3"
  # water: many ditches, but from z13 on and merged
  BUDGET_WATER_PCT: "5"
  # railways: few lines, but they carry the track network for navigation
  BUDGET_RAIL_PCT: "3"
  # settlements: many buildings, not simplified
  BUDGET_BUILDINGS_PCT: "6"
  # the road network is the densest layer with our own schema (`workers/transport/build.sh`)
  BUDGET_TRANSPORT_PCT: "8"
  # routing tiles with signs, not a graph – single-digit MB per region
  BUDGET_ROUTING_PCT: "3"
  BUDGET_ASSETS_MB: "40"

# No job has `timeout-minutes` on purpose: the expensive phases can't resume,
# so a timeout meant "throw away an hour and a half". GitHub still caps a job at 360 min.
jobs:
  # first job: prints the form, the workflow `env:` and what the options gave
  settings:
    name: Run settings (form and options)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Print the run settings
        env:
          # the whole form at once – one by one, a new field would be forgotten
          INPUTS_JSON: ${{ toJSON(inputs) }}
          OPT_OPTIONS: ${{ inputs.options }}
          OPT_REBUILD: ${{ inputs.rebuild }}
          OPT_CONTOUR_SOURCE: ${{ inputs.contour_source }}
          OPT_ROCK_SOURCE: ${{ inputs.rock_source }}
          OPT_SHADING_SOURCE: ${{ inputs.shading_source }}
          OPT_TEST: ${{ inputs.test }}
          OPT_PUBLISH_PAGES: ${{ inputs.publish_pages }}
        run: workers/plan/settings.sh

  # contours, rocks and hillshading live in `dem-layers.yml`: “Regenerate
  # region layer” needs them too
  dem:
    name: Height-model layers
    needs: plan
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/dem-layers.yml
    secrets: inherit                      # Drive (stores and cache); `env` isn't inherited
    with:
      region_key: ${{ needs.plan.outputs.key }}
      area: ${{ inputs.area }}
      area_key: ${{ needs.plan.outputs.area_key }}
      area_name: ${{ needs.plan.outputs.area_name }}
      area_bbox: ${{ needs.plan.outputs.area_bbox }}
      area_km2: ${{ needs.plan.outputs.area_km2 }}
      dem_bbox: ${{ needs.plan.outputs.dem_bbox }}
      dem_bboxkey: ${{ needs.plan.outputs.dem_bboxkey }}
      test_km2: ${{ needs.plan.outputs.test_km2 }}
      day: ${{ needs.plan.outputs.day }}
      opt_contours: ${{ needs.plan.outputs.opt_contours }}
      opt_contour_lines: ${{ needs.plan.outputs.opt_contour_lines }}
      opt_rocks: ${{ needs.plan.outputs.opt_rocks }}
      opt_terrain: ${{ needs.plan.outputs.opt_terrain }}
      opt_contour_source: ${{ needs.plan.outputs.opt_contour_source }}
      opt_rock_source: ${{ needs.plan.outputs.opt_rock_source }}
      opt_rock_dem: ${{ needs.plan.outputs.opt_rock_dem }}
      opt_shading_source: ${{ needs.plan.outputs.opt_shading_source }}
      opt_ugkk_fallback: ${{ needs.plan.outputs.opt_ugkk_fallback }}
      opt_ugkk_urls: ${{ needs.plan.outputs.opt_ugkk_urls }}
      opt_contour_interval: ${{ needs.plan.outputs.opt_contour_interval }}
      opt_contour_maxzoom: ${{ needs.plan.outputs.opt_contour_maxzoom }}
      opt_contour_smoothing: ${{ needs.plan.outputs.opt_contour_smoothing }}
      rock_slope: ${{ inputs.rock_slope }}
      opt_rock_maxzoom: ${{ needs.plan.outputs.opt_rock_maxzoom }}
      opt_rock_res: ${{ needs.plan.outputs.opt_rock_res }}
      opt_rock_solid: ${{ needs.plan.outputs.opt_rock_solid }}
      opt_rock_fill_holes: ${{ needs.plan.outputs.opt_rock_fill_holes }}
      opt_rock_img_asset: ${{ needs.plan.outputs.opt_rock_img_asset }}
      opt_rock_img_zoom: ${{ needs.plan.outputs.opt_rock_img_zoom }}
      opt_rock_img_options: ${{ needs.plan.outputs.opt_rock_img_options }}
      opt_terrain_maxzoom: ${{ needs.plan.outputs.opt_terrain_maxzoom }}
      opt_contours_rebuild: ${{ needs.plan.outputs.opt_contours_rebuild }}
      opt_rocks_rebuild: ${{ needs.plan.outputs.opt_rocks_rebuild }}
      opt_terrain_rebuild: ${{ needs.plan.outputs.opt_terrain_rebuild }}
      opt_reuse_layers: ${{ needs.plan.outputs.opt_reuse_layers }}
      opt_size_limit_mb: ${{ needs.plan.outputs.opt_size_limit_mb }}
      budget_contours_pct: ${{ needs.plan.outputs.budget_contours_pct }}
      budget_rocks_pct: ${{ needs.plan.outputs.budget_rocks_pct }}
      budget_terrain_pct: ${{ needs.plan.outputs.budget_terrain_pct }}

  # articles only where neither cache nor catalog has them; a test doesn't fetch them
  wiki:
    name: Wikipedia articles
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.opt_wikipedia == 'true' && needs.plan.outputs.test_km2 == '0' }}
    uses: ./.github/workflows/wiki.yml
    secrets: inherit
    permissions:
      contents: write
    with:
      region: ${{ inputs.region }}
      region_key: ${{ needs.plan.outputs.key }}
      rebuild: ${{ needs.plan.outputs.opt_wiki_rebuild == 'true' }}
      skip_cached: true
      publish: ${{ needs.plan.outputs.opt_publish == 'true' }}
      custom_pbf_url: ${{ needs.plan.outputs.opt_custom_pbf_url }}
      custom_name: ${{ needs.plan.outputs.opt_custom_name }}

  # a short job finding everything the others need, and downloading the PBF
  plan:
    name: Preparation (region, keys, PBF)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `write`: the preparation also switches the Pages source to Actions
      pages: write
    outputs:
      key: ${{ steps.region.outputs.key }}
      name: ${{ steps.region.outputs.name }}
      # the region's country ISO – input for the vignette in the routing network
      iso: ${{ steps.region.outputs.iso }}
      # the area the CCH node order is over
      routing_area: ${{ steps.region.outputs.routing_area }}
      # `bbox` is the map's area, `dem_bbox` the DEM layers'; they differ only
      # when the cut-out is smaller than the region
      bbox: ${{ steps.region.outputs.bbox }}
      dem_bbox: ${{ steps.region.outputs.dem_bbox }}
      dem_bboxkey: ${{ steps.region.outputs.dem_bboxkey }}
      # the test square (empty on a real run)
      test_bbox: ${{ steps.region.outputs.test_bbox }}
      day: ${{ steps.day.outputs.d }}
      # `legacy` = the Pages source is a branch and the next push overwrites the map
      pages_build_type: ${{ steps.pages-src.outputs.build_type }}
      # test mode: the bbox before cropping, and a link into the finished map
      full_bbox: ${{ steps.region.outputs.full_bbox }}
      test_km2: ${{ steps.opts.outputs.opt_test_km2 }}
      area_key: ${{ steps.area.outputs.key }}
      area_name: ${{ steps.area.outputs.name }}
      area_bbox: ${{ steps.area.outputs.bbox }}
      area_km2: ${{ steps.area.outputs.km2 }}
      # `opt_contours` gates the job, not a layer – both go into one .pmtiles
      opt_contours: ${{ steps.opts.outputs.opt_contours }}
      opt_contour_lines: ${{ steps.opts.outputs.opt_contour_lines }}
      opt_terrain: ${{ steps.opts.outputs.opt_terrain }}
      opt_trails: ${{ steps.opts.outputs.opt_trails }}
      opt_features: ${{ steps.opts.outputs.opt_features }}
      # the routing network – in the base map and in package `roads`
      opt_routing: ${{ steps.opts.outputs.opt_routing }}
      # `opt_rock_dem` is the rock source only when it is a height model –
      # empty for `shading` and `none`
      opt_contour_source: ${{ steps.opts.outputs.opt_contour_source }}
      opt_rock_source: ${{ steps.opts.outputs.opt_rock_source }}
      opt_rock_dem: ${{ steps.opts.outputs.opt_rock_dem }}
      opt_shading_source: ${{ steps.opts.outputs.opt_shading_source }}
      opt_crop_bbox: ${{ steps.opts.outputs.opt_crop_bbox }}
      opt_size_limit_mb: ${{ steps.opts.outputs.opt_size_limit_mb }}
      opt_auto_shrink: ${{ steps.opts.outputs.opt_auto_shrink }}
      # three jobs clip (`tiles`, `trails`, `features`) and must clip alike
      opt_region_clip: ${{ steps.opts.outputs.opt_region_clip }}
      opt_ugkk_fallback: ${{ steps.opts.outputs.opt_ugkk_fallback }}
      opt_ugkk_urls: ${{ steps.opts.outputs.opt_ugkk_urls }}
      opt_contour_interval: ${{ steps.opts.outputs.opt_contour_interval }}
      opt_contour_maxzoom: ${{ steps.opts.outputs.opt_contour_maxzoom }}
      opt_rock_maxzoom: ${{ steps.opts.outputs.opt_rock_maxzoom }}
      opt_rock_solid: ${{ steps.opts.outputs.opt_rock_solid }}
      opt_rock_fill_holes: ${{ steps.opts.outputs.opt_rock_fill_holes }}
      opt_contour_smoothing: ${{ steps.opts.outputs.opt_contour_smoothing }}
      opt_trails_maxzoom: ${{ steps.opts.outputs.opt_trails_maxzoom }}
      opt_features_maxzoom: ${{ steps.opts.outputs.opt_features_maxzoom }}
      opt_transport: ${{ steps.opts.outputs.opt_transport }}
      opt_transport_maxzoom: ${{ steps.opts.outputs.opt_transport_maxzoom }}
      budget_transport_pct: ${{ env.BUDGET_TRANSPORT_PCT }}
      budget_routing_pct: ${{ env.BUDGET_ROUTING_PCT }}
      opt_boundaries: ${{ steps.opts.outputs.opt_boundaries }}
      opt_boundaries_maxzoom: ${{ steps.opts.outputs.opt_boundaries_maxzoom }}
      budget_boundaries_pct: ${{ env.BUDGET_BOUNDARIES_PCT }}
      opt_water: ${{ steps.opts.outputs.opt_water }}
      opt_water_maxzoom: ${{ steps.opts.outputs.opt_water_maxzoom }}
      budget_water_pct: ${{ env.BUDGET_WATER_PCT }}
      opt_rail: ${{ steps.opts.outputs.opt_rail }}
      opt_rail_maxzoom: ${{ steps.opts.outputs.opt_rail_maxzoom }}
      budget_rail_pct: ${{ env.BUDGET_RAIL_PCT }}
      opt_buildings: ${{ steps.opts.outputs.opt_buildings }}
      opt_buildings_maxzoom: ${{ steps.opts.outputs.opt_buildings_maxzoom }}
      budget_buildings_pct: ${{ env.BUDGET_BUILDINGS_PCT }}
      # `env` can't be read in a called workflow's `with:`, so it goes as an output
      budget_contours_pct: ${{ env.BUDGET_CONTOURS_PCT }}
      budget_rocks_pct: ${{ env.BUDGET_ROCKS_PCT }}
      budget_terrain_pct: ${{ env.BUDGET_TERRAIN_PCT }}
      opt_terrain_maxzoom: ${{ steps.opts.outputs.opt_terrain_maxzoom }}
      opt_terrain_3d: ${{ steps.opts.outputs.opt_terrain_3d }}
      opt_rocks: ${{ steps.opts.outputs.opt_rocks }}
      opt_rock_slope: ${{ inputs.rock_slope }}
      opt_rock_res: ${{ steps.opts.outputs.opt_rock_res }}
      opt_rock_img_asset: ${{ steps.opts.outputs.opt_rock_img_asset }}
      opt_rock_img_zoom: ${{ steps.opts.outputs.opt_rock_img_zoom }}
      opt_rock_img_options: ${{ steps.opts.outputs.opt_rock_img_options }}
      opt_maxzoom: ${{ steps.opts.outputs.opt_maxzoom }}
      opt_custom_pbf_url: ${{ steps.opts.outputs.opt_custom_pbf_url }}
      opt_custom_name: ${{ steps.opts.outputs.opt_custom_name }}
      opt_custom_bbox: ${{ steps.opts.outputs.opt_custom_bbox }}
      opt_publish: ${{ steps.opts.outputs.opt_publish }}
      opt_publish_pages: ${{ steps.opts.outputs.opt_publish_pages }}
      opt_apple_archive: ${{ steps.opts.outputs.opt_apple_archive }}
      opt_contours_rebuild: ${{ steps.opts.outputs.opt_contours_rebuild }}
      opt_rocks_rebuild: ${{ steps.opts.outputs.opt_rocks_rebuild }}
      opt_terrain_rebuild: ${{ steps.opts.outputs.opt_terrain_rebuild }}
      opt_wikipedia: ${{ steps.opts.outputs.opt_wikipedia }}
      opt_wiki_rebuild: ${{ steps.opts.outputs.opt_wiki_rebuild }}
      # `reuse_layers`: don't compute a layer already made with these settings
      opt_reuse_layers: ${{ steps.opts.outputs.opt_reuse_layers }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # the site must be the map, not the README (`workers/deploy/pages-source.sh`)
      - name: Turn GitHub Pages on and switch the source to Actions
        id: pages-src
        env:
          GH_TOKEN: ${{ github.token }}
        run: workers/deploy/pages-source.sh

      # options are split once, here, so other jobs read finished values
      - name: Split the options
        id: opts
        run: |
          set -euo pipefail
          # no `--summary`: the `settings` job prints the form and options
          python3 workers/plan/options.py \
            --options='${{ inputs.options }}' \
            --rebuild='${{ inputs.rebuild }}' \
            --contour-source='${{ inputs.contour_source }}' \
            --rock-source='${{ inputs.rock_source }}' \
            --shading-source='${{ inputs.shading_source }}' \
            --test='${{ inputs.test }}' \
            --publish-pages='${{ inputs.publish_pages }}' \
            --out="$GITHUB_OUTPUT"

      - name: Today's date for the cache key
        id: day
        run: |
          echo "d=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          # step timing: jobs run in parallel, so the summary sorts by order, not time
          mkdir -p steps-out
          : > steps-out/plan.tsv

      # the region outline is computed in “Download the PBF” (`workers/plan/pbf.sh`)
      # and shared as artifact `region-poly`, so no job cuts on the bbox alone

      # restore up top, save right after the data exists, with `if: always()`
      - name: Region PBF cache (restore)
        id: pbf-cache
        uses: ./.github/actions/cache-restore
        with:
          path: data/region.osm.pbf
          # the version guards against older PBFs; the test square is in the
          # key too, or a real run would take the stored 4 km² as the region
          key: pbf-v6-${{ inputs.region }}-${{ steps.opts.outputs.opt_custom_pbf_url }}-${{ steps.opts.outputs.opt_crop_bbox }}-t${{ steps.opts.outputs.opt_test_km2 }}-a${{ inputs.area }}${{ steps.opts.outputs.opt_area_bbox }}-at${{ steps.opts.outputs.opt_test_at }}-${{ steps.day.outputs.d }}

      - name: Download the PBF of the region only
        id: region
        env:
          AREA_IN: ${{ inputs.area }}
          OPT_AREA_BBOX: ${{ steps.opts.outputs.opt_area_bbox }}
          OPT_CROP_BBOX: ${{ steps.opts.outputs.opt_crop_bbox }}
          OPT_CUSTOM_BBOX: ${{ steps.opts.outputs.opt_custom_bbox }}
          OPT_CUSTOM_NAME: ${{ steps.opts.outputs.opt_custom_name }}
          OPT_CUSTOM_PBF_URL: ${{ steps.opts.outputs.opt_custom_pbf_url }}
          OPT_TEST_AT: ${{ steps.opts.outputs.opt_test_at }}
          OPT_TEST_KM2: ${{ steps.opts.outputs.opt_test_km2 }}
          REGION: ${{ inputs.region }}
        run: workers/plan/pbf.sh

      - name: Resolve the cut-out
        id: area
        run: |
          set -euo pipefail
          # a quick test resolved the cut-out already; a second answer would lack
          # the `_test4` suffix and 4 km² would be stored as the whole range
          if [ -s /tmp/cutout.txt ]; then
            RESOLVED=$(cat /tmp/cutout.txt)
            cat /tmp/cutout.txt >> "$GITHUB_OUTPUT"
            echo "Cut-out of the quick test (computed in the plan):"
          else
            # an own bbox from options beats the range picked
            AREA='${{ inputs.area }}'
            AREA_BBOX='${{ steps.opts.outputs.opt_area_bbox }}'
            [ -n "$AREA_BBOX" ] && AREA="$AREA_BBOX"
            RESOLVED=$(python3 workers/plan/area.py \
              --region-bbox='${{ steps.region.outputs.dem_bbox }}' \
              --area="$AREA" --out="$GITHUB_OUTPUT")
          fi
          echo "$RESOLVED"
          AREA_KEY=$(printf '%s\n' "$RESOLVED" | sed -n 's/^key=//p')

          if [ "$AREA_KEY" = 'whole' ] && [ '${{ steps.opts.outputs.opt_test_km2 }}' = '0' ]; then
            # rocks from hillshading are foreign server tiles – hundreds of
            # thousands for a whole region, so only ranges
            if [ '${{ steps.opts.outputs.opt_rock_source }}' = 'shading' ]; then
              echo "::error::rock_source: shading downloads finished hillshading tiles, which makes sense only for a cut-out. Fill in the input “area” (e.g. vysoke_tatry), or pick a height model (sonny / dmr35 / dmr5)."
              exit 1
            fi
          fi

      # numbers can't tell whether the test square hit a ridge or a meadow
      - name: Where the test cut-out is
        if: ${{ steps.opts.outputs.opt_test_km2 != '0' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          mkdir -p _site
          python3 workers/plan/test-map.py \
            --bbox='${{ steps.region.outputs.test_bbox }}' \
            --full-bbox='${{ steps.region.outputs.full_bbox }}' \
            --name='${{ steps.region.outputs.name }}' \
            --layers="contours: ${{ inputs.contour_source }} · rocks: ${{ inputs.rock_source }} · hillshading: ${{ inputs.shading_source }}" \
            --png=_site/where-it-is.png --md=/tmp/where-it-is.md
          cat /tmp/where-it-is.md >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the test cut-out picture
        if: ${{ always() && hashFiles('_site/where-it-is.png') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: site-plan
          path: _site
          retention-days: 1
          if-no-files-found: ignore

      - name: Region PBF cache (save)
        if: ${{ always() && steps.pbf-cache.outputs.cache-hit != 'true' && hashFiles('data/region.osm.pbf') != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: data/region.osm.pbf
          key: ${{ steps.pbf-cache.outputs.cache-primary-key }}

      # both: DEM layers and `deploy` read `.geojson`, Planetiler the raw `.poly`
      - name: Keep the region polygon
        uses: actions/upload-artifact@v7
        with:
          name: region-poly
          path: |
            data/region.geojson
            data/region.poly
          retention-days: 1

      # an artifact, not a cache: within a run it's the same, a cache could miss
      - name: Keep the PBF for the tile job
        uses: actions/upload-artifact@v7
        with:
          name: pbf
          path: data/region.osm.pbf
          retention-days: 1
          compression-level: 0

      - name: Keep the step timing
        if: ${{ always() && hashFiles('steps-out/*') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: steps-plan
          path: steps-out
          retention-days: 1
          if-no-files-found: ignore

  # a waymarked route is no road: a `type=route` relation OpenMapTiles doesn't
  # know. Its own job and `.pmtiles`; not cached, the PBF changes daily.
  trails:
    name: Waymarked trails
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.opt_trails == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.trails.outputs.enabled }}
      maxzoom: ${{ steps.trails.outputs.maxzoom }}
      count: ${{ steps.trails.outputs.count }}
      size_mb: ${{ steps.trails.outputs.size_mb }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # timing must sit in the workspace – `hashFiles` sees nothing else
      - name: Prepare the timing folder
        run: mkdir -p steps-out

      - name: Download the PBF from the preparation
        uses: actions/download-artifact@v8
        with:
          name: pbf
          path: data

      # the region polygon is Planetiler's `--polygon`
      - name: Download the region polygon
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: region-poly
          path: data

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Planetiler cache (restore)
        id: planetiler-cache
        uses: ./.github/actions/cache-restore
        with:
          path: planetiler.jar
          key: planetiler-latest-${{ needs.plan.outputs.day }}

      - name: Download Planetiler
        run: workers/lib/planetiler.sh
      - name: Planetiler cache (save)
        if: ${{ always() && steps.planetiler-cache.outputs.cache-hit != 'true' && hashFiles('planetiler.jar') != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: planetiler.jar
          key: ${{ steps.planetiler-cache.outputs.cache-primary-key }}

      - name: Trails from OSM relations → PMTiles
        id: trails
        env:
          OPT_TRAILS_MAXZOOM: ${{ needs.plan.outputs.opt_trails_maxzoom }}
          OPT_REGION_CLIP: ${{ needs.plan.outputs.opt_region_clip }}
          REGION_BBOX: ${{ needs.plan.outputs.bbox }}
          REGION_KEY: ${{ needs.plan.outputs.key }}
          SIZE_LIMIT_MB: ${{ needs.plan.outputs.opt_size_limit_mb }}
        run: workers/trails/build.sh

      - name: Store the trails
        if: ${{ always() && hashFiles('data/trails.geojson') != '' }}
        continue-on-error: true
        env:
          KIND: trails
          NAME: trails-${{ needs.plan.outputs.key }}
        run: workers/deploy/publish-results.sh

      # each job makes its piece of `_site`; compression-level 0, .pmtiles is compressed
      - name: Keep the site piece
        if: ${{ always() && hashFiles('_site/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: site-trails
          path: _site
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore

      - name: Keep the step timing
        if: ${{ always() && hashFiles('steps-out/*') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: steps-trails
          path: steps-out
          retention-days: 1
          if-no-files-found: ignore

  # landscape features outside the OpenMapTiles schema (embankments, walls,
  # fences, power lines, springs, lookouts, pistes) – a job of its own like trails
  features:
    name: Landscape features
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.opt_features == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.features.outputs.enabled }}
      maxzoom: ${{ steps.features.outputs.maxzoom }}
      size_mb: ${{ steps.features.outputs.size_mb }}
      # points (`points.yml`) are the same step's second output – package `points`
      points_enabled: ${{ steps.features.outputs.points_enabled }}
      points_size_mb: ${{ steps.features.outputs.points_size_mb }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Prepare the timing folder
        run: mkdir -p steps-out

      - name: Download the PBF from the preparation
        uses: actions/download-artifact@v8
        with:
          name: pbf
          path: data

      - name: Download the region polygon
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: region-poly
          path: data

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Planetiler cache (restore)
        id: planetiler-cache
        uses: ./.github/actions/cache-restore
        with:
          path: planetiler.jar
          key: planetiler-latest-${{ needs.plan.outputs.day }}

      - name: Download Planetiler
        run: workers/lib/planetiler.sh
      - name: Planetiler cache (save)
        if: ${{ always() && steps.planetiler-cache.outputs.cache-hit != 'true' && hashFiles('planetiler.jar') != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: planetiler.jar
          key: ${{ steps.planetiler-cache.outputs.cache-primary-key }}

      - name: Landscape features from OSM → PMTiles
        id: features
        env:
          OPT_FEATURES_MAXZOOM: ${{ needs.plan.outputs.opt_features_maxzoom }}
          OPT_REGION_CLIP: ${{ needs.plan.outputs.opt_region_clip }}
          REGION_BBOX: ${{ needs.plan.outputs.bbox }}
          REGION_KEY: ${{ needs.plan.outputs.key }}
          SIZE_LIMIT_MB: ${{ needs.plan.outputs.opt_size_limit_mb }}
        run: workers/features/build.sh

      - name: Keep the site piece
        if: ${{ always() && hashFiles('_site/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: site-features
          path: _site
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore

      - name: Keep the step timing
        if: ${{ always() && hashFiles('steps-out/*') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: steps-features
          path: steps-out
          retention-days: 1
          if-no-files-found: ignore

  # the whole road network, the core of package `roads` (`workers/transport/transport.yml`)
  transport:
    name: Road network
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.opt_transport == 'true' }}
    uses: ./.github/workflows/transport.yml
    secrets: inherit                      # cache on Drive; `env` isn't inherited
    with:
      region_key: ${{ needs.plan.outputs.key }}
      region_bbox: ${{ needs.plan.outputs.bbox }}
      maxzoom: ${{ needs.plan.outputs.opt_transport_maxzoom }}
      region_clip: ${{ needs.plan.outputs.opt_region_clip }}
      size_limit_mb: ${{ needs.plan.outputs.opt_size_limit_mb }}
      budget_pct: ${{ needs.plan.outputs.budget_transport_pct }}
      day: ${{ needs.plan.outputs.day }}

  # area boundaries with the names OpenMapTiles' `boundary` lacks (`workers/boundaries/boundaries.yml`)
  boundaries:
    name: Area boundaries
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.opt_boundaries == 'true' }}
    uses: ./.github/workflows/boundaries.yml
    secrets: inherit                      # cache on Drive; `env` isn't inherited
    with:
      region_key: ${{ needs.plan.outputs.key }}
      region_bbox: ${{ needs.plan.outputs.bbox }}
      maxzoom: ${{ needs.plan.outputs.opt_boundaries_maxzoom }}
      region_clip: ${{ needs.plan.outputs.opt_region_clip }}
      size_limit_mb: ${{ needs.plan.outputs.opt_size_limit_mb }}
      budget_pct: ${{ needs.plan.outputs.budget_boundaries_pct }}
      day: ${{ needs.plan.outputs.day }}

  # water: three OpenMapTiles layers with names off the geometry (`workers/water/water.yml`)
  water:
    name: Water
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.opt_water == 'true' }}
    uses: ./.github/workflows/water.yml
    secrets: inherit                      # cache on Drive; `env` isn't inherited
    with:
      region_key: ${{ needs.plan.outputs.key }}
      region_bbox: ${{ needs.plan.outputs.bbox }}
      maxzoom: ${{ needs.plan.outputs.opt_water_maxzoom }}
      region_clip: ${{ needs.plan.outputs.opt_region_clip }}
      size_limit_mb: ${{ needs.plan.outputs.opt_size_limit_mb }}
      budget_pct: ${{ needs.plan.outputs.budget_water_pct }}
      day: ${{ needs.plan.outputs.day }}

  # railways with the track network for navigation – `workers/rail/rail.yml`
  railways:
    name: Railways and cable cars
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.opt_rail == 'true' }}
    uses: ./.github/workflows/rail.yml
    secrets: inherit                      # cache on Drive; `env` isn't inherited
    with:
      region_key: ${{ needs.plan.outputs.key }}
      region_name: ${{ needs.plan.outputs.name }}
      region_bbox: ${{ needs.plan.outputs.bbox }}
      maxzoom: ${{ needs.plan.outputs.opt_rail_maxzoom }}
      region_clip: ${{ needs.plan.outputs.opt_region_clip }}
      size_limit_mb: ${{ needs.plan.outputs.opt_size_limit_mb }}
      budget_pct: ${{ needs.plan.outputs.budget_rail_pct }}
      day: ${{ needs.plan.outputs.day }}

  # buildings with floor area and name – `workers/buildings/buildings.yml`
  settlements:
    name: Settlements
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.opt_buildings == 'true' }}
    uses: ./.github/workflows/buildings.yml
    secrets: inherit                      # cache on Drive; `env` isn't inherited
    with:
      region_key: ${{ needs.plan.outputs.key }}
      region_bbox: ${{ needs.plan.outputs.bbox }}
      maxzoom: ${{ needs.plan.outputs.opt_buildings_maxzoom }}
      region_clip: ${{ needs.plan.outputs.opt_region_clip }}
      size_limit_mb: ${{ needs.plan.outputs.opt_size_limit_mb }}
      budget_pct: ${{ needs.plan.outputs.budget_buildings_pct }}
      day: ${{ needs.plan.outputs.day }}

  # the routing network in its own file (`navigation-region.yml`)
  routing:
    name: Routing network
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.opt_routing == 'true' }}
    uses: ./.github/workflows/navigation-region.yml
    secrets: inherit                      # cache with the node order on Drive
    with:
      region_key: ${{ needs.plan.outputs.key }}
      region_name: ${{ needs.plan.outputs.name }}
      routing_country: ${{ needs.plan.outputs.iso }}
      routing_area: ${{ needs.plan.outputs.routing_area }}
      dem_bbox: ${{ needs.plan.outputs.dem_bbox }}
      size_limit_mb: ${{ needs.plan.outputs.opt_size_limit_mb }}
      budget_pct: ${{ needs.plan.outputs.budget_routing_pct }}

  # runs beside contours, trails and hillshading – it needs only the PBF
  tiles:
    name: Map tiles (Planetiler)
    needs: plan
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      maxzoom: ${{ steps.tiles.outputs.maxzoom }}
      size_mb: ${{ steps.tiles.outputs.size_mb }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Prepare the timing folder
        run: mkdir -p steps-out

      - name: Download the PBF from the preparation
        uses: actions/download-artifact@v8
        with:
          name: pbf
          path: data

      - name: Download the region polygon
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: region-poly
          path: data

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # two steps, not one: saved right after the download, not only on success
      - name: Planetiler source data cache (restore)
        id: sources-cache
        uses: ./.github/actions/cache-restore
        with:
          path: data/sources
          key: planetiler-sources-v1

      - name: Planetiler cache (restore)
        id: planetiler-cache
        uses: ./.github/actions/cache-restore
        with:
          path: planetiler.jar
          key: planetiler-latest-${{ needs.plan.outputs.day }}

      - name: Download Planetiler
        run: workers/lib/planetiler.sh
      - name: Planetiler cache (save)
        if: ${{ always() && steps.planetiler-cache.outputs.cache-hit != 'true' && hashFiles('planetiler.jar') != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: planetiler.jar
          key: ${{ steps.planetiler-cache.outputs.cache-primary-key }}

      # the `BUDGET_*` shares come from the workflow env
      - name: PBF → PMTiles (Planetiler, OpenMapTiles schema)
        id: tiles
        env:
          OPT_AUTO_SHRINK: ${{ needs.plan.outputs.opt_auto_shrink }}
          OPT_MAXZOOM: ${{ needs.plan.outputs.opt_maxzoom }}
          OPT_REGION_CLIP: ${{ needs.plan.outputs.opt_region_clip }}
          REGION_BBOX: ${{ needs.plan.outputs.bbox }}
          REGION_KEY: ${{ needs.plan.outputs.key }}
          SIZE_LIMIT_MB: ${{ needs.plan.outputs.opt_size_limit_mb }}
        run: workers/tiles/build.sh

      # Planetiler downloaded its source data during the run (water polygons ~700 MB)
      - name: Planetiler source data cache (save)
        if: ${{ always() && steps.sources-cache.outputs.cache-hit != 'true' && hashFiles('data/sources/**') != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: data/sources
          key: ${{ steps.sources-cache.outputs.cache-primary-key }}

      - name: Keep the site piece
        if: ${{ always() && hashFiles('_site/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: site-tiles
          path: _site
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore

      - name: Keep the step timing
        if: ${{ always() && hashFiles('steps-out/*') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: steps-tiles
          path: steps-out
          retention-days: 1
          if-no-files-found: ignore

  # depends on nothing but code, so it runs from the start beside everything
  assets:
    name: Icons and fonts
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.sprite.outputs.name }}
      available: ${{ steps.sprite.outputs.available }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Prepare the timing folder
        run: mkdir -p steps-out

      # `glyphs.sh` is in the key: it also decides which ranges stay in `_site/fonts`
      - name: Glyph and sprite cache (restore)
        id: assets-cache
        uses: ./.github/actions/cache-restore
        with:
          path: |
            _site/fonts
            _site/sprites
          key: assets-${{ hashFiles('poc/web/icon-sources.js', 'poc/web/shields.js', 'poc/web/marks.js', 'poc/web/style-overrides.json', 'workers/assets/sprite.mjs', 'workers/assets/shields.mjs', 'workers/assets/marks.mjs', 'workers/assets/custom-icons.mjs', 'workers/lib/sprite-bake.mjs', 'workers/assets/glyphs.sh') }}-${{ env.GLYPHS_ZIP }}

      - name: Download and prepare the icon sets
        id: sprite
        run: workers/assets/icons.sh

      # `GLYPHS_ZIP` from the workflow env
      - name: Download glyphs (fonts) onto our Pages
        run: workers/assets/glyphs.sh

      - name: Glyph and sprite cache (save)
        if: ${{ always() && steps.assets-cache.outputs.cache-hit != 'true' && hashFiles('_site/sprites/**') != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: |
            _site/fonts
            _site/sprites
          key: ${{ steps.assets-cache.outputs.cache-primary-key }}

      - name: Keep the site piece
        if: ${{ always() && hashFiles('_site/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: site-assets
          path: _site
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore

      - name: Keep the step timing
        if: ${{ always() && hashFiles('steps-out/*') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: steps-assets
          path: steps-out
          retention-days: 1
          if-no-files-found: ignore

  # collects the `_site` pieces, builds styles and manifest, checks and deploys.
  # `!cancelled()`, not `success()`: with DEM layers failed or off the map still deploys.
  deploy:
    name: Assembly and deploy
    needs: [plan, dem, trails, features, transport, boundaries, water, railways, settlements, routing, tiles, assets]
    if: ${{ !cancelled() && needs.tiles.result == 'success' && needs.assets.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      # `write` is the one place anything reaches the repository: `maps.json`
      contents: write
      pages: write
      id-token: write
      actions: read     # the summary reads jobs and their logs when something fails
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # the pattern `site-*`, not names: a job off or failed simply has no artifact
      - name: Collect the site pieces
        uses: actions/download-artifact@v8
        with:
          pattern: site-*
          path: _site
          merge-multiple: true

      - name: Download the step timing of the other jobs
        if: ${{ always() }}
        uses: actions/download-artifact@v8
        with:
          pattern: steps-*
          path: steps-out
          merge-multiple: true

      - name: What came from the other jobs
        run: |
          set -uo pipefail
          echo "Job results: contours=${{ needs.dem.outputs.res_contours }}, trails=${{ needs.trails.result }}, features=${{ needs.features.result }}, transport=${{ needs.transport.result }}, boundaries=${{ needs.boundaries.result }}, water=${{ needs.water.result }}, railways=${{ needs.railways.result }}, settlements=${{ needs.settlements.result }}, routing=${{ needs.routing.result }}, terrain=${{ needs.dem.outputs.res_terrain }}, tiles=${{ needs.tiles.result }}, icons=${{ needs.assets.result }}"
          find _site -maxdepth 2 -mindepth 1 -type d -exec du -sh {} \; 2>/dev/null || true
          du -sm _site | cut -f1 | xargs -I{} echo "_site in total: {} MB"

      # tiles are cut per whole tile; the style draws the exact outline from this file
      - name: Download the region polygon
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: region-poly
          path: data

      - name: Region outline for the viewer
        run: |
          # `--pad-m`: `--bbox` is tight around the original polygon, `region.geojson` buffered
          python3 workers/deploy/region-mask.py \
            --poly=data/region.geojson \
            --bbox='${{ needs.plan.outputs.bbox }}' \
            --pad-m=3000 \
            --out=_site/region.geojson

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build static style.json (web + iOS)
        run: |
          node workers/styles/build.mjs \
            --base-url='${{ steps.pages.outputs.base_url }}' \
            --region='${{ needs.plan.outputs.key }}' \
            --name='${{ needs.plan.outputs.name }}' \
            --maxzoom='${{ needs.tiles.outputs.maxzoom }}' \
            --contours='${{ needs.dem.outputs.contours_enabled || 'false' }}' \
            --contours-maxzoom='${{ needs.dem.outputs.contours_maxzoom || '14' }}' \
            --rocks='${{ needs.dem.outputs.rocks_enabled || 'false' }}' \
            --rocks-maxzoom='${{ needs.dem.outputs.rocks_maxzoom || '16' }}' \
            --trails='${{ needs.trails.outputs.enabled || 'false' }}' \
            --trails-maxzoom='${{ needs.trails.outputs.maxzoom || '14' }}' \
            --features='${{ needs.features.outputs.enabled || 'false' }}' \
            --features-maxzoom='${{ needs.features.outputs.maxzoom || '15' }}' \
            --points='${{ needs.features.outputs.points_enabled || 'false' }}' \
            --points-maxzoom='${{ needs.features.outputs.maxzoom || '15' }}' \
            --transport='${{ needs.transport.outputs.enabled || 'false' }}' \
            --transport-maxzoom='${{ needs.transport.outputs.maxzoom || '14' }}' \
            --boundaries='${{ needs.boundaries.outputs.enabled || 'false' }}' \
            --boundaries-maxzoom='${{ needs.boundaries.outputs.maxzoom || '12' }}' \
            --water='${{ needs.water.outputs.enabled || 'false' }}' \
            --water-maxzoom='${{ needs.water.outputs.maxzoom || '14' }}' \
            --buildings='${{ needs.settlements.outputs.enabled || 'false' }}' \
            --buildings-maxzoom='${{ needs.settlements.outputs.maxzoom || '14' }}' \
            --dem-source='${{ needs.dem.outputs.contours_dem_source || 'sonny' }}' \
            --dem-tiles-source='${{ needs.dem.outputs.terrain_dem_source || needs.dem.outputs.contours_dem_source || 'sonny' }}' \
            --dem-bounds='${{ needs.plan.outputs.test_bbox }}' \
            --terrain-3d='${{ needs.plan.outputs.opt_terrain_3d }}' \
            ${{ needs.dem.outputs.terrain_enabled == 'true' && format('--dem-tiles=pmtiles://{0}/tiles/{1}-terrain.pmtiles --dem-maxzoom={2}', steps.pages.outputs.base_url, needs.plan.outputs.key, needs.dem.outputs.terrain_maxzoom) || '' }} \
            --sprites-dir=_site/sprites \
            --region-outline=_site/region.geojson \
            --overrides=poc/web/style-overrides.json \
            --fonts-dir=_site/fonts \
            --out=_site/styles

      - name: Bake area and line patterns into the sprite
        run: |
          # the web draws patterns itself, the static iOS style needs them in the sprite
          for id in ${{ needs.assets.outputs.available }}; do
            node workers/styles/patterns.mjs \
              --sprite="_site/sprites/$id" --styles=_site/styles
          done

      - name: Assemble the web (viewer + manifest)
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
          CONTOURS_DEM_SOURCE: ${{ needs.dem.outputs.contours_dem_source || 'sonny' }}
          CONTOURS_ENABLED: ${{ needs.dem.outputs.contours_enabled || 'false' }}
          CONTOURS_MAXZOOM: ${{ needs.dem.outputs.contours_maxzoom || '14' }}
          CONTOUR_INTERVAL: ${{ needs.plan.outputs.opt_contour_interval || '5' }}
          DEM_MAXZOOM: ${{ needs.dem.outputs.terrain_maxzoom || 15 }}
          DEM_TILES_SOURCE: ${{ needs.dem.outputs.terrain_dem_source || needs.dem.outputs.contours_dem_source || 'sonny' }}
          DEM_URL: ${{ needs.dem.outputs.terrain_enabled == 'true' && format('pmtiles://{0}/tiles/{1}-terrain.pmtiles', steps.pages.outputs.base_url, needs.plan.outputs.key) || '' }}
          FEATURES_ENABLED: ${{ needs.features.outputs.enabled || 'false' }}
          FEATURES_MAXZOOM: ${{ needs.features.outputs.maxzoom || '15' }}
          POINTS_ENABLED: ${{ needs.features.outputs.points_enabled || 'false' }}
          TRANSPORT_ENABLED: ${{ needs.transport.outputs.enabled || 'false' }}
          TRANSPORT_MAXZOOM: ${{ needs.transport.outputs.maxzoom || '14' }}
          ROUTING_ENABLED: ${{ needs.routing.outputs.enabled || 'false' }}
          BOUNDARIES_ENABLED: ${{ needs.boundaries.outputs.enabled || 'false' }}
          BOUNDARIES_MAXZOOM: ${{ needs.boundaries.outputs.maxzoom || '12' }}
          WATER_ENABLED: ${{ needs.water.outputs.enabled || 'false' }}
          WATER_MAXZOOM: ${{ needs.water.outputs.maxzoom || '14' }}
          RAIL_ENABLED: ${{ needs.railways.outputs.enabled || 'false' }}
          RAIL_MAXZOOM: ${{ needs.railways.outputs.maxzoom || '15' }}
          RAIL_ROUTING: ${{ needs.railways.outputs.routing || 'false' }}
          BUILDINGS_ENABLED: ${{ needs.settlements.outputs.enabled || 'false' }}
          BUILDINGS_MAXZOOM: ${{ needs.settlements.outputs.maxzoom || '14' }}
          ICONS_AVAILABLE: ${{ needs.assets.outputs.available }}
          ICONS_NAME: ${{ needs.assets.outputs.name }}
          REGION_BBOX: ${{ needs.plan.outputs.bbox }}
          REGION_KEY: ${{ needs.plan.outputs.key }}
          REGION_NAME: ${{ needs.plan.outputs.name }}
          REGION_OUTLINE: region.geojson
          ROCKS_ENABLED: ${{ needs.dem.outputs.rocks_enabled || 'false' }}
          ROCKS_MAXZOOM: ${{ needs.dem.outputs.rocks_maxzoom || '16' }}
          ROCK_SLOPE: ${{ needs.dem.outputs.rock_slope || 'off' }}
          ROCK_SOURCE: ${{ needs.dem.outputs.rock_source || 'off' }}
          TEST_BBOX: ${{ needs.plan.outputs.test_bbox }}
          TEST_KM2: ${{ needs.plan.outputs.test_km2 || '0' }}
          TILES_MAXZOOM: ${{ needs.tiles.outputs.maxzoom }}
          TILES_SIZE_MB: ${{ needs.tiles.outputs.size_mb }}
          TRAILS_COUNT: ${{ needs.trails.outputs.count || '0' }}
          TRAILS_ENABLED: ${{ needs.trails.outputs.enabled || 'false' }}
          TRAILS_MAXZOOM: ${{ needs.trails.outputs.maxzoom || '14' }}
        run: workers/deploy/site.sh

      - name: Check the style points only at existing files
        id: check
        env:
          SPRITE: ${{ needs.assets.outputs.name }}
          REGION_KEY: ${{ needs.plan.outputs.key }}
          LIMIT_MB: ${{ needs.plan.outputs.opt_size_limit_mb }}
        run: workers/deploy/check.sh
      # styles, viewer, `manifest.json` and the baked sprite – what `_site` got
      # only here, so not in `site-*` (see `workers/deploy/apple-archive.sh`)
      - name: Keep the assembled site part for later jobs
        if: ${{ always() && steps.check.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: deploy-site
          path: |
            _site
            !_site/fonts
            !_site/tiles/*.pmtiles
          retention-days: 1
          compression-level: 0

      # `publish_pages=false` only turns the deploy off; Drive is its own lever
      - name: Upload Pages artifact
        if: ${{ needs.plan.outputs.opt_publish_pages == 'true' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        if: ${{ needs.plan.outputs.opt_publish_pages == 'true' }}
        uses: actions/deploy-pages@v5

      # without a deploy there is nothing to check – `page_url` would be empty
      - name: Smoke test of the deployed map
        if: ${{ needs.plan.outputs.opt_publish_pages == 'true' }}
        env:
          BASE: ${{ steps.deployment.outputs.page_url }}
          REGION: ${{ needs.plan.outputs.key }}
          SPRITE: ${{ needs.assets.outputs.name }}
          CONTOURS: ${{ needs.dem.outputs.contours_enabled }}
          ROCKS: ${{ needs.dem.outputs.rocks_enabled }}
          TRAILS: ${{ needs.trails.outputs.enabled }}
          FEATURES: ${{ needs.features.outputs.enabled }}
          POINTS: ${{ needs.features.outputs.points_enabled }}
          BOUNDARIES: ${{ needs.boundaries.outputs.enabled }}
          WATER: ${{ needs.water.outputs.enabled }}
          RAIL: ${{ needs.railways.outputs.enabled }}
          BUILDINGS: ${{ needs.settlements.outputs.enabled }}
          PAGES_BUILD_TYPE: ${{ needs.plan.outputs.pages_build_type }}
        run: workers/deploy/smoke-test.sh

      - name: Publish the map to Drive
        id: publish
        if: ${{ always() && needs.plan.outputs.opt_publish == 'true' && steps.check.outcome == 'success' }}
        env:
          AREA_KEY: ${{ needs.plan.outputs.area_key }}
          # the cut-out's bbox beside the map's: the map is the region, terrain only here
          AREA_BBOX: ${{ needs.plan.outputs.area_bbox }}
          CONTOURS_ENABLED: ${{ needs.dem.outputs.contours_enabled || 'false' }}
          CONTOURS_SOURCE: ${{ needs.dem.outputs.contours_dem_source }}
          CONTOUR_INTERVAL: ${{ needs.plan.outputs.opt_contour_interval }}
          CUSTOM_NAME: ${{ needs.plan.outputs.opt_custom_name }}
          CUSTOM_PBF_URL: ${{ needs.plan.outputs.opt_custom_pbf_url }}
          FEATURES_ENABLED: ${{ needs.features.outputs.enabled || 'false' }}
          TRANSPORT_ENABLED: ${{ needs.transport.outputs.enabled || 'false' }}
          BOUNDARIES_ENABLED: ${{ needs.boundaries.outputs.enabled || 'false' }}
          WATER_ENABLED: ${{ needs.water.outputs.enabled || 'false' }}
          RAIL_ENABLED: ${{ needs.railways.outputs.enabled || 'false' }}
          BUILDINGS_ENABLED: ${{ needs.settlements.outputs.enabled || 'false' }}
          REGION_KEY: ${{ needs.plan.outputs.key }}
          ROCKS_ENABLED: ${{ needs.dem.outputs.rocks_enabled || 'false' }}
          ROCKS_SOURCE: ${{ needs.dem.outputs.rock_source }}
          TERRAIN_ENABLED: ${{ needs.dem.outputs.terrain_enabled || 'false' }}
          TERRAIN_SOURCE: ${{ needs.dem.outputs.terrain_dem_source }}
          TEST_KM2: ${{ needs.plan.outputs.test_km2 }}
          TILES_MAXZOOM: ${{ needs.tiles.outputs.maxzoom }}
          TRAILS_ENABLED: ${{ needs.trails.outputs.enabled || 'false' }}
        run: |
          set -euo pipefail
          python3 workers/deploy/publish-map.py --site=_site \
            --maps=maps.json \
            --summary="$GITHUB_STEP_SUMMARY"

      # the step above writes the catalog (only it knows the file ids); saved
      # here only after a successful publish, and the step says which file
      - name: Write the map into maps.json
        if: ${{ steps.publish.outcome == 'success' }}
        env:
          MAPS_JSON: ${{ steps.publish.outputs.maps_file || 'maps.json' }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: workers/deploy/catalog.sh
      # every job kept its lines in its `steps-*` artifact; merged and sorted here
      - name: Build summary
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REGION_NAME: ${{ needs.plan.outputs.name || inputs.region }}
          R_PLAN: ${{ needs.plan.result }}
          R_CONTOURS: ${{ needs.dem.outputs.res_contours }}
          R_SHADING_ROCKS: ${{ needs.dem.outputs.res_shading_rocks }}
          R_TRAILS: ${{ needs.trails.result }}
          R_FEATURES: ${{ needs.features.result }}
          R_BOUNDARIES: ${{ needs.boundaries.result }}
          R_WATER: ${{ needs.water.result }}
          R_RAILWAYS: ${{ needs.railways.result }}
          R_SETTLEMENTS: ${{ needs.settlements.result }}
          R_TERRAIN: ${{ needs.dem.outputs.res_terrain }}
          R_TILES: ${{ needs.tiles.result }}
          R_ASSETS: ${{ needs.assets.result }}
          SRC_CONTOURS: ${{ needs.plan.outputs.opt_contour_source }}
          SRC_ROCKS: ${{ needs.plan.outputs.opt_rock_source }}
          SRC_SHADING: ${{ needs.plan.outputs.opt_shading_source }}
          USED_CONTOURS: ${{ needs.dem.outputs.contours_dem_source || '(did not run)' }}
          USED_ROCKS: ${{ needs.dem.outputs.rock_source || '(did not run)' }}
          USED_SHADING: ${{ needs.dem.outputs.terrain_dem_source || '(did not run)' }}
          SIZE_LIMIT_MB: ${{ needs.plan.outputs.opt_size_limit_mb }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          PUBLISH_PAGES: ${{ needs.plan.outputs.opt_publish_pages }}
          PAGES_BUILD_TYPE: ${{ needs.plan.outputs.pages_build_type }}
          REGION_KEY: ${{ needs.plan.outputs.key }}
          TEST_KM2: ${{ needs.plan.outputs.test_km2 }}
          TEST_BBOX: ${{ needs.plan.outputs.test_bbox }}
          TEST_FULL_BBOX: ${{ needs.plan.outputs.full_bbox }}
          # the whole form at once: `toJSON(inputs)` can't drift from a list
          INPUTS_JSON: ${{ toJSON(inputs) }}
        run: bash workers/deploy/summary.sh

  # the same contents once more as `.aar` (Apple Archive, LZFSE), unpacked
  # natively by iOS and macOS; a job of its own on macOS, where `aa` lives.
  # After `deploy`, only when it published; a failure doesn't hurt the map.
  apple-archive:
    name: Packages as Apple Archive (.aar)
    needs: [plan, deploy, dem, trails, features, transport, boundaries, water, railways, settlements, tiles]
    if: ${{ !cancelled() && needs.deploy.result == 'success' && needs.plan.outputs.opt_publish == 'true' && needs.plan.outputs.opt_apple_archive == 'true' }}
    runs-on: macos-latest
    permissions:
      contents: write     # `maps.json` – as `deploy` does
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # the same pieces `deploy` assembled `_site` from
      - name: Collect the site pieces
        uses: actions/download-artifact@v8
        with:
          pattern: site-*
          path: _site
          merge-multiple: true
      # after `site-*`: both hold the sprite and the baked one must win
      - name: Collect the assembled part of the site
        uses: actions/download-artifact@v8
        with:
          name: deploy-site
          path: _site
      - name: Pack and upload .aar to Drive
        id: publish
        env:
          AREA_KEY: ${{ needs.plan.outputs.area_key }}
          AREA_BBOX: ${{ needs.plan.outputs.area_bbox }}
          CONTOURS_ENABLED: ${{ needs.dem.outputs.contours_enabled || 'false' }}
          CONTOURS_SOURCE: ${{ needs.dem.outputs.contours_dem_source }}
          CONTOUR_INTERVAL: ${{ needs.plan.outputs.opt_contour_interval }}
          CUSTOM_NAME: ${{ needs.plan.outputs.opt_custom_name }}
          CUSTOM_PBF_URL: ${{ needs.plan.outputs.opt_custom_pbf_url }}
          FEATURES_ENABLED: ${{ needs.features.outputs.enabled || 'false' }}
          TRANSPORT_ENABLED: ${{ needs.transport.outputs.enabled || 'false' }}
          BOUNDARIES_ENABLED: ${{ needs.boundaries.outputs.enabled || 'false' }}
          WATER_ENABLED: ${{ needs.water.outputs.enabled || 'false' }}
          RAIL_ENABLED: ${{ needs.railways.outputs.enabled || 'false' }}
          BUILDINGS_ENABLED: ${{ needs.settlements.outputs.enabled || 'false' }}
          REGION_KEY: ${{ needs.plan.outputs.key }}
          ROCKS_ENABLED: ${{ needs.dem.outputs.rocks_enabled || 'false' }}
          ROCKS_SOURCE: ${{ needs.dem.outputs.rock_source }}
          TERRAIN_ENABLED: ${{ needs.dem.outputs.terrain_enabled || 'false' }}
          TERRAIN_SOURCE: ${{ needs.dem.outputs.terrain_dem_source }}
          TEST_KM2: ${{ needs.plan.outputs.test_km2 }}
          TILES_MAXZOOM: ${{ needs.tiles.outputs.maxzoom }}
          TRAILS_ENABLED: ${{ needs.trails.outputs.enabled || 'false' }}
          # which branch to fetch a fresh `maps.json` from
          BRANCH: ${{ github.ref_name }}
        run: workers/deploy/apple-archive.sh
      # `deploy` wrote the ZIPs into it, this adds `.aar`
      - name: Write .aar into maps.json
        if: ${{ steps.publish.outcome == 'success' }}
        env:
          MAPS_JSON: ${{ steps.publish.outputs.maps_file || 'maps.json' }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: workers/deploy/catalog.sh
