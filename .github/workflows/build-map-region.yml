name: Mapa · Build map region

# Stiahne PBF export IBA zvoleného regiónu z osm.fr regionálnych exportov
# (https://download.openstreetmap.fr/extracts/ – Európa aj svet, rezané po
# administratívnych hraniciach, denne aktualizované).
# Potom Planetiler → PMTiles → GitHub Pages.
#
# Detail a zoom:
#   Planetiler má tvrdý limit `maxzoom <= 16` (PlanetilerConfig.MAX_MAXZOOM).
#   Vyšší zoom (až z20) sa NEGENERUJE do dlaždíc – rieši ho MapLibre overzoomom
#   nad dlaždicami z16. Aby overzoom vyzeral ostro, generujeme najvyšší zoom
#   s nulovou simplifikáciou a bez zahadzovania malých prvkov.
#
# Ľubovoľný iný región Európy/sveta: vyplň input `custom_pbf_url`
# (URL na .osm.pbf z download.openstreetmap.fr/extracts/...) + `custom_name`.

on:
  workflow_dispatch:
    inputs:
      # Predvolený je kraj, na ktorom sa reálne pracuje, nie celé Slovensko:
      # formulár sa po každom otvorení vracia na predvolené hodnoty, takže
      # default je to, čo netreba prekliknúť. Bratislavský je najmenší kraj,
      # takže ostrý beh na CELÝ región (`area: cely_region`, `test` odškrtnutý)
      # je jedno kliknutie a nestojí hodiny – tie tri defaulty patria k sebe.
      region:
        description: "Región (ignoruje sa, ak je vyplnené custom_pbf_url)"
        required: true
        default: bratislavsky
        type: choice
        options:
          - slovensko
          - bratislavsky
          - trnavsky
          - trenciansky
          - nitriansky
          - zilinsky
          - banskobystricky
          - presovsky
          - kosicky
      # Celý kraj trvá ~40 min, jedno pohorie ~2. Ešte rýchlejší je switch
      # `test` pod týmto. Vlastný bbox: `options: area_bbox=W,S,E,N`.
      #
      # PREDVOLENE `cely_region`. Kým tu stálo `vysoke_tatry`, dostal ten, kto
      # si vybral iný kraj a tento riadok prehliadol, mapu bez vrstevníc a skál
      # skoro všade – a v logu o tom bolo len `::warning::`. Zmenšovanie behu
      # má JEDNU páku, switch `test` pod týmto; výrez ostáva na to, na čo je.
      area:
        description: "Pohorie, na ktorom sa počítajú vrstevnice a skaly"
        required: false
        default: cely_region
        type: choice
        options:
          - cely_region
          - tatry
          - vysoke_tatry
          - belianske_tatry
          - zapadne_tatry
          - nizke_tatry
          - slovensky_raj
          - pieniny
          - mala_fatra
          - velka_fatra
          - sulovske_skaly
          - slovensky_kras
          - muranska_planina
          - vihorlat
          - strazovske_vrchy
          - male_karpaty
      # Zaškrtávatko, nie číslo: veľkosť sa mení zriedka (4 km² sedia skoro
      # vždy), kým test sa zapína a vypína pri každom behu – a to je presne
      # rozdiel medzi switchom a textovým poľom. Veľkosť ostala ako voľba
      # `test_km2=4`.
      # PREDVOLENE VYPNUTÉ, hoci kedysi bolo zapnuté: zapnutý default dával
      # zmysel, kým bol predvolený výrez pohorie vo veľkom kraji. Odkedy je
      # default `bratislavsky` + `cely_region`, je predvolený beh ten, ktorý
      # naozaj vyrobí mapu na nasadenie – a zapnutý test by z nej ticho spravil
      # mapu s dierou (pravidlo 8). Kto ladí prah, si ho zaškrtne.
      # Kľúč testu má príponu `_test4` (číslo je z voľby `test_km2`), takže si
      # nesadne do cache ani na uložené výsledky ostrého behu, a jeho položka
      # ide do `maps-test.json` (viď workers/deploy/catalog.py).
      # Zmenší CELÝ BEH na štvorec zo stredu výrezu – terén aj samotnú mapu:
      # PBF sa oreže, takže dlaždice, trasy, prvky aj ZIP sú z tých 4 km².
      # Kým sa mapa nechávala celá, bol test polovičný (kraj sa aj tak stiahol,
      # prehnal Planetilerom, zabalil a nahral). Kde štvorec leží, ukáže
      # obrázok „kde to je“; rozpis vo `workers/plan/pbf.sh`.
      # Iná veľkosť: `options: test_km2=8`. Iné miesto: `options: test_at=lon,lat`.
      test:
        description: "Rýchly test: celý beh (mapa aj terén) len na 4 km² zo stredu výrezu"
        required: false
        default: false
        type: boolean
      # Tri výbery zdroja, jeden na vrstvu. Kým bol `dem_source` jeden pre
      # všetko, nedalo sa povedať to, čo dáva zmysel najčastejšie: skaly
      # z najjemnejšieho modelu (aj keď je len na výrez) a tieňovanie
      # z hrubšieho, ktorý pokrýva celý región. `ziadne` vrstvu vypne –
      # zapínač je tým pádom v tom istom poli ako zdroj a nie vedľa neho,
      # takže sa nedá zadať „generuj vrstevnice, zdroj žiadny".
      # Zoznam zdrojov drží workers/data/dem-sources.json (stráži to „Kontrola · lint workflowov").
      # sonny = 20 m, celý región. dmr35 = ÚGKK DMR 3.5, 10 m.
      # dmr5 = ÚGKK DMR 5.0 (LiDAR): s vyplneným `area` plné 1 m, bez neho
      # dlaždice na 5 m. Rozhoduje rozsah, nie ďalší výber: pri 1 m má jedna
      # 1° dlaždica ~48 GB a strop assetu 2 GB.
      contour_source:
        description: "Vrstevnice – z ktorého modelu terénu (ziadne = negenerovať)"
        required: false
        default: dmr5
        type: choice
        options:
          - sonny
          - sonny1
          - dmr35
          - dmr5
          - ziadne
      # Buď zo sklonu výškového modelu (sonny / dmr35 / dmr5), alebo
      # `tienovanie` = hotové polygóny z workflowu „Skaly z tieňovaných
      # dlaždíc“ – ten si build v prípade potreby zavolá sám.
      # Na skaly je `dmr5` s `area` najlepšie, čo máme – mriežka zdroja
      # stropuje skutočný detail obrysu.
      rock_source:
        description: "Skaly – zo sklonu modelu, alebo z tieňovania (ziadne = negenerovať)"
        required: false
        default: dmr5
        type: choice
        options:
          - sonny
          - sonny1
          - dmr35
          - dmr5
          - tienovanie
          - ziadne
      # Tieňovanie je vždy na celý región, takže tu `dmr5` vyjde na 5 m.
      shading_source:
        description: "Tieňovanie a 3D terén – z ktorého modelu (ziadne = negenerovať)"
        required: false
        default: dmr5
        type: choice
        options:
          - sonny
          - sonny1
          - dmr35
          - dmr5
          - ziadne
      # ČO TU STOJÍ ZA `contour_interval`, KTORÝ BOL NA TOMTO MIESTE:
      # `workflow_dispatch` dovolí NAJVIAC 10 inputov a nad tým GitHub workflow
      # ticho neprijme (beh bez jobov, červený krížik, prázdny log – stalo sa
      # to pri 26 inputoch). Formulár bol plný, takže si dva knôfle vymenili
      # miesto: interval vrstevníc má v DMR 5.0 dobrý default 5 m a mení sa pri
      # prechode do nížin, nie pri každom behu, takže sa píše ako voľba
      # (`options: contour_interval=10`) – to isté, čo sa kedysi stalo
      # s `test_km2`. Články sa naopak zapínajú a vypínajú podľa toho, či ide
      # o ostrý build alebo ladenie terénu, a to je práca pre zaškrtávatko.
      # Predvolene ZAPNUTÉ: kraj je pri dávkach po päťdesiatich otázka sekúnd
      # (namerané 18 ms na článok), takže sa nemá čo šetriť.
      rock_slope:
        description: "Od akého sklonu (°) je terén skala (50 = steny, 40 = aj strmé svahy)"
        required: false
        default: "50"
        type: string
      # Zmaže cache aj uloženú verziu v sklade. Pri zapnutom switchi `test`
      # sa pregenerúva vždy všetko, nech neladíš na výsledku z cache – toto
      # pole je vtedy jedno.
      # `tienovanie` sa volalo `teren` – jediné miesto, kde sa tá vrstva volala
      # inak než vo `shading_source`, v balíku `-tienovanie.zip` a v katalógu.
      # Staré meno ostáva prijímané (`REBUILD_ALIAS` v plan/options.py), len sa
      # už neponúka. `skaly` od tej istej zmeny zahodí aj rozrobené obrysy
      # podpipeline tieňovania. Rozpis a strážca: `workers/lint/rebuild.py`.
      rebuild:
        description: "Čo pregenerovať nanovo, aj keď to už je v cache"
        required: false
        default: nic
        type: choice
        options:
          - nic
          - vrstevnice
          - skaly
          - tienovanie
          - vsetko
      # DESIATY A POSLEDNÝ INPUT. `workflow_dispatch` ich dovolí najviac 10
      # a nad tým GitHub workflow ticho neprijme (beh bez jobov, červený
      # krížik, prázdny log) – ďalší prepínač sa sem už nezmestí a musí ísť
      # do `options`. Bolo to voľbou `publish_pages=false`, ale nasadenie na
      # Pages je otázka „kam to má ísť", nie zriedka menené nastavenie:
      # rozhoduje sa pri behu a je to jedno kliknutie, presne ako `test`.
      #
      # Vypnuté NEZNAMENÁ, že sa mapa nepostaví: `_site` vznikne a prejde
      # kontrolou úplne rovnako (z toho istého `_site` je aj balík na Drive),
      # len sa nenahrá cez `actions/deploy-pages` a nespustí sa smoke test
      # nasadenej stránky. Publikovanie na Drive je nezávislá páka –
      # `options: publish=false` – takže sa dá mať aj jedno bez druhého.
      publish_pages:
        description: "Nasadiť hotovú mapu na GitHub Pages (odškrtnuté = len na Drive)"
        required: false
        default: false
        type: boolean
      # Napr. `crop_bbox=18.9,49.1,19.2,49.3 size_limit_mb=1200`.
      # Veľkosť rýchleho testu: `test_km2=8` (default 4).
      # Mriežka na obrys skál: `rock_res=1` (default auto).
      # Celý zoznam aj s predvolenými hodnotami je vo workers/plan/options.py
      # a neznámy kľúč je chyba, nie ticho ignorovaná hodnota.
      options:
        description: "Zriedka menené nastavenia ako kľúč=hodnota (viď workers/plan/options.py)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # PRIHLÁSENIE NA DRIVE PRE CELÝ BUILD, a nie po jobe. Z Drive sa v ňom číta
  # na štyroch miestach (DMR 5.0 vo výreze aj v dlaždiciach, Sonnyho priečinok,
  # sklon pre skaly) a odteraz je na ňom aj CACHE – to je ďalších dvadsať
  # krokov (`.github/actions/cache-restore` a `-save`, rozpis vo
  # `workers/drive/cache.py`). Keby token stál pri každom jobe zvlášť, stačí na
  # jeden zabudnúť a ten sa ticho vráti k počítaniu všetkého odznova. Stráži to
  # „Kontrola · lint workflowov".
  GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
  DRIVE_CLIENT: ${{ vars.DRIVE_CLIENT }}
  DRIVE_SECRET: ${{ secrets.DRIVE_SECRET }}
  DRIVE_REFRESH: ${{ secrets.DRIVE_REFRESH }}
  OSMFR_BASE: https://download.openstreetmap.fr/extracts
  # Glyfy (fonty) si hostíme sami – verejná služba fonts.openmaptiles.org je
  # jediný bod zlyhania, pri ktorom sa mapa vykreslí bez akýchkoľvek nápisov.
  # (Zdroje ikoniek sú v poc/web/icon-sources.js.)
  GLYPHS_ZIP: https://github.com/openmaptiles/fonts/releases/download/v2.0/noto-sans.zip
  # Rozpočet stránky si joby delia podielom, nie „čo zvýšilo" – bežia
  # súbežne, takže v čase, keď Planetiler rozhoduje o zoome, ešte nikto
  # nevie, aké veľké budú vrstevnice. Podiely sú s rezervou nad namerané
  # hodnoty (vrstevnice 187 MB = 21 %, terén 96 MB = 11 % z 900 MB).
  BUDGET_CONTOURS_PCT: "25"
  # Skaly majú vlastný .pmtiles, takže aj vlastný podiel na rozpočte
  # stránky. Predtým sa delili o podiel vrstevníc a doplácali na to: aby
  # sa zmestili spolu, musel ísť dole maxzoom obom.
  BUDGET_ROCKS_PCT: "12"
  BUDGET_TERRAIN_PCT: "12"
  # Značené trasy sú len línie s pár atribútmi – celé Slovensko je jednotky
  # MB. 3 % z rozpočtu je s veľkou rezervou.
  BUDGET_TRAILS_PCT: "3"
  # Krajinné prvky (workers/features/features.yml) sú línie, body a pár plôch. Plotov
  # je v OSM veľa, ale idú až od z15 a lepia sa – 4 % je s rezervou.
  BUDGET_FEATURES_PCT: "4"
  # Hranice území: čítajú to job `tiles` (koľko mu zostalo) aj `boundaries.yml`,
  # ktorý to dostane inputom – `workflow_call` `env` nededí. Sú to plochy
  # a čiary štyroch úrovní plus body sídel; celé Slovensko sú jednotky MB.
  BUDGET_BOUNDARIES_PCT: "3"
  # Vodstvo: rieky a plochy s menom. Jarkov a odvodňovacích kanálov je
  # v poľnohospodárskej krajine veľa, ale idú až od z13 a lepia sa – 5 % je
  # s rezervou.
  BUDGET_WATER_PCT: "5"
  # Dopravná sieť (workers/transport/transport.yml) je NAJHUSTEJŠIA vrstva,
  # akú táto pipeline stavia vlastnou schémou – je to celá cestná, koľajová
  # a chodníková sieť kraja, teda tá istá hustota, akú má vrstva
  # `transportation` v základnej mape. 8 % z 900 MB je 72 MB, čo je nad
  # očakávanou veľkosťou pri maxzoome 14; keď to raz prestane stačiť, povie to
  # `workers/transport/build.sh`.
  BUDGET_TRANSPORT_PCT: "8"
  BUDGET_ASSETS_MB: "40"

# ŽIADNY JOB TU NEMÁ `timeout-minutes` A JE TO ZÁMER.
#
# Boli tu (30 až 350 minút) a nezachránili nič – zabíjali prácu, ktorá by bola
# dobehla. Drahé fázy sa nedajú prerušiť a nadviazať: vektorizácia skál je
# jeden priechod nad celou mozaikou, takže zabitý `gdal_contour` nenechá ani
# neúplný výsledok. Timeout teda neznamenal „skonči skôr a máš aspoň niečo",
# ale „zahoď hodinu a pol a začni odznova".
#
# Čo prácu stráži namiesto toho:
#   * sklad – sklon, bloky obrysov aj dlaždice sa zapisujú cez `.part`
#     a premenovanie, takže zrušený beh nezahodí hotové a ďalší dopočíta zvyšok,
#   * strop PAMÄTE (`ROCK_MAX_RSS_GB`) – OOM zabije runner a v logu nie je nič,
#     tak sa radšej zastaví s hláškou,
#   * plán s odhadom pred drahou časťou a tep počas nej (pravidlo 4), aby sa
#     dalo zasiahnuť skôr, než sa minie celý rozpočet.
#
# ÚPLNE BEZ STROPU TO NIE JE A ANI BYŤ NEMÔŽE: GitHub dáva jobu na hostenom
# runneri najviac 360 minút a to sa vypnúť nedá. Bez `timeout-minutes` teda
# platí práve tých 360. Preto stále platí pravidlo 5 – dlhé fázy patria každá
# do svojho jobu, lebo tých 360 minút sa počíta na job, nie na beh.
jobs:
  # ---------- s čím tento beh ide ----------
  # PRVÝ job a je to jediné, čo robí: vypíše formulár, `env:` workflowu a to,
  # čo z volieb vyšlo. Rozpis aj dôvod, prečo je to job a nie krok prípravy,
  # sú vo `workers/plan/settings.sh`.
  settings:
    name: Nastavenia behu (formulár a voľby)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Vypíš nastavenia behu
        env:
          # Celý formulár naraz – po jednom by sa na nové pole zabudlo
          # a v tabuľke by ticho chýbalo.
          INPUTS_JSON: ${{ toJSON(inputs) }}
          OPT_OPTIONS: ${{ inputs.options }}
          OPT_REBUILD: ${{ inputs.rebuild }}
          OPT_CONTOUR_SOURCE: ${{ inputs.contour_source }}
          OPT_ROCK_SOURCE: ${{ inputs.rock_source }}
          OPT_SHADING_SOURCE: ${{ inputs.shading_source }}
          OPT_TEST: ${{ inputs.test }}
          OPT_PUBLISH_PAGES: ${{ inputs.publish_pages }}
        run: workers/plan/settings.sh

  # ---------- vrstevnice, skaly a tieňovanie ----------
  # JEDENÁSŤ JOBOV VO VLASTNOM SÚBORE (`dem-layers.yml`): kontrola skladu
  # výškového modelu, päť jobov, ktoré ho doplnia, skaly z tieňovania, kľúče
  # cache a samotné tri vrstvy. Sem sa z nich vracia len to, čo z nich naozaj
  # vzniklo – zvyšok (sklady na Drive, ladenie hladkosti, mriežka obrysu) je
  # vec tých jobov a je v `env:` tamtoho súboru.
  #
  # PREČO VON: potrebuje ich aj „Mapa · Pregeneruj vrstvu kraja", ktorá
  # prepočíta JEDNU z nich a prepíše len jej balík na Drive. Druhá kópia by
  # bola druhá pravda o tom, ako vrstevnice vznikajú – a rozišla by sa presne
  # tam, kde to nikto nevidí: v kľúči cache alebo v tom, ktorý model sa doplní,
  # keď v sklade nie je. Bokom od toho to potrebuje aj tento súbor: bol
  # 466 B pod stropom 128 KiB, nad ktorým ho GitHub ticho neprijme.
  #
  # Podiely na rozpočte stránky chodia dole INPUTOM, nie z `env:` – `env`
  # sa cez `workflow_call` nededí a tie isté čísla číta aj job `tiles`, keď
  # si počíta, koľko mu z rozpočtu zostalo. To isté robia `boundaries.yml`
  # a `water.yml`.
  dem:
    name: Vrstvy z výškového modelu
    needs: plan
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/dem-layers.yml
    secrets: inherit                      # Drive (sklady aj cache); `env` sa nededí
    with:
      region_key: ${{ needs.plan.outputs.key }}
      area: ${{ inputs.area }}
      area_key: ${{ needs.plan.outputs.area_key }}
      area_name: ${{ needs.plan.outputs.area_name }}
      area_bbox: ${{ needs.plan.outputs.area_bbox }}
      area_km2: ${{ needs.plan.outputs.area_km2 }}
      dem_bbox: ${{ needs.plan.outputs.dem_bbox }}
      dem_bboxkey: ${{ needs.plan.outputs.dem_bboxkey }}
      test_km2: ${{ needs.plan.outputs.test_km2 }}
      day: ${{ needs.plan.outputs.day }}
      opt_contours: ${{ needs.plan.outputs.opt_contours }}
      opt_contour_lines: ${{ needs.plan.outputs.opt_contour_lines }}
      opt_rocks: ${{ needs.plan.outputs.opt_rocks }}
      opt_terrain: ${{ needs.plan.outputs.opt_terrain }}
      opt_contour_source: ${{ needs.plan.outputs.opt_contour_source }}
      opt_rock_source: ${{ needs.plan.outputs.opt_rock_source }}
      opt_rock_dem: ${{ needs.plan.outputs.opt_rock_dem }}
      opt_shading_source: ${{ needs.plan.outputs.opt_shading_source }}
      opt_ugkk_fallback: ${{ needs.plan.outputs.opt_ugkk_fallback }}
      opt_ugkk_urls: ${{ needs.plan.outputs.opt_ugkk_urls }}
      opt_contour_interval: ${{ needs.plan.outputs.opt_contour_interval }}
      opt_contour_maxzoom: ${{ needs.plan.outputs.opt_contour_maxzoom }}
      opt_contour_smoothing: ${{ needs.plan.outputs.opt_contour_smoothing }}
      rock_slope: ${{ inputs.rock_slope }}
      opt_rock_maxzoom: ${{ needs.plan.outputs.opt_rock_maxzoom }}
      opt_rock_res: ${{ needs.plan.outputs.opt_rock_res }}
      opt_rock_plne: ${{ needs.plan.outputs.opt_rock_plne }}
      opt_rock_zapln_diery: ${{ needs.plan.outputs.opt_rock_zapln_diery }}
      opt_rock_img_asset: ${{ needs.plan.outputs.opt_rock_img_asset }}
      opt_rock_img_zoom: ${{ needs.plan.outputs.opt_rock_img_zoom }}
      opt_rock_img_options: ${{ needs.plan.outputs.opt_rock_img_options }}
      opt_terrain_maxzoom: ${{ needs.plan.outputs.opt_terrain_maxzoom }}
      opt_contours_rebuild: ${{ needs.plan.outputs.opt_contours_rebuild }}
      opt_rocks_rebuild: ${{ needs.plan.outputs.opt_rocks_rebuild }}
      opt_terrain_rebuild: ${{ needs.plan.outputs.opt_terrain_rebuild }}
      opt_reuse_layers: ${{ needs.plan.outputs.opt_reuse_layers }}
      opt_size_limit_mb: ${{ needs.plan.outputs.opt_size_limit_mb }}
      budget_contours_pct: ${{ needs.plan.outputs.budget_contours_pct }}
      budget_rocks_pct: ${{ needs.plan.outputs.budget_rocks_pct }}
      budget_terrain_pct: ${{ needs.plan.outputs.budget_terrain_pct }}

  # ---------- príprava: región, kľúče, PBF ----------
  # Krátky job, ktorý zistí všetko, čo ostatné potrebujú vedieť, a stiahne
  # PBF. Beží pár minút a všetko ďalšie z neho vychádza.
  plan:
    name: Príprava (región, kľúče, PBF)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `write` a nie `read`: príprava Pages nielen kontroluje, ale aj zapína
      # a prepína zdroj na Actions, aby na stránke skončila mapa a nie README.
      # Na úrovni workflowu je `pages: write` aj tak (nasadzuje sa ním), takže
      # to nie je nové právo v behu – len ho dostane aj tento job.
      pages: write
    outputs:
      key: ${{ steps.region.outputs.key }}
      name: ${{ steps.region.outputs.name }}
      # `bbox` je územie MAPY (dlaždice, trasy, prvky, maska, rozpočet
      # stránky), `dem_bbox` územie vrstiev z výškového modelu (vrstevnice,
      # skaly, tieňovanie). Pri rýchlom teste sú to TIE ISTÉ 4 km² – odkedy
      # test orezáva aj PBF, sa nelíšia; rozdielne ostávajú len vtedy, keď je
      # výrez (`area`) menší než región.
      bbox: ${{ steps.region.outputs.bbox }}
      dem_bbox: ${{ steps.region.outputs.dem_bbox }}
      dem_bboxkey: ${{ steps.region.outputs.dem_bboxkey }}
      # Testovací štvorec (prázdne pri ostrom behu) – pre obrázok „kde to je",
      # súhrn a viewer, ktorý sa naň má otvoriť.
      test_bbox: ${{ steps.region.outputs.test_bbox }}
      day: ${{ steps.day.outputs.d }}
      # `legacy` = zdroj Pages je vetva a mapu prepíše najbližší push.
      # Ide von, aby to súhrn vedel povedať nahlas a smoke test vedel,
      # či je prázdny koreň stránky chyba, alebo známa príčina.
      pages_build_type: ${{ steps.pages-src.outputs.build_type }}
      # Testovací režim: bbox pred orezaním (na obrázok „kde to je") a odkaz
      # do hotovej mapy, ktorý súhrn behu ukáže.
      full_bbox: ${{ steps.region.outputs.full_bbox }}
      test_km2: ${{ steps.opts.outputs.opt_test_km2 }}
      area_key: ${{ steps.area.outputs.key }}
      area_name: ${{ steps.area.outputs.name }}
      area_bbox: ${{ steps.area.outputs.bbox }}
      area_km2: ${{ steps.area.outputs.km2 }}
      # `opt_contours` je brána jobu s vrstevnicami, nie vrstva: vrstevnice
      # aj skaly z neho vychádzajú do jedného .pmtiles, takže beží aj vtedy,
      # keď je zapnuté len jedno z nich. Čo sa naozaj kreslí, hovoria
      # `opt_contour_lines` a `opt_rocks`.
      opt_contours: ${{ steps.opts.outputs.opt_contours }}
      opt_contour_lines: ${{ steps.opts.outputs.opt_contour_lines }}
      opt_terrain: ${{ steps.opts.outputs.opt_terrain }}
      opt_trails: ${{ steps.opts.outputs.opt_trails }}
      opt_features: ${{ steps.opts.outputs.opt_features }}
      opt_search: ${{ steps.opts.outputs.opt_search }}
      # Navigačný graf pre tento kraj – nemá vlastný balík, ide
      # DOVNÚTRA mapy (rozpis vo `workers/deploy/publish-map.py`).
      opt_navigacia: ${{ steps.opts.outputs.opt_navigacia }}
      opt_valhalla_image: ${{ steps.opts.outputs.opt_valhalla_image }}
      # Tri výbery zdroja tak, ako ich rozobrala parse-options.py.
      # `opt_rock_dem` je zdroj skál, LEN keď je to výškový model – pri
      # `tienovanie` a `ziadne` je prázdny, takže nikto nesiahne na DEM.
      opt_contour_source: ${{ steps.opts.outputs.opt_contour_source }}
      opt_rock_source: ${{ steps.opts.outputs.opt_rock_source }}
      opt_rock_dem: ${{ steps.opts.outputs.opt_rock_dem }}
      opt_shading_source: ${{ steps.opts.outputs.opt_shading_source }}
      opt_crop_bbox: ${{ steps.opts.outputs.opt_crop_bbox }}
      opt_size_limit_mb: ${{ steps.opts.outputs.opt_size_limit_mb }}
      opt_auto_shrink: ${{ steps.opts.outputs.opt_auto_shrink }}
      # Orez dlaždíc na hranicu regiónu – potrebujú ho TRI joby (`tiles`,
      # `trails`, `features`), lebo orez musí byť vo všetkých rovnaký.
      opt_region_clip: ${{ steps.opts.outputs.opt_region_clip }}
      opt_ugkk_fallback: ${{ steps.opts.outputs.opt_ugkk_fallback }}
      opt_ugkk_urls: ${{ steps.opts.outputs.opt_ugkk_urls }}
      opt_contour_interval: ${{ steps.opts.outputs.opt_contour_interval }}
      opt_contour_maxzoom: ${{ steps.opts.outputs.opt_contour_maxzoom }}
      opt_rock_maxzoom: ${{ steps.opts.outputs.opt_rock_maxzoom }}
      opt_rock_plne: ${{ steps.opts.outputs.opt_rock_plne }}
      opt_rock_zapln_diery: ${{ steps.opts.outputs.opt_rock_zapln_diery }}
      opt_contour_smoothing: ${{ steps.opts.outputs.opt_contour_smoothing }}
      opt_trails_maxzoom: ${{ steps.opts.outputs.opt_trails_maxzoom }}
      opt_features_maxzoom: ${{ steps.opts.outputs.opt_features_maxzoom }}
      opt_transport: ${{ steps.opts.outputs.opt_transport }}
      opt_transport_maxzoom: ${{ steps.opts.outputs.opt_transport_maxzoom }}
      budget_transport_pct: ${{ env.BUDGET_TRANSPORT_PCT }}
      opt_boundaries: ${{ steps.opts.outputs.opt_boundaries }}
      opt_boundaries_maxzoom: ${{ steps.opts.outputs.opt_boundaries_maxzoom }}
      budget_boundaries_pct: ${{ env.BUDGET_BOUNDARIES_PCT }}
      opt_water: ${{ steps.opts.outputs.opt_water }}
      opt_water_maxzoom: ${{ steps.opts.outputs.opt_water_maxzoom }}
      budget_water_pct: ${{ env.BUDGET_WATER_PCT }}
      # To isté pre vrstvy z výškového modelu (`dem-layers.yml`) a z toho
      # istého dôvodu: `env` sa vo `with:` volaného workflowu nesmie čítať,
      # tak ide cez výstup prípravy. Definované sú RAZ, v `env:` nižšie, lebo
      # tie isté čísla si od nich odpočítava job `tiles`.
      budget_contours_pct: ${{ env.BUDGET_CONTOURS_PCT }}
      budget_rocks_pct: ${{ env.BUDGET_ROCKS_PCT }}
      budget_terrain_pct: ${{ env.BUDGET_TERRAIN_PCT }}
      opt_terrain_maxzoom: ${{ steps.opts.outputs.opt_terrain_maxzoom }}
      opt_terrain_3d: ${{ steps.opts.outputs.opt_terrain_3d }}
      opt_rocks: ${{ steps.opts.outputs.opt_rocks }}
      opt_rock_slope: ${{ inputs.rock_slope }}
      opt_rock_res: ${{ steps.opts.outputs.opt_rock_res }}
      opt_rock_img_asset: ${{ steps.opts.outputs.opt_rock_img_asset }}
      opt_rock_img_zoom: ${{ steps.opts.outputs.opt_rock_img_zoom }}
      opt_rock_img_options: ${{ steps.opts.outputs.opt_rock_img_options }}
      opt_maxzoom: ${{ steps.opts.outputs.opt_maxzoom }}
      opt_custom_pbf_url: ${{ steps.opts.outputs.opt_custom_pbf_url }}
      opt_custom_name: ${{ steps.opts.outputs.opt_custom_name }}
      opt_custom_bbox: ${{ steps.opts.outputs.opt_custom_bbox }}
      opt_publish: ${{ steps.opts.outputs.opt_publish }}
      opt_publish_pages: ${{ steps.opts.outputs.opt_publish_pages }}
      opt_apple_archive: ${{ steps.opts.outputs.opt_apple_archive }}
      opt_contours_rebuild: ${{ steps.opts.outputs.opt_contours_rebuild }}
      opt_rocks_rebuild: ${{ steps.opts.outputs.opt_rocks_rebuild }}
      opt_terrain_rebuild: ${{ steps.opts.outputs.opt_terrain_rebuild }}
      # Voľba `reuse_layers`: nepočítať vrstvu, ktorá s týmito
      # nastaveniami už raz vznikla. Zapína si ju dávka nad krajinou,
      # jeden kraj beží bez nej – rozpis v `workers/plan/options.py`.
      opt_reuse_layers: ${{ steps.opts.outputs.opt_reuse_layers }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Na stránke má byť MAPA, nie README, a to je vlastnosť jedného
      # nastavenia repozitára (`build_type`). Prečo sa to prepína tu, prečo to
      # beh nezhodí, keď sa nedá, a čo sa stalo, keď zhadzovalo – rozpis je
      # v `workers/deploy/pages-source.sh`.
      - name: Zapni GitHub Pages a prepni zdroj na Actions
        id: pages-src
        env:
          GH_TOKEN: ${{ github.token }}
        run: workers/deploy/pages-source.sh

      # PBF sa mení denne, tak je v kľúči dátum – v ten istý deň sa už
      # nesťahuje znova (kraj má 36–63 MB, celé Slovensko ~380 MB).
      # `workflow_dispatch` dovolí najviac 10 inputov. Zvyšok príde ako voľné
      # `kľúč=hodnota` v jednom poli a rozloží sa tu – raz, na jednom mieste,
      # aby ostatné joby čítali hotové hodnoty a nie surový reťazec.
      - name: Rozlož voľby
        id: opts
        run: |
          set -euo pipefail
          # BEZ `--summary`: čo bolo vo formulári a čo z volieb vyšlo, vypisuje
          # job `settings` – prvý job behu. Kým to písali obe miesta, boli
          # v súhrne dve tabuľky toho istého (pravidlo 1). Tu ostáva iba to,
          # čo z volieb potrebuje zvyšok behu, teda `--out`.
          python3 workers/plan/options.py \
            --options='${{ inputs.options }}' \
            --rebuild='${{ inputs.rebuild }}' \
            --contour-source='${{ inputs.contour_source }}' \
            --rock-source='${{ inputs.rock_source }}' \
            --shading-source='${{ inputs.shading_source }}' \
            --test='${{ inputs.test }}' \
            --publish-pages='${{ inputs.publish_pages }}' \
            --out="$GITHUB_OUTPUT"

      - name: Dnešný dátum do kľúča cache
        id: day
        run: |
          echo "d=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          # Meranie krokov: každý dlhý krok si na konci pripíše riadok
          # „poradie, názov, sekundy, čo spravil" do súboru svojho jobu.
          # Joby bežia súbežne, takže sa v súhrne zoradia podľa poradia, nie
          # podľa času – ten by hovoril len o tom, ktorý runner bol rýchlejší.
          mkdir -p steps-out
          : > steps-out/plan.tsv

      # HRANICA KRAJA SA POČÍTA AŽ V KROKU „Stiahni PBF" A JE TO ZÁMER.
      # Kým sa sťahovala ako `.poly` z osm.fr, dala sa spočítať pred PBF a
      # stál tu vlastný krok. Presná hranica je ale v samotných OSM dátach
      # (relácia `boundary=administrative` kraja), takže je poradie opačné:
      # najprv rodičovský extrakt, z neho hranica (`workers/plan/boundary.py`
      # a `region-poly.py`), a až ňou rez. Medzi stiahnutie a rez sa krok
      # workflowu vložiť nedá, tak si to `workers/plan/pbf.sh` volá samo –
      # rozpis je v jeho hlavičke. Nástroje (`osmium`, `gdal-bin`,
      # `libsqlite3-mod-spatialite`) si tam doinštaluje tiež.
      #
      # Hranica ide potom artefaktom `region-poly` ostatným jobom, nie tak,
      # že si ju každý spočíta sám: keby jednému z nich zlyhala, rezal by na
      # bboxe, kým ostatní na kraji – dve pravdy o jednej hranici.

      # POZOR na restore/save: `actions/cache` ukladalo až v post-kroku a IBA
      # keď job dobehol úspešne. Keď build spadol o hodinu neskôr, hodiny
      # výpočtu sa zahodili. Preto restore hore a save hneď po tom, čo dáta
      # vzniknú, s `if: always()` – a preto to isté delenie ostalo aj po
      # presťahovaní cache na Drive (`.github/actions/cache-restore` a `-save`).
      - name: Cache PBF regiónu (restore)
        id: pbf-cache
        uses: ./.github/actions/cache-restore
        with:
          path: data/region.osm.pbf
          # `v2`: kým rýchly test orezával región, ukladal orezané PBF pod
          # kľúč BEZ orezu (`crop_bbox` bol pri teste prázdny) – ostrý beh
          # v ten istý deň potom postavil celú mapu z tých 2 km².
          # `v5`: kraj sa zase REŽE z rodiča (pod `v4` ležia hotové exporty
          # z osm.fr, ktorým chýbajú členovia plôch – to sa práve opravuje,
          # takže sa nesmú vrátiť z cache) a test zase orezáva aj mapu.
          # `v6`: reže sa PRESNOU hranicou z OSM relácie namiesto rozšíreného
          # `.poly` z osm.fr, takže pod `v5` ležia PBF, v ktorých je pás
          # susedného kraja aj cudziny – a tie by mapu vrátili po starom.
          # A PRETO JE V KĽÚČI TESTOVACÍ ŠTVOREC – tá istá chyba ako pri `v2`,
          # len naopak: uložené 4 km² by si ostrý beh v ten istý deň vzal ako
          # celý kraj. Počíta sa až v `plan/area.py`, tu sú jeho vstupy.
          key: pbf-v6-${{ inputs.region }}-${{ steps.opts.outputs.opt_custom_pbf_url }}-${{ steps.opts.outputs.opt_crop_bbox }}-t${{ steps.opts.outputs.opt_test_km2 }}-a${{ inputs.area }}${{ steps.opts.outputs.opt_area_bbox }}-at${{ steps.opts.outputs.opt_test_at }}-${{ steps.day.outputs.d }}

      # Bash je vo `workers/plan/pbf.sh` – tento súbor má strop 128 kB a nad
      # ním ho GitHub ticho neprijme (stráži Lint workflows). Sem chodia len
      # hodnoty z formulára a z volieb.
      - name: Stiahni PBF iba daného regiónu
        id: region
        env:
          AREA_IN: ${{ inputs.area }}
          OPT_AREA_BBOX: ${{ steps.opts.outputs.opt_area_bbox }}
          OPT_CROP_BBOX: ${{ steps.opts.outputs.opt_crop_bbox }}
          OPT_CUSTOM_BBOX: ${{ steps.opts.outputs.opt_custom_bbox }}
          OPT_CUSTOM_NAME: ${{ steps.opts.outputs.opt_custom_name }}
          OPT_CUSTOM_PBF_URL: ${{ steps.opts.outputs.opt_custom_pbf_url }}
          OPT_TEST_AT: ${{ steps.opts.outputs.opt_test_at }}
          OPT_TEST_KM2: ${{ steps.opts.outputs.opt_test_km2 }}
          REGION: ${{ inputs.region }}
        run: workers/plan/pbf.sh

      - name: Vyrieš testovací výrez
        id: area
        run: |
          set -euo pipefail
          # RÝCHLY TEST UŽ VÝREZ VYRIEŠIL – plán ho musel spočítať, aby vedel,
          # kam položiť štvorec pre terénne vrstvy. Odpoveď sa preberie, nie
          # preráta: druhý výpočet dostáva `dem_bbox`, teda UŽ ten štvorec, tak
          # mu vyjde ten istý bbox, ale kľúč BEZ prípony `_test4` – lebo tu sa
          # `--test-km2` nepodáva. A z kľúča je meno DEM assetu, takže by výrez
          # na pár km² sadol v sklade pod `ugkk-vysoke_tatry.tif` – meno, ktoré
          # sľubuje celé pohorie (viď docs/pipeline.md).
          if [ -s /tmp/vyrez.txt ]; then
            RESOLVED=$(cat /tmp/vyrez.txt)
            cat /tmp/vyrez.txt >> "$GITHUB_OUTPUT"
            echo "Výrez z rýchleho testu (spočítaný v pláne):"
          else
            # Vlastný bbox z options prebije výber pohoria – výber je na
            # bežné použitie, bbox na to, čo v zozname nie je.
            AREA='${{ inputs.area }}'
            AREA_BBOX='${{ steps.opts.outputs.opt_area_bbox }}'
            [ -n "$AREA_BBOX" ] && AREA="$AREA_BBOX"
            # stdout aj do premennej: kľúč výrezu treba hneď na kontrolu nižšie
            # a na vlastné výstupy sa krok odkazovať nemôže.
            # Bez testu sú `dem_bbox` a `bbox` to isté.
            RESOLVED=$(python3 workers/plan/area.py \
              --region-bbox='${{ steps.region.outputs.dem_bbox }}' \
              --area="$AREA" --out="$GITHUB_OUTPUT")
          fi
          echo "$RESOLVED"
          AREA_KEY=$(printf '%s\n' "$RESOLVED" | sed -n 's/^key=//p')

          # Kým boli 1 m a 5 m dva výbery, dalo sa zvoliť 1 m na celý kraj –
          # 16 miliárd buniek (64 GB), ktoré sa nezmestia ani do releasu, ani
          # na runner – a tento strážca to musel zakázať. Teraz to zakázať
          # nemá čo: `dmr5` si podobu vyberá podľa rozsahu sám, takže na celý
          # kraj vždy vyjde 5 m verzia.
          #
          # V testovacom režime je „celý región" už orezaný na pár km², takže
          # aj tam je 1 m presne to, čo sa takým behom overuje.
          if [ "$AREA_KEY" = 'cely' ] && [ '${{ steps.opts.outputs.opt_test_km2 }}' = '0' ]; then
            # Skaly z tieňovania sú hotové dlaždice z cudzieho servera a na
            # celý kraj by ich boli státisíce. Pipeline, ktorú si build volá,
            # preto pozná len pohoria.
            if [ '${{ inputs.rock_source }}' = 'tienovanie' ]; then
              echo "::error::rock_source: tienovanie sťahuje hotové tieňované dlaždice a to má zmysel len na výrez. Vyplň input „area“ (napr. vysoke_tatry), alebo vyber výškový model (sonny / dmr35 / dmr5)."
              exit 1
            fi
          fi


      # Testovací štvorec má pár km² – z čísel sa nedá povedať, či padol na
      # hrebeň so stenami alebo na lúku, a keď padne na lúku, „nenašlo ani
      # jednu skalu" nehovorí nič o prahoch. Obrázok ide do stránky (nie len
      # do artefaktu), aby ho súhrn behu vedel priamo ukázať.
      - name: Kde je testovací výrez
        if: ${{ steps.opts.outputs.opt_test_km2 != '0' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          mkdir -p _site
          python3 workers/plan/test-map.py \
            --bbox='${{ steps.region.outputs.test_bbox }}' \
            --full-bbox='${{ steps.region.outputs.full_bbox }}' \
            --name='${{ steps.region.outputs.name }}' \
            --layers="vrstevnice: ${{ inputs.contour_source }} · skaly: ${{ inputs.rock_source }} · tieňovanie: ${{ inputs.shading_source }}" \
            --png=_site/kde-to-je.png --md=/tmp/kde-to-je.md
          cat /tmp/kde-to-je.md >> "$GITHUB_STEP_SUMMARY"

      - name: Odlož obrázok testovacieho výrezu
        if: ${{ always() && hashFiles('_site/kde-to-je.png') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: site-plan
          path: _site
          retention-days: 1
          if-no-files-found: ignore

      - name: Cache PBF regiónu (save)
        if: ${{ always() && steps.pbf-cache.outputs.cache-hit != 'true' && hashFiles('data/region.osm.pbf') != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: data/region.osm.pbf
          key: ${{ steps.pbf-cache.outputs.cache-primary-key }}

      # Oboje: `.geojson` čítajú vrstvy z DEM (cutline, maska tieňovania)
      # a `deploy` (hranica pre viewer), surový `.poly` Planetiler
      # (`--polygon`, workers/lib/region-clip.sh) v jobe `tiles`, `trails`
      # a `features`. Preložiť si jedno z druhého by znamenalo mať hranicu
      # napísanú dvakrát.
      - name: Odlož polygón kraja
        uses: actions/upload-artifact@v7
        with:
          name: region-poly
          path: |
            data/region.geojson
            data/region.poly
          retention-days: 1

      # PBF potrebuje už len job s dlaždicami. Ide artefaktom, nie cache:
      # v rámci behu je to isté, cache by sa mohla minúť s iným behom.
      - name: Odlož PBF pre job s dlaždicami
        uses: actions/upload-artifact@v7
        with:
          name: pbf
          path: data/region.osm.pbf
          retention-days: 1
          compression-level: 0

      - name: Odlož meranie krokov
        if: ${{ always() && hashFiles('steps-out/*') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: steps-plan
          path: steps-out
          retention-days: 1
          if-no-files-found: ignore

  # ---------- značené trasy ----------
  # Trasa nie je cesta: je to `type=route` relácia nad cudzími cestami, ktorá
  # nesie značenie (farbu pásika, sieť, názov). Schéma OpenMapTiles relácie
  # trás nepozná – v hlavných dlaždiciach po nich nezostane ani stopa, takže
  # z mapy sa nedá zistiť, či po chodníku vedie červená turistická, dve
  # cyklotrasy, alebo nič.
  #
  # Vlastný job, lebo je to vlastný `.pmtiles` a bežať môže súbežne s mapou.
  # Necachuje sa: celé je to pár minút a závisí to na PBF, ktoré sa mení
  # denne – cache by sa aj tak trafila len v ten istý deň.
  trails:
    name: Značené trasy
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.opt_trails == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.trails.outputs.enabled }}
      maxzoom: ${{ steps.trails.outputs.maxzoom }}
      count: ${{ steps.trails.outputs.count }}
      size_mb: ${{ steps.trails.outputs.size_mb }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # Meranie krokov musí byť v pracovnom priečinku – `hashFiles` inam
      # nevidí, takže by sa artefakt nikdy neodložil.
      - name: Priprav priečinok na meranie
        run: mkdir -p steps-out

      - name: Stiahni PBF z prípravy
        uses: actions/download-artifact@v8
        with:
          name: pbf
          path: data

      # Polygón regiónu z prípravy – z neho je `--polygon` pre Planetiler
      # (workers/lib/region-clip.sh). Bez neho by sa dlaždice vyrábali na
      # celom obdĺžniku bboxu, teda aj ďaleko za regiónom. `continue-on-error`
      # preto, že aj bez neho sa beh dokončiť dá – skript to povie nahlas.
      - name: Stiahni polygón regiónu
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: region-poly
          path: data

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Planetileru (restore)
        id: planetiler-cache
        uses: ./.github/actions/cache-restore
        with:
          path: planetiler.jar
          key: planetiler-latest-${{ needs.plan.outputs.day }}

      - name: Stiahni Planetiler
        run: workers/lib/planetiler.sh
      - name: Cache Planetileru (save)
        if: ${{ always() && steps.planetiler-cache.outputs.cache-hit != 'true' && hashFiles('planetiler.jar') != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: planetiler.jar
          key: ${{ steps.planetiler-cache.outputs.cache-primary-key }}

      # Sedemdesiat riadkov bashu je vo `workers/trails/build.sh`.
      - name: Trasy z OSM relácií → PMTiles
        id: trails
        env:
          OPT_TRAILS_MAXZOOM: ${{ needs.plan.outputs.opt_trails_maxzoom }}
          OPT_REGION_CLIP: ${{ needs.plan.outputs.opt_region_clip }}
          REGION_BBOX: ${{ needs.plan.outputs.bbox }}
          REGION_KEY: ${{ needs.plan.outputs.key }}
          SIZE_LIMIT_MB: ${{ needs.plan.outputs.opt_size_limit_mb }}
        run: workers/trails/build.sh

      - name: Odlož trasy do skladu
        if: ${{ always() && hashFiles('data/trails.geojson') != '' }}
        continue-on-error: true
        env:
          CO: trasy
          NAZOV: trasy-${{ needs.plan.outputs.key }}
        run: workers/deploy/publish-results.sh

      # Časti stránky si joby posielajú artefaktom – každý vyrobí svoj kus
      # `_site` a `deploy` ich zlepí dokopy. compression-level 0: .pmtiles
      # je už komprimované, balenie by len ukradlo minúty.
      - name: Odlož časť stránky
        if: ${{ always() && hashFiles('_site/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: site-trails
          path: _site
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore

      - name: Odlož meranie krokov
        if: ${{ always() && hashFiles('steps-out/*') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: steps-trails
          path: steps-out
          retention-days: 1
          if-no-files-found: ignore

  # ---------- krajinné prvky, ktoré OpenMapTiles nemá ----------
  # Násypy, zárezy, múry, ploty, vedenia, prieseky, pramene, jaskyne,
  # rozhľadne, parkoviská a zjazdovky. Schéma OpenMapTiles sa pozerá len na
  # tridsať kľúčov a tieto medzi nimi nie sú – v základných dlaždiciach po
  # nich neostane stopa, takže sa z toho istého PBF ťahajú druhýkrát.
  # Vlastný job z rovnakého dôvodu ako trasy: vlastný .pmtiles a beží súbežne.
  features:
    name: Krajinné prvky
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.opt_features == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.features.outputs.enabled }}
      maxzoom: ${{ steps.features.outputs.maxzoom }}
      size_mb: ${{ steps.features.outputs.size_mb }}
      # Body (workers/features/points.yml) sú DRUHÝ výstup toho istého kroku
      # – vlastný archív pre balík `body` na stiahnutie, zdieľajú maxzoom
      # s líniami a plochami (rozpis vo `workers/features/build.sh`).
      points_enabled: ${{ steps.features.outputs.points_enabled }}
      points_size_mb: ${{ steps.features.outputs.points_size_mb }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Priprav priečinok na meranie
        run: mkdir -p steps-out

      - name: Stiahni PBF z prípravy
        uses: actions/download-artifact@v8
        with:
          name: pbf
          path: data

      # Polygón regiónu z prípravy – z neho je `--polygon` pre Planetiler
      # (workers/lib/region-clip.sh). Bez neho by sa dlaždice vyrábali na
      # celom obdĺžniku bboxu, teda aj ďaleko za regiónom. `continue-on-error`
      # preto, že aj bez neho sa beh dokončiť dá – skript to povie nahlas.
      - name: Stiahni polygón regiónu
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: region-poly
          path: data

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Planetileru (restore)
        id: planetiler-cache
        uses: ./.github/actions/cache-restore
        with:
          path: planetiler.jar
          key: planetiler-latest-${{ needs.plan.outputs.day }}

      - name: Stiahni Planetiler
        run: workers/lib/planetiler.sh
      - name: Cache Planetileru (save)
        if: ${{ always() && steps.planetiler-cache.outputs.cache-hit != 'true' && hashFiles('planetiler.jar') != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: planetiler.jar
          key: ${{ steps.planetiler-cache.outputs.cache-primary-key }}

      # Sedemdesiat riadkov bashu je vo `workers/features/build.sh`.
      - name: Krajinné prvky z OSM → PMTiles
        id: features
        env:
          OPT_FEATURES_MAXZOOM: ${{ needs.plan.outputs.opt_features_maxzoom }}
          OPT_REGION_CLIP: ${{ needs.plan.outputs.opt_region_clip }}
          REGION_BBOX: ${{ needs.plan.outputs.bbox }}
          REGION_KEY: ${{ needs.plan.outputs.key }}
          SIZE_LIMIT_MB: ${{ needs.plan.outputs.opt_size_limit_mb }}
        run: workers/features/build.sh

      - name: Odlož časť stránky
        if: ${{ always() && hashFiles('_site/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: site-features
          path: _site
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore

      - name: Odlož meranie krokov
        if: ${{ always() && hashFiles('steps-out/*') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: steps-features
          path: steps-out
          retention-days: 1
          if-no-files-found: ignore

  # Vo vlastnom súbore, lebo tento je pri strope 128 KiB – dôvod v `transport.yml`.
  # ---------- celá dopravná sieť ----------
  # Vo vlastnom súbore, lebo tento je pri strope 128 KiB – dôvod v `transport.yml`.
  # Rozpis, čo v tej vrstve je a prečo nestačí cestná sieť zo základnej mapy,
  # je v hlavičke `workers/transport/transport.yml`. Je to jadro balíka
  # `cesty`: kto chce len siete, po ktorých sa dá cestovať, si ich stiahne bez
  # zvyšku mapy.
  transport:
    name: Dopravná sieť
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.opt_transport == 'true' }}
    uses: ./.github/workflows/transport.yml
    secrets: inherit                      # cache na Drive; `env` sa nededí
    with:
      region_key: ${{ needs.plan.outputs.key }}
      region_bbox: ${{ needs.plan.outputs.bbox }}
      maxzoom: ${{ needs.plan.outputs.opt_transport_maxzoom }}
      region_clip: ${{ needs.plan.outputs.opt_region_clip }}
      size_limit_mb: ${{ needs.plan.outputs.opt_size_limit_mb }}
      budget_pct: ${{ needs.plan.outputs.budget_transport_pct }}
      day: ${{ needs.plan.outputs.day }}

  # ---------- hranice území a ich názvy ----------
  # Vo vlastnom súbore, lebo tento je pri strope 128 KiB – dôvod v
  # `boundaries.yml`. Rozpis, čo v tej vrstve je a prečo nestačí hranica zo
  # základnej mapy, je v hlavičke `workers/boundaries/boundaries.yml`: vrstva
  # `boundary` OpenMapTiles je čiara BEZ MENA územia, ktoré ohraničuje.
  hranice:
    name: Hranice území
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.opt_boundaries == 'true' }}
    uses: ./.github/workflows/boundaries.yml
    secrets: inherit                      # cache na Drive; `env` sa nededí
    with:
      region_key: ${{ needs.plan.outputs.key }}
      region_bbox: ${{ needs.plan.outputs.bbox }}
      maxzoom: ${{ needs.plan.outputs.opt_boundaries_maxzoom }}
      region_clip: ${{ needs.plan.outputs.opt_region_clip }}
      size_limit_mb: ${{ needs.plan.outputs.opt_size_limit_mb }}
      budget_pct: ${{ needs.plan.outputs.budget_boundaries_pct }}
      day: ${{ needs.plan.outputs.day }}

  # ---------- vodstvo ----------
  # Vo vlastnom súbore z toho istého dôvodu. Rozpis je v hlavičke
  # `workers/water/water.yml`: voda je v OpenMapTiles v troch vrstvách a meno
  # leží mimo geometrie, takže „chcem vodstvo a nič iné" znamená stiahnuť
  # celú mapu a vytiahnuť si to z nej sám.
  vodstvo:
    name: Vodstvo
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.opt_water == 'true' }}
    uses: ./.github/workflows/water.yml
    secrets: inherit                      # cache na Drive; `env` sa nededí
    with:
      region_key: ${{ needs.plan.outputs.key }}
      region_bbox: ${{ needs.plan.outputs.bbox }}
      maxzoom: ${{ needs.plan.outputs.opt_water_maxzoom }}
      region_clip: ${{ needs.plan.outputs.opt_region_clip }}
      size_limit_mb: ${{ needs.plan.outputs.opt_size_limit_mb }}
      budget_pct: ${{ needs.plan.outputs.budget_water_pct }}
      day: ${{ needs.plan.outputs.day }}

  # ---------- vyhľadávací index ----------
  # Beží súbežne s inými jobami. Čítame predfiltrovaný PBF a budujeme
  # SQLite FTS5 index na offline vyhľadávanie. Index sa balí do mapa kusa
  # v `_site/tiles/search-index.db`.
  search:
    name: Vyhľadávací index
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.opt_search == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.search.outputs.enabled }}
      size_mb: ${{ steps.search.outputs.size_mb }}
      row_count: ${{ steps.search.outputs.row_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Priprav priečinok na meranie
        run: mkdir -p steps-out

      - name: Stiahni PBF z prípravy
        uses: actions/download-artifact@v8
        with:
          name: pbf
          path: data

      - name: Nainštaluj osmium-tool a Python knižnice
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool python3-pip
          pip3 install osmium

      # Vyhľadávací index z PBF → SQLite FTS5
      - name: Vyhľadávací index z OSM → SQLite
        id: search
        env:
          REGION_KEY: ${{ needs.plan.outputs.key }}
          OSM_ID_FIELD: osm_id
        run: workers/search/build.sh

      - name: Odlož kus stránky
        if: ${{ always() && hashFiles('_site/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: site-search
          path: _site
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore

      - name: Odlož meranie krokov
        if: ${{ always() && hashFiles('steps-out/*') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: steps-search
          path: steps-out
          retention-days: 1
          if-no-files-found: ignore

  # ---------- navigačný graf pre tento kraj ----------
  # Vo vlastnom súbore, lebo tento je pri strope 128 KiB – dôvod aj rozpis
  # (prečo má graf VLASTNÝ balík a prečo trasa končí na hranici kraja) je
  # v `navigation-region.yml`.
  navigacia:
    name: Navigačný graf (Valhalla)
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.opt_navigacia == 'true' }}
    uses: ./.github/workflows/navigation-region.yml
    with:
      region_key: ${{ needs.plan.outputs.key }}
      valhalla_image: ${{ needs.plan.outputs.opt_valhalla_image }}

  # ---------- mapové dlaždice ----------
  # Beží súbežne s vrstevnicami, trasami aj tieňovaním – z nich nič
  # nepotrebuje, len PBF z prípravy.
  tiles:
    name: Mapové dlaždice (Planetiler)
    needs: plan
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      maxzoom: ${{ steps.tiles.outputs.maxzoom }}
      size_mb: ${{ steps.tiles.outputs.size_mb }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # Meranie krokov musí byť v pracovnom priečinku – `hashFiles` inam
      # nevidí, takže by sa artefakt nikdy neodložil.
      - name: Priprav priečinok na meranie
        run: mkdir -p steps-out

      - name: Stiahni PBF z prípravy
        uses: actions/download-artifact@v8
        with:
          name: pbf
          path: data

      # Polygón regiónu z prípravy – z neho je `--polygon` pre Planetiler
      # (workers/lib/region-clip.sh). Bez neho by sa dlaždice vyrábali na
      # celom obdĺžniku bboxu, teda aj ďaleko za regiónom. `continue-on-error`
      # preto, že aj bez neho sa beh dokončiť dá – skript to povie nahlas.
      - name: Stiahni polygón regiónu
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: region-poly
          path: data


      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Kým to bola cache v GitHube, stačil jeden krok (`actions/cache` uloží
      # sám v post-kroku). Na Drive sú to dva – a je to tak lepšie: ukladá sa
      # hneď po stiahnutí a nie až vtedy, keď job dobehne úspešne.
      - name: Cache – zdrojové dáta Planetileru (restore)
        id: sources-cache
        uses: ./.github/actions/cache-restore
        with:
          path: data/sources
          key: planetiler-sources-v1

      - name: Cache Planetileru (restore)
        id: planetiler-cache
        uses: ./.github/actions/cache-restore
        with:
          path: planetiler.jar
          key: planetiler-latest-${{ needs.plan.outputs.day }}

      - name: Stiahni Planetiler
        run: workers/lib/planetiler.sh
      - name: Cache Planetileru (save)
        if: ${{ always() && steps.planetiler-cache.outputs.cache-hit != 'true' && hashFiles('planetiler.jar') != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: planetiler.jar
          key: ${{ steps.planetiler-cache.outputs.cache-primary-key }}

      # Osemdesiat riadkov bashu je vo `workers/tiles/build.sh`; rozpočtové
      # podiely (`BUDGET_*`) si berie z env workflowu.
      - name: PBF → PMTiles (Planetiler, OpenMapTiles schéma)
        id: tiles
        env:
          OPT_AUTO_SHRINK: ${{ needs.plan.outputs.opt_auto_shrink }}
          OPT_MAXZOOM: ${{ needs.plan.outputs.opt_maxzoom }}
          OPT_REGION_CLIP: ${{ needs.plan.outputs.opt_region_clip }}
          REGION_BBOX: ${{ needs.plan.outputs.bbox }}
          REGION_KEY: ${{ needs.plan.outputs.key }}
          SIZE_LIMIT_MB: ${{ needs.plan.outputs.opt_size_limit_mb }}
        run: workers/tiles/build.sh

      # Zdrojové dáta si Planetiler stiahol počas behu vyššie (water polygons
      # majú ~700 MB) – odkladajú sa až teraz, keď existujú.
      - name: Cache – zdrojové dáta Planetileru (save)
        if: ${{ always() && steps.sources-cache.outputs.cache-hit != 'true' && hashFiles('data/sources/**') != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: data/sources
          key: ${{ steps.sources-cache.outputs.cache-primary-key }}

      - name: Odlož časť stránky
        if: ${{ always() && hashFiles('_site/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: site-tiles
          path: _site
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore

      - name: Odlož meranie krokov
        if: ${{ always() && hashFiles('steps-out/*') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: steps-tiles
          path: steps-out
          retention-days: 1
          if-no-files-found: ignore

  # ---------- ikonky a fonty ----------
  # Nezávisí od ničoho okrem kódu, takže beží od začiatku súbežne so všetkým.
  assets:
    name: Ikonky a fonty
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.sprite.outputs.name }}
      available: ${{ steps.sprite.outputs.available }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # Meranie krokov musí byť v pracovnom priečinku – `hashFiles` inam
      # nevidí, takže by sa artefakt nikdy neodložil.
      - name: Priprav priečinok na meranie
        run: mkdir -p steps-out


      # `workers/assets/glyphs.sh` JE V KĽÚČI. Nie je to len zdroj spritov –
      # rozhoduje aj o tom, KTORÉ rozsahy znakov v `_site/fonts` ostanú.
      # Kým v kľúči nebol, zmena toho zoznamu sa neprejavila: cache vrátila
      # staré (širšie) fonty a skript ich len našiel na disku.
      - name: Cache glyfov a spritov (restore)
        id: assets-cache
        uses: ./.github/actions/cache-restore
        with:
          path: |
            _site/fonts
            _site/sprites
          key: assets-${{ hashFiles('poc/web/icon-sources.js', 'poc/web/shields.js', 'poc/web/marks.js', 'poc/web/style-overrides.json', 'workers/assets/sprite.mjs', 'workers/assets/shields.mjs', 'workers/assets/marks.mjs', 'workers/assets/custom-icons.mjs', 'workers/lib/sprite-bake.mjs', 'workers/assets/glyphs.sh') }}-${{ env.GLYPHS_ZIP }}

      # Sedemdesiat riadkov bashu je vo `workers/assets/icons.sh`.
      - name: Stiahni a priprav sady ikoniek
        id: sprite
        run: workers/assets/icons.sh

      # Vo `workers/assets/glyphs.sh`; `GLYPHS_ZIP` si berie z env workflowu.
      - name: Stiahni glyfy (fonty) k sebe na Pages
        run: workers/assets/glyphs.sh

      - name: Cache glyfov a spritov (save)
        if: ${{ always() && steps.assets-cache.outputs.cache-hit != 'true' && hashFiles('_site/sprites/**') != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          path: |
            _site/fonts
            _site/sprites
          key: ${{ steps.assets-cache.outputs.cache-primary-key }}

      # Časti stránky si joby posielajú artefaktom – každý vyrobí svoj kus
      # `_site` a `deploy` ich zlepí dokopy. compression-level 0: .pmtiles
      # aj .png sú už komprimované, balenie by len ukradlo minúty.
      - name: Odlož časť stránky
        if: ${{ always() && hashFiles('_site/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: site-assets
          path: _site
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore

      - name: Odlož meranie krokov
        if: ${{ always() && hashFiles('steps-out/*') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: steps-assets
          path: steps-out
          retention-days: 1
          if-no-files-found: ignore

  # ---------- zloženie a nasadenie ----------
  # Pozbiera kusy `_site` od ostatných jobov, dogeneruje štýly a manifest,
  # skontroluje a nasadí. `!cancelled()` a nie `success()`: keď vrstevnice
  # alebo tieňovanie spadnú alebo sú vypnuté, mapa sa má nasadiť aj tak –
  # bez nich, ale nasadiť.
  deploy:
    name: Zloženie a nasadenie
    needs: [plan, dem, trails, features, transport, hranice, vodstvo, search, navigacia, tiles, assets]
    if: ${{ !cancelled() && needs.tiles.result == 'success' && needs.assets.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      # `write`, a je to jediné miesto v celom builde, kde do repozitára niečo
      # ide: `maps.json` (katalóg hotových máp) sa po nahratí balíkov na Drive
      # commitne do vetvy, z ktorej beh vyšel. Nie je to publikovanie dát – tie
      # sú na Drive; je to zoznam, ktorý sa inak nedá zistiť bez tokenu.
      # Nezacyklí sa to: `Build map` sa spúšťa len ručne (`workflow_dispatch`).
      contents: write
      pages: write
      id-token: write
      actions: read     # súhrn číta joby a ich logy, keď niečo spadne
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # Každý job odložil svoj kus `_site` (dlaždice, vrstevnice, terén,
      # ikonky). `merge-multiple` ich rozbalí do jedného stromu presne tam,
      # odkiaľ pochádzali. Vzor `site-*`, nie mená: keď je nejaký job vypnutý
      # alebo spadol, jeho artefakt jednoducho nie je a nič sa nedeje.
      - name: Pozbieraj kusy stránky
        uses: actions/download-artifact@v8
        with:
          pattern: site-*
          path: _site
          merge-multiple: true

      - name: Stiahni meranie krokov od ostatných jobov
        if: ${{ always() }}
        uses: actions/download-artifact@v8
        with:
          pattern: steps-*
          path: steps-out
          merge-multiple: true

      - name: Čo prišlo od ostatných jobov
        run: |
          set -uo pipefail
          echo "Výsledky jobov: vrstevnice=${{ needs.dem.outputs.res_contours }}, trasy=${{ needs.trails.result }}, prvky=${{ needs.features.result }}, doprava=${{ needs.transport.result }}, hranice=${{ needs.hranice.result }}, vodstvo=${{ needs.vodstvo.result }}, hľadanie=${{ needs.search.result }}, navigácia=${{ needs.navigacia.result }}, terén=${{ needs.dem.outputs.res_terrain }}, dlaždice=${{ needs.tiles.result }}, ikonky=${{ needs.assets.result }}"
          find _site -maxdepth 2 -mindepth 1 -type d -exec du -sh {} \; 2>/dev/null || true
          du -sm _site | cut -f1 | xargs -I{} echo "_site spolu: {} MB"


      # HRANICA STIAHNUTÉHO REGIÓNU. Dlaždice sú orezané po celých dlaždiciach
      # (`--polygon` v jobe `tiles`), takže na z14 môžu presahovať ešte
      # zhruba kilometer a pol. Presnú hranicu dokreslí štýl z tohto súboru –
      # za ňou nie je nič, ani vodstvo a Natural Earth, ktoré Planetiler dáva
      # do dlaždíc na celom obdĺžniku. Ide to do `_site`, čiže aj do ZIPu na
      # Drive, teda do mapy, ktorú si aplikácia stiahne do telefónu.
      - name: Stiahni polygón regiónu
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: region-poly
          path: data

      - name: Hranica regiónu pre viewer
        run: |
          # `--pad-m`: `--bbox` je tesný obdĺžnik okolo PÔVODNÉHO polygónu,
          # kým `region.geojson` je už nafúknutý o prekryv so susedom (rozpis
          # pri `--pad-m` v region-mask.py) – bez neho by tu orez ten prekryv
          # pri každom behu odrezal späť.
          python3 workers/deploy/region-mask.py \
            --poly=data/region.geojson \
            --bbox='${{ needs.plan.outputs.bbox }}' \
            --pad-m=3000 \
            --out=_site/region.geojson

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Vygeneruj statické style.json (web + iOS)
        run: |
          node workers/styles/build.mjs \
            --base-url='${{ steps.pages.outputs.base_url }}' \
            --region='${{ needs.plan.outputs.key }}' \
            --name='${{ needs.plan.outputs.name }}' \
            --maxzoom='${{ needs.tiles.outputs.maxzoom }}' \
            --contours='${{ needs.dem.outputs.contours_enabled || 'false' }}' \
            --contours-maxzoom='${{ needs.dem.outputs.contours_maxzoom || '14' }}' \
            --rocks='${{ needs.dem.outputs.rocks_enabled || 'false' }}' \
            --rocks-maxzoom='${{ needs.dem.outputs.rocks_maxzoom || '16' }}' \
            --trails='${{ needs.trails.outputs.enabled || 'false' }}' \
            --trails-maxzoom='${{ needs.trails.outputs.maxzoom || '14' }}' \
            --features='${{ needs.features.outputs.enabled || 'false' }}' \
            --features-maxzoom='${{ needs.features.outputs.maxzoom || '15' }}' \
            --points='${{ needs.features.outputs.points_enabled || 'false' }}' \
            --points-maxzoom='${{ needs.features.outputs.maxzoom || '15' }}' \
            --transport='${{ needs.transport.outputs.enabled || 'false' }}' \
            --transport-maxzoom='${{ needs.transport.outputs.maxzoom || '14' }}' \
            --dem-source='${{ needs.dem.outputs.contours_dem_source || 'sonny' }}' \
            --dem-tiles-source='${{ needs.dem.outputs.terrain_dem_source || needs.dem.outputs.contours_dem_source || 'sonny' }}' \
            --dem-bounds='${{ needs.plan.outputs.test_bbox }}' \
            --terrain-3d='${{ needs.plan.outputs.opt_terrain_3d }}' \
            ${{ needs.dem.outputs.terrain_enabled == 'true' && format('--dem-tiles=pmtiles://{0}/tiles/{1}-terrain.pmtiles --dem-maxzoom={2}', steps.pages.outputs.base_url, needs.plan.outputs.key, needs.dem.outputs.terrain_maxzoom) || '' }} \
            --sprites-dir=_site/sprites \
            --region-outline=_site/region.geojson \
            --overrides=poc/web/style-overrides.json \
            --fonts-dir=_site/fonts \
            --out=_site/styles

      - name: Dopeč vzory plôch a čiar do spritu
        run: |
          # Vzory z developer módu sú generované z predpisu v názve obrázka.
          # Web si ich dokreslí sám, statický štýl pre iOS ich potrebuje
          # priamo v sprite.
          for id in ${{ needs.assets.outputs.available }}; do
            node workers/styles/patterns.mjs \
              --sprite="_site/sprites/$id" --styles=_site/styles
          done

      # Sto riadkov bashu a jq je vo `workers/deploy/site.sh` (strop súboru
      # 128 kB). Sem chodia len výstupy ostatných jobov.
      - name: Poskladaj web (viewer + manifest)
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
          CONTOURS_DEM_SOURCE: ${{ needs.dem.outputs.contours_dem_source || 'sonny' }}
          CONTOURS_ENABLED: ${{ needs.dem.outputs.contours_enabled || 'false' }}
          CONTOURS_MAXZOOM: ${{ needs.dem.outputs.contours_maxzoom || '14' }}
          CONTOUR_INTERVAL: ${{ needs.plan.outputs.opt_contour_interval || '5' }}
          DEM_MAXZOOM: ${{ needs.dem.outputs.terrain_maxzoom || 15 }}
          DEM_TILES_SOURCE: ${{ needs.dem.outputs.terrain_dem_source || needs.dem.outputs.contours_dem_source || 'sonny' }}
          DEM_URL: ${{ needs.dem.outputs.terrain_enabled == 'true' && format('pmtiles://{0}/tiles/{1}-terrain.pmtiles', steps.pages.outputs.base_url, needs.plan.outputs.key) || '' }}
          FEATURES_ENABLED: ${{ needs.features.outputs.enabled || 'false' }}
          FEATURES_MAXZOOM: ${{ needs.features.outputs.maxzoom || '15' }}
          POINTS_ENABLED: ${{ needs.features.outputs.points_enabled || 'false' }}
          TRANSPORT_ENABLED: ${{ needs.transport.outputs.enabled || 'false' }}
          TRANSPORT_MAXZOOM: ${{ needs.transport.outputs.maxzoom || '14' }}
          BOUNDARIES_ENABLED: ${{ needs.hranice.outputs.enabled || 'false' }}
          BOUNDARIES_MAXZOOM: ${{ needs.hranice.outputs.maxzoom || '12' }}
          WATER_ENABLED: ${{ needs.vodstvo.outputs.enabled || 'false' }}
          WATER_MAXZOOM: ${{ needs.vodstvo.outputs.maxzoom || '14' }}
          ICONS_AVAILABLE: ${{ needs.assets.outputs.available }}
          ICONS_NAME: ${{ needs.assets.outputs.name }}
          REGION_BBOX: ${{ needs.plan.outputs.bbox }}
          REGION_KEY: ${{ needs.plan.outputs.key }}
          REGION_NAME: ${{ needs.plan.outputs.name }}
          REGION_OUTLINE: region.geojson
          ROCKS_ENABLED: ${{ needs.dem.outputs.rocks_enabled || 'false' }}
          ROCKS_MAXZOOM: ${{ needs.dem.outputs.rocks_maxzoom || '16' }}
          ROCK_SLOPE: ${{ needs.dem.outputs.rock_slope || 'off' }}
          ROCK_SOURCE: ${{ needs.dem.outputs.rock_source || 'off' }}
          TEST_BBOX: ${{ needs.plan.outputs.test_bbox }}
          TEST_KM2: ${{ needs.plan.outputs.test_km2 || '0' }}
          TILES_MAXZOOM: ${{ needs.tiles.outputs.maxzoom }}
          TILES_SIZE_MB: ${{ needs.tiles.outputs.size_mb }}
          TRAILS_COUNT: ${{ needs.trails.outputs.count || '0' }}
          TRAILS_ENABLED: ${{ needs.trails.outputs.enabled || 'false' }}
          TRAILS_MAXZOOM: ${{ needs.trails.outputs.maxzoom || '14' }}
        run: workers/deploy/site.sh

      - name: Skontroluj, že štýl odkazuje len na existujúce súbory
        id: kontrola
        env:
          SPRITE: ${{ needs.assets.outputs.name }}
          REGION_KEY: ${{ needs.plan.outputs.key }}
          LIMIT_MB: ${{ needs.plan.outputs.opt_size_limit_mb }}
        run: workers/deploy/check.sh
      # Štýly, viewer, `manifest.json` a dopečený sprite – čo `_site` dostalo
      # až tu a v `site-*` teda NIE JE. Prečo to job na macOS potrebuje, je
      # vo `workers/deploy/apple-archive.sh`. Dlaždice a fonty sú vylúčené,
      # tie na druhej strane už sú.
      - name: Odlož zloženú časť webu pre ďalšie joby
        if: ${{ always() && steps.kontrola.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: deploy-site
          path: |
            _site
            !_site/fonts
            !_site/tiles/*.pmtiles
          retention-days: 1
          compression-level: 0

      # `publish_pages=false` vypne LEN nasadenie – `_site` sa postaví
      # a skontroluje rovnako ako pri ostrom behu (na tom istom `_site` stojí
      # aj balík, ktorý ide na Drive), len sa nenahrá na Pages. `steps.publish`
      # nižšie (Drive) je nezávislá páka – tá beží ďalej podľa `opt_publish`.
      - name: Upload Pages artifact
        if: ${{ needs.plan.outputs.opt_publish_pages == 'true' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy na GitHub Pages
        id: deployment
        if: ${{ needs.plan.outputs.opt_publish_pages == 'true' }}
        uses: actions/deploy-pages@v5

      # Bez nasadenia niet čo overovať – `steps.deployment.outputs.page_url`
      # by bol prázdny a smoke test by kontroloval starú (alebo žiadnu) mapu.
      - name: Smoke test nasadenej mapy
        if: ${{ needs.plan.outputs.opt_publish_pages == 'true' }}
        env:
          BASE: ${{ steps.deployment.outputs.page_url }}
          REGION: ${{ needs.plan.outputs.key }}
          SPRITE: ${{ needs.assets.outputs.name }}
          CONTOURS: ${{ needs.dem.outputs.contours_enabled }}
          ROCKS: ${{ needs.dem.outputs.rocks_enabled }}
          TRAILS: ${{ needs.trails.outputs.enabled }}
          FEATURES: ${{ needs.features.outputs.enabled }}
          POINTS: ${{ needs.features.outputs.points_enabled }}
          BOUNDARIES: ${{ needs.hranice.outputs.enabled }}
          WATER: ${{ needs.vodstvo.outputs.enabled }}
          PAGES_BUILD_TYPE: ${{ needs.plan.outputs.pages_build_type }}
        run: workers/deploy/smoke-test.sh

      # NAVIGAČNÝ GRAF AŽ TU, ZA PAGES. Ide do vlastného balíka (je to tá
      # istá sieť ako trasy a obmedzenia, len zjazdná), na stránku nejde –
      # nie je čo kresliť a zjedol by rozpočet Pages. Preto sa artefakt nevolá
      # `site-…`: krok „Pozbieraj kusy stránky“ berie `site-*` a graf by sa
      # doňho zlial ešte pred nahratím na Pages. `continue-on-error`, lebo
      # mapa bez navigácie je mapa – `-navigacia.zip` sa vtedy nevyrobí.
      - name: Stiahni navigačný graf do balíka
        if: ${{ always() && needs.navigacia.result == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: navigacia-graf
          path: _site

      - name: Publikuj mapu na Drive
        id: publish
        if: ${{ always() && needs.plan.outputs.opt_publish == 'true' && steps.kontrola.outcome == 'success' }}
        env:
          AREA_KEY: ${{ needs.plan.outputs.area_key }}
          # Bbox výrezu ide do katalógu vedľa bboxu mapy: mapa je celý región,
          # ale vrstevnice a skaly sú len tu.
          AREA_BBOX: ${{ needs.plan.outputs.area_bbox }}
          CONTOURS_ENABLED: ${{ needs.dem.outputs.contours_enabled || 'false' }}
          CONTOURS_SOURCE: ${{ needs.dem.outputs.contours_dem_source }}
          CONTOUR_INTERVAL: ${{ needs.plan.outputs.opt_contour_interval }}
          CUSTOM_NAME: ${{ needs.plan.outputs.opt_custom_name }}
          CUSTOM_PBF_URL: ${{ needs.plan.outputs.opt_custom_pbf_url }}
          FEATURES_ENABLED: ${{ needs.features.outputs.enabled || 'false' }}
          TRANSPORT_ENABLED: ${{ needs.transport.outputs.enabled || 'false' }}
          BOUNDARIES_ENABLED: ${{ needs.hranice.outputs.enabled || 'false' }}
          WATER_ENABLED: ${{ needs.vodstvo.outputs.enabled || 'false' }}
          REGION_KEY: ${{ needs.plan.outputs.key }}
          ROCKS_ENABLED: ${{ needs.dem.outputs.rocks_enabled || 'false' }}
          ROCKS_SOURCE: ${{ needs.dem.outputs.rock_source }}
          TERRAIN_ENABLED: ${{ needs.dem.outputs.terrain_enabled || 'false' }}
          TERRAIN_SOURCE: ${{ needs.dem.outputs.terrain_dem_source }}
          TEST_KM2: ${{ needs.plan.outputs.test_km2 }}
          TILES_MAXZOOM: ${{ needs.tiles.outputs.maxzoom }}
          TRAILS_ENABLED: ${{ needs.trails.outputs.enabled || 'false' }}
        run: |
          set -euo pipefail
          python3 workers/deploy/publish-map.py --site=_site \
            --maps=maps.json \
            --summary="$GITHUB_STEP_SUMMARY"

      # ---------- katalóg hotových máp ----------
      # `maps.json` v koreni repozitára je jediný zoznam toho, KTORÉ mapy sú
      # hotové a kde na Drive ležia (krajina → kraj → výsek → odkazy na tri
      # balíky). Na Drive sa to inak nedá zistiť bez tokenu a bez klikania,
      # takže ho dopisuje krok vyššie – hneď po nahratí, lebo len ten pozná id
      # súborov – a tu sa to už len uloží do repozitára.
      #
      # Až za publikovaním a `if: success()` na ňom: katalóg nesmie ukazovať na
      # súbory, ktoré sa nenahrali.
      # KTORÝ SÚBOR TO JE, POVIE KROK VYŠŠIE (`maps_file`), nie tento: rýchly
      # test zapisuje do `maps-test.json`, ostrý beh do `maps.json`. Rozhoduje
      # `workers/deploy/catalog.py` – odvodiť si to tu druhýkrát by znamenalo
      # zapísať jeden súbor a commitnúť druhý.
      - name: Zapíš mapu do maps.json
        if: ${{ steps.publish.outcome == 'success' }}
        env:
          MAPS_JSON: ${{ steps.publish.outputs.maps_file || 'maps.json' }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: workers/deploy/catalog.sh
      # ---------- súhrn ----------
      # Čo build spravil, ako dlho to trvalo a s akým detailom – na jednom
      # mieste v záložke Summary. Riadky si každý job odložil do svojho
      # `steps-*` artefaktu; tu sa zlejú a zoradia podľa poradového čísla,
      # lebo joby bežia súbežne a poradie v čase nič nehovorí.
      # Súhrn je deväť kilobajtov markdownu a workflow súbor má strop
      # 128 KiB – nad ním ho GitHub ticho neprijme. Text je preto
      # vo `workers/deploy/summary.sh` a sem chodia len hodnoty, ktoré pozná
      # iba workflow (výsledky jobov, vybrané zdroje, URL nasadenia).
      - name: Súhrn buildu
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REGION_NAME: ${{ needs.plan.outputs.name || inputs.region }}
          R_PLAN: ${{ needs.plan.result }}
          R_CONTOURS: ${{ needs.dem.outputs.res_contours }}
          R_SHADING_ROCKS: ${{ needs.dem.outputs.res_shading_rocks }}
          R_TRAILS: ${{ needs.trails.result }}
          R_FEATURES: ${{ needs.features.result }}
          R_HRANICE: ${{ needs.hranice.result }}
          R_VODSTVO: ${{ needs.vodstvo.result }}
          R_TERRAIN: ${{ needs.dem.outputs.res_terrain }}
          R_TILES: ${{ needs.tiles.result }}
          R_ASSETS: ${{ needs.assets.result }}
          SRC_CONTOURS: ${{ needs.plan.outputs.opt_contour_source }}
          SRC_ROCKS: ${{ needs.plan.outputs.opt_rock_source }}
          SRC_SHADING: ${{ needs.plan.outputs.opt_shading_source }}
          USED_CONTOURS: ${{ needs.dem.outputs.contours_dem_source || '(nebežalo)' }}
          USED_ROCKS: ${{ needs.dem.outputs.rock_source || '(nebežalo)' }}
          USED_SHADING: ${{ needs.dem.outputs.terrain_dem_source || '(nebežalo)' }}
          SIZE_LIMIT_MB: ${{ needs.plan.outputs.opt_size_limit_mb }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          PUBLISH_PAGES: ${{ needs.plan.outputs.opt_publish_pages }}
          PAGES_BUILD_TYPE: ${{ needs.plan.outputs.pages_build_type }}
          REGION_KEY: ${{ needs.plan.outputs.key }}
          TEST_KM2: ${{ needs.plan.outputs.test_km2 }}
          TEST_BBOX: ${{ needs.plan.outputs.test_bbox }}
          TEST_FULL_BBOX: ${{ needs.plan.outputs.full_bbox }}
          # Celý formulár naraz, nie pole po poli: `toJSON(inputs)` sa nemá
          # ako rozísť so zoznamom inputov, kdežto desať riadkov áno – a to
          # by v súhrne ticho chýbalo práve to pole, ktoré si zmenil.
          INPUTS_JSON: ${{ toJSON(inputs) }}
        run: bash workers/deploy/summary.sh

  # ---------- Apple Archive ----------
  # Ten istý obsah, aký `deploy` nahral ako ZIPy, ešte raz ako `.aar`
  # (Apple Archive, LZFSE). iOS a macOS ho rozbalia SYSTÉMOVO – framework
  # AppleArchive, žiadna tretia knižnica v aplikácii – a dekompresia je na
  # Apple hardvéri výrazne rýchlejšia než deflate. ZIP tým nezaniká: otvorí ho
  # čokoľvek, `.aar` je navyše.
  #
  # PREČO VLASTNÝ JOB, A EŠTE NA macOS: nástroj `aa` je súčasť macOS a inde
  # neexistuje. Nie je to teda voliteľný krok v `deploy`, ale iný stroj – a
  # keďže je to iný stroj, musí si `_site` stiahnuť z tých istých artefaktov,
  # z akých ho skladal `deploy` (`site-*`, retencia 1 deň – prepravky jedného
  # behu, nie publikovanie).
  #
  # Beží AŽ PO `deploy` a len keď ten publikoval: balíky sa volajú rovnako a
  # líšia sa príponou, takže katalóg `maps.json` sa najprv naplní ZIPmi a tento
  # job k nim `.aar` dopíše (`publish-map.py` to pozná podľa toho, že v jeho
  # `--format` nie je `zip`). Opačné poradie by znamenalo, že katalóg chvíľu
  # ukazuje na `.aar`, ktorý ešte nie je nahratý.
  #
  # Keď spadne, MAPA TÝM NETRPÍ – na Pages aj na Drive je všetko hotové a
  # chýba len druhá podoba balíkov. Preto `continue-on-error` na kroku a nie
  # `needs` niekoho ďalšieho.
  apple-archive:
    name: Balíky ako Apple Archive (.aar)
    needs: [plan, deploy, dem, trails, features, transport, hranice, vodstvo, tiles]
    if: ${{ !cancelled() && needs.deploy.result == 'success' && needs.plan.outputs.opt_publish == 'true' && needs.plan.outputs.opt_apple_archive == 'true' }}
    runs-on: macos-latest
    permissions:
      contents: write     # `maps.json` – to isté, čo robí `deploy`
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # Tie isté kusy, z akých `deploy` skladal `_site`. Vzor `site-*`, nie
      # mená: keď je nejaký job vypnutý alebo spadol, jeho artefakt jednoducho
      # nie je a nič sa nedeje.
      - name: Pozbieraj kusy stránky
        uses: actions/download-artifact@v8
        with:
          pattern: site-*
          path: _site
          merge-multiple: true
      # Články z Wikipédie tu NIE SÚ a nie je to opomenutie: majú vlastnú
      # pipeline (`.github/workflows/wiki.yml`), ktorá si `.aar` vyrába sama.
      # Build map o tom balíku nerozhoduje, takže sa ho tu ani nedotýkame –
      # `publish-map.py` ho bez `--wiki` do zoznamu vôbec nezaradí, a tým
      # pádom ho ani nezmaže.
      # AŽ PO `site-*`: sprite je v oboch a vyhrať musí ten dopečený. Poradie
      # krokov je jediné, čo to zaručuje – `merge-multiple` o prednosti
      # nehovorí nič.
      - name: Pozbieraj zloženú časť webu
        uses: actions/download-artifact@v8
        with:
          name: deploy-site
          path: _site
      # NAVIGAČNÝ GRAF MUSÍ BYŤ AJ TU. `.aar` je ten istý obsah ako ZIP, len
      # inak zabalený – keby graf chýbal, `-navigacia.aar` by bol prázdny
      # proti `-navigacia.zip` a na ničom by to nebolo vidieť. Do `site-*`
      # graf nepatrí (na Pages nemá čo robiť), takže sa sťahuje menom.
      # `continue-on-error`: mapa bez navigácie je mapa.
      - name: Stiahni navigačný graf do balíka
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: navigacia-graf
          path: _site
      - name: Zabaľ a nahraj .aar na Drive
        id: publish
        env:
          AREA_KEY: ${{ needs.plan.outputs.area_key }}
          AREA_BBOX: ${{ needs.plan.outputs.area_bbox }}
          CONTOURS_ENABLED: ${{ needs.dem.outputs.contours_enabled || 'false' }}
          CONTOURS_SOURCE: ${{ needs.dem.outputs.contours_dem_source }}
          CONTOUR_INTERVAL: ${{ needs.plan.outputs.opt_contour_interval }}
          CUSTOM_NAME: ${{ needs.plan.outputs.opt_custom_name }}
          CUSTOM_PBF_URL: ${{ needs.plan.outputs.opt_custom_pbf_url }}
          FEATURES_ENABLED: ${{ needs.features.outputs.enabled || 'false' }}
          TRANSPORT_ENABLED: ${{ needs.transport.outputs.enabled || 'false' }}
          BOUNDARIES_ENABLED: ${{ needs.hranice.outputs.enabled || 'false' }}
          WATER_ENABLED: ${{ needs.vodstvo.outputs.enabled || 'false' }}
          REGION_KEY: ${{ needs.plan.outputs.key }}
          ROCKS_ENABLED: ${{ needs.dem.outputs.rocks_enabled || 'false' }}
          ROCKS_SOURCE: ${{ needs.dem.outputs.rock_source }}
          TERRAIN_ENABLED: ${{ needs.dem.outputs.terrain_enabled || 'false' }}
          TERRAIN_SOURCE: ${{ needs.dem.outputs.terrain_dem_source }}
          TEST_KM2: ${{ needs.plan.outputs.test_km2 }}
          TILES_MAXZOOM: ${{ needs.tiles.outputs.maxzoom }}
          TRAILS_ENABLED: ${{ needs.trails.outputs.enabled || 'false' }}
          # Z ktorej vetvy si vypýtať čerstvý `maps.json` – ten predošlý
          # job doň práve zapísal a checkout má stav spred toho.
          BRANCH: ${{ github.ref_name }}
        run: workers/deploy/apple-archive.sh
      # Katalóg: `deploy` doň zapísal ZIPy, tento krok k nim pridá `.aar`.
      # `git pull --rebase` v skripte je tu nutnosť, nie poistka – `deploy`
      # commitol `maps.json` o pár minút skôr do tej istej vetvy.
      - name: Zapíš .aar do maps.json
        if: ${{ steps.publish.outcome == 'success' }}
        env:
          MAPS_JSON: ${{ steps.publish.outputs.maps_file || 'maps.json' }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: workers/deploy/catalog.sh
