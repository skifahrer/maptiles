name: Údržba · prihlásenie Drive

# Vyrobí refresh token vlastníka dát na Google Drive a uloží ho priamo do
# secretu. Spúšťa sa raz – potom už len keby účet prístup odvolal.
#
# `workers/drive/auth.py --login` potrebuje prehliadač aj loopback server na
# tom istom stroji; tento workflow tú rolu rozdelí (prehliadač je telefón,
# shell je runner).
#
# Rozsah práv je aj zápis (`drive`, nie `drive.readonly`): cache buildu leží
# na Drive, takže sa tam musí dať ukladať.
#
# Token sa nikde nevypisuje – repozitár je public a refresh token je prístup
# na celý Drive. Zapíše sa do súboru s právami 600 a z neho do secretu.
#
# Zápis secretu `GITHUB_TOKEN` nevie, tak treba dočasný fine-grained PAT
# v secrete `DRIVE_PAT` (Repository permissions: Secrets → Read and write).
# Po úspešnom behu ho zmaž.
#
# Ďalej treba `DRIVE_CLIENT` (repository VARIABLE, nie secret) a `DRIVE_SECRET`.
#
# Ako to ide: spusti bez `code` → v súhrne je odkaz → otvor ho v telefóne
# a prihlás sa účtom, ktorý DMR 5.0 vlastní → prehliadač skončí na
# `http://127.0.0.1:8731/?code=…` a nemá to kde otvoriť (to je v poriadku,
# tá adresa je celý zmysel kroku) → spusti znova a adresu vlož do `code`.
# Kód platí pár minút a je jednorazový.

on:
  workflow_dispatch:
    inputs:
      code:
        description: "Adresa s ?code=… z prehliadača (prázdne = daj mi odkaz na prihlásenie)"
        required: false
        default: ""
        type: string
      secret_name:
        description: "Do ktorého secretu token zapísať"
        required: false
        default: DRIVE_REFRESH
        type: string

permissions:
  contents: read

concurrency:
  # dva behy naraz by si vymieňali kód, ktorý je jednorazový
  group: drive-login
  cancel-in-progress: false

jobs:
  login:
    name: Refresh token vlastníka Drive
    runs-on: ubuntu-latest
    env:
      DRIVE_CLIENT: ${{ vars.DRIVE_CLIENT }}
      DRIVE_SECRET: ${{ secrets.DRIVE_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # prvý beh skončí tu. Odkaz sa vypisuje na dve miesta naschvál: mobilná
      # appka GitHubu súhrny nezobrazuje, tam je vidieť len log kroku.
      # Tajné na ňom nie je nič – `client_id` je verejná časť OAuth klienta.
      - name: Odkaz na prihlásenie
        if: ${{ inputs.code == '' }}
        run: |
          set -euo pipefail
          URL=$(python3 workers/drive/auth.py --auth-url)
          echo
          echo "Otvor v prehliadači tento odkaz (celý jeden riadok):"
          echo
          echo "$URL"
          echo
          echo "Prihlás sa účtom, ktorý DMR 5.0 na Drive VLASTNÍ, a povoľ prístup."
          echo "Prehliadač potom skončí na http://127.0.0.1:8731/?code=… , čo sa"
          echo "nemá kde otvoriť – to je správne. Skopíruj tú adresu z adresného"
          echo "riadku celú a spusti tento workflow znova s ňou v políčku 'code'."
          {
            echo "## Prihlás sa na Drive"
            echo
            echo "1. Otvor **[tento odkaz]($URL)** a prihlás sa účtom, ktorý DMR 5.0 na Drive **vlastní**."
            echo "2. Neoverenú appku preklikaj cez „Advanced → Go to … (unsafe)“."
            echo "3. Prehliadač skončí na adrese \`http://127.0.0.1:8731/?code=…\`,"
            echo "   ktorú nemá kde otvoriť – **to je správne**. Skopíruj ju z adresného riadku celú."
            echo "4. Spusti tento workflow znova a tú adresu vlož do políčka \`code\`."
            echo
            echo "Kód v tej adrese platí pár minút a dá sa použiť raz."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Odkaz je v súhrne behu (Summary)."

      # bez práva zapísať secret by beh token vyrobil a nemal ho kam dať.
      # Nech to padne tu, kým je kód ešte použiteľný na ďalší pokus.
      - name: Skontroluj právo zapísať secret
        if: ${{ inputs.code != '' }}
        env:
          GH_TOKEN: ${{ secrets.DRIVE_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Chýba secret DRIVE_PAT. Bez práva zapísať secret by som token vyrobil a nemal ho kam dať – a vypísať ho nesmiem, lebo log tohto public repozitára vidí ktokoľvek. Rozpis, aký PAT treba, je v hlavičke .github/workflows/drive-login.yml."
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/secrets/public-key" >/dev/null
          echo "PAT vie so secrets tohto repozitára pracovať ✓"

      - name: Vymeň kód za refresh token
        if: ${{ inputs.code != '' }}
        env:
          # cez `env`, nie rozvinuté do príkazu: v tom, čo sa vloží do
          # formulára, môže byť čokoľvek a v `run:` by to bol kus shellu
          CODE: ${{ inputs.code }}
        run: |
          set -euo pipefail
          python3 workers/drive/auth.py --exchange \
            --code="$CODE" --out=refresh-token.txt

      - name: Zapíš ho do secretu
        id: save
        if: ${{ inputs.code != '' }}
        env:
          GH_TOKEN: ${{ secrets.DRIVE_PAT }}
          NAME: ${{ inputs.secret_name }}
        run: |
          set -euo pipefail
          # po stdine zo súboru – nie cez argument ani `echo`, nech sa hodnota
          # neocitne v `set -x` ani v zozname procesov
          gh secret set "$NAME" --repo "$GITHUB_REPOSITORY" < refresh-token.txt
          echo "Secret $NAME je nastavený ✓"

      # overenie tým istým kódom, ktorým sa prihlasuje celá pipeline. Token sa
      # podáva zo súboru – secret sa v už bežiacom behu ešte neprejaví.
      - name: Over, že tým účtom sa dá čítať
        if: ${{ inputs.code != '' }}
        env:
          DRIVE_REFRESH: ${{ secrets.DRIVE_REFRESH }}
        run: |
          set -euo pipefail
          DRIVE_REFRESH="$(cat refresh-token.txt)" \
            python3 workers/drive/dmr5.py --auth-check

      # a druhá polovica: cache sa na Drive ukladá, takže tam token musí vedieť
      # aj zapisovať. Readonly token vyzerá rovnako a rozdiel by sa ukázal až
      # tým, že sa cache prestane ukladať.
      - name: Over, že tým účtom sa dá aj zapisovať (cache)
        if: ${{ inputs.code != '' }}
        env:
          DRIVE_REFRESH: ${{ secrets.DRIVE_REFRESH }}
        run: |
          set -euo pipefail
          DRIVE_REFRESH="$(cat refresh-token.txt)" \
            python3 workers/drive/cache.py --check

      - name: Ukliď a povedz, čo ešte
        if: ${{ always() && inputs.code != '' }}
        run: |
          set -uo pipefail
          shred -u refresh-token.txt 2>/dev/null || rm -f refresh-token.txt
          # súhrn musí povedať pravdu o tom, či token niekde je
          {
            echo "## Čo ešte spraviť"
            echo
            if [ '${{ steps.save.outcome }}' = 'success' ]; then
              echo "Token je v secrete \`${{ inputs.secret_name }}\`; v logu tohto behu nikde neostal."
              echo
              echo "1. **Zmaž secret \`DRIVE_PAT\`** – už netreba a je to právo zapisovať secrets."
              echo "2. Skús \`Dáta · DMR 5.0\` v režime *len sonda*: krok"
              echo "   *Prihlásenie na Drive* má vypísať tvoj účet a pri oboch súboroch \`✓\`."
              echo "3. Kroky *Over…* vyššie hovoria, či ten účet vidí na priečinok s DMR 5.0"
              echo "   a či vie zapisovať do priečinka s cache. Bez zápisu sa cache neuloží"
              echo "   a build počíta všetko odznova – vtedy spusti toto prihlásenie znova."
            else
              echo "**Token sa neuložil** – secret \`${{ inputs.secret_name }}\` je taký, aký bol."
              echo "Dôvod je v logu vyššie. Kód od Googlu je jednorazový, tak"
              echo "prihlásenie treba spustiť odznova (beh bez \`code\`)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
