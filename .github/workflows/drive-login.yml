name: Maintenance · Drive sign-in

# Makes the Drive data owner's refresh token and stores it straight in a
# secret. Run once – afterwards only if the account revokes access.
#
# `workers/drive/auth.py --login` needs a browser and a loopback server on the
# same machine; this workflow splits the roles (the browser is a phone, the
# shell is the runner).
#
# The scope includes writing (`drive`, not `drive.readonly`): the build cache
# lives on Drive, so it must be writable.
#
# The token is never printed – the repository is public and a refresh token is
# access to the whole Drive. It goes into a 600 file and from there into a secret.
#
# `GITHUB_TOKEN` can't write secrets, so a temporary fine-grained PAT is needed
# in the `DRIVE_PAT` secret (Repository permissions: Secrets → Read and write).
# Delete it after a successful run.
#
# It also needs `DRIVE_CLIENT` (a repository VARIABLE, not a secret) and `DRIVE_SECRET`.
#
# How it goes: run without `code` → the summary has a link → open it on a phone
# and sign in with the account that owns DMR 5.0 → the browser ends on
# `http://127.0.0.1:8731/?code=…` with nothing to open (that's fine, that
# address is the whole point) → run again with the address in `code`.
# The code is valid for a few minutes and only once.

on:
  workflow_dispatch:
    inputs:
      code:
        description: "The ?code=… address from the browser (empty = give me a sign-in link)"
        required: false
        default: ""
        type: string
      secret_name:
        description: "Which secret to write the token to"
        required: false
        default: DRIVE_REFRESH
        type: string

permissions:
  contents: read

concurrency:
  # two runs at once would trade a one-time code
  group: drive-login
  cancel-in-progress: false

jobs:
  login:
    name: Drive owner's refresh token
    runs-on: ubuntu-latest
    env:
      DRIVE_CLIENT: ${{ vars.DRIVE_CLIENT }}
      DRIVE_SECRET: ${{ secrets.DRIVE_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # the first run ends here. The link goes to two places on purpose: GitHub's
      # mobile app shows no summaries, only the step log. Nothing in it is
      # secret – `client_id` is the OAuth client's public part.
      - name: Sign-in link
        if: ${{ inputs.code == '' }}
        run: |
          set -euo pipefail
          URL=$(python3 workers/drive/auth.py --auth-url)
          echo
          echo "Open this link in a browser (the whole single line):"
          echo
          echo "$URL"
          echo
          echo "Sign in with the account that OWNS DMR 5.0 on Drive and allow access."
          echo "The browser then ends on http://127.0.0.1:8731/?code=… , which has"
          echo "nothing to open – that's right. Copy the whole address from the address"
          echo "bar and run this workflow again with it in the 'code' field."
          {
            echo "## Sign in to Drive"
            echo
            echo "1. Open **[this link]($URL)** and sign in with the account that **owns** DMR 5.0 on Drive."
            echo "2. Click past the unverified app via “Advanced → Go to … (unsafe)”."
            echo "3. The browser ends on \`http://127.0.0.1:8731/?code=…\`,"
            echo "   which has nothing to open – **that's right**. Copy the whole address from the address bar."
            echo "4. Run this workflow again with that address in the \`code\` field."
            echo
            echo "The code in that address is valid for a few minutes and only once."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "The link is in the run summary (Summary)."

      # without the right to write a secret the run would make a token with nowhere
      # to put it; fail here while the code is still good for another try
      - name: Check the right to write a secret
        if: ${{ inputs.code != '' }}
        env:
          GH_TOKEN: ${{ secrets.DRIVE_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::The DRIVE_PAT secret is missing. Without the right to write a secret the token would have nowhere to go – and it mustn't be printed, since anyone can read this public repository's log. Which PAT is needed is in the .github/workflows/drive-login.yml header."
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/secrets/public-key" >/dev/null
          echo "The PAT can work with this repository's secrets ✓"

      - name: Exchange the code for a refresh token
        if: ${{ inputs.code != '' }}
        env:
          # through `env`, not expanded into the command: a form value can be
          # anything, and inside `run:` it would be shell
          CODE: ${{ inputs.code }}
        run: |
          set -euo pipefail
          python3 workers/drive/auth.py --exchange \
            --code="$CODE" --out=refresh-token.txt

      - name: Write it into the secret
        id: save
        if: ${{ inputs.code != '' }}
        env:
          GH_TOKEN: ${{ secrets.DRIVE_PAT }}
          NAME: ${{ inputs.secret_name }}
        run: |
          set -euo pipefail
          # on stdin from a file – not an argument or `echo`, so the value shows
          # neither in `set -x` nor in the process list
          gh secret set "$NAME" --repo "$GITHUB_REPOSITORY" < refresh-token.txt
          echo "Secret $NAME is set ✓"

      # checked by the same code the whole pipeline signs in with; the token comes
      # from the file – a secret doesn't show in a run already going
      - name: Check the account can read
        if: ${{ inputs.code != '' }}
        env:
          DRIVE_REFRESH: ${{ secrets.DRIVE_REFRESH }}
        run: |
          set -euo pipefail
          DRIVE_REFRESH="$(cat refresh-token.txt)" \
            python3 workers/drive/dmr5.py --auth-check

      # and the other half: the cache is saved on Drive, so the token must write
      # too; a readonly one looks the same until the cache stops being saved
      - name: Check the account can write too (cache)
        if: ${{ inputs.code != '' }}
        env:
          DRIVE_REFRESH: ${{ secrets.DRIVE_REFRESH }}
        run: |
          set -euo pipefail
          DRIVE_REFRESH="$(cat refresh-token.txt)" \
            python3 workers/drive/cache.py --check

      - name: Clean up and say what's left
        if: ${{ always() && inputs.code != '' }}
        run: |
          set -uo pipefail
          shred -u refresh-token.txt 2>/dev/null || rm -f refresh-token.txt
          # the summary must tell the truth about whether the token is anywhere
          {
            echo "## What's left to do"
            echo
            if [ '${{ steps.save.outcome }}' = 'success' ]; then
              echo "The token is in the \`${{ inputs.secret_name }}\` secret; nothing of it stayed in this run's log."
              echo
              echo "1. **Delete the \`DRIVE_PAT\` secret** – it's no longer needed and it can write secrets."
              echo "2. Try \`Data · DMR 5.0\` in *probe only* mode: the *Drive sign-in*"
              echo "   step should print your account and \`✓\` for both files."
              echo "3. The *Check…* steps above say whether the account sees the DMR 5.0 folder"
              echo "   and can write to the cache folder. Without writing the cache isn't saved"
              echo "   and the build recomputes everything – then run this sign-in again."
            else
              echo "**The token wasn't saved** – the \`${{ inputs.secret_name }}\` secret is as it was."
              echo "The reason is in the log above. Google's code is one-time, so"
              echo "start the sign-in again (a run without \`code\`)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
