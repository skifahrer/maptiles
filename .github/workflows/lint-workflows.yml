name: Check · workflow lint

# Catches errors GitHub won't even accept a workflow over – the run ends as
# “failure” with zero jobs and an empty log (e.g. more than 10 inputs).

on:
  push:
    paths:
      - ".github/workflows/**"
      - "workers/**"
      # the style too: `fill` over mixed geometry is a silent mistake
      - "poc/web/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "workers/**"
      - "poc/web/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: actionlint
        env:
          # shellcheck knows no `${{ }}` and raises false alarms; `bash -n`
          # below checks the real syntax. SC2153: it can't see the workflow `env:`
          SHELLCHECK_OPTS: "-e SC1083,SC1073,SC1072,SC1009,SC1089,SC1111,SC2129,SC2015,SC2153"
        run: |
          set -euo pipefail
          VER=1.7.7
          curl -sSL --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${VER}/actionlint_${VER}_linux_amd64.tar.gz" \
            | tar xz actionlint
          ./actionlint -color

      # the real syntax check: `${{ }}` is replaced by a stand-in
      - name: Syntax of run blocks
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, re, subprocess, sys, yaml
          bad = 0
          for path in sorted(glob.glob(".github/workflows/*.yml")):
              for job, jd in ((yaml.safe_load(open(path)) or {}).get("jobs") or {}).items():
                  for st in jd.get("steps") or []:
                      script = st.get("run")
                      if not script:
                          continue
                      clean = re.sub(r"\$\{\{[^}]*\}\}", "X", script)
                      p = subprocess.run(["bash", "-n"], input=clean, text=True,
                                         capture_output=True)
                      if p.returncode:
                          print(f"::error file={path}::{job} / {st.get('name')}: {p.stderr.strip()}")
                          bad += 1
          print(f"run blocks with broken syntax: {bad}")
          sys.exit(1 if bad else 0)
          PY

      # GitHub silently refuses a workflow over 128 KiB: a run without jobs.
      # A warning from 120 KiB – a big `run:` block belongs in `workers/`.
      - name: Size of workflow files
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, os, sys
          LIMIT = 128 * 1024
          WARN = 120 * 1024
          bad = 0
          for path in sorted(glob.glob(".github/workflows/*.yml")):
              n = os.path.getsize(path)
              if n > LIMIT:
                  print(f"::error file={path}::{n} B is over the cap of {LIMIT} B – "
                        f"GitHub won't accept such a file. Move a big `run:` block "
                        f"into workers/ and call it in one line.")
                  bad += 1
              elif n > WARN:
                  print(f"::warning file={path}::{n} B, the cap is {LIMIT} B "
                        f"({LIMIT - n} B left).")
              else:
                  print(f"{path}: {n} B ✓")
          sys.exit(1 if bad else 0)
          PY

      # GitHub refuses `}}` without `${{` in a shell script too; neither
      # actionlint nor the schema catch it (a nested `echo "${A:-${B:-}}"`)
      - name: Expression braces in run blocks
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, sys, yaml

          # the tokens are built, not written – or this file would hold the very error it seeks
          OPEN = "$" + "{" * 2
          CLOSE = "}" * 2

          def strip_exprs(s):
              """Drop whole expressions; return (the rest, an unclosed expression or None)."""
              out, i = [], 0
              while True:
                  j = s.find(OPEN, i)
                  if j < 0:
                      out.append(s[i:]); return "".join(out), None
                  out.append(s[i:j])
                  k, in_str = j + len(OPEN), False
                  while k < len(s):
                      # `format()` escapes doubled braces as text
                      if s[k] == "'":
                          in_str = not in_str; k += 1
                      elif not in_str and s.startswith(CLOSE, k):
                          k += len(CLOSE); break
                      else:
                          k += 1
                  else:
                      return "".join(out), s[j:j + 60]
                  i = k

          bad = 0
          for path in sorted(glob.glob(".github/workflows/*.yml")):
              for job, jd in ((yaml.safe_load(open(path)) or {}).get("jobs") or {}).items():
                  for st in jd.get("steps") or []:
                      s = st.get("run")
                      if not s:
                          continue
                      rest, unclosed = strip_exprs(s)
                      if unclosed:
                          print(f"::error file={path}::{job} / {st.get('name')}: "
                                f"unclosed expression: {unclosed}")
                          bad += 1
                          continue
                      for line in rest.split("\n"):
                          if CLOSE in line or OPEN in line:
                              print(f"::error file={path}::{job} / {st.get('name')}: "
                                    f"a doubled brace without an expression – GitHub "
                                    f"won't accept the file: {line.strip()[:100]}")
                              bad += 1
          print(f"run blocks with broken braces: {bad}")
          sys.exit(1 if bad else 0)
          PY

      # an input description is a one-line hint in the form; details go in a comment
      - name: Input descriptions are one line
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, sys, yaml
          LIMIT = 100
          bad = 0
          for path in sorted(glob.glob(".github/workflows/*.yml")):
              d = yaml.safe_load(open(path)) or {}
              on = d.get(True) or d.get("on") or {}
              for kind in ("workflow_dispatch", "workflow_call"):
                  for name, spec in ((on.get(kind) or {}) or {}).get("inputs", {}).items():
                      desc = (spec or {}).get("description") or ""
                      if "\n" in desc:
                          print(f"::error file={path}::input `{name}`: the description "
                                f"spans lines – the form glues it into one paragraph.")
                          bad += 1
                      elif len(desc) > LIMIT:
                          print(f"::error file={path}::input `{name}`: the description "
                                f"has {len(desc)} characters, the cap is {LIMIT}. In the "
                                f"form it is a hint under the field, not documentation – "
                                f"put details in a comment above the input.")
                          bad += 1
          print(f"inputs with too long a description: {bad}")
          sys.exit(1 if bad else 0)
          PY

      # choice options must be literal in YAML, so they're guarded, not generated
      - name: The range choice matches areas.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys, yaml
          d = yaml.safe_load(open(".github/workflows/build-map-region.yml"))
          on = d[[k for k in d if k is True or k == "on"][0]]
          opts = on["workflow_dispatch"]["inputs"]["area"]["options"]
          areas = [k for k in json.load(open("workers/data/areas.json"))
                   if not k.startswith("_")]
          want = ["whole_region"] + areas
          if opts != want:
              print("::error::The choice `area` in the workflow doesn't match workers/data/areas.json")
              print(f"  in the workflow: {opts}")
              print(f"  should be:       {want}")
              sys.exit(1)
          print(f"the range choice matches ({len(opts)} items)")
          PY

      # the same for the DMR 5.0 model workflow
      - name: The range choice in dmr5-drive.yml matches areas.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys, yaml
          areas = [k for k in json.load(open("workers/data/areas.json"))
                   if not k.startswith("_")]
          want = ["whole_country"] + areas
          bad = 0
          for path in (".github/workflows/dmr5-drive.yml",):
              d = yaml.safe_load(open(path))
              on = d[[k for k in d if k is True or k == "on"][0]]
              opts = on["workflow_dispatch"]["inputs"]["area"]["options"]
              if opts != want:
                  print(f"::error file={path}::The choice `area` doesn't match workers/data/areas.json")
                  print(f"  in the workflow: {opts}")
                  print(f"  should be:       {want}")
                  bad += 1
              else:
                  print(f"{path}: the range choice matches ({len(opts)} items)")
          sys.exit(1 if bad else 0)
          PY

      # the same for “Data · rocks from hillshading”; no “whole region” on purpose
      - name: The range choice in shading-rocks.yml matches areas.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys, yaml
          d = yaml.safe_load(open(".github/workflows/shading-rocks.yml"))
          on = d[[k for k in d if k is True or k == "on"][0]]
          opts = on["workflow_dispatch"]["inputs"]["area"]["options"]
          want = [k for k in json.load(open("workers/data/areas.json"))
                  if not k.startswith("_")]
          if opts != want:
              print("::error::The choice `area` in shading-rocks.yml doesn't match workers/data/areas.json")
              print(f"  in the workflow: {opts}")
              print(f"  should be:       {want}")
              sys.exit(1)
          print(f"the range choice in shading-rocks.yml matches ({len(opts)} items)")
          PY

      # which layer passes the cut-out key: `dmr5` switches shape by it, so
      # `workers/dem/check.sh` must assume what the layer does. Compared with
      # the argument count of `fetch.sh`: 5 = with the key, 4 = without.
      - name: Layers pass the cut-out key as the check expects
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, sys
          # a new call goes here and into `layer_area_key`; several candidates per layer
          CALLS = {
              ("workers/contours-rocks/build.sh",): ("contours", "rocks"),
              ("workers/terrain/build.sh",
               ".github/workflows/build-map-region.yml"): ("terrain",),
          }
          # layers check.sh claims pass no key
          src = open("workers/dem/check.sh").read()
          m = re.search(r"layer_area_key\(\)\s*\{(.*?)\n\}", src, re.S)
          if not m:
              print("::error file=workers/dem/check.sh::`layer_area_key` wasn't found")
              sys.exit(1)
          keyless = set(re.findall(r"^\s*([a-z|]+]?)\)\s*echo whole\s*;;",
                                   m.group(1), re.M))
          keyless = {v for entry in keyless for v in entry.strip(")").split("|")}

          bad = 0
          for paths, layers in CALLS.items():
              calls, path = [], paths[0]
              for cand in paths:
                  if not os.path.exists(cand):
                      continue
                  # comments out – these files write about `fetch.sh` themselves
                  txt = re.sub(r"^[ \t]*#.*$", "", open(cand).read(), flags=re.M)
                  # the call line with `\` continuations
                  found = [c for c in re.findall(
                      r"workers/dem/fetch\.sh((?:[^\n\\]|\\\n)*)", txt) if c.strip()]
                  if found:
                      calls, path = found, cand
                      break
              if not calls:
                  print(f"::error file={paths[0]}::no dem/fetch.sh call in any of "
                        f"{list(paths)} – layer {layers} downloads no DEM, or it "
                        f"moved elsewhere and must be added to CALLS.")
                  bad += 1
                  continue
              for call in calls:
                  nargs = len(call.replace("\\\n", " ").split())
                  passes = nargs >= 5   # bbox, folder, tsv, source, cut-out key
                  for layer in layers:
                      expects = layer not in keyless
                      if passes != expects:
                          print(f"::error file={path}::layer `{layer}` calls "
                                f"dem/fetch.sh with {nargs} arguments ("
                                f"{'passing' if passes else 'not passing'} the cut-out "
                                f"key), but workers/dem/check.sh assumes it is "
                                f"{'passing' if expects else 'not passing'} it. Align "
                                f"them – or the build checks one store and downloads "
                                f"from another (run 31307163093).")
                          bad += 1
          print(f"layers without a cut-out key per check.sh: "
                f"{sorted(keyless)}; mismatches: {bad}")
          sys.exit(1 if bad else 0)
          PY

      # the DMR 5.0 path must stay whole (`workers/lint/dmr5-pipeline.py`)
      - name: DMR 5.0 is refilled by its own pipeline
        run: python3 workers/lint/dmr5-pipeline.py

      # the Drive owner's token must reach every Drive read and cache write
      - name: The Drive owner's token reaches every Drive read
        run: python3 workers/lint/drive-token.py

      # three places name the stores; drifting, it fails after the work
      - name: Stores match what the pipeline knows
        run: python3 workers/lint/stores.py
      # the region outline is exact from OSM; stored layers carry it in their name
      - name: The region outline is exact and stored layers carry it
        run: python3 workers/lint/border-overlap.py
      # the cache belongs on Drive: GitHub's holds 10 GB and silently evicts
      - name: The cache is on Drive, not GitHub
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, os, sys, yaml

          CACHE = "./.github/actions/cache-"
          WORKER = "workers/drive/cache.py"
          bad = 0

          for path in sorted(glob.glob(".github/workflows/*.yml")):
              d = yaml.safe_load(open(path)) or {}
              for name, job in (d.get("jobs") or {}).items():
                  for st in (job or {}).get("steps") or []:
                      uses = str((st or {}).get("uses") or "")
                      if uses.split("@")[0] in ("actions/cache",
                                                "actions/cache/restore",
                                                "actions/cache/save"):
                          print(f"::error file={path}::step "
                                f"'{st.get('name', '?')}' in job '{name}' "
                                f"uses `{uses}`. GitHub's cache holds 10 GB per "
                                f"repository and silently evicts the oldest entries "
                                f"– use `{CACHE}restore` / `{CACHE}save`.")
                          bad += 1
                      # a local action without a file is a run without cache
                      if uses.startswith("./") and not os.path.exists(
                              os.path.join(uses[2:], "action.yml")):
                          print(f"::error file={path}::step "
                                f"'{st.get('name', '?')}' in job '{name}' calls "
                                f"`{uses}`, but {uses[2:]}/action.yml "
                                f"doesn't exist.")
                          bad += 1

          # a rebuild deletes the entry on Drive; the needle is built, or the check finds itself
          NEEDLE = "gh cache" + " delete"
          for path in sorted(glob.glob(".github/workflows/*.yml")):
              txt = open(path).read()
              if NEEDLE in txt:
                  print(f"::error file={path}::`{NEEDLE}` deletes the GitHub "
                        f"cache nobody uses any more. Delete the entry on "
                        f"Drive: `python3 {WORKER} --delete --key=…`.")
                  bad += 1

          # the other side: both actions exist and call this worker
          for way in ("restore", "save"):
              action = f".github/actions/cache-{way}/action.yml"
              if not os.path.exists(action):
                  print(f"::error::{action} is missing")
                  bad += 1
                  continue
              text = open(action).read()
              if WORKER not in text:
                  print(f"::error file={action}::doesn't call {WORKER}")
                  bad += 1
              d = yaml.safe_load(text) or {}
              if way == "restore":
                  # without them `steps.<id>.outputs.cache-hit` would be silently empty
                  for out in ("cache-hit", "cache-primary-key"):
                      if out not in (d.get("outputs") or {}):
                          print(f"::error file={action}::has no output `{out}`, "
                                f"which workflows refer to")
                          bad += 1
          print(f"cache on Drive: {bad} errors")
          sys.exit(1 if bad else 0)
          PY

      # only Drive is published to (`workers/lint/publishing.py`)
      - name: Publishing goes to Drive only, not releases or artifacts
        run: python3 workers/lint/publishing.py

      # the viewer goes to Pages whole: a 404 drops the whole module graph
      - name: "Viewer: everything it imports goes to Pages"
        run: python3 workers/lint/viewer.py

      # `curl … | grep -q` is a trap: EPIPE under `pipefail`
      - name: "Pipes: an early reader doesn't hang on a live writer"
        run: python3 workers/lint/pipes.py

      # three silent things in the finished style (`workers/lint/style.mjs`)
      - name: "Style: fills want areas, patterns stay with their base, roads keep order"
        run: node workers/lint/style.mjs

      # hillshading covers the map by slope; an opaque colour hides it past ~20°
      - name: "Hillshading doesn't cover the map below it"
        run: node workers/lint/hillshade.mjs

      # 3D terrain is one silent style line: missing = flat, wrong source = no style
      - name: 3D terrain is in the style and points at the height tiles
        run: node workers/lint/terrain3d.mjs

      # a run writes `maps.json`, so it drifts silently
      - name: The map catalog keeps its shape and nobody goes around it
        run: python3 workers/lint/catalog.py

      # CC BY and ODbL want the author with every map; the catalog carries it per package
      - name: Every package has its data authors
        run: python3 workers/lint/credits.py

      # “Build map state” is a form before a form – an input `relay.sh` doesn't pass on means defaults
      - name: The country batch builds what one region by hand does
        run: python3 workers/lint/state.py

      # “Regenerate state” also picks what to regenerate; a wrong choice shows after eight runs
      - name: The regeneration batch regenerates what it promises
        run: python3 workers/lint/regenerate.py

      # glyphs and viewer aren't packed; a map without glyphs doesn't crash, it has no letter
      - name: Glyphs and viewer are outside packages, yet somewhere
        run: python3 workers/lint/packaging.py

      # `rebuild` is the one “don't use the cache” lever
      - name: The `rebuild` choice recomputes what it promises
        run: python3 workers/lint/rebuild.py

      # job `features` reads the PBF twice (prefilter + schema); drifting, a class vanishes
      - name: The prefilter lets through everything the feature schema asks for
        run: python3 workers/lint/features.py

      # a trail strip is made in three places at once
      - name: "Trails: side, offset and attributes hold together"
        run: node workers/lint/trails.mjs

      # a mark image name is built from data; MapLibre skips an unknown one silently
      - name: "Trail marks: shape, colour pair and image name match"
        run: node workers/lint/marks.mjs

      # own icons count once baked into the sprite; `layout` off a symbol layer breaks the style
      - name: "Icons: own images and sets really reach the map"
        run: node workers/lint/icons.mjs

      # developer-mode overrides must pass `normalizeOverrides` whole
      - name: "Style overrides pass normalisation whole"
        run: node workers/lint/overrides.mjs

      # a shield stands on a stretched sprite image; each part fails silently
      - name: "Road shields: image, stretching and order"
        run: node workers/lint/shields.mjs

      # a network shield silently falls back to the classic one when not baked
      - name: "Network shields: image, stretching and fallback"
        run: node workers/lint/route-shields.mjs

      # “no terrain in this degree” is a lifelong answer; a sampled statistic mustn't say it
      - name: An empty degree is checked exactly and signed
        run: python3 workers/lint/dem-empty.py

      # the same a step on: a failed rock layer mustn't be cached as done
      - name: A failed rock computation isn't saved as a finished layer
        run: python3 workers/lint/rocks-empty.py

      # the zoom floor is written twice (schema makes, style draws)
      - name: "Style: contours and rocks share their floor in schema and style"
        run: python3 workers/lint/zoom-floor.py

      # rounded heights and `-r average` made the hillshade a regular fabric
      - name: Hillshading keeps the precision it depends on
        run: python3 workers/lint/terrain.py

      # `-dstnodata 0` turned missing data into sea level, a wall at the data edge
      - name: Hillshading makes no terrain where the model has none
        run: python3 workers/lint/terrain-nodata.py

      # the same a step earlier: the grid came from reading DMR 5.0 at a 1.25 ratio
      - name: "Height model: nobody picks resampling on their own"
        run: python3 workers/lint/dem-resampling.py

      # outlines are rounded by a limit curve on the tile grid, not Chaikin
      - name: "Outline rounding: every call knows its grid"
        run: python3 workers/lint/smoothing.py

      # the GeoJSON driver reprojects to WGS84; `-a_srs` over it turns metres to degrees
      - name: "GeoJSON output gets no SRS – metres would become degrees"
        run: python3 workers/lint/geojson-srs.py

      # a wrong layer name in the world map passes MapLibre silently; the check runs the style
      - name: "World map: the style draws what the schema makes"
        run: python3 workers/lint/world.py

      # engine costing ignores unknown keys silently – `top_speeed` routes anyway
      - name: "Navigation: a profile reaches the engine whole, or says so"
        run: python3 workers/lint/routing.py

      # a tag not in the dictionary never reaches the phone, and a switch does nothing
      - name: "Navigation: tag dictionary and routing tile body"
        run: python3 workers/lint/routing-tiles.py

      # a road-type switch shows the line as the map draws it
      - name: "Navigation: road types in the profile against style classes"
        run: node workers/lint/roadtypes.mjs

      # two areas under one `country`, cut PBF dead ends, no `admins.sqlite` – all silent
      - name: "Navigation: area, catalog node and the whole graph"
        run: python3 workers/lint/navigation.py

      # the road network can shrink silently; a value with a unit must not become a number
      - name: "Road network: filter, families, limits and `class`/`kind`"
        run: python3 workers/lint/transport.py

      # a boundary without a name is a line again; the prefilter must fetch relation members
      - name: "Boundaries: filter, relation members, name and every level"
        run: python3 workers/lint/boundaries.py

      # the sea goes as a line (`natural=coastline`), as an area it would end at the cut
      - name: "Water: filter, relation members, name and the coast as a line"
        run: python3 workers/lint/water.py

      # one object in one theme; a dropped prefilter line empties a theme quietly
      - name: "Army and history: filter, relation members, every geometry"
        run: python3 workers/lint/history.py

      # rail routing may ride only what the package draws
      - name: "Railways and cable cars: filter, promised classes and track network"
        run: python3 workers/lint/rail.py

      # the app lights a track from switch to switch by its section
      - name: "Railway sections: cut only at a switch onto the same kind of track"
        run: python3 workers/lint/rail-sections.py

      - name: "Settlements: filter, floor area and a name on the building"
        run: python3 workers/lint/buildings.py

      # the region PBF source (`workers/lint/pbf-source.py`)
      - name: The region PBF comes straight from osm.fr
        run: python3 workers/lint/pbf-source.py

      # `actions/setup-java` is an action, so it stands by every job
      - name: Whoever runs Planetiler has the Java it runs on
        run: python3 workers/lint/planetiler.py

      # the Drive shim must bear parallel gdalwarps and GDAL recover from a lost connection
      - name: The Drive shim bears the load and GDAL retries
        run: python3 workers/lint/drive-shim.py
      # dashed workers load through `importlib`, so a deleted name fails only on the runner
      - name: Names a worker reads do exist
        run: python3 workers/lint/names.py
      # the three source choices match `dem-sources.json` and its `for`
      - name: Height choices match dem-sources.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys, yaml
          d = yaml.safe_load(open(".github/workflows/build-map-region.yml"))
          on = d[[k for k in d if k is True or k == "on"][0]]
          inputs = on["workflow_dispatch"]["inputs"]
          srcs = {k: v.get("for", [])
                  for k, v in json.load(open("workers/data/dem-sources.json")).items()
                  if not k.startswith("_")}
          # (input, which layers, what the choice holds beside models)
          want = {
              "contour_source": ("contours", []),
              # rocks also have finished polygons from hillshading
              "rock_source": ("rocks", ["shading"]),
              "shading_source": ("shading", []),
          }
          bad = 0
          for name, (layer, extra) in want.items():
              opts = inputs[name]["options"]
              expect = [k for k, f in srcs.items() if layer in f] + extra + ["none"]
              if sorted(opts) != sorted(expect):
                  print(f"::error::The choice `{name}` doesn't match workers/data/dem-sources.json")
                  print(f"  in the workflow: {opts}")
                  print(f"  should be:       {expect}")
                  bad += 1
                  continue
              print(f"{name}: {len(opts)} choices ✓")
          # `none` is the value turning a layer off
          sys.exit(1 if bad else 0)
          PY

      # a script in `workers/` must get the env it reads, or runs on empty strings
      - name: Scripts in workers get their env
        run: python3 workers/lint/worker-env.py

      # a folder is a job, a file a step; before the path checks, which went green on empty lists
      - name: Workers lie in their job's folder
        run: python3 workers/lint/layout.py

      # paths built at run time (`$HERE/…`) too – `bash -n` sees syntax, not paths
      - name: Paths between workers point at existing files
        run: python3 workers/lint/worker-paths.py

      # a folder listing resolves shortcuts, not skips them; tried over a mock
      - name: Drive shortcuts resolve to their target
        run: python3 workers/lint/drive-shortcuts.py
      # actionlint doesn't check `needs.X.outputs.Y` exists; a missing one is an empty string
      - name: References between jobs
        run: python3 workers/lint/job-refs.py

      # 800 lines: an error for workers, a warning for workflows (a job graph);
      # last in the job on purpose, a failure skips everything after it
      - name: Files under 801 lines
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, sys
          LIMIT = 800
          bad = 0
          for pattern, hard in ((".github/workflows/*.yml", False),
                                 ("workers/**/*.py", True),
                                 ("workers/**/*.sh", True),
                                 ("workers/**/*.mjs", True)):
              for path in sorted(glob.glob(pattern, recursive=True)):
                  with open(path, encoding="utf-8") as f:
                      n = sum(1 for _ in f)
                  if n <= LIMIT:
                      print(f"{path}: {n} lines ✓")
                  elif hard:
                      print(f"::error file={path}::{n} lines, the cap is "
                            f"{LIMIT}. Split it into more modules – in one long "
                            f"file what changed or why it failed can't be found fast.")
                      bad += 1
                  else:
                      print(f"::warning file={path}::{n} lines (for workflows the "
                            f"cap is advice – a job graph can't split without "
                            f"writing input lists twice). The hard cap is 128 KiB, "
                            f"guarded by “Size of workflow files”.")
          sys.exit(1 if bad else 0)
          PY
