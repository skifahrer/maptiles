name: Kontrola · lint workflowov

# Chytá chyby, po ktorých GitHub workflow ani neprijme – beh skončí ako
# „failure" s nula jobmi a v logu nie je nič (napr. viac než 10 inputov).

on:
  push:
    paths:
      - ".github/workflows/**"
      - "workers/**"
      # aj štýl: `fill` nad zmiešanou geometriou je tichý omyl
      - "poc/web/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "workers/**"
      - "poc/web/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: actionlint
        env:
          # shellcheck nevie o `${{ }}` a hlási falošné poplachy; skutočnú
          # syntax kontroluje `bash -n` nižšie. SC2153 preto, že nevidí `env:`
          # workflowu – do skriptov ich chodí pätnásť.
          SHELLCHECK_OPTS: "-e SC1083,SC1073,SC1072,SC1009,SC1089,SC1111,SC2129,SC2015,SC2153"
        run: |
          set -euo pipefail
          VER=1.7.7
          curl -sSL --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${VER}/actionlint_${VER}_linux_amd64.tar.gz" \
            | tar xz actionlint
          ./actionlint -color

      # skutočná kontrola syntaxe: `${{ }}` sa nahradí zástupným textom
      - name: Syntax run blokov
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, re, subprocess, sys, yaml
          bad = 0
          for path in sorted(glob.glob(".github/workflows/*.yml")):
              for job, jd in ((yaml.safe_load(open(path)) or {}).get("jobs") or {}).items():
                  for st in jd.get("steps") or []:
                      script = st.get("run")
                      if not script:
                          continue
                      clean = re.sub(r"\$\{\{[^}]*\}\}", "X", script)
                      p = subprocess.run(["bash", "-n"], input=clean, text=True,
                                         capture_output=True)
                      if p.returncode:
                          print(f"::error file={path}::{job} / {st.get('name')}: {p.stderr.strip()}")
                          bad += 1
          print(f"run blokov s chybnou syntaxou: {bad}")
          sys.exit(1 if bad else 0)
          PY

      # workflow nad 128 KiB GitHub neprijme a nepovie to: vznikne beh bez
      # jobov s červeným krížikom. Varovanie už od 120 KiB – veľký `run:` blok
      # patrí do `workers/`.
      - name: Veľkosť súborov workflowov
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, os, sys
          LIMIT = 128 * 1024
          WARN = 120 * 1024
          bad = 0
          for path in sorted(glob.glob(".github/workflows/*.yml")):
              n = os.path.getsize(path)
              if n > LIMIT:
                  print(f"::error file={path}::{n} B je nad stropom {LIMIT} B – "
                        f"GitHub taký súbor neprijme. Presuň veľký `run:` blok "
                        f"do workers/ a volaj ho jedným riadkom.")
                  bad += 1
              elif n > WARN:
                  print(f"::warning file={path}::{n} B, strop je {LIMIT} B "
                        f"(ostáva {LIMIT - n} B).")
              else:
                  print(f"{path}: {n} B ✓")
          sys.exit(1 if bad else 0)
          PY

      # `}}` v shellovom skripte bez `${{` pred ním GitHub tiež neprijme, a to
      # ani actionlint, ani JSON schéma nezachytia. Vyrobí to vnorená expanzia
      # (`echo "${A:-${B:-}}"`). `${{ … }}` sa vyhodí a čo z `}}` ostane, je chyba.
      - name: Zátvorky výrazov v run blokoch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, sys, yaml

          # tokeny sa skladajú, nepíšu – inak by mal tento súbor presne tú
          # chybu, ktorú hľadá
          OPEN = "$" + "{" * 2
          CLOSE = "}" * 2

          def strip_exprs(s):
              """Vyhodí celé výrazy; vráti (zvyšok, neuzavretý výraz alebo None)."""
              out, i = [], 0
              while True:
                  j = s.find(OPEN, i)
                  if j < 0:
                      out.append(s[i:]); return "".join(out), None
                  out.append(s[i:j])
                  k, in_str = j + len(OPEN), False
                  while k < len(s):
                      # `format()` si zdvojené zátvorky escapuje ako text
                      if s[k] == "'":
                          in_str = not in_str; k += 1
                      elif not in_str and s.startswith(CLOSE, k):
                          k += len(CLOSE); break
                      else:
                          k += 1
                  else:
                      return "".join(out), s[j:j + 60]
                  i = k

          bad = 0
          for path in sorted(glob.glob(".github/workflows/*.yml")):
              for job, jd in ((yaml.safe_load(open(path)) or {}).get("jobs") or {}).items():
                  for st in jd.get("steps") or []:
                      s = st.get("run")
                      if not s:
                          continue
                      rest, unclosed = strip_exprs(s)
                      if unclosed:
                          print(f"::error file={path}::{job} / {st.get('name')}: "
                                f"neuzavretý výraz: {unclosed}")
                          bad += 1
                          continue
                      for line in rest.split("\n"):
                          if CLOSE in line or OPEN in line:
                              print(f"::error file={path}::{job} / {st.get('name')}: "
                                    f"zdvojená zátvorka bez výrazu – GitHub taký "
                                    f"súbor neprijme: {line.strip()[:100]}")
                              bad += 1
          print(f"run blokov so zlomenými zátvorkami: {bad}")
          sys.exit(1 if bad else 0)
          PY

      # popis inputu je vo formulári jednoriadková nápoveda; odsek z neho
      # spraví nečitateľný formulár. Detail patrí do komentára nad input.
      - name: Popisy inputov sú jednoriadkové
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, sys, yaml
          LIMIT = 100
          bad = 0
          for path in sorted(glob.glob(".github/workflows/*.yml")):
              d = yaml.safe_load(open(path)) or {}
              on = d.get(True) or d.get("on") or {}
              for kind in ("workflow_dispatch", "workflow_call"):
                  for name, spec in ((on.get(kind) or {}) or {}).get("inputs", {}).items():
                      desc = (spec or {}).get("description") or ""
                      if "\n" in desc:
                          print(f"::error file={path}::input `{name}`: popis je "
                                f"viacriadkový – formulár ho zlepí do jedného odseku.")
                          bad += 1
                      elif len(desc) > LIMIT:
                          print(f"::error file={path}::input `{name}`: popis má "
                                f"{len(desc)} znakov, strop je {LIMIT}. Vo formulári "
                                f"je to nápoveda pod poľom, nie dokumentácia – "
                                f"detail daj do komentára nad input.")
                          bad += 1
          print(f"inputov s pridlhým popisom: {bad}")
          sys.exit(1 if bad else 0)
          PY

      # choice options musia byť v YAML doslovne, takže sa nedajú generovať –
      # ale dá sa strážiť, aby zoznam nezostarol
      - name: Výber pohorí sedí s areas.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys, yaml
          d = yaml.safe_load(open(".github/workflows/build-map-region.yml"))
          on = d[[k for k in d if k is True or k == "on"][0]]
          opts = on["workflow_dispatch"]["inputs"]["area"]["options"]
          areas = [k for k in json.load(open("workers/data/areas.json"))
                   if not k.startswith("_")]
          want = ["cely_region"] + areas
          if opts != want:
              print("::error::Výber `area` vo workflowe nesedí s workers/data/areas.json")
              print(f"  vo workflowe: {opts}")
              print(f"  malo by byť:  {want}")
              sys.exit(1)
          print(f"výber pohorí sedí ({len(opts)} položiek)")
          PY

      # to isté pre workflow, čo robí model z DMR 5.0: keby sa zoznamy rozišli,
      # dal by sa vyrobiť model pre pohorie, ktoré si build nevie vypýtať
      - name: Výber pohorí v dmr5-drive.yml sedí s areas.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys, yaml
          areas = [k for k in json.load(open("workers/data/areas.json"))
                   if not k.startswith("_")]
          want = ["cele_slovensko"] + areas
          bad = 0
          for path in (".github/workflows/dmr5-drive.yml",):
              d = yaml.safe_load(open(path))
              on = d[[k for k in d if k is True or k == "on"][0]]
              opts = on["workflow_dispatch"]["inputs"]["area"]["options"]
              if opts != want:
                  print(f"::error file={path}::Výber `area` nesedí s workers/data/areas.json")
                  print(f"  vo workflowe: {opts}")
                  print(f"  malo by byť:  {want}")
                  bad += 1
              else:
                  print(f"{path}: výber pohorí sedí ({len(opts)} položiek)")
          sys.exit(1 if bad else 0)
          PY

      # to isté pre „Dáta · tieňované skaly". „Celý región" tu chýba zámerne:
      # bez výrezu nie je čo sťahovať.
      - name: Výber pohorí v shading-rocks.yml sedí s areas.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys, yaml
          d = yaml.safe_load(open(".github/workflows/shading-rocks.yml"))
          on = d[[k for k in d if k is True or k == "on"][0]]
          opts = on["workflow_dispatch"]["inputs"]["area"]["options"]
          want = [k for k in json.load(open("workers/data/areas.json"))
                  if not k.startswith("_")]
          if opts != want:
              print("::error::Výber `area` v shading-rocks.yml nesedí s workers/data/areas.json")
              print(f"  vo workflowe: {opts}")
              print(f"  malo by byť:  {want}")
              sys.exit(1)
          print(f"výber pohorí v shading-rocks.yml sedí ({len(opts)} položiek)")
          PY

      # ktorá vrstva podáva kľúč výrezu: `dmr5` má dve podoby a prepína medzi
      # nimi práve ten kľúč, takže kontrola v `workers/dem/check.sh` musí
      # predpokladať presne to, čo vrstva robí – inak build kontroluje jeden
      # sklad a sťahuje z druhého. Porovnáva sa s počtom argumentov volania
      # `fetch-dem.sh`: 5 = s kľúčom výrezu, 4 = bez neho.
      - name: Vrstvy podávajú kľúč výrezu tak, ako to čaká kontrola
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, sys
          # keď pribudne volanie, pridaj ho sem aj do `layer_area_key`.
          # Každá vrstva sa hľadá vo viacerých kandidátoch – `run:` bloky sa
          # sťahujú do workers/ a presun by kontrolu inak umlčal.
          CALLS = {
              ("workers/contours-rocks/build.sh",): ("contours", "rocks"),
              ("workers/terrain/build.sh",
               ".github/workflows/build-map-region.yml"): ("terrain",),
          }
          # vrstvy, o ktorých check.sh tvrdí, že kľúč nepodávajú
          src = open("workers/dem/check.sh").read()
          m = re.search(r"layer_area_key\(\)\s*\{(.*?)\n\}", src, re.S)
          if not m:
              print("::error file=workers/dem/check.sh::`layer_area_key` sa nenašla")
              sys.exit(1)
          bez_kluca = set(re.findall(r"^\s*([a-z|]+]?)\)\s*echo cely\s*;;",
                                     m.group(1), re.M))
          bez_kluca = {v for entry in bez_kluca for v in entry.strip(")").split("|")}

          bad = 0
          for paths, layers in CALLS.items():
              calls, path = [], paths[0]
              for cand in paths:
                  if not os.path.exists(cand):
                      continue
                  # komentáre preč – tieto súbory samy o `fetch-dem.sh` píšu
                  txt = re.sub(r"^[ \t]*#.*$", "", open(cand).read(), flags=re.M)
                  # riadok s volaním aj s pokračovaním cez `\`
                  found = [c for c in re.findall(
                      r"workers/dem/fetch\.sh((?:[^\n\\]|\\\n)*)", txt) if c.strip()]
                  if found:
                      calls, path = found, cand
                      break
              if not calls:
                  print(f"::error file={paths[0]}::volanie dem/fetch.sh sa "
                        f"nenašlo ani v jednom z {list(paths)} – vrstva "
                        f"{layers} si DEM nesťahuje, alebo sa presunula inam "
                        f"a treba ju dopísať do CALLS.")
                  bad += 1
                  continue
              for call in calls:
                  nargs = len(call.replace("\\\n", " ").split())
                  poda = nargs >= 5   # bbox, adresár, tsv, zdroj, kľúč výrezu
                  for layer in layers:
                      caka = layer not in bez_kluca
                      if poda != caka:
                          print(f"::error file={path}::vrstva `{layer}` volá "
                                f"dem/fetch.sh s {nargs} argumentmi (kľúč výrezu "
                                f"{'podáva' if poda else 'nepodáva'}), ale "
                                f"workers/dem/check.sh o nej predpokladá, že ho "
                                f"{'podáva' if caka else 'nepodáva'}. Zosúlaď to – "
                                f"inak build kontroluje jeden release a sťahuje "
                                f"z druhého (beh 31307163093).")
                          bad += 1
          print(f"vrstiev bez kľúča výrezu podľa check-dem.sh: "
                f"{sorted(bez_kluca)}; nesúladov: {bad}")
          sys.exit(1 if bad else 0)
          PY

      # cesta k DMR 5.0 musí ostať celá; kým tam bol rozcestník, doplnenie bolo
      # tiché nič. Rozpis: `workers/lint/dmr5-pipeline.py`.
      - name: DMR 5.0 sa dopĺňa vlastnou pipeline
        run: python3 workers/lint/dmr5-pipeline.py

      # token vlastníka Drive musí prísť všade, kde sa z Drive číta alebo do
      # cache zapisuje – bez neho nič nespadne, len sa počíta hodiny odznova
      - name: Token vlastníka Drive sa dostane všade, kde sa z Drive číta
        run: python3 workers/lint/drive-token.py

      # „ktoré sklady existujú" hovoria tri miesta a keď sa rozídu, padne to
      # až po práci – na poslednom kroku, nahratí do skladu
      - name: Sklady sedia s tým, čo pipeline pozná
        run: python3 workers/lint/stores.py
      # hranica regiónu je presná z OSM a už sa nenafukuje; uložené vrstvy to
      # musia niesť v mene, inak sklad vráti vrstvu orezanú po starom
      - name: Hranica regiónu je presná a uložené vrstvy ju nesú
        run: python3 workers/lint/border-overlap.py
      # cache patrí na Drive: GitHubová má na repozitár 10 GB a keď sa naplní,
      # ticho vyhodí najstaršie záznamy – a poznať to len na tom, že build
      # zase trvá dlho
      - name: Cache je na Drive, nie v GitHube
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, os, sys, yaml

          CACHE = "./.github/actions/cache-"
          WORKER = "workers/drive/cache.py"
          bad = 0

          for path in sorted(glob.glob(".github/workflows/*.yml")):
              d = yaml.safe_load(open(path)) or {}
              for name, job in (d.get("jobs") or {}).items():
                  for st in (job or {}).get("steps") or []:
                      uses = str((st or {}).get("uses") or "")
                      if uses.split("@")[0] in ("actions/cache",
                                                "actions/cache/restore",
                                                "actions/cache/save"):
                          print(f"::error file={path}::krok "
                                f"'{st.get('name', '?')}' v jobe '{name}' "
                                f"používa `{uses}`. GitHubová cache má na "
                                f"repozitár 10 GB a pri naplnení ticho vyhadzuje "
                                f"najstaršie záznamy – použi "
                                f"`{CACHE}restore` / `{CACHE}save`.")
                          bad += 1
                      # lokálna akcia bez súboru je beh bez cache
                      if uses.startswith("./") and not os.path.exists(
                              os.path.join(uses[2:], "action.yml")):
                          print(f"::error file={path}::krok "
                                f"'{st.get('name', '?')}' v jobe '{name}' volá "
                                f"`{uses}`, ale {uses[2:]}/action.yml "
                                f"neexistuje.")
                          bad += 1

          # pri pregenerovaní treba zmazať záznam na Drive, nie v GitHube.
          # Hľadaný príkaz sa skladá, nepíše – inak by kontrola našla samu seba.
          NEEDLE = "gh cache" + " delete"
          for path in sorted(glob.glob(".github/workflows/*.yml")):
              txt = open(path).read()
              if NEEDLE in txt:
                  print(f"::error file={path}::`{NEEDLE}` maže GitHub "
                        f"cache, ktorú už nikto nepoužíva. Zmaž záznam na "
                        f"Drive: `python3 {WORKER} --delete --key=…`.")
                  bad += 1

          # druhá strana: obe akcie musia existovať a volať tento worker
          for smer in ("restore", "save"):
              akcia = f".github/actions/cache-{smer}/action.yml"
              if not os.path.exists(akcia):
                  print(f"::error::chýba {akcia}")
                  bad += 1
                  continue
              text = open(akcia).read()
              if WORKER not in text:
                  print(f"::error file={akcia}::nevolá {WORKER}")
                  bad += 1
              d = yaml.safe_load(text) or {}
              if smer == "restore":
                  # bez nich by `steps.<id>.outputs.cache-hit` bolo ticho prázdne
                  for out in ("cache-hit", "cache-primary-key"):
                      if out not in (d.get("outputs") or {}):
                          print(f"::error file={akcia}::nemá výstup `{out}`, "
                                f"na ktorý sa workflowy odkazujú")
                          bad += 1
          print(f"cache na Drive: {bad} chýb")
          sys.exit(1 if bad else 0)
          PY

      # publikuje sa len na Drive: do GitHubu nesmie ísť ani release, ani
      # artefakt, ktorý má prežiť beh. Rozpis je vo `workers/lint/publishing.py`.
      - name: Publikuje sa len na Drive, nie do releasov a artefaktov
        run: python3 workers/lint/publishing.py

      # viewer musí ísť na Pages celý: prehliadač na 404 zahodí celý modulový
      # graf a ostane biela plocha, kým build aj smoke test sú zelené
      - name: "Viewer: na Pages ide všetko, čo si importuje"
        run: python3 workers/lint/viewer.py

      # `curl … | grep -q` je pasca: `grep -q` zavrie rúru, producent dostane
      # EPIPE a `pipefail` z toho spraví pád, hoci sa zhoda našla
      - name: "Rúry: predčasný čitateľ nevisí na živom producentovi"
        run: python3 workers/lint/pipes.py

      # tri tiché veci v hotovom štýle (rozpis vo `workers/lint/style.mjs`):
      # `fill` nad zmiešanou geometriou (MapLibre z čiary earcutom vyrobí
      # nezmysel), vzor ako vlastná vrstva (profil ju musí vypnúť s predlohou)
      # a poradie ciest (navrchu je posledná, takže účelová kreslila cez diaľnicu)
      - name: "Štýl: výplne chcú plochy, vzory držia s predlohou, cesty poradie"
        run: node workers/lint/style.mjs

      # tieňovanie mapu prekrýva krytím podľa sklonu, takže s nepriehľadnou
      # farbou nad ~20° mapu nevidno. Štýl je pri tom platný a nikto nepovie nič.
      - name: "Tieňovanie reliéfu neprekryje mapu pod sebou"
        run: node workers/lint/hillshade.mjs

      # výškový model má dve použitia: tieňovanie a 3D terén. To druhé je jediný
      # riadok v štýle a všetko na ňom je ticho – keď chýba, klient nakreslí
      # plochú mapu; keď ukazuje na zdroj, čo v štýle nie je, MapLibre odmietne
      # celý štýl.
      - name: 3D terén je v štýle a ukazuje na výškové dlaždice
        run: node workers/lint/terrain3d.mjs

      # `maps.json` dopisuje beh, takže sa rozíde ticho: mená prestanú sedieť
      # s balíkmi, alebo sa katalóg zapíše aj po neúspešnom nahratí
      - name: Katalóg máp drží tvar a nikto ho neobchádza
        run: python3 workers/lint/catalog.py

      # dávka „Build map state" je formulár pred formulárom – vstup, ktorý
      # `relay.sh` nepodá ďalej, znamená celú krajinu s predvolenými hodnotami
      - name: Dávka krajiny stavia to isté, čo jeden kraj ručne
        run: python3 workers/lint/state.py

      # dávka „Regenerate state" si navyše vyberá, čo sa má pregenerovať;
      # zlá voľba sa inak zistí až po tom, čo spustila osem behov
      - name: Dávka pregenerovania pregeneruje to, čo sľubuje
        run: python3 workers/lint/regenerate.py

      # glyfy ani viewer sa do balíkov nebalia; mapa bez glyfov nespadne,
      # len nemá jediné písmeno
      - name: Glyfy a viewer sú mimo balíka, ale majú kde byť
        run: python3 workers/lint/packaging.py

      # `rebuild` je jediná páka na „cache nepoužívaj"; keď sľúbi vrstvu a tá
      # sa aj tak vráti z cache, beh je zelený a výsledok starý
      - name: Výber `rebuild` prepočíta to, čo sľubuje
        run: python3 workers/lint/rebuild.py

      # job `features` číta PBF dvakrát (predfilter + schéma) – keď sa rozídu,
      # Planetiler vyrobí dlaždice, v ktorých tá trieda nie je
      - name: Predfilter pustí všetko, čo si schéma prvkov vyžiada
        run: python3 workers/lint/features.py

      # pásik trasy sa skladá z troch miest naraz; keď sa dve rozídu, nič
      # nespadne – len sú pásiky odlepené alebo na zlej strane
      - name: "Trasy: strana, odstup a atribúty držia spolu"
        run: node workers/lint/trails.mjs

      # meno obrázka značky sa skladá až z dát; keď sa tie tri rozídu,
      # MapLibre neznámy obrázok ticho preskočí
      - name: "Značky trás: tvar, dvojica farieb a meno obrázka sedia"
        run: node workers/lint/marks.mjs

      # vlastná ikona a sada sú platné až vtedy, keď ich pipeline dopečie do
      # spritu; `layout` na inej než symbolovej vrstve zhodí celý štýl
      - name: "Ikony: vlastné obrázky a sady sa naozaj dostanú do mapy"
        run: node workers/lint/icons.mjs

      # úpravy z developer módu musia prejsť `normalizeOverrides` celé – inak
      # platia v prehliadači a na Pages nie (nulová hrúbka, kopírovanie štýlu,
      # zabudnutý kľúč pri zápise, prerušovanie zo štýlu)
      - name: "Úpravy štýlu prejdú normalizáciou celé"
        run: node workers/lint/overrides.mjs

      # štítok stojí na rozťahovanom obrázku zo spritu: premenovaný obrázok,
      # stratené `stretchX`/`content` aj poradie za `road-name` sú tiché chyby
      - name: "Štítky ciest: obrázok, rozťahovanie a poradie"
        run: node workers/lint/shields.mjs

      # „v tomto stupni terén nie je" je doživotná odpoveď – keď ju vysloví
      # vzorkovaná štatistika, je beh zelený a v mape chýba pol kraja
      - name: Prázdny stupeň sa overuje presne a podpisuje sa
        run: python3 workers/lint/dem-empty.py

      # dno zoomu je napísané dvakrát (schéma vyrába, štýl kreslí); keď sa
      # rozídu, platíme dlaždice, ktoré nikto nevidí, alebo je v mape diera
      - name: "Štýl: vrstevnice a skaly majú v schéme a v štýle to isté dno"
        run: python3 workers/lint/zoom-floor.py

      # zaokrúhlená výška a `-r average` pri zväčšovaní DEM spravili z hillshadu
      # pravidelnú tkaninu cez celú mapu – a nič nespadlo
      - name: Tieňovanie nestráca presnosť, ktorou stojí a padá
        run: python3 workers/lint/terrain.py

      # čo sa zapíše tam, kde model dáta nemá: `-dstnodata 0` z toho spravilo
      # hladinu mora, takže na hranici dát stála stena
      - name: Tieňovanie nevyrába terén tam, kde model nie je
        run: python3 workers/lint/terrain-nodata.py

      # a to isté o krok skôr, v modeli: mriežka vznikala už pri čítaní DMR 5.0
      # z Drive (`-r average` pri pomere 1,25). Vrstevnice sa trasujú z toho
      # istého modelu, takže boli zubaté s tým istým rastrom.
      - name: "Výškový model: resampling si nikto nevyberá sám"
        run: python3 workers/lint/dem-resampling.py

      # dva prechody Chaikina z rohu spravia menší roh, nie oblúk – a keďže
      # rohy ostanú tam, kde ich nechal Douglas–Peucker, sú pravidelné.
      # Odvtedy sa zaobľuje limitnou krivkou podľa mriežky dlaždice.
      - name: "Zaoblenie obrysu: každé volanie vie svoju mriežku"
        run: python3 workers/lint/smoothing.py

      # ovládač GeoJSON prepočítava do WGS84 vždy, keď vrstva vie, v čom je –
      # `-a_srs EPSG:3035` nad takým výstupom metre zmení na stupne a ogr2ogr
      # pri tom skončí úspechom
      - name: "GeoJSON výstup nedostane SRS – metre by z neho boli stupne"
        run: python3 workers/lint/geojson-srs.py

      # pri mape sveta sa dá pomýliť aj v mene vrstvy a MapLibre nepovie nič.
      # Kontrola štýl aj spustí, nech sa chyba nájde tu.
      - name: "Mapa sveta: štýl kreslí to, čo schéma vyrába"
        run: python3 workers/lint/world.py

      # costing motora je slovník a neznámy kľúč sa v ňom ticho ignoruje –
      # `top_speeed` vráti platnú trasu, len nie tú, ktorú si človek vypýtal
      - name: "Navigácia: profil prejde do motora celý, alebo o sebe povie"
        run: python3 workers/lint/routing.py

      # dva rozsahy pod jedným `country` si položku v katalógu prepíšu, rezaný
      # PBF má na hranici slepé ulice, bez `admins.sqlite` nefunguje prechod
      # hranice – a nič z toho nespadne
      - name: "Navigácia: rozsah, uzol v katalógu a celý graf"
        run: python3 workers/lint/navigation.py

      # dopravnú sieť sa dá okliešniť potichu: balík sa volá rovnako a váži
      # menej. Sú v nej aj obmedzenia na ceste – keď odtiaľto vypadnú, nie sú
      # nikde. Hodnota s jednotkou sa nesmie zmeniť na číslo: Planetiler vezme
      # číslo zo začiatku a jednotku zahodí.
      - name: "Dopravná sieť: filter, rodiny, obmedzenia a `class`/`druh`"
        run: python3 workers/lint/transport.py

      # hranica bez mena je zase len čiara a práve kvôli menu ten balík je.
      # Stojí na tom, že predfilter doťahuje členov relácií – bez `-R` je
      # vrstva prázdna pri zelenom behu.
      - name: "Hranice: filter, členovia relácií, meno a všetky úrovne"
        run: python3 workers/lint/boundaries.py

      # voda má v OpenMapTiles meno v inej vrstve než geometriu. More musí ísť
      # ako čiara (`natural=coastline`) – ako plocha by z rezaného PBF vzniklo
      # more končiace na hranici výrezu.
      - name: "Vodstvo: filter, členovia relácií, meno a pobrežie ako čiara"
        run: python3 workers/lint/water.py

      # kraj má na osm.fr vlastný súbor rezaný po jeho hranici, tak sa sťahuje
      # priamo ten – nie 373 MB Slovenska
      - name: PBF regiónu sa sťahuje priamo z osm.fr
        run: python3 workers/lint/pbf-source.py

      # `actions/setup-java` je akcia, takže sa do `workers/lib/planetiler.sh`
      # presunúť nedá a musí stáť pri každom jobe zvlášť
      - name: Kto púšťa Planetiler, má aj Javu, na ktorej sa spustí
        run: python3 workers/lint/planetiler.py

      # shim nad Drive musí zniesť nápor súbežných gdalwarpov a GDAL sa musí
      # vedieť spamätať z jedného stratného spojenia
      - name: Shim nad Drive znesie nápor a GDAL to skúsi znova
        run: python3 workers/lint/drive-shim.py
      # tri výbery zdroja musia sedieť s kľúčmi v `dem-sources.json` a s tým,
      # pre ktoré vrstvy sa zdroj ponúka (kľúč `for`)
      - name: Výbery výšok sedia s dem-sources.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys, yaml
          d = yaml.safe_load(open(".github/workflows/build-map-region.yml"))
          on = d[[k for k in d if k is True or k == "on"][0]]
          inputs = on["workflow_dispatch"]["inputs"]
          srcs = {k: v.get("for", [])
                  for k, v in json.load(open("workers/data/dem-sources.json")).items()
                  if not k.startswith("_")}
          # (input, ktoré vrstvy, čo je vo výbere navyše k modelom)
          want = {
              "contour_source": ("contours", []),
              # skaly majú okrem modelov ešte hotové polygóny z tieňovania
              "rock_source": ("rocks", ["tienovanie"]),
              "shading_source": ("shading", []),
          }
          bad = 0
          for name, (layer, extra) in want.items():
              opts = inputs[name]["options"]
              expect = [k for k, f in srcs.items() if layer in f] + extra + ["ziadne"]
              if sorted(opts) != sorted(expect):
                  print(f"::error::Výber `{name}` nesedí s workers/data/dem-sources.json")
                  print(f"  vo workflowe: {opts}")
                  print(f"  malo by byť:  {expect}")
                  bad += 1
                  continue
              print(f"{name}: {len(opts)} možností ✓")
          # `ziadne` je hodnota, ktorou sa vrstva vypína
          sys.exit(1 if bad else 0)
          PY

      # skript vo `workers/` musí od kroku dostať env, ktoré naozaj číta –
      # inak beží s prázdnym reťazcom a nespadne
      - name: Skripty vo workers dostávajú svoje env
        run: python3 workers/lint/worker-env.py

      # priečinok je job, súbor je krok. Ide to pred ostatné kontroly ciest:
      # pri presune do priečinkov prestali vzory `workers/*.sh` chytať čokoľvek
      # a kontroly zozelenali nad prázdnym zoznamom.
      - name: Workery ležia v priečinku podľa jobu
        run: python3 workers/lint/layout.py

      # aj cesta, ktorú si skript skladá až za behu (`$HERE/…`) – `bash -n`
      # vidí syntax, nie cesty
      - name: Cesty medzi workermi ukazujú na existujúce súbory
        run: python3 workers/lint/worker-paths.py

      # výpis priečinka musí rozuzliť skratky, nie ich preskočiť: skratka nemá
      # `size`, ale súbor za ňou je. Staticky sa to overiť nedá, tak sa
      # `listing` pustí nad napodobeninou.
      - name: Skratky na Drive sa rozuzľujú na cieľ
        run: python3 workers/lint/drive-shortcuts.py
      # actionlint nekontroluje, či `needs.X.outputs.Y` naozaj existuje.
      # Neexistujúci výstup nie je chyba behu – GitHub ho vyhodnotí ako prázdny
      # reťazec, takže `if:` vyjde nepravdivo a beh zazelená.
      - name: Odkazy medzi jobmi
        run: python3 workers/lint/job-refs.py

      # dĺžka súboru: strop 800 riadkov, pre workery chyba, pre workflowy
      # varovanie. Workflow je graf jobov a pod 800 sa nedá dostať inak než
      # rozrezaním na ďalšie `workflow_call` súbory – tam sa ale zoznam inputov
      # musí napísať dvakrát. Workflow naozaj zabije strop 128 KiB, ktorý stráži
      # kontrola vyššie; riadky sú tu ako varovanie, aby rast bolo vidieť.
      # Posledný v jobe zámerne: kým padal skôr, preskočili sa všetky za ním.
      - name: Súbory pod 801 riadkov
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, sys
          LIMIT = 800
          bad = 0
          for pattern, tvrdy in ((".github/workflows/*.yml", False),
                                 ("workers/**/*.py", True),
                                 ("workers/**/*.sh", True),
                                 ("workers/**/*.mjs", True)):
              for path in sorted(glob.glob(pattern, recursive=True)):
                  with open(path, encoding="utf-8") as f:
                      n = sum(1 for _ in f)
                  if n <= LIMIT:
                      print(f"{path}: {n} riadkov ✓")
                  elif tvrdy:
                      print(f"::error file={path}::{n} riadkov, strop je "
                            f"{LIMIT}. Rozdeľ na viac modulov (pravidlo 5 "
                            f"v CLAUDE.md) – v jednom dlhom súbore sa nedá "
                            f"rýchlo nájsť, čo sa zmenilo alebo prečo to "
                            f"spadlo.")
                      bad += 1
                  else:
                      print(f"::warning file={path}::{n} riadkov (strop pre "
                            f"workflowy je len odporúčanie – graf jobov sa "
                            f"rozdeliť nedá bez toho, aby sa zoznamy inputov "
                            f"napísali dvakrát; rozpis pri tejto kontrole). "
                            f"Tvrdý strop je 128 KiB a ten stráži kontrola "
                            f"„Veľkosť súborov workflowov“.")
          sys.exit(1 if bad else 0)
          PY
