name: Kontrola · lint workflowov

# Chytá chyby, ktoré sa inak prejavia až tým, že beh skončí ako „failure"
# s nula jobmi – GitHub vtedy workflow ani neprijme a v logu nie je nič.
#
# Presne to sa stalo v behu 31012911958: `workflow_dispatch` dovolí najviac
# 10 inputov, mali sme ich 26. Bez tohto sa to zistí až pri merge do master,
# keď je neskoro. actionlint to povie do dvoch sekúnd.

on:
  push:
    paths:
      - ".github/workflows/**"
      - "workers/**"
      # Aj štýl: `fill` vrstva nad zmiešanou geometriou je tichý omyl, ktorý
      # sa inak nájde až v hotovej mape (viď `workers/lint/style.mjs`).
      - "poc/web/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "workers/**"
      - "poc/web/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: actionlint
        env:
          # shellcheck nevie o `${{ }}` – GitHub výrazy mu vyzerajú ako
          # rozbitá syntax (SC1083/1073/1072/1009/1089) a slovenské „úvodzovky"
          # v hláškach ako preklep (SC1111). To sú falošné poplachy, nie chyby;
          # skutočnú syntax kontroluje `bash -n` v ďalšom kroku, ktorý výrazy
          # najprv nahradí. SC2129 a SC2015 sú štýlové názory na `>>` a `&&`.
          #
          # SC2153 („ROCK_RES may not be assigned. Did you mean ROCK_DEM?")
          # je tu preto, že shellcheck nevidí `env:` workflowu. Do skriptov
          # ich chodí pätnásť (ROCK_RES, ROCK_ALGO, DEM_STORE…), takže
          # každá lokálna premenná s podobným menom vyrobí falošný poplach –
          # a prepisovať mená premenných podľa toho, čo sa shellchecku zdá,
          # je horšie než tento check nepoužívať.
          SHELLCHECK_OPTS: "-e SC1083,SC1073,SC1072,SC1009,SC1089,SC1111,SC2129,SC2015,SC2153"
        run: |
          set -euo pipefail
          VER=1.7.7
          curl -sSL --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${VER}/actionlint_${VER}_linux_amd64.tar.gz" \
            | tar xz actionlint
          ./actionlint -color

      # Skutočná kontrola syntaxe: `${{ }}` sa nahradí zástupným textom
      # a `run:` blok sa dá bashu. Toto chytí naozajstný preklep tam, kde
      # shellcheck len nerozumel GitHub výrazu.
      - name: Syntax run blokov
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, re, subprocess, sys, yaml
          bad = 0
          for path in sorted(glob.glob(".github/workflows/*.yml")):
              for job, jd in ((yaml.safe_load(open(path)) or {}).get("jobs") or {}).items():
                  for st in jd.get("steps") or []:
                      script = st.get("run")
                      if not script:
                          continue
                      clean = re.sub(r"\$\{\{[^}]*\}\}", "X", script)
                      p = subprocess.run(["bash", "-n"], input=clean, text=True,
                                         capture_output=True)
                      if p.returncode:
                          print(f"::error file={path}::{job} / {st.get('name')}: {p.stderr.strip()}")
                          bad += 1
          print(f"run blokov s chybnou syntaxou: {bad}")
          sys.exit(1 if bad else 0)
          PY

      # Strop na veľkosť súboru s workflowom je 128 KiB. Nad ním ho GitHub
      # NEPRIJME – a nepovie to: po pushi vznikne beh bez jobov, pomenovaný
      # cestou k súboru, s červeným krížikom, aj keď má workflow len
      # `workflow_dispatch`. Vyzerá to, že sa spustil sám po mergi.
      #
      # `build-map.yml` cez ten strop prešiel o 122 bajtov (beh 33) a stálo
      # to šesť kôl sond, kým sa to našlo: actionlint ani JSON schéma
      # o veľkosti nevedia. Preto radšej varovanie už od 120 KiB – veľký
      # `run:` blok patrí do `workers/`, nie do YAMLu.
      - name: Veľkosť súborov workflowov
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, os, sys
          LIMIT = 128 * 1024
          WARN = 120 * 1024
          bad = 0
          for path in sorted(glob.glob(".github/workflows/*.yml")):
              n = os.path.getsize(path)
              if n > LIMIT:
                  print(f"::error file={path}::{n} B je nad stropom {LIMIT} B – "
                        f"GitHub taký súbor neprijme. Presuň veľký `run:` blok "
                        f"do workers/ a volaj ho jedným riadkom.")
                  bad += 1
              elif n > WARN:
                  print(f"::warning file={path}::{n} B, strop je {LIMIT} B "
                        f"(ostáva {LIMIT - n} B).")
              else:
                  print(f"{path}: {n} B ✓")
          sys.exit(1 if bad else 0)
          PY

      # `}}` v shellovom skripte bez `${{` pred ním. GitHub taký súbor
      # NEPRIJME: po pushnutí vznikne beh bez jobov, pomenovaný cestou
      # k súboru, s červeným krížikom – a to aj vtedy, keď má workflow len
      # `workflow_dispatch`, takže to vyzerá, že sa spustil sám po mergi.
      # V logu nie je nič, actionlint 1.7.7 ani oficiálna JSON schéma to
      # nezachytia.
      #
      # Vyrobí to celkom nevinná bashová vec – vnorená expanzia:
      #     echo "${A:-${B:-}}"      ← končí na `}}`
      # Stálo to štyri kolá sond po pushnutí, kým sa to našlo (behy 33–39).
      # Rozpis: `${{ … }}` sa vyhodí (aj s `{{z}}` vnútri reťazcov, ktoré
      # `format()` používa na escapovanie), a čo z `}}` ostane, je chyba.
      - name: Zátvorky výrazov v run blokoch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, sys, yaml

          # Otvárací a zatvárací token sa SKLADAJÚ, nepíšu. Keby tu stáli
          # doslova, mal by tento súbor presne tú chybu, ktorú hľadá – a
          # kontrola by zhodila samu seba (aj actionlint, ktorý by ich skúsil
          # prečítať ako výraz).
          OPEN = "$" + "{" * 2
          CLOSE = "}" * 2

          def strip_exprs(s):
              """Vyhodí celé výrazy; vráti (zvyšok, neuzavretý výraz alebo None)."""
              out, i = [], 0
              while True:
                  j = s.find(OPEN, i)
                  if j < 0:
                      out.append(s[i:]); return "".join(out), None
                  out.append(s[i:j])
                  k, in_str = j + len(OPEN), False
                  while k < len(s):
                      # V reťazci vnútri výrazu môžu byť zdvojené zátvorky ako
                      # text – tak si ich escapuje `format()`.
                      if s[k] == "'":
                          in_str = not in_str; k += 1
                      elif not in_str and s.startswith(CLOSE, k):
                          k += len(CLOSE); break
                      else:
                          k += 1
                  else:
                      return "".join(out), s[j:j + 60]
                  i = k

          bad = 0
          for path in sorted(glob.glob(".github/workflows/*.yml")):
              for job, jd in ((yaml.safe_load(open(path)) or {}).get("jobs") or {}).items():
                  for st in jd.get("steps") or []:
                      s = st.get("run")
                      if not s:
                          continue
                      rest, unclosed = strip_exprs(s)
                      if unclosed:
                          print(f"::error file={path}::{job} / {st.get('name')}: "
                                f"neuzavretý výraz: {unclosed}")
                          bad += 1
                          continue
                      for line in rest.split("\n"):
                          if CLOSE in line or OPEN in line:
                              print(f"::error file={path}::{job} / {st.get('name')}: "
                                    f"zdvojená zátvorka bez výrazu – GitHub taký "
                                    f"súbor neprijme: {line.strip()[:100]}")
                              bad += 1
          print(f"run blokov so zlomenými zátvorkami: {bad}")
          sys.exit(1 if bad else 0)
          PY

      # Popis inputu je vo formulári GitHubu jednoriadková nápoveda pod
      # poľom. Keď z neho spravíš odsek, formulár sa stane nečitateľným –
      # a práve to sa tu stalo: `options` v shading-rocks.yml mal 474 znakov,
      # čiže šesť riadkov textu pod jedným políčkom. Detail patrí do
      # komentára nad input (ten číta ten, kto workflow upravuje) alebo do
      # docs/pipeline.md, nie do formulára.
      - name: Popisy inputov sú jednoriadkové
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, sys, yaml
          LIMIT = 100
          bad = 0
          for path in sorted(glob.glob(".github/workflows/*.yml")):
              d = yaml.safe_load(open(path)) or {}
              on = d.get(True) or d.get("on") or {}
              for kind in ("workflow_dispatch", "workflow_call"):
                  for name, spec in ((on.get(kind) or {}) or {}).get("inputs", {}).items():
                      desc = (spec or {}).get("description") or ""
                      if "\n" in desc:
                          print(f"::error file={path}::input `{name}`: popis je "
                                f"viacriadkový – formulár ho zlepí do jedného odseku.")
                          bad += 1
                      elif len(desc) > LIMIT:
                          print(f"::error file={path}::input `{name}`: popis má "
                                f"{len(desc)} znakov, strop je {LIMIT}. Vo formulári "
                                f"je to nápoveda pod poľom, nie dokumentácia – "
                                f"detail daj do komentára nad input.")
                          bad += 1
          print(f"inputov s pridlhým popisom: {bad}")
          sys.exit(1 if bad else 0)
          PY

      # Výber pohorí vo formulári musí sedieť s workers/data/areas.json. Choice
      # options musia byť v YAML doslovne, takže sa to nedá generovať – ale
      # dá sa to strážiť, aby zoznam nezostarol.
      - name: Výber pohorí sedí s areas.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys, yaml
          d = yaml.safe_load(open(".github/workflows/build-map.yml"))
          on = d[[k for k in d if k is True or k == "on"][0]]
          opts = on["workflow_dispatch"]["inputs"]["area"]["options"]
          areas = [k for k in json.load(open("workers/data/areas.json"))
                   if not k.startswith("_")]
          want = ["cely_region"] + areas
          if opts != want:
              print("::error::Výber `area` vo workflowe nesedí s workers/data/areas.json")
              print(f"  vo workflowe: {opts}")
              print(f"  malo by byť:  {want}")
              sys.exit(1)
          print(f"výber pohorí sedí ({len(opts)} položiek)")
          PY

      # A to isté pre workflow, ktorý robí výškový model z DMR 5.0. Robí ho
      # práve pre tie územia, na ktoré potom Build map počíta skaly – keby sa
      # zoznamy rozišli, dá sa vyrobiť model pre pohorie, ktoré si build nevie
      # vypýtať (alebo naopak).
      - name: Výber pohorí v dmr5-drive.yml sedí s areas.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys, yaml
          areas = [k for k in json.load(open("workers/data/areas.json"))
                   if not k.startswith("_")]
          want = ["cele_slovensko"] + areas
          bad = 0
          for path in (".github/workflows/dmr5-drive.yml",):
              d = yaml.safe_load(open(path))
              on = d[[k for k in d if k is True or k == "on"][0]]
              opts = on["workflow_dispatch"]["inputs"]["area"]["options"]
              if opts != want:
                  print(f"::error file={path}::Výber `area` nesedí s workers/data/areas.json")
                  print(f"  vo workflowe: {opts}")
                  print(f"  malo by byť:  {want}")
                  bad += 1
              else:
                  print(f"{path}: výber pohorí sedí ({len(opts)} položiek)")
          sys.exit(1 if bad else 0)
          PY

      # A to isté pre „Dáta · tieňované skaly". Ten hľadá skaly na tom
      # istom výreze, aký si potom Build map vypýta cez `rock_source: tienovanie`
      # – keby sa zoznamy rozišli, dali by sa vyrobiť polygóny pre pohorie,
      # ktoré build nevie zadať (alebo naopak). „Celý región" tu chýba
      # zámerne: bez výrezu nie je čo sťahovať, dlaždice sú konečné.
      - name: Výber pohorí v shading-rocks.yml sedí s areas.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys, yaml
          d = yaml.safe_load(open(".github/workflows/shading-rocks.yml"))
          on = d[[k for k in d if k is True or k == "on"][0]]
          opts = on["workflow_dispatch"]["inputs"]["area"]["options"]
          want = [k for k in json.load(open("workers/data/areas.json"))
                  if not k.startswith("_")]
          if opts != want:
              print("::error::Výber `area` v shading-rocks.yml nesedí s workers/data/areas.json")
              print(f"  vo workflowe: {opts}")
              print(f"  malo by byť:  {want}")
              sys.exit(1)
          print(f"výber pohorí v shading-rocks.yml sedí ({len(opts)} položiek)")
          PY

      # KTORÁ VRSTVA PODÁVA KĽÚČ VÝREZU. Na tomto sa build už raz rozbil
      # (beh 31307163093) a je to tichý druh chyby, lebo obe strany vyzerajú
      # správne samy o sebe.
      #
      # `dmr5` má dve podoby a prepína medzi nimi kľúč výrezu, ktorý vrstva
      # podá do `fetch-dem.sh`: s kľúčom výrez z `dem-ugkk`, bez neho dlaždice
      # z `dem-dmr5`. Kontrola v `workers/dem/check.sh` musí o každej vrstve
      # predpokladať presne to, čo tá vrstva naozaj robí – inak build kontroluje
      # jeden release a sťahuje z druhého.
      #
      # Tabuľka `layer_area_key` v check-dem.sh hovorí, ktorá vrstva kľúč podáva.
      # Tu sa porovná s tým, koľko argumentov naozaj dáva každé volanie
      # `fetch-dem.sh`: 5 = s kľúčom výrezu, 4 = bez neho.
      - name: Vrstvy podávajú kľúč výrezu tak, ako to čaká kontrola
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, sys
          # Kde je volanie a ktorej vrstve patrí. Keď pribudne ďalšie, pridaj
          # ho sem aj do `layer_area_key` v workers/dem/check.sh.
          # Cesta sa mení, keď sa `run:` blok presunie do workers/ (a to sa
          # deje – build-map.yml má strop 128 KiB). Preto sa každá vrstva
          # hľadá vo VIACERÝCH kandidátoch a stačí, že ju nájde jeden;
          # keby sa hľadalo len na jednom mieste, presun by kontrolu umlčal.
          CALLS = {
              ("workers/contours-rocks/build.sh",): ("contours", "rocks"),
              ("workers/terrain/build.sh",
               ".github/workflows/build-map.yml"): ("terrain",),
          }
          # Vrstvy, o ktorých check-dem.sh tvrdí, že kľúč NEpodávajú.
          src = open("workers/dem/check.sh").read()
          m = re.search(r"layer_area_key\(\)\s*\{(.*?)\n\}", src, re.S)
          if not m:
              print("::error file=workers/dem/check.sh::`layer_area_key` sa nenašla")
              sys.exit(1)
          bez_kluca = set(re.findall(r"^\s*([a-z|]+]?)\)\s*echo cely\s*;;",
                                     m.group(1), re.M))
          bez_kluca = {v for entry in bez_kluca for v in entry.strip(")").split("|")}

          bad = 0
          for paths, layers in CALLS.items():
              calls, path = [], paths[0]
              for cand in paths:
                  if not os.path.exists(cand):
                      continue
                  # Komentáre preč – tieto súbory samy o `fetch-dem.sh` píšu
                  # a bez toho by sa veta z komentára počítala ako argumenty.
                  txt = re.sub(r"^[ \t]*#.*$", "", open(cand).read(), flags=re.M)
                  # Riadok s volaním aj s prípadným pokračovaním cez `\`.
                  found = [c for c in re.findall(
                      r"workers/dem/fetch\.sh((?:[^\n\\]|\\\n)*)", txt) if c.strip()]
                  if found:
                      calls, path = found, cand
                      break
              if not calls:
                  print(f"::error file={paths[0]}::volanie dem/fetch.sh sa "
                        f"nenašlo ani v jednom z {list(paths)} – vrstva "
                        f"{layers} si DEM nesťahuje, alebo sa presunula inam "
                        f"a treba ju dopísať do CALLS.")
                  bad += 1
                  continue
              for call in calls:
                  nargs = len(call.replace("\\\n", " ").split())
                  poda = nargs >= 5   # bbox, adresár, tsv, zdroj, kľúč výrezu
                  for layer in layers:
                      caka = layer not in bez_kluca
                      if poda != caka:
                          print(f"::error file={path}::vrstva `{layer}` volá "
                                f"dem/fetch.sh s {nargs} argumentmi (kľúč výrezu "
                                f"{'podáva' if poda else 'nepodáva'}), ale "
                                f"workers/dem/check.sh o nej predpokladá, že ho "
                                f"{'podáva' if caka else 'nepodáva'}. Zosúlaď to – "
                                f"inak build kontroluje jeden release a sťahuje "
                                f"z druhého (beh 31307163093).")
                          bad += 1
          print(f"vrstiev bez kľúča výrezu podľa check-dem.sh: "
                f"{sorted(bez_kluca)}; nesúladov: {bad}")
          sys.exit(1 if bad else 0)
          PY

      # Cesta k DMR 5.0 musí ostať celá: oba doplňovacie joby, volanie
      # `dmr5-drive.yml`, bbox aj meno assetu z `check-dem`, a `update-dem.yml`
      # na `dmr5` padá. Kým tam bol rozcestník, doplnenie bolo tiché nič
      # (beh 31307163093). Rozpis: `workers/lint/dmr5-pipeline.py`.
      - name: DMR 5.0 sa dopĺňa vlastnou pipeline
        run: python3 workers/lint/dmr5-pipeline.py

      # Token vlastníka Drive musí prísť na každé miesto, kde sa z Drive číta
      # alebo do cache/skladu zapisuje – z oboch strán, lebo `workflow_call`
      # nededí secrets sám. Bez neho nič nespadne, len sa počíta hodiny
      # odznova. Rozpis: `workers/lint/drive-token.py`.
      - name: Token vlastníka Drive sa dostane všade, kde sa z Drive číta
        run: python3 workers/lint/drive-token.py

      # „Ktoré sklady existujú" hovoria tri miesta: `KNOWN` vo
      # `workers/drive/store.py`, `store`/`store_area` v `data/dem-sources.json`
      # a `…_STORE:` v `env:` workflowov. Keď sa rozídu, padne to AŽ PO PRÁCI:
      # `dem-sonny1` v `KNOWN` chýbal, doplnenie stiahlo z Drive 12 dlaždíc,
      # rozuzlilo skratky, prevzorkovalo ich – a spadlo na poslednom kroku,
      # nahratí do skladu. Hotová práca sa zahodila a joby, ktoré ten sklad
      # čakali, spadli za ňou (beh 31533988137, štyri padnuté joby).
      # Rozpis: `workers/lint/stores.py`.
      - name: Sklady sedia s tým, čo pipeline pozná
        run: python3 workers/lint/stores.py
      # CACHE PATRÍ NA DRIVE. GitHubová má na repozitár 10 GB a keď sa naplní,
      # NIČ NEPOVIE – ticho vyhodí najstaršie záznamy. Jeden výrez do nej
      # ukladal desiatky GB (DEM dlaždice, sklad častí sklonu, vrstevnice,
      # tieňovanie, dlaždice tieňovania), takže si záznamy vyhadzovali
      # navzájom a hodinové výpočty sa rátali odznova bez toho, aby bolo na
      # čom to vidieť. Jedno vrátené `uses: actions/cache` by ten stav vrátilo
      # a poznalo by sa to len na tom, že build zase trvá dlho.
      - name: Cache je na Drive, nie v GitHube
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, os, sys, yaml

          CACHE = "./.github/actions/cache-"
          WORKER = "workers/drive/cache.py"
          bad = 0

          for path in sorted(glob.glob(".github/workflows/*.yml")):
              d = yaml.safe_load(open(path)) or {}
              for name, job in (d.get("jobs") or {}).items():
                  for st in (job or {}).get("steps") or []:
                      uses = str((st or {}).get("uses") or "")
                      if uses.split("@")[0] in ("actions/cache",
                                                "actions/cache/restore",
                                                "actions/cache/save"):
                          print(f"::error file={path}::krok "
                                f"'{st.get('name', '?')}' v jobe '{name}' "
                                f"používa `{uses}`. GitHubová cache má na "
                                f"repozitár 10 GB a pri naplnení ticho vyhadzuje "
                                f"najstaršie záznamy – použi "
                                f"`{CACHE}restore` / `{CACHE}save`.")
                          bad += 1
                      # Lokálna akcia, ktorá nemá súbor, je beh bez cache
                      # a chybová hláška až na runneri.
                      if uses.startswith("./") and not os.path.exists(
                              os.path.join(uses[2:], "action.yml")):
                          print(f"::error file={path}::krok "
                                f"'{st.get('name', '?')}' v jobe '{name}' volá "
                                f"`{uses}`, ale {uses[2:]}/action.yml "
                                f"neexistuje.")
                          bad += 1

          # Mazanie GitHub cache sa už nemá čoho chytiť: pri pregenerovaní
          # treba zmazať záznam na Drive, inak sa nový pod ten istý kľúč
          # neuloží a ďalší beh dostane ten starý.
          #
          # Hľadaný príkaz sa SKLADÁ, nepíše: keby tu stál celý, našla by táto
          # kontrola samu seba a hlásila by chybu navždy (tak ako pri `OPEN`
          # nižšie).
          NEEDLE = "gh cache" + " delete"
          for path in sorted(glob.glob(".github/workflows/*.yml")):
              txt = open(path).read()
              if NEEDLE in txt:
                  print(f"::error file={path}::`{NEEDLE}` maže GitHub "
                        f"cache, ktorú už nikto nepoužíva. Zmaž záznam na "
                        f"Drive: `python3 {WORKER} --delete --key=…`.")
                  bad += 1

          # A druhá strana toho istého: obe akcie musia existovať a volať
          # tento worker – bez neho by boli prázdnym krokom, ktorý zazelená.
          for smer in ("restore", "save"):
              akcia = f".github/actions/cache-{smer}/action.yml"
              if not os.path.exists(akcia):
                  print(f"::error::chýba {akcia}")
                  bad += 1
                  continue
              text = open(akcia).read()
              if WORKER not in text:
                  print(f"::error file={akcia}::nevolá {WORKER}")
                  bad += 1
              d = yaml.safe_load(text) or {}
              if smer == "restore":
                  # Bez týchto výstupov by `steps.<id>.outputs.cache-hit` bolo
                  # ticho prázdne a všetko by sa počítalo znova.
                  for out in ("cache-hit", "cache-primary-key"):
                      if out not in (d.get("outputs") or {}):
                          print(f"::error file={akcia}::nemá výstup `{out}`, "
                                f"na ktorý sa workflowy odkazujú")
                          bad += 1
          print(f"cache na Drive: {bad} chýb")
          sys.exit(1 if bad else 0)
          PY

      # PUBLIKUJE SA LEN NA DRIVE. Do GitHubu nesmie ísť ani release, ani
      # artefakt, ktorý má prežiť beh – celý sklad je vo `workers/drive/store.py`.
      #
      # Prečo kontrola a nie len dohoda: `gh release upload` je jeden riadok
      # a keby sa vrátil, poznalo by sa to len tým, že v Releases pribúdajú
      # gigabajty, ktoré nikto nečíta, a že tá istá vec leží na dvoch miestach
      # (pravidlo 1). Rovnako `retention-days: 90` – artefakt s ním je uložený
      # výsledok, nie prepravka medzi jobmi jedného behu.
      #
      # Rozpis je vo `workers/lint/publishing.py`, nie tu: tento súbor je nad
      # stropom 800 riadkov, ktorý si sám kontroluje o pár krokov vyššie, a
      # ďalší storiadkový heredoc doň nepatrí (pravidlo 3). Skript sa dá
      # spustiť aj lokálne: `python3 workers/lint/publishing.py`.
      - name: Publikuje sa len na Drive, nie do releasov a artefaktov
        run: python3 workers/lint/publishing.py

      # Viewer sa musí na Pages nasadiť CELÝ. `layer-style.js` pribudol do
      # `poc/web/`, ale `site.sh` mal vymenovaný zoznam súborov a ten sa
      # s priečinkom rozišiel: `devmode.js` si ho importuje, prehliadač na 404
      # zahodí celý modulový graf, nespustí sa ani `app.js` a na stránke ostane
      # biela plocha. Build je pritom zelený a smoke test tiež – kontroluje
      # manifest, sprite a `.pmtiles`, ktoré nasadené naozaj sú.
      - name: "Viewer: na Pages ide všetko, čo si importuje"
        run: python3 workers/lint/viewer.py

      # `curl … | grep -q` je pasca: `grep -q` po prvej zhode zavrie rúru,
      # producent dostane EPIPE a `pipefail` z toho spraví pád, HOCI SA ZHODA
      # NAŠLA. Sú to preteky, takže to prechádza roky a vyskočí, keď za zhodou
      # pribudne pár kB (beh 32144952677: 13 kontrol ✓ a spadlo práve toto).
      - name: "Rúry: predčasný čitateľ nevisí na živom producentovi"
        run: python3 workers/lint/pipes.py

      # Dve tiché veci v hotovom štýle naraz (rozpis vo `workers/lint/style.mjs`):
      #
      # 1. `fill` vrstva nad vrstvou so ZMIEŠANOU geometriou musí vedieť, že
      #    chce len plochy. MapLibre jej čiaru nepreskočí – earcutom z nej
      #    vyrobí sebaprekrývajúci sa mnohouholník, mapa sa načíta a nikto nič
      #    nepovie. Presne tak vznikli tie „prerezané" útvary od zoomu 13
      #    (pedestrian-area nad `transportation`, kde sú chodníky čiary).
      # 2. Vzor nad plochou je VLASTNÁ vrstva (`rock-area__pattern`), takže ju
      #    profil typu mapy musí vypnúť spolu s predlohou. Inak ostane vzor
      #    visieť nad prázdnym podkladom – zase bez jediného slova.
      # 3. MapLibre kreslí vrstvy v poradí zo štýlu, takže navrchu je tá
      #    POSLEDNÁ. Kým sa cesty pridávali od diaľnice nadol, kreslila sa
      #    účelová cesta CEZ diaľnicu a na každej križovatke ju prerušil
      #    prúžok v jej farbe. Poradie dôležitosti hovorí `ROAD_DEFS`.
      - name: "Štýl: výplne chcú plochy, vzory držia s predlohou, cesty poradie"
        run: node workers/lint/style.mjs

      # Tieňovanie reliéfu je PREKRYVNÁ vrstva: krytie, ktorým prekrýva mapu
      # pod sebou, rastie so sklonom, takže s nepriehľadnou farbou je nad ~20°
      # sklonu 0,97–1,0 – a pod tieňovaním potom nie je vidieť mapu, ale farbu
      # tieňovania. Kým bola `hillHighlight` `#ffffff`, bola z lesa na svahu
      # privrátenom k svetlu BIELA PLOCHA; najviac na severných svahoch, lebo
      # predvolené svetlo MapLibre (335°) je 25° od severu. Štýl je pri tom
      # platný a nikto nepovie nič. Rozpis: `workers/lint/hillshade.mjs`.
      - name: "Tieňovanie reliéfu neprekryje mapu pod sebou"
        run: node workers/lint/hillshade.mjs

      # `maps.json` je zoznam hotových máp, ktorý dopisuje BEH – a to je presne
      # ten druh veci, čo sa rozíde ticho: mená v katalógu prestanú sedieť s
      # menami balíkov, katalóg sa zapíše aj po neúspešnom nahratí, alebo build
      # stratí právo zapisovať a zoznam sa prestane dopĺňať. Rozpis:
      # `workers/lint/catalog.py`.
      - name: Katalóg máp drží tvar a nikto ho neobchádza
        run: python3 workers/lint/catalog.py

      # `rebuild` je jediná páka, ktorou sa dá povedať „cache nepoužívaj". Keď
      # sľúbi vrstvu a tá sa aj tak vráti z cache, beh je ZELENÝ a výsledok
      # starý. Rozísť sa to vie ticho troma spôsobmi: hodnota vo formulári,
      # ktorú `plan/options.py` nepozná (alebo naopak), príznak, ktorý `plan`
      # nevydá ako výstup, a `rebuild: skaly` pri `rock_source: tienovanie`,
      # kde obrysy robí podpipeline a bez `fresh=1` nadviaže na tie rozrobené.
      # Rozpis: `workers/lint/rebuild.py`.
      - name: Výber `rebuild` prepočíta to, čo sľubuje
        run: python3 workers/lint/rebuild.py

      # Job `features` číta PBF dvakrát: hrubým sitom (`filter.txt`) a potom
      # schémou (`features.yml`). To isté rozhodnutie je tým na dvoch miestach
      # a keď sa rozídu, je to tiché – Planetiler dostane PBF bez tých objektov
      # a vyrobí dlaždice, v ktorých tá trieda jednoducho nie je. Beh zelený,
      # v mape nič. Rozpis: `workers/lint/features.py`.
      - name: Predfilter pustí všetko, čo si schéma prvkov vyžiada
        run: python3 workers/lint/features.py

      # Pásik značenej trasy sa skladá z troch miest naraz (routes.py rozhodne
      # stranu a poradie, trails.yml to pustí do dlaždíc, themes.js z toho
      # spočíta `line-offset`). Keď sa ktorékoľvek dve rozídu, nič nespadne –
      # len sú cyklotrasy na tej istej strane ako turistické, alebo sú pásiky
      # odlepené od cesty. Rozpis: `workers/lint/trails.mjs`.
      - name: "Trasy: strana, odstup a atribúty držia spolu"
        run: node workers/lint/trails.mjs

      # Turistická značka (biely či žltý štvorec s farebným pásom) je jediná
      # vec v mape, ktorej MENO OBRÁZKA sa skladá až z dát: tags.py napíše tvar,
      # podklad a farbu, štýl z nich `concat`-om zloží meno a marks.mjs ho musí
      # mať v sprite. Keď sa tie tri rozídu, MapLibre neznámy obrázok TICHO
      # preskočí a po trase nie je nič. Rozpis: `workers/lint/marks.mjs`.
      - name: "Značky trás: tvar, dvojica farieb a meno obrázka sedia"
        run: node workers/lint/marks.mjs

      # Vlastná ikona (obrázok nahratý v paneli) a vlastná sada ikoniek sa
      # dajú pridať v developer móde – ale platné sú až vtedy, keď ich pipeline
      # naozaj dopečie do spritu a stiahne. Keď sa niektorý z tých krokov
      # stratí, ikona sa dá vybrať a v mape po nej ostane prázdno; a `layout`
      # úprava na inej než symbolovej vrstve by zhodila CELÝ štýl.
      # Rozpis: `workers/lint/icons.mjs`.
      - name: "Ikony: vlastné obrázky a sady sa naozaj dostanú do mapy"
        run: node workers/lint/icons.mjs

      # Developer mode zapisuje úpravy, ktoré potom pipeline zapečie do mapy –
      # a keď ich `normalizeOverrides` pri zápise do repozitára odmietne, je to
      # tiché: v prehliadači to platí, na Pages nie. Dve veci naraz (rozpis vo
      # `workers/lint/overrides.mjs`): nulová hrúbka čiary je zmiznutá vrstva,
      # nie vypnutá (šípka na prázdnom políčku ju vyrobila jedným ťuknutím),
      # a kopírovanie štýlu z vrstvy do vrstvy musí vyrobiť úpravu, ktorú
      # normalizácia prijme celú – nie polovicu. K tomu tretia: čo developer
      # mode nastaví, to sa musí aj ULOŽIŤ – `overrides.mjs` skladá súbor pre
      # repozitár po kľúčoch a na `trails` raz zabudol, takže z nastavení trás
      # do neho neprišlo nič. A štvrtá: prerušovanie, ktoré má vrstva ZO ŠTÝLU
      # (železnica), musí byť vo výbere vidieť a „Plná" ho musí vedieť zrušiť –
      # kým sa zahadzovala ako predvolená, čiarkovanie železnice sa nedalo ani
      # zmeniť, ani vypnúť.
      - name: "Úpravy štýlu prejdú normalizáciou celé"
        run: node workers/lint/overrides.mjs

      # Štítok s číslom cesty („D1") stojí na obrázku zo spritu, ktorý sa
      # ROZŤAHUJE podľa dĺžky čísla. Všetky tri veci, ktoré sa na ňom dajú
      # pokaziť, sú tiché (rozpis vo `workers/lint/shields.mjs`): premenovaný
      # obrázok nechá číslo bez podkladu, stratené `stretchX`/`content` pri
      # preskladaní spritu ho natiahnu aj s rohmi, a keby sa vrstva dostala až
      # za `road-name`, číslo by na hustej sieti prehrávalo s menom ulice.
      - name: "Štítky ciest: obrázok, rozťahovanie a poradie"
        run: node workers/lint/shields.mjs

      # „V tomto stupni terén nie je" je doživotná odpoveď – kým prázdna
      # dlaždica leží v sklade, ten stupeň už nikto neprečíta. Keď ju vysloví
      # vzorkovaná štatistika, je beh zelený a v mape chýba pol kraja: presne
      # tak zmizli vrstevnice, skaly aj tieňovanie západne od 17. poludníka
      # v Bratislavskom kraji (beh 31526268289). Rozpis:
      # `workers/lint/dem-empty.py`.
      - name: Prázdny stupeň sa overuje presne a podpisuje sa
        run: python3 workers/lint/dem-empty.py

      # Dno zoomu vrstevníc a skál je napísané dvakrát a inak to nejde: schéma
      # Planetilera rozhoduje, čo sa VYROBÍ, štýl, čo sa NAKRESLÍ. Keď sa tie
      # čísla rozídu, nikto nič nepovie – buď platíme dlaždice, ktoré nikto
      # nevidí, alebo je v mape diera. Rozpis: `workers/lint/zoom-floor.py`.
      - name: "Štýl: vrstevnice a skaly majú v schéme a v štýle to isté dno"
        run: python3 workers/lint/zoom-floor.py

      # Tieňovanie roky vyzeralo správne a nebolo: výška zaokrúhlená na celé
      # metre a `-r average` pri ZVÄČŠOVANÍ DEM spravili z hillshadu (ktorý je
      # derivácia výšky) pravidelnú tkaninu cez celú mapu. Nič nespadlo – to je
      # pravidlo 8 v čistej podobe. Rozpis: `workers/lint/terrain.py`.
      - name: Tieňovanie nestráca presnosť, ktorou stojí a padá
        run: python3 workers/lint/terrain.py

      # A to isté o jeden krok skôr, v samotnom MODELI. Tieňovanie sa opravilo
      # dvakrát a mriežka v mape ostala – lebo nevznikala pri robení dlaždíc,
      # ale už pri čítaní DMR 5.0 z Drive: zo 4 m pyramídy na 5 m bunky
      # príkazom `-r average`, teda pri pomere 1,25, kde GDAL každú štvrtú
      # zdrojovú bunku preskočí. Vrstevnice sa trasujú z toho istého modelu,
      # takže boli zubaté s tým istým rastrom. Nič nespadlo a spoznať sa to
      # dalo len okom na hotovej mape, po hodinách čítania z Drive.
      # Rozpis: `workers/lint/dem-resampling.py`, čísla:
      # `workers/dem/measure-resampling.py`.
      - name: "Výškový model: resampling si nikto nevyberá sám"
        run: python3 workers/lint/dem-resampling.py

      # Vrstevnice boli „vyhladené, ale v pravidelných intervaloch zubaté":
      # dva prechody Chaikina z rohu spravia menší roh, nie oblúk, a keďže
      # rohy ostanú tam, kde ich nechal Douglas–Peucker, sú tie zvyšky
      # pravidelne rozostupené. Build bol pritom zelený a dlaždice správne
      # veľké – zase pravidlo 8. Odvtedy sa zaobľuje limitnou krivkou
      # vzorkovanou podľa mriežky dlaždice a strážia sa miesta, na ktorých sa
      # to dá nebadane rozbiť (cesta k skriptu z iného priečinka, chýbajúci
      # `--maxzoom`, priehyb nad krok mriežky, posunuté konce čiary).
      # Rozpis: `workers/lint/smoothing.py`.
      - name: "Zaoblenie obrysu: každé volanie vie svoju mriežku"
        run: python3 workers/lint/smoothing.py

      # Ovládač GeoJSON prepočítava do WGS84 vždy, keď vrstva vie, v čom je –
      # takže `-a_srs EPSG:3035` nad takým výstupom metre neoznačí, ale ich
      # ZMENÍ NA STUPNE, a ogr2ogr pri tom skončí úspechom. Pipeline na to
      # doplatila dvakrát: raz mala každá skala rádovo 1e-9 m² a filter ich
      # vyhodil všetky (31245134321, 31426542010), raz vyšla únia švov
      # v stupňoch, prepočítala sa ako 0,00 km² z 3570,56 a zahodila sa ako
      # „stratená" – s varovaním, ktoré posielalo hľadať `TopologyException`
      # v GEOSe, hoci v logu ani jedna nebola (32300347626). Rozpis:
      # `workers/lint/geojson-srs.py`.
      - name: "GeoJSON výstup nedostane SRS – metre by z neho boli stupne"
        run: python3 workers/lint/geojson-srs.py

      # To isté o krok ďalej pri mape sveta: okrem dna zoomu sa tam dá pomýliť
      # aj v MENE vrstvy (`source-layer: downloads` proti vrstve `download`)
      # a MapLibre na to nepovie nič – regióny sťahovania v mape jednoducho
      # nebudú. Kontrola štýl aj SPUSTÍ, takže chyba v `style.mjs` sa nájde tu
      # a nie až v behu, ktorý predtým počítal dlaždice. Rozpis:
      # `workers/lint/world.py`.
      - name: "Mapa sveta: štýl kreslí to, čo schéma vyrába"
        run: python3 workers/lint/world.py

      # Costing motora je slovník a NEZNÁMY KĽÚČ SA V ŇOM TICHO IGNORUJE:
      # `top_speeed` namiesto `top_speed` vráti platnú trasu, len nie tú, ktorú
      # si človek vypýtal. Kontrola preto drží kľúče Valhally proti zoznamu
      # vyzobranému z jej zdrojáku, výrazy GraphHoppera proti jeho zakódovaným
      # hodnotám, a hlavne to, že KAŽDÁ voľba má pre KAŽDÝ motor odpoveď –
      # mapovanie alebo `unsupported` s dôvodom. Ticho zahodená voľba je tá
      # istá trieda chyby ako neznámy `fill-pattern` (pravidlo 8).
      # Rozpis: `workers/lint/routing.py`.
      - name: "Navigácia: profil prejde do motora celý, alebo o sebe povie"
        run: python3 workers/lint/routing.py

      # Obmedzenia na ceste: job `roads` čítá PBF dvakrát (osmium tags-filter,
      # potom Planetiler), takže to isté rozhodnutie je na dvoch miestach.
      # A hodnota s jednotkou (`3.8 m`, `12'6"`) sa NESMIE zmeniť na číslo:
      # Planetiler parsuje `NumberFormat.parse`, ktorý vezme číslo zo začiatku
      # a jednotku zahodí – z 3,8 m by bolo 12 m, potichu.
      # Rozpis: `workers/lint/roads.py`.
      - name: "Obmedzenia na ceste: filter, jednotky a výlučnosť blokov"
        run: python3 workers/lint/roads.py

      # Kraj má na osm.fr vlastný súbor rezaný po jeho administratívnej
      # hranici, takže sa sťahuje priamo ten – nie 373 MB Slovenska, z ktorého
      # by sa kraj ešte raz vyrezával (pravidlo 7). Kontrola stráži, že sa tá
      # obchádzka nevráti a že v číselníku neostane mŕtvy `osmfr.parent`.
      # Rozpis: `workers/lint/pbf-source.py`.
      - name: PBF regiónu sa sťahuje priamo z osm.fr
        run: python3 workers/lint/pbf-source.py

      # `actions/setup-java` je AKCIA, takže sa – na rozdiel od sťahovania
      # jaru – do `workers/lib/planetiler.sh` presunúť nedá a musí stáť pri
      # každom jobe zvlášť. Je to jedna veta zapísaná na šiestich miestach
      # a šiesty (mapa sveta) na ňu zabudol: beh 31948543768 stiahol 100 MB
      # podkladov a padol až za nimi na `UnsupportedClassVersionError`.
      # Rozpis: `workers/lint/planetiler.py`.
      - name: Kto púšťa Planetiler, má aj Javu, na ktorej sa spustí
        run: python3 workers/lint/planetiler.py

      # Shim nad Drive musí zniesť nápor súbežných gdalwarpov a GDAL sa musí
      # vedieť spamätať z jedného stratného spojenia. Oboje je tiché a beh
      # 31338803278 na tom padol dve časti pred koncom. Rozpis:
      # `workers/lint/drive-shim.py`.
      - name: Shim nad Drive znesie nápor a GDAL to skúsi znova
        run: python3 workers/lint/drive-shim.py
      # To isté pre tri výbery výškového zdroja (`contour_source`,
      # `rock_source`, `shading_source`): musia sedieť s kľúčmi
      # v workers/data/dem-sources.json a s tým, pre ktoré vrstvy sa zdroj ponúka
      # (kľúč `for`). Bez toho sa dá pridať zdroj do JSONu a zabudnúť naň vo
      # formulári (alebo naopak) – a zistí sa to až tým, že build vezme
      # nesprávny release. Alebo sa `ugkk` objaví v tieňovaní, kde 1 m LiDAR
      # nie je (máme ho len na výrez, tieňovanie chce celý región).
      - name: Výbery výšok sedia s dem-sources.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys, yaml
          d = yaml.safe_load(open(".github/workflows/build-map.yml"))
          on = d[[k for k in d if k is True or k == "on"][0]]
          inputs = on["workflow_dispatch"]["inputs"]
          srcs = {k: v.get("for", [])
                  for k, v in json.load(open("workers/data/dem-sources.json")).items()
                  if not k.startswith("_")}
          # (input, ktoré vrstvy, čo je vo výbere navyše k modelom)
          want = {
              "contour_source": ("contours", []),
              # Skaly majú okrem modelov ešte hotové polygóny z tieňovania.
              "rock_source": ("rocks", ["tienovanie"]),
              "shading_source": ("shading", []),
          }
          bad = 0
          for name, (layer, extra) in want.items():
              opts = inputs[name]["options"]
              expect = [k for k, f in srcs.items() if layer in f] + extra + ["ziadne"]
              if sorted(opts) != sorted(expect):
                  print(f"::error::Výber `{name}` nesedí s workers/data/dem-sources.json")
                  print(f"  vo workflowe: {opts}")
                  print(f"  malo by byť:  {expect}")
                  bad += 1
                  continue
              print(f"{name}: {len(opts)} možností ✓")
          # `ziadne` je hodnota, ktorou sa vrstva vypína – keby vypadla
          # z niektorého výberu, nedala by sa tá vrstva vôbec nezapnúť.
          sys.exit(1 if bad else 0)
          PY

      # Skript vo `workers/`, ktorý si volá `run:` jedným riadkom, musí od
      # kroku dostať env, ktoré naozaj číta – inak beží s prázdnym reťazcom
      # a NESPADNE. A `steps.<id>.outputs` musí mať svoj krok, inak job ticho
      # vráti prázdno. Rozpis oboch chýb: `workers/lint/worker-env.py`.
      - name: Skripty vo workers dostávajú svoje env
        run: python3 workers/lint/worker-env.py

      # PRIEČINOK JE JOB, SÚBOR JE KROK. Ide to pred ostatné kontroly ciest
      # zámerne: keď sa `workers/` presúvalo z plochého zoznamu do priečinkov,
      # vzory `workers/*.sh` a `workers/[\w.-]+\.sh` prestali chytať čokoľvek
      # (ani jeden nepozná lomku) a kontroly zozelenali nad prázdnym zoznamom.
      # Táto stráži, že sa plochá štruktúra nevráti a nevypne ich znova.
      # Rozpis: `workers/lint/layout.py`.
      - name: Workery ležia v priečinku podľa jobu
        run: python3 workers/lint/layout.py

      # A cesta MEDZI workermi musí ukazovať na existujúci súbor – aj tá, ktorú
      # si skript skladá až za behu (`$HERE/…`). Práve tá prežila presun do
      # priečinkov: prepísali sa cesty napísané celé, `$HERE/…` nie, a beh
      # 31412152523 spadol na štyroch joboch naraz. `bash -n` vidí syntax, nie
      # cesty. Rozpis: `workers/lint/worker-paths.py`.
      - name: Cesty medzi workermi ukazujú na existujúce súbory
        run: python3 workers/lint/worker-paths.py

      # Výpis priečinka na Drive musí rozuzliť SKRATKY, nie ich preskočiť.
      # `listing` zahadzovala všetko bez `size` – správne na Google-natívne
      # dokumenty, lenže skratka `size` tiež nemá a ozajstný súbor za ňou JE.
      # Sonnyho 1″ priečinok je z nich celý (15 dlaždíc = 15 skratiek), takže
      # by z neho vypadli dva obrázky a ani jedna dlaždica – a hláška by pritom
      # vinila zdieľanie priečinka, ktoré je v poriadku. Staticky sa to overiť
      # nedá (odpovedá až Drive), preto sa `listing` pustí nad napodobeninou.
      # Rozpis: `workers/lint/drive-shortcuts.py`.
      - name: Skratky na Drive sa rozuzľujú na cieľ
        run: python3 workers/lint/drive-shortcuts.py
      # actionlint kontroluje schému a výrazy, ale nie to, či `needs.X.outputs.Y`
      # naozaj existuje ako výstup jobu X. To je vlastná kontrola – práve na
      # tomto sa dá po rozdelení na joby ticho pomýliť.
      # Neexistujúci výstup nie je chyba behu – GitHub ho vyhodnotí ako PRÁZDNY
      # REŤAZEC, takže `if:` na ňom vyjde nepravdivo, vrstva sa nepridá a beh
      # zazelená. Kontrola hľadá výstupy na dvoch miestach: pri obyčajnom jobe
      # v jeho `outputs:`, pri jobe s `uses:` v `on.workflow_call.outputs`
      # volaného súboru. Rozpis: `workers/lint/job-refs.py`.
      - name: Odkazy medzi jobmi
        run: python3 workers/lint/job-refs.py

      # DĹŽKA SÚBORU. Dlhý súbor sa nedá naraz prehliadnuť: ďalšia zmena v ňom
      # nevidí, čo tam už je, a pridáva vedľa namiesto toho, aby to použila
      # (pravidlo 1 v CLAUDE.md). Preto strop 800 riadkov a rozdelenie na viac
      # súborov (pravidlo 5).
      #
      # PRE WORKERY JE TO CHYBA, PRE WORKFLOWY VAROVANIE – a nie je to zľava,
      # je to iná jednotka. Skript sa čítá zhora nadol, takže sa dá rozdeliť na
      # moduly (a `shading-rocks.py` 2023 → 715, `drive-auth.py` 894 → 752,
      # `dmr5-drive.py` 888 → 684, `dmr5-raster.py` 853 → 419 sa aj rozdelilo).
      # Workflow je GRAF JOBOV a `build-map.yml` má 2013 riadkov, z ktorých je
      # 598 komentár a 197 vnútro `run:` blokov – **holej YAML štruktúry je
      # 1100 na 17 jobov**. Aj keby sa zmazal každý komentár a každý `run:`
      # blok, ostane 1218 riadkov. Pod 800 sa teda dostať nedá presunutím
      # ničoho, len rozrezaním na ďalšie `workflow_call` súbory – a tam sa
      # zoznam ~20 inputov na job musí napísať DVAKRÁT (v `inputs:` volaného
      # aj v `with:` volajúceho). To by pridalo viac riadkov, než by ubralo,
      # a zdvojilo by presne to, na čom sa už raz rozišla kontrola so
      # sťahovaním (pravidlo 1, beh 31307163093).
      #
      # Čo workflow naozaj zabije, je strop 128 KiB – GitHub nad ním súbor
      # ticho neprijme – a ten stráži kontrola „Veľkosť súborov workflowov"
      # vyššie, v bajtoch. Riadky sú tu ako varovanie, aby rast bolo vidieť.
      #
      # POSLEDNÝ V JOBE ZÁMERNE: kým bol tretí a padal, všetkých pätnásť
      # kontrol za ním sa preskočilo – teda celý zmysel tohto workflowu
      # (beh 31377123600, kde sa o štýle ani o publikovaní nedozvedelo nič).
      - name: Súbory pod 801 riadkov
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, sys
          LIMIT = 800
          bad = 0
          for pattern, tvrdy in ((".github/workflows/*.yml", False),
                                 ("workers/**/*.py", True),
                                 ("workers/**/*.sh", True),
                                 ("workers/**/*.mjs", True)):
              for path in sorted(glob.glob(pattern, recursive=True)):
                  with open(path, encoding="utf-8") as f:
                      n = sum(1 for _ in f)
                  if n <= LIMIT:
                      print(f"{path}: {n} riadkov ✓")
                  elif tvrdy:
                      print(f"::error file={path}::{n} riadkov, strop je "
                            f"{LIMIT}. Rozdeľ na viac modulov (pravidlo 5 "
                            f"v CLAUDE.md) – v jednom dlhom súbore sa nedá "
                            f"rýchlo nájsť, čo sa zmenilo alebo prečo to "
                            f"spadlo.")
                      bad += 1
                  else:
                      print(f"::warning file={path}::{n} riadkov (strop pre "
                            f"workflowy je len odporúčanie – graf jobov sa "
                            f"rozdeliť nedá bez toho, aby sa zoznamy inputov "
                            f"napísali dvakrát; rozpis pri tejto kontrole). "
                            f"Tvrdý strop je 128 KiB a ten stráži kontrola "
                            f"„Veľkosť súborov workflowov“.")
          sys.exit(1 if bad else 0)
          PY
