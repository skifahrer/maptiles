<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FricoMaps – vektorová mapa Slovenska</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    #map { position: absolute; inset: 0; }

    /* Ovládanie je zbalené, aby bolo vidieť hlavne mapu. */
    #toggle {
      position: absolute; top: 10px; left: 10px; z-index: 12;
      width: 36px; height: 36px; border: none; border-radius: 8px;
      background: rgba(255, 255, 255, 0.94); color: #333;
      box-shadow: 0 1px 4px rgba(0,0,0,.3);
      font-size: 17px; line-height: 1; cursor: pointer; padding: 0;
    }
    #toggle:hover { background: #fff; }
    #toggle.has-warning::after {
      content: ""; position: absolute; top: 5px; right: 5px;
      width: 7px; height: 7px; border-radius: 50%; background: #e08030;
    }

    #panel {
      position: absolute; top: 56px; left: 10px; z-index: 11;
      background: rgba(255, 255, 255, 0.94); color: #222;
      border-radius: 10px; padding: 12px 14px;
      box-shadow: 0 2px 10px rgba(0,0,0,.25);
      width: 232px; max-height: calc(100% - 80px); overflow: auto;
    }
    #panel[hidden] { display: none; }
    #panel label { display: block; font-size: 12px; margin: 8px 0 3px; color: #555; }
    #panel label:first-child { margin-top: 0; }
    #panel select {
      width: 100%; padding: 5px 6px; font-size: 14px;
      border: 1px solid #ccc; border-radius: 6px; background: #fff;
    }
    #panel .row {
      display: flex; align-items: center; gap: 7px;
      font-size: 12px; color: #555; margin-top: 10px;
    }
    #meta { font-size: 11px; color: #777; margin-top: 10px; line-height: 1.5; }

    /* Nenápadný ukazovateľ zoomu – neprekáža v mape. */
    #zoom {
      position: absolute; left: 10px; bottom: 10px; z-index: 11;
      background: rgba(255, 255, 255, 0.82); color: #444;
      border-radius: 6px; padding: 3px 7px; font-size: 11px;
      font-variant-numeric: tabular-nums; pointer-events: none;
    }

    #warn {
      display: none; margin-top: 10px; padding: 8px 10px;
      background: #fff4e5; border: 1px solid #f0c07a; border-radius: 6px;
      font-size: 11px; color: #7a4a10; max-height: 150px; overflow: auto;
    }
    #warn ul { margin: 4px 0 0; padding-left: 16px; }
    #warn li { margin-bottom: 3px; word-break: break-word; }

    #error {
      display: none; position: absolute; inset: 0; z-index: 20;
      background: #fff; padding: 40px; font-size: 15px; line-height: 1.6;
    }
    #error code { background: #f2f2f2; padding: 2px 5px; border-radius: 4px; }

    /* ===================== developer mode ===================== */
    /* ŠÍRKA PANELA. 420 px bolo málo: v riadku pásma stoja vedľa seba dva
       zoomy, hodnota, jednotka a kôš – pri 420 px sa to lámalo do dvoch
       riadkov a zoznam pásiem sa prestal čítať ako tabuľka. `resize` necháva
       poslednú desatinu na človeku (mapa pod panelom je tiež pracovná plocha),
       `max-width` drží panel v okne aj na úzkom displeji. */
    #dev {
      position: absolute; top: 10px; right: 10px; bottom: 10px; z-index: 13;
      width: min(560px, calc(100% - 20px));
      max-width: calc(100% - 20px); min-width: 320px; resize: horizontal;
      display: flex; flex-direction: column;
      background: rgba(252, 252, 253, 0.97); color: #222;
      border-radius: 10px; box-shadow: 0 2px 14px rgba(0,0,0,.3);
      font-size: 12px; overflow: hidden;
    }
    #dev[hidden] { display: none; }
    .dev-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 9px 12px; border-bottom: 1px solid #e2e2e6; font-size: 13px;
    }
    .dev-x {
      border: none; background: none; cursor: pointer;
      font-size: 15px; color: #888; padding: 0 2px;
    }
    /* Rýchly prepínač svetlá/tmavá v hlavičke panela – rozpis pri `renderThemeToggle`
       v devmode.js. Vlastný rámik, nech je vidieť, že je to tlačidlo, nie popisok. */
    .dev-themetoggle {
      font-size: 11px; border: 1px solid #ccc; border-radius: 10px;
      padding: 3px 9px;
    }
    .dev-themetoggle:hover { border-color: #999; color: #333; }
    body.dark .dev-themetoggle { border-color: #444; color: #bbb; }
    body.dark .dev-themetoggle:hover { border-color: #666; color: #fff; }
    /* `flex-wrap` je poistka, nie ozdoba: záložiek je sedem a panel má 420 px,
       takže na užšom okne by sa posledná („Súbor") inak orezala preč. */
    .dev-tabs {
      display: flex; flex-wrap: wrap; gap: 2px;
      padding: 6px 8px 0; border-bottom: 1px solid #e2e2e6;
    }
    .dev-tab {
      border: none; background: none; cursor: pointer; padding: 6px 9px;
      font-size: 12px; color: #666; border-radius: 6px 6px 0 0;
    }
    .dev-tab.on { background: #eceef2; color: #111; font-weight: 600; }
    .dev-body { flex: 1; overflow: auto; padding: 8px 10px 14px; }
    .dev-status {
      padding: 6px 12px; border-top: 1px solid #e2e2e6;
      font-size: 11px; color: #777;
    }
    .dev-hint { margin: 2px 0 8px; color: #666; line-height: 1.45; }
    .dev-hint code { background: #eceef2; padding: 1px 4px; border-radius: 3px; }

    .dev-search {
      width: 100%; box-sizing: border-box; padding: 6px 8px; font-size: 12px;
      border: 1px solid #ccc; border-radius: 6px; margin-bottom: 6px;
    }
    .dev-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 7px; }
    .dev-chip {
      border: 1px solid #d5d5db; background: #fff; color: #555;
      border-radius: 999px; padding: 3px 9px; font-size: 11px; cursor: pointer;
    }
    .dev-chip.on { background: #3a6ea5; border-color: #3a6ea5; color: #fff; }
    /* Hodnota, ktorú už berie iné rozlíšenie. Nechýba zámerne – keby zmizla,
       nedalo by sa zistiť, prečo sa nedá vybrať. */
    .dev-chip.off { opacity: .4; cursor: not-allowed; text-decoration: line-through; }

    .dev-bulk {
      display: flex; flex-wrap: wrap; align-items: center; gap: 5px;
      padding: 7px; border-radius: 7px; background: #f0f1f4;
      margin-bottom: 8px; opacity: .55;
    }
    .dev-bulk.on { opacity: 1; }
    .dev-bulklabel { font-size: 11px; color: #555; margin-right: 3px; }
    .dev-btn {
      border: 1px solid #cfcfd6; background: #fff; color: #333;
      border-radius: 5px; padding: 3px 8px; font-size: 11px; cursor: pointer;
    }
    .dev-btn:hover { background: #f6f6f8; }
    .dev-btn.danger { color: #a03020; border-color: #e0b0a8; }

    .dev-list { display: flex; flex-direction: column; }
    .dev-group {
      display: flex; align-items: center; gap: 4px;
      margin: 9px 0 2px; padding-bottom: 3px; border-bottom: 1px solid #e6e6ea;
    }
    .dev-groupname {
      flex: 1; text-align: left; border: none; background: none; cursor: pointer;
      font-weight: 600; font-size: 12px; color: #333; padding: 0;
    }
    .dev-item { border-bottom: 1px solid #f0f0f3; padding: 3px 0; }
    .dev-row, .dev-prow { display: flex; align-items: center; gap: 6px; padding: 2px 0; }
    .dev-row.off .dev-name, .dev-prow.off .dev-name { opacity: .45; text-decoration: line-through; }
    .dev-row.changed > .dev-name > span:first-child,
    .dev-prow.changed .dev-name > span:first-child,
    .dev-item.changed .dev-name > span:first-child { color: #b06000; font-weight: 600; }
    .dev-check { margin: 0; }
    .dev-name {
      flex: 1; display: flex; flex-direction: column; line-height: 1.25; min-width: 0;
      border: none; background: none; padding: 0; text-align: left; cursor: pointer;
      font: inherit; color: inherit;
    }
    .dev-name small { color: #999; font-size: 10px; overflow: hidden; text-overflow: ellipsis; }
    .dev-kind {
      font-size: 10px; padding: 1px 5px; border-radius: 4px;
      background: #e6e8ee; color: #556; white-space: nowrap;
    }
    .dev-kind.k-area { background: #dff0dc; color: #3a5a34; }
    .dev-kind.k-line { background: #dde6f5; color: #33507a; }
    .dev-kind.k-point { background: #f5e6dd; color: #7a4a33; }
    .dev-kind.k-text { background: #eee2f2; color: #5a3a6a; }
    .dev-kind.k-3d { background: #f2eedd; color: #6a5a20; }
    .dev-kind.k-raster { background: #e2eef2; color: #35606a; }

    /* inšpektor prvkov: nadpis sekcie, tabuľka atribútov, farebný štvorček */
    .dev-h4 {
      margin: 10px 0 2px; font-size: 12px; font-weight: 600; color: #333;
      border-bottom: 1px solid #e6e6ea; padding-bottom: 3px;
    }
    .dev-kv {
      display: flex; gap: 6px; align-items: baseline; padding: 1px 0;
      font-size: 11px; word-break: break-word;
    }
    .dev-kv b { flex: none; width: 96px; color: #888; font-weight: 500; font-size: 10px; }
    .dev-kv span, .dev-kv a { flex: 1; font-family: ui-monospace, monospace; min-width: 0; }
    .dev-swatch {
      width: 14px; height: 14px; flex: none; border-radius: 3px;
      border: 1px solid rgba(0, 0, 0, .2);
    }
    .dev-row.inactive .dev-name > span:first-child { opacity: .45; }
    /* Štítok s rozsahom zoomu je zároveň prepínač „na tomto zoome áno / nie". */
    .dev-zrange {
      font-size: 10px; color: #7a8a6a; background: #eef2e8;
      border: 1px solid transparent; border-radius: 4px;
      padding: 1px 5px; white-space: nowrap; cursor: pointer;
      font-family: inherit; font-variant-numeric: tabular-nums;
    }
    .dev-zrange:hover { border-color: #b0c0a0; }
    .dev-zrange.off { color: #999; background: #f0f0f2; }
    .dev-zrange.off:hover { border-color: #bbb; }

    .dev-zoombar {
      background: #eef1f6; border-radius: 7px; padding: 7px 9px; margin-bottom: 8px;
    }
    .dev-zoomrow { display: flex; align-items: center; gap: 8px; }
    .dev-zoomlabel { font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .dev-slider { flex: 1; min-width: 60px; accent-color: #3a6ea5; }
    .dev-zoombar .dev-chips { margin: 6px 0 0; }
    .dev-zoominfo {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; margin-top: 5px; font-size: 11px; color: #666;
    }
    .dev-zoombar .dev-note { display: block; white-space: normal; margin-top: 5px; line-height: 1.4; }

    /* Rozsah úprav: pre ktorý typ mapy sa práve ladí. */
    .dev-scope {
      background: #f0f1f4; border-radius: 7px; padding: 7px 9px; margin-bottom: 8px;
      border-left: 3px solid #3a6ea5;
    }
    .dev-scoperow { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
    .dev-scope .dev-note {
      display: block; white-space: normal; margin-top: 4px; line-height: 1.4;
    }

    /* Pásik zoomov z0–z20 – jedna bunka je jeden zoom. */
    .dev-stripwrap { margin: 4px 0 2px; }
    .dev-strip { display: flex; gap: 1px; }
    .dev-cell {
      flex: 1; height: 15px; min-width: 0; padding: 0; cursor: pointer;
      border: 1px solid #d5d5db; border-radius: 2px; background: #fff;
    }
    .dev-cell.on { background: #3a6ea5; border-color: #33608f; }
    .dev-cell.now { outline: 2px solid #e08030; outline-offset: -2px; }
    .dev-cell:hover { border-color: #888; }
    .dev-striplabels {
      display: flex; justify-content: space-between;
      font-size: 9px; color: #999; margin-top: 1px;
      font-variant-numeric: tabular-nums;
    }

    /* Náhľad prerušovania vedľa výberu druhu čiary. */
    .dev-dashrow { display: flex; align-items: center; gap: 5px; }

    /* Vzor: náhľad je kreslený tým istým rasterizérom ako obrázok pre mapu,
       a kreslí sa NAD FARBOU PODKLADU – vzor sám o sebe nepovie, ako bude
       nad tou plochou vyzerať. */
    .dev-pat {
      display: block; border-radius: 4px; border: 1px solid rgba(0, 0, 0, .18);
      background: repeating-conic-gradient(#f0f0f2 0% 25%, #fff 0% 50%) 0 0 / 10px 10px;
    }
    .dev-patbtn { border: none; background: none; padding: 0; cursor: pointer; }
    .dev-patgrid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
      gap: 5px; max-height: 260px; overflow-y: auto; margin: 4px 0 6px;
      padding: 5px; border: 1px solid #e2e2e8; border-radius: 6px; background: #fafafc;
    }
    .dev-pattile {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      border: 1px solid transparent; border-radius: 6px; background: none;
      padding: 3px 1px; cursor: pointer; overflow: hidden;
    }
    .dev-pattile:hover { background: #eceef4; }
    .dev-pattile.on { border-color: #3a6ea5; background: #e3ecf7; }
    .dev-pattile small {
      font-size: 9px; color: #666; max-width: 100%;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .dev-dash { color: #444; display: inline-flex; align-items: center; }
    .dev-h5 {
      display: flex; align-items: baseline; gap: 6px;
      margin: 9px 0 2px; font-size: 11px; font-weight: 600; color: #444;
      border-bottom: 1px solid #eceef2; padding-bottom: 2px;
    }
    .dev-h5 small { font-weight: 400; color: #999; font-size: 10px; }
    .dev-field.changed .dev-num { background: #fff6e8; border-color: #d09030; }
    /* Vrstva upravená práve v tom rozsahu, do ktorého sa zapisuje. */
    .dev-row.scoped > .dev-name > span:first-child::after {
      content: " •"; color: #3a6ea5;
    }

    .dev-details { padding: 2px 0 4px 24px; }
    .dev-fields, .dev-sub {
      display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 4px 0;
    }
    .dev-sub {
      padding: 5px 6px; border-radius: 6px; background: #f4f5f8;
    }
    .dev-sub.changed, .dev-fields.changed .dev-num {
      background: #fff6e8;
    }
    .dev-sub.changed { box-shadow: inset 0 0 0 1px #e6c68c; }
    .dev-field { display: flex; align-items: center; gap: 4px; font-size: 10px; color: #888; }
    .dev-field > span { white-space: nowrap; }
    .dev-field .dev-num { width: 46px; }
    /* V podsekciách má farba zaberať len toľko, koľko potrebuje – inak by
       roztlačila popisky vedľajších polí. */
    .dev-sub .dev-colorrow { flex: 0 0 auto; }
    .dev-sub .dev-hex { width: 74px; }
    .dev-select {
      padding: 2px 4px; font-size: 11px; border: 1px solid #ccc;
      border-radius: 4px; background: #fff; max-width: 150px;
    }
    .dev-prop { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
    .dev-propname { font-size: 10px; color: #888; width: 96px; flex: none; }
    /* Hlavička nad farbami, ktoré vrstva berie z palety (nie zo svojho paint) */
    .dev-prophead { margin-top: 7px; border-top: 1px solid #eee; padding-top: 5px; }
    .dev-prophead .dev-propname { width: auto; font-style: italic; }
    .dev-colorrow { display: flex; align-items: center; gap: 4px; flex: 1; min-width: 0; }
    .dev-colorrow.changed .dev-hex { border-color: #d09030; background: #fffaf0; }
    /* JEDEN EDITOR HODNOTY (rozpis pri `zoomValueEditor` v devmode.js).
       Hlavička nesie meno vlastnosti, hodnotu (kým je pásmo jedno) a prepínač
       „% zo štýlu / pevná hodnota"; pod ňou sú riadky pásiem – jeden riadok
       jeden rozsah zoomov, aby sa dali čítať ako tabuľka zhora nadol. */
    .dev-zv { margin-top: 4px; }
    .dev-zvhead { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
    .dev-zvhead.changed .dev-propname { color: #b06000; font-weight: 600; }
    .dev-zvextras {
      display: flex; align-items: center; gap: 5px; flex-wrap: wrap;
      margin: 2px 0 4px 96px;
    }
    .dev-zvfoot {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      margin: 3px 0 2px 96px;
    }
    .dev-zrow {
      display: flex; align-items: center; gap: 4px; margin: 2px 0 2px 96px;
    }
    /* Pásmo, v ktorom mapa práve stojí – nech je vidieť, ktorý riadok sa
       práve ladí (to isté, čo oranžový rámik v pásiku zoomov). */
    .dev-zrow.now { outline: 1px solid #e0b070; outline-offset: 1px; border-radius: 4px; }
    .dev-stopz { font-size: 10px; color: #888; }
    .dev-num-z { width: 40px; }
    .dev-valcell { display: flex; align-items: center; gap: 3px; }
    .dev-unit { font-size: 10px; color: #888; }
    .dev-num.dev-pct { width: 52px; }
    /* Prepínač jednotky: % zo štýlu ⇄ pevná hodnota */
    .dev-modes { display: flex; gap: 2px; }
    .dev-modebtn { font-size: 10px; opacity: 0.55; }
    .dev-modebtn.on { opacity: 1; border-color: #d09030; background: #fffaf0; font-weight: 600; }
    .dev-addstop { font-size: 10px; }
    .dev-addstop[disabled] { opacity: 0.45; cursor: default; }
    /* „Táto vrstva je obrys tamtej" – banner na začiatku detailu. */
    .dev-border {
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
      margin: 4px 0; padding: 5px 7px; border-radius: 6px;
      background: #f2f0ea; border: 1px solid #e0dccf;
    }
    .dev-border .dev-note { flex: 1; min-width: 0; white-space: normal; line-height: 1.35; }
    /* „Táto vrstva má N rozlíšení podľa kľúč = hodnota" – v riadku zoznamu,
       nech sa o nich dá vedieť aj bez rozbalenia detailu. */
    .dev-varbadge {
      font-size: 10px; padding: 1px 5px; border-radius: 8px; flex: none;
      background: #f3e6c8; color: #6a5320; border: 1px solid #e6c68c;
    }
    .dev-borderbadge {
      font-size: 10px; padding: 1px 6px; border-radius: 8px;
      background: #6a5f45; color: #fff; flex: none;
    }
    /* Jedno rozlíšenie podľa `kľúč = hodnota` – vlastný rámik, lebo je to
       samostatná vrstva, nie ďalšie políčko tejto. */
    .dev-variant {
      margin: 4px 0; padding: 4px 6px; border-radius: 6px;
      border: 1px solid #e6c68c; background: #fffdf7;
    }
    /* Zaškrtávatko s textom v jednom riadku (napr. „plynulý prechod") */
    .dev-inline { display: flex; align-items: center; gap: 5px; font-size: 11px; }
    .dev-inline.changed { color: #b06000; font-weight: 600; }
    .dev-color {
      width: 26px; height: 22px; padding: 0; border: 1px solid #ccc;
      border-radius: 4px; background: none; cursor: pointer; flex: none;
    }
    .dev-hex {
      /* 9 znakov, nie 7: farba tieňovania reliéfu je `#rrggbbaa` aj s alfou. */
      width: 88px; padding: 2px 5px; font-size: 11px; font-family: ui-monospace, monospace;
      border: 1px solid #ccc; border-radius: 4px; flex: none;
    }
    .dev-mini {
      border: none; background: none; cursor: pointer; font-size: 12px;
      color: #777; padding: 1px 3px; line-height: 1;
    }
    .dev-mini:hover { color: #222; }
    .dev-note { font-size: 10px; color: #999; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dev-num { width: 52px; padding: 2px 4px; font-size: 11px; border: 1px solid #ccc; border-radius: 4px; }
    /*
      BEZ NATÍVNYCH ŠÍPOK. Prázdne políčko `type=number` skočí šípkou dole na
      spodnú medzu – pri hrúbke čiary teda na nulu, čo je neviditeľná vrstva.
      Kliknutie do natívnej šípky sa zachytiť nedá (prehliadač hlási to isté,
      čo písanie), klávesová šípka áno – tú `numberField` v devmode.js chytá
      a prázdne políčko najprv naplní hodnotou, ktorú vlastnosť práve má.
      Do 46 px širokého políčka sa navyše šípky aj tak nezmestili.
    */
    .dev-num { appearance: textfield; -moz-appearance: textfield; }
    .dev-num::-webkit-outer-spin-button,
    .dev-num::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    /* Panel nad detailom vrstvy: schránka na štýl a reset celej vrstvy. */
    .dev-tools {
      display: flex; flex-wrap: wrap; align-items: center; gap: 4px;
      margin: 2px 0 6px; padding-bottom: 5px; border-bottom: 1px dashed #e6e6ec;
    }
    .dev-tools .dev-btn[disabled] { opacity: .45; cursor: default; }
    .dev-iconset {
      display: block; border: 1px solid #e0e0e6; border-radius: 8px;
      padding: 8px 10px; margin-bottom: 8px; cursor: pointer;
    }
    .dev-iconset.on { border-color: #3a6ea5; background: #f4f8fd; }
    .dev-iconset .dev-hint { margin: 4px 0 2px; }
    .dev-iconset a { color: #3a6ea5; text-decoration: none; word-break: break-all; }
    .dev-preview {
      display: block; width: 100%; height: 26px; margin: 6px 0 2px;
    }
    .dev-json {
      width: 100%; box-sizing: border-box; height: 220px; margin-top: 8px;
      font-family: ui-monospace, monospace; font-size: 11px;
      border: 1px solid #ccc; border-radius: 6px; padding: 6px;
    }
    .dev-file { display: block; margin: 4px 0 6px; font-size: 11px; }

    /* Výber ikony: mriežka s náhľadmi namiesto zoznamu mien. Meno pod
       obrázkom je orezané – dôležité je, ako ikona vyzerá; celé meno je
       v bublinke. */
    .dev-icons { margin: 4px 0 8px; }
    .dev-iconsearch { margin-bottom: 5px; }
    .dev-icongrid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(58px, 1fr));
      gap: 4px; max-height: 210px; overflow-y: auto;
      padding: 4px; border: 1px solid #e2e2e8; border-radius: 6px; background: #fafafc;
    }
    .dev-icontile {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      border: 1px solid transparent; border-radius: 6px; background: none;
      padding: 3px 1px; cursor: pointer; overflow: hidden;
    }
    .dev-icontile:hover { background: #eceef4; }
    .dev-icontile.on { border-color: #3a6ea5; background: #e3ecf7; }
    .dev-icontile small {
      font-size: 9px; color: #666; max-width: 100%;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .dev-icon { display: block; }
    .dev-iconnone { display: block; width: 22px; height: 22px; line-height: 22px; color: #999; }
    /* Stoh vrstiev (záložka „Poradie"): jeden dlhý zoznam v poradí kreslenia,
       prvý riadok navrchu. Čiara pri hrane riadka ukazuje, kam ťahaná vrstva
       padne – bez nej sa „nad" a „pod" nedá rozoznať. */
    .dev-stack { display: flex; flex-direction: column; }
    .dev-stackrow {
      display: flex; align-items: center; gap: 5px; padding: 3px 2px;
      border-bottom: 1px solid #f0f0f3; border-top: 2px solid transparent;
      background: #fff;
    }
    .dev-stackrow:hover { background: #f6f7fa; }
    .dev-stackrow.off .dev-name { opacity: .45; text-decoration: line-through; }
    .dev-stackrow.inactive .dev-name > span:first-child { opacity: .5; }
    .dev-stackrow.changed .dev-name > span:first-child { color: #b06000; font-weight: 600; }
    .dev-stackrow.dragging { opacity: .4; }
    .dev-stackrow.drop-above { border-top-color: #3a6ea5; }
    .dev-stackrow.drop-below { box-shadow: inset 0 -2px 0 #3a6ea5; }
    .dev-grip { cursor: grab; color: #aaa; font-size: 12px; user-select: none; }
    .dev-stackrow.dragging .dev-grip { cursor: grabbing; }

    .dev-text {
      box-sizing: border-box; padding: 4px 6px; font-size: 11px; min-width: 90px;
      border: 1px solid #ccc; border-radius: 5px;
    }
    .dev-clip { position: fixed; left: -9999px; top: 0; }

    body.dark #toggle { background: rgba(24,24,36,.94); color: #ddd; }
    body.dark #panel { background: rgba(24, 24, 36, 0.94); color: #ddd; }
    body.dark #panel label, body.dark #panel .row { color: #aaa; }
    body.dark #panel select { background: #222; color: #ddd; border-color: #444; }
    body.dark #zoom { background: rgba(24,24,36,.8); color: #bbb; }
    body.dark #warn { background: #3a2a12; border-color: #7a5a20; color: #f0c890; }

    body.dark #dev { background: rgba(22, 22, 32, 0.97); color: #ddd; }
    body.dark .dev-head, body.dark .dev-tabs, body.dark .dev-status { border-color: #33334a; }
    body.dark .dev-status, body.dark .dev-hint, body.dark .dev-note,
    body.dark .dev-bulklabel, body.dark .dev-propname { color: #999; }
    body.dark .dev-zvhead.changed .dev-propname { color: #e0a860; }
    body.dark .dev-border { background: #262232; border-color: #3a3550; }
    body.dark .dev-borderbadge { background: #8a7c58; color: #16161f; }
    body.dark .dev-variant { background: #24202c; border-color: #6a5a34; }
    body.dark .dev-varbadge { background: #342c1c; color: #e0c890; border-color: #6a5a34; }
    body.dark .dev-zrow.now { outline-color: #8a6a3a; }
    body.dark .dev-modebtn.on { background: #342c1c; border-color: #7a5a2a; }
    body.dark .dev-unit, body.dark .dev-stopz { color: #888; }
    body.dark .dev-tab { color: #aaa; }
    body.dark .dev-tab.on { background: #2b2b40; color: #fff; }
    body.dark .dev-bulk { background: #26263a; }
    body.dark .dev-iconset { border-color: #33334a; }
    body.dark .dev-iconset.on { border-color: #3a6ea5; background: #1e2636; }
    body.dark .dev-zoombar { background: #24243a; }
    body.dark .dev-zoominfo { color: #999; }
    body.dark .dev-scope { background: #24243a; border-left-color: #3a6ea5; }
    body.dark .dev-cell { background: #1e1e2c; border-color: #3a3a52; }
    body.dark .dev-cell.on { background: #3a6ea5; border-color: #4a7eb5; }
    body.dark .dev-striplabels { color: #777; }
    body.dark .dev-dash { color: #ccc; }
    body.dark .dev-h5 { color: #ccc; border-color: #2a2a3c; }
    body.dark .dev-h5 small { color: #888; }
    body.dark .dev-field.changed .dev-num { background: #342c1c; border-color: #7a5a2a; }
    body.dark .dev-row.scoped > .dev-name > span:first-child::after { color: #7aa4ff; }
    body.dark .dev-prophead { border-color: #2a2a3c; }
    body.dark .dev-h4 { color: #ddd; border-color: #2a2a3c; }
    body.dark .dev-kv b { color: #888; }
    body.dark .dev-kv a { color: #7aa4ff; }
    body.dark .dev-swatch { border-color: rgba(255, 255, 255, .3); }
    body.dark .dev-sub { background: #222232; }
    body.dark .dev-sub.changed { background: #342c1c; box-shadow: inset 0 0 0 1px #7a5a2a; }
    body.dark .dev-field { color: #999; }
    body.dark .dev-zrange { color: #9ab08a; background: #232d22; }
    body.dark .dev-zrange.off { color: #777; background: #26263a; }
    body.dark .dev-btn, body.dark .dev-chip, body.dark .dev-select,
    body.dark .dev-icongrid { background: #1e1e2c; border-color: #33334a; }
    body.dark .dev-icontile:hover { background: #2c2c40; }
    body.dark .dev-icontile.on { background: #26364e; border-color: #4a7ab5; }
    body.dark .dev-icontile small { color: #9a9aa8; }
    body.dark .dev-patgrid { background: #1e1e2c; border-color: #33334a; }
    body.dark .dev-pattile:hover { background: #2c2c40; }
    body.dark .dev-pattile.on { background: #26364e; border-color: #4a7ab5; }
    body.dark .dev-pattile small { color: #9a9aa8; }
    body.dark .dev-pat {
      border-color: rgba(255, 255, 255, .22);
      background: repeating-conic-gradient(#26263a 0% 25%, #1a1a28 0% 50%) 0 0 / 10px 10px;
    }
    body.dark .dev-text { background: #222; color: #ddd; border-color: #444; }
    body.dark .dev-search, body.dark .dev-hex, body.dark .dev-num, body.dark .dev-json {
      background: #1e1e2c; color: #ddd; border-color: #3a3a52;
    }
    body.dark .dev-chip.on { background: #3a6ea5; border-color: #3a6ea5; color: #fff; }
    body.dark .dev-groupname { color: #ddd; }
    body.dark .dev-group { border-color: #33334a; }
    body.dark .dev-tools { border-bottom-color: #33334a; }
    body.dark .dev-item { border-color: #2a2a3c; }
    body.dark .dev-stackrow { background: #1a1a28; border-bottom-color: #2a2a3c; }
    body.dark .dev-stackrow:hover { background: #23233a; }
    body.dark .dev-stackrow.changed .dev-name > span:first-child { color: #e0a850; }
    body.dark .dev-grip { color: #666; }
    body.dark .dev-hint code { background: #2b2b40; }
    body.dark .dev-row.changed > .dev-name > span:first-child,
    body.dark .dev-prow.changed .dev-name > span:first-child,
    body.dark .dev-item.changed .dev-name > span:first-child { color: #e0a850; }
  </style>
</head>
<body>
  <div id="map"></div>

  <button id="toggle" type="button" title="Nastavenia" aria-expanded="false"
          aria-controls="panel">⚙</button>

  <div id="panel" hidden>
    <label for="maptype">Typ mapy</label>
    <select id="maptype"></select>
    <label for="theme">Farebná téma</label>
    <select id="theme"></select>
    <label for="region">Región</label>
    <select id="region"></select>
    <div class="row" id="row-contours" hidden>
      <input type="checkbox" id="contours" checked />
      <label for="contours" style="margin:0">Vrstevnice</label>
    </div>
    <!-- Skaly majú vlastný .pmtiles (vlastný maxzoom), tak aj vlastný
         prepínač – dajú sa zapnúť bez vrstevníc a naopak. -->
    <div class="row" id="row-rocks" hidden>
      <input type="checkbox" id="rocks" checked />
      <label for="rocks" style="margin:0">Skalné plochy</label>
    </div>
    <div class="row" id="row-trails" hidden>
      <input type="checkbox" id="trails" checked />
      <label for="trails" style="margin:0">Značené trasy</label>
    </div>
    <!-- Násypy, múry, ploty, vedenia, prieseky, pramene, jaskyne, rozhľadne,
         parkoviská a zjazdovky. Schéma OpenMapTiles ich nemá, takže majú
         vlastný .pmtiles aj vlastný prepínač. -->
    <div class="row" id="row-features" hidden>
      <input type="checkbox" id="features" checked />
      <label for="features" style="margin:0">Krajinné prvky</label>
    </div>
    <!-- Výška podjazdov a tunelov, šírka, hmotnosť a maximálna rýchlosť.
         Vrstva `transportation` OpenMapTiles z toho nenesie ani jednu
         hodnotu, takže vlastný .pmtiles aj vlastný prepínač. -->
    <div class="row" id="row-roads" hidden>
      <input type="checkbox" id="roads" checked />
      <label for="roads" style="margin:0">Obmedzenia na ceste</label>
    </div>
    <div class="row" id="row-hillshade" hidden>
      <input type="checkbox" id="hillshade" />
      <label for="hillshade" style="margin:0">Tieňovanie reliéfu</label>
    </div>
    <div class="row" id="row-terrain" hidden>
      <input type="checkbox" id="terrain" />
      <label for="terrain" style="margin:0">3D terén</label>
    </div>
    <div class="row">
      <input type="checkbox" id="devmode" />
      <label for="devmode" style="margin:0">🛠 Developer mode</label>
    </div>
    <div id="meta"></div>
    <div id="warn"><b>Problém s načítaním:</b><ul></ul></div>
  </div>

  <div id="dev" hidden></div>

  <div id="zoom">zoom –</div>

  <div id="error">
    <h2 id="error-title">Dlaždice sa nepodarilo načítať</h2>
    <p id="error-text">Pravdepodobne ešte nebola spustená pipeline, ktorá vygeneruje PMTiles.
       Spusti workflow <b>„Mapa · Build map region"</b> na GitHube
       (Actions → Run workflow), vyber región a počkaj na nasadenie.</p>
    <p id="error-detail"></p>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/pmtiles@3/dist/pmtiles.js"></script>
  <!--
    STRÁŽCA ŠTARTU. Nie je to modul a je zámerne inline: keď sa nenačíta
    niektorý súbor z modulového grafu, `app.js` sa NESPUSTÍ – a s ním ani
    hláška, ktorú by inak ukázal. Presne to sa raz stalo: `layer-style.js`
    bol v repozitári, ale `workers/deploy/site.sh` ho nekopíroval do `_site`,
    `devmode.js` si ho importuje, prehliadač na 404 zahodil celý graf a na
    stránke bola BIELA PLOCHA. Build zelený, smoke test zelený, mapa žiadna
    a nikde ani slovo – tichý omyl (pravidlo 8 v CLAUDE.md).

    Chytá sa to z dvoch strán, lebo ani jedna sama nestačí: `error` v capture
    fáze zachytí zlyhané načítanie súboru (tie eventy nebublajú) aj výnimku
    v module, a budík zachytí prípad, keď sa nič nezlomí nahlas a viewer len
    ticho nedobehne. `app.js` na konci nastaví `window.__viewerBooted`.
  -->
  <script>
    (function () {
      var VYPRSANIE_MS = 15000;
      var ukazane = false;

      function ukaz(nadpis, detail) {
        if (ukazane || window.__viewerBooted) return;
        ukazane = true;
        var box = document.getElementById("error");
        var t = document.getElementById("error-title");
        var p = document.getElementById("error-text");
        var d = document.getElementById("error-detail");
        if (!box) return;
        if (t) t.textContent = nadpis;
        if (p) {
          p.innerHTML =
            "Stránka sa načítala, ale viewer sa nespustil, takže sa nevykreslí " +
            "žiadna mapa. Nie je to chyba dát – tie sú nasadené; nenabehol " +
            "kód stránky. Skús obnoviť stránku (Ctrl-F5); ak to trvá, je to " +
            "chyba buildu a patrí do <b>Actions → Mapa · Build map region</b>.";
        }
        if (d) d.textContent = detail || "";
        box.style.display = "block";
      }

      // Zlyhané načítanie súboru (script/link/img) alebo výnimka v module.
      window.addEventListener("error", function (e) {
        var el = e.target;
        if (el && el !== window && (el.src || el.href)) {
          // Pri module hlási prehliadač chybu na SAMOTNOM `<script>`, aj keď
          // v skutočnosti chýba niektorý jeho import – meno tu preto nesmie
          // znieť ako „toto je ten chýbajúci súbor".
          ukaz("Časť stránky sa nenačítala",
               "Nenačítalo sa: " + (el.src || el.href) +
               " — pri module to znamená ten súbor ALEBO niektorý z jeho " +
               "importov; ktorý presne, povie záložka Network (hľadaj 404).");
        } else if (e.message) {
          ukaz("Viewer spadol pri štarte", e.message);
        }
      }, true);

      window.addEventListener("unhandledrejection", function (e) {
        ukaz("Viewer spadol pri štarte", String((e.reason && e.reason.message) || e.reason || ""));
      });

      window.addEventListener("load", function () {
        setTimeout(function () {
          ukaz("Viewer sa nespustil",
               "Za " + (VYPRSANIE_MS / 1000) + " s sa mapa neinicializovala.");
        }, VYPRSANIE_MS);
      });
    })();
  </script>
  <script type="module" src="./app.js"></script>
</body>
</html>
