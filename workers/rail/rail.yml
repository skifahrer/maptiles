# Planetiler custom schema – railways and aerialways from OSM in one `.pmtiles`.
# The app draws colours (speed, gauge, traction) from the attributes.
schema_name: FricoMaps railways and aerialways
schema_description: >-
  Railways, trams, metro, aerialways and lifts – in service, under construction,
  proposed and gone –, named stations and trackside signs from OSM
attribution: <a href="https://www.openstreetmap.org/copyright">© OpenStreetMap contributors</a>

sources:
  osm:
    type: osm
    local_path: data/rail-lines.osm.pbf

tag_mappings:
  layer: integer

definitions:
  - &line_attrs
    - key: class
      type: match_value
    - key: name
    - key: ref
    - key: usage
    - key: service
    - key: maxspeed
    - key: gauge
    # widest gauge in mm, from `lines.py`
    - key: gauge_mm
      type: integer
      value:
        tag_value: rail_gauge
    # track section between switches of its kind, from `lines.py`
    - key: _section
      type: long
      value:
        tag_value: rail_section
    - key: electrified
    - key: voltage
    - key: frequency
    - key: tracks
    - key: highspeed
    - key: operator
    - key: bridge
    - key: tunnel
    - key: layer
    - key: colour
    - key: route_ref
    - key: network
    - key: description
    - key: start_date
    - key: end_date
    - key: wikidata
    - key: wikipedia
  - &point_attrs
    - key: class
      type: match_value
    - key: name
    - key: ref
    - key: position
      value:
        tag_value: "railway:position"
    - key: signal_direction
      value:
        tag_value: "railway:signal:direction"
    - key: switch_type
      value:
        tag_value: "railway:switch"
    - key: signal_main
      value:
        tag_value: "railway:signal:main"
    - key: signal_distant
      value:
        tag_value: "railway:signal:distant"
    - key: signal_combined
      value:
        tag_value: "railway:signal:combined"
    - key: signal_shunting
      value:
        tag_value: "railway:signal:shunting"
    - key: signal_minor
      value:
        tag_value: "railway:signal:minor"
    - key: signal_main_form
      value:
        tag_value: "railway:signal:main:form"
    - key: signal_distant_form
      value:
        tag_value: "railway:signal:distant:form"
    - key: signal_speed_limit
      value:
        tag_value: "railway:signal:speed_limit"
    - key: speed_limit
      value:
        tag_value: "railway:signal:speed_limit:speed"
    - key: signal_speed_limit_distant
      value:
        tag_value: "railway:signal:speed_limit_distant"
    - key: speed_limit_distant
      value:
        tag_value: "railway:signal:speed_limit_distant:speed"
    - key: signal_crossing
      value:
        tag_value: "railway:signal:crossing"
    - key: signal_crossing_distant
      value:
        tag_value: "railway:signal:crossing_distant"
    - key: signal_whistle
      value:
        tag_value: "railway:signal:whistle"
    - key: signal_ring
      value:
        tag_value: "railway:signal:ring"
    - key: signal_electricity
      value:
        tag_value: "railway:signal:electricity"
    - key: electricity_type
      value:
        tag_value: "railway:signal:electricity:type"
    - key: signal_train_protection
      value:
        tag_value: "railway:signal:train_protection"
    - key: signal_stop
      value:
        tag_value: "railway:signal:stop"
    - key: signal_route
      value:
        tag_value: "railway:signal:route"
    - key: signal_main_repeated
      value:
        tag_value: "railway:signal:main_repeated"
    - key: signal_wrong_road
      value:
        tag_value: "railway:signal:wrong_road"
    # track bearing at a signal in degrees, from `lines.py`
    - key: bearing
      type: integer
      value:
        tag_value: rail_bearing
    - key: osm_id
      value: '${ feature.id }'
      type: long
  - &lifts [cable_car, gondola, mixed_lift, chair_lift, drag_lift, t-bar, j-bar,
             platter, rope_tow, magic_carpet, zip_line, goods, canopy, explosive,
             wire_cable, "yes", unknown]
  - &lift_attrs
    - key: class
      value:
        - if: {aerialway: *lifts}
          value: {tag_value: aerialway}
        - else:
            coalesce:
              - tag_value: "construction:aerialway"
              - tag_value: "proposed:aerialway"
              - tag_value: "disused:aerialway"
              - tag_value: "abandoned:aerialway"
              - tag_value: "razed:aerialway"
              - tag_value: "was:aerialway"
              - tag_value: "removed:aerialway"
              - tag_value: "demolished:aerialway"
              - tag_value: "historic:aerialway"
              - tag_value: construction
              - tag_value: proposed
              - tag_value: disused
              - tag_value: abandoned
    - key: state
      value:
        # a lift out of service often keeps `aerialway=*` with `disused=yes`
        - if: {__all__: [{aerialway: *lifts}, {abandoned: "yes"}]}
          value: abandoned
        - if: {__all__: [{aerialway: *lifts}, {disused: "yes"}]}
          value: disused
        - if: {aerialway: *lifts}
          value: active
        - if: {aerialway: construction, "construction:aerialway": __any__}
          value: construction
        - if: {aerialway: proposed, "proposed:aerialway": __any__}
          value: proposed
        - if: {aerialway: disused, "disused:aerialway": __any__}
          value: disused
        - else: abandoned
    - key: name
    - key: ref
    - key: operator
    # goods ropeway of mines and factories
    - key: usage
    - key: occupancy
      value:
        tag_value: "aerialway:occupancy"
    - key: capacity
      value:
        tag_value: "aerialway:capacity"
    - key: duration
      value:
        tag_value: "aerialway:duration"
    - key: start_date
    - key: end_date
    - key: wikidata
    - key: wikipedia
  - &station_attrs
    - key: class
      type: match_value
    - key: name
    - key: name_en
      value:
        tag_value: "name:en"
    - key: ref
      value:
        tag_value: "railway:ref"
    - key: station
    - key: operator
    - key: uic_ref
    - key: network
    - key: colour
    - key: wikidata
    - key: wikipedia
    - key: osm_id
      value: '${ feature.id }'
      type: long
    - key: osm_type
      value: '${ feature.osm_type }'

layers:
  - id: railway
    features:
      - source: osm
        geometry: line
        min_zoom: 6
        include_when:
          railway: [rail, narrow_gauge]
        exclude_when:
          service: __any__
        attributes: *line_attrs

      # side tracks would blur a station into a blot on overview zooms
      - source: osm
        geometry: line
        min_zoom: 12
        include_when:
          __all__:
            - railway: [rail, narrow_gauge]
            - service: __any__
        attributes: *line_attrs

      - source: osm
        geometry: line
        min_zoom: 10
        include_when:
          railway: [light_rail, subway, tram, monorail, funicular, preserved,
                    miniature]
        attributes: *line_attrs

      - source: osm
        geometry: line
        min_zoom: 10
        include_when:
          railway: [abandoned, disused, razed, dismantled, construction,
                    proposed]
        attributes: *line_attrs

      - source: osm
        geometry: line
        min_zoom: 15
        include_when:
          railway: [platform]
        attributes: *line_attrs

    tile_post_process:
      merge_line_strings:
        min_length: 0

  - id: railway_area
    features:
      - source: osm
        geometry: polygon
        min_zoom: 14
        include_when:
          railway: [platform, station, turntable]
        attributes: *line_attrs

  - id: railway_point
    features:
      - source: osm
        geometry: point
        min_zoom: 14
        include_when:
          railway: [level_crossing, crossing, tram_level_crossing,
                    tram_crossing, railway_crossing, signal, switch,
                    buffer_stop, derail, turntable, subway_entrance,
                    border, owner_change, water_crane]
        attributes: *point_attrs

      - source: osm
        geometry: point
        min_zoom: 15
        include_when:
          railway: [milestone]
        attributes: *point_attrs

      # where line speed changes – points from `lines.py`
      - source: osm
        geometry: point
        min_zoom: 14
        include_when:
          rail_speed: __any__
        attributes:
          - key: class
            value: speed_change
          - key: speed
            type: integer
            value:
              tag_value: rail_speed
          - key: speed_prev
            type: integer
            value:
              tag_value: rail_speed_prev

  - id: station
    features:
      - source: osm
        geometry: point
        min_zoom: 9
        include_when:
          railway: [station]
        attributes: *station_attrs

      - source: osm
        geometry: point
        min_zoom: 12
        include_when:
          railway: [halt]
        attributes: *station_attrs

      - source: osm
        geometry: point
        min_zoom: 14
        include_when:
          railway: [tram_stop]
        attributes: *station_attrs

      # a station mapped as an area has no point to carry its name
      - source: osm
        geometry: polygon_centroid
        min_zoom: 12
        include_when:
          railway: [station, halt]
        attributes: *station_attrs

  # aerialways and lifts; `class` is the kind, `state` whether it runs
  - id: aerialway
    features:
      - source: osm
        geometry: line
        min_zoom: 10
        include_when:
          aerialway: *lifts
        attributes: *lift_attrs

      # under construction, proposed and gone – the kind is in another key
      - source: osm
        geometry: line
        min_zoom: 10
        include_when:
          aerialway: [construction, proposed, disused, abandoned]
          "construction:aerialway": __any__
          "proposed:aerialway": __any__
          "disused:aerialway": __any__
          "abandoned:aerialway": __any__
          "razed:aerialway": __any__
          "was:aerialway": __any__
          "removed:aerialway": __any__
          "demolished:aerialway": __any__
          "historic:aerialway": __any__
        exclude_when:
          aerialway: *lifts
        attributes: *lift_attrs

  - id: aerialway_station
    features:
      - source: osm
        geometry: point
        min_zoom: 12
        include_when:
          aerialway: station
        attributes: *station_attrs

      - source: osm
        geometry: polygon_centroid
        min_zoom: 12
        include_when:
          aerialway: station
        attributes: *station_attrs

# testy: `java -jar planetiler.jar verify workers/rail/rail.yml`
examples:
  - name: A main line is from z6 and carries speed, gauge and traction
    input:
      source: osm
      geometry: line
      tags:
        railway: rail
        usage: main
        maxspeed: "120"
        gauge: "1435"
        electrified: contact_line
        voltage: "25000"
    output:
      - layer: railway
        geometry: line
        min_zoom: 6
        tags:
          class: rail
          usage: main
          maxspeed: "120"
          gauge: "1435"
          electrified: contact_line
          voltage: "25000"

  - name: Broad gauge carries its width in mm
    input:
      source: osm
      geometry: line
      tags:
        railway: rail
        gauge: "1435;1520"
        rail_gauge: "1520"
    output:
      - layer: railway
        geometry: line
        min_zoom: 6
        tags:
          class: rail
          gauge: "1435;1520"
          gauge_mm: 1520

  - name: A track carries its section, for the app to light the whole of it
    input:
      source: osm
      geometry: line
      tags:
        railway: rail
        usage: main
        rail_section: "1234567000"
    output:
      - layer: railway
        geometry: line
        min_zoom: 6
        tags:
          class: rail
          usage: main
          _section: 1234567000

  - name: A siding only from z12
    input:
      source: osm
      geometry: line
      tags:
        railway: rail
        service: siding
    output:
      - layer: railway
        geometry: line
        min_zoom: 12
        tags:
          class: rail
          service: siding

  - name: An abandoned line IS in this package
    input:
      source: osm
      geometry: line
      tags:
        railway: abandoned
        name: Trnava – Kúty
    output:
      - layer: railway
        geometry: line
        min_zoom: 10
        tags:
          class: abandoned
          name: Trnava – Kúty

  - name: Tram and metro from z10
    input:
      source: osm
      geometry: line
      tags:
        railway: tram
    output:
      - layer: railway
        geometry: line
        min_zoom: 10
        tags:
          class: tram

  - name: A tram line carries its colour and article
    input:
      source: osm
      geometry: line
      tags:
        railway: tram
        colour: "#E30613"
        wikipedia: sk:Električková doprava v Bratislave
    output:
      - layer: railway
        geometry: line
        min_zoom: 10
        tags:
          class: tram
          colour: "#E30613"
          wikipedia: sk:Električková doprava v Bratislave

  - name: A station is a named point from z9
    input:
      source: osm
      geometry: point
      tags:
        railway: station
        name: Žilina
        uic_ref: "5613206"
    output:
      - layer: station
        geometry: point
        min_zoom: 9
        tags:
          class: station
          name: Žilina
          uic_ref: "5613206"

  - name: A halt from z12
    input:
      source: osm
      geometry: point
      tags:
        railway: halt
        name: Pezinok zastávka
    output:
      - layer: station
        geometry: point
        min_zoom: 12
        tags:
          class: halt
          name: Pezinok zastávka

  - name: A level crossing is a trackside sign
    input:
      source: osm
      geometry: point
      tags:
        railway: level_crossing
    output:
      - layer: railway_point
        geometry: point
        min_zoom: 14
        tags:
          class: level_crossing

  - name: A switch carries its kind, a signal its aspect kind
    input:
      source: osm
      geometry: point
      tags:
        railway: switch
        railway:switch: double_slip
        ref: "12"
    output:
      - layer: railway_point
        geometry: point
        min_zoom: 14
        tags:
          class: switch
          switch_type: double_slip
          ref: "12"

  - name: A speed board carries speed and a signal the track bearing
    input:
      source: osm
      geometry: point
      tags:
        railway: signal
        railway:signal:speed_limit: DE-ESO:lf7
        railway:signal:speed_limit:speed: "80"
        rail_bearing: "270"
    output:
      - layer: railway_point
        geometry: point
        min_zoom: 14
        tags:
          class: signal
          signal_speed_limit: DE-ESO:lf7
          speed_limit: "80"
          bearing: 270

  - name: A line speed change is a point with both speeds
    input:
      source: osm
      geometry: point
      tags:
        rail_speed: "80"
        rail_speed_prev: "120"
    output:
      - layer: railway_point
        geometry: point
        min_zoom: 14
        tags:
          class: speed_change
          speed: 80
          speed_prev: 120

  - name: A milestone carries its position
    input:
      source: osm
      geometry: point
      tags:
        railway: milestone
        railway:position: "12.4"
    output:
      - layer: railway_point
        geometry: point
        min_zoom: 15
        tags:
          class: milestone
          position: "12.4"

  - name: A gondola in service from z10
    input:
      source: osm
      geometry: line
      tags:
        aerialway: gondola
        name: Skalnaté pleso
        aerialway:occupancy: "8"
    output:
      - layer: aerialway
        geometry: line
        min_zoom: 10
        tags:
          class: gondola
          state: active
          name: Skalnaté pleso
          occupancy: "8"

  - name: A proposed aerialway carries kind and state
    input:
      source: osm
      geometry: line
      tags:
        aerialway: proposed
        proposed: cable_car
    output:
      - layer: aerialway
        geometry: line
        min_zoom: 10
        tags:
          class: cable_car
          state: proposed

  - name: An aerialway under construction in the key prefix
    input:
      source: osm
      geometry: line
      tags:
        construction:aerialway: chair_lift
    output:
      - layer: aerialway
        geometry: line
        min_zoom: 10
        tags:
          class: chair_lift
          state: construction

  - name: A removed lift is an old aerialway
    input:
      source: osm
      geometry: line
      tags:
        abandoned:aerialway: drag_lift
    output:
      - layer: aerialway
        geometry: line
        min_zoom: 10
        tags:
          class: drag_lift
          state: abandoned

  - name: A dismantled goods ropeway is abandoned
    input:
      source: osm
      geometry: line
      tags:
        removed:aerialway: goods
        usage: industrial
    output:
      - layer: aerialway
        geometry: line
        min_zoom: 10
        tags:
          class: goods
          state: abandoned
          usage: industrial

  - name: An aerialway without a kind is still an aerialway
    input:
      source: osm
      geometry: line
      tags:
        aerialway: "yes"
    output:
      - layer: aerialway
        geometry: line
        min_zoom: 10
        tags:
          class: "yes"
          state: active

  - name: A disused chair lift
    input:
      source: osm
      geometry: line
      tags:
        aerialway: disused
        disused: chair_lift
    output:
      - layer: aerialway
        geometry: line
        min_zoom: 10
        tags:
          class: chair_lift
          state: disused

  - name: A chair lift with a proposed replacement stays in service
    input:
      source: osm
      geometry: line
      tags:
        aerialway: chair_lift
        proposed:aerialway: gondola
    output:
      - layer: aerialway
        geometry: line
        min_zoom: 10
        tags:
          class: chair_lift
          state: active

  - name: A lift with disused=yes doesn't run
    input:
      source: osm
      geometry: line
      tags:
        aerialway: drag_lift
        disused: "yes"
    output:
      - layer: aerialway
        geometry: line
        min_zoom: 10
        tags:
          class: drag_lift
          state: disused

  - name: A chair lift with abandoned=yes is abandoned
    input:
      source: osm
      geometry: line
      tags:
        aerialway: chair_lift
        abandoned: "yes"
    output:
      - layer: aerialway
        geometry: line
        min_zoom: 10
        tags:
          class: chair_lift
          state: abandoned

  - name: An aerialway station is a named point
    input:
      source: osm
      geometry: point
      tags:
        aerialway: station
        name: Lomnické sedlo
    output:
      - layer: aerialway_station
        geometry: point
        min_zoom: 12
        tags:
          class: station
          name: Lomnické sedlo

  - name: A road doesn't belong to railways
    input:
      source: osm
      geometry: line
      tags:
        highway: primary
    output: []
