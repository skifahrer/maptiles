# Planetiler custom schema – celá dopravná sieť z OSM v jednom `.pmtiles`.
#
# Vrstva `transportation` v základnej mape je stavaná na kreslenie: geometria
# zjednodušená podľa zoomu, atribúty pre štýl a všetko v jednom archíve so
# zvyškom mapy. Kto chce len siete, po ktorých sa dá cestovať, musel by si
# stiahnuť stovky MB. Tu je jeden archív so všetkým, po čom sa dá ísť: cesty,
# železnice, trajekty a lanovky – s menom, číslom, povrchom, prístupom
# a smerovosťou.
#
# Obmedzenia na ceste (výška, šírka, hmotnosť, rýchlosť) sú tu, nie vedľa:
# sú to atribúty tých istých ciest a v samostatnom archíve sa museli spájať
# cez `osm_id`.
#
# Hodnoty obmedzení sú reťazce zámerne. `double` v `tag_mappings` ide cez
# `Parse.parseDoubleOrNull`, ktorý vezme číslo zo začiatku a zvyšok zahodí:
# z „12'6\"" je 12 m, z „50 mph" je 50. Nula chýb v builde, len zle nakreslená
# mapa. Do dlaždice ide to, čo je v OSM; číslo si parsuje smerovanie samo.
# `lanes` a `layer` sú `integer` – celé čísla bez jednotky.
#
# Nie je to navigačný graf: dlaždica je kreslený obraz s orezanou geometriou,
# bez odbočovacích zákazov a topológie. Na to je Valhallin graf.
#
# Zoomy sú tu hlavné rozhodnutie – chodníkov a poľných ciest je rádovo viac
# než ciest I. triedy:
#
#     diaľnice, cesty I. triedy, hlavné železnice   od z6
#     cesty II. a III. triedy                        od z9
#     ostatné cesty pre autá, električky, metro,     od z11
#       trajekty, lanovky
#     poľné a lesné cesty (`track`)                  od z12
#     chodníky, pešie cesty, cyklotrasy, schody      od z13
#     `service` (príjazdy, uličky parkovísk)         od z14
#
# Čo má vyšší `min_zoom`, než je maxzoom dlaždíc, Planetiler zahodí a nepovie
# nič – stráži to `workers/transport/build.sh`.
#
# Predfilter (`filter.txt`) musí pustiť každú triedu, ktorá je tu; stráži to
# `workers/lint/transport.py`. Na obmedzenia to neplatí: `osmium tags-filter`
# berie objekt celý aj s ostatnými tagmi.
schema_name: FricoMaps dopravná sieť
schema_description: >-
  Všetko, po čom sa dá cestovať – cesty od diaľnice po schody, železnice,
  električky a metro, trajekty a lanovky, s menom, číslom, povrchom
  a prístupom
attribution: <a href="https://www.openstreetmap.org/copyright">© OpenStreetMap prispievatelia</a>

sources:
  osm:
    type: osm
    local_path: data/transport.osm.pbf

# `layer` a `lanes` sú celé čísla; rozmery a rýchlosť ostávajú reťazcom, lebo
# nesú jednotku (rozpis v hlavičke)
tag_mappings:
  layer: integer
  lanes: integer

definitions:
  # atribúty sú pre všetky bloky rovnaké a píšu sa raz
  - &transport_attrs
    # oboje sa berie z toho, čím sa blok trafil (`match_value`, `match_key`),
    # nie vypisuje pri každom bloku – druhá kópia zoznamu tried by sa rozišla:
    #   class  hodnota tagu z OSM (`motorway`, `track`, `rail`, `ferry`)
    #   druh   kľúč tagu, teda rodina (`highway`, `railway`, `route`,
    #          `aerialway`) – „všetko koľajové" je jedna podmienka
    - key: class
      type: match_value
    - key: druh
      type: match_key
    # `ref` je číslo cesty (D1, I/18), `network` typ číslovania – bez nich sa
    # cesta nedá pomenovať tak, ako je na tabuli
    - key: name
    - key: ref
    - key: network
    # či sa po tom dá ísť, a ako
    - key: access
    - key: foot
    - key: bicycle
    - key: horse
    - key: motor_vehicle
    - key: oneway
    # povrch: pri pešej a poľnej ceste hlavná informácia o tom, či sa tadiaľ
    # dá ísť za dažďa
    - key: surface
    - key: tracktype
    # druh `service` cesty – inak sa nedá odlíšiť príjazd k domu od uličky
    # na parkovisku
    - key: service
    # kde to je voči ostatnému; `layer` hovorí poradie na mimoúrovňovej križovatke
    - key: bridge
    - key: tunnel
    - key: layer
    # železnica: `usage` a `electrified` robia z koľaje trať. Na ceste tie
    # tagy nie sú, takže atribút nevznikne.
    - key: usage
    - key: electrified
    # či sa tam vozidlo zmestí – reťazce s jednotkou tak, ako sú v OSM.
    # `maxheight:physical` je nameraná výška podjazdu, keď tabuľa chýba.
    - key: maxheight
    - key: maxheight_physical
      value:
        tag_value: "maxheight:physical"
    - key: maxwidth
    - key: maxweight
    # rýchlosť, pruhy, šírka a stúpanie sú takmer na každej ceste; v archíve
    # sú od začiatku, lebo ho číta aj ten, kto nekreslí
    - key: maxspeed
    - key: width
    - key: lanes
    - key: incline
    - key: osm_id
      value: '${ feature.id }'
      type: long
    - key: osm_type
      value: '${ feature.osm_type }'

layers:
  - id: transport
    features:
      # 1. diaľnice a cesty I. triedy: od z6 – kostra siete
      - source: osm
        geometry: line
        min_zoom: 6
        include_when:
          highway: [motorway, trunk, primary, motorway_link, trunk_link,
                    primary_link]
        attributes: *transport_attrs

      # 2. cesty II. a III. triedy: od z9
      - source: osm
        geometry: line
        min_zoom: 9
        include_when:
          highway: [secondary, tertiary, secondary_link, tertiary_link]
        attributes: *transport_attrs

      # 3. ostatné cesty pre autá: od z11. `busway` je koridor pre autobusy,
      # teda cesta, po ktorej ide verejná doprava.
      - source: osm
        geometry: line
        min_zoom: 11
        include_when:
          highway: [unclassified, residential, living_street, pedestrian,
                    road, busway, escape, raceway]
        attributes: *transport_attrs

      # 4. poľné a lesné cesty: od z12 – najhustejšia trieda na vidieku, ale
      # zároveň to, po čom sa v teréne naozaj chodí
      - source: osm
        geometry: line
        min_zoom: 12
        include_when:
          highway: [track]
        attributes: *transport_attrs

      # 5. chodníky, pešie cesty, cyklotrasy, schody: od z13
      - source: osm
        geometry: line
        min_zoom: 13
        include_when:
          highway: [path, footway, cycleway, bridleway, steps, corridor,
                    via_ferrata]
        attributes: *transport_attrs

      # 6. `service`: od z14 – v obci je ich viac než všetkých ostatných ciest
      # dokopy a na nižšom zoome by z nich bola len šeď
      - source: osm
        geometry: line
        min_zoom: 14
        include_when:
          highway: [service]
        attributes: *transport_attrs

      # 7. hlavné železnice: od z6, kostra ako diaľnice. `construction`,
      # `abandoned`, `disused`, `razed` a `platform` sem nepatria – po tých sa
      # nedá ísť a meno vrstvy je sľub.
      - source: osm
        geometry: line
        min_zoom: 6
        include_when:
          railway: [rail, narrow_gauge]
        attributes: *transport_attrs

      # 8. mestská a horská koľajová doprava: od z11
      - source: osm
        geometry: line
        min_zoom: 11
        include_when:
          railway: [light_rail, subway, tram, monorail, funicular,
                    preserved, miniature]
        attributes: *transport_attrs

      # 9. trajekty: od z11 – na niektorých miestach jediný spôsob, ako sa
      # dostať cez rieku
      - source: osm
        geometry: line
        min_zoom: 11
        include_when:
          route: [ferry]
        attributes: *transport_attrs

      # 10. lanovky a vleky: od z11 – v horách doprava ako každá iná
      - source: osm
        geometry: line
        min_zoom: 11
        include_when:
          aerialway: [cable_car, gondola, mixed_lift, chair_lift, drag_lift,
                      t-bar, j-bar, platter, rope_tow, magic_carpet, zip_line,
                      goods]
        attributes: *transport_attrs

    # cesta je v OSM rozsekaná na križovatkách; zlepenie nie je len úspora
    # miesta – štítok sa kreslí podľa dĺžky čiary, takže na dvadsiatich
    # krátkych úsekoch by bolo dvadsať štítkov
    tile_post_process:
      merge_line_strings:
        min_length: 0

# testy: `java -jar planetiler.jar verify workers/transport/transport.yml`
examples:
  - name: Diaľnica je v sieti od z6 aj s číslom
    input:
      source: osm
      geometry: line
      tags:
        highway: motorway
        ref: D1
        oneway: "yes"
        surface: asphalt
    output:
      - layer: transport
        geometry: line
        min_zoom: 6
        tags:
          class: motorway
          druh: highway
          ref: D1
          oneway: "yes"
          surface: asphalt

  - name: Chodník je v sieti tiež – od z13
    input:
      source: osm
      geometry: line
      tags:
        highway: footway
        surface: gravel
    output:
      - layer: transport
        geometry: line
        min_zoom: 13
        tags:
          class: footway
          druh: highway
          surface: gravel

  - name: Poľná cesta má vlastný zoom (z12) a nesie `tracktype`
    input:
      source: osm
      geometry: line
      tags:
        highway: track
        tracktype: grade3
    output:
      - layer: transport
        geometry: line
        min_zoom: 12
        tags:
          class: track
          druh: highway
          tracktype: grade3

  - name: Trať je v sieti od z6 a povie, či je elektrifikovaná
    input:
      source: osm
      geometry: line
      tags:
        railway: rail
        usage: main
        electrified: contact_line
        name: Košice – Žilina
    output:
      - layer: transport
        geometry: line
        min_zoom: 6
        tags:
          class: rail
          druh: railway
          usage: main
          electrified: contact_line
          name: Košice – Žilina

  - name: Električka je koľajová doprava, ale až od z11
    input:
      source: osm
      geometry: line
      tags:
        railway: tram
    output:
      - layer: transport
        geometry: line
        min_zoom: 11
        tags:
          class: tram
          druh: railway

  - name: Zrušená trať v sieti NIE JE – po nej sa ísť nedá
    input:
      source: osm
      geometry: line
      tags:
        railway: abandoned
    output: []

  - name: Nástupište nie je trať
    input:
      source: osm
      geometry: line
      tags:
        railway: platform
    output: []

  - name: Trajekt je spojenie ako každé iné
    input:
      source: osm
      geometry: line
      tags:
        route: ferry
        name: Prievoz Vojka – Kyselica
    output:
      - layer: transport
        geometry: line
        min_zoom: 11
        tags:
          class: ferry
          druh: route
          name: Prievoz Vojka – Kyselica

  - name: Lanovka je doprava, nie atrakcia
    input:
      source: osm
      geometry: line
      tags:
        aerialway: gondola
        name: Skalnaté pleso
    output:
      - layer: transport
        geometry: line
        min_zoom: 11
        tags:
          class: gondola
          druh: aerialway
          name: Skalnaté pleso

  - name: Príjazd k domu je `service` – v sieti je, ale až od z14
    input:
      source: osm
      geometry: line
      tags:
        highway: service
        service: driveway
    output:
      - layer: transport
        geometry: line
        min_zoom: 14
        tags:
          class: service
          druh: highway
          service: driveway

  - name: Podjazd pod mostom – výška je na ceste POD ním, ktorá `bridge` nemá
    input:
      source: osm
      geometry: line
      tags:
        highway: secondary
        ref: II/584
        maxheight: "3.8"
    output:
      - layer: transport
        geometry: line
        min_zoom: 9
        tags:
          class: secondary
          druh: highway
          ref: II/584
          maxheight: "3.8"
          bridge: null
          tunnel: null

  - name: Jednotka v hodnote sa NEPREPOČÍTAVA, ide do dlaždice ako je
    input:
      source: osm
      geometry: line
      tags:
        highway: tertiary
        maxheight: "3.8 m"
        maxweight: "7.5"
    output:
      - layer: transport
        geometry: line
        min_zoom: 9
        tags:
          maxheight: "3.8 m"
          maxweight: "7.5"

  - name: Rýchlosť a pruhy sú na tej istej ceste ako jej meno
    input:
      source: osm
      geometry: line
      tags:
        highway: primary
        name: Levočská
        maxspeed: "90"
        lanes: "2"
    output:
      - layer: transport
        geometry: line
        min_zoom: 6
        tags:
          class: primary
          druh: highway
          name: Levočská
          maxspeed: "90"
          lanes: 2

  - name: Rieka nie je doprava
    input:
      source: osm
      geometry: line
      tags:
        waterway: river
        name: Váh
    output: []
