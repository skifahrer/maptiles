# Planetiler custom schema – every OSM road a car can drive, in one `.pmtiles`.
# Roads, tracks and ferries with name, number, surface, access and restrictions; what
# cars don't fit is `paths.yml`, railways the `railways` package. Restriction values stay
# strings with their unit (`double` would read "12'6\"" as 12 m). Not a routing graph.
# Zooms: motorway/trunk z6, secondary z9, other roads z11, track z12, service z14.
schema_name: FricoMaps roads
schema_description: >-
  Every road a car can drive – motorways to tracks, and ferries,
  with name, number, surface, access and road limits
attribution: <a href="https://www.openstreetmap.org/copyright">© OpenStreetMap contributors</a>

sources:
  osm:
    type: osm
    local_path: data/transport.osm.pbf
  # `speed.py`: where a road's speed context changes; the app reads the limit by country
  computed:
    type: geojson
    local_path: data/computed-signs.geojson

# `layer` and `lanes` are integers; sizes and speed keep their unit as strings
tag_mappings:
  layer: integer
  lanes: integer

definitions:
  # attributes written once for every block
  - &transport_attrs
    # from what the block matched: `class` the tag value, `family` the tag key
    - key: class
      type: match_value
    - key: family
      type: match_key
    # `ref` is the road number (D1, I/18), `network` its numbering
    - key: name
    - key: ref
    - key: network
    # whether and how one may go
    - key: access
    - key: foot
    - key: bicycle
    - key: horse
    - key: motor_vehicle
    - key: oneway
    # surface: on paths and tracks, whether it's passable in rain
    - key: surface
    - key: tracktype
    # the kind of `service` road – a driveway vs a car park aisle
    - key: service
    # `layer` gives the order at a grade-separated junction
    - key: bridge
    - key: tunnel
    - key: layer
    # whether a vehicle fits – strings with units as in OSM; `maxheight:physical` is measured
    - key: maxheight
    - key: maxheight_physical
      value:
        tag_value: "maxheight:physical"
    - key: maxwidth
    - key: maxweight
    # speed, lanes, width and incline are on nearly every road
    - key: maxspeed
    - key: width
    - key: lanes
    - key: incline
    # `urban`, `rural`, `motorway`…: which default limit applies, from `speed.py`
    - key: speed_context
    - key: osm_id
      value: '${ feature.id }'
      type: long
    - key: osm_type
      value: '${ feature.osm_type }'

layers:
  - id: transport
    features:
      # 1. motorways and trunk roads: from z6 – the network's skeleton
      - source: osm
        geometry: line
        min_zoom: 6
        include_when:
          highway: [motorway, trunk, primary, motorway_link, trunk_link,
                    primary_link]
        attributes: *transport_attrs

      # 2. cesty II. a III. triedy: od z9
      - source: osm
        geometry: line
        min_zoom: 9
        include_when:
          highway: [secondary, tertiary, secondary_link, tertiary_link]
        attributes: *transport_attrs

      # 3. other roads for cars: from z11; `busway` and `bus_guideway` carry public transport
      - source: osm
        geometry: line
        min_zoom: 11
        include_when:
          highway: [unclassified, residential, living_street, road,
                    busway, bus_guideway, escape, raceway]
        attributes: *transport_attrs

      # 4. tracks: from z12 – a tractor or forestry truck drives them
      - source: osm
        geometry: line
        min_zoom: 12
        include_when:
          highway: [track]
        attributes: *transport_attrs

      # 5. `service`: from z14 – more of them than all other roads in a village
      - source: osm
        geometry: line
        min_zoom: 14
        include_when:
          highway: [service]
        attributes: *transport_attrs

      # 6. ferries: from z11 – sometimes the only way across a river
      - source: osm
        geometry: line
        min_zoom: 11
        include_when:
          route: [ferry]
        attributes: *transport_attrs

    # roads split at junctions merge, or twenty short segments get twenty shields
    tile_post_process:
      merge_line_strings:
        min_length: 0

  # traffic signs: `signs.py` adds `sign`, the image's name (`sk.ts.253-50`)
  - id: traffic_sign
    features:
      - source: osm
        geometry: point
        min_zoom: 14
        include_when:
          traffic_sign: __any__
          traffic_sign:forward: __any__
          traffic_sign:backward: __any__
          highway: [stop, give_way, traffic_signals, speed_camera]
        attributes:
          # sprite image `sk.ts.253-50`; none when the country can't be told
          - key: sign
          # as tagged: `SK:253[50];SK:506`
          - key: traffic_sign
          - key: highway
          # `forward`, `backward`, `both` or degrees
          - key: direction
            value:
              tag_value: sign_direction
          # `path` on a way cars don't fit: the Paths layer draws it
          - key: way
            value:
              tag_value: sign_on
          - key: maxspeed
          - key: osm_id
            value: '${ feature.id }'
            type: long

  # computed signs: where a road's default limit changes or a street ends, facing the traffic that enters
  - id: computed_sign
    features:
      - source: computed
        geometry: point
        min_zoom: 14
        attributes:
          - key: kind
          - key: speed_context
          - key: country
          - key: direction
            type: integer
          - key: osm_way
            type: long

  # addresses: street and house number, to search offline
  - id: addresses
    features:
      - source: osm
        geometry: point
        min_zoom: 14
        include_when: &adresa
          addr:housenumber: __any__
          addr:conscriptionnumber: __any__
        attributes: &adresa_attrs
          - key: addr:housenumber
          - key: addr:conscriptionnumber
          - key: addr:streetnumber
          - key: addr:street
          # a village without streets uses `addr:place`
          - key: addr:place
          - key: addr:city
          - key: addr:postcode
          - key: osm_id
            value: '${ feature.id }'
            type: long
          - key: osm_type
            value: '${ feature.osm_type }'

      # the same place as `housenumber` in the base map
      - source: osm
        geometry: polygon_centroid_if_convex
        min_zoom: 14
        include_when: *adresa
        attributes: *adresa_attrs

# testy: `java -jar planetiler.jar verify workers/transport/transport.yml`
examples:
  - name: A road keeps the speed context `speed.py` gave it
    input:
      source: osm
      geometry: line
      tags:
        highway: primary
        ref: "2"
        speed_context: urban
    output:
      - layer: transport
        geometry: line
        min_zoom: 6
        tags:
          class: primary
          family: highway
          ref: "2"
          speed_context: urban

  - name: A computed sign is a point with its context and the way it faces
    input:
      source: computed
      geometry: point
      tags:
        kind: speed
        speed_context: urban
        country: SK
        direction: 90
        osm_way: 100
    output:
      - layer: computed_sign
        geometry: point
        min_zoom: 14
        tags:
          kind: speed
          speed_context: urban
          country: SK
          direction: 90
          osm_way: 100

  - name: A computed dead-end sign has no speed context
    input:
      source: computed
      geometry: point
      tags:
        kind: dead-end
        country: SK
        direction: 0
        osm_way: 501
    output:
      - layer: computed_sign
        geometry: point
        min_zoom: 14
        tags:
          kind: dead-end
          country: SK
          direction: 0
          osm_way: 501

  - name: A motorway is in the network from z6 with its number
    input:
      source: osm
      geometry: line
      tags:
        highway: motorway
        ref: D1
        oneway: "yes"
        surface: asphalt
    output:
      - layer: transport
        geometry: line
        min_zoom: 6
        tags:
          class: motorway
          family: highway
          ref: D1
          oneway: "yes"
          surface: asphalt

  - name: A bus guideway is a public transport road
    input:
      source: osm
      geometry: line
      tags:
        highway: bus_guideway
    output:
      - layer: transport
        geometry: line
        min_zoom: 11
        tags:
          class: bus_guideway
          family: highway

  - name: A footway is a path, not a road – the `paths` package carries it
    input:
      source: osm
      geometry: line
      tags:
        highway: footway
    output: []

  - name: A pedestrian street is a path – cars don't go there
    input:
      source: osm
      geometry: line
      tags:
        highway: pedestrian
        name: Hlavná
    output: []

  - name: An aerialway is a path – it carries people, not cars
    input:
      source: osm
      geometry: line
      tags:
        aerialway: gondola
    output: []

  - name: A track has its own zoom (z12) and carries `tracktype`
    input:
      source: osm
      geometry: line
      tags:
        highway: track
        tracktype: grade3
    output:
      - layer: transport
        geometry: line
        min_zoom: 12
        tags:
          class: track
          family: highway
          tracktype: grade3

  - name: A railway is NOT in roads – the `railways` package carries it
    input:
      source: osm
      geometry: line
      tags:
        railway: rail
        name: Košice – Žilina
    output: []

  - name: A tram isn't in roads either
    input:
      source: osm
      geometry: line
      tags:
        railway: tram
    output: []

  - name: A ferry is a link like any other
    input:
      source: osm
      geometry: line
      tags:
        route: ferry
        name: Prievoz Vojka – Kyselica
    output:
      - layer: transport
        geometry: line
        min_zoom: 11
        tags:
          class: ferry
          family: route
          name: Prievoz Vojka – Kyselica

  - name: A driveway is `service` – in the network, but only from z14
    input:
      source: osm
      geometry: line
      tags:
        highway: service
        service: driveway
    output:
      - layer: transport
        geometry: line
        min_zoom: 14
        tags:
          class: service
          family: highway
          service: driveway

  - name: An underpass – the height is on the road BELOW, which has no `bridge`
    input:
      source: osm
      geometry: line
      tags:
        highway: secondary
        ref: II/584
        maxheight: "3.8"
    output:
      - layer: transport
        geometry: line
        min_zoom: 9
        tags:
          class: secondary
          family: highway
          ref: II/584
          maxheight: "3.8"
          bridge: null
          tunnel: null

  - name: A unit in the value is NOT converted, it goes into the tile as is
    input:
      source: osm
      geometry: line
      tags:
        highway: tertiary
        maxheight: "3.8 m"
        maxweight: "7.5"
    output:
      - layer: transport
        geometry: line
        min_zoom: 9
        tags:
          maxheight: "3.8 m"
          maxweight: "7.5"

  - name: Speed and lanes are on the same road as its name
    input:
      source: osm
      geometry: line
      tags:
        highway: primary
        name: Levočská
        maxspeed: "90"
        lanes: "2"
    output:
      - layer: transport
        geometry: line
        min_zoom: 6
        tags:
          class: primary
          family: highway
          name: Levočská
          maxspeed: "90"
          lanes: 2

  - name: An address point carries street and number
    input:
      source: osm
      geometry: point
      tags:
        addr:street: Hlavná
        addr:housenumber: 1234/5
        addr:conscriptionnumber: "1234"
        addr:streetnumber: "5"
        addr:city: Poprad
    output:
      - layer: addresses
        geometry: point
        min_zoom: 14
        tags:
          addr:street: Hlavná
          addr:housenumber: 1234/5
          addr:conscriptionnumber: "1234"
          addr:streetnumber: "5"
          addr:city: Poprad

  - name: A building with an address is an address point
    input:
      source: osm
      geometry: polygon
      tags:
        building: house
        addr:place: Ždiar
        addr:conscriptionnumber: "112"
    output:
      - layer: addresses
        geometry: point
        min_zoom: 14
        tags:
          addr:place: Ždiar
          addr:conscriptionnumber: "112"

  - name: A building without an address isn't in addresses
    input:
      source: osm
      geometry: polygon
      tags:
        building: house
    output: []

  - name: A river isn't transport
    input:
      source: osm
      geometry: line
      tags:
        waterway: river
        name: Váh
    output: []

  - name: A speed sign carries its sprite name and value as tagged
    input:
      source: osm
      geometry: point
      tags:
        traffic_sign: "SK:253[50]"
        sign: sk.ts.253-50
        sign_direction: forward
    output:
      - layer: traffic_sign
        geometry: point
        min_zoom: 14
        tags:
          sign: sk.ts.253-50
          traffic_sign: "SK:253[50]"
          direction: forward

  - name: A sign on a path says so, for the Paths layer
    input:
      source: osm
      geometry: point
      tags:
        traffic_sign: "SK:C8"
        sign: sk.ts.c8
        sign_on: path
    output:
      - layer: traffic_sign
        geometry: point
        tags:
          sign: sk.ts.c8
          traffic_sign: "SK:C8"
          way: path

  - name: A stop node is a sign without `traffic_sign`
    input:
      source: osm
      geometry: point
      tags:
        highway: stop
        sign: sk.ts.stop
    output:
      - layer: traffic_sign
        geometry: point
        tags:
          sign: sk.ts.stop
          highway: stop

  - name: A sign facing one way only
    input:
      source: osm
      geometry: point
      tags:
        traffic_sign:backward: "SK:230"
        sign: sk.ts.230
    output:
      - layer: traffic_sign
        geometry: point
        tags:
          sign: sk.ts.230

  - name: A crossing isn't a sign
    input:
      source: osm
      geometry: point
      tags:
        highway: crossing
    output: []

