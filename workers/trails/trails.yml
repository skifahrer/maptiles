# Planetiler custom schema – značené trasy (turistické, cyklo, bežky, jazdecké).
#
# Prečo vlastné dlaždice a nie OpenMapTiles: trasa je v OSM `type=route`
# **relácia** nad cudzími cestami a schéma OpenMapTiles relácie trás nemá –
# v dlaždiciach je len cesta, bez značenia. Značenie (farba pásika, sieť,
# názov) sa preto vyťahuje samostatne a ide do vlastného `.pmtiles`.
#
# Vstup vyrába workflow build-map-region.yml:
#   osmium tags-filter (r/route=…) → workers/trails/routes.py → data/trails.geojson
#
# Jedna línia = jedna trasa na jednej ceste. Po ceste ich vedie aj päť naraz,
# takže každá dostane svoj **pruh** (`side` = na ktorú stranu, `off` = koľká
# je v rade na tej strane) a štýl ju podľa neho posunie (`line-offset`) vedľa
# cesty. Samotná cesta tak zostane vidieť aj s tým, aká je. Pešie trasy idú na
# jednu stranu, kolesové na druhú – po jednom chodníku vedie bežne turistická
# značka aj cyklotrasa a takto obe začínajú hneď pri ňom.
#
# `mark`, `mark_bg` a `mark_fg` sú TURISTICKÁ ZNAČKA, ako je namaľovaná na
# strome (biely alebo žltý štvorec s farebným pásom, trojuholník na vrchol,
# bicykel na cyklotrase). Kreslí sa pozdĺž trasy v pravidelných intervaloch –
# je to to, čo človek v teréne sleduje, kým ikonka druhu trasy hovorí len,
# že tadiaľ ide „nejaká turistická".
#
# `way` (`path` / `road`) hovorí, po čom trasa vedie. Odstup pásika od čiary
# pod ním totiž nie je jedno číslo: asfaltka je v mape niekoľkonásobne širšia
# než chodník, takže odstup, pri ktorom sa pásik lepí na chodník, leží
# uprostred cesty. Aký odstup pre ktorý prípad, si drží štýl.
#
# `tier` je dôležitosť trasy podľa siete (iwn/nwn/rwn/lwn). Riadi, od akého
# zoomu je trasa v dlaždiciach: diaľkovú trasu má zmysel vidieť aj
# z prehľadu, miestny okruh až keď je vidieť aj cesta pod ním.
schema_name: FricoMaps značené trasy
schema_description: Turistické chodníky, cyklotrasy, bežky a jazdecké trasy z OSM relácií
attribution: <a href="https://www.openstreetmap.org/copyright">© OpenStreetMap prispievatelia</a>

sources:
  trails:
    type: geojson
    local_path: data/trails.geojson

layers:
  - id: trail
    features:
      # diaľkové trasy (E-cesty, národné magistrály) – vidieť ich už z diaľky
      - source: trails
        geometry: line
        min_zoom: 8
        include_when:
          tier:
            - international
            - national
        attributes: &trail_attributes
          # druh trasy – štýl podľa neho volí farbu, hrúbku aj ikonu
          - key: route
          # farba značky: pomenovaná (red, blue, …) → prefarbiteľná paletou
          - key: colour
          # surový hex z OSM, keď farba nie je žiadna z pomenovaných
          - key: hex
          # ZNAČKA, AKO JE NA STROME – tvar, podklad a farba. Sú to tri
          # atribúty preto, že štýl z nich skladá meno obrázka v sprite
          # (`mark-<mark_bg>-<mark_fg>-<mark>`) a developer mode vie tvar
          # prepnúť bez toho, aby prišiel o farby z OSM. Trasa, ktorá značku
          # nemá (neznáma farba), ich nemá ani jeden a kreslí sa jej ikonka
          # druhu trasy.
          - key: mark
          - key: mark_bg
          - key: mark_fg
          - key: network
          - key: tier
          - key: name
          - key: ref
          # pruh vedľa cesty: strana (+1 pešie, −1 kolesové), poradie v rade
          # na tej strane (od nuly) a koľko trás na tej ceste celkovo je
          - key: side
            type: integer
          - key: off
            type: double
          - key: cnt
            type: integer
          # po čom trasa vedie – `path` (chodník, lesná cesta) alebo `road`
          - key: way
          # id relácie – v mape sa dá kliknúť a dohľadať trasu v OSM
          - key: rel
            type: long

      # regionálne značenie – väčšina turistických trás u nás
      - source: trails
        geometry: line
        min_zoom: 10
        include_when:
          tier: regional
        attributes: *trail_attributes

      # miestne okruhy a náučné chodníky – až keď je vidieť aj cesta pod nimi
      - source: trails
        geometry: line
        min_zoom: 12
        include_when:
          tier: local
        attributes: *trail_attributes

    # Trasa je v OSM poskladaná z desiatok krátkych ciest. Zlepenie úsekov
    # s rovnakými atribútmi (teda tej istej trasy v tom istom pruhu) je tu
    # kvôli popiskom: názov sa kreslí pozdĺž línie a na 200-metrovom úseku
    # sa nezmestí ani slovo. Zlepené línie sú aj menšie.
    tile_post_process:
      merge_line_strings:
        min_length: 0
