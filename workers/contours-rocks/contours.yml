# Planetiler custom schema – vrstevnice z digitálneho modelu terénu.
#
# OSM výškové dáta nemá, terén ide z externého DEM (Sonny's LiDAR DTM alebo
# Copernicus GLO-30). Vstup vyrába build-map-region.yml cez gdal_contour.
# Skaly majú vlastný .pmtiles (rocks.yml) – iný maxzoom.
#
# `level` delí vrstevnice na tri triedy:
#   major = násobky 100 m, mid = násobky 50 m, minor = ostatné
schema_name: FricoMaps vrstevnice
schema_description: Vrstevnice a nadmorská výška z DEM
attribution: <a href="https://sonny.4lima.de/">Sonny's LiDAR DTM</a> / <a href="https://spacedata.copernicus.eu/">Copernicus DEM</a>

sources:
  contours:
    type: geopackage
    local_path: data/contours.gpkg
    projection: EPSG:4326

layers:
  - id: contour
    features:
      # hlavné vrstevnice (100 m) – jediná trieda pod z12; do z10 sa
      # nekreslia vôbec (sivý závoj). `min_zoom` a `minzoom` v štýle sa musia
      # zhodovať, stráži workers/lint/zoom-floor.py.
      - source: contours
        geometry: line
        min_zoom: 11
        include_when:
          level: major
        attributes:
          - key: ele
            type: integer
          - key: level
      # polovičné (50 m)
      - source: contours
        geometry: line
        min_zoom: 12
        include_when:
          level: mid
        attributes:
          - key: ele
            type: integer
          - key: level
      # základný interval – až na detailnom zoome, inak by mapa zčernela
      - source: contours
        geometry: line
        min_zoom: 13
        include_when:
          level: minor
        attributes:
          - key: ele
            type: integer
          - key: level
