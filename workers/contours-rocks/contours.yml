# Planetiler custom schema – contours from a digital terrain model.
#
# OSM has no heights; the input comes from an external DEM via gdal_contour.
# `level`: major = multiples of 100 m, mid = of 50 m, minor = the rest.
schema_name: FricoMaps contours
schema_description: Contours and elevation from a DEM
attribution: © Richard Dvorský / <a href="https://www.geoportal.sk/">ÚGKK SR · DMR 5.0 (LiDAR) · CC BY 4.0</a> / <a href="https://sonny.4lima.de/">Sonny's LiDAR DTM</a> / <a href="https://spacedata.copernicus.eu/">Copernicus DEM</a>

sources:
  contours:
    type: geopackage
    local_path: data/contours.gpkg
    projection: EPSG:4326

layers:
  - id: contour
    features:
      # major contours (100 m) – the only class below z12; `min_zoom` must
      # match the style's `minzoom`, workers/lint/zoom-floor.py guards it
      - source: contours
        geometry: line
        min_zoom: 11
        include_when:
          level: major
        attributes:
          - key: ele
            type: integer
          - key: level
      # mid (50 m)
      - source: contours
        geometry: line
        min_zoom: 12
        include_when:
          level: mid
        attributes:
          - key: ele
            type: integer
          - key: level
      # the base interval – only zoomed in, or the map turns black
      - source: contours
        geometry: line
        min_zoom: 13
        include_when:
          level: minor
        attributes:
          - key: ele
            type: integer
          - key: level
