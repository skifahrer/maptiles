# Planetiler custom schema – the rock areas alone, their own .pmtiles.
#
# Apart from contours: a .pmtiles has one maxzoom and the two want different ones.
# data/rock.gpkg comes from rock-areas.py (`slope`) or rocks-shading/build.py
# (`dark`); only one is filled. One class (`class` always `steep`).
schema_name: FricoMaps rocks
schema_description: Rock areas from an elevation model or hillshading tiles
attribution: © Richard Dvorský / <a href="https://www.geoportal.sk/">ÚGKK SR · DMR 5.0 (LiDAR) · CC BY 4.0</a> / <a href="https://sonny.4lima.de/">Sonny's LiDAR DTM</a> / <a href="https://spacedata.copernicus.eu/">Copernicus DEM</a> / <a href="https://www.freemap.sk/">freemap.sk</a>

sources:
  rock:
    type: geopackage
    local_path: data/rock.gpkg
    projection: EPSG:4326

layers:
  # min_zoom 11: below it rocks are a grey smudge; the style's `rock-area`
  # minzoom must match – workers/lint/zoom-floor.py guards it
  - id: rock
    features:
      - source: rock
        geometry: polygon
        min_zoom: 11
        attributes:
          - key: class
          # slope in degrees – only for rocks from a DEM
          - key: slope
            type: integer
          # grey levels under the threshold – only for rocks from hillshading
          - key: dark
            type: integer
          # area in m² – so the style can tell a crag from a crumb
          - key: area
            type: integer
