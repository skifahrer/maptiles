# Planetiler custom schema – samotné skalné plochy, vlastný .pmtiles.
#
# Zvlášť od vrstevníc, lebo .pmtiles má jeden maxzoom a tie dve vrstvy ho
# chcú iný. Nad maxzoom sa dlaždice naťahujú overzoomom.
#
# Vstup data/rock.gpkg robí buď rock-areas.py (atribút `slope`), alebo
# rocks-shading/build.py (`dark`); vždy je vyplnený len jeden.
# Jedna trieda (`class` vždy `steep`) – všetko sa kreslí rovnako sivo.
# Diery v plochách sú súčasť tvaru; zapĺňanie je vypnutá voľba.
schema_name: FricoMaps skaly
schema_description: Skalné plochy z výškového modelu alebo z tieňovaných dlaždíc
attribution: <a href="https://sonny.4lima.de/">Sonny's LiDAR DTM</a> / <a href="https://spacedata.copernicus.eu/">Copernicus DEM</a> / <a href="https://www.freemap.sk/">freemap.sk</a>

sources:
  rock:
    type: geopackage
    local_path: data/rock.gpkg
    projection: EPSG:4326

layers:
  # min_zoom 11: pod ním je zo skál sivá škvrna bez informácie. To isté dno
  # majú vrstevnice. Nad z11 malé plochy zahodí Planetiler sám.
  # To isté číslo musí byť v štýle (`minzoom` vrstvy `rock-area`) –
  # stráži workers/lint/zoom-floor.py.
  - id: rock
    features:
      - source: rock
        geometry: polygon
        min_zoom: 11
        attributes:
          - key: class
          # sklon v stupňoch – len pri skalách z DEM
          - key: slope
            type: integer
          # o koľko stupňov šedej pod prahom – len pri skalách z tieňovania
          - key: dark
            type: integer
          # plocha v m² – nech sa dá v štýle rozlíšiť bralo od odrobinky
          - key: area
            type: integer
