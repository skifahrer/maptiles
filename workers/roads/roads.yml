# Planetiler custom schema – OBMEDZENIA NA CESTE, ktoré OpenMapTiles nemá.
#
# PREČO VLASTNÁ SCHÉMA. Vrstva `transportation` OpenMapTiles nesie presne toto:
#
#   class, subclass, network, oneway, ramp, brunnel, service, access, toll,
#   expressway, layer, level, indoor, bicycle, foot, horse, mtb_scale,
#   official, surface
#
# Teda žiadne `maxheight`, `maxwidth`, `maxweight`, `maxspeed`, `width` ani
# `lanes` – a nedá sa to „zapnúť", v základných dlaždiciach tie hodnoty
# jednoducho nie sú. Musia sa vytiahnuť z toho istého PBF druhýkrát, presne ako
# krajinné prvky (`workers/features/features.yml`) a značené trasy.
#
# ČO TÁTO VRSTVA NIE JE: nie je to navigácia. Je to údaj NA POZRETIE – „pod
# týmto mostom je 3,8 m" –, nie graf, po ktorom sa dá viesť trasa. Na to je
# `docs/navigation.md` a Valhallin graf; dlaždica je kreslený obraz s orezanou
# a zjednodušenou geometriou, bez odbočovacích zákazov.
#
# HODNOTY SÚ REŤAZCE, A JE TO ZÁMER. Lákalo by dať `maxheight: double` do
# `tag_mappings` a mať v dlaždici číslo. Planetiler ho ale parsuje cez
# `Parse.parseDoubleOrNull`, ktorý po zlyhaní `Double.parseDouble` skúsi
# `NumberFormat.parse` (planetiler-core, `util/Parse.java`, riadok 143) – a ten
# vezme ČÍSLO ZO ZAČIATKU a zvyšok zahodí. Takže:
#
#   "3.8"    → 3,8   dobre
#   "3.8 m"  → 3,8   dobre
#   "12'6\"" → 12    TICHO ZLE – z 3,8 m je 12 m
#   "50 mph" → 50    TICHO ZLE – z 80 km/h je 50
#   "none"   → null  (v poriadku, ale nerozlíši sa od chýbajúceho tagu)
#
# Nula chýb v hláškach, nula chýb v builde, len zle nakreslená mapa. Preto sa
# do dlaždice dáva TO, ČO JE V OSM – a mapa potom ukazuje presne to, čo je na
# tabuli, čo je pri obmedzení práve to, čo človek chce vidieť.
#
# A NIKDE INDE SA TO PREPOČÍTAVAŤ NEMUSÍ. Jediný, kto z tej hodnoty potrebuje
# ČÍSLO, je smerovanie („zmestí sa vozidlo?") – a to si ju parsuje samo
# (Valhalla má na `maxheight` a spol. vlastné čítanie tagov, viď
# `docs/navigation.md`). Druhý parser vedľa neho by bola druhá pravda
# o jednotkách, ktorú by nikto nevolal.
#
# `lanes` a `layer` sú `integer` – celé čísla bez jednotky, na ktorých sa ten
# omyl spraviť nedá.
#
# DVA ZOOMY A DVA BLOKY. Výška, šírka a hmotnosť sú vzácne a rozhodujú o tom,
# či tam vozidlo vôbec prejde – tie majú byť vidieť skôr (z12). Rýchlosť,
# jazdné pruhy a stúpanie sú takmer na každej ceste, takže by z nich na
# prehľadovom zoome bol len objem – tie idú od z14. Bloky sú preto DVA a majú
# sa navzájom VYLUČOVAŤ (`__not__`): jedna cesta smie vypadnúť len raz, inak by
# bola v dlaždici dvakrát a štítok by sa kreslil cez seba.
schema_name: FricoMaps obmedzenia na ceste
schema_description: >-
  Výška podjazdov a tunelov, šírka, hmotnosť, maximálna rýchlosť, jazdné pruhy
  a stúpanie – hodnoty z OSM, ktoré schéma OpenMapTiles neprenáša
attribution: <a href="https://www.openstreetmap.org/copyright">© OpenStreetMap prispievatelia</a>

sources:
  osm:
    type: osm
    local_path: data/roads.osm.pbf

tag_mappings:
  lanes: integer
  layer: integer

definitions:
  # Kotvy, aby sa ten istý zoznam atribútov nepísal v oboch blokoch dvakrát –
  # dve kópie sa vždy raz rozídu.
  - &limit_attrs
    - key: class
      value:
        tag_value: highway
    - key: ref
    - key: name
    # --- rozmery a hmotnosť (reťazce – viď hlavičku) ---
    - key: maxheight
    - key: maxheight_physical
      value:
        tag_value: "maxheight:physical"
    - key: maxwidth
    - key: maxweight
    # --- rýchlosť, pruhy, stúpanie ---
    - key: maxspeed
    - key: width
    - key: lanes
    - key: incline
    # --- kde to je ---
    # `tunnel` a `bridge` preto, že „výška 3,8 m" má iný význam v tuneli než
    # pod mostom. A POZOR: obmedzenie podjazdu je na ceste, ktorá ide POD
    # mostom, takže tá NEMÁ ani `bridge`, ani `tunnel` – práve preto sa tie dva
    # tagy do dlaždice dávajú, nech štýl nemusí hádať, čo drží nad hlavou.
    - key: tunnel
    - key: bridge
    - key: layer
    - key: osm_id
      value: '${ feature.id }'
      type: long
    - key: osm_type
      value: '${ feature.osm_type }'

  # Čo je „obmedzenie prejazdu" – rozmer alebo hmotnosť. Je to tu raz, lebo sa
  # na to pýtajú OBA bloky: prvý ho chce mať, druhý ho nesmie mať.
  - &blocking
    maxheight: __any__
    "maxheight:physical": __any__
    maxwidth: __any__
    "maxwidth:physical": __any__
    maxweight: __any__

layers:
  - id: road_limit
    features:
      # --- 1. rozmer alebo hmotnosť: od z12 ---
      # Toto je ten údaj, kvôli ktorému vrstva existuje. Je vzácny (na ceste
      # býva raz za desiatky kilometrov) a rozhoduje o tom, či tam vozidlo
      # prejde – takže sa platí zoomom navyše.
      - source: osm
        geometry: line
        min_zoom: 12
        include_when:
          __all__:
            - highway: __any__
            - __any__: *blocking
        attributes: *limit_attrs

      # --- 2. rýchlosť, pruhy, stúpanie: od z14 ---
      # `__not__` nad tým istým zoznamom drží bloky výlučné: cesta s výškou AJ
      # rýchlosťou vypadne len z prvého bloku (a rýchlosť si nesie s sebou,
      # atribúty sú tie isté).
      - source: osm
        geometry: line
        min_zoom: 14
        include_when:
          __all__:
            - highway: __any__
            - __any__:
                maxspeed: __any__
                width: __any__
                lanes: __any__
                incline: __any__
            - __not__:
                __any__: *blocking
        attributes: *limit_attrs

    # Cesta je v OSM rozsekaná na úseky (na každej križovatke), takže sa úseky
    # s rovnakými hodnotami zlepia. Pri obmedzeniach to je aj vecne správne:
    # `symbol-placement: line` kreslí štítok podľa dĺžky čiary, takže na
    # dvadsiatich krátkych úsekoch by bolo dvadsať štítkov.
    tile_post_process:
      merge_line_strings:
        min_length: 0

# ---------------------------------------------------------------------------
# TESTY. Púšťa ich `java -jar planetiler.jar verify workers/roads/roads.yml`
# a je to jediná vec, ktorá o tejto schéme povie pravdu bez celého behu.
# Prvé dva prípady sú tie, na ktorých sa dá pomýliť: podjazd (obmedzenie je na
# ceste POD mostom, tá nemá `bridge`) a výlučnosť blokov.
examples:
  - name: Podjazd pod mostom – výška je na ceste pod ním, od z12
    input:
      source: osm
      geometry: line
      tags:
        highway: secondary
        ref: II/584
        maxheight: "3.8"
    output:
      - layer: road_limit
        geometry: line
        min_zoom: 12
        tags:
          class: secondary
          ref: II/584
          maxheight: "3.8"
          bridge: null
          tunnel: null

  - name: Jednotka v hodnote sa NEPREPOČÍTAVA, ide do dlaždice ako je
    input:
      source: osm
      geometry: line
      tags:
        highway: tertiary
        maxheight: "3.8 m"
    output:
      - layer: road_limit
        geometry: line
        min_zoom: 12
        tags:
          maxheight: "3.8 m"

  - name: Stopy a palce prežijú celé – prepočet je vecou prehliadača
    input:
      source: osm
      geometry: line
      tags:
        highway: residential
        maxheight: 12'6"
    output:
      - layer: road_limit
        geometry: line
        min_zoom: 12
        tags:
          maxheight: 12'6"

  - name: Tunel s výškou – `tunnel` ide do dlaždice, nech štýl nehádá
    input:
      source: osm
      geometry: line
      tags:
        highway: primary
        tunnel: "yes"
        maxheight: "4.5"
        maxspeed: "70"
    output:
      - layer: road_limit
        geometry: line
        min_zoom: 12
        tags:
          class: primary
          tunnel: "yes"
          maxheight: "4.5"
          maxspeed: "70"

  - name: Len rýchlosť a pruhy – druhý blok, od z14
    input:
      source: osm
      geometry: line
      tags:
        highway: primary
        maxspeed: "90"
        lanes: "2"
    output:
      - layer: road_limit
        geometry: line
        min_zoom: 14
        tags:
          class: primary
          maxspeed: "90"
          lanes: 2

  - name: Výška AJ rýchlosť vypadne RAZ, nie dvakrát
    input:
      source: osm
      geometry: line
      tags:
        highway: unclassified
        maxweight: "3.5"
        maxspeed: "30"
    output:
      - layer: road_limit
        geometry: line
        min_zoom: 12
        tags:
          maxweight: "3.5"
          maxspeed: "30"

  - name: Cesta bez obmedzenia v tejto vrstve nie je
    input:
      source: osm
      geometry: line
      tags:
        highway: residential
        name: Kvetná
    output: []

  - name: Obmedzenie mimo cesty (rieka pod mostom) sem nepatrí
    input:
      source: osm
      geometry: line
      tags:
        waterway: river
        maxheight: "3.0"
    output: []
