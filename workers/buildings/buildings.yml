# planetiler custom schema – settlements: every building with area and name, and place names
schema_name: FricoMaps settlements
schema_description: >-
  Every OSM building with area (m²), name, kind, levels and address,
  and named places from city to isolated dwelling
attribution: <a href="https://www.openstreetmap.org/copyright">© OpenStreetMap contributors</a>

sources:
  osm:
    type: osm
    local_path: data/buildings-area.osm.pbf

# `area_m2` comes from `areas.py`
tag_mappings:
  area_m2: integer
  building:levels: integer
  population: integer

definitions:
  - &building_attrs
    - key: class
      value:
        tag_value: building
    - key: name
    - key: name_en
      value:
        tag_value: "name:en"
    - key: area
      value:
        tag_value: area_m2
    - key: levels
      value:
        tag_value: "building:levels"
    - key: height
    - key: min_height
    - key: housenumber
      value:
        tag_value: "addr:housenumber"
    - key: street
      value:
        tag_value: "addr:street"
    - key: amenity
    - key: shop
    - key: wikidata
    - key: osm_id
      value: '${ feature.id }'
      type: long
    - key: osm_type
      value: '${ feature.osm_type }'
  - &settlement_attrs
    - key: class
      type: match_value
    - key: name
    - key: name_en
      value:
        tag_value: "name:en"
    - key: area
      value:
        tag_value: area_m2
    - key: population
    - key: wikidata
    - key: osm_id
      value: '${ feature.id }'
      type: long
    - key: osm_type
      value: '${ feature.osm_type }'

layers:
  - id: building
    features:
      - source: osm
        geometry: polygon
        min_zoom: 13
        include_when:
          building: __any__
        exclude_when:
          building: ["no"]
        attributes: *building_attrs

  # a point on the building, so the name isn't drawn on every tile piece
  - id: building_name
    features:
      - source: osm
        geometry: polygon_point_on_surface
        min_zoom: 14
        include_when:
          __all__:
            - building: __any__
            - name: __any__
        exclude_when:
          building: ["no"]
        attributes: *building_attrs

  - id: settlement
    features:
      - source: osm
        geometry: point
        min_zoom: 6
        include_when:
          place: [city, town]
        attributes: *settlement_attrs
      - source: osm
        geometry: point
        min_zoom: 10
        include_when:
          place: [village, suburb, borough]
        attributes: *settlement_attrs
      - source: osm
        geometry: point
        min_zoom: 13
        include_when:
          place: [hamlet, quarter, neighbourhood, isolated_dwelling, farm, locality]
        attributes: *settlement_attrs
      - source: osm
        geometry: polygon_point_on_surface
        min_zoom: 10
        include_when:
          place: [city, town, village, suburb, borough, hamlet, quarter, neighbourhood,
                  isolated_dwelling, farm, locality]
        attributes: *settlement_attrs

examples:
  - name: A building carries area, name and address
    input:
      source: osm
      geometry: polygon
      tags:
        building: church
        name: Kostol sv. Martina
        area_m2: "812"
        building:levels: "2"
        addr:housenumber: "12"
    output:
      - layer: building
        geometry: polygon
        min_zoom: 13
        tags:
          class: church
          name: Kostol sv. Martina
          area: 812
          levels: 2
          housenumber: "12"
      - layer: building_name
        geometry: point
        min_zoom: 14
        tags:
          class: church
          name: Kostol sv. Martina
          area: 812
          levels: 2
          housenumber: "12"

  - name: A building's name comes in the app's languages
    input:
      source: osm
      geometry: polygon
      tags:
        building: castle
        name: Bratislavský hrad
        name:de: Burg Pressburg
        area_m2: "4800"
    output:
      - layer: building
        geometry: polygon
        min_zoom: 13
        tags:
          class: castle
          name: Bratislavský hrad
          name:de: Burg Pressburg
          area: 4800
      - layer: building_name
        geometry: point
        min_zoom: 14
        tags:
          class: castle
          name: Bratislavský hrad
          name:de: Burg Pressburg
          area: 4800

  - name: A building without a name is just an area
    input:
      source: osm
      geometry: polygon
      tags:
        building: "yes"
        area_m2: "96"
    output:
      - layer: building
        geometry: polygon
        min_zoom: 13
        tags:
          class: "yes"
          area: 96

  - name: building=no isn't a building
    input:
      source: osm
      geometry: polygon
      tags:
        building: "no"
    output: []

  - name: A town is from z6
    input:
      source: osm
      geometry: point
      tags:
        place: town
        name: Poprad
        population: "50000"
    output:
      - layer: settlement
        geometry: point
        min_zoom: 6
        tags:
          class: town
          name: Poprad
          population: 50000

  - name: A hamlet is from z13
    input:
      source: osm
      geometry: point
      tags:
        place: hamlet
        name: Lazy
    output:
      - layer: settlement
        geometry: point
        min_zoom: 13
        tags:
          class: hamlet
          name: Lazy

  - name: A residential zone isn't a building
    input:
      source: osm
      geometry: polygon
      tags:
        landuse: residential
    output: []
