# Planetiler custom schema – basic world map: water, state borders and download regions.
# Input from `workers/world/sources.py`. Regions unfold by tree level: continent z0,
# country z2, subregion z5; `build.sh` warns about `min_zoom` above maxzoom.
schema_name: FricoMaps world
schema_description: >-
  Basic world map – water from OSM coastlines, state borders
  and lakes from Natural Earth and the regions OSM is split into for download
attribution: >-
  <a href="https://www.openstreetmap.org/copyright">© OpenStreetMap
  contributors</a> (water, download regions: <a
  href="https://download.geofabrik.de/">Geofabrik</a>) /
  <a href="https://www.naturalearthdata.com/">Natural Earth</a>

sources:
  # OSM water areas, already in EPSG:4326
  water:
    type: geopackage
    local_path: data/world/water.gpkg
    projection: EPSG:4326
  lakes:
    type: geojson
    local_path: data/world/lakes.geojson
  boundaries:
    type: geojson
    local_path: data/world/boundaries.geojson
  countries:
    type: geojson
    local_path: data/world/countries.geojson
  downloads:
    type: geojson
    local_path: data/world/downloads.geojson

layers:
  # ==================== VODSTVO ====================
  # sea and lakes in one layer, `kind` tells them apart
  - id: water
    features:
      - source: water
        geometry: polygon
        min_zoom: 0
        attributes:
          - key: kind
            value: ocean
      # large lakes shape a continent (Baikal, the Great Lakes)
      - source: lakes
        geometry: polygon
        min_zoom: 2
        include_when:
          rank: major
        attributes: &lake_attributes
          - key: kind
          - key: name
      # small ones once there is room
      - source: lakes
        geometry: polygon
        min_zoom: 5
        include_when:
          rank: minor
        attributes: *lake_attributes

  # state borders
  - id: boundary
    features:
      - source: boundaries
        geometry: line
        min_zoom: 0
        include_when:
          kind: country
        attributes:
          - key: kind
      # disputed borders come two zooms later and are drawn dashed
      - source: boundaries
        geometry: line
        min_zoom: 2
        include_when:
          kind: disputed
        attributes:
          - key: kind

  # state labels, a centroid of the polygon
  - id: place
    features:
      - source: countries
        geometry: centroid
        min_zoom: 1
        include_when:
          rank: major
        attributes: &country_attributes
          - key: name
          - key: name_en
          - key: "name:ar"
          - key: "name:de"
          - key: "name:el"
          - key: "name:en"
          - key: "name:es"
          - key: "name:fr"
          - key: "name:hi"
          - key: "name:hu"
          - key: "name:it"
          - key: "name:ja"
          - key: "name:ko"
          - key: "name:nl"
          - key: "name:pl"
          - key: "name:pt"
          - key: "name:ru"
          - key: "name:sv"
          - key: "name:tr"
          - key: "name:uk"
          - key: "name:zh-Hans"
          - key: "name:zh-Hant"
          - key: iso
          - key: continent
          - key: rank
      - source: countries
        geometry: centroid
        min_zoom: 3
        include_when:
          rank: mid
        attributes: *country_attributes
      - source: countries
        geometry: centroid
        min_zoom: 4
        include_when:
          rank: minor
        attributes: *country_attributes

  # download regions; `pbf` is a link that really downloads
  - id: download
    features:
      - source: downloads
        geometry: polygon
        min_zoom: 0
        include_when:
          level: continent
        attributes: &download_attributes
          - key: id
          - key: name
          - key: parent
          - key: level
          - key: pbf
      - source: downloads
        geometry: polygon
        min_zoom: 2
        include_when:
          level: country
        attributes: *download_attributes
      - source: downloads
        geometry: polygon
        min_zoom: 5
        include_when:
          level: subregion
        attributes: *download_attributes

  # region labels, a layer of points
  - id: download_label
    features:
      - source: downloads
        geometry: centroid
        min_zoom: 2
        include_when:
          level: continent
        attributes: *download_attributes
      - source: downloads
        geometry: centroid
        min_zoom: 3
        include_when:
          level: country
        attributes: *download_attributes
      - source: downloads
        geometry: centroid
        min_zoom: 5
        include_when:
          level: subregion
        attributes: *download_attributes
