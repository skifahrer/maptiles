# Planetiler custom schema – krajinné prvky, ktoré OpenMapTiles nemá.
#
# Schéma OpenMapTiles sa pozerá len na tridsať kľúčov; `embankment`, líniový
# `barrier`, `power`, `cutline`, `piste:type`, `natural=cave_entrance` ani
# `man_made=tower` v nej nie sú vôbec. Nedá sa to zapnúť – musia sa vytiahnuť
# z toho istého PBF druhýkrát, vlastnou schémou.
#
# Ten istý vzor ako značené trasy a skaly: vlastný súbor, maxzoom aj podiel na
# rozpočte. Keď job nebeží, štýl vrstvu nepridá.
#
# Len línie a plochy – body sú vo `workers/features/points.yml` (rovnaký vstup
# aj predfilter, len druhý beh Planetileru).
#
# Predfilter je zámerne širší než tento súbor. Keď sem pribudne trieda, musí
# pribudnúť aj doň – stráži to `workers/lint/features.py`.
#
# Zoomy sú hlavné rozhodnutie: plotov je v OSM viac než všetkých ciest, tak idú
# od z15; vedenie vysokého napätia je orientačný bod na kilometre, tak od z11.
#
# Čo má vyšší `min_zoom`, než je maxzoom dlaždíc, Planetiler zahodí a nepovie
# nič – raz tak bola v mape nula plotov. Preto je `features_maxzoom`
# predvolene 15 a build rozdiel ohlási varovaním.
schema_name: FricoMaps krajinné prvky
schema_description: >-
  Násypy, zárezy, múry, ploty, elektrické vedenia, prieseky, stromoradia,
  parkoviská, zjazdovky a plánované cesty – línie a plochy z OSM, ktoré
  schéma OpenMapTiles neprenáša
attribution: <a href="https://www.openstreetmap.org/copyright">© OpenStreetMap prispievatelia</a>

sources:
  osm:
    type: osm
    local_path: data/features.osm.pbf

# napätie má byť číslo – štýl podľa neho vyberá hrúbku čiary. „22000;110000"
# sa nerozparsuje a atribút nebude; to je v poriadku.
tag_mappings:
  voltage: integer

layers:
  # LÍNIE. Jedna vrstva, `class` rozlišuje čo to je – zvlášť by z každej bola
  # vrstva o pár stovkách kB réžie.
  - id: feature_line
    features:
      # násyp: `man_made=embankment` je čiara na hrane, `embankment=yes`
      # vlastnosť cesty pod ňou. Kreslia sa rovnako, preto jedna trieda.
      - source: osm
        geometry: line
        min_zoom: 13
        include_when:
          man_made: embankment
          embankment: [yes, both, left, right]
        attributes:
          - key: name
          - key: class
            value: embankment
          - key: osm_id
            value: '${ feature.id }'
            type: long
          - key: osm_type
            value: '${ feature.osm_type }'
      # zárez (opak násypu – cesta vedie pod úrovňou terénu)
      - source: osm
        geometry: line
        min_zoom: 13
        include_when:
          cutting: [yes, both, left, right]
        attributes:
          - key: name
          - key: class
            value: cutting

      # múry: hradby a oporné múry sú výrazné a dlhé, preto o zoom skôr než plot
      - source: osm
        geometry: line
        min_zoom: 14
        include_when:
          barrier: [wall, city_wall, retaining_wall]
        attributes:
          - key: name
          - key: class
            value: wall
          # ktorý druh múru – štýl z toho vie spraviť hrubšiu hradbu
          - key: subclass
            type: match_value

      # ploty a živé ploty od z15: plotov je viac než ciest. Živý plot je
      # vlastná trieda, lebo sa kreslí ako vegetácia, nie ako prekážka.
      - source: osm
        geometry: line
        min_zoom: 15
        include_when:
          barrier: [fence, guard_rail, handrail]
        attributes:
          - key: class
            value: fence
          - key: subclass
            type: match_value
      - source: osm
        geometry: line
        min_zoom: 15
        include_when:
          barrier: hedge
        attributes:
          - key: class
            value: hedge
          - key: osm_id
            value: '${ feature.id }'
            type: long
          - key: osm_type
            value: '${ feature.osm_type }'

      # elektrické vedenie od z11: v otvorenej krajine orientačný bod
      # na kilometre
      - source: osm
        geometry: line
        min_zoom: 11
        include_when:
          power: line
        attributes:
          - key: class
            value: power_line
          - key: voltage
      - source: osm
        geometry: line
        min_zoom: 14
        include_when:
          power: minor_line
        attributes:
          - key: class
            value: power_minor
          - key: voltage

      # plánovaná cesta: `highway=proposed` je trasa, na ktorej sa ešte
      # nekope – v OpenMapTiles pre ňu neexistuje žiadna trieda (`*_construction`
      # je `highway=construction`, teda rozostavané). Od z11 ako rozostavané
      # cesty v štýle. Čo sa plánuje, hovorí `proposed=` alebo
      # `proposed:highway=`; berú sa oba cez `coalesce` – zdvojený kľúč
      # Planetiler nikde nedefinuje.
      - source: osm
        geometry: line
        min_zoom: 11
        include_when:
          highway: proposed
        attributes:
          - key: name
          - key: ref
          - key: class
            value: road_proposed
          - key: subclass
            value:
              coalesce:
                - tag_value: proposed
                - tag_value: "proposed:highway"
          - key: osm_id
            value: '${ feature.id }'
            type: long
          - key: osm_type
            value: '${ feature.osm_type }'

      # priesek: v lese výrazná rovná čiara, často hranica alebo trasa vedenia
      - source: osm
        geometry: line
        min_zoom: 13
        include_when:
          man_made: cutline
        attributes:
          - key: class
            value: cutline

      # nadzemné potrubie; podzemné by bola čiara cez krajinu, ktorú v teréne
      # nie je ako overiť
      - source: osm
        geometry: line
        min_zoom: 13
        include_when:
          man_made: pipeline
        exclude_when:
          location: [underground, underwater]
        attributes:
          - key: class
            value: pipeline

      # stromoradie
      - source: osm
        geometry: line
        min_zoom: 14
        include_when:
          natural: tree_row
        attributes:
          - key: class
            value: tree_row

      # hate, priehradné múry, plavebné komory: `waterway=dam` ako plocha
      # v OpenMapTiles je, ako čiara nie – a múr býva mapovaný práve čiarou
      - source: osm
        geometry: line
        min_zoom: 13
        include_when:
          waterway: [dam, weir, lock_gate]
        attributes:
          - key: name
          - key: class
            type: match_value
          - key: osm_id
            value: '${ feature.id }'
            type: long
          - key: osm_type
            value: '${ feature.osm_type }'

      # výmole a zrázy
      - source: osm
        geometry: line
        min_zoom: 14
        include_when:
          natural: [gully, earth_bank]
        attributes:
          - key: class
            type: match_value

    # prvok je v OSM rozsekaný na desiatky krátkych ciest; zlepenie je aj
    # menšie, aj krajšie – prerušovaná čiara sa na 20 m nestihne zopakovať
    tile_post_process:
      merge_line_strings:
        min_length: 0

  # PLOCHY
  - id: feature_area
    features:
      # parkovisko: `amenity=parking` je v OpenMapTiles len ako bod, hoci pri
      # východisku túry je to práve tá plocha, ktorú človek hľadá
      - source: osm
        geometry: polygon
        min_zoom: 14
        include_when:
          amenity: parking
        attributes:
          - key: name
          - key: class
            value: parking
          # kryté/podzemné parkovisko sa nemá kresliť ako plocha na povrchu
          - key: parking
      # skládka a halda
      - source: osm
        geometry: polygon
        min_zoom: 12
        include_when:
          landuse: landfill
        attributes:
          - key: name
          - key: class
            value: landfill
          - key: osm_id
            value: '${ feature.id }'
            type: long
          - key: osm_type
            value: '${ feature.osm_type }'
      - source: osm
        geometry: polygon
        min_zoom: 12
        include_when:
          man_made: spoil_heap
        attributes:
          - key: name
          - key: class
            value: spoil_heap
      # hospodársky dvor
      - source: osm
        geometry: polygon
        min_zoom: 13
        include_when:
          landuse: [farmyard, greenhouse_horticulture]
        attributes:
          - key: name
          - key: class
            type: match_value
      # opustený priemysel
      - source: osm
        geometry: polygon
        min_zoom: 12
        include_when:
          landuse: brownfield
        attributes:
          - key: class
            value: brownfield
      # kamenné pole: `scree` a `bare_rock` v OpenMapTiles sú, `shingle` nie
      - source: osm
        geometry: polygon
        min_zoom: 11
        include_when:
          natural: shingle
        attributes:
          - key: class
            value: shingle

  # body sú vo `workers/features/points.yml` kvôli balíku, ktorý appka ponúka
  # zvlášť od línií a plôch

  # ZJAZDOVKY A BEŽKY. Vleky a lanovky v dlaždiciach sú, trate nie –
  # `piste:type` OpenMapTiles nepozná, takže na lyžiarskej mape boli vleky bez
  # toho, k čomu vedú. Trať sa mapuje raz čiarou (os) a raz plochou (obrys);
  # obe sa púšťajú zámerne, takže uzavretá cesta dostane výplň aj obrys.
  - id: piste
    features:
      - source: osm
        geometry: polygon
        min_zoom: 11
        include_when:
          "piste:type": [downhill, nordic, skitour, sled, sleigh, snow_park, connection]
        attributes:
          - key: name
          - key: ref
          - key: class
            value:
              tag_value: "piste:type"
          # modrá/červená/čierna – prvé, čo lyžiar hľadá
          - key: difficulty
            value:
              tag_value: "piste:difficulty"
          - key: grooming
            value:
              tag_value: "piste:grooming"
      - source: osm
        geometry: line
        min_zoom: 11
        include_when:
          "piste:type": [downhill, nordic, skitour, sled, sleigh, snow_park, connection]
        attributes:
          - key: name
          - key: ref
          - key: class
            value:
              tag_value: "piste:type"
          - key: difficulty
            value:
              tag_value: "piste:difficulty"
          - key: grooming
            value:
              tag_value: "piste:grooming"
          - key: osm_id
            value: '${ feature.id }'
            type: long
          - key: osm_type
            value: '${ feature.osm_type }'
    tile_post_process:
      merge_line_strings:
        min_length: 0
