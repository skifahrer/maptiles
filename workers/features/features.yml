# Planetiler custom schema – landscape lines and areas OpenMapTiles lacks (points: `points.yml`).
# The prefilter is wider on purpose; `workers/lint/features.py` guards new classes.
# Planetiler silently drops `min_zoom` above maxzoom, so `features_maxzoom` defaults to 15.
schema_name: FricoMaps landscape features
schema_description: >-
  Embankments, cuttings, walls, fences, power lines, cutlines, tree rows,
  car parks, ski pistes and proposed roads – OSM lines and areas the
  OpenMapTiles schema doesn't carry
attribution: <a href="https://www.openstreetmap.org/copyright">© OpenStreetMap contributors</a>

sources:
  osm:
    type: osm
    local_path: data/features.osm.pbf

# voltage must be a number – the style picks line width by it; "22000;110000" just drops out
tag_mappings:
  voltage: integer

layers:
  # LINES in one layer, `class` tells them apart – a layer each would cost overhead
  - id: feature_line
    features:
      # `man_made=embankment` is a line on the edge, `embankment=yes` a property of the way: one class
      - source: osm
        geometry: line
        min_zoom: 13
        include_when:
          man_made: embankment
          embankment: [yes, both, left, right]
        attributes:
          - key: name
          - key: class
            value: embankment
          - key: osm_id
            value: '${ feature.id }'
            type: long
          - key: osm_type
            value: '${ feature.osm_type }'
      # cutting (the way runs below the terrain)
      - source: osm
        geometry: line
        min_zoom: 13
        include_when:
          cutting: [yes, both, left, right]
        attributes:
          - key: name
          - key: class
            value: cutting

      # walls: city and retaining walls are long and prominent, a zoom before fences
      - source: osm
        geometry: line
        min_zoom: 14
        include_when:
          barrier: [wall, city_wall, retaining_wall]
        attributes:
          - key: name
          - key: class
            value: wall
          # which kind of wall – the style can draw a thicker city wall
          - key: subclass
            type: match_value

      # fences and hedges from z15: there are more fences than roads; a hedge draws as vegetation
      - source: osm
        geometry: line
        min_zoom: 15
        include_when:
          barrier: [fence, guard_rail, handrail]
        attributes:
          - key: class
            value: fence
          - key: subclass
            type: match_value
      - source: osm
        geometry: line
        min_zoom: 15
        include_when:
          barrier: hedge
        attributes:
          - key: class
            value: hedge
          - key: osm_id
            value: '${ feature.id }'
            type: long
          - key: osm_type
            value: '${ feature.osm_type }'

      # power lines from z11: a landmark in open country
      - source: osm
        geometry: line
        min_zoom: 11
        include_when:
          power: line
        attributes:
          - key: class
            value: power_line
          - key: voltage
      - source: osm
        geometry: line
        min_zoom: 14
        include_when:
          power: minor_line
        attributes:
          - key: class
            value: power_minor
          - key: voltage

      # `highway=proposed` has no OpenMapTiles class; `proposed=` or `proposed:highway=` via `coalesce`
      - source: osm
        geometry: line
        min_zoom: 11
        include_when:
          highway: proposed
        attributes:
          - key: name
          - key: ref
          - key: class
            value: road_proposed
          - key: subclass
            value:
              coalesce:
                - tag_value: proposed
                - tag_value: "proposed:highway"
          - key: osm_id
            value: '${ feature.id }'
            type: long
          - key: osm_type
            value: '${ feature.osm_type }'

      # aerialways out of service – OpenMapTiles draws those in service (`aerialway`)
      - source: osm
        geometry: line
        min_zoom: 11
        include_when:
          aerialway: [construction, proposed, disused, abandoned]
          "construction:aerialway": __any__
          "proposed:aerialway": __any__
          "disused:aerialway": __any__
          "abandoned:aerialway": __any__
          "razed:aerialway": __any__
        exclude_when:
          aerialway: [cable_car, gondola, mixed_lift, chair_lift, drag_lift,
                      t-bar, j-bar, platter, rope_tow, magic_carpet, zip_line,
                      goods, station, pylon]
        attributes:
          - key: name
          - key: class
            value:
              - if: {aerialway: construction, "construction:aerialway": __any__}
                value: aerialway_construction
              - if: {aerialway: proposed, "proposed:aerialway": __any__}
                value: aerialway_proposed
              - else: aerialway_disused
          - key: subclass
            value:
              coalesce:
                - tag_value: "construction:aerialway"
                - tag_value: "proposed:aerialway"
                - tag_value: "disused:aerialway"
                - tag_value: "abandoned:aerialway"
                - tag_value: "razed:aerialway"
                - tag_value: construction
                - tag_value: proposed
                - tag_value: disused
                - tag_value: abandoned
          - key: osm_id
            value: '${ feature.id }'
            type: long
          - key: osm_type
            value: '${ feature.osm_type }'

      # a forest cutline: a straight line, often a border or a power line route
      - source: osm
        geometry: line
        min_zoom: 13
        include_when:
          man_made: cutline
        attributes:
          - key: class
            value: cutline

      # pipelines above ground; one underground can't be checked in the field
      - source: osm
        geometry: line
        min_zoom: 13
        include_when:
          man_made: pipeline
        exclude_when:
          location: [underground, underwater]
        attributes:
          - key: class
            value: pipeline

      # stromoradie
      - source: osm
        geometry: line
        min_zoom: 14
        include_when:
          natural: tree_row
        attributes:
          - key: class
            value: tree_row

      # dams, weirs and locks as lines – OpenMapTiles has `waterway=dam` only as an area
      - source: osm
        geometry: line
        min_zoom: 13
        include_when:
          waterway: [dam, weir, lock_gate]
        attributes:
          - key: name
          - key: class
            type: match_value
          - key: osm_id
            value: '${ feature.id }'
            type: long
          - key: osm_type
            value: '${ feature.osm_type }'

      # gullies and banks
      - source: osm
        geometry: line
        min_zoom: 14
        include_when:
          natural: [gully, earth_bank]
        attributes:
          - key: class
            type: match_value

    # OSM splits a feature into dozens of short ways; merged it is smaller and dashes repeat
    tile_post_process:
      merge_line_strings:
        min_length: 0

  # PLOCHY
  - id: feature_area
    features:
      # `amenity=parking` is only a point in OpenMapTiles, yet at a trailhead it's the area one looks for
      - source: osm
        geometry: polygon
        min_zoom: 14
        include_when:
          amenity: parking
        attributes:
          - key: name
          - key: class
            value: parking
          # a covered or underground car park isn't a surface area
          - key: parking
      # landfill and spoil heap
      - source: osm
        geometry: polygon
        min_zoom: 12
        include_when:
          landuse: landfill
        attributes:
          - key: name
          - key: class
            value: landfill
          - key: osm_id
            value: '${ feature.id }'
            type: long
          - key: osm_type
            value: '${ feature.osm_type }'
      - source: osm
        geometry: polygon
        min_zoom: 12
        include_when:
          man_made: spoil_heap
        attributes:
          - key: name
          - key: class
            value: spoil_heap
      # farmyard
      - source: osm
        geometry: polygon
        min_zoom: 13
        include_when:
          landuse: [farmyard, greenhouse_horticulture]
        attributes:
          - key: name
          - key: class
            type: match_value
      # brownfield
      - source: osm
        geometry: polygon
        min_zoom: 12
        include_when:
          landuse: brownfield
        attributes:
          - key: class
            value: brownfield
      # shingle: `scree` and `bare_rock` are in OpenMapTiles, `shingle` isn't
      - source: osm
        geometry: polygon
        min_zoom: 11
        include_when:
          natural: shingle
        attributes:
          - key: class
            value: shingle

  # points are in `workers/features/points.yml`, a separate package in the app

  # SKI PISTES: OpenMapTiles has lifts but not `piste:type`; a line and an area are both kept
  - id: piste
    features:
      - source: osm
        geometry: polygon
        min_zoom: 11
        include_when:
          "piste:type": [downhill, nordic, skitour, sled, sleigh, snow_park, connection]
        attributes:
          - key: name
          - key: ref
          - key: class
            value:
              tag_value: "piste:type"
          # blue/red/black – the first thing a skier looks for
          - key: difficulty
            value:
              tag_value: "piste:difficulty"
          - key: grooming
            value:
              tag_value: "piste:grooming"
      - source: osm
        geometry: line
        min_zoom: 11
        include_when:
          "piste:type": [downhill, nordic, skitour, sled, sleigh, snow_park, connection]
        attributes:
          - key: name
          - key: ref
          - key: class
            value:
              tag_value: "piste:type"
          - key: difficulty
            value:
              tag_value: "piste:difficulty"
          - key: grooming
            value:
              tag_value: "piste:grooming"
          - key: osm_id
            value: '${ feature.id }'
            type: long
          - key: osm_type
            value: '${ feature.osm_type }'
    tile_post_process:
      merge_line_strings:
        min_length: 0
