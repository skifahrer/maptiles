# Planetiler custom schema – landscape points from OSM, own archive for its own package.
# Same input and prefilter as `features.yml`; `centroid` since a spring is a node, a heap an area.
schema_name: FricoMaps landscape points
schema_description: >-
  Springs, caves, waterfalls, lookout towers, huts, monuments, mining heritage
  and survey points – OSM point features the OpenMapTiles schema doesn't carry
attribution: <a href="https://www.openstreetmap.org/copyright">© OpenStreetMap contributors</a>

sources:
  osm:
    type: osm
    local_path: data/features.osm.pbf

# elevation must be a number in the tile; one that doesn't parse drops out
tag_mappings:
  ele: double

layers:
  - id: feature_point
    features:
      # water in the terrain: OpenMapTiles takes a spring only as an area, so node springs are missing
      - source: osm
        geometry: centroid
        min_zoom: 12
        include_when:
          natural: spring
        attributes:
          - key: name
          - key: ele
          - key: class
            value: spring
          - key: osm_id
            value: '${ feature.id }'
            type: long
          - key: osm_type
            value: '${ feature.osm_type }'
      - source: osm
        geometry: centroid
        min_zoom: 11
        include_when:
          waterway: waterfall
        attributes:
          - key: name
          - key: ele
          - key: class
            value: waterfall

      # --- kras ---
      - source: osm
        geometry: centroid
        min_zoom: 12
        include_when:
          natural: cave_entrance
        attributes:
          - key: name
          - key: ele
          - key: class
            value: cave_entrance
      - source: osm
        geometry: centroid
        min_zoom: 14
        include_when:
          natural: sinkhole
        attributes:
          - key: name
          - key: class
            value: sinkhole

      # towers and masts: OpenMapTiles knows `man_made=tower` only with `tourism=viewpoint`
      - source: osm
        geometry: centroid
        min_zoom: 11
        include_when:
          man_made: tower
        attributes:
          - key: name
          - key: ele
          - key: class
            value: tower
          - key: osm_id
            value: '${ feature.id }'
            type: long
          - key: osm_type
            value: '${ feature.osm_type }'
          # `observation` = lookout tower; the style draws it unlike a transmitter
          - key: subclass
            value:
              tag_value: "tower:type"
      - source: osm
        geometry: centroid
        min_zoom: 13
        include_when:
          man_made: [mast, water_tower, chimney]
        attributes:
          - key: name
          - key: class
            type: match_value

      # monuments OpenMapTiles leaves out: it takes only `monument`, `castle` and `ruins`
      - source: osm
        geometry: centroid
        min_zoom: 12
        include_when:
          historic: [archaeological_site, battlefield, fort, manor, tomb]
        attributes:
          - key: name
          - key: class
            type: match_value
      - source: osm
        geometry: centroid
        min_zoom: 14
        include_when:
          historic: [wayside_cross, wayside_shrine, memorial]
        attributes:
          - key: name
          - key: class
            type: match_value
      - source: osm
        geometry: centroid
        min_zoom: 15
        include_when:
          historic: [boundary_stone, milestone, charcoal_pile]
        attributes:
          - key: name
          - key: class
            type: match_value

      # mining heritage
      - source: osm
        geometry: centroid
        min_zoom: 12
        include_when:
          historic: [mine, mine_shaft, mineshaft, adit]
          man_made: [adit, mineshaft]
        attributes:
          - key: name
          - key: class
            type: match_value
          - key: osm_id
            value: '${ feature.id }'
            type: long
          - key: osm_type
            value: '${ feature.osm_type }'

      # hut: `wilderness_hut` isn't in OpenMapTiles, yet it's the hut a route is planned around
      - source: osm
        geometry: centroid
        min_zoom: 11
        include_when:
          tourism: wilderness_hut
        attributes:
          - key: name
          - key: ele
          - key: class
            value: wilderness_hut

      # mountain pass
      - source: osm
        geometry: centroid
        min_zoom: 11
        include_when:
          mountain_pass: yes
        attributes:
          - key: name
          - key: ele
          - key: class
            value: mountain_pass

      # emergency point: the number reported to mountain rescue
      - source: osm
        geometry: centroid
        min_zoom: 14
        include_when:
          highway: emergency_access_point
        attributes:
          - key: name
          - key: ref
          - key: class
            value: emergency_access_point

      # survey point
      - source: osm
        geometry: centroid
        min_zoom: 15
        include_when:
          man_made: survey_point
        attributes:
          - key: name
          - key: ele
          - key: class
            value: survey_point
          - key: osm_id
            value: '${ feature.id }'
            type: long
          - key: osm_type
            value: '${ feature.osm_type }'
