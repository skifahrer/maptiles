# Planetiler custom schema – area borders and their names in one `.pmtiles`.
# OpenMapTiles `boundary` is a nameless line; here areas carry name and `admin_level`:
# `boundary` (area: "what is under this point"), `boundary_line` (the same border drawn),
# `place` (settlement point with name and population). `admin_level` stays OSM's number.
# Zooms: state z2, region z4, district z6, municipality z8; the prefilter keeps relation members.
schema_name: FricoMaps area borders
schema_description: >-
  State, region, district and municipality borders as areas and lines, with
  the area's name and level, plus the settlement points the names are drawn from
attribution: <a href="https://www.openstreetmap.org/copyright">© OpenStreetMap contributors</a>

sources:
  osm:
    type: osm
    local_path: data/boundaries.osm.pbf

# `admin_level` is a string in OSM but an order, so a number; `population` too
tag_mappings:
  admin_level: integer
  population: long

definitions:
  # area attributes written ONCE – area and line carry the same
  - &area_attrs
    - key: name
    - key: name_en
      value:
        tag_value: "name:en"
    - key: admin_level
    - key: ref
    # `wikidata` links to anything else (our Wikipedia package too)
    - key: wikidata
    - key: wikipedia
    - key: osm_id
      value: '${ feature.id }'
      type: long
    - key: osm_type
      value: '${ feature.osm_type }'

layers:
  # 1. the area as a polygon – "which district is this point in"
  - id: boundary
    features:
      # state: from z2
      - source: osm
        geometry: polygon
        min_zoom: 2
        include_when:
          __all__:
            - boundary: administrative
            - admin_level: ["2"]
        attributes: *area_attrs

      # region (and whatever is level 3 and 4 in a state): from z4
      - source: osm
        geometry: polygon
        min_zoom: 4
        include_when:
          __all__:
            - boundary: administrative
            - admin_level: ["3", "4"]
        attributes: *area_attrs

      # --- okres: od z6 ---
      - source: osm
        geometry: polygon
        min_zoom: 6
        include_when:
          __all__:
            - boundary: administrative
            - admin_level: ["5", "6", "7"]
        attributes: *area_attrs

      # municipality: from z8 – the densest level
      - source: osm
        geometry: polygon
        min_zoom: 8
        include_when:
          __all__:
            - boundary: administrative
            - admin_level: ["8"]
        attributes: *area_attrs

  # 2. the same border as a line – the polygon fill would cover the map, so this is drawn
  - id: boundary_line
    features:
      - source: osm
        geometry: line
        min_zoom: 2
        include_when:
          __all__:
            - boundary: administrative
            - admin_level: ["2"]
        attributes: *area_attrs
      - source: osm
        geometry: line
        min_zoom: 4
        include_when:
          __all__:
            - boundary: administrative
            - admin_level: ["3", "4"]
        attributes: *area_attrs
      - source: osm
        geometry: line
        min_zoom: 6
        include_when:
          __all__:
            - boundary: administrative
            - admin_level: ["5", "6", "7"]
        attributes: *area_attrs
      - source: osm
        geometry: line
        min_zoom: 8
        include_when:
          __all__:
            - boundary: administrative
            - admin_level: ["8"]
        attributes: *area_attrs

    # segments with equal values merge, or one border gets twenty labels
    tile_post_process:
      merge_line_strings:
        min_length: 0

  # 3. where the name is drawn – the settlement point, better than a polygon centroid
  - id: place
    features:
      - source: osm
        geometry: point
        min_zoom: 2
        include_when:
          place: [country, state, region, province]
        attributes: &place_attrs
          - key: class
            type: match_value
          - key: name
          - key: name_en
            value:
              tag_value: "name:en"
          - key: population
          - key: capital
          - key: wikidata
          - key: osm_id
            value: '${ feature.id }'
            type: long
          - key: osm_type
            value: '${ feature.osm_type }'

      - source: osm
        geometry: point
        min_zoom: 5
        include_when:
          place: [county, district, municipality]
        attributes: *place_attrs

      - source: osm
        geometry: point
        min_zoom: 6
        include_when:
          place: [city, town]
        attributes: *place_attrs

      # villages and hamlets are most numerous, so from z10
      - source: osm
        geometry: point
        min_zoom: 10
        include_when:
          place: [village, hamlet, isolated_dwelling, suburb, quarter,
                  neighbourhood, borough]
        attributes: *place_attrs

# TESTS: `java -jar planetiler.jar verify workers/boundaries/boundaries.yml`
examples:
  - name: A state border is an area and a line, from z2, with a name
    input:
      source: osm
      geometry: polygon
      tags:
        boundary: administrative
        admin_level: "2"
        name: Slovensko
        "name:en": Slovakia
    output:
      - layer: boundary
        geometry: polygon
        min_zoom: 2
        tags:
          name: Slovensko
          name_en: Slovakia
          admin_level: 2
      - layer: boundary_line
        geometry: line
        min_zoom: 2
        tags:
          name: Slovensko
          admin_level: 2

  - name: A region is from z4
    input:
      source: osm
      geometry: polygon
      tags:
        boundary: administrative
        admin_level: "4"
        name: Prešovský kraj
    output:
      - layer: boundary
        geometry: polygon
        min_zoom: 4
        tags:
          name: Prešovský kraj
          admin_level: 4
      - layer: boundary_line
        geometry: line
        min_zoom: 4
        tags:
          name: Prešovský kraj
          admin_level: 4

  - name: A municipality is from z8 and carries the name the map border lacks
    input:
      source: osm
      geometry: polygon
      tags:
        boundary: administrative
        admin_level: "8"
        name: Ždiar
    output:
      - layer: boundary
        geometry: polygon
        min_zoom: 8
        tags:
          name: Ždiar
          admin_level: 8
      - layer: boundary_line
        geometry: line
        min_zoom: 8
        tags:
          name: Ždiar
          admin_level: 8

  - name: A city part (level 10) doesn't belong – it isn't a municipality
    input:
      source: osm
      geometry: polygon
      tags:
        boundary: administrative
        admin_level: "10"
        name: Staré Mesto
    output: []

  - name: A protected area is a border, but not an administrative one
    input:
      source: osm
      geometry: polygon
      tags:
        boundary: protected_area
        name: TANAP
    output: []

  - name: A municipality point says where the name is drawn
    input:
      source: osm
      geometry: point
      tags:
        place: village
        name: Ždiar
        population: "1300"
    output:
      - layer: place
        geometry: point
        min_zoom: 10
        tags:
          class: village
          name: Ždiar
          population: 1300

  - name: A regional capital is from z6
    input:
      source: osm
      geometry: point
      tags:
        place: city
        name: Prešov
        population: "84000"
    output:
      - layer: place
        geometry: point
        min_zoom: 6
        tags:
          class: city
          name: Prešov
          population: 84000
