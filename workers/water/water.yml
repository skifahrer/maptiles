# Planetiler custom schema – water from OSM in one `.pmtiles`, each feature with its name.
# No ocean area: it needs the whole planet's coastline, so `natural=coastline` goes as a line.
# Zooms: sea, big rivers and lakes z4; rivers z8; streams z11; ditches z13.
schema_name: FricoMaps water
schema_description: >-
  Rivers, streams, canals, lakes, reservoirs, ponds, bays and the coastline
  from OSM, each feature with its name
attribution: <a href="https://www.openstreetmap.org/copyright">© OpenStreetMap contributors</a>

sources:
  osm:
    type: osm
    local_path: data/water.osm.pbf

# `layer` is an integer, `width` metres – comparable only as numbers
tag_mappings:
  layer: integer

definitions:
  # attributes written ONCE for every block
  - &water_attrs
    # WHAT IT IS, from what the block matched: `class` the tag value, `family` the tag key
    - key: class
      type: match_value
    - key: family
      type: match_key
    # WHAT IT'S CALLED – the name sits on the geometry itself
    - key: name
    - key: name_en
      value:
        tag_value: "name:en"
    # WHAT WATER: `water` tells lake from reservoir, `intermittent` seasonal, `salt` salty
    - key: water
    - key: intermittent
    - key: salt
    - key: tidal
    # WHERE AND HOW: `tunnel`, `layer`, `width` and `boat` – which river a boat can use
    - key: tunnel
    - key: layer
    - key: width
    - key: boat
    - key: wikidata
    - key: osm_id
      value: '${ feature.id }'
      type: long
    - key: osm_type
      value: '${ feature.osm_type }'

layers:
  # 1. running water
  - id: waterway
    features:
      # big rivers: from z4 – the skeleton of the water network
      - source: osm
        geometry: line
        min_zoom: 4
        include_when:
          waterway: [river]
        attributes: *water_attrs

      # streams and canals: from z11
      - source: osm
        geometry: line
        min_zoom: 11
        include_when:
          waterway: [stream, canal, flowline]
        attributes: *water_attrs

      # ditches and drains: from z13 – densest of all, a grid at z11
      - source: osm
        geometry: line
        min_zoom: 13
        include_when:
          waterway: [ditch, drain]
        attributes: *water_attrs

  # 2. standing water and sea
  - id: water
    features:
      # water areas: from z8 – lake, reservoir, pond, river area; `water` says which
      - source: osm
        geometry: polygon
        min_zoom: 8
        include_when:
          natural: [water]
        attributes: *water_attrs

      # reservoirs mapped as land use: from z8 – the same thing, tagged the other way
      - source: osm
        geometry: polygon
        min_zoom: 8
        include_when:
          landuse: [reservoir, basin]
        attributes: *water_attrs

      # bay and strait: from z4 – named parts of the sea
      - source: osm
        geometry: polygon
        min_zoom: 4
        include_when:
          natural: [bay, strait]
        attributes: *water_attrs

      # coastline: from z4, as a LINE
      - source: osm
        geometry: line
        min_zoom: 4
        include_when:
          natural: [coastline]
        attributes: *water_attrs

    # river segments with equal values merge, or twenty labels name one river
    tile_post_process:
      merge_line_strings:
        min_length: 0

  # 3. springs – also in the `points` package; the same object, the same `osm_id`
  - id: water_point
    features:
      - source: osm
        geometry: point
        min_zoom: 12
        include_when:
          natural: [spring]
        attributes: *water_attrs

# TESTS: `java -jar planetiler.jar verify workers/water/water.yml`
examples:
  - name: A river is from z4 and carries its name
    input:
      source: osm
      geometry: line
      tags:
        waterway: river
        name: Váh
    output:
      - layer: waterway
        geometry: line
        min_zoom: 4
        tags:
          class: river
          family: waterway
          name: Váh

  - name: A stream is from z11
    input:
      source: osm
      geometry: line
      tags:
        waterway: stream
        intermittent: "yes"
    output:
      - layer: waterway
        geometry: line
        min_zoom: 11
        tags:
          class: stream
          family: waterway
          intermittent: "yes"

  - name: A ditch has its own zoom (z13) – otherwise a grid
    input:
      source: osm
      geometry: line
      tags:
        waterway: ditch
    output:
      - layer: waterway
        geometry: line
        min_zoom: 13
        tags:
          class: ditch
          family: waterway

  - name: A reservoir is an area and says so
    input:
      source: osm
      geometry: polygon
      tags:
        natural: water
        water: reservoir
        name: Domaša
    output:
      - layer: water
        geometry: polygon
        min_zoom: 8
        tags:
          class: water
          family: natural
          water: reservoir
          name: Domaša

  - name: A reservoir mapped as land use is the same thing
    input:
      source: osm
      geometry: polygon
      tags:
        landuse: reservoir
        name: Zemplínska šírava
    output:
      - layer: water
        geometry: polygon
        min_zoom: 8
        tags:
          class: reservoir
          family: landuse
          name: Zemplínska šírava

  - name: The coastline goes as a LINE – a cutout can't make the sea area
    input:
      source: osm
      geometry: line
      tags:
        natural: coastline
    output:
      - layer: water
        geometry: line
        min_zoom: 4
        tags:
          class: coastline
          family: natural

  - name: A spring is a point and is in water too, not only in points
    input:
      source: osm
      geometry: point
      tags:
        natural: spring
        name: Zbojnícka studňa
    output:
      - layer: water_point
        geometry: point
        min_zoom: 12
        tags:
          class: spring
          family: natural
          name: Zbojnícka studňa

  - name: A swimming pool isn't water
    input:
      source: osm
      geometry: polygon
      tags:
        leisure: swimming_pool
    output: []

  - name: A road by the river doesn't belong to water
    input:
      source: osm
      geometry: line
      tags:
        highway: track
        name: Pri Váhu
    output: []
